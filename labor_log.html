                 es: '“Marcado hoy” viene de Connecteam (cada hora); “Sin registrar” es tiempo marcado sin registro todavía.' }
  };
  const fill = (s, vars) => Object.entries(vars).reduce((a, [k, v]) => a.split(`{${k}}`).join(v), s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (id) => document.getElementById(id);
  const localDay = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const normUid = (u) => String(u || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const fold = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const tail = (uid) => uid.length > 8 ? '…' + uid.slice(-4) : uid;
  const fmtH = (h) => fmtNum(h, Math.abs(h - Math.round(h)) < 1e-9 ? 0 : 2);

  document.title = `${t(L.title)} — 2CW`;
  $('title').textContent = t(L.title);
  $('brand').textContent = t(L.title);
  $('back').textContent = t(L.back);
  $('sub').textContent = t(L.sub);
  [['l-process', 'process'], ['l-date', 'date'], ['l-start', 'start'], ['l-end', 'end'], ['l-hours', 'hours'],
   ['h-hours', 'hHours'], ['l-people', 'people'], ['h-people', 'hPeople'], ['l-uids', 'uids'], ['h-uids', 'hUids'],
   ['l-notes', 'notes'], ['save', 'save']].forEach(([id, k]) => { $(id).textContent = t(L[k]); });
  $('people-q').placeholder = t(L.peopleQ);
  $('uid-q').placeholder = t(L.uidQ);
  $('f-q').placeholder = t(L.search);

  // ── Processes: every station except the paperwork-only ones ─────────────
  const PROCESSES = OPERATIONS_STATIONS.filter((s) => s.key !== 'biomass_request');
  const procTitle = (k) => t(processTitle(k));
  function processOptions(withAll) {
    const groups = [];
    PROCESSES.forEach((s) => {
      const g = t(s.dept);
      let grp = groups.find((x) => x.label === g);
      if (!grp) groups.push(grp = { label: g, items: [] });
      grp.items.push(s);
    });
    return (withAll ? `<option value="">${esc(t(L.allProc))}</option>` : `<option value=""></option>`) +
      groups.map((g) => `<optgroup label="${esc(g.label)}">${g.items.map((s) =>
        `<option value="${s.key}">${esc(t(s.title))}</option>`).join('')}</optgroup>`).join('') +
      Object.keys(LABOR_PROCESSES).map((k) => `<option value="${k}">${esc(t(LABOR_PROCESSES[k]))}</option>`).join('');
  }
  $('process').innerHTML = processOptions(false);
  $('f-process').innerHTML = processOptions(true);
  const params = new URLSearchParams(location.search);
  let savedProc = '';
  try { savedProc = localStorage.getItem(PROCESS_KEY) || ''; } catch {}
  $('process').value = params.get('process') || savedProc;
  $('date').value = localDay();

  // ── Tabs ────────────────────────────────────────────────────────────────
  const TABS = [['log', L.tabLog], ['list', L.tabList], ['timeline', L.tabTl]];
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" data-tab="${k}">${esc(t(l))}</button>`).join('');
  function showTab(k) {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === k));
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === 'view-' + k));
    if (k === 'list') loadEntries();
    if (k === 'timeline') loadTimeline();
  }
  $('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); };

  // ── Connecteam roster + who's clocked in ────────────────────────────────
  let roster = [];            // [{userId, name}]
  let clockedIn = new Set();  // userIds
  let clockedToday = {};      // userId -> hours today
  async function getJson(file) {
    try {
      const res = await fetch(DATA_BASE + file + '?t=' + Date.now());
      if (!res.ok) throw new Error(res.status);
      return await res.json();
    } catch { return null; }
  }
  const rosterReady = Promise.all([getJson('connecteam_roster.json'), getJson('connecteam_hours.json')]).then(([r, h]) => {
    const byId = new Map();
    if (r && Array.isArray(r.people)) r.people.forEach((p) => byId.set(String(p.userId), { userId: String(p.userId), name: p.name }));
    if (h) {
      // Until the roster file exists, everyone with hours this week stands in.
      if (!byId.size) [...(h.week || []), ...(h.today || []), ...(h.clocked_in || [])]
        .forEach((p) => byId.set(String(p.userId), { userId: String(p.userId), name: p.name }));
      (h.clocked_in || []).forEach((p) => clockedIn.add(String(p.userId)));
      (h.today || []).forEach((p) => { clockedToday[String(p.userId)] = p.hoursToday; });
    }
    roster = [...byId.values()].sort((a, b) => a.name.localeCompare(b.name));
    if (!roster.length) $('h-people').textContent = t(L.noRoster);
    renderQuick();
  });

  // ── UIDs: everything that's been through a station lately ───────────────
  // Read straight off operations_forms. Each UID remembers the station it was
  // last seen at, so the list can put the ones waiting on (or being worked at)
  // the chosen process first. `role: 'in'` marks a UID a station consumed and
  // retagged (Take Down's farm UID → new on-stem UID), so it isn't suggested
  // for the stage after.
  const UID_FIELDS = {
    dry_check: [['incomingUid', 'in'], ['sourceUid', 'out']]
  };
  const DEFAULT_UID_FIELDS = [['sourceUid', 'out'], ['batchTag', 'out'], ['newBuckedUid', 'out'], ['newBigLeafUid', 'out']];
  // Which stations' UIDs are up next at each process.
  const FEEDS = {
    cult_batch_log: ['cult_batch_log'], cult_ipm_feed: ['cult_batch_log', 'cult_ipm_feed'],
    cult_preharvest: ['cult_batch_log', 'cult_ipm_feed', 'cult_preharvest'],
    harvest: ['cult_preharvest', 'cult_batch_log', 'harvest'],
    intake_wet: ['harvest', 'intake_wet'], dry_check: ['intake_wet', 'dry_check'],
    buck: ['dry_check', 'buck'], machine_trim: ['buck', 'machine_trim'],
    hand_trim: ['buck', 'machine_trim', 'hand_trim'], fresh_frozen: ['harvest', 'fresh_frozen'],
    preroll_production: ['machine_trim', 'hand_trim', 'preroll_production'],
    mfg_output: ['machine_trim', 'hand_trim', 'mfg_output']
  };
  const RECENT_DAYS = 3;   // a UID last seen at this very process counts as "at this stage" for this long
  const LOOKBACK_DAYS = 60;
  const uidIndex = new Map(); // uid -> {uid, strain, station, status, date, role}
  function noteUid(raw, strain, row, role) {
    const uid = normUid(raw);
    if (uid.length < 4) return;
    const seen = { uid, strain: strain || '', station: row.station_key, status: row.status, date: row.work_date, at: row.updated_at || '', role };
    const prev = uidIndex.get(uid);
    if (!prev || (seen.date + seen.at) > (prev.date + prev.at)) uidIndex.set(uid, { ...seen, strain: seen.strain || (prev && prev.strain) || '' });
  }
  const uidsReady = (async () => {
    const client = getClient();
    if (!client) return;
    const since = new Date(); since.setDate(since.getDate() - LOOKBACK_DAYS);
    const PAGE = 1000;
    for (let page = 0; page < 6; page++) {
      const { data, error } = await client.from('operations_forms')
        .select('station_key,status,work_date,strain,fields,updated_at')
        .gte('work_date', localDay(since))
        .not('station_key', 'in', '(buck_submission,buck_box,buck_batch_close,labor_entry)')
        .order('work_date', { ascending: false }).order('updated_at', { ascending: false })
        .range(page * PAGE, page * PAGE + PAGE - 1);
      if (error) { console.error('labor uids', error); return; }
      (data || []).forEach((row) => {
        const f = row.fields || {};
        const strain = row.strain || f.strain || '';
        (UID_FIELDS[row.station_key] || DEFAULT_UID_FIELDS).forEach(([k, role]) => { if (f[k]) noteUid(f[k], strain, row, role); });
        // Multi-package forms (Wet Intake) carry a UID per line.
        (f.lines || []).forEach((ln) => { if (ln && ln.sourceUid) noteUid(ln.sourceUid, ln.strain || strain, row, 'out'); });
      });
      if (!data || data.length < PAGE) break;
    }
  })();

  // Canix packages — only searched when the operations records don't have the
  // UID (a package that never went through a station form). 3 MB, so it's
  // only fetched the first time someone types 4+ characters.
  let canix = null, canixLoading = false;
  function loadCanix() {
    if (canix || canixLoading) return;
    canixLoading = true;
    getJson('canix_inventory.json').then((rows) => {
      canix = (rows || []).filter((p) => p && p.tag && p.is_active !== false)
        .filter((p) => !/clone|seed|immature|packaged/i.test(((p.item || {}).type || {}).name || ''))
        .map((p) => ({ uid: normUid(p.tag), strain: ((p.item || {}).strain || {}).name || '', item: (p.item || {}).name || '', status: p.status || '' }));
      canixLoading = false;
      if (document.activeElement === $('uid-q')) uidPicker.refresh();
    });
  }

  function isSuggested(u, proc) {
    const feeds = FEEDS[proc];
    if (!feeds || !feeds.includes(u.station)) return false;
    if (u.station !== proc) return u.role !== 'in';
    if (u.status === 'draft') return true;
    const days = (Date.parse(localDay()) - Date.parse(u.date)) / 86400000;
    return days <= RECENT_DAYS;
  }

  // ── Picker (input + dropdown + chips) ───────────────────────────────────
  // `options(q)` returns [{label, items:[{html, pick, raw?}]}] — `raw` marks
  // the "add what I typed" item. Enter takes the one real match if there's
  // exactly one (or the raw item when there's nothing else); `onRaw(q)` is
  // what Enter does when the list is empty. The list closes after a pick so
  // it isn't covering the next field; tap the input to open it again.
  function makePicker({ input, panel, options, onRaw }) {
    let flat = [], hl = -1;
    function render() {
      const groups = options(input.value.trim());
      flat = [];
      panel.innerHTML = groups.map((g) => {
        if (g.note) return `<div class="empty">${esc(g.note)}</div>`;
        if (!g.items.length) return '';
        return (g.label ? `<div class="grp">${esc(g.label)}</div>` : '') + g.items.map((it) => {
          flat.push(it);
          return `<button type="button" data-i="${flat.length - 1}">${it.html}</button>`;
        }).join('');
      }).join('') || '';
      const real = flat.filter((it) => !it.raw);
      hl = real.length === 1 ? flat.indexOf(real[0]) : (!real.length && flat.length === 1 ? 0 : -1);
      highlight();
      panel.classList.toggle('on', !!panel.innerHTML);
    }
    function highlight() {
      panel.querySelectorAll('button').forEach((b, i) => b.classList.toggle('hl', i === hl));
      const b = panel.querySelectorAll('button')[hl];
      if (b) b.scrollIntoView({ block: 'nearest' });
    }
    function pick(i) {
      const it = flat[i];
      if (!it) return;
      it.pick();
      input.value = '';
      panel.classList.remove('on');
      input.focus();
    }
    input.addEventListener('focus', render);
    input.addEventListener('click', render);
    input.addEventListener('input', render);
    input.addEventListener('blur', () => setTimeout(() => panel.classList.remove('on'), 150));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { hl = Math.min(flat.length - 1, hl + 1); highlight(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { hl = Math.max(0, hl - 1); highlight(); e.preventDefault(); }
      else if (e.key === 'Escape') panel.classList.remove('on');
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (hl >= 0) pick(hl);
        else if (!flat.length && onRaw && onRaw(input.value.trim())) { input.value = ''; panel.classList.remove('on'); }
      }
    });
    panel.addEventListener('mousedown', (e) => e.preventDefault());
    panel.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) pick(+b.dataset.i); });
    return { refresh: render };
  }

  // People
  let people = []; // [{userId, name}] — userId '' for someone typed in
  const addPerson = (p) => { if (!people.some((x) => x.userId ? x.userId === p.userId : fold(x.name) === fold(p.name))) people.push(p); renderPeople(); };
  function renderPeople() {
    $('people-chips').innerHTML = people.map((p, i) =>
      `<span class="chip ${p.userId ? '' : 'manual'}">${clockedIn.has(p.userId) ? '<span class="dot"></span>' : ''}${esc(p.name)}${p.userId ? '' : ` <span class="s">${esc(t(L.notInCt))}</span>`}<button type="button" data-i="${i}" aria-label="×">×</button></span>`).join('');
    renderQuick();
    renderSummary();
  }
  $('people-chips').onclick = (e) => { const b = e.target.closest('button[data-i]'); if (b) { people.splice(+b.dataset.i, 1); renderPeople(); } };
  function renderQuick() {
    const missing = roster.filter((p) => clockedIn.has(p.userId) && !people.some((x) => x.userId === p.userId));
    $('people-quick').innerHTML = missing.length > 1
      ? `<button type="button" id="add-clocked"><span class="dot"></span>${esc(t(L.addAll))} (${missing.length})</button>` : '';
    const btn = $('add-clocked');
    if (btn) btn.onclick = () => { missing.forEach((p) => people.push(p)); renderPeople(); };
  }
  makePicker({
    input: $('people-q'), panel: $('people-panel'),
    options: (q) => {
      const fq = fold(q);
      const words = fq.split(/\s+/).filter(Boolean);
      const pool = roster.filter((p) => !people.some((x) => x.userId === p.userId) && words.every((w) => fold(p.name).includes(w)));
      const item = (p) => ({ html: `${clockedIn.has(p.userId) ? '<span class="dot"></span>' : ''}${esc(p.name)}`, pick: () => addPerson(p) });
      const groups = [
        { label: t(L.clockedIn), items: pool.filter((p) => clockedIn.has(p.userId)).map(item) },
        { label: t(L.everyone), items: pool.filter((p) => !clockedIn.has(p.userId)).slice(0, 80).map(item) }
      ];
      if (q && !roster.some((p) => fold(p.name) === fq)) {
        groups.push({ label: '', items: [{ raw: true, html: esc(fill(t(L.addManual), { q })), pick: () => addPerson({ userId: '', name: q }) }] });
      }
      return groups;
    },
    onRaw: (q) => { if (q.length < 2) return false; addPerson({ userId: '', name: q }); return true; }
  });

  // UIDs
  let uids = []; // [{uid, strain}]
  const addUid = (u) => { if (!uids.some((x) => x.uid === u.uid)) uids.push({ uid: u.uid, strain: u.strain || '' }); renderUids(); };
  function renderUids() {
    $('uid-chips').innerHTML = uids.map((u, i) =>
      `<span class="chip" title="${esc(u.uid)}"><span class="m">${esc(tail(u.uid))}</span>${u.strain ? `<span class="s">${esc(u.strain)}</span>` : ''}<button type="button" data-i="${i}" aria-label="×">×</button></span>`).join('');
    renderSummary();
  }
  $('uid-chips').onclick = (e) => { const b = e.target.closest('button[data-i]'); if (b) { uids.splice(+b.dataset.i, 1); renderUids(); } };
  function uidItem(u, sub) {
    return {
      html: `<span class="m"><b>${esc(tail(u.uid))}</b> ${u.uid.length > 8 ? esc(u.uid) : ''}</span><span class="s">${esc([u.strain, sub].filter(Boolean).join(' · '))}</span>`,
      pick: () => addUid(u)
    };
  }
  const stageSub = (u) => `${procTitle(u.station)} · ${u.date}${u.status === 'draft' ? ' …' : ''}`;
  const uidPicker = makePicker({
    input: $('uid-q'), panel: $('uid-panel'),
    options: (raw) => {
      const q = normUid(raw);
      const proc = $('process').value;
      if (q.length >= 4) loadCanix();
      const taken = new Set(uids.map((u) => u.uid));
      const hit = (uid) => !q || uid.includes(q);
      const rank = (a, b) => (b.uid.endsWith(q) - a.uid.endsWith(q)) || (b.date + b.at).localeCompare(a.date + a.at);
      const all = [...uidIndex.values()].filter((u) => !taken.has(u.uid) && hit(u.uid)).sort(rank);
      const sug = all.filter((u) => isSuggested(u, proc));
      const rest = all.filter((u) => !isSuggested(u, proc));
      const groups = [
        { label: `${t(L.suggested)}${proc ? ' — ' + procTitle(proc) : ''}`, items: sug.slice(0, 60).map((u) => uidItem(u, stageSub(u))) },
        { label: t(L.recent), items: (q ? rest : rest.slice(0, 40)).slice(0, 60).map((u) => uidItem(u, stageSub(u))) }
      ];
      if (q.length >= 4 && canix) {
        const cx = canix.filter((p) => !taken.has(p.uid) && !uidIndex.has(p.uid) && p.uid.includes(q))
          .sort((a, b) => b.uid.endsWith(q) - a.uid.endsWith(q)).slice(0, 30);
        groups.push({ label: t(L.canix), items: cx.map((p) => uidItem(p, [p.item, p.status].filter(Boolean).join(' · '))) });
      }
      const found = groups.some((g) => g.items.length);
      if (!found && q.length >= 10 && !taken.has(q)) {
        groups.push({ label: '', items: [{ raw: true, html: `<span class="m">${esc(fill(t(L.useTyped), { q }))}</span>`, pick: () => addUid({ uid: q }) }] });
      } else if (q && !found) {
        groups.push({ note: q.length < 4 ? t(L.typeMore) : t(L.noMatch) });
      }
      return groups;
    },
    onRaw: (raw) => { const q = normUid(raw); if (q.length < 10) return false; addUid({ uid: q }); return true; }
  });
  $('process').addEventListener('change', () => {
    try { localStorage.setItem(PROCESS_KEY, $('process').value); } catch {}
    renderSummary();
  });
  $('date').addEventListener('change', renderSummary);
  if (params.get('uid')) { addUid({ uid: normUid(params.get('uid')) }); uidsReady.then(() => {
    uids = uids.map((u) => ({ ...u, strain: u.strain || (uidIndex.get(u.uid) || {}).strain || '' })); renderUids(); }); }

  // ── Stage records, for weights ──────────────────────────────────────────
  // Every submitted station record, the same set the dashboard reads —
  // what laborAllocations uses to find each UID's lot and its pounds.
  let stagesP = null;
  function loadStages() {
    if (!stagesP) stagesP = (async () => {
      const st = {};
      await Promise.all(OPERATIONS_STATIONS.map(async (s) => { st[s.key] = await loadSubmitted(s.key); }));
      return st;
    })();
    return stagesP;
  }

  // ── Labor rates (only with cost access) ─────────────────────────────────
  // Per-person $/hr by effective date, [{employeeId, rate, from}], '*' the
  // default. `rates` stays null without the 'labor log costs' permission
  // (2cw_labor_costs, set at hub login), and every cost column hides.
  const canCost = sessionStorage.getItem('2cw_labor_costs') === 'true';
  let rates = null;
  let costErr = '';
  const fmtMoney = (x) => x == null ? '—' : '$' + fmtNum(x, 2);
  const costOf = (employeeId, date, hours) => {
    const r = A.rateFor(rates, employeeId, date);
    return r == null ? null : num(hours) * r;
  };
  if (canCost) (async () => {
    try {
      const res = await fetch('/.netlify/functions/labor-rates', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: sessionStorage.getItem('2cw_pin') || '' })
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok || !j.ok) throw new Error(j.error || `HTTP ${res.status}`);
      rates = j.rates || [];
    } catch (e) { costErr = String(e.message || e); }
    renderSummary();
    if ($('view-list').classList.contains('on')) renderList();
  })();

  // ── Applies to: UIDs, or general work at a farm ─────────────────────────
  // A farm entry has no UIDs, just the farm license (`farm`, the same code
  // Harvest and Wet Intake record as `pid`); laborAllocations spreads it
  // over that farm's lots for the year by wet lb.
  let target = 'uids';
  let farms = [];   // [{v, label}] — Farm Licenses (Information Hub)
  const farmName = (pid, fallback) => { const f = farms.find((x) => x.v === pid); return f ? f.label : (fallback || pid || ''); };
  // Licenses are labelled "Farm: license" (Information Hub → Farm Licenses);
  // the part before ": " is the farm they're grouped under.
  const splitLabel = (label, v) => { const i = String(label).lastIndexOf(': '); return i > 0 ? [label.slice(0, i), label.slice(i + 2)] : [label || v, v]; };
  // "Sulphur Bank: 167, 168 · Lucerne: 073" for a list of license codes.
  function farmsLabel(pids, fallback) {
    if (!pids || !pids.length) return fallback || '';
    const by = new Map();
    pids.forEach((p) => {
      const f = farms.find((x) => x.v === p);
      const [name, lic] = f ? splitLabel(f.label, f.v) : [p, p];
      (by.get(name) || by.set(name, []).get(name)).push(f ? lic : p);
    });
    if (!farms.length && fallback) return fallback;
    return [...by.entries()].map(([n, l]) => n === l.join(', ') ? n : `${n}: ${l.join(', ')}`).join(' · ');
  }
  const entryFarms = (f) => A.entryFarms(f);
  const isFarmEntry = (f) => entryFarms(f).length > 0 && !(f.uids || []).length;
  let selFarms = new Set();
  function renderFarmPick() {
    const q = fold($('farm-q').value.trim());
    const groups = new Map();
    farms.forEach((f) => {
      const [name, lic] = splitLabel(f.label, f.v);
      (groups.get(name) || groups.set(name, []).get(name)).push({ v: f.v, lic });
    });
    const html = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))
      .filter(([name, lics]) => !q || fold(name).includes(q) || lics.some((x) => fold(x.lic).includes(q)))
      .map(([name, lics]) => {
        const n = lics.filter((x) => selFarms.has(x.v)).length;
        return `<div class="fgrp ${n ? 'sel' : ''}"><button type="button" class="fname" data-group="${esc(name)}">${esc(name)}
            <span class="s">${esc(fill(t(L.licOf), { n, t: lics.length }))}</span></button>
          ${lics.map((x) => `<button type="button" class="flic ${selFarms.has(x.v) ? 'on' : ''}" data-pid="${esc(x.v)}">${esc(x.lic)}</button>`).join('')}</div>`;
      }).join('');
    $('farm').innerHTML = html || `<div class="hint" style="padding:10px">—</div>`;
  }
  $('farm-q').placeholder = t(L.farmQ);
  $('farm-q').addEventListener('input', renderFarmPick);
  $('farm').addEventListener('click', (e) => {
    const lic = e.target.closest('[data-pid]'), grp = e.target.closest('[data-group]');
    if (lic) { selFarms.has(lic.dataset.pid) ? selFarms.delete(lic.dataset.pid) : selFarms.add(lic.dataset.pid); }
    else if (grp) {
      // Tapping the farm takes all of its licenses (or clears them if they're all on).
      const pids = farms.filter((f) => splitLabel(f.label, f.v)[0] === grp.dataset.group).map((f) => f.v);
      const all = pids.every((p) => selFarms.has(p));
      pids.forEach((p) => (all ? selFarms.delete(p) : selFarms.add(p)));
    } else return;
    $('err').textContent = '';
    renderFarmPick();
    renderSummary();
  });
  $('l-target').textContent = t(L.target);
  $('l-farm').textContent = t(L.farm);
  $('h-farm').textContent = t(L.hFarm);
  $('target-seg').innerHTML = [['uids', L.tgtUids], ['farm', L.tgtFarm]]
    .map(([k, l]) => `<button type="button" data-target="${k}">${esc(t(l))}</button>`).join('');
  function setTarget(k) {
    target = k;
    document.querySelectorAll('#target-seg button').forEach((b) => b.classList.toggle('on', b.dataset.target === k));
    $('target-uids').hidden = k !== 'uids';
    $('target-farm').hidden = k !== 'farm';
    renderSummary();
  }
  $('target-seg').onclick = (e) => { const b = e.target.closest('button'); if (b) setTarget(b.dataset.target); };
  document.querySelector('#target-seg button[data-target="uids"]').classList.add('on');
  loadReference().then((ref) => {
    farms = refOptions(ref, 'properties');
    if (params.get('farm')) { params.get('farm').split(',').forEach((p) => selFarms.add(p)); setTarget('farm'); }
    renderFarmPick();
  });

  // ── Hours ───────────────────────────────────────────────────────────────
  function fromTimes() {
    const h = hoursBetween($('start').value, $('end').value);
    if (h !== null) $('hours').value = h;
    renderSummary();
  }
  $('start').addEventListener('change', fromTimes);
  $('end').addEventListener('change', fromTimes);
  $('hours').addEventListener('input', renderSummary);

  function renderSummary() {
    const h = num($('hours').value);
    if (!people.length || !h) { $('summary').textContent = t(L.sumNone); renderSplit(); return; }
    const p = people.length === 1 ? t(L.person1) : fill(t(L.personN), { n: people.length });
    let s = fill(t(L.sumPeople), { p, h: `<b>${fmtH(h)}</b>`, t: `<b>${fmtH(h * people.length)}</b>` });
    if (rates) {
      const costs = people.map((x) => costOf(x.userId, $('date').value, h));
      if (costs.every((c) => c != null)) s += ' ' + fill(t(L.sumCost), { c: `<b>${fmtMoney(costs.reduce((a, c) => a + c, 0))}</b>` });
    }
    if (target === 'farm') { /* farm preview comes from renderSplit */ }
    else if (!uids.length) s += '<br>' + t(L.sumNoUid);
    else if (uids.length === 1) s += '<br>' + fill(t(L.sumOne), { uid: `<b>${esc(tail(uids[0].uid))}</b>` });
    $('summary').innerHTML = s;
    renderSplit();
  }
  // How a multi-UID entry will divide: each UID's pounds at this process and
  // its share, worked out the same way the reports do (laborAllocations).
  let splitSeq = 0;
  async function renderSplit() {
    const seq = ++splitSeq;
    const h = num($('hours').value), proc = $('process').value;
    if (target === 'farm') {
      const sel = [...selFarms].sort();
      if (!sel.length || !people.length || !h) { $('split').innerHTML = ''; return; }
      const st = await loadStages();
      if (seq !== splitSeq) return;
      const date = $('date').value || localDay();
      const preview = people.map((x, i) => ({ id: 'preview' + i, process: proc || 'other', hours: h, date, farms: sel,
                                              employeeId: x.userId, employeeName: x.name, uids: [] }));
      const per = A.laborAllocations({ ...st, labor_entry: preview }, rates);
      const f = farmsLabel(sel), y = date.slice(0, 4);
      if (!per.length || per[0].basis === 'farm-pending') { $('split').innerHTML = '<br>' + esc(fill(t(L.sumFarmNone), { f, y })); return; }
      const al = [];
      per.forEach((a) => {
        const row = al.find((x) => x.uid === a.uid);
        if (!row) al.push({ ...a });
        else { row.hours += a.hours; row.cost = row.cost == null || a.cost == null ? null : row.cost + a.cost; }
      });
      const lb = al.reduce((a, x) => a + x.lb, 0);
      $('split').innerHTML = '<br>' + esc(fill(t(L.sumFarm), { f, y, n: al.length, lb: fmtNum(lb, 0) })) +
        `<table>${al.slice(0, 12).map((a) => `<tr><td class="m">${esc(tail(a.uid))}</td><td>${esc(a.strain)}</td><td class="n">${fmtNum(a.lb, 0)} lb</td>
          <td class="n">${fmtPct(a.share, 0)}</td><td class="n"><b>${fmtNum(a.hours, 2)} h</b></td>${a.cost != null ? `<td class="n">${fmtMoney(a.cost)}</td>` : ''}</tr>`).join('')}</table>` +
        (al.length > 12 ? `<div class="s">+ ${al.length - 12}</div>` : '');
      return;
    }
    if (uids.length < 2 || !people.length || !h || !proc) { $('split').innerHTML = ''; return; }
    const st = await loadStages();
    if (seq !== splitSeq) return;
    // One preview entry per person (rates differ), summed per UID.
    const preview = people.map((x, i) => ({ id: 'preview' + i, process: proc, hours: h, date: $('date').value,
                                            employeeId: x.userId, employeeName: x.name, uids }));
    const per = A.laborAllocations({ ...st, labor_entry: preview }, rates);
    const al = [];
    per.forEach((a) => {
      const row = al.find((x) => x.uid === a.uid);
      if (!row) al.push({ ...a });
      else { row.hours += a.hours; row.cost = row.cost == null || a.cost == null ? null : row.cost + a.cost; }
    });
    if (!al.length) { $('split').innerHTML = ''; return; }
    if (al[0].basis === 'even') {
      const missing = al.filter((a) => !a.lb).map((a) => tail(a.uid)).join(', ');
      $('split').innerHTML = '<br>' + esc(fill(t(L.sumEven), { u: al.length, missing }));
      return;
    }
    $('split').innerHTML = '<br>' + esc(fill(t(L.sumWeight), { u: al.length })) +
      `<table>${al.map((a) => `<tr><td class="m">${esc(tail(a.uid))}</td><td>${esc(a.strain)}</td><td class="n">${fmtNum(a.lb, 0)} lb</td>
        <td class="n">${fmtPct(a.share, 0)}</td><td class="n"><b>${fmtNum(a.hours, 2)} h</b></td>${a.cost != null ? `<td class="n">${fmtMoney(a.cost)}</td>` : ''}</tr>`).join('')}</table>`;
  }
  renderSummary();

  // ── Save ────────────────────────────────────────────────────────────────
  $('save').onclick = async () => {
    const err = $('err');
    err.textContent = '';
    const proc = $('process').value, date = $('date').value, hours = num($('hours').value);
    const problem = !proc ? L.needProc : !date ? L.needDate : !people.length ? L.needPeople
      : !(hours > 0) ? L.needHours : hours > 16 ? L.tooMany : target === 'farm' && !selFarms.size ? L.needFarm : null;
    if (problem) { err.textContent = t(problem); return; }
    const client = getClient();
    if (!client) { err.textContent = t(L.noDb); return; }
    const isFarm = target === 'farm';
    const strains = isFarm ? [] : [...new Set(uids.map((u) => u.strain).filter(Boolean))];
    const now = new Date().toISOString();
    const rows = people.map((p) => ({
      station_key: ENTRY_KEY, status: 'submitted', owner_user: me || null, updated_by: me || null,
      strain: strains.length === 1 ? strains[0] : null, work_date: date, submitted_at: now,
      fields: {
        process: proc, employeeId: p.userId || '', employeeName: p.name,
        uids: isFarm ? [] : uids.map((u) => ({ uid: u.uid, strain: u.strain || '' })),
        ...(isFarm ? (() => { const sel = [...selFarms].sort(); return { farms: sel, farm: sel[0], farmName: farmsLabel(sel) }; })() : {}),
        start: $('start').value || '', end: $('end').value || '', hours,
        notes: $('notes').value.trim(), enteredBy: me
      }
    }));
    $('save').disabled = true;
    $('save').textContent = t(L.saving);
    const { error } = await client.from('operations_forms').insert(rows);
    $('save').disabled = false;
    $('save').textContent = t(L.save);
    if (error) { err.textContent = `${t(L.failed)} ${error.message}`; return; }
    // Keep process, date, times and UIDs — the next person usually worked the
    // same block — and clear who and the notes.
    people = []; renderPeople();
    $('notes').value = '';
    toast(rows.length === 1 ? t(L.saved1) : fill(t(L.saved), { n: rows.length }));
    allEntriesP = null;
    loadMine();
  };
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('on'), 2500);
  }

  // ── Entries / summaries ─────────────────────────────────────────────────
  let entries = [];
  let seg = 'entries';
  $('f-from').value = localDay();
  $('f-to').value = localDay();
  // Deep links (e.g. Harvest Intakes → "Open in Labor Log"):
  // ?tab=list&seg=lot&all=1&q=<UID>
  if (params.get('all')) { $('f-from').value = ''; $('f-to').value = ''; }
  if (params.get('q')) $('f-q').value = params.get('q');
  if (['entries', 'lot', 'person', 'costlb'].includes(params.get('seg'))) seg = params.get('seg');
  const RANGES = [['today', L.today, 0], ['30', L.last30, 29], ['all', L.allTime, null]];
  $('ranges').innerHTML = RANGES.map(([k, l]) => `<button type="button" data-range="${k}">${esc(t(l))}</button>`).join('');
  $('ranges').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const back = RANGES.find((r) => r[0] === b.dataset.range)[2];
    const from = new Date(); from.setDate(from.getDate() - (back || 0));
    $('f-from').value = back == null ? '' : localDay(from);
    $('f-to').value = back == null ? '' : localDay();
    loadEntries();
  };
  const SEGS = [['entries', L.segEntries], ['lot', canCost ? L.segLot : L.segLotH], ['person', L.segPerson], ...(canCost ? [['costlb', L.segCost]] : [])];
  $('seg').innerHTML = SEGS.map(([k, l]) => `<button type="button" data-seg="${k}">${esc(t(l))}</button>`).join('');
  $('seg').onclick = (e) => { const b = e.target.closest('button'); if (b) { seg = b.dataset.seg; renderList(); } };
  ['f-from', 'f-to'].forEach((id) => $(id).addEventListener('change', loadEntries));
  $('f-process').addEventListener('change', renderList);
  $('f-q').addEventListener('input', renderList);

  async function loadEntries() {
    const client = getClient();
    if (!client) { $('list').innerHTML = `<div class="empty-big">${esc(t(L.noDb))}</div>`; return; }
    $('list').innerHTML = `<div class="empty-big">${esc(t(L.loading))}</div>`;
    const PAGE = 1000, data = [];
    for (let page = 0; page < 20; page++) {
      let q = client.from('operations_forms').select('*').eq('station_key', ENTRY_KEY).eq('status', 'submitted');
      if ($('f-from').value) q = q.gte('work_date', $('f-from').value);
      if ($('f-to').value) q = q.lte('work_date', $('f-to').value);
      const res = await q.order('work_date', { ascending: false }).order('submitted_at', { ascending: false }).order('id')
        .range(page * PAGE, page * PAGE + PAGE - 1);
      if (res.error) { $('list').innerHTML = `<div class="empty-big">${esc(t(L.failed))} ${esc(res.error.message)}</div>`; return; }
      data.push(...(res.data || []));
      if (!res.data || res.data.length < PAGE) break;
    }
    entries = data.filter((r) => !(r.fields || {}).voided);
    renderList();
  }

  // `noSearch`: By lot applies the search to the lots after allocation
  // instead, so farm-wide time (no UIDs) still reaches a searched-for lot.
  function visibleEntries(noSearch) {
    const proc = $('f-process').value;
    const q = fold($('f-q').value.trim());
    const qu = normUid($('f-q').value);
    return entries.filter((r) => {
      const f = r.fields || {};
      if (proc && f.process !== proc) return false;
      if (!q || noSearch) return true;
      return fold(f.employeeName).includes(q) || fold(f.farmName).includes(q) || (qu && (f.uids || []).some((u) => normUid(u.uid).includes(qu)));
    });
  }

  function renderList() {
    document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b.dataset.seg === seg));
    if (seg === 'costlb') { renderCostLb(); return; }
    const rows = visibleEntries(seg === 'lot');
    if (!rows.length) { $('list').innerHTML = `<div class="empty-big">${esc(t(L.empty))}</div>`; return; }
    const table = (head, body) => `<div class="tbl-wrap"><table><thead><tr>${head.map(([l, n]) => `<th class="${n ? 'n' : ''}">${esc(t(l))}</th>`).join('')}</tr></thead><tbody>${body.join('')}</tbody></table></div>`;
    const totalH = rows.reduce((a, r) => a + num(r.fields.hours), 0);
    const showCost = !!rates;
    const entryCost = (r) => costOf(r.fields.employeeId, r.work_date, r.fields.hours);
    const totalCost = showCost && rows.every((r) => entryCost(r) != null) ? rows.reduce((a, r) => a + entryCost(r), 0) : null;
    const costNote = costErr ? `<div class="hint warn" style="margin-bottom:10px">${esc(t(L.costErr))} ${esc(costErr)}</div>`
      : showCost && totalCost == null ? `<div class="hint warn" style="margin-bottom:10px">${esc(t(L.noRate))}</div>` : '';
    const costCol = showCost ? [[L.colCost, 1]] : [];

    if (seg === 'entries') {
      const body = rows.map((r) => {
        const f = r.fields;
        const time = f.start && f.end ? `${f.start}–${f.end}` : '';
        const us = isFarmEntry(f) ? esc(fill(t(L.farmLabel), { f: farmsLabel(entryFarms(f), f.farmName) }))
          : (f.uids || []).map((u) => `<span class="m" title="${esc(u.uid)}">${esc(tail(u.uid))}</span>${u.strain ? ` <span class="s">${esc(u.strain)}</span>` : ''}`).join('<br>') || `<span class="s">${esc(t(L.noUid))}</span>`;
        return `<tr><td>${esc(r.work_date)}</td>
          <td>${esc(f.employeeName)}${f.employeeId ? '' : ` <span class="s warn">${esc(t(L.notInCt))}</span>`}</td>
          <td>${esc(procTitle(f.process))}</td><td class="n">${esc(time)}</td><td class="n">${fmtH(num(f.hours))}</td>
          ${showCost ? `<td class="n">${fmtMoney(entryCost(r))}</td>` : ''}
          <td>${us}${f.notes ? `<div class="s">${esc(f.notes)}</div>` : ''}</td><td><span class="s">${esc(f.enteredBy || r.owner_user || '')}</span></td>
          <td><button type="button" class="link-btn" data-remove="${r.id}">${esc(t(L.remove))}</button></td></tr>`;
      });
      body.push(`<tr class="total"><td colspan="4">${esc(t(L.total))}</td><td class="n">${fmtH(totalH)}</td>${showCost ? `<td class="n">${fmtMoney(totalCost)}</td>` : ''}<td colspan="3"></td></tr>`);
      $('list').innerHTML = costNote + table([[L.colDate], [L.colPerson], [L.colProc], [L.colTime, 1], [L.colHours, 1], ...costCol, [L.colUids], [L.colBy], [{ en: '', es: '' }]], body);
    } else if (seg === 'lot') {
      renderLots(rows, table, costNote);
    } else {
      const by = {};
      rows.forEach((r) => {
        const f = r.fields;
        const k = f.employeeId || 'name:' + fold(f.employeeName);
        const row = by[k] || (by[k] = { id: f.employeeId, name: f.employeeName, hours: 0, cost: 0, n: 0, uids: new Set(), procs: new Set() });
        row.hours += num(f.hours);
        const c = entryCost(r);
        row.cost = row.cost == null || c == null ? null : row.cost + c;
        row.n += 1;
        (f.uids || []).forEach((u) => row.uids.add(u.uid));
        row.procs.add(f.process);
      });
      const list = Object.values(by).sort((a, b) => b.hours - a.hours);
      // Connecteam's hours-today only covers today, so the comparison only
      // shows when today is the whole range.
      const today = localDay();
      const withClock = $('f-from').value === today && $('f-to').value === today;
      const body = list.map((p) => {
        const clock = p.id && clockedToday[p.id] != null ? clockedToday[p.id] : null;
        const gap = clock != null ? clock - p.hours : null;
        return `<tr><td>${esc(p.name)}</td><td class="n">${fmtH(p.hours)}</td>${showCost ? `<td class="n">${fmtMoney(p.cost)}</td>` : ''}
          ${withClock ? `<td class="n">${clock != null ? fmtNum(clock, 2) : '—'}</td><td class="n ${gap > 0.25 ? 'warn' : ''}">${gap != null ? fmtNum(Math.max(0, gap), 2) : '—'}</td>` : ''}
          <td class="n">${p.n}</td><td class="n">${p.uids.size}</td><td>${[...p.procs].map((x) => esc(procTitle(x))).join(', ')}</td></tr>`;
      });
      body.push(`<tr class="total"><td>${esc(t(L.total))}</td><td class="n">${fmtH(totalH)}</td>${showCost ? `<td class="n">${fmtMoney(totalCost)}</td>` : ''}<td colspan="${withClock ? 5 : 3}"></td></tr>`);
      $('list').innerHTML = costNote + table([[L.colPerson], [L.colHours, 1], ...costCol, ...(withClock ? [[L.colClock, 1], [L.colUnlog, 1]] : []),
        [L.colEntries, 1], [L.colUids, 1], [L.colProc]], body) + (withClock ? `<div class="hint">${esc(t(L.clockNote))}</div>` : '');
    }
  }

  // Labor cost per lot, through the flow: intake, take-down, bucking, … each
  // its own column, then totals and cost per pound.
  let lotSeq = 0;
  async function renderLots(rows, table, costNote) {
    const seq = ++lotSeq;
    $('list').innerHTML = `<div class="empty-big">${esc(t(L.loading))}</div>`;
    const st = await loadStages();
    if (seq !== lotSeq || seg !== 'lot') return;
    const all = { ...st, labor_entry: rows.map(flattenRecord) };
    const allocs = A.laborAllocations(all, rates);
    const q = fold($('f-q').value.trim()), qu = normUid($('f-q').value);
    const lots = A.laborCostByLot(all, rates, allocs).filter((l) => !q
      || (qu && (normUid(l.lotId).includes(qu) || l.uids.some((u) => normUid(u).includes(qu))))
      || fold(l.strain).includes(q) || fold(farmsLabel(String(l.farm || '').split(',').filter(Boolean))).includes(q));
    const procs = [...OPERATIONS_STATIONS.map((x) => x.key), ...Object.keys(LABOR_PROCESSES)].filter((k) => lots.some((l) => l.byProcess[k]));
    const hasCost = !!rates && lots.every((l) => l.cost != null);
    const anyFarm = lots.some((l) => l.farmHours);
    const farmCell = (l) => !l.farmHours ? '' : rates && l.farmCost != null
      ? `<span class="warn">${fmtMoney(l.farmCost)}</span><div class="s">${fmtNum(l.farmHours, 2)} h</div>` : `<span class="warn">${fmtNum(l.farmHours, 2)} h</span>`;
    const cell = (p) => !p ? '' : hasCost ? `${fmtMoney(p.cost)}<div class="s">${fmtNum(p.hours, 2)} h</div>` : `${fmtNum(p.hours, 2)} h`;
    const body = lots.map((l) => `<tr>
      <td>${l.pending ? `${esc(fill(t(L.farmLabel), { f: farmsLabel(String(l.farm || '').split(',').filter(Boolean)) }))}<div class="s warn">${esc(t(L.pool))}</div>`
        : l.lotId ? `<span class="m" title="${esc(l.uids.join(', '))}">${esc(tail(l.lotId))}</span>${l.evenSplit ? ' <span class="warn">≈</span>' : ''}
        <div class="s">${esc([l.strain, l.farm ? farmName(l.farm) : ''].filter(Boolean).join(' · '))}</div>`
        : `<span class="s">${esc(t(L.noUid))}</span>`}</td>
      ${procs.map((k) => `<td class="n">${cell(l.byProcess[k])}</td>`).join('')}
      <td class="n">${l.hours ? fmtNum(l.hours, 2) : '—'}</td>${rates ? `<td class="n">${l.hours ? fmtMoney(l.cost) : '—'}</td>` : ''}
      ${anyFarm ? `<td class="n">${farmCell(l)}</td>` : ''}
      <td class="n">${l.wetLb ? fmtNum(l.wetLb, 0) : '—'}</td>${rates ? `<td class="n">${l.hours && l.costPerWetLb != null ? '$' + fmtNum(l.costPerWetLb, 3) : '—'}</td>` : ''}
      ${anyFarm && rates ? `<td class="n">${l.farmCostPerWetLb != null ? '<span class="s">+</span>$' + fmtNum(l.farmCostPerWetLb, 3) : '—'}</td>` : ''}
      <td class="n">${l.currentLb ? fmtNum(l.currentLb, 1) : '—'}${l.currentStage ? `<div class="s">${esc(procTitle(l.currentStage))}</div>` : ''}</td>
      ${rates ? `<td class="n">${l.hours && l.costPerCurrentLb != null ? '$' + fmtNum(l.costPerCurrentLb, 2) : '—'}</td>` : ''}</tr>`);
    const sum = (k) => lots.reduce((a, l) => a + (l[k] || 0), 0);
    body.push(`<tr class="total"><td>${esc(t(L.total))}</td>${procs.map((k) => {
      const p = lots.reduce((a, l) => { const x = l.byProcess[k]; if (x) { a.hours += x.hours; a.cost += x.cost; } return a; }, { hours: 0, cost: 0 });
      return `<td class="n">${cell(p)}</td>`; }).join('')}<td class="n">${fmtNum(sum('hours'), 2)}</td>${rates ? `<td class="n">${hasCost ? fmtMoney(sum('cost')) : '—'}</td>` : ''}${anyFarm ? `<td class="n">${farmCell({ farmHours: sum('farmHours'), farmCost: lots.every((l) => l.farmCost != null) ? sum('farmCost') : null })}</td>` : ''}<td colspan="${(rates ? 4 : 2) + (anyFarm && rates ? 1 : 0)}"></td></tr>`);
    $('list').innerHTML = costNote +
      table([[L.colLot], ...procs.map((k) => [{ en: procTitle(k), es: procTitle(k) }, 1]), [L.colHours, 1],
             ...(rates ? [[L.colCost, 1]] : []), ...(anyFarm ? [[L.colFarm, 1]] : []), [L.colWet, 1], ...(rates ? [[L.colPerWet, 1]] : []),
             ...(anyFarm && rates ? [[L.colPerWetFarm, 1]] : []),
             [L.colNow, 1], ...(rates ? [[L.colPerNow, 1]] : [])], body) +
      `<div class="hint">${esc(t(L.lotNote))}</div>`;
  }

  // ── Cost / lb: labor carried forward through the stages ─────────────────
  // All dates (a lot's cost per lb needs all of its labor), so it loads every
  // entry itself rather than using the date range above. carryCost in
  // ops_analytics.js does the math; the trim split is the shared setting.
  let allEntriesP = null, trimSplit = null, costSeq = 0;
  function loadAllEntries() {
    if (allEntriesP) return allEntriesP;
    allEntriesP = (async () => {
      const client = getClient(), out = [];
      for (let page = 0; client && page < 50; page++) {
        const { data, error } = await client.from('operations_forms').select('*').eq('station_key', ENTRY_KEY)
          .eq('status', 'submitted').order('id').range(page * 1000, page * 1000 + 999);
        if (error || !data) break;
        out.push(...data.filter((r) => !(r.fields || {}).voided));
        if (data.length < 1000) break;
      }
      return out;
    })();
    return allEntriesP;
  }
  async function renderCostLb() {
    const s = ++costSeq;
    $('list').innerHTML = `<div class="empty-big">${esc(t(L.loading))}</div>`;
    const [st, ents, split] = await Promise.all([loadStages(), loadAllEntries(), trimSplit ? Promise.resolve(trimSplit) : getTrimSplit()]);
    if (s !== costSeq || seg !== 'costlb') return;
    trimSplit = split;
    const all = { ...st, labor_entry: ents.map(flattenRecord) };
    const lotsById = new Map(A.buildLots(all).map((l) => [l.id, l]));
    const q = fold($('f-q').value.trim()), qu = normUid($('f-q').value);
    const rowsC = A.laborCostByLot(all, rates).filter((l) => l.lotId && !l.pending && lotsById.has(l.lotId))
      .filter((l) => !q || (qu && (normUid(l.lotId).includes(qu) || l.uids.some((u) => normUid(u).includes(qu))))
        || fold(l.strain).includes(q) || fold(farmsLabel(String(l.farm || '').split(',').filter(Boolean))).includes(q));
    const COLS = [['wet', L.cWet], ['dry', L.cDry], ['bucked', L.cBucked], ['a', L.cA], ['smalls', L.cSmalls], ['trim', L.cTrim]];
    const sum = num(split.a) + num(split.smalls) + num(split.trim);
    const editor = `<div class="card" style="max-width:none;margin-bottom:14px">
      <div class="lbl" style="font-weight:700;color:var(--text)">${esc(t(L.splitHd))}</div>
      <div class="filters" style="margin:8px 0 0">
        ${[['a', L.splitA], ['smalls', L.splitS], ['trim', L.splitT]].map(([k, l]) => `<label style="flex:1 1 120px"><span class="lbl">${esc(t(l))}</span>
          <input type="number" min="0" max="100" step="1" inputmode="decimal" data-split="${k}" value="${esc(split[k])}"></label>`).join('')}
        <button type="button" class="btn btn-blue" id="split-save" style="align-self:flex-end">${esc(t(L.splitSave))}</button>
      </div>
      <div class="hint" id="split-msg">${esc(t(L.splitHint))}${sum !== 100 ? ` <span class="warn">${esc(fill(t(L.splitBad), { n: sum }))}</span>` : ''}</div>
    </div>`;
    const cell = (x, farmX) => {
      if (!x) return '<td class="n"><span class="s">—</span></td>';
      const main = x.perLb != null ? '$' + fmtNum(x.perLb, 2) : fmtMoney(x.cost);
      const f = farmX && farmX.perLb ? `<div class="s warn">+$${fmtNum(farmX.perLb, 2)}</div>` : '';
      return `<td class="n">${main}<div class="s">${x.lb ? fmtNum(x.lb, 1) + ' lb' : ''}${x.pct != null ? ' · ' + fmtNum(x.pct, 0) + '%' : ''}</div>${f}</td>`;
    };
    const body = rowsC.map((l) => {
      const lot = lotsById.get(l.lotId);
      const direct = A.carryCost(lot, Object.fromEntries(Object.entries(l.byProcess).map(([k, v]) => [k, v.cost])), split);
      const farm = l.farmCost ? A.carryCost(lot, { other: l.farmCost }, split) : null;
      const d = Object.fromEntries(direct.stages.map((x) => [x.key, x]));
      const f = farm ? Object.fromEntries(farm.stages.map((x) => [x.key, x])) : {};
      return `<tr><td><span class="m" title="${esc(l.uids.join(', '))}">${esc(tail(l.lotId))}</span>
          <div class="s">${esc([l.strain, l.farm ? farmName(l.farm) : ''].filter(Boolean).join(' · '))}</div></td>
        ${COLS.map(([k]) => cell(d[k], f[k])).join('')}
        <td class="n">${direct.untrimmedCost ? fmtMoney(direct.untrimmedCost) : '<span class="s">—</span>'}</td></tr>`;
    });
    $('list').innerHTML = editor + (rowsC.length
      ? `<div class="tbl-wrap"><table><thead><tr><th>${esc(t(L.colLot))}</th>${COLS.map(([, l]) => `<th class="n">${esc(t(l))}</th>`).join('')}<th class="n">${esc(t(L.cUntrim))}</th></tr></thead>
          <tbody>${body.join('')}</tbody></table></div>`
      : `<div class="empty-big">${esc(t(L.empty))}</div>`) + `<div class="hint">${esc(t(L.costNote2))}</div>`;
    $('split-save').onclick = async () => {
      const v = {};
      document.querySelectorAll('[data-split]').forEach((i) => { v[i.dataset.split] = Math.max(0, num(i.value)); });
      const n = v.a + v.smalls + v.trim;
      if (Math.abs(n - 100) > 0.01) { $('split-msg').innerHTML = `<span class="warn">${esc(fill(t(L.splitBad), { n: fmtNum(n, 0) }))}</span>`; return; }
      const res = await saveTrimSplit(v, me);
      if (!res.ok) { alert(`${t(L.failed)} ${res.reason}`); return; }
      trimSplit = v;
      toast(t(L.splitSaved));
      renderCostLb();
    };
  }

  // Removing an entry marks it voided (anon has no DELETE on
  // operations_forms); the edit history trigger records who and when, and
  // voided entries count for nothing anywhere.
  async function voidEntry(row, btn) {
    const client = getClient();
    if (!row || !client || !confirm(t(L.removeQ))) return false;
    if (btn) btn.disabled = true;
    const fields = { ...row.fields, voided: true, voidedBy: me, voidedAt: new Date().toISOString() };
    const { error } = await client.from('operations_forms').update({ fields, updated_by: me || null })
      .eq('id', row.id).eq('status', 'submitted');
    if (error) { if (btn) btn.disabled = false; alert(`${t(L.failed)} ${error.message}`); return false; }
    allEntriesP = null;
    return true;
  }
  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-remove]');
    if (!b) return;
    const row = entries.find((r) => r.id === b.dataset.remove);
    if (!(await voidEntry(row, b))) return;
    entries = entries.filter((r) => r.id !== row.id);
    renderList();
    loadMine();
  });

  // ── Your entries for this date (under Save) ─────────────────────────────
  // What the person using this tablet logged for the selected date, newest
  // first, each with Delete — so a mistake can be fixed right where it was
  // made, without going to the Entries tab.
  let mine = [], mineSeq = 0;
  async function loadMine() {
    const client = getClient();
    const date = $('date').value;
    if (!client || !me || !date) { $('mine').hidden = true; return; }
    const s = ++mineSeq;
    const { data, error } = await client.from('operations_forms').select('*')
      .eq('station_key', ENTRY_KEY).eq('status', 'submitted').eq('work_date', date).eq('owner_user', me)
      .order('submitted_at', { ascending: false }).range(0, 199);
    if (s !== mineSeq) return;
    mine = error ? [] : (data || []).filter((r) => !(r.fields || {}).voided);
    if (!mine.length) { $('mine').hidden = true; return; }
    const d = new Date(date + 'T12:00:00').toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric' });
    $('mine').innerHTML = `<div class="mine-hd">${esc(fill(t(L.mineHd), { d }))}</div>` + mine.map((r) => {
      const f = r.fields || {};
      const on = isFarmEntry(f) ? fill(t(L.farmLabel), { f: farmsLabel(entryFarms(f), f.farmName) })
        : (f.uids || []).map((u) => tail(u.uid)).join(' ') || t(L.noUid);
      const time = f.start && f.end ? `${f.start}–${f.end} · ` : '';
      return `<div class="mine-row"><div class="what">${esc(f.employeeName)} · ${esc(procTitle(f.process))}
          <span class="s">${esc(time + on)}</span></div>
        <span class="h">${fmtH(num(f.hours))} h</span>
        <button type="button" class="del-btn" data-del="${r.id}">${esc(t(L.delete))}</button></div>`;
    }).join('');
    $('mine').hidden = false;
  }
  $('mine').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-del]');
    if (!b) return;
    if (!(await voidEntry(mine.find((r) => r.id === b.dataset.del), b))) return;
    toast(t(L.deleted));
    loadMine();
  });
  $('date').addEventListener('change', loadMine);
  loadMine();

  // ── Timeline ────────────────────────────────────────────────────────────
  // Each person's day: Connecteam clock-ins (data/connecteam_shifts.json,
  // from the hourly sync) as a track, Labor Log entries that have start/end
  // drawn on it, and any clocked time no entry covers hatched — tap a hatched
  // stretch to log it (opens Log time with the person, date and times
  // filled in). Entries saved with hours only count toward Logged but can't
  // be placed. Times are the viewer's local time.
  let shiftData = null, shiftsLoading = null;
  const loadShifts = () => shiftsLoading || (shiftsLoading = getJson('connecteam_shifts.json').then((d) => { shiftData = d; return d; }));
  const hhmm = (m) => { const x = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
  const toMin = (s) => { const [h, mi] = String(s || '').split(':').map(Number); return Number.isFinite(h) && Number.isFinite(mi) ? h * 60 + mi : null; };
  const dayStart = (d) => new Date(d + 'T00:00:00');
  // Union of [a,b) minute intervals, merged and sorted.
  const union = (iv) => iv.slice().sort((x, y) => x[0] - y[0]).reduce((o, [a, b]) => {
    if (o.length && a <= o[o.length - 1][1]) o[o.length - 1][1] = Math.max(o[o.length - 1][1], b); else o.push([a, b]);
    return o;
  }, []);
  // Parts of `iv` not covered by `cover`; pieces under 5 minutes are noise.
  const minus = (iv, cover) => {
    const out = [];
    union(iv).forEach(([a, b]) => {
      let cur = a;
      union(cover).forEach(([c, d]) => { if (d <= cur || c >= b) return; if (c > cur) out.push([cur, c]); cur = Math.max(cur, d); });
      if (cur < b) out.push([cur, b]);
    });
    return out.filter(([a, b]) => b - a >= 5);
  };

  $('tl-date').value = localDay();
  $('tl-q').placeholder = t(L.tlSearch);
  $('tl-only-l').textContent = t(L.tlOnly);
  $('tl-legend').innerHTML = [
    ['background:var(--surface2);border:1px solid #2d323d', L.tlKeyShift],
    ['background:var(--blue)', L.tlKeyEntry],
    ['border:1px solid var(--gold);background:repeating-linear-gradient(45deg,rgba(212,168,67,.55) 0 3px,transparent 3px 7px)', L.tlKeyGap],
    ['border:2px solid var(--red)', L.tlKeyOut]
  ].map(([css, l]) => `<span><i class="tl-key" style="${css}"></i>${esc(t(l))}</span>`).join('');
  const shiftDay = (n) => { const d = dayStart($('tl-date').value || localDay()); d.setDate(d.getDate() + n); $('tl-date').value = localDay(d); loadTimeline(); };
  $('tl-prev').onclick = () => shiftDay(-1);
  $('tl-next').onclick = () => shiftDay(1);
  $('tl-date').addEventListener('change', loadTimeline);
  $('tl-q').addEventListener('input', () => renderTimeline());
  $('tl-only').addEventListener('change', () => renderTimeline());

  let tlEntries = [], tlSeq = 0;
  async function loadTimeline() {
    const seq = ++tlSeq;
    const date = $('tl-date').value || localDay();
    $('tl-body').innerHTML = `<div class="empty-big">${esc(t(L.loading))}</div>`;
    const client = getClient();
    const [shifts, res] = await Promise.all([loadShifts(), client
      ? client.from('operations_forms').select('*').eq('station_key', ENTRY_KEY).eq('status', 'submitted').eq('work_date', date).range(0, 4999)
      : Promise.resolve({ data: [] })]);
    if (seq !== tlSeq) return;
    tlEntries = ((res && res.data) || []).filter((r) => !(r.fields || {}).voided);
    renderTimeline(shifts);
  }

  function renderTimeline() {
    const date = $('tl-date').value || localDay();
    const day0 = dayStart(date).getTime();
    const nowMin = (Date.now() - day0) / 60000;
    const isToday = date === localDay();
    if (!shiftData || !Array.isArray(shiftData.shifts)) $('tl-note').textContent = t(L.tlNoData);
    else $('tl-note').textContent = fill(t(L.tlNote), { t: new Date(shiftData.last_sync).toLocaleString() });

    // People: everyone clocked in that day, plus anyone with an entry.
    const rows = new Map();
    const rowFor = (key, name, userId) => rows.get(key) || rows.set(key, { key, name, userId, shifts: [], shiftInfo: [], places: new Set(), timed: [], untimed: 0, logged: 0, open: false }).get(key);
    ((shiftData && shiftData.shifts) || []).forEach((sh) => {
      const a = (Date.parse(sh.start) - day0) / 60000;
      const openShift = !sh.end;
      const b = openShift ? (isToday ? nowMin : a) : (Date.parse(sh.end) - day0) / 60000;
      if (!(b > 0 && a < 1440) || b <= a) return;
      const row = rowFor(String(sh.userId), sh.name, String(sh.userId));
      row.shifts.push([Math.max(0, a), Math.min(1440, b)]);
      // Where they clocked in: the Connecteam job, else the time clock's name.
      const place = sh.job || sh.clock || '';
      row.shiftInfo.push({ a: Math.max(0, a), b: Math.min(1440, b), place });
      if (place) row.places.add(place);
      if (openShift && isToday) row.open = true;
    });
    tlEntries.forEach((r) => {
      const f = r.fields || {};
      const key = f.employeeId ? String(f.employeeId) : 'name:' + fold(f.employeeName);
      const row = rowFor(key, f.employeeName, f.employeeId || '');
      row.logged += num(f.hours);
      const a = toMin(f.start), b0 = toMin(f.end);
      if (a == null || b0 == null) { row.untimed += num(f.hours); return; }
      const b = b0 <= a ? b0 + 1440 : b0;   // past midnight
      row.timed.push({ a, b, f });
    });

    let list = [...rows.values()].map((row) => {
      const clocked = union(row.shifts).reduce((x, [a, b]) => x + (b - a), 0) / 60;
      const timedIv = row.timed.map((e) => [e.a, e.b]);
      return { ...row, clocked, unalloc: Math.max(0, clocked - row.logged),
               gaps: minus(row.shifts, timedIv), outside: row.shifts.length ? minus(timedIv, row.shifts) : [] };
    });
    // Team numbers before filtering, so the totals don't move with the search.
    const tot = list.reduce((o, r) => ({ c: o.c + r.clocked, l: o.l + r.logged, u: o.u + r.unalloc }), { c: 0, l: 0, u: 0 });
    const pct = tot.c ? Math.min(1, (tot.c - tot.u) / tot.c) : null;
    const stat = (k, v, cls) => `<div class="tl-stat ${cls || ''}"><div class="k">${esc(t(k))}</div><div class="v">${v}</div></div>`;
    $('tl-hero').innerHTML = stat(L.tlPeople, list.length) + stat(L.tlClocked, fmtNum(tot.c, 1) + ' h') + stat(L.tlLogged, fmtNum(tot.l, 1) + ' h') +
      stat(L.tlUnalloc, fmtNum(tot.u, 1) + ' h', tot.u > 0.25 ? 'warn' : list.length ? 'ok' : '') + stat(L.tlPct, pct == null ? '—' : fmtPct(pct, 0));

    const q = fold($('tl-q').value.trim());
    if (q) list = list.filter((r) => fold(r.name).includes(q) || [...r.places].some((p) => fold(p).includes(q)));
    if ($('tl-only').checked) list = list.filter((r) => r.unalloc > 0.25);
    list.sort((x, y) => (y.unalloc > 0.25) - (x.unalloc > 0.25) || y.unalloc - x.unalloc || x.name.localeCompare(y.name));
    if (!rows.size) { $('tl-body').innerHTML = `<div class="empty-big">${esc(t(L.tlEmpty))}</div>`; return; }
    if (!list.length) { $('tl-body').innerHTML = `<div class="empty-big">${esc(t($('tl-only').checked ? L.tlAllDone : L.empty))}</div>`; return; }

    // Hour range: whole hours around everything on screen.
    let lo = 1440, hi = 0;
    list.forEach((r) => [...r.shifts, ...r.timed.map((e) => [e.a, e.b])].forEach(([a, b]) => { lo = Math.min(lo, a); hi = Math.max(hi, b); }));
    if (lo >= hi) { lo = 360; hi = 1080; }
    lo = Math.max(0, Math.floor(lo / 60) * 60); hi = Math.min(1440 * 2, Math.ceil(hi / 60) * 60);
    if (hi - lo < 240) hi = Math.min(1440 * 2, lo + 240);
    const span = hi - lo;
    const X = (m) => ((Math.max(lo, Math.min(hi, m)) - lo) / span * 100).toFixed(3) + '%';
    const W = (a, b) => ((Math.min(hi, b) - Math.max(lo, a)) / span * 100).toFixed(3) + '%';
    const step = span > 14 * 60 ? 120 : 60;
    const ticks = [];
    for (let m = lo; m <= hi; m += 60) ticks.push(m);
    const tickHtml = (withLabel) => ticks.map((m) => `<div class="tick" style="left:${X(m)}">${withLabel && (m - lo) % step === 0 && m < hi ? `<span>${hhmm(m)}</span>` : ''}</div>`).join('');
    const nowLine = isToday && nowMin > lo && nowMin < hi ? `<div class="now" style="left:${X(nowMin)}"></div>` : '';

    tlTips = [];
    const tip = (html) => { tlTips.push(html); return tlTips.length - 1; };
    const html = [`<div class="hd">${esc(t(L.colPerson))}</div><div class="hd axis">${tickHtml(true)}</div>
      <div class="hd num">${esc(t(L.tlClocked))}</div><div class="hd num">${esc(t(L.tlLogged))}</div><div class="hd num">${esc(t(L.tlUnalloc))}</div>`];
    list.forEach((r, ri) => {
      const segs = [];
      r.shiftInfo.slice().sort((x, y) => x.a - y.a).forEach(({ a, b, place }) => segs.push(`<div class="seg shift" style="left:${X(a)};width:${W(a, b)}" data-tip="${tip(
        esc(fill(t(L.tlShiftTip), { a: hhmm(a), b: b === nowMin ? '…' : hhmm(b), h: fmtNum((b - a) / 60, 2) })) + (place ? '<br>' + esc(fill(t(L.tlAt), { p: place })) : ''))}"></div>`));
      r.timed.forEach((e) => {
        const f = e.f;
        const label = [procTitle(f.process), isFarmEntry(f) ? farmsLabel(entryFarms(f), f.farmName) : (f.uids || []).map((u) => tail(u.uid)).join(' ')].filter(Boolean).join(' · ');
        segs.push(`<div class="seg entry" style="left:${X(e.a)};width:${W(e.a, e.b)}" data-tip="${tip(
          `<b>${esc(f.start)}–${esc(f.end)}</b> · ${fmtH(num(f.hours))} h<br>${esc(procTitle(f.process))}<br>${isFarmEntry(f) ? esc(fill(t(L.farmLabel), { f: farmsLabel(entryFarms(f), f.farmName) })) : (f.uids || []).map((u) => `<b>${esc(tail(u.uid))}</b> ${esc(u.strain || '')}`).join('<br>') || `<span class="s">${esc(t(L.noUid))}</span>`}${f.notes ? `<br><span class="s">${esc(f.notes)}</span>` : ''}`)}">${esc(label)}</div>`);
      });
      r.outside.forEach(([a, b]) => segs.push(`<div class="seg outside" style="left:${X(a)};width:${W(a, b)}"></div>`));
      r.gaps.forEach(([a, b]) => segs.push(`<button type="button" class="seg gap" style="left:${X(a)};width:${W(a, b)}" aria-label="${esc(fill(t(L.tlGapTip), { a: hhmm(a), b: hhmm(b), h: fmtNum((b - a) / 60, 2) }))}"
        data-row="${ri}" data-a="${Math.round(a)}" data-b="${Math.round(b)}" data-tip="${tip(esc(fill(t(L.tlGapTip), { a: hhmm(a), b: hhmm(b), h: fmtNum((b - a) / 60, 2) })))}"></button>`));
      const sub = [r.places.size ? `<span style="color:var(--text)">${esc([...r.places].join(', '))}</span>` : '',
                   r.open ? `<span style="color:var(--green)">● ${esc(t(L.tlOnClock))}</span>` : '',
                   !r.userId ? esc(t(L.tlNotCt)) : '',
                   r.untimed ? esc(fill(t(L.tlNoTimes), { h: fmtH(r.untimed) })) : ''].filter(Boolean).join(' · ');
      html.push(`<div class="who"><span>${esc(r.name)}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div>
        <div class="lane">${tickHtml(false)}${segs.join('')}${nowLine}</div>
        <div class="num">${r.clocked ? fmtNum(r.clocked, 2) : '—'}</div><div class="num">${fmtNum(r.logged, 2)}</div>
        <div class="num ${r.unalloc > 0.25 ? 'warn' : ''}">${r.clocked ? fmtNum(r.unalloc, 2) : '—'}</div>`);
    });
    tlRows = list;
    $('tl-body').innerHTML = `<div class="tl-wrap"><div class="tl">${html.join('')}</div></div>`;
  }

  // Tooltip, and tapping a not-logged stretch to log it.
  let tlTips = [], tlRows = [];
  const tipEl = $('tl-tip');
  function showTip(el, x, y) {
    tipEl.innerHTML = tlTips[+el.dataset.tip] || '';
    tipEl.style.display = 'block';
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 12)) + 'px';
    tipEl.style.top = (y + h + 20 > window.innerHeight ? y - h - 12 : y + 16) + 'px';
  }
  $('tl-body').addEventListener('mousemove', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tipEl.style.display = 'none'; });
  $('tl-body').addEventListener('mouseleave', () => { tipEl.style.display = 'none'; });
  $('tl-body').addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom); } });
  $('tl-body').addEventListener('focusout', () => { tipEl.style.display = 'none'; });
  $('tl-body').addEventListener('click', (e) => {
    const g = e.target.closest('button.gap');
    if (!g) return;
    const r = tlRows[+g.dataset.row];
    tipEl.style.display = 'none';
    people = [r.userId ? (roster.find((p) => p.userId === r.userId) || { userId: r.userId, name: r.name }) : { userId: '', name: r.name }];
    renderPeople();
    $('date').value = $('tl-date').value;
    $('start').value = hhmm(+g.dataset.a);
    $('end').value = hhmm(+g.dataset.b);
    fromTimes();
    showTab('log');
    window.scrollTo(0, 0);
    $('process').focus();
  });

  showTab(['list', 'timeline'].includes(params.get('tab')) ? params.get('tab') : 'log');
  await rosterReady;
  renderPeople();
})();
</script>
</body>
</html>
