  }

  // ── Daily summary (station.dailySummary) ──────────────────────────────────
  // The hand-kept notebook page: for one day, every employee # down the side,
  // every flavor page across the top, grams in each cell, totals both ways.
  // Built from every form on this station for that date (drafts and
  // submitted, anyone's), with this page's live values in place of its last
  // autosave so the numbers move as the scale readings are typed in.
  // `var`, not `let`: recompute() calls scheduleSummary() during the first
  // render, before this block has run.
  var SUM = { rows: [], date: null, timer: null, names: {} };
  const SM = {
    title:  { en: 'Daily Summary — by Employee', es: 'Resumen del día — por empleado' },
    hint:   { en: 'Every smalls page for the day, in grams. Open pages included.', es: 'Todas las hojas de smalls del día, en gramos. Incluye hojas abiertas.' },
    emp:    { en: 'Employee #', es: 'N.º empl.' },
    name:   { en: 'Name', es: 'Nombre' },
    total:  { en: 'Total g', es: 'Total g' },
    totalLb:{ en: 'Total lbs', es: 'Total lbs' },
    lbs:    { en: 'lbs', es: 'lbs' },
    allEmp: { en: 'Total', es: 'Total' },
    none:   { en: 'Nothing weighed out yet for this day.', es: 'Aún no hay nada pesado para este día.' },
    open:   { en: 'open', es: 'abierta' }
  };

  async function loadSummary(date) {
    SUM.date = date;
    const req = SUM.req = (SUM.req || 0) + 1;
    // Rows stamped with their own day (`dateCol`) can belong to a page
    // started days earlier, so look back over the pages from the last few
    // weeks rather than only the ones dated that day.
    const cfg = station.dailySummary;
    const [rows, names] = await Promise.all([cfg.dateCol
      ? listStationRange(station.key, shiftDate(date, -45), date)
      : listToday(date), loadBadgeNames()]);
    SUM.names = names;
    if (SUM.req !== req) return;   // a newer load was started meanwhile
    SUM.rows = rows.filter((r) => r.station_key === station.key);
    renderSummary();
  }

  function scheduleSummary() {
    if (!station.dailySummary || typeof SUM === 'undefined') return;
    clearTimeout(SUM.timer);
    SUM.timer = setTimeout(renderSummary, 250);
  }

  function renderSummary() {
    const cfg = station.dailySummary;
    const box = document.getElementById('summary');
    if (!cfg || !draftsOn || !SUM.date) return;
    box.style.display = 'block';
    // Keep this page's chip label in step with the strain being typed.
    const onChip = document.querySelector('#switcher .chip.on .cv');
    if (onChip && values.strain) onChip.textContent = values.strain;
    const onUid = document.querySelector('#switcher .chip.on .cs');
    if (onUid && values.sourceUid) onUid.textContent = `…${String(values.sourceUid).slice(-4)}`;

    // Pages for the day: saved rows, with this page swapped for its live values.
    const pages = SUM.rows.filter((r) => r.id !== draftId)
      .map((r) => ({ id: r.id, status: r.status, f: r.fields || {}, strain: r.strain || (r.fields || {}).strain }));
    if (cfg.dateCol || (values.date || todayStr()) === SUM.date) pages.push({ id: draftId, status: editMode ? 'submitted' : 'draft', f: values, strain: values.strain, cur: true });
    const { used, emps, grid, extra, colTot, empTot, all, inLb, dp } = dailySummaryGrid(cfg, pages, SUM.date, (p) => p.cur);
    // Name beside each employee # (Labor Rates → Badge #); blank for a badge
    // nobody has mapped, or a row logged by name (Bucking's who).
    const nameOf = (e) => SUM.names[badgeKey(e)] || '';

    const head = `<div class="sum-head"><div><h2>${t(cfg.title || SM.title)}</h2><div class="hint">${t(cfg.hint || SM.hint)}</div></div>` +
      `<input type="date" id="sum-date" value="${escapeAttr(SUM.date)}"></div>`;
    if (!emps.length && !extra) {
      box.innerHTML = head + `<div class="sum-empty">${t(SM.none)}</div>`;
    } else {
      const uid4 = (p) => p.f.sourceUid ? `…${String(p.f.sourceUid).slice(-4)}` : '';
      const lbCol = (g) => inLb ? '' : `<td class="tot">${fmtNum(g / G_PER_LB, 2)}</td>`;
      box.innerHTML = head + `<div class="li-scroll"><table class="sum-table"><thead><tr><th>${t(cfg.empLabel || SM.emp)}</th><th class="name">${t(SM.name)}</th>` +
        used.map((p) => `<th class="${p.cur ? 'cur' : ''}">${escapeHtml(p.strain || t(SW.untitled))}<br>${escapeHtml(uid4(p))}${p.status === 'draft' ? ` · ${t(SM.open)}` : ''}</th>`).join('') +
        `<th class="tot">${t(inLb ? SM.totalLb : SM.total)}</th>${inLb ? '' : `<th class="tot">${t(SM.lbs)}</th>`}</tr></thead><tbody>` +
        emps.map((e) => `<tr><td>${escapeHtml(e)}</td><td class="name">${escapeHtml(nameOf(e))}</td>` +
          used.map((p) => grid[e][p.id] ? `<td>${fmtNum(grid[e][p.id], dp)}</td>` : '<td class="zero">·</td>').join('') +
          `<td class="tot">${fmtNum(empTot(e), dp)}</td>${lbCol(empTot(e))}</tr>`).join('') +
        // Bucking's recovered from leaf: nobody's, its own row under the people.
        (extra ? `<tr><td></td><td class="name">${t(extra.l)}</td>` +
          used.map((p) => extra.of(p) ? `<td>${fmtNum(extra.of(p), dp)}</td>` : '<td class="zero">·</td>').join('') +
          `<td class="tot">${fmtNum(extra.total, dp)}</td>${lbCol(extra.total)}</tr>` : '') +
        `</tbody><tfoot><tr><td>${t(SM.allEmp)}</td><td></td>` + used.map((p) => `<td>${fmtNum(colTot(p), dp)}</td>`).join('') +
        `<td class="tot">${fmtNum(all, dp)}</td>${lbCol(all)}</tr></tfoot></table></div>`;
    }
    document.getElementById('sum-date').addEventListener('change', (ev) => { if (ev.target.value) loadSummary(ev.target.value); });
  }

  // ── Submit ────────────────────────────────────────────────────────────────
  const banner = document.getElementById('banner');
  const ED = {
    save:     { en: 'Save changes', es: 'Guardar cambios' },
    saved:    { en: '✓ Changes saved', es: '✓ Cambios guardados' },
    back:     { en: '← Intakes', es: '← Recepciones' },
    backToday: { en: '← Today', es: '← Hoy' },
    editing:  { en: 'Editing a submitted form from', es: 'Editando un formulario enviado del' },
    notFound: { en: 'This record could not be found, or it hasn’t been submitted yet.', es: 'No se encontró este registro, o aún no se ha enviado.' }
  };
  const btn = document.getElementById('submit-btn');
  btn.textContent = t(UI.submit);

  async function uploadPhotoDirect(fieldKey, photoValue) {
    if (!photoValue || !photoValue.dataUrl) return null;
    try {
      const res = await fetch('/.netlify/functions/upload-operations-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stationKey: station.key, id: draftId, fieldKey, dataUrl: photoValue.dataUrl })
      });
      const data = await res.json().catch(() => ({}));
      return res.ok && data.ok ? data.url : null;
    } catch { return null; }
  }

  btn.addEventListener('click', async () => {
    banner.className = 'banner';
    form.querySelectorAll('.field.invalid').forEach((e) => e.classList.remove('invalid'));

    // Pull in the other tablets' last rows before closing the page out.
    if (entryFields.length && draftsOn && !editMode) {
      const saved = await getDraft(draftId);
      if (saved && saved.status === 'submitted') { closedElsewhere(); return; }
      if (saved && mergeEntries(saved.fields || {})) {
        banner.className = 'banner warn';
        banner.textContent = t({ en: 'Rows from another tablet were just added — check the totals, then submit again.',
                                 es: 'Se acaban de agregar filas de otra tableta — revise los totales y envíe de nuevo.' });
        return;
      }
    }

    const missing = station.fields.filter((f) => {
      if (!f.req || f.t === 'calc') return false;
      if (f.showIf && !f.showIf(values)) return false;
      const v = values[f.k];
      if (f.t === 'lineitems') return !(v || []).some((r) => rowHasData(f, r)) || !!lineProblem(f);
      return v === undefined || v === null || v === '';
    });
    if (missing.length) {
      missing.forEach((f) => els[f.k] && els[f.k].classList.add('invalid'));
      banner.className = 'banner error';
      const lp = missing.map((f) => f.t === 'lineitems' && lineProblem(f)).find(Boolean);
      banner.textContent = lp || t(UI.required);
      els[missing[0].k].scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    btn.disabled = true;
    btn.textContent = t(UI.submitting);
    clearTimeout(autosaveTimer);
    submittedHere = true;

    // The project gets this form's packages first, so the record saves
    // knowing which project has them (an offline submit retries the link
    // when it goes through).
    await syncProjectLink(true);
    await syncCrewToSchedule(true);
    // Drop empty worksheet rows before sending.
    syncProjectName();
    const payload = { ...values };
    delete payload._deleted;
    // Row numbers count only the rows that are kept: 1, 2, 3… with no gaps.
    station.fields.filter((f) => f.t === 'lineitems').forEach((f) => {
      const nums = f.cols.filter((c) => c.t === 'rownum');
      payload[f.k] = (payload[f.k] || []).filter((r) => rowHasData(f, r))
        .map((r, i) => nums.length ? { ...r, ...Object.fromEntries(nums.map((c) => [c.k, i + 1])) } : r);
    });

    let result;
    if (editMode) {
      for (const f of station.fields) {
        if (f.t === 'photo' && payload[f.k] && payload[f.k].dataUrl) {
          payload[f.k] = await uploadPhotoDirect(f.k, payload[f.k]);
        }
      }
      // Start from the stored record so anything the form doesn't show
      // (older fields, extra keys) survives the save.
      Object.keys(editRec && editRec.fields || {}).forEach((k) => { if (!(k in payload)) payload[k] = editRec.fields[k]; });
      payload.lastEditedBy = owner;
      payload.lastEditedAt = new Date().toISOString();
      // A correction can add rows for another UID — those become new records
      // of their own (saved first, so a failure leaves the original as it was).
      let ures = { ok: true };
      for (const r of splitRecords(payload, editId).reverse()) {
        ures = r.id === editId
          ? await updateSubmitted(editId, { strain: r.fields.strain || null, date: r.fields.date || todayStr(), fields: r.fields, editor: owner })
          : await submitDraft(r.id, { stationKey: station.key, owner: (editRec && editRec.owner_user) || owner,
              strain: r.fields.strain || null, date: r.fields.date || todayStr(), fields: r.fields });
        if (!ures.ok) break;
      }
      btn.disabled = false;
      btn.textContent = t(ED.save);
      if (ures.ok) {
        banner.className = 'banner success';
        banner.textContent = t(ED.saved);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (editRec && values.date) editRec.work_date = values.date;   // back to the day it's on now
        setTimeout(() => { location.href = editBack(editId); }, 1000);
      } else {
        banner.className = 'banner error';
        banner.textContent = ures.reason || t(UI.failed);
      }
      return;
    } else if (draftsOn) {
      for (const f of station.fields) {
        if (f.t === 'photo' && payload[f.k] && payload[f.k].dataUrl) {
          payload[f.k] = await uploadPhotoDirect(f.k, payload[f.k]);
        }
      }
      // The draft's own row goes last, so a submit that fails partway leaves
      // it a draft rather than half-submitted.
      pendingSubmits = splitRecords(payload, draftId).reverse().map((r) => ({
        id: r.id,
        submitFields: { stationKey: station.key, owner, strain: r.fields.strain || null, date: r.fields.date || todayStr(), fields: r.fields }
      }));
      const sres = await flushPending();
      if (sres.ok) {
        result = { ok: true };
        localStorage.removeItem(mirrorKey());
      } else if (!navigator.onLine) {
        // No signal right now — the values are already safe in the local
        // mirror; mark it as a pending submit (not just a pending autosave)
        // so reconnecting finishes the submit instead of leaving it a draft.
        localStorage.setItem(mirrorKey(), JSON.stringify({ ...draftPayload(), fields: payload, pendingSubmit: true, pending: pendingSubmits, savedAt: Date.now() }));
        result = { ok: true, queued: true };
      } else {
        result = { ok: false, error: sres.reason };
      }
    } else {
      for (const r of splitRecords(payload, draftId)) {
        result = await submitOperations(station.key, r.fields);
        if (!result.ok) break;
      }
    }

    btn.disabled = false;
    btn.textContent = t(UI.submit);
    if (!result.ok) submittedHere = false;

    if (result.ok) {
      banner.className = result.queued ? 'banner warn' : 'banner success';
      banner.textContent = result.queued ? t(UI.queued) : t(UI.submitted);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // `share` (Harvest): the send-on-WhatsApp window instead; its New form
      // button starts the next one.
      if (station.share) openShare(payload);
      else if (!result.queued) {
        // Start clean rather than reloading back into the just-finished draft.
        setTimeout(() => { location.href = `/ops_form.html?station=${station.key}`; }, 1400);
      }
      // Queued: stay put — attemptPendingSubmit finishes it in the background
      // the moment signal returns, and redirects itself once it does.
    } else {
      banner.className = 'banner error';
      banner.textContent = result.error || t(UI.failed);
    }
  });

  // A submit that couldn't reach the server while offline retries here —
  // on reconnect, and as a periodic safety net in case the 'online' event
  // doesn't fire (some tablets are unreliable about it).
  // Each pending record has a fixed id, so retrying one that already landed
  // just overwrites it with the same values.
  let pendingSubmits = [];
  async function flushPending() {
    while (pendingSubmits.length) {
      const sres = await submitDraft(pendingSubmits[0].id, pendingSubmits[0].submitFields);
      if (!sres.ok) return sres;
      pendingSubmits.shift();
    }
    return { ok: true };
  }
  // ── Send the load on WhatsApp (station.share — Harvest) ──────────────────
  // After submit: a picture of the load laid out like the crew's notebook (a
  // column per strain, its bins down it) and a CSV with a row per bin, handed
  // to the phone's share sheet in one tap — pick WhatsApp and the chat. The
  // share sheet has to be opened from a tap, so it's a button in this window
  // rather than automatic. Where the browser can't share files (a desktop),
  // the two files download and WhatsApp opens with a text summary.
  const SH = {
    title:   { en: 'Harvest saved — send it', es: 'Cosecha guardada — envíela' },
    queued:  { en: 'Saved on this phone — it sends when there’s signal. You can still share it now.', es: 'Guardada en este teléfono — se envía cuando haya señal. Igual puede compartirla ahora.' },
    send:    { en: 'Send on WhatsApp', es: 'Enviar por WhatsApp' },
    files:   { en: 'Picture of the load + CSV of every bin', es: 'Foto de la carga + CSV de cada bin' },
    next:    { en: 'New harvest form', es: 'Nuevo formulario de cosecha' },
    fallback:{ en: 'This browser can’t share files — they were downloaded; attach them in WhatsApp.', es: 'Este navegador no puede compartir archivos — se descargaron; adjúntelos en WhatsApp.' },
    load:    { en: 'Harvest load', es: 'Carga de cosecha' },
    driver:  { en: 'Driver', es: 'Conductor' },
    plate:   { en: 'Plate', es: 'Placa' },
    truck:   { en: 'Truck #', es: 'Camión' },
    license: { en: 'License', es: 'Licencia' },
    src:     { en: 'Source', es: 'Origen' },
    xfer:    { en: 'Transfer', es: 'Transferencia' },
    loc:     { en: 'Location', es: 'Ubicación' },
    total:   { en: 'Total', es: 'Total' },
    plants:  { en: 'plants', es: 'plantas' },
    bins:    { en: 'bins', es: 'bins' },
    ff:      { en: 'FRESH FROZEN', es: 'FRESCO CONGELADO' }
  };
  let shareOpen = false;
  const licenseLabel = (pid) => {
    const o = refOptions(reference, 'properties').find((x) => x.v === pid);
    return o ? o.label : (pid || '—');
  };
  function shareLots(rows) {
    const lots = new Map();
    rows.forEach((r) => {
      const k = r._lot || r.sourceUid;
      if (!lots.has(k)) lots.set(k, { pid: r.pid, strain: r.strain, sourceUid: r.sourceUid, transferUid: r.transferUid, location: r.location, bins: [] });
      lots.get(k).bins.push(r);
    });
    return [...lots.values()];
  }
  function shareCsv(p, rows) {
    const q = (v) => { const x = v === undefined || v === null ? '' : String(v); return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; };
    const head = ['Date', 'License', 'Strain', 'Source UID', 'Transfer UID', 'Location', 'Bin', 'Wet Weight (lbs)', 'Plant Count',
      'Fresh Frozen', 'Driver', 'Driver ID #', 'License Plate', 'Truck #', 'Team Lead'];
    const lines = rows.map((r) => [p.date, licenseLabel(r.pid), r.strain, r.sourceUid, r.transferUid, r.location, r.bin,
      r.weight, r.plantCount, p.freshFrozen ? 'Yes' : 'No', p.driver, p.driverIdNumber, p.licensePlate, p.truckNo, p.teamLead]);
    return [head, ...lines].map((l) => l.map(q).join(',')).join('\r\n') + '\r\n';
  }
  function shareImage(p, rows) {
    const W = 1080, PAD = 40, COLS = 3, CW = (W - PAD * 2) / COLS, LH = 34;
    const lots = shareLots(rows);
    const byLic = new Map();
    lots.forEach((l) => { if (!byLic.has(l.pid)) byLic.set(l.pid, []); byLic.get(l.pid).push(l); });
    const colH = (l) => LH * (5 + l.bins.length + 2);
    let H = PAD + LH * 5;
    byLic.forEach((ls) => {
      H += LH * 1.6;
      for (let i = 0; i < ls.length; i += COLS) H += Math.max(...ls.slice(i, i + COLS).map(colH)) + LH * 0.5;
    });
    H += LH * 3 + PAD;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = Math.ceil(H);
    const x = cv.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
    const txt = (s, X, Y, font, color = '#111', align = 'left') => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(String(s ?? ''), X, Y); };
    const SANS = '-apple-system, Segoe UI, Roboto, sans-serif', MONO = 'ui-monospace, Menlo, Consolas, monospace';
    let y = PAD + 30;
    txt(`${t(SH.load)} — ${p.date || ''}`, PAD, y, `bold 38px ${SANS}`);
    if (p.freshFrozen) txt(t(SH.ff), W - PAD, y, `bold 28px ${SANS}`, '#1565c0', 'right');
    y += LH * 1.4;
    txt(`${t(SH.driver)}: ${p.driver || '—'}${p.driverIdNumber ? ` (ID ${p.driverIdNumber})` : ''}`, PAD, y, `26px ${SANS}`);
    y += LH;
    txt(`${t(SH.plate)}: ${p.licensePlate || '—'}${p.truckNo ? `   ·   ${t(SH.truck)}: ${p.truckNo}` : ''}${p.teamLead ? `   ·   ${p.teamLead}` : ''}`, PAD, y, `26px ${SANS}`);
    y += LH * 1.2;
    byLic.forEach((ls, pid) => {
      y += LH * 0.6;
      x.fillStyle = '#e8f5e9'; x.fillRect(PAD - 10, y - 30, W - PAD * 2 + 20, LH * 1.2);
      txt(`${t(SH.license)}: ${licenseLabel(pid)}`, PAD, y, `bold 28px ${SANS}`, '#1b5e20');
      y += LH * 1.0;
      for (let i = 0; i < ls.length; i += COLS) {
        const row = ls.slice(i, i + COLS);
        row.forEach((l, j) => {
          const X = PAD + j * CW, w = CW - 20;
          let yy = y + LH;
          txt(l.strain || '—', X, yy, `bold 28px ${SANS}`);
          yy += LH; txt(`${t(SH.src)} ${l.sourceUid || ''}`, X, yy, `17px ${MONO}`, '#444');
          yy += LH * 0.8; txt(`${t(SH.xfer)} ${l.transferUid || ''}`, X, yy, `17px ${MONO}`, '#444');
          yy += LH * 0.9; txt(l.location ? `${t(SH.loc)}: ${l.location}` : '', X, yy, `22px ${SANS}`, '#444');
          yy += LH * 0.3;
          l.bins.forEach((b) => {
            yy += LH;
            txt(b.bin, X, yy, `22px ${MONO}`, '#888');
            txt(fmtNum(b.weight, 2), X + 150, yy, `26px ${MONO}`, '#111', 'right');
            if (Number(b.plantCount) > 0) txt(`${fmtNum(b.plantCount, 0)} pl`, X + w, yy, `20px ${MONO}`, '#666', 'right');
          });
          yy += LH * 0.5;
          x.fillStyle = '#111'; x.fillRect(X, yy - 6, w, 2);
          const lb = l.bins.reduce((a, b) => a + (Number(b.weight) || 0), 0);
          const pl = l.bins.reduce((a, b) => a + (Number(b.plantCount) || 0), 0);
          yy += LH * 0.8;
          txt(fmtNum(lb, 2), X + 150, yy, `bold 28px ${MONO}`, '#111', 'right');
          txt(`${fmtNum(pl, 0)} ${t(SH.plants)}`, X + w, yy, `bold 22px ${SANS}`, '#111', 'right');
          if (j) { x.fillStyle = '#ddd'; x.fillRect(X - 12, y + 6, 2, colH(l) - LH); }
        });
        y += Math.max(...row.map(colH)) + LH * 0.5;
      }
    });
    const lb = rows.reduce((a, r) => a + (Number(r.weight) || 0), 0);
    const pl = rows.reduce((a, r) => a + (Number(r.plantCount) || 0), 0);
    y += LH;
    x.fillStyle = '#111'; x.fillRect(PAD, y - 30, W - PAD * 2, 3);
    y += LH * 0.4;
    txt(`${t(SH.total)}: ${fmtNum(lb, 2)} lbs · ${fmtNum(pl, 0)} ${t(SH.plants)} · ${rows.filter((r) => Number(r.weight) > 0).length} ${t(SH.bins)}`, PAD, y, `bold 30px ${SANS}`);
    return new Promise((res) => cv.toBlob(res, 'image/png'));
  }
  function shareSummary(p, rows) {
    const lots = shareLots(rows);
    return [`${t(SH.load)} ${p.date || ''}${p.freshFrozen ? ` — ${t(SH.ff)}` : ''}`,
      `${t(SH.driver)}: ${p.driver || '—'}${p.driverIdNumber ? ` (ID ${p.driverIdNumber})` : ''} · ${t(SH.plate)}: ${p.licensePlate || '—'}`,
      ...lots.map((l) => `${licenseLabel(l.pid)} · ${l.strain}: ${fmtNum(l.bins.reduce((a, b) => a + (Number(b.weight) || 0), 0), 2)} lbs, ` +
        `${fmtNum(l.bins.reduce((a, b) => a + (Number(b.plantCount) || 0), 0), 0)} ${t(SH.plants)} (${t(SH.xfer)} ${l.transferUid || '—'})`)].join('\n');
  }
  function openShare(payload) {
    shareOpen = true;
    const rows = payload[station.splitBy] || [];
    const base = `harvest_${payload.date || todayStr()}${payload.licensePlate ? '_' + String(payload.licensePlate).replace(/[^A-Za-z0-9]/g, '') : ''}`;
    const csv = shareCsv(payload, rows);
    const imgP = shareImage(payload, rows);
    const ov = document.createElement('div');
    ov.className = 'share-ov';
    ov.innerHTML = `<div class="share-box"><h2>${escapeHtml(t(SH.title))}</h2>` +
      (navigator.onLine ? '' : `<p class="share-note">${escapeHtml(t(SH.queued))}</p>`) +
      `<img class="share-prev" alt="">` +
      `<p class="share-note">${escapeHtml(t(SH.files))}</p>` +
      `<button type="button" class="share-go">${escapeHtml(t(SH.send))}</button>` +
      `<p class="share-note share-msg"></p>` +
      `<button type="button" class="share-next">${escapeHtml(t(SH.next))}</button></div>`;
    document.body.appendChild(ov);
    imgP.then((blob) => { if (blob) ov.querySelector('.share-prev').src = URL.createObjectURL(blob); });
    ov.querySelector('.share-next').onclick = () => { location.href = `/ops_form.html?station=${station.key}`; };
    ov.querySelector('.share-go').onclick = async () => {
      const blob = await imgP;
      const files = [new File([blob], `${base}.png`, { type: 'image/png' }), new File([csv], `${base}.csv`, { type: 'text/csv' })];
      const text = shareSummary(payload, rows);
      if (navigator.canShare && navigator.canShare({ files })) {
        try { await navigator.share({ files, title: t(SH.load), text }); } catch (err) { if (err.name !== 'AbortError') console.error('share', err); }
        return;
      }
      files.forEach((file) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(file); a.download = file.name;
        document.body.appendChild(a); a.click(); a.remove();
      });
      ov.querySelector('.share-msg').textContent = t(SH.fallback);
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    };
  }

  async function attemptPendingSubmit() {
    if (!pendingSubmits.length || !draftsOn) return;

    await syncProjectLink(true);
    localStorage.removeItem(mirrorKey());

  // Photo downscale — same approach as the field forms, kept local so this page
  // doesn't need forms_common.js.
  function compressImage(file, maxDim = 1600, quality = 0.72) {
    return new Promise((resolve, reject) => {
      const img = new Image(); const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality) });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

        .replace('{logged}', counts.length ? t(DP.logged).replace('{list}', counts.join(', ')) : '');
      if (!confirm(msg)) return;
      // Stop autosaving first, so a save in flight can't bring it back.
      isClosed = true;

      delBtn.disabled = true;
      delBtn.textContent = t(DP.deleting);
      // Never saved (nothing typed yet) → nothing on the server to delete.
      const res = onServer ? await deleteOpenPage(station.key, draftId) : { ok: true };
      if (!res.ok && res.code === 'submitted') { closedElsewhere(); alert(t(DP.tooLate)); return; }
      if (res.ok || res.code === 'gone') await unlinkProject();

    queueItems = prQ
      ? (await loadPrerollQueue(getClient())).map((x) => (x.draftId && x.draftId === draftId ? { ...x, made: num(values.totalPrerolls) } : x))

      : (await loadBuckingQueue()).items.map((p) => (p.draftId && p.draftId === draftId ? withPulled(p, values.boxes) : p));

        `<div class="q-lb"><span class="k">${escapeHtml(t(QT.pulledLb))}</span>${fmtNum(p.pulledLb || 0, 2)} lb</div>` +
        `<div class="q-lb left${p.leftLb != null && p.leftLb < 0 ? ' neg' : ''}"><span class="k">${escapeHtml(t(QT.leftLb))}</span>${p.leftLb == null ? '—' : fmtNum(p.leftLb, 2) + ' lb'}</div>` +

    const hereBtn = box.querySelector('[data-here]');
    if (hereBtn) hereBtn.addEventListener('click', (e) => { e.preventDefault(); showTab('form'); });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  updateVisibility();
  recompute();
  // buildLineItems() wires its addRow on a setTimeout(0); let that run before
  // hydrate() needs it, or a fast-loading record drops its worksheet rows.
  await new Promise((r) => setTimeout(r, 0));

  if (editMode) {
    document.getElementById('back').textContent = t(fromToday || station.key !== 'intake_wet' ? ED.backToday : ED.back);
    btn.textContent = t(ED.save);
    const rec = await getDraft(editId);
    editRec = rec;
    document.getElementById('back').href = editBack(editId);
    if (!rec || rec.status !== 'submitted') {
      banner.className = 'banner error';
      banner.textContent = t(ED.notFound);
      btn.disabled = true;
      return;
    }
    hydrate(rec.fields || {});
    // hydrate() skips photos (drafts never carry them); a submitted record
    // has the uploaded photo's URL — keep it unless a new photo is picked.
    station.fields.filter((f) => f.t === 'photo').forEach((f) => {
      const url = rec.fields && rec.fields[f.k];
      if (typeof url !== 'string' || !url) return;
      values[f.k] = url;
      const img = document.getElementById(`p_${f.k}`);
      if (img) { img.src = url; img.style.display = 'block'; }
    });
    const subtitle = document.getElementById('subtitle');
    subtitle.textContent = `${t(ED.editing)} ${rec.work_date || ''}${rec.owner_user ? ' — ' + rec.owner_user : ''}`;
    subtitle.style.color = 'var(--gold)';
    wireDeleteRecord(rec);
  } else if (draftsOn) {
    // Prefer whatever is on the server; if this exact draft never made it
    // there (tablet died before the first autosave landed), fall back to
    // this browser's local mirror so nothing typed gets lost.
    const existing = await getDraft(draftId);
    if (existing) {
      onServer = existing.status === 'draft';
      hydrate(existing.fields || {});
    } else {
      const mirrored = localStorage.getItem(mirrorKey());
      if (mirrored) {
        try {
          const m = JSON.parse(mirrored);
          hydrate(m.fields || {});
          if (m.pendingSubmit) {
            // This browser tried to submit while offline and never got a
            // confirmation back. Retry now; if it still can't reach Supabase,
            // the 'online' listener and the 20s interval below keep trying
            // until it lands — the values are safe in this mirror either way.
            pendingSubmits = m.pending || [{ id: draftId, submitFields: { stationKey: station.key, owner, strain: m.strain, date: m.work_date || m.date, fields: m.fields } }];
            attemptPendingSubmit();
          } else {
            markDirty();
          }
        } catch { /* corrupt mirror, ignore */ }
      } else {

  // The drying list loads alongside the draft; once it's in, fill the
  // pickers — keeping a resumed draft's package, and treating the values
  // that match it as prefilled, so picking another package replaces them.
  if (pickLoaded) {
    await pickLoaded;
    pickReady = true;
    if (station.queueTab && queueItems) queueTabLabel(queueItems.length);
    const spec = PREFILL_MAP[station.key];
    pickerFields.forEach((f) => {
      if (f.picker.room) countRooms(f);
      fillPicker(f);
      const rec = (pickLists[f.k] || []).find((i) => values[f.k] && normUid(i.sourceUid) === normUid(values[f.k]));
      if (rec && linkPicked.has(f.k)) { tryPrefill(values[f.k], f.k, rec); return; }
      if (rec && spec) Object.entries(spec.map).forEach(([here, there]) => {
        if (!isBlank(values[here]) && String(values[here]) === String(rec[there])) lastPrefill[here] = values[here];
      });
    });
  }

  // The pre-roll queue, once loaded: select the request this page already
  // has (a resumed draft, or the dashboard's Start batch), treating the
  // values that match it as filled by the pick.
  if (prLoaded) {
    prItems = await prLoaded;
    if (station.queueTab && !editMode) { queueItems = prItems; queueTabLabel(prItems.length); }
    prFields.forEach((f) => {
      const x = prFind(values[f.k]);
      if (x) Object.entries(f.prPicker.fills || {}).forEach(([key, prop]) => {
        if (!isBlank(values[key]) && String(values[key]) === String(x[prop])) prFilled[key] = values[key];
      });
      fillPrPicker(f);
    });
  }

  // Starting values carried in the link as ?set_<fieldKey>=value — e.g. the
  // Pre-Roll Dashboard's "Start batch" fills in the PR#, strain and source
  // UID. Only ever applied to a brand-new form, never over a saved draft.
  function applyLinkPrefill() {
    const fields = {};
    station.fields.forEach((f) => {
      if (['calc', 'lineitems', 'crewcheck', 'photo'].includes(f.t)) return;
      const v = params.get(`set_${f.k}`);
      if (v !== null && v !== '') fields[f.k] = f.t === 'number' ? Number(v) : v;
    });
    if (!Object.keys(fields).length) return;
    hydrate(fields);
    markDirty();
    // A UID handed over this way still pulls in its upstream details —
    // Hand Trim's from the lot list once it's loaded (it has the customer
    // ID and lots still being bucked, which a plain lookup doesn't).
    station.fields.filter((f) => f.t === 'uid' && f.prefill === 'lookup' && fields[f.k]).forEach((f) => {
      if (f.picker && f.picker.list === 'bucked') linkPicked.add(f.k);
      else tryPrefill(String(fields[f.k]).trim(), f.k);
    });
  }
})();
</script>
</body>
</html>
