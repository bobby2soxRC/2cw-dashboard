<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Operations Form — 2CW</title>
  <script>
    // Bounce anyone without an active hub session or operations access.
    (function(){
      if (!sessionStorage.getItem('2cw_pin')) { window.location.replace('/index.html'); }
    })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
      --accent:var(--green);
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}
    body{padding-bottom:120px}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .autosave{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
    .autosave .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
    .autosave.saving .dot{background:var(--gold);animation:pulse 1s infinite}
    .autosave.saved .dot{background:var(--green)}
    .autosave.offline .dot{background:var(--red)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--accent);color:#000}

    .queue{display:none;align-items:center;justify-content:space-between;gap:12px;background:rgba(212,168,67,.12);border-bottom:1px solid var(--gold);color:var(--gold);padding:10px 16px;font-family:'DM Mono',monospace;font-size:12px;position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:19}
    .queue button{background:var(--gold);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-family:inherit;font-size:12px;cursor:pointer}

    main{padding:24px 16px 40px;max-width:720px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,44px);letter-spacing:.04em;line-height:1}
    .subtitle{margin-top:6px;font-size:.85rem;color:var(--subtext);line-height:1.5}
    /* Form / Queue tabs (Bucking) */
    .ftabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--border)}
    .ftabs button{flex:1;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--subtext);font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:14px 10px;cursor:pointer;min-height:48px}
    .ftabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
    .ftabs + .panel{margin-top:16px}
    .q-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
    .q-row:last-child{border-bottom:none}
    .q-n{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--accent);min-width:34px;text-align:center}
    .q-main{flex:1;min-width:0}
    .q-strain{font-weight:700}
    .q-uid{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);overflow-wrap:anywhere}
    .q-lbs{display:flex;gap:14px;flex:0 0 auto}
    .q-lb{font-family:'DM Mono',monospace;font-size:1rem;white-space:nowrap;text-align:right}
    .q-lb .k{display:block;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .q-lb.left{color:var(--accent)}
    .q-lb.neg{color:var(--red)}
    .q-go{flex:0 0 auto;background:var(--accent);color:#000;border-radius:10px;padding:12px 14px;font-weight:700;font-size:.85rem;text-decoration:none;white-space:nowrap}
    .q-go.open{background:transparent;color:var(--accent);border:1px solid var(--accent)}
    .q-tag{display:inline-block;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:middle}
    .q-empty{color:var(--muted);font-size:.9rem}
    .q-note{font-size:.8rem;color:var(--muted);margin-bottom:8px}
    @media (max-width:520px){ .q-row{flex-wrap:wrap} .q-lbs{flex:1 0 100%;justify-content:flex-end} .q-go{flex:1 0 100%;text-align:center} }
    body.on-queue #form, body.on-queue #summary, body.on-queue #banner, body.on-queue .actions,
    body.on-queue #days, body.on-queue #days-lbl{display:none !important}
    /* Day tabs (Hand Trim): one lot over several days. */
    .days .chip{font-family:inherit;cursor:pointer;text-align:left;min-width:96px}
    .days .chip.new{min-height:52px}
    .days .day-add{flex-direction:row;align-items:center;gap:8px;padding:6px 8px}
    .days .day-add input{min-height:40px;padding:.4rem .5rem;width:auto}
    .day-add-go{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 14px;font-weight:700;font-family:inherit;cursor:pointer}
    /* A section heading inside the form (t: 'heading'). */
    .sec-head{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.04em;font-weight:400;border-top:1px solid var(--border);padding-top:18px}
    .del-page{width:100%;margin-top:24px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:12px;min-height:52px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
    .del-page:disabled{opacity:.5;cursor:not-allowed}
    body.on-queue .del-page{display:none}
    .page-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .page-links a{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:9px 12px}
    .dept{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

    /* "Your open forms" strain switcher — lets someone bounce between the
       three strains they're running today without losing any of them. */
    .switcher{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
    .chip{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 14px;text-decoration:none;color:var(--text);min-width:110px}
    .chip.on{border-color:var(--accent);background:var(--surface2)}
    .chip .cs{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .chip .cv{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
    .chip.new{color:var(--accent);border-style:dashed;justify-content:center;align-items:center}
    .switcher-lbl{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:18px}
    .switcher-lbl + .switcher{margin-top:8px}

    /* Daily summary (Smalls): employee # × flavor, the notebook tally. */
    .summary h2{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.04em;font-weight:400}
    .sum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .sum-head .hint{margin-top:2px}
    .sum-head input{width:auto;min-height:44px}
    .sum-table{border-collapse:collapse;font-family:'DM Mono',monospace;font-size:.85rem;min-width:100%}
    .sum-table th,.sum-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
    .sum-table th{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;vertical-align:bottom;white-space:normal;min-width:72px}
    .sum-table th:first-child,.sum-table td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
    .sum-table th.cur{color:var(--accent)}
    .sum-table td.zero{color:var(--muted)}
    .sum-table th.name,.sum-table td.name{text-align:left;font-family:inherit;color:var(--subtext)}
    .sum-table td.tot,.sum-table th.tot{color:var(--accent)}
    .sum-table tfoot td{border-bottom:none;border-top:1px solid var(--subtext);color:var(--subtext)}
    .sum-empty{color:var(--muted);font-size:.85rem}

    .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 18px;margin-top:24px}
    .field{margin-bottom:20px}
    .field.half{display:inline-block;width:calc(50% - 6px);vertical-align:top}
    .field.half + .field.half{margin-left:12px}
    .field:last-child{margin-bottom:0}
    label.lbl{display:block;font-size:.72rem;font-weight:700;color:var(--subtext);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
    label.lbl .req{color:var(--red);margin-left:3px}
    .hint{font-size:.78rem;color:var(--muted);margin-top:.45rem;line-height:1.45}

    /* Tablet-first sizing: 16px font stops iOS zooming on focus, 52px targets
       are usable with gloves on. */
    input,select,textarea{width:100%;background:#0c0d0f;border:1px solid var(--border);color:var(--text);
      padding:.8rem .9rem;border-radius:10px;font-size:16px;font-family:inherit;outline:none;min-height:52px;transition:border-color .15s}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    textarea{resize:vertical;min-height:88px}
    select{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%239aa0b0' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;background-size:12px;padding-right:38px}
    input.uid{font-family:'DM Mono',monospace;letter-spacing:.04em}
    label.check{display:flex;align-items:center;gap:12px;min-height:52px;background:var(--surface2);border:1px solid var(--border);
      border-radius:10px;padding:.6rem .9rem;font-size:16px;font-weight:600;cursor:pointer}
    label.check input{width:26px;height:26px;min-height:0;flex-shrink:0;accent-color:var(--accent);cursor:pointer}

    .calc{display:flex;align-items:baseline;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.75rem .9rem;min-height:52px}
    .calc .k{font-size:.72rem;font-weight:700;color:var(--subtext);text-transform:uppercase;letter-spacing:.08em}
    .calc .v{font-family:'DM Mono',monospace;font-size:1.15rem;font-weight:500;color:var(--text);white-space:nowrap}
    .calc.neg .v{color:var(--red)}
    .calc.flagged{border-color:var(--gold)}
    .calc.flagged .v{color:var(--gold)}

    /* Weighing worksheet */
    .li-table{width:100%;border-collapse:collapse}
    .li-table th{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 8px}
    .li-table td{padding:0 6px 8px 0;vertical-align:middle}
    .li-table td:last-child{padding-right:0;width:52px}
    .li-table input{min-height:48px;padding:.6rem .7rem}
    .li-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .li-table input[type=date]{min-width:150px}
    .li-table input[type=time]{min-width:120px}
    .li-calc{font-family:'DM Mono',monospace;color:var(--subtext);white-space:nowrap}
    .li-num{display:inline-block;min-width:3ch;text-align:center;color:var(--text);font-size:1.05rem}
    .li-del{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:100%;min-height:48px;font-size:20px;line-height:1;cursor:pointer}
    .li-del:hover{border-color:var(--red);color:var(--red)}
    .li-add{width:100%;margin-top:4px;background:transparent;border:1px dashed var(--border);color:var(--subtext);border-radius:10px;min-height:52px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
    .li-add:hover{border-color:var(--accent);color:var(--accent)}
    /* One table per license (lineitems `group` — Harvest) */
    .li-group{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
    .li-group-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .li-group-hd .lbl{margin-bottom:6px}
    .li-group-del{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:40px;min-height:36px;font-size:18px;line-height:1;cursor:pointer}
    .li-group-del:hover{border-color:var(--red);color:var(--red)}
    .li-add-group{margin-top:0}
    /* After-submit share window (station.share — Harvest) */
    .share-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
    .share-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:100%;overflow:auto}
    .share-box h2{margin:0 0 12px;font-size:1.15rem}
    .share-prev{width:100%;border-radius:10px;border:1px solid var(--border);background:#fff;min-height:60px}
    .share-note{color:var(--subtext);font-size:.85rem;margin:8px 0}
    .share-go{width:100%;min-height:56px;border:0;border-radius:12px;background:#25d366;color:#05300f;font-family:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:4px}
    .share-next{width:100%;min-height:48px;margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:12px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
    /* Strain boxes inside a license (lineitems `lots` — buildLotSheet) */
    .lot{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px}
    .lot-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    .lot-title{font-weight:700;color:var(--accent)}
    .lot-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:10px}
    .lot-f{display:block}
    .lot-f .k{display:block;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .lot-bins td:first-child{width:2.5em;text-align:center}
    .lot-sum{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--subtext);margin-top:8px;text-align:right}
    .lot-scan{display:flex;gap:8px;margin-top:12px;align-items:stretch}
    .lot-scan input{flex:1;min-width:0}
    .lot-scan .li-add{width:auto;margin-top:0;padding:0 14px;white-space:nowrap}
    @media (max-width:520px){ .lot-fields{grid-template-columns:1fr} .lot-scan{flex-direction:column} .lot-scan .li-add{width:100%} }
    /* Driver picker: add-a-driver panel */
    .drv-new{margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:12px;display:none}
    .drv-new .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .drv-new input{margin-bottom:8px}
    .drv-new .lbl{margin-top:4px}
    .drv-save{width:100%;min-height:48px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:4px}
    .drv-save:disabled{opacity:.5}
    .li-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .li-total .k{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .li-total .v{font-family:'DM Mono',monospace;font-size:1.3rem;color:var(--accent)}

    /* fill button (Bucking's Calculate) */
    .fill-btn{width:100%;min-height:52px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
    .fill-btn:hover{background:var(--surface2)}
    .fill-msg{font-family:'DM Mono',monospace;font-size:.82rem;margin-top:8px;display:none}
    .fill-msg.ok{display:block;color:var(--green)}
    .fill-msg.err{display:block;color:var(--gold)}

    /* Running log (lineitems with entry: true): one entry bar, rows below. */
    .entry-bar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px}
    .entry-in{flex:1 1 130px;min-width:0}
    .entry-in .k{display:block;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .entry-add{flex:0 0 auto;min-width:96px;min-height:52px;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
    .entry-in .req{color:var(--red);margin-left:3px}
    .entry-in.entry-num{flex:0 0 auto}
    .entry-next{min-height:52px;min-width:64px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:1.2rem;color:var(--accent);border:1px dashed var(--border);border-radius:10px;padding:0 12px}
    /* Bags stepper (Hand Trim): − [n] + */
    .qty{display:flex;gap:4px;align-items:stretch}
    .qty input{width:64px;text-align:center;padding:.8rem .3rem;-moz-appearance:textfield}
    .qty input::-webkit-inner-spin-button,.qty input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .qty-btn{min-width:44px;min-height:52px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1.3rem;cursor:pointer}
    .qty-btn:active{border-color:var(--accent);color:var(--accent)}
    .entry-msg{font-size:.8rem;color:var(--red);margin-top:8px;display:none}
    .entry-table{margin-top:12px;font-family:'DM Mono',monospace;font-size:.9rem}
    .entry-table td{padding:8px 8px 8px 0;border-bottom:1px solid var(--border)}
    .entry-table td.at{color:var(--muted);font-size:.78rem;white-space:nowrap}
    .entry-table tr.fresh td{color:var(--accent)}
    .entry-table .li-del{min-height:40px}
    .entry-empty{color:var(--muted);font-size:.85rem;margin-top:12px}

    /* Crew check (Pre-Roll's attendance): the day's scheduled people, here / not here, plus added. */
    .cc-src{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--muted);margin-bottom:10px}
    .cc-day{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:14px 0 6px}
    .cc-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .cc-name{flex:1;min-width:0}
    .cc-name .r{display:block;font-size:.75rem;color:var(--muted)}
    .cc-row.out .cc-name b{text-decoration:line-through;color:var(--muted)}
    .cc-btn{min-height:44px;min-width:84px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;cursor:pointer}
    .cc-btn.on.here{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
    .cc-btn.on.out{background:var(--red);border-color:var(--red);color:#000;font-weight:700}
    .cc-del{flex:0 0 auto;min-width:44px;min-height:44px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:1.1rem;cursor:pointer}
    .cc-tag{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:2px 6px}
    .cc-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .cc-add select,.cc-add input{flex:1 1 200px;min-width:0}
    .cc-all{margin-top:10px;width:100%;min-height:48px;background:transparent;border:1px solid var(--green);color:var(--green);border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
    .cc-sum{font-family:'DM Mono',monospace;font-size:.85rem;margin-top:10px;color:var(--text)}

    .photo-wrap{display:flex;gap:12px;align-items:center}
    .photo-wrap img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:none}

    /* Sticky action bar keeps Submit reachable on a long form without scrolling. */
    .actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(19,21,26,.97);border-top:1px solid var(--border);
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
    .actions-inner{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
    .running{flex:1;min-width:0}
    .running .k{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .running .v{font-family:'DM Mono',monospace;font-size:1.05rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .submit-btn{flex:0 0 auto;min-width:190px;padding:1rem 1.5rem;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;min-height:56px}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed}

    .banner{margin-top:16px;padding:.9rem 1rem;border-radius:10px;font-size:.9rem;display:none;font-family:'DM Mono',monospace;line-height:1.5}
    .banner.success{display:block;background:rgba(61,184,122,.12);color:var(--green);border:1px solid var(--green)}
    .banner.warn{display:block;background:rgba(212,168,67,.12);color:var(--gold);border:1px solid var(--gold)}
    .banner.error{display:block;background:rgba(239,83,80,.12);color:var(--red);border:1px solid var(--red)}
    .match{font-size:.78rem;color:var(--green);margin-top:.45rem;font-family:'DM Mono',monospace;display:none}
    .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}

    /* "Other" popup (Hand Trim's lot): strain + package UID. */
    .pop-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
    .pop{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 18px;width:100%;max-width:440px}
    .pop h3{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.04em;font-weight:400;margin-bottom:14px}
    .pop-msg{font-size:.8rem;color:var(--red);margin-top:10px;min-height:1em}
    .pop-btns{display:flex;gap:10px;margin-top:14px}
    .pop-btns button{flex:1;min-height:52px;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
    .pop-cancel{background:transparent;border:1px solid var(--border);color:var(--subtext)}
    .pop-ok{background:var(--accent);border:none;color:#000}
    .pop-ok.danger{background:var(--red);color:#fff}
    .pop-ok:disabled{opacity:.5;cursor:not-allowed}
    .pop p{font-size:.9rem;color:var(--subtext);line-height:1.45;margin-bottom:12px}
    .pop .pop-what{color:var(--text);font-weight:700}
    .pop textarea{width:100%;min-height:76px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:1rem;padding:10px 12px;resize:vertical}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Operations</div>
  <div class="autosave" id="autosave" style="display:none"><span class="dot"></span><span id="autosave-txt"></span></div>
  <div class="lang" id="lang"></div>
</header>
<div class="queue" id="queue"></div>

<main>
  <div class="dept" id="dept"></div>
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="page-links" id="page-links" style="display:none"></div>
  <div class="switcher-lbl" id="switcher-lbl" style="display:none"></div>
  <div class="switcher" id="switcher" style="display:none"></div>
  <div class="switcher-lbl" id="days-lbl" style="display:none"></div>
  <div class="switcher days" id="days" style="display:none"></div>
  <div class="ftabs" id="ftabs" style="display:none"></div>
  <section class="panel" id="queue-panel" style="display:none"></section>
  <form class="panel" id="form" autocomplete="off"></form>
  <button type="button" class="del-page" id="del-page" style="display:none"></button>
  <div class="banner" id="banner"></div>
  <section class="panel summary" id="summary" style="display:none"></section>
</main>

<div class="actions">
  <div class="actions-inner">
    <div class="running"><div class="k" id="running-k"></div><div class="v" id="running-v">—</div></div>
    <button class="submit-btn" type="button" id="submit-btn">Submit</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script src="/preroll_queue.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const station = STATION_BY_KEY[params.get('station')];
  if (!station) { location.replace('/index.html'); return; }

  // ?edit=<id> reopens an already-submitted record to correct it — only with
  // the access canFixSubmitted() checks (set at hub login from the admin
  // panel). Saves go through updateSubmitted, never the draft autosave, so
  // the record stays submitted the whole time. `&from=today` (the Today
  // board's Edit button) returns there; otherwise Wet Intakes go back to
  // Harvest Intakes.
  const editId = params.get('edit');
  const fromToday = params.get('from') === 'today';
  const editBack = (id) => fromToday || station.key !== 'intake_wet'
    ? '/operations_today.html' + (editRec && editRec.work_date && editRec.work_date !== todayStr() ? `?date=${editRec.work_date}` : '')
    : `/harvest_intakes.html?id=${id}`;
  if (editId && !canFixSubmitted(station.key)) {
    location.replace(fromToday ? '/operations_today.html' : station.key === 'intake_wet' ? '/harvest_intakes.html' : '/index.html');
    return;
  }
  const editMode = !!editId;
  let editRec = null;   // the submitted row being corrected, once loaded

  // Per-station edit access, set at hub login from the directory sheet.
  const allowed = JSON.parse(sessionStorage.getItem('2cw_ops_edit_access') || 'null');
  if (!editMode && allowed && allowed !== 'all' && !allowed.includes(station.key)) {
    location.replace('/index.html');
    return;
  }

  mountLangToggle('lang');
  mountQueueBanner('queue');
  document.documentElement.style.setProperty('--accent', `var(--${station.color || 'green'})`);
  document.getElementById('back').textContent = t(UI.back);
  document.querySelector('.hdr-brand').textContent = t(station.title);
  document.getElementById('dept').textContent = t(station.dept);
  document.getElementById('title').textContent = t(station.title);
  document.getElementById('subtitle').textContent = t(station.desc);
  // Pages that go with this station (Bucking → On hold).
  if (station.links && station.links.length) {
    const pl = document.getElementById('page-links');
    pl.innerHTML = station.links.map((x) => `<a href="${x.href}">${t(x.l)}</a>`).join('');
    pl.style.display = 'flex';
  }
  document.title = `${t(station.title)} — 2CW Operations`;

  const owner = sessionStorage.getItem('2cw_user_name') || null;
  const draftsOn = supabaseReady();

  // The draft id is the only thing that has to travel for cross-device
  // resume to work — put it in the URL the moment one exists so a reload
  // (or a link shared with a teammate) lands back on the same form.
  let draftId = editMode ? editId : params.get('draft');
  if (draftsOn && !draftId) {
    draftId = crypto.randomUUID();
    const url = new URL(location.href);
    url.searchParams.set('draft', draftId);
    history.replaceState(null, '', url);
  }

  const PERSON_FIELDS = new Set(['teamLead', 'checkedBy', 'requestedBy', 'completedBy']);
  // The package pickers (Take Down: what's drying; Bucking: what's ready to
  // buck) — see fillPicker.
  const PK = {
    loading:   { en: 'Loading what’s drying…', es: 'Cargando lo que está secando…' },
    loadingBuck: { en: 'Loading what’s ready to buck…', es: 'Cargando lo que está listo para desvarar…' },
    roomFirst: { en: 'Pick the drying room first', es: 'Elija primero el cuarto de secado' },
    choose:    { en: 'Choose the package…', es: 'Elija el paquete…' },
    none:      { en: 'Nothing drying in this room', es: 'Nada secando en este cuarto' },
    noneBuck:  { en: 'Nothing ready to buck — check On hold', es: 'Nada listo para desvarar — revise En espera' },
    typed:     { en: 'Not listed — type the UID', es: 'No aparece — escriba el UID' },
    loadingBucked: { en: 'Loading bucked flower…', es: 'Cargando flor desvarada…' },
    noneBucked: { en: 'No bucked flower yet — pick Other', es: 'Aún no hay flor desvarada — elija Otro' },
    chooseLot: { en: 'Choose the lot…', es: 'Elija el lote…' },
    otherLot:  { en: 'Other — not on the list', es: 'Otro — no aparece' },
    bucking:   { en: 'bucking in progress', es: 'desvarándose' }
  };
  // The pre-roll queue dropdown (prPicker — Pre-Roll Production's request).
  const PR = {
    loading: { en: 'Loading the pre-roll queue…', es: 'Cargando la fila de prerolls…' },
    choose:  { en: 'Choose the production request…', es: 'Elija la solicitud de producción…' },
    none:    { en: 'Nothing in the pre-roll queue — pick Other', es: 'No hay nada en la fila de prerolls — elija Otro' },
    other:   { en: 'Other — type the PR #', es: 'Otro — escriba el N.º de solicitud' },
    noStrain:{ en: 'no strain yet', es: 'sin variedad aún' },
    open:    { en: 'batch open', es: 'lote abierto' },
    make:    { en: 'Make {n} pre-rolls', es: 'Hacer {n} prerolls' },
    packs:   { en: '{units} × {pack}-pack', es: '{units} × paquete de {pack}' },
    each:    { en: '{g} g each', es: '{g} g c/u' },
    ready:   { en: 'ready by {d}', es: 'lista para {d}' }
  };
  // The Master Schedule project dropdown (projectPicker).
  const PJ = {
    loading: { en: 'Loading projects…', es: 'Cargando proyectos…' },
    choose:  { en: 'No project', es: 'Sin proyecto' },
    running: { en: 'Running {d}', es: 'En curso el {d}' },
    others:  { en: 'Other open projects', es: 'Otros proyectos abiertos' },
    closed:  { en: 'Done or removed', es: 'Terminado o quitado' },
    linked:  { en: '✓ Linked: {uids} is on this project.', es: '✓ Vinculado: {uids} está en este proyecto.' },
    noUid:   { en: 'The package will be linked to this project once its UID is filled in.',
               es: 'El paquete se vinculará a este proyecto cuando se llene su UID.' },
    failed:  { en: 'Couldn’t link to the project yet — it will try again on the next save.',
               es: 'Aún no se pudo vincular al proyecto — se intentará de nuevo al guardar.' },
    perDay:  { en: 'The project for {d} — each day of the run can be on its own project.',
               es: 'El proyecto del {d} — cada día de la corrida puede tener su propio proyecto.' }
  };
  // The Driver dropdown (driverPicker — Harvest).
  const DV = {
    loading: { en: 'Loading drivers…', es: 'Cargando conductores…' },
    choose:  { en: 'Choose the driver…', es: 'Elija el conductor…' },
    failed:  { en: 'Couldn’t load the driver list — check the connection', es: 'No se pudo cargar la lista de conductores — revise la conexión' },
    addNew:  { en: '+ Add a new driver', es: '+ Agregar un conductor nuevo' },
    id:      { en: 'ID', es: 'ID' },
    first:   { en: 'First Name', es: 'Nombre' },
    last:    { en: 'Last Name', es: 'Apellido' },
    idNo:    { en: 'ID Number', es: 'Número de identificación' },
    photo:   { en: 'Photo of the ID', es: 'Foto de la identificación' },
    save:    { en: 'Save driver', es: 'Guardar conductor' },
    saving:  { en: 'Saving…', es: 'Guardando…' },
    need:    { en: 'Fill in first name, last name and ID number, and take a photo of the ID.',
               es: 'Llene nombre, apellido y número de identificación, y tome una foto de la identificación.' },
    existed: { en: 'A driver with that ID number is already on the list — they’ve been picked.', es: 'Ya hay un conductor con ese número en la lista — quedó seleccionado.' },
    offline: { en: 'Adding a driver needs a connection — try again with signal.', es: 'Agregar un conductor necesita conexión — intente de nuevo con señal.' }
  };
  const pkLoading = (f) => t(f.picker.list === 'buckable' ? PK.loadingBuck : f.picker.list === 'bucked' ? PK.loadingBucked : PK.loading);
  const reference = await loadReference();
  const form = document.getElementById('form');
  const values = {};          // live form state, keyed by field key
  const els = {};             // key -> wrap element
  const lineitemAdders = {};  // lineitems key -> addRow(prefill?) function

  // ── Render ────────────────────────────────────────────────────────────────
  function optionsFor(f) {
    if (f.ref) return refOptions(reference, f.ref);
    if (f.refConst === 'BIOMASS') return Object.entries(BIOMASS).map(([v, l]) => ({ v, label: t(l) }));
    return (f.opts || []).map((o) => ({ v: o.v, label: t(o.l) }));
  }

  function labelHtml(f) {
    return `<label class="lbl" for="f_${f.k}">${t(f.l)}${f.req ? '<span class="req">*</span>' : ''}</label>`;
  }

  function buildField(f) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.dataset.key = f.k;

    if (f.t === 'calc') {
      wrap.innerHTML = `<div class="calc" id="c_${f.k}"><span class="k">${t(f.l)}</span><span class="v">—</span></div>` +
                       (f.hint ? `<div class="hint">${t(f.hint)}</div>` : '');
      return wrap;
    }

    if (f.t === 'lineitems') return f.entry ? buildEntryLog(f, wrap) : f.lots ? buildLotSheet(f, wrap) : buildLineItems(f, wrap);
    if (f.t === 'crewcheck') {
      // Drawn by buildCrewCheck once the projects and roster load.
      values[f.k] = [];
      wrap.innerHTML = labelHtml(f) + (f.hint ? `<div class="hint" style="margin-top:0;margin-bottom:10px">${t(f.hint)}</div>` : '') +
        `<div class="cc" id="cc_${f.k}"></div><div class="entry-msg" id="ccm_${f.k}"></div>`;
      return wrap;
    }
    if (f.t === 'fill') return buildFill(f, wrap);
    if (f.t === 'heading') {
      wrap.innerHTML = `<h3 class="sec-head">${t(f.l)}</h3>` + (f.hint ? `<div class="hint">${t(f.hint)}</div>` : '');
      return wrap;
    }

    if (f.t === 'check') {
      // A pick-one group sits side by side, two to a row.
      if (f.group) wrap.classList.add('half');
      wrap.innerHTML = `<label class="check" for="f_${f.k}"><input type="checkbox" id="f_${f.k}">${t(f.l)}</label>` +
                       (f.hint ? `<div class="hint">${t(f.hint)}</div>` : '');
      return wrap;
    }

    let control = '';
    if (f.driverPicker) {
      // Filled once the driver list loads (wireDriverPicker below); "+ Add a
      // new driver" opens the panel under it.
      control = `<select id="dp_${f.k}"><option value="">${escapeHtml(t(DV.loading))}</option></select>` +
        `<div class="drv-new" id="dn_${f.k}">` +
          `<div class="row2"><div><label class="lbl">${escapeHtml(t(DV.first))}<span class="req">*</span></label><input type="text" data-k="first" autocapitalize="words"></div>` +
          `<div><label class="lbl">${escapeHtml(t(DV.last))}<span class="req">*</span></label><input type="text" data-k="last" autocapitalize="words"></div></div>` +
          `<label class="lbl">${escapeHtml(t(DV.idNo))}<span class="req">*</span></label><input type="text" data-k="idNumber" autocapitalize="characters">` +
          `<label class="lbl">${escapeHtml(t(DV.photo))}<span class="req">*</span></label>` +
          `<div class="photo-wrap"><input type="file" data-k="photo" accept="image/*" capture="environment"><img alt=""></div>` +
          `<button type="button" class="drv-save">${escapeHtml(t(DV.save))}</button>` +
          `<div class="match"></div>` +
        `</div>`;
    } else if (f.projectPicker) {
      // Filled once the projects load (wireProjectPicker below).
      control = `<select id="f_${f.k}"><option value="">${escapeHtml(t(PJ.loading))}</option></select>` +
                `<div class="match" id="m_${f.k}"></div>`;
    } else if (f.t === 'select') {
      const opts = optionsFor(f);
      control = `<select id="f_${f.k}">` +
        `<option value=""></option>` +
        opts.map((o) => `<option value="${escapeAttr(o.v)}">${escapeHtml(o.label)}</option>`).join('') +
        (f.allowOther ? `<option value="__other__">${escapeHtml(t(UI.other))}</option>` : '') +
        `</select>` +
        (f.allowOther ? `<input type="text" id="o_${f.k}" placeholder="${escapeAttr(t(UI.otherPrompt))}" style="display:none;margin-top:10px">` : '');
    } else if (f.t === 'textarea') {
      control = `<textarea id="f_${f.k}" rows="3"></textarea>`;
    } else if (f.t === 'photo') {
      control = `<div class="photo-wrap"><input type="file" id="f_${f.k}" accept="image/*" capture="environment"><img id="p_${f.k}" alt=""></div>`;
    } else if (f.t === 'number') {
      control = `<input type="number" id="f_${f.k}" inputmode="decimal" step="${f.step || 'any'}"` +
                (f.min !== undefined ? ` min="${f.min}"` : '') + (f.max !== undefined ? ` max="${f.max}"` : '') + `>`;
    } else if (f.t === 'date') {
      control = `<input type="date" id="f_${f.k}">`;
    } else if (f.t === 'time') {
      control = `<input type="time" id="f_${f.k}">`;
    } else if (f.prPicker) {
      // Picked from the pre-roll queue (wirePrPickers below); the text box
      // only shows for "Other — type the PR #".
      control = `<select id="pr_${f.k}"><option value="">${escapeHtml(t(PR.loading))}</option></select>` +
                `<input type="text" id="f_${f.k}" autocapitalize="characters" placeholder="PR-1003" style="display:none;margin-top:10px">` +
                `<div class="match" id="m_${f.k}"></div>`;
    } else if (f.t === 'uid' && f.picker) {
      // Picked from a list (fillPicker below); the text box only shows for
      // "Not listed — type the UID".
      control = `<select id="pk_${f.k}"><option value="">${escapeHtml(pkLoading(f))}</option></select>` +
                (f.pickedLabel ? `<div id="pv_${f.k}" style="display:none;margin-top:10px"><label class="lbl">${escapeHtml(t(f.pickedLabel))}</label>` +
                  `<input type="text" class="uid" readonly tabindex="-1" style="opacity:.85"></div>` : '') +
                `<input type="text" id="f_${f.k}" class="uid" inputmode="latin" autocapitalize="characters" placeholder="1A40603…  ${t(UI.other) === 'Otro…' ? 'o' : 'or'} 1008" style="display:none;margin-top:10px">` +
                `<div class="match" id="m_${f.k}"></div>`;
    } else if (f.t === 'uid') {
      control = `<input type="text" id="f_${f.k}" class="uid" inputmode="latin" autocapitalize="characters" placeholder="1A40603…  ${t(UI.other) === 'Otro…' ? 'o' : 'or'} 1008">` +
                `<div class="match" id="m_${f.k}"></div>`;
    } else {
      control = `<input type="text" id="f_${f.k}"${f.inputmode ? ` inputmode="${f.inputmode}"` : ''}>`;
    }

    wrap.innerHTML = labelHtml(f) + control + (f.hint ? `<div class="hint">${t(f.hint)}</div>` : '');
    return wrap;
  }

  // The weighing worksheet: a repeating employee-# / weight grid with a live
  // sub-total, mirroring the paper work order it replaces. Exposes addRow()
  // so hydrate() can rebuild saved rows on resume.
  function buildLineItems(f, wrap) {
    values[f.k] = [];
    wrap.innerHTML = labelHtml(f) +
      (f.hint ? `<div class="hint" style="margin-top:0;margin-bottom:10px">${t(f.hint)}</div>` : '') +
      `<div class="li-scroll"><table class="li-table"><thead><tr>` +
      f.cols.map((c) => `<th${c.t === 'rownum' ? ' style="white-space:nowrap"' : ''}>${t(c.l)}${c.req ? '<span class="req">*</span>' : ''}</th>`).join('') + `<th></th></tr></thead><tbody id="li_${f.k}"></tbody></table></div>` +
      `<button type="button" class="li-add" id="add_${f.k}">${t(UI.addRow)}</button>` +
      `<div class="li-total"><span class="k">${t(UI.subtotal)}</span><span class="v" id="lit_${f.k}">0</span></div>`;

    setTimeout(() => {
      const tbody = wrap.querySelector(`#li_${f.k}`);
      const numCols = f.cols.filter((c) => c.t === 'rownum');
      const renumber = () => {
        if (!numCols.length) return;
        const spans = tbody.querySelectorAll('.li-num');
        values[f.k].forEach((r, i) => {
          numCols.forEach((c, j) => {
            r[c.k] = i + 1;
            const el = spans[i * numCols.length + j];
            if (el) el.textContent = String(i + 1);
          });
        });
      };
      const addRow = (prefill) => {
        const row = {};
        const above = values[f.k][values[f.k].length - 1];
        values[f.k].push(row);
        const tr = document.createElement('tr');
        // Calc columns (e.g. hours from start/end) are read-only, worked out
        // from the rest of the row and stored on it like any other value.
        const calcCells = [];
        // Cells that can be filled from code (a Canix strain lookup), and the
        // ones still holding a value carried down from the row above rather
        // than one picked on this row.
        const setCell = {};
        const carried = new Set();
        const recalcRow = () => calcCells.forEach(({ c, el }) => {
          let out = null;
          try { out = c.calc(row); } catch { out = null; }
          row[c.k] = (out === null || !Number.isFinite(Number(out))) ? null : out;
          el.textContent = row[c.k] === null ? '—' : fmtNum(row[c.k], c.dp === undefined ? 2 : c.dp);
        });
        f.cols.forEach((c) => {
          const td = document.createElement('td');
          // A row number (Take Down's Box #) is filled in 1, 2, 3… down the
          // worksheet, never typed — see renumber().
          if (c.t === 'rownum') {
            const el = document.createElement('span');
            el.className = 'li-calc li-num';
            td.appendChild(el); tr.appendChild(td);
            return;
          }
          if (c.t === 'calc') {
            const el = document.createElement('span');
            el.className = 'li-calc';
            calcCells.push({ c, el });
            td.appendChild(el); tr.appendChild(td);
            return;
          }
          let inp, other = null;
          if (c.t === 'select') {
            inp = document.createElement('select');
            // A ref list (strains, …) starts blank like a top-level select; an
            // inline opts list keeps its first option as the default.
            const opts = c.ref ? [{ v: '', label: '' }, ...refOptions(reference, c.ref)]
              : (c.opts || []).map((o) => ({ v: o.v, label: t(o.l) }));
            if (c.allowOther) opts.push({ v: '__other__', label: t(UI.other) });
            opts.forEach((o) => {
              const opt = document.createElement('option');
              opt.value = o.v; opt.textContent = o.label;
              inp.appendChild(opt);
            });
            if (c.allowOther) {
              other = document.createElement('input');
              other.type = 'text'; other.placeholder = t(UI.otherPrompt);
              other.style.cssText = 'display:none;margin-top:6px';
            }
          } else {
            inp = document.createElement('input');
            inp.type = ['number', 'date', 'time'].includes(c.t) ? c.t : 'text';
            if (c.t === 'number') { inp.inputMode = 'decimal'; inp.step = c.step || 'any'; if (c.min !== undefined) inp.min = c.min; }
            if (c.t === 'uid') { inp.className = 'uid'; inp.autocapitalize = 'characters'; }
            if (c.inputmode) inp.inputMode = c.inputmode;
          }
          // A prefilled value (resuming a draft) wins; then a `carry` column
          // copies the row above; otherwise a column can declare a default so
          // every fresh row starts sensible (e.g. the container type
          // defaulting to "Bins" instead of blank).
          const initial = (prefill && prefill[c.k] !== undefined && prefill[c.k] !== null) ? prefill[c.k]
            : (!prefill && c.carry && above && above[c.k] !== undefined && above[c.k] !== null && above[c.k] !== '') ? above[c.k]
            : (c.t === 'date' && c.today ? new Date().toISOString().slice(0, 10) : c.def);
          if (!prefill && c.carry && initial !== undefined && initial !== null && initial !== '') carried.add(c.k);
          if (initial !== undefined && initial !== null) {
            inp.value = initial;
            // A saved value that isn't on the list (an "Other…" strain) still
            // has to show up.
            if (c.t === 'select' && inp.value !== String(initial)) {
              const opt = document.createElement('option');
              opt.value = initial; opt.textContent = initial;
              inp.insertBefore(opt, other ? inp.lastChild : null); inp.value = initial;
            }
            row[c.k] = c.t === 'number' ? Number(initial) : initial;
          }
          const read = () => {
            if (c.t === 'number') return inp.value === '' ? null : Number(inp.value);
            if (other && inp.value === '__other__') return other.value.trim();
            if (c.t === 'uid') return inp.value.trim().toUpperCase();
            return inp.value;
          };
          const onCellChange = () => {
            if (other) other.style.display = inp.value === '__other__' ? 'block' : 'none';
            row[c.k] = read();
            recalcRow();
            recompute();
            updateVisibility();
            markDirty();
          };
          // `canixStrain` (Wet Intake's package UID): a scanned/typed tag that
          // Canix knows fills the row's strain column — unless someone picked
          // one on this row already. Only a strain on the library list is set.
          const lookupStrain = () => {
            const uid = row[c.k];
            canixStrainForUid(uid).then((name) => {
              if (!name || row[c.k] !== uid) return;
              if (row[c.canixStrain] && !carried.has(c.canixStrain)) return;
              const lc = name.trim().toLowerCase();
              const hit = (reference.strains || []).find((x) => x.active !== false &&
                [x.name, ...(x.aliases || [])].some((n) => String(n || '').trim().toLowerCase() === lc));
              if (hit && setCell[c.canixStrain]) setCell[c.canixStrain](hit.name);
            });
          };
          const onUserChange = () => { carried.delete(c.k); onCellChange(); if (c.canixStrain) lookupStrain(); };
          if (c.t === 'select') {
            setCell[c.k] = (v) => {
              inp.value = v;
              if (inp.value !== v) return;
              carried.delete(c.k);
              onCellChange();
            };
          }
          inp.addEventListener('input', onUserChange);
          inp.addEventListener('change', onUserChange);
          if (other) other.addEventListener('input', onUserChange);
          td.appendChild(inp);
          if (other) td.appendChild(other);
          tr.appendChild(td);
        });
        const tdDel = document.createElement('td');
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'li-del'; del.textContent = '×';
        del.setAttribute('aria-label', t(UI.remove));
        del.onclick = () => {
          const i = values[f.k].indexOf(row);
          if (i > -1) values[f.k].splice(i, 1);
          tr.remove(); renumber(); recompute(); updateVisibility(); markDirty();
        };
        tdDel.appendChild(del); tr.appendChild(tdDel);
        tbody.appendChild(tr);
        renumber();
        recalcRow();
        if (!prefill) { const first = tr.querySelector('input, select'); if (first) first.focus(); }
      };
      lineitemAdders[f.k] = addRow;
      wrap.querySelector(`#add_${f.k}`).onclick = () => addRow();
      addRow(); addRow(); addRow();   // start with a few rows ready to fill
    }, 0);

    return wrap;
  }

  // License → strain → bins (lineitems with `group` + `lots` — Harvest), laid
  // out like the crew's notebook: a table per source license; in it a box
  // per strain (scan its plant tag, or + Add strain) with the strain's
  // Source UID, strain, location and Transfer UID once, then a row per bin
  // (weight, plant count). values[f.k] stays one flat row per bin, each
  // carrying its license (g.k), its box's fields, `_lot` and `bin`, so the
  // totals, the split into one record per UID and resume work as for any
  // worksheet. hydrate() empties li_<k> and calls lineitemAdders once per
  // saved row, which puts it back in its license table and box.
  const LT = {
    strainN:  { en: 'Strain {n}', es: 'Variedad {n}' },
    bin:      { en: 'Bin', es: 'Bin' },
    sum:      { en: '{b} bins · {w} lbs · {p} plants', es: '{b} bins · {w} lbs · {p} plantas' },
    found:    { en: 'Already on this load — add its bins below.', es: 'Ya está en esta carga — agregue sus bins abajo.' },
    canixOff: { en: 'Canix says “{s}” — not in the Strain Library; pick the strain.', es: 'Canix dice “{s}” — no está en la biblioteca de variedades; elija la variedad.' },
    removeStrain: { en: 'Remove this strain and its bins?', es: '¿Quitar esta variedad y sus bins?' },
    removeLicense: { en: 'Remove this license and everything under it?', es: '¿Quitar esta licencia y todo lo que tiene?' }
  };
  function buildLotSheet(f, wrap) {
    values[f.k] = [];
    const g = f.group, L = f.lots;
    wrap.innerHTML = labelHtml(f) +
      (f.hint ? `<div class="hint" style="margin-top:0;margin-bottom:10px">${t(f.hint)}</div>` : '') +
      `<div id="li_${f.k}"></div>` +
      `<button type="button" class="li-add li-add-group" id="addg_${f.k}">${escapeHtml(t(g.add))}</button>` +
      `<div class="li-total"><span class="k">${t(UI.subtotal)}</span><span class="v" id="lit_${f.k}">0</span></div>`;
    const box = wrap.querySelector(`#li_${f.k}`);
    let groups = [];
    const allLots = () => groups.flatMap((x) => x.lots);
    const changed = () => { recompute(); updateVisibility(); markDirty(); };

    // A select (ref list + Other) or text/uid/number input; returns
    // {el, get(), set(v)} and calls onChange when the person changes it.
    function control(c, onChange) {
      const el = document.createElement('div');
      let inp, other = null;
      if (c.t === 'select') {
        inp = document.createElement('select');
        [{ v: '', label: '' }, ...(c.ref ? refOptions(reference, c.ref) : (c.opts || []).map((o) => ({ v: o.v, label: t(o.l) })))]
          .concat(c.allowOther ? [{ v: '__other__', label: t(UI.other) }] : [])
          .forEach((o) => { const op = document.createElement('option'); op.value = o.v; op.textContent = o.label; inp.appendChild(op); });
        if (c.allowOther) {
          other = document.createElement('input');
          other.type = 'text'; other.placeholder = t(UI.otherPrompt); other.style.cssText = 'display:none;margin-top:6px';
        }
      } else {
        inp = document.createElement('input');
        inp.type = c.t === 'number' ? 'number' : 'text';
        if (c.t === 'number') { inp.inputMode = c.inputmode || 'decimal'; inp.step = c.step || 'any'; if (c.min !== undefined) inp.min = c.min; }
        if (c.t === 'uid') { inp.className = 'uid'; inp.autocapitalize = 'characters'; inp.placeholder = '1A40603…'; }
      }
      el.appendChild(inp); if (other) el.appendChild(other);
      const get = () => {
        if (c.t === 'number') return inp.value === '' ? null : Number(inp.value);
        if (other && inp.value === '__other__') return other.value.trim();
        if (c.t === 'uid') return inp.value.trim().toUpperCase();
        return inp.value.trim();
      };
      const set = (v) => {
        v = v === undefined || v === null ? '' : String(v);
        inp.value = v;
        if (c.t === 'select' && inp.value !== v) {
          if (other) { inp.value = '__other__'; other.value = v; }
          else { const op = document.createElement('option'); op.value = op.textContent = v; inp.appendChild(op); inp.value = v; }
        }
        if (other) other.style.display = inp.value === '__other__' ? 'block' : 'none';
      };
      const fire = () => { if (other) other.style.display = inp.value === '__other__' ? 'block' : 'none'; onChange(get()); };
      inp.addEventListener('input', fire); inp.addEventListener('change', fire);
      if (other) other.addEventListener('input', fire);
      return { el, inp, get, set };
    }

    function addGroup(val) {
      const sec = document.createElement('div');
      sec.className = 'li-group';
      sec.innerHTML = `<div class="li-group-hd"><label class="lbl">${escapeHtml(t(g.l))}${g.req ? '<span class="req">*</span>' : ''}</label>` +
        `<button type="button" class="li-group-del" aria-label="${escapeAttr(t(UI.remove))}">×</button></div>` +
        `<div class="lic"></div>` +
        `<div class="lots"></div>` +
        `<div class="lot-scan"><input type="text" class="uid" autocapitalize="characters" placeholder="${escapeAttr(t(L.scan))}">` +
        `<button type="button" class="li-add">${escapeHtml(t(L.add))}</button></div>`;
      const grp = { sec, value: val || '', lots: [], lotsEl: sec.querySelector('.lots'), del: sec.querySelector('.li-group-del') };
      const lic = control(g, (v) => {
        grp.value = v;
        grp.lots.forEach((lot) => lot.rows.forEach((r) => { r[g.k] = v; }));
        changed();
      });
      lic.set(grp.value);
      sec.querySelector('.lic').appendChild(lic.el);
      // Scan box: a tag already on this load goes to its strain box; a new
      // one starts a box with it filled in (strain from Canix).
      const scan = sec.querySelector('.lot-scan input');
      const onScan = () => {
        const uid = scan.value.trim().toUpperCase();
        if (!uid) return;
        scan.value = '';
        const hit = allLots().find((l) => l.fields.sourceUid && uidTailMatch(l.fields.sourceUid, uid));
        if (hit) { hit.say(t(LT.found), true); hit.focusBin(); return; }
        const lot = addLot(grp, { sourceUid: uid });
        lot.lookup();
        lot.focusAfterUid();
        changed();
      };
      scan.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); onScan(); } });
      scan.addEventListener('change', onScan);
      sec.querySelector('.lot-scan .li-add').onclick = () => { const lot = addLot(grp, {}); lot.focusFirst(); changed(); };
      grp.del.onclick = () => {
        if (grp.lots.some((l) => l.rows.some((r) => rowHasData(f, r))) && !confirm(t(LT.removeLicense))) return;
        grp.lots.slice().forEach((l) => l.remove());
        groups = groups.filter((x) => x !== grp);
        sec.remove(); showGroupDels(); changed();
      };
      box.appendChild(sec);
      groups.push(grp);
      showGroupDels();
      return grp;
    }
    const showGroupDels = () => groups.forEach((x) => { x.del.style.display = groups.length > 1 ? '' : 'none'; });

    // One strain box. `init` holds its fields (and `_lot` on resume);
    // `bins: false` skips the starter bin rows (resume adds the saved ones).
    function addLot(grp, init, bins = true) {
      const lot = { id: init._lot || crypto.randomUUID(), grp, fields: {}, rows: [], autoStrain: false };
      L.cols.forEach((c) => { lot.fields[c.k] = init[c.k] ?? ''; });
      const el = document.createElement('div');
      el.className = 'lot';
      el.innerHTML = `<div class="lot-hd"><span class="lot-title"></span><button type="button" class="li-group-del" aria-label="${escapeAttr(t(UI.remove))}">×</button></div>` +
        `<div class="lot-fields"></div><div class="match lot-msg"></div>` +
        `<table class="li-table lot-bins"><thead><tr><th>#</th>` +
        f.cols.map((c) => `<th>${escapeHtml(t(c.l))}${c.req ? '<span class="req">*</span>' : ''}</th>`).join('') +
        `<th></th></tr></thead><tbody></tbody></table>` +
        `<button type="button" class="li-add">${escapeHtml(t(L.addBin))}</button>` +
        `<div class="lot-sum"></div>`;
      lot.el = el;
      const msg = el.querySelector('.lot-msg');
      lot.say = (text, ok) => { msg.textContent = text || ''; msg.style.display = text ? 'block' : 'none'; msg.style.color = ok ? 'var(--green)' : 'var(--gold)'; };
      const ctl = {};
      const fieldsEl = el.querySelector('.lot-fields');
      L.cols.forEach((c) => {
        const cell = document.createElement('label');
        cell.className = 'lot-f';
        cell.innerHTML = `<span class="k">${escapeHtml(t(c.l))}${c.req ? '<span class="req">*</span>' : ''}</span>`;
        ctl[c.k] = control(c, (v) => {
          lot.fields[c.k] = v;
          lot.rows.forEach((r) => { r[c.k] = v; });
          if (c.k === 'strain') lot.autoStrain = false;
          if (c.canixStrain) lot.lookup();
          lot.redraw(); changed();
        });
        ctl[c.k].set(lot.fields[c.k]);
        cell.appendChild(ctl[c.k].el);
        fieldsEl.appendChild(cell);
      });
      // Scanned/typed plant tag → its strain from Canix, unless someone
      // picked one already. Only a Strain Library strain is filled in.
      const uidCol = L.cols.find((c) => c.canixStrain);
      lot.lookup = () => {
        if (!uidCol) return;
        const uid = lot.fields[uidCol.k];
        if (!uid) return;
        canixStrainForUid(uid, uidCol.canixPlants).then((name) => {
          if (!name || lot.fields[uidCol.k] !== uid) return;
          if (lot.fields[uidCol.canixStrain] && !lot.autoStrain) return;
          const lc = name.trim().toLowerCase();
          const hit = (reference.strains || []).find((x) => x.active !== false &&
            [x.name, ...(x.aliases || [])].some((n) => String(n || '').trim().toLowerCase() === lc));
          if (!hit) { lot.say(t(LT.canixOff).replace('{s}', name)); return; }
          lot.say('');
          ctl[uidCol.canixStrain].set(hit.name);
          lot.fields[uidCol.canixStrain] = hit.name;
          lot.rows.forEach((r) => { r[uidCol.canixStrain] = hit.name; });
          lot.autoStrain = true;
          lot.redraw(); changed();
        });
      };
      const tbody = el.querySelector('tbody');
      lot.addBin = (prefill) => {
        const row = { ...(prefill || {}), [g.k]: grp.value, _lot: lot.id };
        L.cols.forEach((c) => { row[c.k] = lot.fields[c.k]; });
        values[f.k].push(row);
        lot.rows.push(row);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="li-calc li-num"></td>`;
        f.cols.forEach((c) => {
          const td = document.createElement('td');
          const x = control(c, (v) => { row[c.k] = v; lot.redraw(); changed(); });
          if (row[c.k] !== undefined && row[c.k] !== null) x.set(row[c.k]);
          td.appendChild(x.el); tr.appendChild(td);
        });
        const tdDel = document.createElement('td');
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'li-del'; del.textContent = '×';
        del.setAttribute('aria-label', t(UI.remove));
        del.onclick = () => {
          values[f.k].splice(values[f.k].indexOf(row), 1);
          lot.rows.splice(lot.rows.indexOf(row), 1);
          tr.remove(); lot.redraw(); changed();
        };
        tdDel.appendChild(del); tr.appendChild(tdDel);
        tbody.appendChild(tr);
        lot.redraw();
        return tr;
      };
      lot.redraw = () => {
        const n = grp.lots.indexOf(lot) + 1;
        el.querySelector('.lot-title').textContent = (lot.fields.strain || t(LT.strainN).replace('{n}', n)) +
          (lot.fields.sourceUid ? ` · …${String(lot.fields.sourceUid).slice(-5)}` : '');
        lot.rows.forEach((r, i) => { r.bin = i + 1; });
        tbody.querySelectorAll('.li-num').forEach((td, i) => { td.textContent = String(i + 1); });
        // The last bin keeps its ×-less row so a box always has one to fill.
        tbody.querySelectorAll('.li-del').forEach((b) => { b.style.visibility = lot.rows.length > 1 ? '' : 'hidden'; });
        const filled = lot.rows.filter((r) => Number(r.weight) > 0);
        el.querySelector('.lot-sum').textContent = t(LT.sum)
          .replace('{b}', filled.length)
          .replace('{w}', fmtNum(lot.rows.reduce((a, r) => a + (Number(r.weight) || 0), 0), 2))
          .replace('{p}', fmtNum(lot.rows.reduce((a, r) => a + (Number(r.plantCount) || 0), 0), 0));
      };
      lot.remove = () => {
        values[f.k] = values[f.k].filter((r) => !lot.rows.includes(r));
        grp.lots.splice(grp.lots.indexOf(lot), 1);
        el.remove();
        grp.lots.forEach((l) => l.redraw());
      };
      el.querySelector('.lot-hd .li-group-del').onclick = () => {
        if (lot.rows.some((r) => rowHasData(f, r)) && !confirm(t(LT.removeStrain))) return;
        lot.remove(); changed();
      };
      el.querySelector(':scope > .li-add').onclick = () => {
        const tr = lot.addBin();
        const first = tr.querySelector('input'); if (first) first.focus();
        changed();
      };
      const firstEmptyBin = () => [...tbody.querySelectorAll('tr')].find((tr, i) => !rowHasData(f, lot.rows[i]));
      lot.focusBin = () => {
        const tr = firstEmptyBin() || lot.addBin();
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const first = tr.querySelector('input'); if (first) first.focus();
      };
      lot.focusFirst = () => { const x = el.querySelector('.lot-fields input, .lot-fields select'); if (x) x.focus(); };
      // After a scan: the next box that's still blank (location, Transfer UID).
      lot.focusAfterUid = () => {
        const next = L.cols.find((c) => c.k !== 'sourceUid' && c.t !== 'select' && !lot.fields[c.k]);
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (next) ctl[next.k].inp.focus(); else lot.focusBin();
      };
      grp.lots.push(lot);
      grp.lotsEl.appendChild(el);
      if (bins) for (let i = 0; i < (L.bins || 1); i++) lot.addBin();
      lot.redraw();
      return lot;
    }

    lineitemAdders[f.k] = (prefill) => {
      groups = groups.filter((x) => x.sec.isConnected);
      const val = prefill[g.k] || '';
      const grp = groups.find((x) => x.value === val) || addGroup(val);
      const key = prefill._lot || prefill.sourceUid || '';
      const lot = grp.lots.find((l) => l.id === key || (!prefill._lot && l.fields.sourceUid === prefill.sourceUid))
        || addLot(grp, { ...prefill, _lot: key || undefined }, false);
      lot.addBin(prefill);
    };
    wrap.querySelector(`#addg_${f.k}`).onclick = () => {
      const grp = addGroup('');
      grp.sec.querySelector('.lic select').focus();
    };
    addGroup('');
    return wrap;
  }

  // A `fill` button (Bucking's Calculate): with all but one of `f.keys`
  // filled in, works out the missing one with `f.fill(values, key)` and
  // fills it in — still editable after.
  const FL = {
    needOne: { en: 'Fill in all but one of: {list}', es: 'Llene todos menos uno de: {list}' },
    allSet:  { en: 'All of {list} are filled in already — clear the one to work out, then Calculate.',
               es: 'Ya están llenos {list} — borre el que quiere calcular y luego Calcular.' },
    negative:{ en: 'That comes out below zero ({n} lb) — more is logged coming out than went in. Check the boxes and weights.',
               es: 'Da menos de cero ({n} lb) — se registró más salida que entrada. Revise las cajas y los pesos.' },
    filled:  { en: '✓ {field}: {n} lb', es: '✓ {field}: {n} lb' }
  };
  function buildFill(f, wrap) {
    wrap.innerHTML = `<button type="button" class="fill-btn" id="fb_${f.k}">${escapeHtml(t(f.l))}</button>` +
      `<div class="fill-msg" id="fm_${f.k}"></div>` + (f.hint ? `<div class="hint">${t(f.hint)}</div>` : '');
    const msg = wrap.querySelector(`#fm_${f.k}`);
    const say = (text, ok) => { msg.textContent = text; msg.className = `fill-msg ${ok ? 'ok' : 'err'}`; };
    wrap.querySelector(`#fb_${f.k}`).addEventListener('click', () => {
      const fields = f.keys.map((k) => station.fields.find((x) => x.k === k));
      const names = fields.map((x) => t(x.l)).join(', ');
      const blank = fields.filter((x) => (x.t === 'lineitems' ? !(values[x.k] || []).length
        : values[x.k] === undefined || values[x.k] === null || values[x.k] === ''));
      if (blank.length === 0) return say(t(FL.allSet).replace('{list}', names));
      if (blank.length > 1) return say(t(FL.needOne).replace('{list}', names));
      const target = blank[0];
      recompute();   // totals from what's logged right now
      const n = Math.round(f.fill(values, target.k) * 100) / 100;
      if (!Number.isFinite(n) || n < 0) return say(t(FL.negative).replace('{n}', fmtNum(n, 2)));
      // An entry log (Bucking's stems) gets it as one logged row.
      if (target.t === 'lineitems') {
        values[target.k].push({ [target.totalCol]: n, _id: crypto.randomUUID(), day: todayStr(), at: new Date().toISOString(), by: owner });
        entryRenderers[target.k]();
      } else {
        setFieldValue(target, n);
        touched.add(target.k);
      }
      recompute(); updateVisibility(); markDirty();
      say(t(FL.filled).replace('{field}', t(target.l)).replace('{n}', fmtNum(n, 2)), true);
    });
    return wrap;
  }

  // A running log (`entry: true`, Bucking's boxes / bucked / trim): instead
  // of a grid of empty rows, one entry bar with the row's columns and an Add
  // button, and the rows logged so far underneath, newest first. Each row
  // gets an id, the day and time, and who logged it, so two tablets on the
  // same page merge their rows (mergeEntries) instead of the last save
  // winning.
  const EL = {
    add:     { en: 'Add', es: 'Agregar' },
    time:    { en: 'Time', es: 'Hora' },
    none:    { en: 'Nothing logged yet.', es: 'Nada registrado todavía.' },
    entry:   { en: 'entry', es: 'registro' },
    entries: { en: 'entries', es: 'registros' },
    remove:  { en: 'Remove this entry?', es: '¿Quitar este registro?' },
    fill:    { en: 'Fill in:', es: 'Complete:' }
  };
  const entryRenderers = {};
  // Day tabs (station.dayTabs — Hand Trim, Bucking): one lot is often worked over
  // several days, so its page has a tab per day under the lot tabs. The
  // running log named by `dayTabs.lines` shows only the picked day's rows,
  // and Add stamps new rows with that day. Days with nothing logged yet that
  // someone added are kept in `runDays`. Today is always a tab.
  // `dayTabs.lines` is one log (Hand Trim's bags) or several (Pre-Roll's
  // output and workforce logs); the day chips total the first.
  const DT = station.dayTabs || null;
  const DTL = DT ? [].concat(DT.lines) : [];
  let curDay = todayStr();
  const rowDay = (r) => r.day || values.date || todayStr();
  // Editing a submitted record shows every day's rows, no tabs.
  const byDay = (f) => !!DT && !editMode && DTL.includes(f.k);
  const stampDay = (f) => (byDay(f) ? curDay : todayStr());
  const DY = {
    label: { en: 'Days', es: 'Días' },
    today: { en: 'Today', es: 'Hoy' },
    add:   { en: '+ Add day', es: '+ Agregar día' },
    addGo: { en: 'Add', es: 'Agregar' },
    move:  { en: '✎ Change date', es: '✎ Cambiar fecha' },
    remove:{ en: '✕ Remove day', es: '✕ Quitar día' },
    moveGo:{ en: 'Move', es: 'Mover' }
  };
  function dayLabel(d) {
    const [, m, dd] = String(d).split('-').map(Number);
    return `${m}/${dd}`;
  }
  function dayList() {
    const rows = DTL.flatMap((k) => values[k] || []);
    // Removed tabs (`hiddenDays`) stay off unless something is logged on them.
    const hidden = new Set(values.hiddenDays || []);
    const extra = [...(values.runDays || []), values.date, todayStr(), curDay].filter((d) => d && !hidden.has(d));
    return [...new Set([...rows.map(rowDay), ...extra])].filter(Boolean).sort();
  }
  const dayHasRows = (d) => DTL.some((k) => (values[k] || []).some((r) => rowDay(r) === d));
  // Remove day: an empty tab that isn't the Start Date (e.g. Today on a
  // backdated run) comes off, kept in `hiddenDays` so it doesn't come back.
  const canRemoveDay = (d) => d !== values.date && !dayHasRows(d) && dayList().length > 1;
  function hideDay(d) {
    values.hiddenDays = [...new Set([...(values.hiddenDays || []), d])].sort();
    values.runDays = (values.runDays || []).filter((x) => x !== d);
  }
  const unhideDay = (d) => { if ((values.hiddenDays || []).includes(d)) values.hiddenDays = values.hiddenDays.filter((x) => x !== d); };
  // A run with nothing logged yet goes to its Start Date's tab — a backdated
  // run's crew, project and output belong to that day, not today. Run on
  // load and when the Start Date is changed.
  function goToStartDay() {
    if (!DT || editMode || !values.date || values.date === curDay) return;
    if (DTL.some((k) => (values[k] || []).length)) return;
    pickDay(values.date);
    renderDays();
  }
  function renderDays() {
    if (!DT || editMode) return;
    const el = document.getElementById('days');
    const lbl = document.getElementById('days-lbl');
    const f = station.fields.find((x) => x.k === DTL[0]);
    const total = (d) => (values[DTL[0]] || []).filter((r) => rowDay(r) === d).reduce((a, r) => a + (Number(r[f.totalCol]) || 0), 0);
    const tc = f.cols.find((c) => c.k === f.totalCol);
    const amt = (d) => (DT.fromGrams ? `${fmtNum(total(d) / G_PER_LB, 2)} lb` : fmtNum(total(d), tc && tc.dp !== undefined ? tc.dp : 2));
    const wk = (d) => new Date(`${d}T12:00:00`).toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US', { weekday: 'short' });
    lbl.textContent = t(DY.label);
    lbl.style.display = 'block';
    el.style.display = 'flex';
    const adding = el.dataset.adding === '1';
    const moving = el.dataset.moving === '1';
    el.innerHTML = dayList().map((d) =>
      `<button type="button" class="chip${d === curDay ? ' on' : ''}" data-day="${d}">` +
        `<span class="cs">${escapeHtml(d === todayStr() ? t(DY.today) : wk(d))}</span>` +
        `<span class="cv">${escapeHtml(dayLabel(d))} · ${escapeHtml(amt(d))}</span></button>`).join('') +
      (adding
        ? `<span class="chip day-add"><input type="date" id="day-add-in" value="${escapeAttr(shiftDate(dayList().slice(-1)[0], 1))}">` +
          `<button type="button" class="day-add-go" id="day-add-go">${t(DY.addGo)}</button></span>`
        : `<button type="button" class="chip new" id="day-add">${t(DY.add)}</button>`) +
      (moving
        ? `<span class="chip day-add"><input type="date" id="day-move-in" value="${escapeAttr(curDay)}">` +
          `<button type="button" class="day-add-go" id="day-move-go">${t(DY.moveGo)}</button></span>`
        : `<button type="button" class="chip new" id="day-move">${t(DY.move)}</button>`) +
      (canRemoveDay(curDay) && !moving && !adding ? `<button type="button" class="chip new" id="day-remove">${t(DY.remove)}</button>` : '');
  }
  // Change date: the picked day tab, with everything logged on it, moves to
  // another day — for a tab that was made for the wrong date (a new run
  // opens on Today). Rows are re-added under new ids and the old ids go in
  // `_deleted`, so other tablets on the run drop the old ones too. That
  // day's project (projectDays) and added day (runDays) move with it, and
  // the Start Date does when it was that day.
  function moveDay(from, to) {
    if (!to || to === from || isClosed) return;
    const gone = new Set(values._deleted || []);
    DTL.forEach((k) => {
      const f = station.fields.find((x) => x.k === k);
      values[k] = (values[k] || []).map((r) => {
        if (rowDay(r) !== from) return r;
        const moved = { ...r, day: to };
        (f.cols || []).filter((c) => c.fromDay).forEach((c) => { moved[c.k] = to; });
        if (r._id) { gone.add(r._id); moved._id = crypto.randomUUID(); }
        return moved;
      });
    });
    values._deleted = [...gone];
    values.runDays = [...new Set([...(values.runDays || []).filter((d) => d !== from), to])].sort();
    // The old tab doesn't stay behind empty (Today, on a backdated run).
    unhideDay(to);
    if (!dayHasRows(from)) hideDay(from);
    if (values.projectDays && from in values.projectDays) {
      const pd = { ...values.projectDays };
      if (!(to in pd)) pd[to] = pd[from];
      delete pd[from];
      values.projectDays = pd;
    }
    if (values.date === from) setFieldValue(station.fields.find((x) => x.k === 'date'), to);
    touched.add('date');
    markDirty();
    pickDay(to);
    renderDays();
  }
  function pickDay(d) {
    curDay = d;
    if (perDayProj) fillProjectPicker();
    DTL.forEach((k) => entryRenderers[k] && entryRenderers[k]());
    recompute();
    if (station.dailySummary && draftsOn) loadSummary(d);
  }
  if (DT) form.addEventListener('change', (e) => { if (e.target.id === 'f_date') goToStartDay(); });
  if (DT) document.getElementById('days').addEventListener('click', (e) => {
    const el = document.getElementById('days');
    const day = e.target.closest('[data-day]');
    if (day) { pickDay(day.dataset.day); return; }
    if (e.target.closest('#day-add')) { el.dataset.adding = '1'; el.dataset.moving = ''; renderDays(); document.getElementById('day-add-in').focus(); return; }
    if (e.target.closest('#day-move')) { el.dataset.moving = '1'; el.dataset.adding = ''; renderDays(); document.getElementById('day-move-in').focus(); return; }
    if (e.target.closest('#day-remove')) {
      if (!canRemoveDay(curDay)) return;
      hideDay(curDay);
      markDirty();
      const rest = dayList().filter((d) => d !== curDay);
      pickDay(rest.includes(values.date) ? values.date : rest[rest.length - 1]);
      renderDays();
      return;
    }
    if (e.target.closest('#day-move-go')) {
      const d = document.getElementById('day-move-in').value;
      el.dataset.moving = '';
      if (d && d !== curDay) moveDay(curDay, d); else renderDays();
      return;
    }
    if (e.target.closest('#day-add-go')) {
      const d = document.getElementById('day-add-in').value;
      el.dataset.adding = '';
      if (d) {
        unhideDay(d);
        values.runDays = [...new Set([...(values.runDays || []), d])].sort();
        markDirty();
        pickDay(d);
      } else renderDays();
    }
  });
  function buildEntryLog(f, wrap) {
    values[f.k] = [];
    // A `rownum` column (box #) isn't typed: rows are numbered 1, 2, 3… in
    // the order they were logged, renumbered when one is removed, and the
    // entry bar shows the number the next one gets.
    // `calc` columns (Pre-Roll's hours) are worked out when a row is added
    // and shown in the log; `fromDay` ones (its workDate) take the row's day.
    const cols = f.cols.filter((c) => !c.fromDay);
    const calcs = f.cols.filter((c) => c.t === 'calc');
    const fromDay = f.cols.filter((c) => c.fromDay);
    const ins = cols.filter((c) => c.t !== 'rownum' && c.t !== 'calc');
    const nums = cols.filter((c) => c.t === 'rownum');
    // `multi` (Hand Trim's bags): the value column is entered as Bags × each
    // plus a Partial, each bag becoming its own row.
    const M = f.multi || null;
    const multiBar = !M ? '' :
      `<label class="entry-in entry-num"><span class="k">${t(M.qty)}</span><div class="qty">` +
        `<button type="button" class="qty-btn" data-qty="-1" aria-label="−">−</button>` +
        `<input type="number" id="eq_${f.k}" inputmode="numeric" step="1" min="0" value="1">` +
        `<button type="button" class="qty-btn" data-qty="1" aria-label="+">+</button></div></label>` +
      `<label class="entry-in"><span class="k">${t(M.each)}</span>` +
        `<input type="number" id="e_${f.k}_${M.col}" inputmode="decimal" step="any" min="0" value="${M.def}"></label>` +
      `<label class="entry-in"><span class="k">${t(M.partial)}</span>` +
        `<input type="number" id="ep_${f.k}" inputmode="decimal" step="any" min="0"></label>`;
    wrap.innerHTML = labelHtml(f) +
      (f.hint ? `<div class="hint" style="margin-top:0;margin-bottom:10px">${t(f.hint)}</div>` : '') +
      `<div class="entry-bar">` +
      cols.filter((c) => c.t !== 'calc').map((c) => (M && c.k === M.col) ? multiBar : `<label class="entry-in${c.t === 'rownum' ? ' entry-num' : ''}"><span class="k">${t(c.l)}${c.req ? '<span class="req">*</span>' : ''}</span>` +
        (c.t === 'rownum' ? `<div class="entry-next" id="en_${f.k}_${c.k}">1</div>`
        : c.t === 'number'
          ? `<input type="number" id="e_${f.k}_${c.k}" inputmode="decimal" step="${c.step || 'any'}"${c.min !== undefined ? ` min="${c.min}"` : ''}>`
          : c.t === 'time' ? `<input type="time" id="e_${f.k}_${c.k}">`
          : `<input type="text" id="e_${f.k}_${c.k}"${c.inputmode ? ` inputmode="${c.inputmode}"` : ''}>`) +
        `</label>`).join('') +
      `<button type="button" class="entry-add" id="add_${f.k}">${t(EL.add)}</button></div>` +
      `<div class="entry-msg" id="em_${f.k}"></div>` +
      `<div class="li-scroll"><table class="li-table entry-table"><tbody id="li_${f.k}"></tbody></table></div>` +
      `<div class="entry-empty" id="ee_${f.k}">${t(EL.none)}</div>` +
      `<div class="li-total"><span class="k" id="lic_${f.k}"></span><span class="v" id="lit_${f.k}">0</span></div>`;

    const inp = (c) => wrap.querySelector(`#e_${f.k}_${c.k}`);
    const msg = wrap.querySelector(`#em_${f.k}`);
    let fresh = new Set();   // ids of the row(s) just added

    const render = () => {
      const rows = values[f.k] || [];
      rows.forEach((r, i) => nums.forEach((c) => { r[c.k] = i + 1; }));
      nums.forEach((c) => { wrap.querySelector(`#en_${f.k}_${c.k}`).textContent = String(rows.length + 1); });
      const tbody = wrap.querySelector(`#li_${f.k}`);
      tbody.innerHTML = '';
      // With day tabs, only the picked day's rows (the lot's total is in the
      // calcs below the log).
      const shown = byDay(f) ? rows.filter((r) => rowDay(r) === curDay) : rows;
      shown.slice().reverse().forEach((r) => {
        const tr = document.createElement('tr');
        if (r._id && fresh.has(r._id)) tr.className = 'fresh';
        const at = r.at ? new Date(r.at) : null;
        const when = at ? ((r.day && r.day !== todayStr() && !byDay(f) ? new Date(`${r.day}T12:00:00`).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' : '') +
          at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) : '';
        tr.innerHTML = cols.map((c) => `<td>${escapeHtml(c.t === 'number' || c.t === 'calc' ? fmtNum(r[c.k], c.dp === undefined ? 2 : c.dp) : (r[c.k] ?? ''))}</td>`).join('') +
          `<td class="at">${escapeHtml(when)}</td><td></td>`;
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'li-del'; del.textContent = '×';
        del.setAttribute('aria-label', t(UI.remove));
        del.onclick = () => {
