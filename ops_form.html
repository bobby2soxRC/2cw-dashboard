          if (!confirm(t(EL.remove))) return;
          const i = values[f.k].indexOf(r);
          if (i > -1) values[f.k].splice(i, 1);
          if (r._id) values._deleted = [...(values._deleted || []), r._id];
          render(); recompute(); markDirty();
        };
        tr.lastChild.appendChild(del);
        tbody.appendChild(tr);
      });
      wrap.querySelector(`#ee_${f.k}`).style.display = shown.length ? 'none' : 'block';
      wrap.querySelector(`#lic_${f.k}`).textContent = (byDay(f) ? `${dayLabel(curDay)} · ` : '') +
        `${shown.length} ${t(shown.length === 1 ? EL.entry : EL.entries)}`;
      if (byDay(f)) {
        const tot = shown.reduce((a, r) => a + (Number(r[f.totalCol]) || 0), 0);
        const tc = f.cols.find((c) => c.k === f.totalCol);
        wrap.querySelector(`#lit_${f.k}`).textContent = fmtNum(tot, tc && tc.dp !== undefined ? tc.dp : 0);
      }
      if (byDay(f)) renderDays();
    };
    entryRenderers[f.k] = render;

    const qtyIn = M ? wrap.querySelector(`#eq_${f.k}`) : null;
    const partIn = M ? wrap.querySelector(`#ep_${f.k}`) : null;
    if (M) wrap.querySelectorAll('.qty-btn').forEach((b) => b.addEventListener('click', () => {
      qtyIn.value = String(Math.max(0, (parseInt(qtyIn.value, 10) || 0) + Number(b.dataset.qty)));
    }));
    // Bags × each + Partial → one row per bag, same employee # and time.
    const addMulti = () => {
      const base = {};
      const short = [];
      ins.filter((c) => c.k !== M.col).forEach((c) => {
        const raw = inp(c).value.trim();
        base[c.k] = c.t === 'number' ? (raw === '' ? null : Number(raw)) : raw;
        if (c.req && raw === '') short.push(c);
      });
      const qty = Math.max(0, parseInt(qtyIn.value, 10) || 0);
      const each = Number(inp({ k: M.col }).value) || 0;
      const part = Number(partIn.value) || 0;
      const fail = (cs, focus) => { msg.textContent = `${t(EL.fill)} ${cs.map((l) => t(l)).join(', ')}`; msg.style.display = 'block'; focus.focus(); };
      if (short.length) return fail(short.map((c) => c.l), inp(short[0]));
      if (qty > 0 && !(each > 0)) return fail([M.each], inp({ k: M.col }));
      if (!(qty > 0 && each > 0) && !(part > 0)) return fail([M.qty, M.partial], qtyIn);
      msg.style.display = 'none';
      const at = new Date().toISOString();
      const grams = [...Array(qty > 0 && each > 0 ? qty : 0).fill(each), ...(part > 0 ? [part] : [])];
      grams.forEach((g) => values[f.k].push({ ...base, [M.col]: g, _id: crypto.randomUUID(), day: stampDay(f), at, by: owner }));
      fresh = new Set(values[f.k].slice(-grams.length).map((r) => r._id));
      ins.filter((c) => c.k !== M.col).forEach((c) => { inp(c).value = ''; });
      qtyIn.value = '1';
      partIn.value = '';
      render(); recompute(); markDirty();
      inp(ins[0]).focus();
    };

    const add = () => {
      if (M) return addMulti();
      const row = {};
      const short = [];
      ins.forEach((c) => {
        const raw = inp(c).value.trim();
        row[c.k] = c.t === 'number' ? (raw === '' ? null : Number(raw)) : raw;
        if (c.req && (raw === '' || (c.t === 'number' && !(Number(raw) > 0)))) short.push(c);
      });
      // A log with no required column (Pre-Roll's output) still needs a number.
      if (!ins.some((c) => c.req) && ins.every((c) => c.t !== 'number' || row[c.k] === null)) short.push(...ins.filter((c) => c.t === 'number'));
      if (short.length) {
        msg.textContent = `${t(EL.fill)} ${short.map((c) => t(c.l)).join(', ')}`;
        msg.style.display = 'block';
        inp(short[0]).focus();
        return;
      }
      msg.style.display = 'none';
      Object.assign(row, { _id: crypto.randomUUID(), day: stampDay(f), at: new Date().toISOString(), by: owner });
      fromDay.forEach((c) => { row[c.k] = row.day; });
      calcs.forEach((c) => { try { row[c.k] = c.calc(row); } catch { row[c.k] = null; } });
      values[f.k].push(row);
      fresh = new Set([row._id]);
      ins.forEach((c) => { inp(c).value = ''; });
      render(); recompute(); markDirty();
      inp(ins[0]).focus();
    };
    wrap.querySelector(`#add_${f.k}`).onclick = add;
    // Enter moves to the next empty box, and adds once they're all filled.
    ins.forEach((c) => inp(c).addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      const empty = ins.find((x) => x.req && !inp(x).value.trim());
      if (empty) inp(empty).focus(); else add();
    }));
    if (M) [qtyIn, partIn].forEach((el) => el.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      add();
    }));

    // hydrate() clears the tbody and values, then calls this once per row.
    lineitemAdders[f.k] = (prefill) => { values[f.k].push({ ...prefill }); render(); };
    render();
    return wrap;
  }

  // Merges another tablet's rows into this page's running logs: rows it
  // added appear here, rows it removed go away here. Returns true if
  // anything changed. Plain fields this tablet hasn't touched since its
  // last save take the saved value too, so stems typed on one tablet don't
  // get blanked by another.
  const entryFields = station.fields.filter((f) => (f.t === 'lineitems' || f.t === 'crewcheck') && f.entry);
  const touched = new Set();
  function mergeEntries(saved) {
    if (!saved || !entryFields.length) return false;
    const gone = new Set([...(values._deleted || []), ...(saved._deleted || [])]);
    values._deleted = [...gone];
    let changed = false;
    // Days added on another tablet (day tabs) show up here too.
    if (Array.isArray(saved.runDays) && saved.runDays.some((d) => !(values.runDays || []).includes(d))) {
      values.runDays = [...new Set([...(values.runDays || []), ...saved.runDays])].sort();
      changed = true;
      if (DT) renderDays();
    }
    // …and so do days removed there.
    if (Array.isArray(saved.hiddenDays) && saved.hiddenDays.some((d) => !(values.hiddenDays || []).includes(d))) {
      values.hiddenDays = [...new Set([...(values.hiddenDays || []), ...saved.hiddenDays])].sort();
      changed = true;
      if (DT) renderDays();
    }
    entryFields.forEach((f) => {
      const mine = (values[f.k] || []).filter((r) => !r._id || !gone.has(r._id));
      const have = new Set(mine.map((r) => r._id));
      const theirs = (saved[f.k] || []).filter((r) => r._id && !have.has(r._id) && !gone.has(r._id));
      if (mine.length === (values[f.k] || []).length && !theirs.length) return;
      values[f.k] = [...mine, ...theirs].sort((a, b) => String(a.at || '').localeCompare(String(b.at || '')));
      entryRenderers[f.k]();
      changed = true;
    });
    station.fields.forEach((f) => {
      if (['calc', 'lineitems', 'crewcheck', 'photo'].includes(f.t) || touched.has(f.k)) return;
      const v = saved[f.k];
      if (v === undefined || v === null || v === '' || v === values[f.k]) return;
      setFieldValue(f, v);
      changed = true;
    });
    // Another tablet moved this page's packages to a project, or picked a
    // day's project.
    if (projField && !touched.has(projField.k)) {
      if (saved.projectLinked && saved.projectLinked !== values.projectLinked) {
        values.projectLinked = saved.projectLinked;
        if (saved.projectName) values.projectName = saved.projectName;
      }
      if (Array.isArray(saved.projectsLinked)) values.projectsLinked = saved.projectsLinked;
      if (saved.projectDays && JSON.stringify(saved.projectDays) !== JSON.stringify(values.projectDays || null)) {
        values.projectDays = saved.projectDays;
        if (saved.projectName) values.projectName = saved.projectName;
        fillProjectPicker();
        ccFields.forEach((f) => entryRenderers[f.k] && entryRenderers[f.k]());
        changed = true;
      }
    }
    if (changed) { updateVisibility(); recompute(); }
    return changed;
  }

  // A worksheet row counts once someone typed into it — a column's default
  // (container type, today's date), a value carried down from the row above
  // (UID, strain, tare) or a calc result alone doesn't make it real.
  function rowHasData(f, r) {
    return f.cols.some((c) => {
      if (c.t === 'calc' || c.t === 'rownum' || c.carry) return false;
      const x = r[c.k];
      if (x === '' || x === null || x === undefined) return false;
      return !(c.def !== undefined && String(x) === String(c.def)) && !(c.t === 'date' && c.today);
    });
  }

  // What's wrong with a worksheet's filled-in rows, as a message for the
  // banner — or null if nothing is.
  const LI = {
    needs:    { en: 'Every filled-in row needs:', es: 'Cada fila llena necesita:' },
    twoStrains: { en: 'is listed with more than one strain — check the rows.', es: 'aparece con más de una variedad — revise las filas.' },
    plants:   { en: 'Put the plant count on a bin of:', es: 'Ponga el número de plantas en un bin de:' }
  };
  function lineProblem(f) {
    const rows = (values[f.k] || []).filter((r) => rowHasData(f, r));
    const blank = (x) => x === undefined || x === null || x === '';
    const short = [f.group, ...(f.lots ? f.lots.cols : []), ...f.cols].filter((c) => c && c.req && rows.some((r) => blank(r[c.k])));
    if (short.length) return `${t(LI.needs)} ${short.map((c) => t(c.l)).join(', ')}`;
    // A strain box needs a plant count on at least one of its bins.
    if (f.lots && f.lots.plantsReq) {
      const plants = new Map();
      rows.forEach((r) => { const k = r._lot || r.sourceUid; plants.set(k, (plants.get(k) || 0) + (Number(r.plantCount) || 0)); });
      const none = [...plants].filter(([, n]) => !(n > 0)).map(([k]) => rows.find((r) => (r._lot || r.sourceUid) === k));
      if (none.length) return `${t(LI.plants)} ${none.map((r) => r.strain || r.sourceUid).join(', ')}`;
    }
    if (station.splitBy === f.k) {
      const seen = {};
      for (const r of rows) {
        if (seen[r.sourceUid] !== undefined && seen[r.sourceUid] !== r.strain) return `UID ${r.sourceUid} ${t(LI.twoStrains)}`;
        seen[r.sourceUid] = r.strain;
      }
    }
    return null;
  }

  // Stations with `splitBy` save one record per UID in that worksheet: each
  // gets only its own rows, the UID and strain at the top, and its calc
  // fields (totals) worked out again from just those rows (plus any `lift`
  // columns). Fields hidden on
  // the whole form (the Metrc adjustment, once there's more than one UID)
  // aren't copied onto the pieces. The first record keeps `firstId`; the
  // rest get ids that stay fixed for this page, so a retried submit
  // overwrites them instead of duplicating.
  const splitIds = {};
  function splitRecords(payload, firstId) {
    if (!station.splitBy) return [{ id: firstId, fields: payload }];
    const base = { ...payload };
    station.fields.forEach((f) => { if (f.showIf && !f.showIf(payload)) delete base[f.k]; });
    const groups = new Map();
    (payload[station.splitBy] || []).forEach((r) => {
      if (!groups.has(r.sourceUid)) groups.set(r.sourceUid, []);
      groups.get(r.sourceUid).push(r);
    });
    const splitField = station.fields.find((f) => f.k === station.splitBy);
    const lifted = splitField.cols.filter((c) => c.lift).map((c) => c.k)
      .concat(splitField.group ? [splitField.group.k] : [])
      .concat(splitField.lots ? splitField.lots.cols.map((c) => c.k).filter((k) => k !== 'sourceUid' && k !== 'strain') : []);
    return [...groups.entries()].map(([uid, rows], i) => {
      const g = { ...base, [station.splitBy]: rows, sourceUid: uid, strain: rows[0].strain };
      lifted.forEach((k) => { g[k] = rows[0][k]; });
      station.fields.filter((f) => f.t === 'calc').forEach((f) => {
        try { g[f.k] = f.calc(g); } catch { g[f.k] = null; }
      });
      return { id: i === 0 ? firstId : (splitIds[uid] = splitIds[uid] || crypto.randomUUID()), fields: g };
    });
  }

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const escapeAttr = escapeHtml;

  station.fields.forEach((f) => {
    const wrap = buildField(f);
    // Filled in later by the Canix sync (Wet Intake's farm license, CID,
    // manifest #…), so not asked for while the truck is weighed — only when
    // a submitted record is reopened with Edit, to fix or type them in.
    if (f.fromCanix && !editMode) wrap.style.display = 'none';
    form.appendChild(wrap);
    els[f.k] = wrap;
  });

  // ── Wire inputs ───────────────────────────────────────────────────────────
  station.fields.forEach((f) => {
    if (f.t === 'calc' || f.t === 'lineitems') return;
    const inp = document.getElementById(`f_${f.k}`);
    if (!inp) return;

    if (f.t === 'date' && f.today !== false) {
      inp.value = new Date().toISOString().slice(0, 10);
      values[f.k] = inp.value;
    }
    if (f.def) { inp.value = f.def; values[f.k] = f.def; }

    // Whoever is logged into this tablet is almost always the person signing
    // the form, so fill their name in for them — still editable, because
    // stations do get handed off mid-shift.
    if (PERSON_FIELDS.has(f.k)) {
      const who = sessionStorage.getItem('2cw_user_name');
      if (who) { inp.value = who; values[f.k] = who; }
    }

    if (f.t === 'photo') {
      inp.addEventListener('change', async () => {
        const file = inp.files && inp.files[0];
        if (!file) { values[f.k] = null; return; }
        values[f.k] = await compressImage(file);
        const img = document.getElementById(`p_${f.k}`);
        img.src = values[f.k].dataUrl; img.style.display = 'block';
        // Not autosaved — see the note in docs about photos and cross-device resume.
      });
      return;
    }

    const other = f.allowOther ? document.getElementById(`o_${f.k}`) : null;
    const read = () => {
      if (f.t === 'select' && inp.value === '__other__') return other ? other.value.trim() : '';
      if (f.t === 'check') return inp.checked;
      if (f.t === 'number') return inp.value === '' ? null : Number(inp.value);
      if (f.t === 'uid') return inp.value.trim().toUpperCase();
      return inp.value.trim();
    };
    const onChange = () => {
      if (other) other.style.display = inp.value === '__other__' ? 'block' : 'none';
      // A letter O typed for a zero (Manifest #) — fixed in the box as it's
      // typed, cursor left where it was (same length, so same place).
      if (f.oToZero && /[oO]/.test(inp.value)) {
        const at = inp.selectionStart;
        inp.value = inp.value.replace(/[oO]/g, '0');
        try { inp.setSelectionRange(at, at); } catch (_) { /* not a text input */ }
      }
      values[f.k] = read();
      touched.add(f.k);
      // Checkboxes sharing a `group` are pick-one: checking one clears the rest.
      if (f.t === 'check' && f.group && inp.checked) {
        station.fields.filter((g) => g.group === f.group && g.k !== f.k).forEach((g) => {
          const o = document.getElementById(`f_${g.k}`);
          if (o && o.checked) { o.checked = false; values[g.k] = false; touched.add(g.k); }
        });
      }
      recompute();
      updateVisibility();
      markDirty();
    };
    inp.addEventListener('input', onChange);
    inp.addEventListener('change', onChange);
    if (other) other.addEventListener('input', () => { values[f.k] = read(); touched.add(f.k); recompute(); markDirty(); });

    // Only the uid marked prefill: 'lookup' names the upstream package — Take
    // Down also has the on-stem UID, a brand-new tag nothing upstream knows.
    if (f.t === 'uid' && f.prefill === 'lookup') inp.addEventListener('change', () => tryPrefill(inp.value.trim(), f.k));
  });

  // ── Driver dropdown (driverPicker — Harvest) ─────────────────────────────
  // The drivers table through netlify/functions/drivers.js (it holds ID
  // numbers and photos, so it isn't readable from the browser directly).
  // Picking one sets driver (name), driverIdNumber and driverId; "+ Add a
  // new driver" saves a new one (name, ID #, photo of the ID) and picks it.
  const driverFields = station.fields.filter((f) => f.driverPicker);
  let drivers = null;   // null while loading / if it failed
  let driversFailed = false;
  const driverName = (d) => `${d.first} ${d.last}`.trim();
  const callDrivers = async (body) => {
    const res = await fetch('/.netlify/functions/drivers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, pin: sessionStorage.getItem('2cw_pin') || '' })
    });
    let j;
    try { j = await res.json(); } catch { j = { ok: false, error: `HTTP ${res.status}` }; }
    if (!res.ok || !j.ok) throw new Error(j.error || `HTTP ${res.status}`);
    return j;
  };
  function fillDriverPicker(f) {
    const sel = document.getElementById(`dp_${f.k}`);
    if (!sel) return;
    const list = drivers || [];
    const cur = values.driverId !== undefined && values.driverId !== null ? String(values.driverId) : '';
    const known = list.some((d) => String(d.id) === cur);
    sel.innerHTML = `<option value="">${escapeHtml(t(drivers ? DV.choose : driversFailed ? DV.failed : DV.loading))}</option>` +
      list.map((d) => `<option value="${escapeAttr(d.id)}">${escapeHtml(`${driverName(d)} — ${t(DV.id)} ${d.idNumber}`)}</option>`).join('') +
      // A driver saved on this record but not on the list (made inactive since).
      (!known && values[f.k] ? `<option value="__saved__">${escapeHtml(values[f.k] + (values.driverIdNumber ? ` — ${t(DV.id)} ${values.driverIdNumber}` : ''))}</option>` : '') +
      `<option value="__new__">${escapeHtml(t(DV.addNew))}</option>`;
    sel.value = known ? cur : values[f.k] ? '__saved__' : '';
  }
  function pickDriver(f, d) {
    values[f.k] = d ? driverName(d) : '';
    values.driverIdNumber = d ? d.idNumber : '';
    values.driverId = d ? d.id : null;
    touched.add(f.k);
    els[f.k].classList.remove('invalid');
    recompute(); updateVisibility(); markDirty();
  }
  driverFields.forEach((f) => {
    const sel = document.getElementById(`dp_${f.k}`);
    const panel = document.getElementById(`dn_${f.k}`);
    const msg = panel.querySelector('.match');
    const inp = (k) => panel.querySelector(`[data-k="${k}"]`);
    const say = (text, ok) => { msg.textContent = text; msg.style.display = text ? 'block' : 'none'; msg.style.color = ok ? 'var(--green)' : 'var(--gold)'; };
    let photo = null;
    sel.addEventListener('change', () => {
      panel.style.display = sel.value === '__new__' ? 'block' : 'none';
      if (sel.value === '__new__') { say(''); inp('first').focus(); return; }
      if (sel.value === '__saved__') return;
      pickDriver(f, (drivers || []).find((d) => String(d.id) === sel.value) || null);
    });
    inp('photo').addEventListener('change', async () => {
      const file = inp('photo').files && inp('photo').files[0];
      photo = file ? await compressImage(file) : null;
      const img = panel.querySelector('.photo-wrap img');
      img.src = photo ? photo.dataUrl : ''; img.style.display = photo ? 'block' : 'none';
    });
    panel.querySelector('.drv-save').addEventListener('click', async (e) => {
      const btnSave = e.currentTarget;
      const first = inp('first').value.trim(), last = inp('last').value.trim(), idNumber = inp('idNumber').value.trim().toUpperCase();
      if (!first || !last || !idNumber || !photo) return say(t(DV.need));
      if (!navigator.onLine) return say(t(DV.offline));
      btnSave.disabled = true; btnSave.textContent = t(DV.saving);
      try {
        const j = await callDrivers({ action: 'add', first, last, idNumber, photo: photo.dataUrl });
        drivers = (drivers || []).filter((d) => d.id !== j.driver.id).concat(j.driver)
          .sort((a, b) => driverName(a).localeCompare(driverName(b)));
        driversFailed = false;
        pickDriver(f, j.driver);
        driverFields.forEach(fillDriverPicker);
        ['first', 'last', 'idNumber', 'photo'].forEach((k) => { inp(k).value = ''; });
        photo = null; panel.querySelector('.photo-wrap img').style.display = 'none';
        panel.style.display = 'none';
        say('');
        if (j.existed) alert(t(DV.existed));
      } catch (err) {
        say(String(err.message || err));
      } finally {
        btnSave.disabled = false; btnSave.textContent = t(DV.save);
      }
    });
  });
  const plateFields = station.fields.filter((f) => f.platePicker);
  const driversList = driverFields.length || plateFields.length ? callDrivers({ action: 'list' }) : null;
  if (driverFields.length) {
    driversList
      .then((j) => { drivers = j.drivers || []; })
      .catch((err) => { console.error('drivers', err); driversFailed = true; })
      .finally(() => driverFields.forEach(fillDriverPicker));
  }

  // ── License plate list (platePicker — Harvest) ───────────────────────────
  // Canix's transfers don't carry the truck's plate, so the list is the
  // trucks set up in the admin panel (Drivers and Trucks — "PLATE — #truck ·
  // description"), then any other plate already used on a Harvest form;
  // Other types a new one. Picking a truck with a Truck # fills the form's
  // Truck # if it's blank.
  plateFields.forEach((f) => {
    const sel = document.getElementById(`f_${f.k}`);
    let trucks = [];
    Promise.all([
      driversList.then((j) => j.trucks || []).catch(() => []),
      draftsOn ? loadSubmitted(station.key).catch((err) => { console.error('plates', err); return []; }) : []
    ]).then(([list, recs]) => {
      trucks = list;
      const up = (x) => String(x || '').trim().toUpperCase();
      const known = new Set(trucks.map((x) => up(x.plate)));
      const otherOpt = sel.querySelector('option[value="__other__"]');
      const add = (v, label) => {
        let o = sel.querySelector(`option[value="${CSS.escape(v)}"]`);
        if (!o) { o = document.createElement('option'); o.value = v; sel.insertBefore(o, otherOpt); }
        o.textContent = label;
      };
      trucks.filter((x) => x.active).forEach((x) => add(up(x.plate),
        [up(x.plate), [x.truckNo ? `#${x.truckNo}` : '', x.description || ''].filter(Boolean).join(' · ')].filter(Boolean).join(' — ')));
      [...new Set(recs.map((r) => up(r[f.k])).filter(Boolean))].filter((v) => !known.has(v)).sort().forEach((v) => add(v, v));
      if (values[f.k]) sel.value = values[f.k];
    });
    sel.addEventListener('change', () => {
      const truck = trucks.find((x) => String(x.plate || '').trim().toUpperCase() === sel.value);
      const noField = station.fields.find((x) => x.k === 'truckNo');
      if (truck && truck.truckNo && noField && !values.truckNo) { setFieldValue(noField, truck.truckNo); markDirty(); }
    });
  });

  // ── Pre-roll queue dropdown (prPicker) ───────────────────────────────────
  // The open pre-roll queue in the dashboard's order (loadPrerollQueue in
  // preroll_queue.js). Picking one stores its ref (PR# / PQ-#) and fills the
  // `fills` fields; a value a pick put in is replaced by the next pick, and
  // anything typed over it is left alone. "Other" is for a PR# not listed.
  const prFields = station.fields.filter((f) => f.prPicker);
  const prLoaded = prFields.length && draftsOn
    ? loadPrerollQueue(getClient()).catch((err) => { console.error('pre-roll queue', err); return []; }) : null;
  let prItems = prFields.length && !draftsOn ? [] : null;
  const prFilled = {};
  const prBlank = (x) => x === undefined || x === null || String(x).trim() === '';
  const prFind = (ref) => (prItems || []).find((x) => x.ref.toUpperCase() === String(ref || '').trim().toUpperCase());
  function prLabel(x, i) {
    const qty = fmtNum(x.units, 0) + (x.packSize > 1 ? ` × ${x.packSize}` : '');
    return `${i + 1}. ${x.ref} — ${x.productName || x.brand || '?'} · ${x.strain || x.type || t(PR.noStrain)} · ${qty}` +
      (x.draftId ? ` · ${t(PR.open)}` : '');
  }
  function showPrInfo(f) {
    const box = document.getElementById(`m_${f.k}`);
    const x = prFind(values[f.k]);
    if (!x) { box.style.display = 'none'; return; }
    box.textContent = [
      t(PR.make).replace('{n}', fmtNum(x.target, 0)) +
        (x.packSize > 1 ? ` (${t(PR.packs).replace('{units}', fmtNum(x.units, 0)).replace('{pack}', x.packSize)})` : ''),
      x.unitSizeG ? t(PR.each).replace('{g}', x.unitSizeG) : '',
      x.readyDate ? t(PR.ready).replace('{d}', new Date(x.readyDate + 'T12:00:00').toLocaleDateString(getLang() === 'es' ? 'es-US' : 'en-US', { month: 'short', day: 'numeric' })) : ''
    ].filter(Boolean).join(' · ');
    box.style.display = 'block';
  }
  function fillPrPicker(f) {
    const sel = document.getElementById(`pr_${f.k}`);
    const inp = document.getElementById(`f_${f.k}`);
    const cur = values[f.k];
    const hit = prFind(cur);
    const items = prItems || [];
    // One run per request: a request already open on another run is reached
    // from the switcher or the Queue tab, not started again here.
    sel.innerHTML = `<option value="">${escapeHtml(t(!prItems ? PR.loading : items.length ? PR.choose : PR.none))}</option>` +
      items.map((x, i) => (x.draftId && x.draftId !== draftId ? ''
        : `<option value="${escapeAttr(x.ref)}">${escapeHtml(prLabel(x, i))}</option>`)).join('') +
      (prItems ? `<option value="__type__">${escapeHtml(t(PR.other))}</option>` : '');
    sel.value = hit ? hit.ref : (!prBlank(cur) && prItems) ? '__type__' : '';
    inp.style.display = sel.value === '__type__' ? 'block' : 'none';
    showPrInfo(f);
  }
  function setOrClear(ff, val) {
    if (!prBlank(val)) { setFieldValue(ff, val); return; }
    values[ff.k] = ff.t === 'number' ? null : '';
    const el = document.getElementById(`f_${ff.k}`);
    if (el) el.value = '';
  }
  prFields.forEach((f) => {
    fillPrPicker(f);
    const sel = document.getElementById(`pr_${f.k}`);
    const inp = document.getElementById(`f_${f.k}`);
    sel.addEventListener('change', () => {
      if (sel.value === '__type__') {
        inp.style.display = 'block';
        if (prFind(inp.value)) { inp.value = ''; values[f.k] = ''; }
        inp.focus();
      } else {
        inp.style.display = 'none';
        const x = prFind(sel.value);
        inp.value = x ? x.ref : '';
        values[f.k] = inp.value;
        Object.entries(f.prPicker.fills || {}).forEach(([key, prop]) => {
          const ff = station.fields.find((s) => s.k === key);
          if (!ff) return;
          const cur = values[key];
          if (!prBlank(cur) && !(key in prFilled && String(cur) === String(prFilled[key]))) return;
          const val = x ? x[prop] : null;
          setOrClear(ff, val);
          if (prBlank(val)) delete prFilled[key]; else prFilled[key] = val;
        });
      }
      touched.add(f.k);
      showPrInfo(f);
      recompute();
      updateVisibility();
      markDirty();
    });
  });

  // ── Master Schedule project (projectPicker) ──────────────────────────────
  // Picking a project puts this form's package(s) on it (linkFormToProject
  // in ops_data.js): Labor Log hours logged to the project are then split
  // over them, which is where their labor cost comes from. The link is made
  // on each autosave whose project or packages changed, and again on
  // submit; changing the project (or deleting the page) takes them back off
  // the old one. `projectLinked` remembers which project has them, so a
  // resumed page or another tablet knows too.
  //
  // With day tabs (Pre-Roll, Hand Trim, Bucking) a run worked over several days can
  // be on a different project each day: the dropdown is the picked day's
  // project, kept in `projectDays` (day -> id, '' for none). A day with no
  // pick of its own goes by the last earlier day that has one, else by
  // `project` (the latest pick — and all a run from before this had). The
  // packages are linked to every project the run is on (`projectsLinked`).
  const projField = station.fields.find((f) => f.projectPicker);
  let projects = projField && draftsOn ? null : [];
  let linkedSig = null;
  const projById = (id) => (projects || []).find((p) => p.id === id);
  const perDayProj = !!(projField && DT && !editMode);
  function projectFor(day) {
    const pd = values.projectDays || {};
    const d = Object.keys(pd).filter((x) => x <= day).sort().pop();
    return (d ? pd[d] : values.project) || '';
  }
  const runProjects = () => [...new Set([values.project, ...Object.values(values.projectDays || {})].filter(Boolean))];
  const linkedProjects = () => values.projectsLinked || (values.projectLinked ? [values.projectLinked] : []);
  const fmtShort = (d) => new Date(d + 'T12:00:00').toLocaleDateString(getLang() === 'es' ? 'es-US' : 'en-US', { month: 'short', day: 'numeric' });
  function projLabel(p) {
    const f = p.fields;
    const loc = f.location === 'other' ? f.locationName : ((WORK_LOCATIONS.find(([k]) => k === f.location) || [])[1] || '');
    const dates = f.end && f.end !== f.start ? `${fmtShort(f.start)} – ${fmtShort(f.end)}` : f.end ? fmtShort(f.start) : `${fmtShort(f.start)} →`;
    return [f.name, loc, dates].filter(Boolean).join(' · ');
  }
  function syncProjectName() {
    if (!projField) return;
    const ids = runProjects();
    if (!ids.length) { delete values.projectName; return; }
    const ps = ids.map(projById).filter(Boolean);
    if (ps.length === ids.length) values.projectName = ps.map((p) => p.fields.name).join(', ');
  }
  // The project the dropdown shows: the picked day's (day tabs), else the run's.
  const shownProject = () => (perDayProj ? projectFor(curDay) : values[projField.k] || '');
  function fillProjectPicker() {
    if (!projField) return;
    const sel = document.getElementById(`f_${projField.k}`);
    const cur = shownProject();
    if (!projects) return;
    // Open projects (not Done), the ones running on the form's date (the
    // picked day, with day tabs) first; within each group the ones for this
    // station's process lead.
    const date = perDayProj ? curDay : values.date || todayStr();
    const forHere = (f) => f.process === station.key || (f.roles || []).some((r) => r.process === station.key);
    const open = projects.filter((p) => (p.fields.status || 'active') !== 'done')
      .sort((a, b) => (forHere(b.fields) - forHere(a.fields)) || String(a.fields.name).localeCompare(String(b.fields.name)));
    const covers = (f) => f.start && f.start <= date && (!f.end || f.end >= date);
    const now = open.filter((p) => covers(p.fields)), later = open.filter((p) => !covers(p.fields));
    const opt = (p) => `<option value="${escapeAttr(p.id)}">${escapeHtml(projLabel(p))}</option>`;
    const shut = cur && !open.some((p) => p.id === cur)
      ? `<optgroup label="${escapeAttr(t(PJ.closed))}"><option value="${escapeAttr(cur)}">${escapeHtml(projById(cur) ? projLabel(projById(cur)) : values.projectName || cur)}</option></optgroup>` : '';
    sel.innerHTML = `<option value="">${escapeHtml(t(PJ.choose))}</option>` +
      (now.length ? `<optgroup label="${escapeAttr(t(PJ.running).replace('{d}', fmtShort(date)))}">${now.map(opt).join('')}</optgroup>` : '') +
      (later.length ? `<optgroup label="${escapeAttr(t(PJ.others))}">${later.map(opt).join('')}</optgroup>` : '') + shut;
    sel.value = cur;
    showProjectInfo();
  }
  function showProjectInfo(msg) {
    if (!projField) return;
    const box = document.getElementById(`m_${projField.k}`);
    const cur = shownProject();
    const uids = formProjectUids(station.key, values);
    const state = msg || (!cur ? ''
      : !uids.length ? t(PJ.noUid)
      : linkedProjects().includes(cur) ? t(PJ.linked).replace('{uids}', uids.map((u) => '…' + u.uid.slice(-4)).join(', ')) : '');
    box.textContent = [perDayProj ? t(PJ.perDay).replace('{d}', dayLabel(curDay)) : '', state].filter(Boolean).join(' ');
    box.style.display = box.textContent ? 'block' : 'none';
  }
  // Puts the package(s) on every project the run is on and takes them off
  // any it's no longer on.
  async function syncProjectLink(force) {
    if (!projField || !draftsOn) return;
    const want = runProjects();
    const had = linkedProjects();
    const uids = formProjectUids(station.key, values);
    const sig = want.join(',') + '|' + uids.map((u) => u.uid).join(',');
    if (!force && sig === linkedSig) return;
    if (!want.length && !had.length) { linkedSig = sig; return; }
    let ok = true;
    for (const id of had.filter((x) => !want.includes(x))) {
      if (!(await linkFormToProject(draftId, null, [], { by: owner, unlinkFrom: id })).ok) ok = false;
    }
    for (const id of want) {
      if (!(await linkFormToProject(draftId, id, uids, { stationKey: station.key, by: owner })).ok) ok = false;
    }
    if (!ok) { showProjectInfo(t(PJ.failed)); return; }
    linkedSig = sig;
    const was = had.join(',');
    if (want.length) {
      values.projectsLinked = want;
      values.projectLinked = want.includes(values.project) ? values.project : want[0];
    } else { delete values.projectsLinked; delete values.projectLinked; }
    showProjectInfo();
    // Saved with the page, so a resumed page knows where its packages are.
    if (want.join(',') !== was && !force && !isClosed) markDirty();
  }
  async function unlinkProject() {
    if (!projField) return;
    for (const id of linkedProjects()) await linkFormToProject(draftId, null, [], { by: owner, unlinkFrom: id }).catch(() => {});
  }
  // A pick on a day tab sets that day's project only. The next day tab
  // keeps what it had (it gets its own entry if it was going by this day),
  // and so do the days before (the first one keeps the run's old project if
  // nothing earlier is picked). `before` is the run's projects just before
  // the pick; the dropdown's own handler has already set `project` to it.
  function setDayProject(pid, before) {
    const was = (day) => {
      const d = Object.keys(before.days).filter((x) => x <= day).sort().pop();
      return (d ? before.days[d] : before.project) || '';
    };
    const pd = { ...before.days };
    const days = dayList();
    const next = days.find((d) => d > curDay);
    if (next && !(next in pd)) pd[next] = was(next);
    const first = days[0];
    if (first < curDay && !Object.keys(pd).some((x) => x <= first)) pd[first] = was(first);
    pd[curDay] = pid;
    values.projectDays = pd;
  }
  if (projField) {
    const sel = document.getElementById(`f_${projField.k}`);
    const redrawCrew = () => station.fields.filter((f) => f.t === 'crewcheck').forEach((f) => entryRenderers[f.k] && entryRenderers[f.k]());
    // Caught on the way down, before the dropdown's own handler (on `input`,
    // which comes first, and `change`) changes `project`.
    let before = null;
    const snapBefore = (e) => {
      if (e.target === sel && !before) before = { project: values[projField.k] || '', days: { ...(values.projectDays || {}) } };
    };
    form.addEventListener('input', snapBefore, true);
    form.addEventListener('change', snapBefore, true);
    sel.addEventListener('change', () => {
      const was = before || { project: '', days: {} };
      before = null;
      if (perDayProj) { setDayProject(values[projField.k] || '', was); markDirty(); }
      // Editing a submitted record (no day tabs): one project for the whole run.
      else if (values.projectDays) delete values.projectDays;
      syncProjectName(); showProjectInfo(); redrawCrew();
    });
    const dateEl = document.getElementById('f_date');
    if (dateEl) dateEl.addEventListener('change', () => { fillProjectPicker(); redrawCrew(); });
    if (draftsOn) listWorkProjects().then((list) => { projects = list; fillProjectPicker(); redrawCrew(); });
    else { fillProjectPicker(); redrawCrew(); }
  }

  // ── Crew check (crewcheck — Pre-Roll's `attendance`) ────────────────────
  // The people the Master Schedule has working this run on the picked day:
  // the run's Project (its lead and responsibilities — only the pre-roll
  // ones if it has any), with that day's changes (someone off, someone
  // extra) applied; with no Project picked, every project running that day
  // for this station. Each is marked Here or Not here, and anyone else
  // working can be added from the Connecteam roster or typed in. Every tap
  // is a row (key, userId, name, status, day, at, by) and the latest per
  // person per day counts (crewLatest in operations_stations.js), so two
  // tablets merge like the other running logs. The marks are also written
  // to the project's day on the Master Schedule (syncCrewToSchedule).
  const CC = {
    loading:  { en: 'Loading the schedule…', es: 'Cargando el horario…' },
    from:     { en: 'Master Schedule — {p}', es: 'Plan Maestro — {p}' },
    notOn:    { en: '{p} isn’t on the schedule this day.', es: '{p} no está en el horario este día.' },
    none:     { en: 'Nobody is scheduled for pre-rolls this day — pick the run’s Project above, or add people below.',
                es: 'No hay nadie programado para prerolls este día — elija el Proyecto de la corrida arriba, o agregue personas abajo.' },
    here:     { en: 'Here', es: 'Presente' },
    out:      { en: 'Not here', es: 'No vino' },
    added:    { en: 'Added', es: 'Agregado' },
    lead:     { en: 'Lead', es: 'Líder' },
    allHere:  { en: '✓ Everyone else scheduled is here', es: '✓ Todos los demás programados están presentes' },
    pick:     { en: 'Add someone working here…', es: 'Agregar a alguien que trabaja aquí…' },
    typeName: { en: 'Not in the list — type a name', es: 'No está en la lista — escriba un nombre' },
    namePh:   { en: 'Name', es: 'Nombre' },
    add:      { en: 'Add', es: 'Agregar' },
    removeQ:  { en: 'Take {n} off this day’s crew?', es: '¿Quitar a {n} del personal de este día?' },
    sum:      { en: '{n} working · {o} not here · {u} not confirmed yet', es: '{n} trabajando · {o} no vinieron · {u} sin confirmar' }
  };
  const ccFields = station.fields.filter((f) => f.t === 'crewcheck');
  const ccFold = (x) => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const ccKey = (p) => (p.userId ? 'id:' + p.userId : 'name:' + ccFold(p.name));
  let ccRoster = null;
  if (ccFields.length) {
    fetch('https://raw.githubusercontent.com/bobby2soxRC/2cw-dashboard/main/data/connecteam_roster.json?t=' + Date.now())
      .then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
      .then((j) => {
        ccRoster = ((j && j.people) || []).map((p) => ({ userId: String(p.userId), name: p.name })).sort((a, b) => a.name.localeCompare(b.name));
        ccFields.forEach((f) => entryRenderers[f.k]());
      });
  }
  // The scheduled people for a day: [{key, userId, name, role}], plus where
  // they came from (the project names) and, with a Project picked that
  // isn't running that day, its name.
  const ccMine = (r, f) => (r.process || f.process) === station.key;
  // The projects whose people work this station on a day: that day's
  // Project, or every pre-roll project running that day.
  function ccRunning(day) {
    const pid = projectFor(day);
    const src = pid ? [projById(pid)].filter(Boolean)
      : (projects || []).filter((p) => p.fields.process === station.key || (p.fields.roles || []).some((r) => r.process === station.key));
    return src.filter((p) => projectRunsOn(p.fields, day) && !(((p.fields.overrides || {})[day] || {}).skip));
  }
  function ccScheduled(day) {
    if (!projects) return { loading: true, people: [] };
    const pid = projectFor(day);
    const mine = ccMine;
    const running = ccRunning(day);
    // What this page marked that day — written back to the schedule, so
    // someone it marked Not here stays listed (as Not here) and someone it
    // added stays in the Added list.
    const latest = new Map([...crewLatest(values[(ccFields[0] || {}).k]).values()].filter((r) => r.day === day).map((r) => [r.key, r]));
    const pageSt = (key) => (latest.get(key) || {}).status || '';
    const people = new Map();
    running.forEach((p) => {
      const f = p.fields, ov = (f.overrides || {})[day] || {};
      // A mark made here wins over the schedule's day changes (which this
      // page writes too, and may not have saved yet).
      const out = new Set((ov.out || []).filter((k) => !pageSt(k)));
      const standing = new Set(projectRoles(f).flatMap((r) => (r.people || []).map(ccKey)));
      // This station's responsibilities (a blank process is the project's).
      // A picked project with none of those: everyone on it. The lead
      // counts when it's the picked project or a pre-roll one.
      const roles = projectRoles(f, t(CC.lead));
      const some = roles.some((r) => !r.isLead && mine(r, f));
      roles.filter((r) => (r.isLead ? (pid || f.process === station.key) : pid && !some ? true : mine(r, f))).forEach((r) => {
        const ps = [...(r.people || []).filter((x) => !out.has(ccKey(x))),
                    ...(ov.extra || []).filter((x) => x.roleId === r.id && !(['added', 'removed'].includes(pageSt(ccKey(x))) && !standing.has(ccKey(x))))];
        ps.forEach((x) => {
          const key = ccKey(x);
          if (x.name && !people.has(key)) people.set(key, { key, userId: x.userId || '', name: x.name, role: r.name });
        });
      });
    });
    // Marked Not here here but off the list now (an extra taken back off).
    latest.forEach((r) => { if (r.status === 'out' && !people.has(r.key)) people.set(r.key, { key: r.key, userId: r.userId || '', name: r.name, role: '' }); });
    return { people: [...people.values()], from: running.map((p) => p.fields.name),
             notOn: pid && !running.length ? (projById(pid) ? projById(pid).fields.name : values.projectName || '') : '' };
  }
  // Writes this page's marks to the Master Schedule, as that day's changes
  // on the project (overrides[day], the same as Change this day there):
  // someone on the project marked Not here goes in `out` (Here takes them
  // back out of it); someone added goes in `extra`, under the project's
  // pre-roll responsibility (else its first), and comes off it when they're
  // taken off here or marked Not here. Only people this page marked are
  // touched, and only on days the project runs. With no Project picked, a
  // day goes to the one pre-roll project running then (none written when
  // there are several). Run after each autosave and on submit; the
  // re-read-then-write in patchWorkProject keeps a lead's edits there.
  let crewSig = null;
  const CS = { failed: { en: 'Couldn’t update the Master Schedule yet — it will try again on the next save.',
                         es: 'Aún no se pudo actualizar el Plan Maestro — se intentará de nuevo al guardar.' } };
  async function syncCrewToSchedule(force) {
    if (!ccFields.length || !projects || !draftsOn) return;
    const byProject = new Map();   // project id -> [{day, key, userId, name, status}]
    ccFields.forEach((f) => crewLatest(values[f.k]).forEach((r) => {
      const run = ccRunning(r.day);
      const p = projectFor(r.day) ? run[0] : run.length === 1 ? run[0] : null;
      if (!p) return;
      (byProject.get(p.id) || byProject.set(p.id, []).get(p.id)).push(r);
    }));
    const sig = JSON.stringify([...byProject.entries()].map(([id, rs]) => [id, rs.map((r) => [r.day, r.key, r.status])]));
    if (!force && sig === crewSig) return;
    let ok = true;
    for (const [id, marks] of byProject) {
      const res = await patchWorkProject(id, (fields) => {
        const roles = fields.roles || [];
        const role = roles.find((r) => ccMine(r, fields)) || roles[0];
        const standing = new Set(projectRoles(fields).flatMap((r) => (r.people || []).map(ccKey)));
        const ovs = { ...(fields.overrides || {}) };
        let changed = false;
        marks.forEach((m) => {
          if (!projectRunsOn(fields, m.day)) return;
          const ov = { ...(ovs[m.day] || {}) };
          const out0 = ov.out || [], extra0 = ov.extra || [];
          let out = out0, extra = extra0;
          const isExtra = extra.some((x) => ccKey(x) === m.key);
          if (standing.has(m.key)) {
            if (m.status === 'out' && !out.includes(m.key)) out = [...out, m.key];
            if ((m.status === 'here' || m.status === 'added') && out.includes(m.key)) out = out.filter((k) => k !== m.key);
          } else if ((m.status === 'added' || m.status === 'here') && !isExtra && role) {
            extra = [...extra, { roleId: role.id, userId: m.userId || '', name: m.name }];
          } else if ((m.status === 'removed' || m.status === 'out') && isExtra) {
            extra = extra.filter((x) => ccKey(x) !== m.key);
          }
          if (out === out0 && extra === extra0) return;
          ovs[m.day] = { ...ov, out, extra };
          changed = true;
        });
        return changed ? { ...fields, overrides: ovs, updatedBy: owner || '' } : fields;
      }, owner);
      if (!res.ok) { ok = false; continue; }
      const p = projById(id);
      if (p && res.fields) p.fields = res.fields;
    }
    if (ok) crewSig = sig;
    ccFields.forEach((f) => entryRenderers[f.k] && entryRenderers[f.k]());
    const msg = document.getElementById(`ccm_${ccFields[0].k}`);
    if (msg) { msg.textContent = ok ? '' : t(CS.failed); msg.style.display = ok ? 'none' : 'block'; }
  }
  function buildCrewCheck(f) {
    const box = document.getElementById(`cc_${f.k}`);
    const days = () => {
      if (byDay(f)) return [curDay];
      const ds = [...new Set((values[f.k] || []).map((r) => r.day).filter(Boolean))].sort();
      return ds.length ? ds : [values.date || todayStr()];
    };
    const log = (day, p, status) => {
      values[f.k] = [...(values[f.k] || []), { _id: crypto.randomUUID(), day, at: new Date().toISOString(), by: owner,
                                               key: p.key, userId: p.userId || '', name: p.name, status }];
    };
    const render = () => {
      const latest = crewLatest(values[f.k]);
      box.innerHTML = days().map((day) => {
        const sch = ccScheduled(day);
        const head = byDay(f) ? '' : `<div class="cc-day">${escapeHtml(dayLabel(day))}</div>`;
        if (sch.loading) return head + `<div class="cc-src">${escapeHtml(t(CC.loading))}</div>`;
        const st = (key) => (latest.get(`${day}|${key}`) || {}).status || '';
        const src = sch.notOn ? t(CC.notOn).replace('{p}', sch.notOn)
          : sch.from.length ? t(CC.from).replace('{p}', sch.from.join(', ')) : t(CC.none);
        const listed = new Set(sch.people.map((p) => p.key));
        const added = [...latest.values()].filter((r) => r.day === day && r.status === 'added' && !listed.has(r.key));
        let n = 0, o = 0, u = 0;
        const rows = sch.people.map((p) => {
          const s = st(p.key);
          if (s === 'out') o++; else if (s === 'here' || s === 'added') n++; else u++;
          return `<div class="cc-row${s === 'out' ? ' out' : ''}"><div class="cc-name"><b>${escapeHtml(p.name)}</b>${p.role ? `<span class="r">${escapeHtml(p.role)}</span>` : ''}</div>` +
            `<button type="button" class="cc-btn here${s === 'here' || s === 'added' ? ' on' : ''}" data-cc="here" data-day="${day}" data-key="${escapeAttr(p.key)}">${escapeHtml(t(CC.here))}</button>` +
            `<button type="button" class="cc-btn out${s === 'out' ? ' on' : ''}" data-cc="out" data-day="${day}" data-key="${escapeAttr(p.key)}">${escapeHtml(t(CC.out))}</button></div>`;
        }).join('') + added.map((r) => { n++;
          return `<div class="cc-row"><div class="cc-name"><b>${escapeHtml(r.name)}</b></div><span class="cc-tag">${escapeHtml(t(CC.added))}</span>` +
            `<button type="button" class="cc-del" data-cc="removed" data-day="${day}" data-key="${escapeAttr(r.key)}" aria-label="${escapeAttr(t(UI.remove))}">×</button></div>`; }).join('');
        const here = new Set([...listed, ...added.map((r) => r.key)]);
        const choices = (ccRoster || []).filter((p) => !here.has(ccKey(p)));
        return head + `<div class="cc-src">${escapeHtml(src)}</div>` + rows +
          (u ? `<button type="button" class="cc-all" data-cc="all" data-day="${day}">${escapeHtml(t(CC.allHere))}</button>` : '') +
          `<div class="cc-add"><select data-ccpick="${day}"><option value="">${escapeHtml(t(CC.pick))}</option>` +
            choices.map((p) => `<option value="${escapeAttr(p.userId)}">${escapeHtml(p.name)}</option>`).join('') +
            `<option value="__type__">${escapeHtml(t(CC.typeName))}</option></select>` +
            `<input type="text" data-ccname="${day}" placeholder="${escapeAttr(t(CC.namePh))}" style="display:none">` +
            `<button type="button" class="cc-btn" data-cc="add" data-day="${day}">${escapeHtml(t(CC.add))}</button></div>` +
          `<div class="cc-sum">${escapeHtml(t(CC.sum).replace('{n}', n).replace('{o}', o).replace('{u}', u))}</div>`;
      }).join('');
      if (byDay(f)) renderDays();
    };
    entryRenderers[f.k] = render;
    const changed = () => { render(); recompute(); markDirty(); };
    box.addEventListener('change', (e) => {
      const sel = e.target.closest('[data-ccpick]');
      if (!sel) return;
      const inp = box.querySelector(`[data-ccname="${sel.dataset.ccpick}"]`);
      inp.style.display = sel.value === '__type__' ? 'block' : 'none';
      if (sel.value === '__type__') inp.focus();
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.closest('[data-ccname]')) { e.preventDefault(); box.querySelector(`[data-cc="add"][data-day="${e.target.dataset.ccname}"]`).click(); }
    });
    box.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cc]');
      if (!b || isClosed) return;
      const day = b.dataset.day, act = b.dataset.cc;
      const sch = ccScheduled(day);
      const latest = crewLatest(values[f.k]);
      const st = (key) => (latest.get(`${day}|${key}`) || {}).status || '';
      if (act === 'all') {
        sch.people.filter((p) => !st(p.key)).forEach((p) => log(day, p, 'here'));
        return changed();
      }
      if (act === 'add') {
        const sel = box.querySelector(`[data-ccpick="${day}"]`), inp = box.querySelector(`[data-ccname="${day}"]`);
        const hit = sel.value && sel.value !== '__type__' ? (ccRoster || []).find((p) => p.userId === sel.value) : null;
        const name = hit ? hit.name : sel.value === '__type__' ? inp.value.trim() : '';
        if (!name) { (sel.value === '__type__' ? inp : sel).focus(); return; }
        const p = { userId: hit ? hit.userId : '', name };
        p.key = ccKey(p);
        // Someone already on the schedule just gets marked here.
        log(day, p, sch.people.some((x) => x.key === p.key) ? 'here' : 'added');
        return changed();
      }
      const key = b.dataset.key;
      const p = sch.people.find((x) => x.key === key) || latest.get(`${day}|${key}`);
      if (!p) return;
      if (act === 'removed' && !confirm(t(CC.removeQ).replace('{n}', p.name))) return;
      if (st(key) === act || (act === 'here' && st(key) === 'added')) return;
      log(day, { key, userId: p.userId, name: p.name }, act);
      changed();
    });
    render();
  }
  ccFields.forEach(buildCrewCheck);

  // ── Prefill from the upstream stage ───────────────────────────────────────
  // Bucking should not have to re-weigh what the post-dry check already
  // recorded; typing the last 4 of the tag pulls it forward.
  // `record` is the upstream record itself when it was picked from a list.
  // A value an earlier prefill put in is replaced (picking another package
  // swaps its strain, weight, …); anything typed over it is left alone.
  const lastPrefill = {};
  const isBlank = (x) => x === undefined || x === null || x === '';
  const prefilledHere = (here) => !isBlank(values[here]) && here in lastPrefill && String(values[here]) === String(lastPrefill[here]);
  async function tryPrefill(uid, key, record) {
    const spec = PREFILL_MAP[station.key];
    const note = document.getElementById(`m_${key}`);
    if (!spec || !uid || uid.length < 4) return;
    const upstream = record || await findUpstream(spec.from, uid);
    if (!upstream) {
      if (note) { note.style.display = 'block'; note.style.color = 'var(--muted)'; note.textContent = t(UI.noMatch); }
      return;
    }
    Object.entries(spec.map).forEach(([here, there]) => {
      const val = upstream[there];
      if (val === undefined || val === null || val === '') return;
      const inp = document.getElementById(`f_${here}`);
      if (!inp || (!isBlank(values[here]) && !prefilledHere(here))) return;
      inp.value = val;
      values[here] = val;
      lastPrefill[here] = val;
      touched.add(here);
      // A strain that isn't on the reference list still needs to show up.
      if (inp.tagName === 'SELECT' && inp.value !== String(val)) {
        const opt = document.createElement('option');
        opt.value = val; opt.textContent = val;
        inp.appendChild(opt); inp.value = val;
      }
    });
    if (note) {
      const warn = spec.warn && spec.warn(upstream);
      note.style.display = 'block'; note.style.color = warn ? 'var(--gold)' : 'var(--green)';
      note.textContent = `${t(UI.matched)}: ${upstream.strain || ''} ${upstream.harvestBatchName || ''}`.trim() + (warn ? ` — ${t(warn)}` : '');
    }
    recompute();
    markDirty();
  }

  // Undo a prefill (the picked package was cleared): empty whatever it put
  // in that nobody has changed since.
  function clearPrefill(key) {
    Object.keys(lastPrefill).forEach((here) => {
      if (prefilledHere(here)) {
        const inp = document.getElementById(`f_${here}`);
        if (inp) inp.value = '';
        values[here] = '';
      }
      delete lastPrefill[here];
    });
    const note = document.getElementById(`m_${key}`);
    if (note) note.style.display = 'none';
    recompute();
  }

  // ── Pick a package from a list ────────────────────────────────────────────
  // A uid field with `picker` is chosen from a dropdown instead of typed:
  //   Take Down's farm package — the Wet Intakes still drying (no Take Down
  //     submitted yet — currentlyDrying in ops_common.js) in the room picked
  //     above it, "Strain - last 4". The room dropdown shows how many are
  //     drying in each room.
  //   Bucking's package (`list: 'buckable'`) — what's ready to buck
  //     (buckablePackages in ops_common.js), "Strain || abbreviation || last
  //     4", less any package another bucking page already has open.
  //   Hand Trim's lot (`list: 'bucked'`) — every lot that's been bucked
  //     (buckedLots in ops_common.js), newest first, same labels as Bucking.
  // Picking one fills the UID and its upstream details (strain, …).
  // `otherPopup`: "Other" opens a popup for the strain and package UID
  // instead of just showing the UID box.
  const pickerFields = station.fields.filter((f) => f.t === 'uid' && f.picker);
  const pickLists = {};   // field key -> the records its options point at
  const linkPicked = new Set();  // picker fields given a UID in the link (?set_…)
  const typing = {};      // field key -> true while "Not listed" is chosen
  const buckPick = pickerFields.some((f) => f.picker.list === 'buckable');
  const buckedPick = pickerFields.some((f) => f.picker.list === 'bucked');
  let pickPool = [], pickReady = false, queueItems = null;
  const pickLoaded = pickerFields.length ? (async () => {
    if (buckedPick) {
      // The trimming queue's lots first, in its order, then the rest of
      // what's been bucked (already hand trimmed), newest first.
      const tq = await loadTrimQueue();
      queueItems = tq.items;
      // A lot already open on another page is in the switcher, not here.
      const elsewhere = tq.openTrims.filter((d) => d.id !== draftId && d.fields && d.fields.sourceUid).map((d) => d.fields.sourceUid);
      const queued = new Set(tq.items.map((l) => l.sourceUid));
      pickPool = [...tq.items, ...tq.all.filter((l) => !queued.has(l.sourceUid))]
        .filter((l) => !elsewhere.some((u) => uidTailMatch(u, l.sourceUid)));
      return;
    }
    if (buckPick) {
      // In the bucking queue's order (On-Stem Flower page).
      const { items } = await loadBuckingQueue();
      queueItems = items;
      pickPool = items.filter((p) => !p.draftId || p.draftId === draftId);
      return;
    }
    const [intakes, downs] = await Promise.all([loadSubmitted(pickerFields[0].picker.from), loadSubmitted(station.key)]);
    // Correcting a submitted Take Down: its own package still counts as drying.
    pickPool = currentlyDrying(intakes || [], (downs || []).filter((d) => !editMode || d.id !== editId));
  })().catch((err) => { console.error('picker list', err); }) : null;

  function fillPicker(f) {
    const sel = document.getElementById(`pk_${f.k}`);
    const inp = document.getElementById(`f_${f.k}`);
    if (!sel) return;
    const lots = f.picker.list === 'bucked';
    const buck = f.picker.list === 'buckable' || lots;
    const room = f.picker.room ? values[f.picker.room] : null;
    const list = buck ? pickPool.slice()
      : (room ? pickPool.filter((i) => inDryRoom(i.dryRoom, room)) : [])
        .sort((a, b) => String(a.strain || '').localeCompare(String(b.strain || '')) || String(a.date || '').localeCompare(String(b.date || '')));
    pickLists[f.k] = list;
    const last4 = (i) => normUid(i.sourceUid).slice(-4);
    const base = buck
      ? (i) => `${i.strain || '—'} || ${strainAbbr(reference, i.strain) || '—'} || ${last4(i)}`
      : (i) => `${i.strain || '—'} - ${last4(i)}`;
    const dup = (i) => list.filter((x) => base(x) === base(i)).length > 1;
    const shortDate = (d) => d ? new Date(`${d}T12:00:00`).toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric' }) : '';
    const weight = (i) => lots ? i.buckedFlowerLb : buck ? i.unbuckedLb : i.totalWetLb;
    const label = (i) => base(i) + (dup(i) ? ` (${[shortDate(i.date), weight(i) ? fmtNum(weight(i), 0) + ' lb' : ''].filter(Boolean).join(', ')})` : '') +
      (lots && i.inProgress ? ` — ${t(PK.bucking)}` : '');
    const first = !pickReady ? pkLoading(f) : (f.picker.room && !room) ? t(PK.roomFirst)
      : list.length ? t(lots ? PK.chooseLot : PK.choose) : t(lots ? PK.noneBucked : buck ? PK.noneBuck : PK.none);
    sel.innerHTML = `<option value="">${escapeHtml(first)}</option>` +
      list.map((i, ix) => `<option value="${ix}">${escapeHtml(label(i))}</option>`).join('') +
      `<option value="__type__">${escapeHtml(t(f.picker.otherPopup ? PK.otherLot : PK.typed))}</option>`;
    const cur = values[f.k];
    const ix = cur ? list.findIndex((i) => normUid(i.sourceUid) === normUid(cur)) : -1;
    if (ix >= 0 && !typing[f.k]) sel.value = String(ix);
    else if (cur || typing[f.k]) { typing[f.k] = true; sel.value = '__type__'; }
    else sel.value = '';
    inp.style.display = typing[f.k] ? 'block' : 'none';
    showPicked(f);
  }

  // The picked package's full UID, read-only under the dropdown.
  function showPicked(f) {
    const box = document.getElementById(`pv_${f.k}`);
    if (!box) return;
    const on = !typing[f.k] && !!values[f.k];
    box.style.display = on ? 'block' : 'none';
    box.querySelector('input').value = on ? values[f.k] : '';
  }

  // "Room 1A · 3" — how many packages are drying in each room.
  function countRooms(f) {
    const sel = document.getElementById(`f_${f.picker.room}`);
    if (!sel) return;
    [...sel.options].forEach((o) => {
      if (!o.value || o.value === '__other__') return;
      if (o.dataset.label === undefined) o.dataset.label = o.textContent;
      const n = pickPool.filter((i) => inDryRoom(i.dryRoom, o.value)).length;
      o.textContent = n ? `${o.dataset.label} · ${n}` : o.dataset.label;
    });
  }

  pickerFields.forEach((f) => {
    const sel = document.getElementById(`pk_${f.k}`);
    const inp = document.getElementById(`f_${f.k}`);
    const setUid = (uid) => { inp.value = uid; values[f.k] = uid; };
    let prevSel = sel.value;
    sel.addEventListener('focus', () => { prevSel = sel.value; });
    sel.addEventListener('change', () => {
      if (sel.value === '__type__' && f.picker.otherPopup) {
        const back = prevSel;
        openOtherPopup(f, ({ strain, uid }) => {
          clearPrefill(f.k);
          typing[f.k] = true;
          inp.style.display = 'block';
          setUid(uid);
          touched.add(f.k);
          const sf = station.fields.find((x) => x.k === 'strain');
          if (sf) { setFieldValue(sf, strain); touched.add('strain'); }
          showPicked(f);
          prevSel = '__type__';
          recompute();
          markDirty();
        }, () => { sel.value = back; });
        return;
      }
      prevSel = sel.value;
      if (sel.value === '__type__') {
        typing[f.k] = true;
        inp.style.display = 'block';
        showPicked(f);
        inp.focus();
        return;
      }
      typing[f.k] = false;
      inp.style.display = 'none';
      const rec = sel.value === '' ? null : pickLists[f.k][Number(sel.value)];
      if (!rec) { setUid(''); clearPrefill(f.k); }
      else { setUid(normUid(rec.sourceUid)); tryPrefill(values[f.k], f.k, rec); }
      showPicked(f);
      recompute();
      markDirty();
    });
    // A new room means a new list — a package picked from the old one goes.
    if (!f.picker.room) return;
    const roomEl = document.getElementById(`f_${f.picker.room}`);
    const onRoom = () => {
      const picked = values[f.k] && !typing[f.k];
      fillPicker(f);
      if (picked && sel.value === '__type__') {
        typing[f.k] = false;
        setUid('');
        clearPrefill(f.k);
        fillPicker(f);
        markDirty();
      }
    };
    roomEl.addEventListener('change', onRoom);
    const other = document.getElementById(`o_${f.picker.room}`);
    if (other) other.addEventListener('change', onRoom);
  });

  // The "Other" popup (`otherPopup`): the strain and the package UID for
  // material that isn't on the list. onSave gets { strain, uid }.
  function openOtherPopup(f, onSave, onCancel) {
    const OP = {
      title:  { en: 'Other bucked flower', es: 'Otra flor desvarada' },
      strain: { en: 'Strain', es: 'Variedad (cepa)' },
      uid:    { en: 'Package UID', es: 'UID del paquete' },
      need:   { en: 'Enter the strain and the package UID.', es: 'Escriba la variedad y el UID del paquete.' },
      cancel: { en: 'Cancel', es: 'Cancelar' },
      ok:     { en: 'Use this', es: 'Usar' }
    };
    const strains = refOptions(reference, 'strains');
    const back = document.createElement('div');
    back.className = 'pop-back';
    back.innerHTML = `<div class="pop" role="dialog" aria-modal="true">` +
      `<h3>${escapeHtml(t(OP.title))}</h3>` +
      `<label class="lbl" for="pop_strain">${escapeHtml(t(OP.strain))}<span class="req">*</span></label>` +
      `<input type="text" id="pop_strain" list="pop_strains" autocomplete="off">` +
      `<datalist id="pop_strains">${strains.map((o) => `<option value="${escapeAttr(o.label)}">`).join('')}</datalist>` +
      `<label class="lbl" for="pop_uid" style="margin-top:16px">${escapeHtml(t(OP.uid))}<span class="req">*</span></label>` +
      `<input type="text" id="pop_uid" class="uid" inputmode="latin" autocapitalize="characters" placeholder="1A40603…">` +
      `<div class="pop-msg"></div>` +
      `<div class="pop-btns"><button type="button" class="pop-cancel">${escapeHtml(t(OP.cancel))}</button>` +
      `<button type="button" class="pop-ok">${escapeHtml(t(OP.ok))}</button></div></div>`;
    document.body.appendChild(back);
    const sIn = back.querySelector('#pop_strain'), uIn = back.querySelector('#pop_uid');
    if (values.strain && typing[f.k]) sIn.value = values.strain;
    if (values[f.k] && typing[f.k]) uIn.value = values[f.k];
    sIn.focus();
    const close = () => back.remove();
    back.querySelector('.pop-cancel').addEventListener('click', () => { close(); onCancel(); });
    back.querySelector('.pop-ok').addEventListener('click', () => {
      const typed = sIn.value.trim();
      const uid = uIn.value.trim().toUpperCase();
      if (!typed || !uid) { back.querySelector('.pop-msg').textContent = t(OP.need); return; }
      // A strain typed the way the library spells it is stored as that entry.
      const hit = strains.find((o) => o.label.toLowerCase() === typed.toLowerCase() || String(o.v).toLowerCase() === typed.toLowerCase());
      close();
      onSave({ strain: hit ? hit.v : typed, uid });
    });
  }

  // ── Hydrate from a saved draft (resume, possibly on a different device) ────
  function setFieldValue(f, val) {
    if (val === undefined || val === null) return;
    values[f.k] = val;
    const inp = document.getElementById(`f_${f.k}`);
    if (!inp) return;
    if (f.t === 'select') {
      if (inp.querySelector(`option[value="${CSS.escape(String(val))}"]`)) {
        inp.value = val;
      } else {
        const opt = document.createElement('option');
        opt.value = val; opt.textContent = val;
        inp.appendChild(opt); inp.value = val;
      }
      const other = f.allowOther ? document.getElementById(`o_${f.k}`) : null;
      if (other) other.style.display = inp.value === '__other__' ? 'block' : 'none';
    } else if (f.t === 'check') {
      inp.checked = val === true || val === 'true';
    } else {
      inp.value = val;
    }
  }

  function hydrate(fields) {
    if (Array.isArray(fields._deleted)) values._deleted = fields._deleted;
    if (Array.isArray(fields.runDays)) values.runDays = fields.runDays;
    if (Array.isArray(fields.hiddenDays)) values.hiddenDays = fields.hiddenDays;
    ['projectName', 'projectLinked', 'projectsLinked', 'projectDays'].forEach((k) => { if (fields[k]) values[k] = fields[k]; });
    // Anything saved that the form no longer shows (a field taken off since,
    // like Pre-Roll's Workforce Log on runs already open) rides along, so
    // the next autosave doesn't drop it.
    const onForm = new Set(station.fields.map((f) => f.k));
    Object.keys(fields).forEach((k) => { if (!onForm.has(k) && !(k in values)) values[k] = fields[k]; });
    station.fields.forEach((f) => {
      if (f.t === 'calc' || f.t === 'photo') return;
      if (f.t === 'crewcheck') {
        values[f.k] = Array.isArray(fields[f.k]) ? fields[f.k] : [];
        if (entryRenderers[f.k]) entryRenderers[f.k]();
        return;
      }
      if (f.t === 'lineitems') {
        let rows = fields[f.k];
        // Saved when this field was one number (Bucking's stemLb): that
        // number becomes the first row. A fixed id, so two tablets opening
        // the same old page don't each add it.
        if ((!Array.isArray(rows) || !rows.length) && f.legacyTotal && Number(fields[f.legacyTotal]) > 0) {
          rows = [{ [f.totalCol]: Number(fields[f.legacyTotal]), _id: `legacy-${f.k}`, day: fields.date || todayStr(), at: null, by: null }];
        }
        if (!Array.isArray(rows) || !rows.length) return;
        // Clear the blank starter rows, then rebuild from the saved data.
        document.getElementById(`li_${f.k}`).innerHTML = '';
        values[f.k] = [];
        // Records from before the UID/strain moved into the rows carry them
        // once at the top — put them on each row so the split keeps them.
        const lift = station.splitBy === f.k ? { sourceUid: fields.sourceUid, strain: fields.strain } : {};
        if (f.group && fields[f.group.k]) lift[f.group.k] = fields[f.group.k];
        // A running log skips blank rows (a page saved back when it was a grid).
        rows.filter((r) => !f.entry || rowHasData(f, r))
          .forEach((r) => lineitemAdders[f.k] && lineitemAdders[f.k]({ ...lift, ...r }));
        return;
      }
      setFieldValue(f, fields[f.k]);
    });
    if (driverFields.length) {
      values.driverId = fields.driverId ?? null;
      values.driverIdNumber = fields.driverIdNumber || '';
      driverFields.forEach(fillDriverPicker);
    }
    goToStartDay();
    // A removed Today isn't where the page should open.
    if (DT && !editMode && !dayList().includes(curDay)) { const ds = dayList(); pickDay(ds[ds.length - 1]); renderDays(); }
    // The dropdown shows the picked day's project (day tabs).
    if (perDayProj) fillProjectPicker();
    updateVisibility();
    recompute();
  }

  // ── Computed fields ───────────────────────────────────────────────────────
  const primaryCalc = station.fields.find((f) => f.k === station.headline) ||
    station.fields.find((f) => f.t === 'calc');

  function recompute() {
    station.fields.forEach((f) => {
      if (f.t === 'lineitems') {
        const total = (values[f.k] || []).filter((r) => !byDay(f) || rowDay(r) === curDay).reduce((a, r) => a + (Number(r[f.totalCol]) || 0), 0);
        const el = document.getElementById(`lit_${f.k}`);
        const totalCol = f.cols.find((c) => c.k === f.totalCol);
        if (el) el.textContent = fmtNum(total, totalCol && totalCol.dp !== undefined ? totalCol.dp : 0);
        return;
      }
      if (f.t !== 'calc') return;
      const box = document.getElementById(`c_${f.k}`);
      if (!box) return;
      let out = null;
      try { out = f.calc(values); } catch { out = null; }
      values[f.k] = out;
      const text = out === null || out === undefined || !Number.isFinite(Number(out))
        ? '—'
        : (f.fmt === 'pct' ? fmtPct(out) : fmtNum(out, f.dp === undefined ? 2 : f.dp));
      box.querySelector('.v').textContent = (f.signed && Number(out) > 0 ? '+' : '') + text;
      box.classList.toggle('neg', !!(f.signed && Number(out) < 0));
      box.classList.toggle('flagged', !!(f.flag && Number.isFinite(Number(out)) && f.flag(Number(out))));
    });

    if (primaryCalc) {
      document.getElementById('running-k').textContent = t(primaryCalc.l);
      const v = values[primaryCalc.k];
      document.getElementById('running-v').textContent =
        (v === null || v === undefined || !Number.isFinite(Number(v))) ? '—'
          : (primaryCalc.fmt === 'pct' ? fmtPct(v) : fmtNum(v, primaryCalc.dp === undefined ? 2 : primaryCalc.dp));
    }
    scheduleSummary();
  }

  function updateVisibility() {
    station.fields.forEach((f) => {
      if (!f.showIf) return;
      const wrap = els[f.k];
      if (wrap) wrap.style.display = f.showIf(values) ? '' : 'none';
    });
  }

  // ── Autosave ─────────────────────────────────────────────────────────────
  // Debounced so we save a pause in typing, not every keystroke. The local
  // mirror is written synchronously on every change regardless of network,
  // so a reload on this same tablet before the debounce fires — or before
  // Supabase is reachable at all — still has something to restore from.
  const autosaveEl = document.getElementById('autosave');
  const autosaveTxt = document.getElementById('autosave-txt');
  const AS = {
    saving: { en: 'Saving…', es: 'Guardando…' },
    saved:  { en: 'Saved', es: 'Guardado' },
    offline:{ en: 'Saved on this tablet — offline', es: 'Guardado en esta tableta — sin conexión' }
  };
  let autosaveTimer = null;
  const mirrorKey = () => `2cw_draft_mirror_${draftId}`;

  function draftPayload() {
    syncProjectName();
    const fields = { ...values };
    station.fields.filter((f) => f.t === 'photo').forEach((f) => { delete fields[f.k]; });
    const strain = values.strain || (station.splitBy
      ? [...new Set((values[station.splitBy] || []).map((r) => r.strain).filter(Boolean))].join(', ') : '');
    return { stationKey: station.key, owner, strain: strain || null, date: values.date || todayStr(), fields };
  }

  function markDirty() {
    if (!draftsOn || editMode || isClosed) return;
    // The "pages already open" note goes once they start on a new flavor.
    const b = document.getElementById('banner');
    if (b.dataset.openPages) { delete b.dataset.openPages; b.className = 'banner'; }
    localStorage.setItem(mirrorKey(), JSON.stringify({ ...draftPayload(), savedAt: Date.now() }));
    autosaveEl.style.display = 'flex';
    autosaveEl.className = 'autosave saving';
    autosaveTxt.textContent = t(AS.saving);
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(doAutosave, 1500);
  }

  async function doAutosave() {
    if (isClosed) return;
    // A page with running logs reads the saved copy first and merges in
    // whatever another tablet logged — and stops if that tablet already
    // submitted it (rather than turning the record back into a draft), or
    // deleted it (rather than bringing it back).
    if (entryFields.length) {
      const chk = await checkDraft(draftId);
      if (isClosed) return;
      const saved = chk.ok ? chk.row : null;
      if (saved && saved.status === 'submitted') { if (!submittedHere) closedElsewhere(); return; }
      if (chk.ok && !saved && onServer) { closedElsewhere(DE); return; }
      if (saved) mergeEntries(saved.fields || {});
    }
    const sentTouched = new Set(touched);
    const res = await saveDraft(draftId, draftPayload());
    if (res.ok) {
      onServer = true;
      sentTouched.forEach((k) => touched.delete(k));
      syncProjectLink();
      syncCrewToSchedule();
      autosaveEl.className = 'autosave saved';
      autosaveTxt.textContent = `${t(AS.saved)} ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
      localStorage.removeItem(mirrorKey());
    } else {
      autosaveEl.className = 'autosave offline';
      autosaveTxt.textContent = t(AS.offline);
      // Not reachable right now — try again shortly rather than losing the change.
      autosaveTimer = setTimeout(doAutosave, 8000);
    }
  }

  // Someone else submitted this page while it was open here.
  const CE = { en: 'This page was submitted on another tablet — nothing more can be added. Pick an open page above or start a new one.',
               es: 'Esta hoja se envió en otra tableta — ya no se puede agregar nada. Elija una hoja abierta arriba o empiece una nueva.' };
  // …or deleted it.
  const DE = { en: 'This page was deleted on another tablet. Pick an open page above or start a new one.',
               es: 'Esta hoja se borró en otra tableta. Elija una hoja abierta arriba o empiece una nueva.' };
  let isClosed = false;
  let submittedHere = false;
  let onServer = false;   // this page has been saved at least once
  function closedElsewhere(msg) {
    isClosed = true;
    clearTimeout(autosaveTimer);
    autosaveEl.style.display = 'none';
    localStorage.removeItem(mirrorKey());
    banner.className = 'banner error';
    banner.textContent = t(msg || CE);
    document.getElementById('del-page').style.display = 'none';
    document.getElementById('switcher').after(banner);
    form.querySelectorAll('input, select, textarea, button').forEach((el) => { el.disabled = true; });
    btn.disabled = true;
  }

  // While a page with running logs is open, pick up the other tablets'
  // rows every 15 seconds (when nothing is waiting to save here).
  async function pollEntries() {
    if (!entryFields.length || !draftsOn || editMode || isClosed || pendingSubmits.length) return;
    if (autosaveEl.classList.contains('saving') || autosaveEl.classList.contains('offline')) return;
    const chk = await checkDraft(draftId);
    if (!chk.ok || isClosed) return;
    const saved = chk.row;
    if (!saved) { if (onServer) closedElsewhere(DE); return; }
    if (saved.status === 'submitted') { if (!submittedHere) closedElsewhere(); return; }
    mergeEntries(saved.fields || {});
    if (station.dailySummary && SUM.date) loadSummary(SUM.date);
  }

  // ── Strain switcher ──────────────────────────────────────────────────────
  const SW = { newForm: { en: '+ New', es: '+ Nuevo' }, untitled: { en: 'Untitled', es: 'Sin título' }, started: { en: 'Started', es: 'Inicio' },
               newFlavor: { en: '+ New flavor', es: '+ Nuevo sabor' }, flavors: { en: 'Flavors open', es: 'Sabores abiertos' },
               newLot: { en: '+ New lot', es: '+ Nuevo lote' }, lots: { en: 'Lots open', es: 'Lotes abiertos' } };
  async function renderSwitcher() {
    if (!draftsOn || (!owner && !station.sharedDay)) return;
    // A multi-day batch has to be findable by whoever works it next, on any
    // day — so those stations list every open batch, not just yours today.
    // A sharedDay station (Smalls: one page per flavor per day, worked by the
    // whole room) lists every open page from anyone, so the flavors at the
    // top are the room's, not one person's.
    const drafts = (station.multiDay || station.sharedDay)
      ? await listOpenDrafts(station.key)
      : await listMyDrafts(station.key, owner, todayStr());
    const el = document.getElementById('switcher');
    const lblEl = document.getElementById('switcher-lbl');
    // Hand Trim's lots, Pre-Roll's runs (`station.switcher`), else Smalls' flavors.
    const SWL = station.switcher || (station.key === 'hand_trim'
      ? { open: SW.lots, add: SW.newLot, one: { en: 'lot', es: 'lote' }, many: { en: 'lots', es: 'lotes' } }
      : { open: SW.flavors, add: SW.newFlavor, one: { en: 'flavor', es: 'sabor' }, many: { en: 'flavors', es: 'sabores' } });
    if (station.sharedDay) {
      // Always shown, so "+ New flavor" is there even before the first page.
      const isNew = !drafts.some((d) => d.id === draftId);
      // Someone who closed the page and came back from the hub lands on a
      // blank page — point them at the pages already open so they carry on
      // there instead of starting a duplicate.
      if (isNew && drafts.length && !banner.className.includes('success')) {
        banner.className = 'banner warn';
        banner.dataset.openPages = '1';
        const n = drafts.length;
        banner.textContent = t({ en: `${n} ${SWL.one.en} page${n > 1 ? 's are' : ' is'} already open — tap ${n > 1 ? 'one' : 'it'} above to keep working on it. This blank page is only for a new ${SWL.one.en}.`,
                                 es: `Ya hay ${n} hoja${n > 1 ? 's' : ''} de ${SWL.one.es} abierta${n > 1 ? 's' : ''} — tóquela arriba para seguir trabajando. Esta hoja en blanco es solo para ${SWL.one.es.endsWith('a') ? 'una' : 'un'} ${SWL.one.es} ${SWL.one.es.endsWith('a') ? 'nueva' : 'nuevo'}.` });
        banner.style.marginTop = '12px';
        document.getElementById('switcher').after(banner);
      }
      if (isNew) drafts.unshift({ id: draftId, strain: values.strain, fields: values, work_date: values.date || todayStr() });
      lblEl.textContent = t(SWL.open);
      lblEl.style.display = 'block';
    } else if (!drafts.length) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    const shortDate = (d) => new Date(`${d}T12:00:00`).toLocaleDateString([], { month: 'short', day: 'numeric' });
    const chipTop = (d) => station.sharedDay
      ? [d.fields && d.fields.sourceUid ? `…${String(d.fields.sourceUid).slice(-4)}` : '',
         d.work_date && d.work_date !== todayStr() ? shortDate(d.work_date) : ''].filter(Boolean).join(' · ') || '—'
      : station.multiDay
      ? `${t(SW.started)} ${shortDate(d.work_date)}`
      : new Date(d.updated_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const chipLabel = (d) => [d.fields && d.fields.batchId, d.strain].filter(Boolean).join(' · ') || t(SW.untitled);
    if (station.sharedDay) {
      el.innerHTML = drafts.map((d) => `
        <a class="chip ${d.id === draftId ? 'on' : ''}" href="/ops_form.html?station=${station.key}&draft=${d.id}">
          <span class="cs">${escapeHtml(chipTop(d))}</span>
          <span class="cv">${escapeHtml(chipLabel(d))}</span>
        </a>`).join('') +
        `<a class="chip new" href="/ops_form.html?station=${station.key}">${t(SWL.add)}</a>`;
      return;
    }
    el.innerHTML = drafts.map((d) => `
      <a class="chip ${d.id === draftId ? 'on' : ''}" href="/ops_form.html?station=${station.key}&draft=${d.id}">
        <span class="cs">${escapeHtml(chipTop(d))}</span>
        <span class="cv">${escapeHtml(chipLabel(d))}</span>
      </a>`).join('') +
      `<a class="chip new" href="/ops_form.html?station=${station.key}">${t(SW.newForm)}</a>`;
