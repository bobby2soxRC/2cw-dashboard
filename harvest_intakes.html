<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Harvest Intakes — 2CW Operations</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:0 0 auto}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--blue);color:#000}

    main{padding:28px 16px 60px;max-width:1100px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;line-height:1}
    .sub{margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
    .filters button{background:var(--surface);border:1px solid var(--border);color:var(--subtext);border-radius:10px;padding:.6rem 1rem;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:44px}
    .filters button.on{background:var(--blue);border-color:var(--blue);color:#000;font-weight:700}
    .filters input{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.6rem .9rem;font-size:.95rem;min-height:44px;outline:none}
    .filters input:focus{border-color:var(--blue)}

    .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .row{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .2s;text-align:left;color:inherit;font:inherit;width:100%}
    .row:hover{border-color:var(--blue)}
    .row.draft{border-left-color:var(--gold)}
    .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .row-date{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .row-strain{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;line-height:1.1;margin-top:2px}
    .pills{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
    .pill{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
    .pill.draft{border-color:var(--gold);color:var(--gold)}
    .pill.ok{border-color:var(--green);color:var(--green)}
    .pill.warn{border-color:var(--red);color:var(--red)}
    .row-facts{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.8rem}
    .row-facts dt{color:var(--muted);font-family:'DM Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding-top:1px}
    .row-facts dd{color:var(--subtext);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--subtext);margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
    .row-headline{font-family:'DM Mono',monospace;font-size:1.1rem;color:var(--text)}

    .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:.9rem}
    .footer{margin-top:36px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}

    /* Detail sheet */
    #detail-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 12px 40px}
    #detail-bg.on{display:flex}
    #detail{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:720px;padding:22px 20px}
    .d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
    .d-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;line-height:1.05}
    .d-sub{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);margin-bottom:14px;line-height:1.6}
    .d-actions{display:flex;gap:8px;flex:0 0 auto}
    .btn{padding:.65rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);text-decoration:none;display:inline-block;min-height:40px}
    .btn-blue{background:var(--blue);border-color:var(--blue);color:#000}
    .d-row{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:.9rem}
    .d-row .k{color:var(--muted);font-size:.78rem}
    .d-row .v{color:var(--text);word-break:break-word}
    .d-row.hl .v{font-family:'DM Mono',monospace;color:var(--green)}
    .d-table{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:.8rem;margin-top:4px}
    .d-table th{color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:.7rem}
    .d-table td{padding:4px 6px;border-bottom:1px solid var(--border)}
    .d-photo{max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--border);display:block}
    .pill.edited{border-color:var(--purple);color:var(--purple)}
    .pill.deleted{border-color:var(--red);background:var(--red);color:#000}
    .row.deleted{border-left-color:var(--red);opacity:.85}
    .d-section{margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
    .d-section-hd{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--subtext);margin-bottom:10px}
    .d-deleted{border:1px solid var(--red);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.85rem;line-height:1.5}
    .d-deleted b{color:var(--red)}
    .hist{list-style:none;display:flex;flex-direction:column;gap:12px}
    .hist-hd{font-size:.82rem;color:var(--subtext)}
    .hist-hd b{color:var(--text);font-weight:500}
    .hist-act{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--border);margin-right:6px}
    .hist-act.edited{border-color:var(--purple);color:var(--purple)}
    .hist-act.deleted{border-color:var(--red);color:var(--red)}
    .hist-act.submitted{border-color:var(--green);color:var(--green)}
    .hist-reason{font-size:.82rem;color:var(--subtext);margin-top:4px}
    .hist .d-table td.old{color:var(--muted);text-decoration:line-through}
    .hist .d-table tr.num td.new{color:var(--gold);font-weight:500}
    .muted-note{font-size:.82rem;color:var(--muted)}
    .btn-danger{border-color:var(--red);color:var(--red)}
    .btn-danger.solid{background:var(--red);color:#000}
    .del-box{border:1px solid var(--red);border-radius:10px;padding:12px;margin-top:10px}
    .del-box p{font-size:.85rem;color:var(--subtext);margin-bottom:8px;line-height:1.5}
    .del-box textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font:inherit;font-size:.95rem;resize:vertical}
    .del-box .row-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .del-err{color:var(--red);font-size:.85rem;margin-top:8px}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Harvest Intakes</div>
  <div class="lang" id="lang"></div>
</header>

<main>
  <div class="title" id="title">Harvest Intakes</div>
  <div class="sub" id="sub">—</div>
  <div class="filters" id="filters"></div>
  <div id="board"></div>
  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</main>

<div id="detail-bg"><div id="detail"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script>
// Every Harvest Intake — Wet record (station intake_wet), newest first. Click
// one for the full record; with edit access (admin panel → Harvest Intakes →
// Edit) it reopens in ops_form.html?edit=<id> to correct it or record the
// Metrc adjustment. Access comes from 2cw_intake_access, set at hub login.
// Delete (2cw_intake_delete) and See edit history (2cw_intake_history) are
// separate admin-panel checkboxes; both go through
// netlify/functions/operations-records.js, which re-checks the permission
// from the PIN. History comes from operations_forms_history, written by a
// database trigger on every change to a submitted record.
(async function () {
  mountLangToggle('lang');
  const STATION_KEY = 'intake_wet';
  const station = STATION_BY_KEY[STATION_KEY];
  const access = sessionStorage.getItem('2cw_intake_access') || '';
  const canEdit = access === 'edit';
  const canDelete = sessionStorage.getItem('2cw_intake_delete') === 'true';
  const canHistory = sessionStorage.getItem('2cw_intake_history') === 'true';

  const L = {
    title:     { en: 'Harvest Intakes', es: 'Recepciones de Cosecha' },
    back:      { en: '← Hub', es: '← Inicio' },
    all:       { en: 'All', es: 'Todas' },
    metrcTodo: { en: 'Metrc not adjusted', es: 'Metrc sin ajustar' },
    drafts:    { en: 'In progress', es: 'En curso' },
    search:    { en: 'Search strain, UID, farm license, CID, manifest…', es: 'Buscar variedad, UID, licencia, CID, manifiesto…' },
    submitted: { en: 'Submitted', es: 'Enviado' },
    metrcYes:  { en: 'Metrc adjusted', es: 'Metrc ajustado' },
    metrcNo:   { en: 'Metrc: not yet', es: 'Metrc: todavía no' },
    by:        { en: 'by', es: 'por' },
    edited:    { en: 'Last edited by', es: 'Última edición por' },
    edit:      { en: 'Edit', es: 'Editar' },
    close:     { en: 'Close', es: 'Cerrar' },
    openDraft: { en: 'Open form', es: 'Abrir formulario' },
    draftNote: { en: 'Still in progress — not submitted yet.', es: 'Todavía en curso — aún no se ha enviado.' },
    intakes:   { en: 'intakes', es: 'recepciones' },
    intake:    { en: 'intake', es: 'recepción' },
    empty:     { en: 'No intakes match.', es: 'Ninguna recepción coincide.' },
    deletedF:  { en: 'Deleted', es: 'Eliminadas' },
    deletedP:  { en: 'Deleted', es: 'Eliminada' },
    editedP:   { en: 'Edited', es: 'Editada' },
    del:       { en: 'Delete this intake', es: 'Eliminar esta recepción' },
    delWhy:    { en: 'Why is it being deleted? (required — saved with the deleted copy in the edit history)',
                 es: '¿Por qué se elimina? (obligatorio — se guarda con la copia eliminada en el historial)' },
    delGo:     { en: 'Delete', es: 'Eliminar' },
    cancel:    { en: 'Cancel', es: 'Cancelar' },
    delNeedWhy:{ en: 'Enter a reason first.', es: 'Escriba un motivo primero.' },
    delFail:   { en: 'Could not delete:', es: 'No se pudo eliminar:' },
    delBy:     { en: 'Deleted by', es: 'Eliminada por' },
    reason:    { en: 'Reason', es: 'Motivo' },
    history:   { en: 'Edit history', es: 'Historial de cambios' },
    histNone:  { en: 'No changes since it was submitted.', es: 'Sin cambios desde que se envió.' },
    histPre:   { en: 'Submitted before edit history started — changes are tracked from then on.',
                 es: 'Enviada antes de que empezara el historial — los cambios se registran desde entonces.' },
    histFail:  { en: 'Could not load the edit history.', es: 'No se pudo cargar el historial.' },
    actSubmitted: { en: 'Submitted', es: 'Enviada' },
    actEdited:    { en: 'Edited', es: 'Editada' },
    actDeleted:   { en: 'Deleted', es: 'Eliminada' },
    field:     { en: 'Field', es: 'Campo' },
    before:    { en: 'Before', es: 'Antes' },
    after:     { en: 'After', es: 'Después' },
    rowN:      { en: 'row', es: 'fila' },
    added:     { en: '(added)', es: '(agregada)' },
    removed:   { en: '(removed)', es: '(eliminada)' },
    noAccess:  { en: 'You don’t have access to Harvest Intakes yet. Ask your manager to turn it on in the admin panel.',
                 es: 'Aún no tiene acceso a Recepciones de Cosecha. Pida a su gerente que lo active en el panel de administración.' },
    noData:    { en: 'Could not load intakes. Check your connection and reload.', es: 'No se pudieron cargar las recepciones. Revise su conexión y recargue.' }
  };
  document.getElementById('title').textContent = t(L.title);
  document.getElementById('brand').textContent = t(L.title);
  document.getElementById('back').textContent = t(L.back);
  document.title = `${t(L.title)} — 2CW`;

  const board = document.getElementById('board');
  if (!access) { board.innerHTML = `<div class="empty">${esc(t(L.noAccess))}</div>`; return; }

  const [reference, rowsOrNull] = await Promise.all([loadReference(), listStationForms(STATION_KEY)]);
  if (!rowsOrNull) { board.innerHTML = `<div class="empty">${esc(t(L.noData))}</div>`; return; }
  const rows = rowsOrNull;

  // Edit history and deleted intakes, for people with See edit history.
  // history: every logged event, grouped by record; deletedRows: each
  // deleted record rebuilt from its snapshot, carrying who/when/why.
  let historyByForm = new Map(), deletedRows = [], historyError = false;
  async function callRecords(body) {
    const res = await fetch('/.netlify/functions/operations-records', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, pin: sessionStorage.getItem('2cw_pin') || '', stationKey: STATION_KEY })
    });
    const out = await res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` }));
    if (!out.ok) throw new Error(out.error || `HTTP ${res.status}`);
    return out;
  }
  async function loadHistory() {
    if (!canHistory) return;
    try {
      const out = await callRecords({ action: 'history' });
      historyByForm = new Map();
      for (const h of out.history) {
        if (!historyByForm.has(h.form_id)) historyByForm.set(h.form_id, []);
        historyByForm.get(h.form_id).push(h);
      }
      historyByForm.forEach((list) => list.reverse());  // oldest first
      deletedRows = out.deleted.filter((d) => d.snapshot)
        .map((d) => ({ ...d.snapshot, _deleted: { actor: d.actor, reason: d.reason, at: d.created_at } }));
      historyError = false;
    } catch (err) {
      console.error('history', err);
      historyError = true;
    }
  }
  await loadHistory();
  const editCount = (r) => (historyByForm.get(r.id) || []).filter((h) => h.action === 'edited').length;
  const editAccess = JSON.parse(sessionStorage.getItem('2cw_ops_edit_access') || 'null');
  const canOpenDrafts = editAccess === 'all' || (Array.isArray(editAccess) && editAccess.includes(STATION_KEY));

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  const fieldByKey = Object.fromEntries(station.fields.map((f) => [f.k, f]));

  // A stored value as people read it: select codes become their label
  // ("Wildcat: CCL21-0001234"), numbers get formatted, blanks become —.
  function display(f, v) {
    if (v === undefined || v === null || v === '') return '—';
    if (f.t === 'select') {
      const opts = f.ref ? refOptions(reference, f.ref) : (f.opts || []).map((o) => ({ v: o.v, label: t(o.l) }));
      const hit = opts.find((o) => String(o.v) === String(v));
      return hit ? hit.label : String(v);
    }
    if (f.t === 'number' || f.t === 'calc') return Number.isFinite(Number(v)) ? fmtNum(v, f.dp === undefined ? 2 : f.dp) : String(v);
    return String(v);
  }
  const val = (r, k) => (r.fields || {})[k];
  // A submitted intake is one UID; a draft still in progress can have
  // several on its weigh-in rows (it's split per UID on submit).
  const uids = (r) => val(r, 'sourceUid') ||
    [...new Set((val(r, 'lines') || []).map((x) => x.sourceUid).filter(Boolean))].join(', ');
  const shown = (r, k) => fieldByKey[k] ? display(fieldByKey[k], val(r, k)) : (val(r, k) || '—');
  const fmtDate = (d) => d ? new Date(`${d}T12:00:00`).toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

  function pills(r) {
    if (r._deleted) return `<span class="pill deleted">${t(L.deletedP)}</span>`;
    const n = editCount(r);
    return metrcPill(r) + (n ? `<span class="pill edited">${t(L.editedP)}${n > 1 ? ' ×' + n : ''}</span>` : '');
  }

  function metrcPill(r) {
    if (r.status === 'draft') return `<span class="pill draft">${t(L.drafts)}</span>`;
    if (val(r, 'metrcAdjusted') === 'yes') {
      const lb = val(r, 'metrcAdjustedLb');
      return `<span class="pill ok">${t(L.metrcYes)}${Number.isFinite(Number(lb)) && lb !== null && lb !== '' ? ' · ' + fmtNum(lb, 2) + ' lb' : ''}</span>`;
    }
    return `<span class="pill warn">${t(L.metrcNo)}</span>`;
  }

  // ── Filters ────────────────────────────────────────────────────────────────
  let mode = 'all', query = '';
  const FILTERS = [['all', L.all], ['metrc', L.metrcTodo], ['draft', L.drafts]]
    .concat(canHistory ? [['deleted', L.deletedF]] : []);
  const filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = FILTERS.map(([k, l]) => `<button data-k="${k}" class="${k === mode ? 'on' : ''}">${t(l)}</button>`).join('') +
    `<input type="search" id="q" placeholder="${esc(t(L.search))}">`;
  filtersEl.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { mode = b.dataset.k; filtersEl.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); };
  });
  document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });

  function matches(r) {
    if (mode === 'metrc' && !(r.status === 'submitted' && val(r, 'metrcAdjusted') !== 'yes')) return false;
    if (mode === 'draft' && r.status !== 'draft') return false;
    if ((mode === 'deleted') !== !!r._deleted) return false;
    if (!query) return true;
    const hay = [r.strain, uids(r), val(r, 'pid'), shown(r, 'pid'), val(r, 'cid'), shown(r, 'cid'),
      val(r, 'manifestNo'), val(r, 'truckNo'), val(r, 'driver'), val(r, 'completedBy'), r.owner_user].join(' ').toLowerCase();
    return hay.includes(query);
  }

  function render() {
    const list = (mode === 'deleted' ? deletedRows : rows).filter(matches);
    document.getElementById('sub').textContent = `${list.length} ${list.length === 1 ? t(L.intake) : t(L.intakes)}`;
    if (!list.length) { board.className = ''; board.innerHTML = `<div class="empty">${t(L.empty)}</div>`; return; }
    board.className = 'board';
    board.innerHTML = list.map((r) => `
      <button type="button" class="row ${r._deleted ? 'deleted' : r.status}" data-id="${r.id}">
        <div class="row-top">
          <div>
            <div class="row-date">${esc(fmtDate(r.work_date))}</div>
            <div class="row-strain">${esc(r.strain || val(r, 'strain') || '—')}</div>
          </div>
          <div class="pills">${pills(r)}</div>
        </div>
        <dl class="row-facts">
          <dt>UID</dt><dd>${esc(uids(r) || '—')}</dd>
          <dt>${getLang() === 'es' ? 'Licencia' : 'License'}</dt><dd>${esc(shown(r, 'pid'))}</dd>
          <dt>CID</dt><dd>${esc(shown(r, 'cid'))}</dd>
          <dt>${t(fieldByKey.manifestNo.l)}</dt><dd>${esc(val(r, 'manifestNo') || '—')}</dd>
        </dl>
        <div class="row-meta">
          <span>${esc(val(r, 'completedBy') || r.owner_user || '—')}</span>
          <span class="row-headline">${esc(shown(r, 'totalWetLb'))} lb</span>
        </div>
      </button>`).join('');
    board.querySelectorAll('.row').forEach((b) => { b.onclick = () => openDetail(b.dataset.id); });
  }

  // ── Detail sheet ───────────────────────────────────────────────────────────
  const bg = document.getElementById('detail-bg');
  const detail = document.getElementById('detail');
  bg.addEventListener('click', (e) => { if (e.target === bg) closeDetail(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

  function fieldHtml(f, r) {
    const v = val(r, f.k);
    if (f.showIf && !f.showIf(r.fields || {})) return '';
    if (f.t === 'lineitems') {
      const items = Array.isArray(v) ? v : [];
      if (!items.length) return `<div class="d-row"><div class="k">${esc(t(f.l))}</div><div class="v">—</div></div>`;
      return `<div class="d-row" style="grid-template-columns:1fr"><div class="k">${esc(t(f.l))}</div>
        <div style="overflow-x:auto"><table class="d-table"><thead><tr>${f.cols.map((c) => `<th>${esc(t(c.l))}</th>`).join('')}</tr></thead>
        <tbody>${items.map((it) => `<tr>${f.cols.map((c) => `<td>${esc(display(c, it[c.k]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    }
    if (f.t === 'photo') {
      const ok = typeof v === 'string' && /^https?:\/\//.test(v);
      return `<div class="d-row"><div class="k">${esc(t(f.l))}</div><div class="v">${ok ? `<a href="${esc(v)}" target="_blank" rel="noopener"><img class="d-photo" src="${esc(v)}" alt=""></a>` : '—'}</div></div>`;
    }
    return `<div class="d-row ${f.t === 'calc' ? 'hl' : ''}"><div class="k">${esc(t(f.l))}</div><div class="v">${esc(display(f, v))}</div></div>`;
  }

  // ── Edit history ───────────────────────────────────────────────────────────
  // A logged change's path ("metrcAdjustedLb", "lines[2].weight", "lines[3]")
  // as a label people read, plus the field/column def to format its values.
  function describePath(path) {
    if (path === '(status)') return { label: getLang() === 'es' ? 'Estado' : 'Status' };
    if (path === '(owner)') return { label: getLang() === 'es' ? 'Enviada por' : 'Submitted by' };
    // Set from the admin panel's Reports tab (drying-room fixes).
    if (path === 'takenDownAt') return { label: getLang() === 'es' ? 'Marcada como bajada (panel de admin)' : 'Marked taken down (admin panel)' };
    if (path === 'takenDownNote') return { label: getLang() === 'es' ? 'Nota de bajada' : 'Take-down note' };
    const m = /^([^.[]+)(?:\[(\d+)\](?:\.(.+))?)?$/.exec(path);
    const f = m && fieldByKey[m[1]];
    if (!f) return { label: path };
    if (f.t !== 'lineitems' || m[2] === undefined) return { label: t(f.l), def: f };
    const rowLabel = `${t(f.l)} · ${t(L.rowN)} ${Number(m[2]) + 1}`;
    if (!m[3]) return { label: rowLabel, row: f };
    const col = (f.cols || []).find((c) => c.k === m[3]);
    return { label: `${rowLabel} · ${col ? t(col.l) : m[3]}`, def: col };
  }
  function changeValue(d, v) {
    if (v === null || v === undefined || v === '') return '—';
    if (d.row) return (d.row.cols || []).map((c) => display(c, v[c.k])).filter((x) => x !== '—').join(' / ') || '—';
    if (d.def && d.def.t === 'lineitems') return Array.isArray(v) ? `${v.length} × ${t(L.rowN)}` : '—';
    if (d.def) return display(d.def, v);
    return typeof v === 'object' ? JSON.stringify(v) : String(v);
  }
  const isNumeric = (d) => d.def && (d.def.t === 'number' || d.def.t === 'calc');
  const fmtWhen = (ts) => ts ? new Date(ts).toLocaleString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';

  function historyHtml(r) {
    if (!canHistory) return '';
    const hd = `<div class="d-section"><div class="d-section-hd">${t(L.history)}</div>`;
    if (historyError) return `${hd}<div class="muted-note">${t(L.histFail)}</div></div>`;
    if (r.status === 'draft' && !r._deleted) return '';
    const list = historyByForm.get(r.id) || [];
    const items = list.map((h) => {
      const act = { submitted: L.actSubmitted, edited: L.actEdited, deleted: L.actDeleted }[h.action];
      let bodyHtml = '';
      if (h.action === 'edited' && h.changes.length) {
        bodyHtml = `<div style="overflow-x:auto"><table class="d-table"><thead><tr><th>${t(L.field)}</th><th>${t(L.before)}</th><th>${t(L.after)}</th></tr></thead><tbody>${
          h.changes.map((c) => {
            const d = describePath(c.path);
            const before = d.row && c.old === null ? t(L.added) : changeValue(d, c.old);
            const after = d.row && c.new === null ? t(L.removed) : changeValue(d, c.new);
            return `<tr class="${isNumeric(d) ? 'num' : ''}"><td>${esc(d.label)}</td><td class="old">${esc(before)}</td><td class="new">${esc(after)}</td></tr>`;
          }).join('')}</tbody></table></div>`;
      }
      if (h.reason) bodyHtml += `<div class="hist-reason">${t(L.reason)}: ${esc(h.reason)}</div>`;
      return `<li><div class="hist-hd"><span class="hist-act ${h.action}">${t(act)}</span><b>${esc(h.actor || '—')}</b> · ${esc(fmtWhen(h.created_at))}</div>${bodyHtml}</li>`;
    });
    const notes = [];
    if (!list.some((h) => h.action === 'submitted')) notes.push(t(L.histPre));
    if (!list.some((h) => h.action === 'edited') && !r._deleted) notes.push(t(L.histNone));
    return `${hd}${items.length ? `<ul class="hist">${items.join('')}</ul>` : ''}${
      notes.map((n) => `<div class="muted-note" style="margin-top:8px">${esc(n)}</div>`).join('')}</div>`;
  }

  function deleteHtml(r) {
    if (!canDelete || r._deleted) return '';
    return `<div class="d-section">
      <button type="button" class="btn btn-danger" id="d-del">${t(L.del)}</button>
      <div class="del-box" id="d-del-box" hidden>
        <p>${esc(t(L.delWhy))}</p>
        <textarea id="d-del-why" maxlength="500"></textarea>
        <div class="row-btns">
          <button type="button" class="btn btn-danger solid" id="d-del-go">${t(L.delGo)}</button>
          <button type="button" class="btn" id="d-del-cancel">${t(L.cancel)}</button>
        </div>
        <div class="del-err" id="d-del-err"></div>
      </div>
    </div>`;
  }

  function wireDelete(r) {
    const btn = document.getElementById('d-del');
    if (!btn) return;
    const box = document.getElementById('d-del-box'), why = document.getElementById('d-del-why'), err = document.getElementById('d-del-err');
    btn.onclick = () => { box.hidden = false; btn.hidden = true; why.focus(); };
    document.getElementById('d-del-cancel').onclick = () => { box.hidden = true; btn.hidden = false; err.textContent = ''; };
    document.getElementById('d-del-go').onclick = async (e) => {
      const reason = why.value.trim();
      if (!reason) { err.textContent = t(L.delNeedWhy); why.focus(); return; }
      e.target.disabled = true; err.textContent = '';
      try {
        await callRecords({ action: 'delete', id: r.id, reason });
      } catch (ex) {
        err.textContent = `${t(L.delFail)} ${ex.message}`;
        e.target.disabled = false;
        return;
      }
      const i = rows.findIndex((x) => x.id === r.id);
      if (i >= 0) rows.splice(i, 1);
      closeDetail();
      await loadHistory();
      render();
    };
  }

  function openDetail(id) {
    const r = rows.find((x) => x.id === id) || deletedRows.find((x) => x.id === id);
    if (!r) return;
    const url = new URL(location.href); url.searchParams.set('id', id); history.replaceState(null, '', url);
    let action = '';
    if (!r._deleted && r.status === 'submitted' && canEdit) action = `<a class="btn btn-blue" href="/ops_form.html?station=${STATION_KEY}&edit=${r.id}">${t(L.edit)}</a>`;
    if (!r._deleted && r.status === 'draft' && canOpenDrafts) action = `<a class="btn btn-blue" href="/ops_form.html?station=${STATION_KEY}&draft=${r.id}">${t(L.openDraft)}</a>`;
    const f = r.fields || {};
    const subLines = [
      r.status === 'draft' ? t(L.draftNote) : `${t(L.submitted)} ${r.submitted_at ? new Date(r.submitted_at).toLocaleString() : ''} ${r.owner_user ? t(L.by) + ' ' + r.owner_user : ''}`,
      f.lastEditedBy ? `${t(L.edited)} ${f.lastEditedBy} · ${f.lastEditedAt ? new Date(f.lastEditedAt).toLocaleString() : ''}` : ''
    ].filter(Boolean);
    detail.innerHTML = `
      <div class="d-top">
        <div><div class="row-date">${esc(fmtDate(r.work_date))}</div><div class="d-title">${esc(r.strain || f.strain || '—')}</div></div>
        <div class="d-actions">${action}<button type="button" class="btn" id="d-close">${t(L.close)}</button></div>
      </div>
      <div class="d-sub">${subLines.map(esc).join('<br>')}</div>
      ${r._deleted ? `<div class="d-deleted"><b>${t(L.delBy)} ${esc(r._deleted.actor || '—')}</b> · ${esc(fmtWhen(r._deleted.at))}${
        r._deleted.reason ? `<br>${t(L.reason)}: ${esc(r._deleted.reason)}` : ''}</div>` : ''}
      <div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">${pills(r)}</div>
      ${station.fields.map((fd) => fieldHtml(fd, r)).join('')}
      ${historyHtml(r)}
      ${deleteHtml(r)}`;
    document.getElementById('d-close').onclick = closeDetail;
    wireDelete(r);
    bg.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function closeDetail() {
    if (!bg.classList.contains('on')) return;
    bg.classList.remove('on');
    document.body.style.overflow = '';
    const url = new URL(location.href); url.searchParams.delete('id'); history.replaceState(null, '', url);
  }

  render();
  // Coming back from an edit (or a shared link) reopens that intake.
  const startId = new URLSearchParams(location.search).get('id');
  if (startId) openDetail(startId);
})();
</script>
<script src="/sw_register.js"></script>
</body>
