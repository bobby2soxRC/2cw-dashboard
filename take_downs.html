<!DOCTYPE html>
<html lang="en">
<head>
<script src="/session_share.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Take Downs — 2CW Operations</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:0 0 auto}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--blue);color:#000}

    main{padding:28px 16px 60px;max-width:1100px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;line-height:1}
    .sub{margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
    .filters button{background:var(--surface);border:1px solid var(--border);color:var(--subtext);border-radius:10px;padding:.6rem 1rem;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:44px}
    .filters button.on{background:var(--blue);border-color:var(--blue);color:#000;font-weight:700}
    .filters input{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.6rem .9rem;font-size:.95rem;min-height:44px;outline:none}
    .filters input:focus{border-color:var(--blue)}

    /* Intakes table: click a header to sort, type in the row under it to filter. */
    .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .tbl{width:100%;border-collapse:collapse;font-size:.85rem}
    .tbl th{background:var(--surface2);color:var(--muted);font-family:'DM Mono',monospace;font-size:.65rem;font-weight:500;
      letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
    .tbl th.sortable{cursor:pointer;user-select:none}
    .tbl th.sortable:hover,.tbl th.sorted{color:var(--blue)}
    .tbl th .arrow{display:inline-block;width:1em;margin-left:3px}
    .tbl tr.col-filters th{padding:6px 6px;background:var(--surface2)}
    .tbl tr.col-filters input{width:100%;min-width:70px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);
      padding:5px 7px;font:inherit;font-size:.78rem;text-transform:none;letter-spacing:0;outline:none}
    .tbl tr.col-filters input:focus{border-color:var(--blue)}
    .tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
    .tbl tbody tr.row{cursor:pointer}
    .tbl tbody tr.row td:first-child{border-left:3px solid var(--green)}
    .tbl tbody tr.row.draft td:first-child{border-left-color:var(--gold)}
    .tbl tbody tr.row.deleted td:first-child{border-left-color:var(--red)}
    .tbl tbody tr.row.deleted{opacity:.85}
    .tbl tbody tr.row:hover,.tbl tbody tr.row:focus-visible{background:var(--surface2);outline:none}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl .mono{font-family:'DM Mono',monospace;font-size:.8rem}
    .tbl .num{text-align:right;font-family:'DM Mono',monospace}
    .tbl .strain{font-weight:500}
    .tbl .row-time{margin-top:2px;font-size:.7rem;color:var(--muted)}
    .tbl .clip{max-width:220px;overflow:hidden;text-overflow:ellipsis}
    .tbl .pills{display:flex;gap:5px}
    .tbl td.empty{padding:40px 0}
    .row-date{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .pills{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
    .pill{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
    .pill.draft{border-color:var(--gold);color:var(--gold)}
    .pill.dry{border-color:var(--blue);color:var(--blue)}
    .pill.ok{border-color:var(--green);color:var(--green)}
    .pill.warn{border-color:var(--red);color:var(--red)}
    .pill.sync{border-color:var(--gold);color:var(--gold);border-style:dashed}

    .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:.9rem}
    .footer{margin-top:36px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}

    /* Detail sheet */
    #detail-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 12px 40px}
    #detail-bg.on{display:flex}
    #detail{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:720px;padding:22px 20px}
    .d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
    .d-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;line-height:1.05}
    .d-sub{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);margin-bottom:14px;line-height:1.6}
    .d-actions{display:flex;gap:8px;flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end}
    .btn{padding:.65rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);text-decoration:none;display:inline-block;min-height:40px}
    .btn-blue{background:var(--blue);border-color:var(--blue);color:#000}
    .d-row{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:.9rem}
    .d-row .k{color:var(--muted);font-size:.78rem}
    .d-row .v{color:var(--text);word-break:break-word}
    .d-row.hl .v{font-family:'DM Mono',monospace;color:var(--green)}
    .d-table{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:.8rem;margin-top:4px}
    .d-table th{color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:.7rem}
    .d-table td{padding:4px 6px;border-bottom:1px solid var(--border)}
    .d-photo{max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--border);display:block}
    .pill.edited{border-color:var(--purple);color:var(--purple)}
    .pill.deleted{border-color:var(--red);background:var(--red);color:#000}
    .d-section{margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
    .d-section-hd{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--subtext);margin-bottom:10px}
    .d-deleted{border:1px solid var(--red);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.85rem;line-height:1.5}
    .d-deleted b{color:var(--red)}
    .hist{list-style:none;display:flex;flex-direction:column;gap:12px}
    .hist-hd{font-size:.82rem;color:var(--subtext)}
    .hist-hd b{color:var(--text);font-weight:500}
    .hist-act{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--border);margin-right:6px}
    .hist-act.edited{border-color:var(--purple);color:var(--purple)}
    .hist-act.deleted{border-color:var(--red);color:var(--red)}
    .hist-act.submitted{border-color:var(--green);color:var(--green)}
    .hist-reason{font-size:.82rem;color:var(--subtext);margin-top:4px}
    .hist .d-table td.old{color:var(--muted);text-decoration:line-through}
    .hist .d-table tr.num td.new{color:var(--gold);font-weight:500}
    .muted-note{font-size:.82rem;color:var(--muted)}
    .btn-danger{border-color:var(--red);color:var(--red)}
    .btn-danger.solid{background:var(--red);color:#000}
    .del-box{border:1px solid var(--red);border-radius:10px;padding:12px;margin-top:10px}
    .del-box p{font-size:.85rem;color:var(--subtext);margin-bottom:8px;line-height:1.5}
    .del-box textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font:inherit;font-size:.95rem;resize:vertical}
    .del-box .row-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .del-err{color:var(--red);font-size:.85rem;margin-top:8px}

    /* Copy menu: pick one value off an intake to paste into Metrc etc. */
    .copy-btn{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:7px;padding:4px 10px;min-height:30px;
      font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer}
    .copy-btn:hover,.copy-btn.on{border-color:var(--blue);color:var(--blue)}
    #copy-menu{position:fixed;z-index:60;background:var(--surface2);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);
      width:min(300px,calc(100vw - 24px));max-height:min(70vh,520px);overflow-y:auto;padding:4px 0;display:none}
    #copy-menu.on{display:block}
    #copy-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);font:inherit;cursor:pointer;padding:7px 14px}
    #copy-menu button:hover,#copy-menu button:focus-visible{background:var(--blue);color:#000;outline:none}
    #copy-menu .ck{display:block;font-size:.72rem;color:var(--muted)}
    #copy-menu button:hover .ck,#copy-menu button:focus-visible .ck{color:#000;opacity:.65}
    #copy-menu .cv{display:block;font-family:'DM Mono',monospace;font-size:.85rem;word-break:break-all}
    #copy-menu button.done{background:var(--green);color:#000}
    #copy-menu button.done .ck{color:#000}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Take Downs</div>
  <a class="hdr-back" id="xlink" href="/harvest_intakes.html" hidden></a>
  <div class="lang" id="lang"></div>
</header>

<main>
  <div class="title" id="title">Take Downs</div>
  <div class="sub" id="sub">—</div>
  <div class="filters" id="filters"></div>
  <div id="board"></div>
  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</main>

<div id="detail-bg"><div id="detail"></div></div>
<div id="copy-menu" role="menu"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script>
// Every Take Down — Dry record (station dry_check), newest first — the Take
// Down counterpart of harvest_intakes.html, asked for by Kevin 2026-11-04.
// Seen by anyone with Harvest Intakes view (2cw_intake_access, set at hub
// login). Each row shows where the dry package stands with Bucking (from the
// Bucking forms on its New Dry UID). Edit reopens it in
// ops_form.html?edit=<id>&from=takedowns for people with Fix submitted forms
// + Take Down edit access (canFixSubmitted); Delete for Delete submitted
// forms (canDeleteSubmitted); edit history with Harvest Intakes → See edit
// history. Delete and history go through netlify/functions/operations-records.js,
// which re-checks the permission from the PIN.
(async function () {
  mountLangToggle('lang');
  const STATION_KEY = 'dry_check';
  const station = STATION_BY_KEY[STATION_KEY];
  const access = sessionStorage.getItem('2cw_intake_access') || '';
  const canEdit = canFixSubmitted(STATION_KEY);
  const canDelete = canDeleteSubmitted(STATION_KEY);
  const canHistory = sessionStorage.getItem('2cw_intake_history') === 'true';

  const L = {
    title:     { en: 'Take Downs', es: 'Bajadas' },
    back:      { en: '← Hub', es: '← Inicio' },
    intakesLink: { en: 'Harvest Intakes →', es: 'Recepciones →' },
    all:       { en: 'All', es: 'Todas' },
    waiting:   { en: 'Waiting for bucking', es: 'Esperando desvarado' },
    held:      { en: 'On hold', es: 'En espera' },
    bucked:    { en: 'Bucked', es: 'Desvarado' },
    drafts:    { en: 'In progress', es: 'En curso' },
    deletedF:  { en: 'Deleted', es: 'Eliminadas' },
    search:    { en: 'Search strain, UID, license, CID, room…', es: 'Buscar variedad, UID, licencia, CID, cuarto…' },
    pWaiting:  { en: 'Waiting for bucking', es: 'Esperando desvarado' },
    pBucking:  { en: 'Bucking now', es: 'Desvarando ahora' },
    pPart:     { en: 'Part bucked', es: 'Desvarado en parte' },
    pLeft:     { en: 'left on stem', es: 'en tallo' },
    pDone:     { en: 'Bucked', es: 'Desvarado' },
    pHoldQ:    { en: 'Hold — quality', es: 'Espera — calidad' },
    pHoldO:    { en: 'Hold — for an order', es: 'Espera — para pedido' },
    pReleased: { en: 'Released in part', es: 'Liberado en parte' },
    submitted: { en: 'Submitted', es: 'Enviado' },
    by:        { en: 'by', es: 'por' },
    edited:    { en: 'Last edited by', es: 'Última edición por' },
    edit:      { en: 'Edit', es: 'Editar' },
    close:     { en: 'Close', es: 'Cerrar' },
    openDraft: { en: 'Open form', es: 'Abrir formulario' },
    draftNote: { en: 'Still in progress — not submitted yet.', es: 'Todavía en curso — aún no se ha enviado.' },
    one:       { en: 'take down', es: 'bajada' },
    many:      { en: 'take downs', es: 'bajadas' },
    empty:     { en: 'No take downs match.', es: 'Ninguna bajada coincide.' },
    deletedP:  { en: 'Deleted', es: 'Eliminada' },
    editedP:   { en: 'Edited', es: 'Editada' },
    del:       { en: 'Delete this take down', es: 'Eliminar esta bajada' },
    delWhy:    { en: 'Why is it being deleted? (required — saved with the deleted copy in the edit history)',
                 es: '¿Por qué se elimina? (obligatorio — se guarda con la copia eliminada en el historial)' },
    delGo:     { en: 'Delete', es: 'Eliminar' },
    cancel:    { en: 'Cancel', es: 'Cancelar' },
    delNeedWhy:{ en: 'Enter a reason first.', es: 'Escriba un motivo primero.' },
    delFail:   { en: 'Could not delete:', es: 'No se pudo eliminar:' },
    delBy:     { en: 'Deleted by', es: 'Eliminada por' },
    reason:    { en: 'Reason', es: 'Motivo' },
    history:   { en: 'Edit history', es: 'Historial de cambios' },
    histNone:  { en: 'No changes since it was submitted.', es: 'Sin cambios desde que se envió.' },
    histPre:   { en: 'Submitted before edit history started — changes are tracked from then on.',
                 es: 'Enviada antes de que empezara el historial — los cambios se registran desde entonces.' },
    histFail:  { en: 'Could not load the edit history.', es: 'No se pudo cargar el historial.' },
    actSubmitted: { en: 'Submitted', es: 'Enviada' },
    actEdited:    { en: 'Edited', es: 'Editada' },
    actDeleted:   { en: 'Deleted', es: 'Eliminada' },
    field:     { en: 'Field', es: 'Campo' },
    before:    { en: 'Before', es: 'Antes' },
    after:     { en: 'After', es: 'Después' },
    rowN:      { en: 'row', es: 'fila' },
    added:     { en: '(added)', es: '(agregada)' },
    removed:   { en: '(removed)', es: '(eliminada)' },
    noAccess:  { en: 'You don’t have access to Take Downs yet. Ask your manager to turn on Harvest Intakes in the admin panel.',
                 es: 'Aún no tiene acceso a Bajadas. Pida a su gerente que active Recepciones de Cosecha en el panel de administración.' },
    noData:    { en: 'Could not load take downs. Check your connection and reload.', es: 'No se pudieron cargar las bajadas. Revise su conexión y recargue.' },
    copy:      { en: 'Copy', es: 'Copiar' },
    copied:    { en: 'Copied ✓', es: 'Copiado ✓' },
    copyFail:  { en: 'Could not copy', es: 'No se pudo copiar' },
    date:      { en: 'Date', es: 'Fecha' },
    license:   { en: 'License', es: 'Licencia' },
    dryUid:    { en: 'Dry UID', es: 'UID seco' },
    intakeUid: { en: 'Intake UID', es: 'UID recepción' },
    room:      { en: 'Stored', es: 'Almacenado' },
    boxes:     { en: 'Boxes', es: 'Cajas' },
    dryLb:     { en: 'Dry lb', es: 'Lb secas' },
    wetLb:     { en: 'Wet lb', es: 'Lb húmedas' },
    loss:      { en: 'Moist. loss', es: 'Pérd. humedad' },
    colState:  { en: 'Bucking', es: 'Desvarado' },
    colBy:     { en: 'By', es: 'Por' },
    colFilter: { en: 'Filter', es: 'Filtrar' },
    buckHd:    { en: 'Bucking on this package', es: 'Desvarado de este paquete' },
    buckNone:  { en: 'No Bucking form on this Dry UID yet.', es: 'Todavía no hay formulario de desvarado con este UID seco.' },
    buckStart: { en: 'Starting dry lb', es: 'Lb secas al inicio' },
    buckFlower:{ en: 'Bucked flower lb', es: 'Lb de flor desvarada' },
    buckLeft:  { en: 'Left on stem', es: 'Queda en tallo' },
    buckOpen:  { en: 'open page', es: 'página abierta' },
    totals:    { en: 'Total dry', es: 'Total seco' }
  };
  document.getElementById('title').textContent = t(L.title);
  document.getElementById('brand').textContent = t(L.title);
  document.getElementById('back').textContent = t(L.back);
  document.title = `${t(L.title)} — 2CW`;

  const board = document.getElementById('board');
  if (!access) { board.innerHTML = `<div class="empty">${esc(t(L.noAccess))}</div>`; return; }
  const link = document.getElementById('xlink');
  link.textContent = t(L.intakesLink); link.hidden = false;

  const [reference, rowsOrNull, buckRows] = await Promise.all([loadReference(), listStationForms(STATION_KEY), listStationForms('buck')]);
  if (!rowsOrNull) { board.innerHTML = `<div class="empty">${esc(t(L.noData))}</div>`; return; }
  const rows = rowsOrNull;
  const bucks = (buckRows || []).filter((b) => b.status === 'submitted').map(flattenRecord);
  const buckOpen = (buckRows || []).filter((b) => b.status === 'draft');

  // Edit history and deleted take downs, for people with See edit history.
  let historyByForm = new Map(), deletedRows = [], historyError = false;
  async function callRecords(body) {
    const res = await fetch('/.netlify/functions/operations-records', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, pin: sessionStorage.getItem('2cw_pin') || '', stationKey: STATION_KEY })
    });
    const out = await res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` }));
    if (!out.ok) throw new Error(out.error || `HTTP ${res.status}`);
    return out;
  }
  async function loadHistory() {
    if (!canHistory) return;
    try {
      const out = await callRecords({ action: 'history' });
      historyByForm = new Map();
      for (const h of out.history) {
        if (!historyByForm.has(h.form_id)) historyByForm.set(h.form_id, []);
        historyByForm.get(h.form_id).push(h);
      }
      historyByForm.forEach((list) => list.reverse());  // oldest first
      deletedRows = out.deleted.filter((d) => d.snapshot)
        .map((d) => ({ ...d.snapshot, _deleted: { actor: d.actor, reason: d.reason, at: d.created_at } }));
      historyError = false;
    } catch (err) {
      console.error('history', err);
      historyError = true;
    }
  }
  await loadHistory();
  const editCount = (r) => (historyByForm.get(r.id) || []).filter((h) => h.action === 'edited').length;
  const canOpenDrafts = canEditStationHere(STATION_KEY);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  const fieldByKey = Object.fromEntries(station.fields.map((f) => [f.k, f]));

  function display(f, v) {
    if (v === undefined || v === null || v === '') return '—';
    if (f.t === 'select') {
      const opts = f.ref ? refOptions(reference, f.ref) : (f.opts || []).map((o) => ({ v: o.v, label: t(o.l) }));
      const hit = opts.find((o) => String(o.v) === String(v));
      return hit ? hit.label : String(v);
    }
    if (f.t === 'check') return v === true || v === 'true' ? (getLang() === 'es' ? 'Sí' : 'Yes') : 'No';
    if (f.fmt === 'pct' && Number.isFinite(Number(v))) return fmtNum(Number(v) * 100, 1) + '%';
    if (f.t === 'number' || f.t === 'calc') return Number.isFinite(Number(v)) ? fmtNum(v, f.dp === undefined ? 2 : f.dp) : String(v);
    return String(v);
  }
  const val = (r, k) => (r.fields || {})[k];
  const shown = (r, k) => fieldByKey[k] ? display(fieldByKey[k], val(r, k)) : (val(r, k) || '—');
  const numOf = (r, k) => { const n = parseFloat(val(r, k)); return Number.isFinite(n) ? n : -Infinity; };
  const fmtDate = (d) => d ? new Date(`${d}T12:00:00`).toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  const savedAt = (r) => r.submitted_at || r.created_at || '';
  const fmtTime = (r) => {
    const ts = savedAt(r);
    if (!ts) return '';
    const d = new Date(ts), loc = getLang() === 'es' ? 'es-MX' : 'en-US';
    const time = d.toLocaleTimeString(loc, { timeZone: 'America/Los_Angeles', hour: 'numeric', minute: '2-digit' });
    const day = d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    return day === r.work_date ? time : d.toLocaleDateString(loc, { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric' }) + ', ' + time;
  };

  // ── Bucking state ──────────────────────────────────────────────────────────
  // From the Bucking forms on this take down's New Dry UID (and on any part
  // released off a hold, `releases`), the same matching buckablePackages
  // uses: the newest submitted Bucking decides — weight left on stem
  // (buckLeftLb) means part bucked. An open Bucking page means bucking now. Otherwise a held
  // take down is on hold, and a released one is waiting for bucking.
  const uidsOf = (r) => [val(r, 'sourceUid'), ...((val(r, 'releases') || []).map((x) => x.uid))].filter(Boolean);
  const stateCache = new Map();
  function buckState(r) {
    if (r._deleted || r.status === 'draft') return null;
    if (stateCache.has(r.id)) return stateCache.get(r.id);
    const ids = uidsOf(r);
    const recs = bucks.filter((b) => b.sourceUid && ids.some((u) => uidTailMatch(b.sourceUid, u)));
    const open = buckOpen.some((b) => (b.fields || {}).sourceUid && ids.some((u) => uidTailMatch(b.fields.sourceUid, u)));
    let s;
    if (recs.length) {
      const last = recs.reduce((a, b) => (String(b.submittedAt || '') > String(a.submittedAt || '') ? b : a));
      const left = buckLeftLb(last);
      const flower = recs.reduce((a, b) => a + (Number(b.buckedFlowerLb) || 0), 0);
      s = { k: open ? 'bucking' : left > 0.05 ? 'part' : 'done', left, flower, date: last.date, recs };
    } else if (open) s = { k: 'bucking', recs };
    else {
      const res = val(r, 'result') || 'pass';
      const released = (val(r, 'releases') || []).length > 0;
      s = res !== 'pass' ? { k: released ? 'released' : 'hold', res, recs } : { k: 'waiting', recs };
    }
    s.open = open;
    stateCache.set(r.id, s);
    return s;
  }
  const daysSince = (d) => d ? Math.floor((Date.now() - new Date(`${d}T12:00:00`).getTime()) / 86400000) : null;
  function statePill(r) {
    if (r._deleted) return `<span class="pill deleted">${t(L.deletedP)}</span>`;
    if (r.status === 'draft') return `<span class="pill draft">${t(L.drafts)}</span>`;
    const s = buckState(r);
    if (s.k === 'done') return `<span class="pill ok">${t(L.pDone)} ${esc(fmtDate(s.date))}${s.flower > 0 ? ' · ' + fmtNum(s.flower, 1) + ' lb' : ''}</span>`;
    if (s.k === 'part') return `<span class="pill dry">${t(L.pPart)} · ${fmtNum(s.left, 1)} lb ${t(L.pLeft)}</span>`;
    if (s.k === 'bucking') return `<span class="pill dry">${t(L.pBucking)}</span>`;
    if (s.k === 'hold') return `<span class="pill warn">${t(s.res === 'hold_order' ? L.pHoldO : L.pHoldQ)}</span>`;
    if (s.k === 'released') return `<span class="pill sync">${t(L.pReleased)}</span>`;
    const days = daysSince(r.work_date);
    return `<span class="pill sync">${t(L.pWaiting)}${days !== null && days >= 0 ? ' · ' + days + ' d' : ''}</span>`;
  }
  const stateSort = (r) => {
    if (r._deleted) return '9';
    if (r.status === 'draft') return '0';
    const s = buckState(r);
    return ({ hold: '1', released: '2', waiting: '3', bucking: '4', part: '5', done: '6' }[s.k]) + (r.work_date || '');
  };
  function pills(r) {
    const n = r._deleted ? 0 : editCount(r);
    return statePill(r) + (n ? `<span class="pill edited">${t(L.editedP)}${n > 1 ? ' ×' + n : ''}</span>` : '');
  }

  // ── Filters ────────────────────────────────────────────────────────────────
  let mode = 'all', query = '';
  const FILTERS = [['all', L.all], ['waiting', L.waiting], ['hold', L.held], ['bucked', L.bucked], ['draft', L.drafts]]
    .concat(canHistory ? [['deleted', L.deletedF]] : []);
  const filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = FILTERS.map(([k, l]) => `<button data-k="${k}" class="${k === mode ? 'on' : ''}">${t(l)}</button>`).join('') +
    `<input type="search" id="q" placeholder="${esc(t(L.search))}">`;
  filtersEl.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { mode = b.dataset.k; filtersEl.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); };
  });
  document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });

  function matches(r) {
    if ((mode === 'deleted') !== !!r._deleted) return false;
    const s = buckState(r);
    if (mode === 'all' && r.status === 'draft') return false;
    if (mode === 'draft' && r.status !== 'draft') return false;
    if (mode === 'waiting' && !(s && ['waiting', 'released', 'bucking', 'part'].includes(s.k))) return false;
    if (mode === 'hold' && !(s && s.k === 'hold')) return false;
    if (mode === 'bucked' && !(s && s.k === 'done')) return false;
    if (!query) return true;
    const hay = [r.strain, val(r, 'sourceUid'), val(r, 'incomingUid'), val(r, 'pid'), shown(r, 'pid'), val(r, 'cid'), shown(r, 'cid'),
      shown(r, 'dryRoom'), shown(r, 'storageLocation'), val(r, 'completedBy'), val(r, 'weighmaster'), r.owner_user].join(' ').toLowerCase();
    return hay.includes(query);
  }

  // ── Table ──────────────────────────────────────────────────────────────────
  const tmp = document.createElement('div');
  const plain = (html) => { tmp.innerHTML = html; return tmp.textContent; };
  const COLS = [
    { k: 'date', l: L.date, html: (r) => esc(fmtDate(r.work_date)) + (fmtTime(r) ? `<div class="row-time">${esc(fmtTime(r))}</div>` : ''),
      sort: (r) => (r.work_date || '') + savedAt(r), cls: 'mono' },
    { k: 'strain', l: fieldByKey.strain.l, html: (r) => esc(r.strain || val(r, 'strain') || '—'), cls: 'strain' },
    { k: 'uid', l: L.dryUid, html: (r) => esc(val(r, 'sourceUid') || '—'), cls: 'mono clip' },
    { k: 'in', l: L.intakeUid, html: (r) => esc(val(r, 'incomingUid') || '—'), cls: 'mono clip' },
    { k: 'pid', l: L.license, html: (r) => esc(shown(r, 'pid')), cls: 'clip' },
    { k: 'cid', l: { en: 'CID', es: 'CID' }, html: (r) => esc(shown(r, 'cid')) },
    { k: 'room', l: L.room, html: (r) => esc(shown(r, 'storageLocation')), cls: 'clip' },
    { k: 'state', l: L.colState, html: (r) => `<div class="pills">${statePill(r)}</div>`, sort: stateSort },
    { k: 'by', l: L.colBy, html: (r) => esc(val(r, 'completedBy') || r.owner_user || '—'), cls: 'clip' },
    { k: 'boxes', l: L.boxes, html: (r) => esc(shown(r, 'boxCount')), sort: (r) => numOf(r, 'boxCount'), cls: 'num' },
    { k: 'wet', l: L.wetLb, html: (r) => esc(shown(r, 'wetIntakeLb')), sort: (r) => numOf(r, 'wetIntakeLb'), cls: 'num' },
    { k: 'dry', l: L.dryLb, html: (r) => esc(shown(r, 'dryWeightLb')), sort: (r) => numOf(r, 'dryWeightLb'), cls: 'num' },
    { k: 'loss', l: L.loss, html: (r) => esc(shown(r, 'moistureLossPct')), sort: (r) => numOf(r, 'moistureLossPct'), cls: 'num' }
  ];
  const NUM_COLS = ['date', 'boxes', 'wet', 'dry', 'loss'];
  let sortKey = 'date', sortDir = -1;
  const colFilters = {};

  function sortedList(list) {
    const col = COLS.find((c) => c.k === sortKey);
    const key = col.sort || ((r) => plain(col.html(r)).toLowerCase());
    return list.map((r, i) => ({ r, i, v: key(r) }))
      .sort((a, b) => (a.v < b.v ? -1 : a.v > b.v ? 1 : a.i - b.i) * (a.v === b.v ? 1 : sortDir))
      .map((x) => x.r);
  }

  function buildTable() {
    board.innerHTML = `<div class="tbl-wrap"><table class="tbl">
      <thead>
        <tr>${COLS.map((c) => `<th class="sortable ${c.cls && c.cls.includes('num') ? 'num' : ''}" data-sort="${c.k}">${esc(t(c.l))}<span class="arrow"></span></th>`).join('')}<th></th></tr>
        <tr class="col-filters">${COLS.map((c) => `<th><input type="search" data-filter="${c.k}" placeholder="${esc(t(L.colFilter))}" aria-label="${esc(t(L.colFilter))} ${esc(t(c.l))}"></th>`).join('')}<th></th></tr>
      </thead>
      <tbody></tbody></table></div>`;
    board.querySelectorAll('th[data-sort]').forEach((th) => {
      th.onclick = () => {
        if (sortKey === th.dataset.sort) sortDir = -sortDir;
        else { sortKey = th.dataset.sort; sortDir = NUM_COLS.includes(sortKey) ? -1 : 1; }
        render();
      };
    });
    board.querySelectorAll('input[data-filter]').forEach((inp) => {
      inp.addEventListener('input', () => { colFilters[inp.dataset.filter] = inp.value.trim().toLowerCase(); render(); });
    });
  }

  function render() {
    if (!board.querySelector('table')) buildTable();
    const active = COLS.filter((c) => colFilters[c.k]);
    const list = sortedList((mode === 'deleted' ? deletedRows : rows).filter(matches)
      .filter((r) => active.every((c) => plain(c.html(r)).toLowerCase().includes(colFilters[c.k]))));
    const dry = list.reduce((a, r) => a + (Number(val(r, 'dryWeightLb')) || 0), 0);
    document.getElementById('sub').textContent = `${list.length} ${list.length === 1 ? t(L.one) : t(L.many)}` +
      (dry > 0 ? ` · ${t(L.totals)} ${fmtNum(dry, 1)} lb` : '');
    board.querySelectorAll('th[data-sort]').forEach((th) => {
      const on = th.dataset.sort === sortKey;
      th.classList.toggle('sorted', on);
      th.querySelector('.arrow').textContent = on ? (sortDir < 0 ? '▼' : '▲') : '';
      th.setAttribute('aria-sort', on ? (sortDir < 0 ? 'descending' : 'ascending') : 'none');
    });
    const tbody = board.querySelector('tbody');
    if (!list.length) { tbody.innerHTML = `<tr><td class="empty" colspan="${COLS.length + 1}">${t(L.empty)}</td></tr>`; return; }
    tbody.innerHTML = list.map((r) => `
      <tr tabindex="0" class="row ${r._deleted ? 'deleted' : r.status}" data-id="${r.id}">
        ${COLS.map((c) => `<td class="${c.cls || ''}">${c.html(r)}</td>`).join('')}
        <td><button type="button" class="copy-btn" data-copy="${r.id}" aria-haspopup="menu">${t(L.copy)}</button></td>
      </tr>`).join('');
    tbody.querySelectorAll('.row').forEach((b) => {
      b.onclick = () => openDetail(b.dataset.id);
      b.onkeydown = (e) => { if (e.target === b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(b.dataset.id); } };
    });
    tbody.querySelectorAll('.copy-btn').forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); toggleCopyMenu(b, findRow(b.dataset.copy)); };
    });
  }

  const findRow = (id) => rows.find((x) => x.id === id) || deletedRows.find((x) => x.id === id);

  // ── Copy menu ──────────────────────────────────────────────────────────────
  // Same as Harvest Intakes: a take down's values, label over value; select
  // fields copy their stored code and numbers copy plain, to paste into Metrc.
  const copyMenu = document.getElementById('copy-menu');
  let copyAnchor = null;
  function copyText(f, v) {
    if (v === undefined || v === null || v === '') return '';
    if (f.t === 'check') return display(f, v);
    if (f.fmt === 'pct') return display(f, v);
    if ((f.t === 'number' || f.t === 'calc') && Number.isFinite(Number(v))) return String(Number(Number(v).toFixed(f.dp === undefined ? 2 : f.dp)));
    return String(v);
  }
  function copyItems(r) {
    const f = r.fields || {};
    const items = [[t(fieldByKey.strain.l), r.strain || f.strain], [t(L.date), r.work_date]];
    for (const k of ['sourceUid', 'incomingUid', 'pid', 'cid', 'dryRoom', 'storageLocation', 'completedBy', 'weighmaster',
      'boxCount', 'dryWeightLb', 'wetIntakeLb', 'moistureLossLb', 'moistureLossPct', 'moisturePct', 'waterActivity']) {
      const fd = fieldByKey[k];
      if (fd && (!fd.showIf || fd.showIf(f))) items.push([t(fd.l), copyText(fd, f[k])]);
    }
    return items.filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== '');
  }
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) { /* fall back below */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    return ok;
  }
  function closeCopyMenu() {
    if (!copyAnchor) return false;
    copyMenu.classList.remove('on');
    copyAnchor.classList.remove('on');
    copyAnchor = null;
    return true;
  }
  function toggleCopyMenu(anchor, r) {
    const same = copyAnchor === anchor;
    closeCopyMenu();
    if (same || !r) return;
    const items = copyItems(r);
    copyMenu.innerHTML = items.map(([k, v], i) =>
      `<button type="button" role="menuitem" data-i="${i}"><span class="ck">${esc(k)}</span><span class="cv">${esc(v)}</span></button>`).join('');
    copyMenu.querySelectorAll('button').forEach((b) => {
      b.onclick = async (e) => {
        e.stopPropagation();
        const ok = await writeClipboard(String(items[b.dataset.i][1]));
        const ck = b.querySelector('.ck');
        ck.textContent = ok ? t(L.copied) : t(L.copyFail);
        if (ok) b.classList.add('done');
        setTimeout(closeCopyMenu, ok ? 600 : 1500);
      };
    });
    copyAnchor = anchor;
    anchor.classList.add('on');
    copyMenu.classList.add('on');
    const a = anchor.getBoundingClientRect(), m = copyMenu.getBoundingClientRect();
    const left = Math.max(12, Math.min(a.left, window.innerWidth - m.width - 12));
    let top = a.bottom + 4;
    if (top + m.height > window.innerHeight - 12) top = Math.max(12, a.top - m.height - 4);
    copyMenu.style.left = `${left}px`;
    copyMenu.style.top = `${top}px`;
    const first = copyMenu.querySelector('button');
    if (first) first.focus({ preventScroll: true });
  }
  document.addEventListener('click', (e) => { if (copyAnchor && !copyMenu.contains(e.target)) closeCopyMenu(); });
  window.addEventListener('scroll', (e) => { if (e.target !== copyMenu) closeCopyMenu(); }, true);
  window.addEventListener('resize', closeCopyMenu);

  // ── Detail sheet ───────────────────────────────────────────────────────────
  const bg = document.getElementById('detail-bg');
  const detail = document.getElementById('detail');
  bg.addEventListener('click', (e) => { if (e.target === bg) closeDetail(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !closeCopyMenu()) closeDetail(); });

  function fieldHtml(f, r) {
    const v = f.projectPicker && val(r, f.k) ? val(r, 'projectName') || val(r, f.k) : val(r, f.k);
    if (f.showIf && !f.showIf(r.fields || {})) return '';
    if (f.t === 'lineitems') {
      const items = Array.isArray(v) ? v : [];
      if (!items.length) return `<div class="d-row"><div class="k">${esc(t(f.l))}</div><div class="v">—</div></div>`;
      return `<div class="d-row" style="grid-template-columns:1fr"><div class="k">${esc(t(f.l))}</div>
        <div style="overflow-x:auto"><table class="d-table"><thead><tr>${f.cols.map((c) => `<th>${esc(t(c.l))}</th>`).join('')}</tr></thead>
        <tbody>${items.map((it, i) => `<tr>${f.cols.map((c) => `<td>${esc(c.t === 'rownum' ? i + 1 : display(c, it[c.k]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    }
    if (f.t === 'photo') {
      const ok = typeof v === 'string' && /^https?:\/\//.test(v);
      return `<div class="d-row"><div class="k">${esc(t(f.l))}</div><div class="v">${ok ? `<a href="${esc(v)}" target="_blank" rel="noopener"><img class="d-photo" src="${esc(v)}" alt=""></a>` : '—'}</div></div>`;
    }
    return `<div class="d-row ${f.t === 'calc' ? 'hl' : ''}"><div class="k">${esc(t(f.l))}</div><div class="v">${esc(display(f, v))}</div></div>`;
  }

  // The Bucking forms on this package: date, starting dry lb, bucked flower,
  // what was left on stem.
  function buckingHtml(r) {
    const s = buckState(r);
    if (!s) return '';
    const hd = `<div class="d-section"><div class="d-section-hd">${t(L.buckHd)}</div>`;
    if (!s.recs.length) return `${hd}<div class="muted-note">${s.open ? t(L.pBucking) + ' (' + t(L.buckOpen) + ')' : t(L.buckNone)}</div></div>`;
    const recs = [...s.recs].sort((a, b) => String(a.submittedAt || '').localeCompare(String(b.submittedAt || '')));
    const n = (x) => Number.isFinite(Number(x)) && x !== null && x !== '' ? fmtNum(x, 2) : '—';
    return `${hd}<div style="overflow-x:auto"><table class="d-table"><thead><tr><th>${t(L.date)}</th><th>UID</th><th>${t(L.buckStart)}</th><th>${t(L.buckFlower)}</th><th>${t(L.buckLeft)}</th></tr></thead>
      <tbody>${recs.map((b) => `<tr><td>${esc(fmtDate(b.date))}</td><td>${esc(b.sourceUid || '—')}</td><td>${n(b.startingDryLb)}</td><td>${n(b.buckedFlowerLb)}</td><td>${buckLeftLb(b) > 0 ? n(b.dryLeftLb) : '—'}</td></tr>`).join('')}</tbody></table></div>
      ${s.open ? `<div class="muted-note" style="margin-top:6px">${t(L.pBucking)} (${t(L.buckOpen)})</div>` : ''}</div>`;
  }

  function describePath(path) {
    if (path === '(status)') return { label: getLang() === 'es' ? 'Estado' : 'Status' };
    if (path === '(owner)') return { label: getLang() === 'es' ? 'Enviada por' : 'Submitted by' };
    const m = /^([^.[]+)(?:\[(\d+)\](?:\.(.+))?)?$/.exec(path);
    const f = m && fieldByKey[m[1]];
    if (!f) return { label: path };
    if (f.t !== 'lineitems' || m[2] === undefined) return { label: t(f.l), def: f };
    const rowLabel = `${t(f.l)} · ${t(L.rowN)} ${Number(m[2]) + 1}`;
    if (!m[3]) return { label: rowLabel, row: f };
    const col = (f.cols || []).find((c) => c.k === m[3]);
    return { label: `${rowLabel} · ${col ? t(col.l) : m[3]}`, def: col };
  }
  function changeValue(d, v) {
    if (v === null || v === undefined || v === '') return '—';
    if (d.row) return (d.row.cols || []).map((c) => display(c, v[c.k])).filter((x) => x !== '—').join(' / ') || '—';
    if (d.def && d.def.t === 'lineitems') return Array.isArray(v) ? `${v.length} × ${t(L.rowN)}` : '—';
    if (d.def) return display(d.def, v);
    return typeof v === 'object' ? JSON.stringify(v) : String(v);
  }
  const isNumeric = (d) => d.def && (d.def.t === 'number' || d.def.t === 'calc');
  const fmtWhen = (ts) => ts ? new Date(ts).toLocaleString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';

  function historyHtml(r) {
    if (!canHistory) return '';
    const hd = `<div class="d-section"><div class="d-section-hd">${t(L.history)}</div>`;
    if (historyError) return `${hd}<div class="muted-note">${t(L.histFail)}</div></div>`;
    if (r.status === 'draft' && !r._deleted) return '';
    const list = historyByForm.get(r.id) || [];
    const items = list.map((h) => {
      const act = { submitted: L.actSubmitted, edited: L.actEdited, deleted: L.actDeleted }[h.action];
      let bodyHtml = '';
      if (h.action === 'edited' && h.changes.length) {
        bodyHtml = `<div style="overflow-x:auto"><table class="d-table"><thead><tr><th>${t(L.field)}</th><th>${t(L.before)}</th><th>${t(L.after)}</th></tr></thead><tbody>${
          h.changes.map((c) => {
            const d = describePath(c.path);
            const before = d.row && c.old === null ? t(L.added) : changeValue(d, c.old);
            const after = d.row && c.new === null ? t(L.removed) : changeValue(d, c.new);
            return `<tr class="${isNumeric(d) ? 'num' : ''}"><td>${esc(d.label)}</td><td class="old">${esc(before)}</td><td class="new">${esc(after)}</td></tr>`;
          }).join('')}</tbody></table></div>`;
      }
      if (h.reason) bodyHtml += `<div class="hist-reason">${t(L.reason)}: ${esc(h.reason)}</div>`;
      return `<li><div class="hist-hd"><span class="hist-act ${h.action}">${t(act || L.actEdited)}</span><b>${esc(h.actor || '—')}</b> · ${esc(fmtWhen(h.created_at))}</div>${bodyHtml}</li>`;
    });
    const notes = [];
    if (!list.some((h) => h.action === 'submitted')) notes.push(t(L.histPre));
    if (!list.some((h) => h.action === 'edited') && !r._deleted) notes.push(t(L.histNone));
    return `${hd}${items.length ? `<ul class="hist">${items.join('')}</ul>` : ''}${
      notes.map((n) => `<div class="muted-note" style="margin-top:8px">${esc(n)}</div>`).join('')}</div>`;
  }

  function deleteHtml(r) {
    if (!canDelete || r._deleted || r.status !== 'submitted') return '';
    return `<div class="d-section">
      <button type="button" class="btn btn-danger" id="d-del">${t(L.del)}</button>
      <div class="del-box" id="d-del-box" hidden>
        <p>${esc(t(L.delWhy))}</p>
        <textarea id="d-del-why" maxlength="500"></textarea>
        <div class="row-btns">
          <button type="button" class="btn btn-danger solid" id="d-del-go">${t(L.delGo)}</button>
          <button type="button" class="btn" id="d-del-cancel">${t(L.cancel)}</button>
        </div>
        <div class="del-err" id="d-del-err"></div>
      </div>
    </div>`;
  }
  function wireDelete(r) {
    const btn = document.getElementById('d-del');
    if (!btn) return;
    const box = document.getElementById('d-del-box'), why = document.getElementById('d-del-why'), err = document.getElementById('d-del-err');
    btn.onclick = () => { box.hidden = false; btn.hidden = true; why.focus(); };
    document.getElementById('d-del-cancel').onclick = () => { box.hidden = true; btn.hidden = false; err.textContent = ''; };
    document.getElementById('d-del-go').onclick = async (e) => {
      const reason = why.value.trim();
      if (!reason) { err.textContent = t(L.delNeedWhy); why.focus(); return; }
      e.target.disabled = true; err.textContent = '';
      try {
        await callRecords({ action: 'delete', id: r.id, reason });
      } catch (ex) {
        err.textContent = `${t(L.delFail)} ${ex.message}`;
        e.target.disabled = false;
        return;
      }
      const i = rows.findIndex((x) => x.id === r.id);
      if (i >= 0) rows.splice(i, 1);
      closeDetail();
      await loadHistory();
      render();
    };
  }

  function openDetail(id) {
    const r = findRow(id);
    if (!r) return;
    closeCopyMenu();
    const url = new URL(location.href); url.searchParams.set('id', id); history.replaceState(null, '', url);
    let action = '';
    if (!r._deleted && r.status === 'submitted' && canEdit) action = `<a class="btn btn-blue" href="/ops_form.html?station=${STATION_KEY}&edit=${r.id}&from=takedowns">${t(L.edit)}</a>`;
    if (!r._deleted && r.status === 'draft' && canOpenDrafts) action = `<a class="btn btn-blue" href="/ops_form.html?station=${STATION_KEY}&draft=${r.id}">${t(L.openDraft)}</a>`;
    const f = r.fields || {};
    const subLines = [
      r.status === 'draft' ? t(L.draftNote) : `${t(L.submitted)} ${r.submitted_at ? new Date(r.submitted_at).toLocaleString() : ''} ${r.owner_user ? t(L.by) + ' ' + r.owner_user : ''}`,
      f.lastEditedBy ? `${t(L.edited)} ${f.lastEditedBy} · ${f.lastEditedAt ? new Date(f.lastEditedAt).toLocaleString() : ''}` : ''
    ].filter(Boolean);
    detail.innerHTML = `
      <div class="d-top">
        <div><div class="row-date">${esc(fmtDate(r.work_date))}</div><div class="d-title">${esc(r.strain || f.strain || '—')}</div></div>
        <div class="d-actions">${action}<button type="button" class="btn" id="d-copy" aria-haspopup="menu">${t(L.copy)}</button><button type="button" class="btn" id="d-close">${t(L.close)}</button></div>
      </div>
      <div class="d-sub">${subLines.map(esc).join('<br>')}</div>
      ${r._deleted ? `<div class="d-deleted"><b>${t(L.delBy)} ${esc(r._deleted.actor || '—')}</b> · ${esc(fmtWhen(r._deleted.at))}${
        r._deleted.reason ? `<br>${t(L.reason)}: ${esc(r._deleted.reason)}` : ''}</div>` : ''}
      <div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">${pills(r)}</div>
      ${station.fields.map((fd) => fieldHtml(fd, r)).join('')}
      ${buckingHtml(r)}
      ${historyHtml(r)}
      ${deleteHtml(r)}`;
    document.getElementById('d-close').onclick = closeDetail;
    const dCopy = document.getElementById('d-copy');
    dCopy.onclick = (e) => { e.stopPropagation(); toggleCopyMenu(dCopy, r); };
    wireDelete(r);
    bg.classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    if (!bg.classList.contains('on')) return;
    closeCopyMenu();
    bg.classList.remove('on');
    document.body.style.overflow = '';
    const url = new URL(location.href); url.searchParams.delete('id'); history.replaceState(null, '', url);
  }

  render();
  // Coming back from an edit (or a shared link) reopens that take down.
  const startId = new URLSearchParams(location.search).get('id');
  if (startId) openDetail(startId);
})();
</script>
<script src="/sw_register.js"></script>
</body>
</html>
