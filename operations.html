<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Operations Stations — 2CW</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.35;pointer-events:none;z-index:0}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);flex:1}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--green);color:#000}

    .queue{display:none;align-items:center;justify-content:space-between;gap:12px;background:rgba(212,168,67,.12);border-bottom:1px solid var(--gold);color:var(--gold);padding:10px 16px;font-family:'DM Mono',monospace;font-size:12px}
    .queue button{background:var(--gold);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-family:inherit;font-size:12px;cursor:pointer}

    main{position:relative;z-index:1;padding:36px 16px 60px;max-width:1000px;margin:0 auto}
    .header{text-align:center;margin-bottom:36px}
    .wordmark{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,6vw,52px);letter-spacing:.05em;line-height:1;
      background:linear-gradient(135deg,#fff 30%,var(--muted) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tagline{margin-top:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}

    .dept-hd{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin:32px 0 14px;display:flex;align-items:center;gap:12px}
    .dept-hd::after{content:'';flex:1;height:1px;background:var(--border)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px;transition:border-color .2s;min-height:150px;display:flex;flex-direction:column}
    .card.green:hover{border-color:var(--green)}.card.gold:hover{border-color:var(--gold)}
    .card.blue:hover{border-color:var(--blue)}.card.purple:hover{border-color:var(--purple)}
    .card.red:hover{border-color:var(--red)}
    .card-link{text-decoration:none;color:inherit;display:block;transition:transform .15s}
    .card-link:active{transform:scale(.99)}
    .card-dot{width:8px;height:8px;border-radius:50%;margin-bottom:14px}
    .green .card-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
    .gold .card-dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
    .blue .card-dot{background:var(--blue);box-shadow:0 0 8px var(--blue)}
    .purple .card-dot{background:var(--purple);box-shadow:0 0 8px var(--purple)}
    .red .card-dot{background:var(--red);box-shadow:0 0 8px var(--red)}
    .card-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em;line-height:1.05;margin-bottom:8px}
    .card-desc{font-size:.85rem;color:var(--subtext);line-height:1.55}
    .card-today{margin-top:12px;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .card-drafts{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px}
    .draft-chip{font-family:'DM Mono',monospace;font-size:.72rem;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:6px 12px;text-decoration:none;color:var(--text)}
    .draft-chip:hover{border-color:var(--gold);color:var(--gold)}
    .today-link{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-decoration:none}
    .today-link .live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}

    .dash-link{display:block;margin-top:34px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:18px;text-decoration:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
    .dash-link:hover{border-color:var(--green);color:var(--green)}
    .footer{margin-top:40px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}
    .empty{text-align:center;color:var(--subtext);padding:40px 0}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand">Operations</div>
  <a class="today-link" href="/operations_today.html" id="today-link" style="display:none"><span class="live-dot"></span><span id="today-link-txt">Today</span></a>
  <div class="lang" id="lang"></div>
</header>
<div class="queue" id="queue"></div>

<main>
  <div class="header">
    <div class="wordmark" id="wordmark">Operations</div>
    <div class="tagline" id="tagline">2CW Operations</div>
  </div>
  <div id="depts"></div>
  <div class="empty" id="empty" style="display:none"></div>
  <a class="dash-link" href="/operations_dashboard.html" id="dash-link">Operations Dashboard →</a>
  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script>
(async function () {
  mountLangToggle('lang');
  mountQueueBanner('queue');

  const L = {
    title:    { en: 'Operations', es: 'Operaciones' },
    tagline:  { en: 'Pick your station', es: 'Elija su estación' },
    dash:     { en: 'Operations Dashboard →', es: 'Panel de operaciones →' },
    today:    { en: 'Today — Live', es: 'Hoy — En vivo' },
    todayNone:{ en: 'No entries today', es: 'Sin registros hoy' },
    todayOne: { en: '1 entry today', es: '1 registro hoy' },
    todayMany:{ en: '{n} entries today', es: '{n} registros hoy' },
    yourDrafts:{ en: 'Continue —', es: 'Continuar —' },
    noAccess: { en: 'No stations are assigned to you yet. Ask your manager to turn them on.',
                es: 'Aún no tiene estaciones asignadas. Pida a su gerente que las active.' }
  };
  document.querySelector('.hdr-brand').textContent = t(L.title);
  document.getElementById('wordmark').textContent = t(L.title);
  document.getElementById('tagline').textContent = t(L.tagline);
  document.getElementById('dash-link').textContent = t(L.dash);
  document.title = `${t(L.title)} — 2CW`;

  const editAccess = JSON.parse(sessionStorage.getItem('2cw_ops_edit_access') || 'null');
  const viewAccess = JSON.parse(sessionStorage.getItem('2cw_ops_view_access') || 'null');
  const hasAny = (a) => a === 'all' || (Array.isArray(a) && a.length > 0);
  if (hasAny(editAccess) || hasAny(viewAccess)) {
    const link = document.getElementById('today-link');
    link.style.display = 'flex';
    document.getElementById('today-link-txt').textContent = t(L.today);
  }

  const visible = OPERATIONS_STATIONS.filter((s) => hasAny(editAccess) && (editAccess === 'all' || editAccess.includes(s.key)));

  if (!visible.length) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = t(L.noAccess);
    return;
  }

  // Group by department, preserving the order stations are declared in.
  const byDept = [];
  visible.forEach((s) => {
    const name = t(s.dept);
    let g = byDept.find((x) => x.name === name);
    if (!g) { g = { name, stations: [] }; byDept.push(g); }
    g.stations.push(s);
  });

  const owner = sessionStorage.getItem('2cw_user_name') || null;
  const today = new Date().toISOString().slice(0, 10);
  const counts = {};
  const myDrafts = {};
  await Promise.all(visible.map(async (s) => {
    const rows = await loadSubmitted(s.key);
    counts[s.key] = rows.filter((r) => (r.date || r.submittedAt || '').slice(0, 10) === today).length;
    myDrafts[s.key] = owner ? await listMyDrafts(s.key, owner, today) : [];
  }));

  const esc = (str) => String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  document.getElementById('depts').innerHTML = byDept.map((g) => `
    <div class="dept-hd">${g.name}</div>
    <div class="grid">
      ${g.stations.map((s) => {
        const n = counts[s.key] || 0;
        const todayLabel = n === 0 ? t(L.todayNone) : n === 1 ? t(L.todayOne) : t(L.todayMany).replace('{n}', n);
        const drafts = s.customHref ? [] : (myDrafts[s.key] || []);
        return `<div class="card ${s.color}">
          <a class="card-link" href="${s.customHref || `/ops_form.html?station=${s.key}`}">
            <div class="card-dot"></div>
            <div class="card-title">${t(s.title)}</div>
            <div class="card-desc">${t(s.desc)}</div>
            <div class="card-today">${todayLabel}</div>
          </a>
          ${drafts.length ? `<div class="card-drafts">
            <span class="card-today" style="margin:0 4px 0 0">${t(L.yourDrafts)}</span>
            ${drafts.map((d) => `<a class="draft-chip" href="/ops_form.html?station=${s.key}&draft=${d.id}">${esc(d.strain || d.id.slice(0, 8))}</a>`).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>`).join('');
})();
</script>
</body>
</html>
