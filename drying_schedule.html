<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Drying Schedule — 2CW</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0c0d0f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;--border2:rgba(255,255,255,.11);
    --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;--slate:#7d8899;
    --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.3;pointer-events:none;z-index:0}
  a{color:inherit}
  .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
  .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
  .hdr-div{width:1px;height:18px;background:var(--border)}
  .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-sync{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap}

  main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 16px 80px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.03em}
  .sub{color:var(--subtext);font-size:.88rem;margin-top:2px;max-width:640px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .tile .k{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:'DM Mono',monospace;font-size:1.5rem;margin-top:4px}
  .tile .s{font-size:.75rem;color:var(--subtext);margin-top:2px}
  .tile.warn .v{color:var(--gold)} .tile.go .v{color:var(--blue)} .tile.crew .v{color:var(--green)}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.5rem .8rem;cursor:pointer}
  .seg button.on{background:var(--blue);color:#000}
  .chip{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:999px;padding:.4rem .8rem;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .chip.on{border-color:var(--blue);color:var(--blue);background:rgba(90,159,212,.1)}
  .search,.svc-filter{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.5rem .75rem;font-family:inherit;font-size:.9rem;outline:none}
  .search{flex:1;min-width:180px}
  .search:focus,.svc-filter:focus{border-color:var(--blue)}

  .btn{padding:.55rem .9rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);text-decoration:none;white-space:nowrap;display:inline-block}
  .btn:hover{border-color:var(--muted)}
  .btn-blue{background:var(--blue);color:#0c0d0f;border-color:var(--blue)}
  .btn-red{color:var(--red);border-color:rgba(239,83,80,.4)}
  .btn-sm{padding:.4rem .7rem;font-size:.62rem}
  .btn:disabled{opacity:.5;cursor:default}

  .empty,.err{color:var(--subtext);font-size:.9rem;padding:24px;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:12px}
  .err{color:var(--red)}

  /* Status colours, shared by pills and timeline bars */
  .st-requested{--c:#e8885a}
  .tl-bar.st-requested{border-style:dotted}
  .req-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(232,136,90,.1);border:1px solid rgba(232,136,90,.45);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
  .req-banner b{color:#e8885a}
  .req-note{background:rgba(232,136,90,.1);border:1px solid rgba(232,136,90,.45);border-radius:10px;padding:10px 12px;font-size:.84rem;color:var(--subtext);margin-bottom:12px;line-height:1.45}
  .top-btns{display:flex;gap:8px;flex-wrap:wrap}
  .st-tentative{--c:var(--gold)} .st-confirmed{--c:var(--blue)} .st-receiving{--c:var(--purple)}
  .st-complete{--c:var(--green)} .st-cancelled{--c:var(--slate)}
  .pill{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c,var(--border)) 45%,transparent);color:var(--c,var(--subtext));white-space:nowrap}
  .tag{display:inline-block;font-size:.68rem;padding:1px 6px;margin:0 3px 3px 0;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--subtext);white-space:nowrap}

  /* Timeline */
  .tl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
  .tl{min-width:860px;font-size:.8rem}
  .tl-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--border)}
  .tl-row:last-child{border-bottom:none}
  .tl-lbl{padding:8px 12px;border-right:1px solid var(--border);position:sticky;left:0;background:var(--surface);z-index:2;min-width:0}
  .tl-lbl .f{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-lbl .l{font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-track{position:relative;min-height:44px}
  .tl-track.sup{min-height:58px}
  .tl-grid{position:absolute;inset:0;display:flex;pointer-events:none}
  .tl-grid div{flex:1;border-left:1px solid rgba(255,255,255,.04)}
  .tl-grid div.mo{border-left-color:rgba(255,255,255,.14)}
  .tl-head .tl-track{display:flex;min-height:38px}
  .tl-head .wk{flex:1;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);padding:6px 0 0 4px;border-left:1px solid rgba(255,255,255,.04);overflow:hidden;white-space:nowrap}
  .tl-head .wk.mo{border-left-color:rgba(255,255,255,.14);color:var(--subtext)}
  .tl-head .wk b{display:block;font-weight:500;color:var(--text);text-transform:uppercase;letter-spacing:.06em}
  .tl-head .tl-lbl{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:flex-end}
  .tl-bar{position:absolute;top:8px;height:28px;border-radius:6px;background:color-mix(in srgb,var(--c) 28%,transparent);border:1px solid var(--c);color:var(--text);font-family:'DM Mono',monospace;font-size:.66rem;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:6px}
  .tl-bar:hover{background:color-mix(in srgb,var(--c) 45%,transparent)}
  .tl-bar.st-tentative{border-style:dashed}
  .tl-sup{position:absolute;top:40px;height:13px;border-radius:3px;background:rgba(61,184,122,.25);border:1px solid var(--green);color:var(--green);font-family:'DM Mono',monospace;font-size:.56rem;line-height:11px;padding:0 4px;white-space:nowrap;overflow:hidden;min-width:6px;cursor:pointer}
  .tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.7;z-index:1;pointer-events:none}
  .tl-click{cursor:pointer}
  .tl-click:hover .tl-lbl{background:var(--surface2)}
  .tl-load .tl-lbl{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tl-load .tl-track{display:flex;align-items:flex-end;min-height:70px}
  .tl-load .cell{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;padding:4px 1px 0;gap:2px;font-family:'DM Mono',monospace;font-size:.56rem;color:var(--subtext)}
  .tl-load .cell i{display:block;width:70%;background:var(--blue);border-radius:3px 3px 0 0;opacity:.75}
  .tl-load .cell.peak i{background:var(--gold);opacity:1}
  .tl-load.crew .cell i{background:var(--green)}
  .tl-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.75rem;color:var(--subtext)}
  .tl-legend span::before{content:'';display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 28%,transparent)}
  .tl-legend .lg-tentative::before{border-style:dashed}
  .unsched{margin-top:12px;font-size:.82rem;color:var(--subtext);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .unsched .chip{text-transform:none;letter-spacing:0;font-family:inherit;font-size:.8rem}

  /* Table */
  .tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:1050px}
  th{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
  th:hover{color:var(--subtext)}
  th.num,td.num{text-align:right}
  th .arr{color:var(--blue)}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--surface2)}
  td .f{font-weight:600}
  td .m{font-size:.75rem;color:var(--muted)}
  td.mono,.mono{font-family:'DM Mono',monospace;font-size:.78rem}
  td .win{white-space:nowrap}
  tfoot td{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--subtext);border-top:1px solid var(--border2);border-bottom:none}

  /* Editor */
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;overflow-y:auto;padding:24px 16px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:620px;margin:3vh auto;padding:20px}
  .modal h2{font-size:1.1rem;margin-bottom:14px}
  .sect{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:6px 0 10px;padding-top:10px;border-top:1px solid var(--border)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  label.lbl{display:block;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .fld{margin-bottom:12px}
  .hint{font-size:.74rem;color:var(--muted);margin-top:4px}
  .modal input,.modal select,.modal textarea{width:100%;background:#0c0d0f;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.6rem .7rem;font-family:inherit;font-size:.92rem;outline:none}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--blue)}
  .wins{margin-bottom:8px}
  .win-row{display:grid;grid-template-columns:1.4fr .7fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
  .win-hd{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .win-end{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--subtext);min-width:62px;white-space:nowrap}
  .win-x{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:1rem;line-height:1}
  .win-x:hover{color:var(--red);border-color:rgba(239,83,80,.4)}
  .svc-grp{margin-bottom:10px}
  .svc-grp .gh{font-size:.72rem;color:var(--subtext);font-weight:600;margin-bottom:4px}
  .svc{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;padding:3px 0;cursor:pointer}
  .svc input{width:auto;margin-top:3px;accent-color:var(--blue)}
  .svc .rate{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-left:4px}
  .svc-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .support{background:rgba(61,184,122,.06);border:1px solid rgba(61,184,122,.3);border-radius:10px;padding:10px 12px;margin:4px 0 12px}
  .support .win-row{grid-template-columns:1.4fr .7fr .8fr auto auto}
  .total-hint{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--subtext);margin:-2px 0 10px}
  .m-err{color:var(--red);font-size:.85rem;margin-bottom:10px;display:none}
  .m-actions{display:flex;gap:8px;margin-top:6px;align-items:center}
  .m-actions .sp{flex:1}
  @media (max-width:560px){ .row2,.row3,.svc-cols{grid-template-columns:1fr} .hdr-sync{display:none} .win-row,.support .win-row{grid-template-columns:minmax(0,1.25fr) minmax(0,.55fr) minmax(0,1fr) auto} .win-end{display:none} .modal .win-row input{padding:.55rem .4rem;font-size:.85rem} }
</style>
</head>
<body>
<div class="hdr">
  <a class="hdr-back" href="/index.html">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand">Drying Schedule</div>
  <div class="hdr-sync" id="sync"></div>
</div>

<main>
  <div class="top">
    <div>
      <h1>Drying Schedule — Clients</h1>
      <div class="sub">Outside farms we dry for. Add the farm and its license, its harvest dates and rough wet weight, the services it wants, and any farm-support crew — then watch the weekly load.</div>
    </div>
    <div class="top-btns">
      <button class="btn" id="copy-link" onclick="copyFormLink()" title="A blank request form clients can fill out — no PIN needed">Copy client form link</button>
      <button class="btn btn-blue" onclick="openEditor()">+ Add client</button>
    </div>
  </div>

  <div id="req-banner"></div>
  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <div class="seg" id="views">
      <button data-v="timeline" class="on">Timeline</button>
      <button data-v="table">Table</button>
    </div>
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    <select class="svc-filter" id="svc-filter"></select>
    <input class="search" id="search" type="search" placeholder="Search farm, license, strain, contact…"/>
  </div>

  <div id="out"><div class="empty">Loading…</div></div>
</main>

<div class="backdrop" id="backdrop">
  <div class="modal" id="modal"></div>
</div>

<script src="/config/supabase_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/drying_services.js"></script>
<script>
// One row per client per season, in the drying_intakes table (see
// supabase/schema.sql): farm details, a list of harvest windows, the
// services they want, and farm-support windows. Everything here is an
// estimate the office types in; actual weights still come in through the
// Harvest Intake — Wet form.
const REFRESH_MS = 2 * 60 * 1000;

// 'requested' rows come from the client form (drying_request.html via the
// drying-request function). They stay out of the active totals and weekly
// load until someone reviews them and moves them to tentative/confirmed.
const STATUSES = [
  { v: 'requested', l: 'Requested' },
  { v: 'tentative', l: 'Tentative' },
  { v: 'confirmed', l: 'Confirmed' },
  { v: 'receiving', l: 'Receiving' },
  { v: 'complete', l: 'Complete' },
  { v: 'cancelled', l: 'Cancelled' }
];
const STATUS_LABEL = Object.fromEntries(STATUSES.map((s) => [s.v, s.l]));
const ACTIVE = ['tentative', 'confirmed', 'receiving'];
const FILTERS = [
  { v: 'active', l: 'Active' }, ...STATUSES.filter((s) => s.v !== 'cancelled'), { v: 'all', l: 'All' }
];
const FORM_URL = location.origin + '/drying_request.html';
const UNITS = ['sq ft', 'acres', 'plants'];

// Services and rates live in drying_services.js, shared with the client
// request form (drying_request.html).
const SERVICES = DRYING_SERVICES;
const SVC = Object.fromEntries(SERVICES.flatMap((g) => g.items).map((s) => [s.k, s]));

const currentUser = (sessionStorage.getItem('2cw_user_name') || '').trim();
if (!sessionStorage.getItem('2cw_pin')) location.replace('/index.html');

let client = null;
if (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL) client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let rows = [];
let view = localGet('drying_view') || 'timeline';
let filter = 'active';
let svcFilter = '';
let sort = { key: 'est_start', dir: 1 };
let editingId = undefined;   // undefined = editor closed, null = new row

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } }

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (x) => { const n = parseFloat(x); return Number.isFinite(n) ? n : 0; };
const fmtN = (n) => Math.round(n).toLocaleString('en-US');
const fmtK = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : fmtN(n));

// Dates as whole day numbers (UTC) so spans and week buckets never drift
// across a DST change.
const DAY = 864e5;
const dayNum = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const dayStr = (n) => new Date(n * DAY).toISOString().slice(0, 10);
const todayNum = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY; };
const mondayOf = (n) => n - ((new Date(n * DAY).getUTCDay() + 6) % 7);
const fmtDate = (s, year) => s ? new Date(dayNum(s) * DAY).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}) }) : '';
const fmtDay = (n, year) => fmtDate(dayStr(n), year);

// A window is { start, days } — "Oct 7 for 3 days". Blank days means 1.
function winSpan(w) {
  if (!w || !w.start) return null;
  const days = Math.max(1, Math.round(num(w.days)) || 1);
  const a = dayNum(w.start);
  return { a, b: a + days - 1, days };
}
const fmtWin = (sp) => sp.days > 1 ? `${fmtDay(sp.a)}–${fmtDay(sp.b)}` : fmtDay(sp.a);

const harvestsOf = (r) => Array.isArray(r.harvests) ? r.harvests : [];
const supportOf = (r) => Array.isArray(r.farm_support) ? r.farm_support : [];
const servicesOf = (r) => Array.isArray(r.services) ? r.services : [];

// Each dated harvest window with the wet lbs expected in it. A window with
// its own lb keeps it; whatever's left of the client's total is shared by
// the windows without one, in proportion to their days.
function harvestLoads(r) {
  const wins = harvestsOf(r).map((h) => { const sp = winSpan(h); return sp && { ...sp, lb: h.lb == null || h.lb === '' ? null : num(h.lb) }; }).filter(Boolean);
  const given = wins.reduce((a, w) => a + (w.lb ?? 0), 0);
  const blanks = wins.filter((w) => w.lb === null);
  const rest = Math.max(0, num(r.est_wet_lb) - given);
  const blankDays = blanks.reduce((a, w) => a + w.days, 0);
  return wins.map((w) => ({ ...w, lb: w.lb ?? (blankDays ? rest * w.days / blankDays : 0) }));
}
const supportSpans = (r) => supportOf(r).map((s) => { const sp = winSpan(s); return sp && { ...sp, people: Math.round(num(s.people)) }; }).filter(Boolean);
const totalLb = (r) => num(r.est_wet_lb) || harvestLoads(r).reduce((a, w) => a + w.lb, 0);
const harvestDays = (r) => harvestLoads(r).reduce((a, w) => a + w.days, 0);

// ── Load ─────────────────────────────────────────────────────────────────
async function refresh() {
  if (!client) { document.getElementById('out').innerHTML = '<div class="err">Supabase is not configured.</div>'; return; }
  const { data, error } = await client.from('drying_intakes').select('*').order('est_start', { ascending: true, nullsFirst: false });
  if (error) {
    document.getElementById('out').innerHTML = `<div class="err">Could not load the schedule — has supabase/schema.sql been re-run? (${esc(error.message)})</div>`;
    return;
  }
  rows = data || [];
  document.getElementById('sync').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  render();
}

// ── Render ───────────────────────────────────────────────────────────────
function shownRows() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return rows.filter((r) => {
    if (filter === 'active' && !ACTIVE.includes(r.status)) return false;
    if (filter !== 'active' && filter !== 'all' && r.status !== filter) return false;
    if (svcFilter && !servicesOf(r).includes(svcFilter)) return false;
    if (!q) return true;
    return [r.farm_name, r.license_number, r.strains, r.contact_name, r.contact_email, r.notes,
      ...servicesOf(r).map((k) => SVC[k] ? SVC[k].l : k)].join(' ').toLowerCase().includes(q);
  });
}

// Estimated wet lbs landing in each week, each window's lbs spread evenly
// over its days. Map(mondayDayNum -> lbs).
function weeklyLoad(list) {
  const out = new Map();
  list.forEach((r) => harvestLoads(r).forEach((w) => {
    if (!w.lb) return;
    for (let d = w.a; d <= w.b; d++) out.set(mondayOf(d), (out.get(mondayOf(d)) || 0) + w.lb / w.days);
  }));
  return out;
}

// Farm-support people needed on each day, summed across clients.
// Map(dayNum -> people).
function crewByDay(list) {
  const out = new Map();
  list.forEach((r) => supportSpans(r).forEach((s) => {
    for (let d = s.a; d <= s.b; d++) out.set(d, (out.get(d) || 0) + s.people);
  }));
  return out;
}

// Counts toward weekly load and totals: not cancelled, and not an
// unreviewed client request.
const isLive = (r) => r.status !== 'cancelled' && r.status !== 'requested';

function render() {
  renderTiles();
  const reqs = rows.filter((r) => r.status === 'requested').length;
  document.getElementById('req-banner').innerHTML = reqs && filter !== 'requested'
    ? `<div class="req-banner"><span><b>${reqs} new request${reqs === 1 ? '' : 's'}</b> from the client form — not on the schedule until you review ${reqs === 1 ? 'it' : 'them'}.</span><button class="btn btn-sm" onclick="setFilter('requested')">Review</button></div>`
    : '';
  document.querySelectorAll('#views button').forEach((b) => b.classList.toggle('on', b.dataset.v === view));
  document.getElementById('chips').innerHTML = FILTERS.map((f) =>
    `<button class="chip ${f.v === filter ? 'on' : ''}" onclick="setFilter('${f.v}')">${f.l}</button>`).join('');
  const list = shownRows();
  const out = document.getElementById('out');
  if (!rows.length) { out.innerHTML = '<div class="empty">No clients yet — use <b>+ Add client</b> to put the first farm on the schedule.</div>'; return; }
  if (!list.length) { out.innerHTML = '<div class="empty">Nothing matches this filter.</div>'; return; }
  out.innerHTML = view === 'table' ? tableHtml(list) : timelineHtml(list);
}

function renderTiles() {
  const active = rows.filter((r) => ACTIVE.includes(r.status));
  const t0 = todayNum();
  const next30 = active.reduce((a, r) => a + harvestLoads(r).reduce((s, w) => {
    const overlap = Math.min(w.b, t0 + 29) - Math.max(w.a, t0) + 1;
    return s + (overlap > 0 ? w.lb / w.days * overlap : 0);
  }, 0), 0);
  let peak = null;
  weeklyLoad(active).forEach((lb, wk) => { if (wk >= mondayOf(t0) && (!peak || lb > peak.lb)) peak = { wk, lb }; });
  let crew = null;
  crewByDay(active).forEach((p, d) => { if (d >= t0 && d < t0 + 30 && (!crew || p > crew.p)) crew = { d, p }; });
  const unsched = active.filter((r) => !harvestLoads(r).length).length;
  const tiles = [
    { k: 'Active clients', v: active.length, s: `${active.reduce((a, r) => a + harvestLoads(r).length, 0)} harvest dates` },
    { k: 'Est. wet lbs (active)', v: fmtN(active.reduce((a, r) => a + totalLb(r), 0)), cls: 'go' },
    { k: 'Next 30 days', v: fmtN(next30), s: 'est. wet lbs arriving' },
    { k: 'Busiest week ahead', v: peak ? fmtN(peak.lb) : '—', s: peak ? `wk of ${fmtDay(peak.wk)}` : '' },
    { k: 'Farm crew, next 30 days', v: crew ? crew.p : '—', cls: 'crew', s: crew ? `people at peak, ${fmtDay(crew.d)}` : 'no farm support booked' },
    { k: 'No dates yet', v: unsched, cls: unsched ? 'warn' : '' }
  ];
  document.getElementById('tiles').innerHTML = tiles.map((t) =>
    `<div class="tile ${t.cls || ''}"><div class="k">${t.k}</div><div class="v">${t.v}</div>${t.s ? `<div class="s">${esc(t.s)}</div>` : ''}</div>`).join('');
}

function timelineHtml(list) {
  const dated = list.filter((r) => harvestLoads(r).length || supportSpans(r).length);
  const undated = list.filter((r) => !harvestLoads(r).length);
  let html = '';
  if (dated.length) {
    // Range: from the earlier of this week / the first window, to a week past
    // the last one — capped at a year so one stray date can't squash the view.
    const t0 = todayNum();
    const spans = dated.flatMap((r) => [...harvestLoads(r), ...supportSpans(r)]);
    const first = Math.min(mondayOf(t0), ...spans.map((s) => mondayOf(s.a)));
    let last = Math.max(mondayOf(t0) + 7 * 4, ...spans.map((s) => mondayOf(s.b) + 7));
    last = Math.min(last, first + 7 * 52);
    const weeks = [];
    for (let w = first; w < last; w += 7) weeks.push(w);
    const total = weeks.length * 7;
    const pct = (d) => ((d - first) / total * 100);
    const clip = (s) => { const a = Math.max(s.a, first), b = Math.min(s.b, last - 1); return b < a ? null : `left:${pct(a)}%;width:${pct(b + 1) - pct(a)}%`; };
    const isMonthStart = (w, i) => i === 0 || new Date(w * DAY).getUTCMonth() !== new Date((w - 7) * DAY).getUTCMonth();
    const grid = `<div class="tl-grid">${weeks.map((w, i) => `<div class="${isMonthStart(w, i) ? 'mo' : ''}"></div>`).join('')}</div>`;
    const todayLine = t0 >= first && t0 < last ? `<div class="tl-today" style="left:${pct(t0 + 0.5)}%" title="Today"></div>` : '';

    const head = `<div class="tl-row tl-head"><div class="tl-lbl">Farm / license</div><div class="tl-track">${weeks.map((w, i) => {
      const d = new Date(w * DAY);
      const mo = isMonthStart(w, i);
      return `<div class="wk ${mo ? 'mo' : ''}">${mo ? `<b>${d.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short' })}</b>` : '<b>&nbsp;</b>'}${d.getUTCDate()}</div>`;
    }).join('')}</div></div>`;

    const firstDay = (r) => Math.min(...[...harvestLoads(r), ...supportSpans(r)].map((s) => s.a));
    const sorted = dated.slice().sort((x, y) => firstDay(x) - firstDay(y) || x.farm_name.localeCompare(y.farm_name));
    const body = sorted.map((r) => {
      const sup = supportSpans(r);
      const bars = harvestLoads(r).map((w) => {
        const st = clip(w);
        return st ? `<div class="tl-bar st-${esc(r.status)}" style="${st}" title="${esc(`${r.farm_name} — harvest ${fmtWin(w)} (${w.days} day${w.days > 1 ? 's' : ''})${w.lb ? ` · ~${fmtN(w.lb)} lb wet` : ''} · ${STATUS_LABEL[r.status] || r.status}`)}">${w.lb ? fmtK(w.lb) + ' lb' : ''}</div>` : '';
      }).join('');
      const supBars = sup.map((s) => {
        const st = clip(s);
        return st ? `<div class="tl-sup" style="${st}" title="${esc(`${r.farm_name} — farm support ${fmtWin(s)}, ${s.people} ${s.people === 1 ? 'person' : 'people'}`)}">${s.people} ppl</div>` : '';
      }).join('');
      return `<div class="tl-row tl-click" onclick="openEditor('${r.id}')">
        <div class="tl-lbl"><div class="f">${esc(r.farm_name)}</div><div class="l">${esc(r.license_number || 'no license #')}</div></div>
        <div class="tl-track ${sup.length ? 'sup' : ''}">${grid}${todayLine}${bars}${supBars}</div></div>`;
    }).join('');

    const live = dated.filter(isLive);
    const load = weeklyLoad(live);
    const max = Math.max(1, ...weeks.map((w) => load.get(w) || 0));
    const loadRow = `<div class="tl-row tl-load"><div class="tl-lbl">Est. wet lb / week</div><div class="tl-track">${weeks.map((w) => {
      const lb = load.get(w) || 0;
      return `<div class="cell ${lb && lb === max ? 'peak' : ''}" title="Week of ${fmtDay(w)}: ${fmtN(lb)} lb">${lb ? `<span>${fmtK(lb)}</span>` : ''}<i style="height:${Math.round(lb / max * 40)}px"></i></div>`;
    }).join('')}</div></div>`;

    // Peak farm-support crew on any one day of the week.
    const crew = crewByDay(live);
    let crewRow = '';
    if (crew.size) {
      const wkPeak = weeks.map((w) => Math.max(0, ...[0, 1, 2, 3, 4, 5, 6].map((i) => crew.get(w + i) || 0)));
      const cmax = Math.max(1, ...wkPeak);
      crewRow = `<div class="tl-row tl-load crew"><div class="tl-lbl">Farm crew (peak / day)</div><div class="tl-track">${wkPeak.map((p, i) =>
        `<div class="cell" title="Week of ${fmtDay(weeks[i])}: up to ${p} people on one day">${p ? `<span>${p}</span>` : ''}<i style="height:${Math.round(p / cmax * 40)}px"></i></div>`).join('')}</div></div>`;
    }

    html += `<div class="tl-wrap"><div class="tl">${head}${body}${loadRow}${crewRow}</div></div>
      <div class="tl-legend">${STATUSES.filter((s) => s.v !== 'cancelled').map((s) => `<span class="st-${s.v} lg-${s.v}">${s.l} harvest</span>`).join('')}<span style="--c:var(--green)">Farm support crew</span></div>`;
  }
  if (undated.length) {
    html += `<div class="unsched">${dated.length ? 'No harvest dates yet:' : 'None of these have harvest dates yet:'} ${undated.map((r) =>
      `<button class="chip" onclick="openEditor('${r.id}')">${esc(r.farm_name)}${totalLb(r) ? ` · ${fmtN(totalLb(r))} lb` : ''}</button>`).join('')}</div>`;
  }
  return html;
}

const COLS = [
  { key: 'farm_name', l: 'Farm / license' },
  { key: 'farm_size', l: 'Farm size', num: true },
  { key: 'est_start', l: 'Harvest dates' },
  { key: 'days', l: 'Days', num: true },
  { key: 'est_wet_lb', l: 'Est. wet lbs', num: true },
  { key: 'services', l: 'Services' },
  { key: 'support', l: 'Farm support' },
  { key: 'status', l: 'Status' },
  { key: 'contact_name', l: 'Contact' }
];

function sortVal(r, key) {
  if (key === 'days') return harvestDays(r) || null;
  if (key === 'est_wet_lb') return totalLb(r) || null;
  if (key === 'est_start') { const h = harvestLoads(r); return h.length ? Math.min(...h.map((w) => w.a)) : null; }
  if (key === 'services') return servicesOf(r).length || null;
  if (key === 'support') { const s = supportSpans(r); return s.length ? Math.min(...s.map((w) => w.a)) : null; }
  if (key === 'status') return STATUSES.findIndex((s) => s.v === r.status);
  const v = r[key];
  return v === '' || v == null ? null : (typeof v === 'string' ? v.toLowerCase() : Number(v));
}

function tableHtml(list) {
  const sorted = list.slice().sort((x, y) => {
    const a = sortVal(x, sort.key), b = sortVal(y, sort.key);
    if (a === null && b === null) return 0;
    if (a === null) return 1;        // blanks always last
    if (b === null) return -1;
    return (a < b ? -1 : a > b ? 1 : 0) * sort.dir;
  });
  const live = list.filter(isLive);
  return `<div class="tbl-wrap"><table>
    <thead><tr>${COLS.map((c) => `<th class="${c.num ? 'num' : ''}" onclick="setSort('${c.key}')">${c.l}${sort.key === c.key ? ` <span class="arr">${sort.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead>
    <tbody>${sorted.map((r) => {
      const hv = harvestLoads(r);
      const sup = supportSpans(r);
      const lb = totalLb(r);
      const svc = servicesOf(r);
      return `<tr onclick="openEditor('${r.id}')">
        <td><div class="f">${esc(r.farm_name)}</div><div class="m">${esc(r.license_number || '—')}</div>${r.strains ? `<div class="m">${esc(r.strains)}</div>` : ''}</td>
        <td class="num mono">${r.farm_size != null ? `${Number(r.farm_size).toLocaleString('en-US', { maximumFractionDigits: 2 })} ${esc(r.farm_size_unit || '')}` : '—'}</td>
        <td class="mono">${hv.length ? hv.map((w) => `<div class="win">${fmtWin(w)} <span class="m">(${w.days}d${w.lb ? ` · ${fmtK(w.lb)}` : ''})</span></div>`).join('') : '—'}</td>
        <td class="num mono">${hv.length ? harvestDays(r) : '—'}</td>
        <td class="num mono">${lb ? fmtN(lb) : '—'}</td>
        <td>${svc.length ? svc.map((k) => `<span class="tag">${esc(SVC[k] ? SVC[k].short : k)}</span>`).join('') : '—'}</td>
        <td class="mono">${sup.length ? sup.map((s) => `<div class="win">${fmtWin(s)} <span class="m">· ${s.people} ppl</span></div>`).join('') : (svc.includes('farm_labor') ? '<span class="m">dates TBD</span>' : '—')}</td>
        <td><span class="pill st-${esc(r.status)}">${esc(STATUS_LABEL[r.status] || r.status)}</span></td>
        <td>${esc(r.contact_name || '—')}${r.contact_phone ? `<div class="m">${esc(r.contact_phone)}</div>` : ''}${r.contact_email ? `<div class="m">${esc(r.contact_email)}</div>` : ''}</td>
      </tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td colspan="3">${list.length} client${list.length === 1 ? '' : 's'}</td><td class="num">${live.reduce((a, r) => a + harvestDays(r), 0)}</td><td class="num">${fmtN(live.reduce((a, r) => a + totalLb(r), 0))}</td><td colspan="4"></td></tr></tfoot>
  </table></div>`;
}

function setSort(k) { sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: 1 }; render(); }

function lastForFarm(name) {

// One editable window row. kind 'h' = harvest (start, days, lbs),
// 's' = farm support (start, days, people).
function winRowHtml(kind, w = {}) {
  const third = kind === 'h'
    ? `<input class="w-lb" type="number" min="0" step="any" inputmode="decimal" placeholder="wet lbs" value="${esc(w.lb ?? '')}"/>`
    : `<input class="w-people" type="number" min="1" step="1" inputmode="numeric" placeholder="people" value="${esc(w.people ?? '')}"/>`;
  return `<div class="win-row">
    <input class="w-start" type="date" value="${esc(w.start || '')}"/>
    <input class="w-days" type="number" min="1" step="1" inputmode="numeric" placeholder="days" value="${esc(w.days ?? '')}"/>
    ${third}
    <span class="win-end"></span>
    <button type="button" class="win-x" title="Remove" onclick="this.parentElement.remove(); updateTotals()">×</button>
  </div>`;
}
function addWin(kind) {
  const box = document.getElementById(kind === 'h' ? 'e-harv' : 'e-sup');
  box.insertAdjacentHTML('beforeend', winRowHtml(kind));
  box.lastElementChild.querySelector('.w-start').focus();
}

// Live "→ Oct 9" end dates and the harvest lbs subtotal.
function updateTotals() {
  document.querySelectorAll('#modal .wins .win-row').forEach((row) => {
    const sp = winSpan({ start: row.querySelector('.w-start').value, days: row.querySelector('.w-days').value });
    row.querySelector('.win-end').textContent = sp && sp.days > 1 ? '→ ' + fmtDay(sp.b) : '';
  });
  const lbs = [...document.querySelectorAll('#e-harv .w-lb')].map((i) => i.value.trim()).filter(Boolean).map(Number);
  const hint = document.getElementById('e-lb-hint');
  const total = document.getElementById('e-lb');
  if (!hint) return;
  const sum = lbs.reduce((a, b) => a + b, 0);
  total.placeholder = sum ? fmtN(sum) : '';
  hint.textContent = !lbs.length ? 'Leave per-date lbs blank to split the total across the harvest dates by days.'
    : total.value.trim() === '' ? `Total = ${fmtN(sum)} lbs from the harvest dates.`
    : Number(total.value) < sum ? `Harvest dates add up to ${fmtN(sum)} lbs — more than the total.`
    : `Harvest dates account for ${fmtN(sum)} of ${fmtN(Number(total.value))} lbs; the rest is split across dates left blank.`;
}

    <div class="svc-cols" id="e-svc">${SERVICES.map((g) => `<div class="svc-grp"><div class="gh">${esc(g.group)}</div>${g.items.map((s) =>
      `<label class="svc"><input type="checkbox" value="${s.k}" ${svc.includes(s.k) ? 'checked' : ''}/><span>${esc(s.l)}<span class="rate">${esc(s.rate)}</span></span></label>`).join('')}</div>`).join('')}</div>
    <div class="support" id="e-sup-box">
      <label class="lbl">Farm support — dates &amp; crew</label>
      <div class="win-hd win-row" style="margin-bottom:4px"><span>Start</span><span>Days</span><span>People</span><span></span><span></span></div>
      <div class="wins" id="e-sup">${sup.map((s) => winRowHtml('s', s)).join('')}</div>
      <button type="button" class="btn btn-sm" onclick="addWin('s')">+ Add dates</button>
    </div>

    <div class="fld" style="margin-top:6px"><label class="lbl" for="e-notes">Notes</label><textarea id="e-notes" rows="3">${esc(r.notes || '')}</textarea></div>
    <div class="m-err" id="e-err"></div>
    <div class="m-actions">
      ${id ? '<button class="btn btn-red" onclick="deleteRow()">Delete</button>' : ''}
      <span class="sp"></span>
      <button class="btn" onclick="closeEditor()">Cancel</button>
      <button class="btn btn-blue" id="e-save" onclick="saveEditor()">Save</button>
    </div>`;
  const modal = document.getElementById('modal');
  modal.oninput = updateTotals;
  document.querySelector('#e-svc input[value="farm_labor"]').addEventListener('change', toggleSupport);
  toggleSupport();
  updateTotals();
  document.getElementById('backdrop').style.display = 'block';
  if (!id) {
    document.getElementById('e-farm').addEventListener('change', (e) => {
      const prev = lastForFarm(e.target.value);
      if (!prev) return;
      const fill = (fid, v) => { const el = document.getElementById(fid); if (!el.value && v != null) el.value = v; };
      fill('e-lic', prev.license_number); fill('e-size', prev.farm_size);
      fill('e-cname', prev.contact_name); fill('e-cphone', prev.contact_phone); fill('e-cemail', prev.contact_email);
      if (prev.farm_size_unit) document.getElementById('e-unit').value = prev.farm_size_unit;
      const prevSvc = servicesOf(prev);
      if (prevSvc.length) document.querySelectorAll('#e-svc input').forEach((c) => { c.checked = prevSvc.includes(c.value); });
      toggleSupport();
    });
  }
  if (id) loadRequestDocs(id);
  setTimeout(() => document.getElementById('e-farm').focus(), 30);
}

// The cultivation license / W-9 a client attached on the request form. They
// are in a private bucket, so this goes through customer-docs.js, which
// checks the user's 'customer documents' access.
const DOC_LABELS = { license: 'Cultivation license', w9: 'W-9' };
async function callDocs(body) {
  const res = await fetch('/.netlify/functions/customer-docs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, pin: sessionStorage.getItem('2cw_pin') })
  });
  let j; try { j = await res.json(); } catch { j = { ok: false, error: `HTTP ${res.status}` }; }
  if (!res.ok || !j.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}
async function loadRequestDocs(id) {
  const box = () => (editingId === id ? document.getElementById('e-docs') : null);
  let html;
  try {
    const { docs } = await callDocs({ action: 'request_docs', intake_id: id });
    html = docs.length
      ? docs.map((d) => `<div style="margin-bottom:4px">${esc(DOC_LABELS[d.doc_type] || d.doc_type)}: <a href="#" onclick="openRequestDoc('${d.id}');return false">${esc(d.file_name)}</a></div>`).join('')
      : '';
  } catch (e) {
    html = `<div class="hint">Couldn’t load the attached documents: ${esc(e.message)}</div>`;
  }
  const el = box();
  if (el) el.innerHTML = html ? `<label class="lbl">Documents from the request form</label>${html}` : '';
}
async function openRequestDoc(docId) {
  // Open the tab now, while it still counts as the click — a popup opened
  // after the await would be blocked.
  const win = window.open('', '_blank');
  try {
    const j = await callDocs({ action: 'request_doc_url', id: docId });
    if (win) win.location = j.url; else location.href = j.url;
  } catch (e) { if (win) win.close(); alert(e.message); }
}

function closeEditor() {
  document.getElementById('backdrop').style.display = 'none';
  editingId = undefined;
}
document.getElementById('backdrop').addEventListener('click', (e) => { if (e.target.id === 'backdrop') closeEditor(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editingId !== undefined) closeEditor(); });

function showErr(msg) { const el = document.getElementById('e-err'); el.textContent = msg; el.style.display = 'block'; return null; }

// Reads one list of window rows. Fully blank rows are skipped; anything
// half-filled without a date is an error. Returns null on error.
function readWins(boxId, kind) {
  const out = [];
  for (const row of document.querySelectorAll(`#${boxId} .win-row`)) {
    const start = row.querySelector('.w-start').value;
    const days = row.querySelector('.w-days').value.trim();
    const extra = row.querySelector(kind === 'h' ? '.w-lb' : '.w-people').value.trim();
    if (!start && !days && !extra) continue;
    const what = kind === 'h' ? 'harvest' : 'farm support';
    if (!start) return showErr(`Each ${what} row needs a start date.`);
    if (days && !(Number(days) >= 1)) return showErr(`Days must be 1 or more (${what}).`);
    if (extra && !(Number(extra) >= 0)) return showErr(`Check the ${kind === 'h' ? 'wet lbs' : 'number of people'} on the ${what} rows.`);
    const w = { start, days: days ? Math.round(Number(days)) : 1 };
    if (kind === 'h') w.lb = extra ? Number(extra) : null;
    else w.people = extra ? Math.round(Number(extra)) : null;
    out.push(w);
  }
  return out.sort((a, b) => a.start.localeCompare(b.start));
}

async function saveEditor() {
  document.getElementById('e-err').style.display = 'none';
  const val = (id) => document.getElementById(id).value.trim();
  const numOrNull = (id) => { const v = val(id); return v === '' ? null : Number(v); };
  const services = [...document.querySelectorAll('#e-svc input:checked')].map((c) => c.value);
  const harvests = readWins('e-harv', 'h');
  if (!harvests) return;
  const support = services.includes('farm_labor') ? readWins('e-sup', 's') : [];
  if (!support) return;
  if (support.some((s) => !s.people)) return showErr('Add how many people each farm support date needs.');
  const spans = harvests.map(winSpan);
  const lbSum = harvests.reduce((a, h) => a + (h.lb || 0), 0);
  const row = {
    farm_name: val('e-farm'),
    license_number: val('e-lic').toUpperCase() || null,
    farm_size: numOrNull('e-size'),
    farm_size_unit: val('e-unit'),
    contact_name: val('e-cname') || null,
    contact_phone: val('e-cphone') || null,
    contact_email: val('e-cemail') || null,
    legal_business_name: val('e-legal') || null,
    state_incorporated: val('e-state').toUpperCase() || null,
    signer_first_name: val('e-sfirst') || null,
    signer_last_name: val('e-slast') || null,
    signer_email: val('e-semail').toLowerCase() || null,
    harvests,
    services,
    farm_support: support,
    // Kept in step with the harvest dates so the table can be ordered and
    // read in SQL without unpacking the JSON.
    est_start: spans.length ? dayStr(Math.min(...spans.map((s) => s.a))) : null,
    est_end: spans.length ? dayStr(Math.max(...spans.map((s) => s.b))) : null,
    est_wet_lb: numOrNull('e-lb') ?? (lbSum || null),
    status: val('e-status'),
    strains: val('e-strains') || null,
    notes: val('e-notes') || null,
    updated_by: currentUser || null
  };
  if (!row.farm_name) return showErr('Farm name is required.');
  if ([row.farm_size, row.est_wet_lb].some((n) => n !== null && !(n >= 0))) return showErr('Sizes and weights must be positive numbers.');
  const btn = document.getElementById('e-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const q = editingId
    ? client.from('drying_intakes').update(row).eq('id', editingId)
    : client.from('drying_intakes').insert({ ...row, created_by: currentUser || null });
  const { data, error } = await q.select().single();
  if (error) { showErr('Could not save: ' + error.message); btn.disabled = false; btn.textContent = 'Save'; return; }
  rows = editingId ? rows.map((r) => (r.id === editingId ? data : r)) : rows.concat(data);
  closeEditor();
  render();
}

async function deleteRow() {
  const r = rows.find((x) => x.id === editingId);
  if (!r || !confirm(`Delete ${r.farm_name}? Use status “Cancelled” instead if you want to keep a record of it.`)) return;
  const { error } = await client.from('drying_intakes').delete().eq('id', editingId);
  if (error) return showErr('Could not delete: ' + error.message);
  rows = rows.filter((x) => x.id !== editingId);
  closeEditor();
  render();
}

// ── Boot ─────────────────────────────────────────────────────────────────
refresh();
setInterval(() => { if (editingId === undefined) refresh(); }, REFRESH_MS);
</script>
