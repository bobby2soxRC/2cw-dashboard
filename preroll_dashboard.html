<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Pre-Roll Dashboard — 2CW</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0c0d0f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;--border2:rgba(255,255,255,.11);
    --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;--slate:#7d8899;
    --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.3;pointer-events:none;z-index:0}
  a{color:inherit}
  .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
  .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
  .hdr-div{width:1px;height:18px;background:var(--border)}
  .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-sync{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap}
  .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:7px 11px;cursor:pointer}
  .lang button.on{background:var(--purple);color:#000}
  @media (max-width:560px){ .hdr-sync{display:none} }

  main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:24px 16px 80px}
  h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.03em}
  .sub{color:var(--subtext);font-size:.88rem;margin:2px 0 20px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
  .tile:hover{border-color:var(--border2)}
  .tile .k{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:'DM Mono',monospace;font-size:1.5rem;margin-top:4px}
  .tile.warn .v{color:var(--gold)} .tile.bad .v{color:var(--red)} .tile.go .v{color:var(--blue)}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
  .chip{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:999px;padding:.4rem .8rem;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .chip.on{border-color:var(--purple);color:var(--purple);background:rgba(155,127,212,.1)}
  .search{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.5rem .75rem;font-family:inherit;font-size:.9rem;outline:none}
  .search:focus{border-color:var(--purple)}

  .group{margin-bottom:22px}
  .group-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext)}
  .group-hd .n{color:var(--muted)}
  .group-hd.warn{color:var(--gold)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px 14px}
  .card.late{border-color:rgba(239,83,80,.45)}
  .card.hold{opacity:.65}
  .c-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .pr{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--purple);font-weight:500}
  .prod{font-weight:600}
  .pill{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--subtext);white-space:nowrap}
  .pill.indica{color:#a78bfa;border-color:rgba(167,139,250,.4)}
  .pill.sativa{color:var(--gold);border-color:rgba(212,168,67,.4)}
  .pill.hybrid{color:var(--green);border-color:rgba(61,184,122,.4)}
  .pill.stage-needs_strain,.pill.stage-needs_schedule{color:var(--gold);border-color:rgba(212,168,67,.4)}
  .pill.stage-in_production{color:var(--blue);border-color:rgba(90,159,212,.4)}
  .pill.stage-done{color:var(--green);border-color:rgba(61,184,122,.4)}
  .pill.late{color:var(--red);border-color:rgba(239,83,80,.45)}
  .pill.pouch{color:var(--slate);border-color:rgba(125,136,153,.5)}
  .c-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.82rem;color:var(--subtext)}
  .c-meta b{color:var(--text);font-weight:500}
  .c-meta .none{color:var(--gold)}
  .c-actions{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
  .progress{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--blue)}
  .progress.done i{background:var(--green)}
  .c-notes{grid-column:1/-1;font-size:.8rem;color:var(--muted);white-space:pre-wrap}

  .btn{padding:.5rem .85rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);text-decoration:none;white-space:nowrap;display:inline-block}
  .btn:hover{border-color:var(--muted)}
  .btn-purple{background:var(--purple);color:#0c0d0f;border-color:var(--purple)}
  .btn:disabled{opacity:.5;cursor:default}

  .sec{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.03em;margin:4px 0 2px}
  .sec-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .sec-hint{color:var(--subtext);font-size:.82rem;max-width:640px}
  .q-wrap{margin-bottom:28px}
  .q-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px 14px}
  .q-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .q-row:last-child{border-bottom:none}
  .q-n{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--purple);min-width:34px;text-align:center}
  .q-main{flex:1;min-width:0}
  .q-strain{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .q-strain .none{color:var(--gold);font-weight:500}
  .q-sub{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--subtext);overflow-wrap:anywhere;margin-top:2px}
  .q-sub .none{color:var(--gold)}
  .q-ref{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--purple);font-weight:500}
  .q-qty{font-family:'DM Mono',monospace;font-size:1rem;white-space:nowrap;text-align:right;flex:0 0 auto}
  .q-qty .k{display:block;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .q-qty .made{display:block;font-size:.68rem;color:var(--blue)}
  .q-qty .pr{display:block;font-size:.68rem;color:var(--subtext)}
  .calc{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--purple);margin:-4px 0 12px}
  .calc .none{color:var(--gold)}
  .p-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .p-row:last-of-type{border-bottom:none}
  .p-main{flex:1;min-width:0}
  .p-name{font-weight:600}
  .p-sub{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--subtext)}
  .p-sub .none{color:var(--gold)}
  .p-row.off{opacity:.5}
  .q-move{display:flex;gap:6px;flex:0 0 auto}
  .q-move button{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;min-width:44px;min-height:44px;font-size:1rem;cursor:pointer;font-family:'DM Mono',monospace}
  .q-move button:hover:not(:disabled){border-color:var(--purple);color:var(--purple)}
  .q-move button:disabled{opacity:.3;cursor:default}
  .q-acts{display:flex;gap:6px;flex:0 0 auto}
  @media (max-width:700px){
    .q-row{flex-wrap:wrap;row-gap:10px}
    .q-main{flex:1 1 calc(100% - 50px)}
    .q-qty{margin-left:46px;text-align:left}
    .q-move{margin-left:auto}
    .q-acts{flex:1 0 100%;justify-content:flex-end}
  }

  .empty,.err{color:var(--subtext);font-size:.9rem;padding:24px;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:12px}
  .err{color:var(--red)}

  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;overflow-y:auto;padding:24px 16px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:520px;margin:4vh auto;padding:20px}
  .modal h2{font-size:1.1rem;margin-bottom:2px}
  .modal .m-sub{color:var(--subtext);font-size:.82rem;margin-bottom:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.lbl{display:block;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .fld{margin-bottom:12px}
  .fld .hint{font-size:.78rem;color:var(--muted);margin:0 0 8px}
  .in-row{display:grid;grid-template-columns:1.1fr 1.4fr .8fr auto;gap:6px;margin-bottom:6px}
  .in-row .x{padding:0 10px}
  .in-tot{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);margin:2px 0 0}
  @media (max-width:560px){ .in-row{grid-template-columns:1fr 1fr} }
  .modal input,.modal select,.modal textarea{width:100%;background:#0c0d0f;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.6rem .7rem;font-family:inherit;font-size:.92rem;outline:none}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--purple)}
  .check{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--subtext);margin-bottom:12px}
  .check input{width:auto}
  .m-err{color:var(--red);font-size:.85rem;margin-bottom:10px;display:none}
  .m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  @media (max-width:560px){ .card{grid-template-columns:1fr} .c-actions{justify-content:flex-start} .row2{grid-template-columns:1fr} }

  /* Submitted runs + the run detail modal */
  .s-wrap{margin-top:30px}
  .run{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:inherit;font-family:inherit;cursor:pointer}
  .run:hover{border-color:var(--border2)}
  .run-main{flex:1;min-width:0}
  .run-title{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .run-sub{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--subtext);margin-top:3px;overflow-wrap:anywhere}
  .run-sub .none{color:var(--gold)}
  .run-n{font-family:'DM Mono',monospace;font-size:1rem;text-align:right;white-space:nowrap}
  .run-n .k{display:block;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .run-n .cost{display:block;font-size:.7rem;color:var(--green)}
  .d-note{font-size:.78rem;color:var(--subtext);margin-top:8px}
  .pill.warn{color:var(--gold);border-color:rgba(212,168,67,.4)}
  .s-more{margin-top:4px}
  .modal.wide{max-width:760px}
  .d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
  .d-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .d-head{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--border)}
  .d-row{display:grid;grid-template-columns:minmax(140px,40%) 1fr;gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.88rem}
  .d-row .k{color:var(--subtext)}
  .d-row .v{overflow-wrap:anywhere;white-space:pre-wrap}
  .d-row.hl .v{font-family:'DM Mono',monospace;color:var(--purple)}
  .d-row.flag .v{color:var(--gold)}
  .d-row.block{grid-template-columns:1fr}
  .d-tbl-wrap{overflow-x:auto}
  .d-tbl{width:100%;border-collapse:collapse;font-size:.82rem}
  .d-tbl th{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
  .d-tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  .d-tbl td.n{font-family:'DM Mono',monospace;text-align:right;white-space:nowrap}
  .d-tbl tfoot td{font-family:'DM Mono',monospace;color:var(--purple);border-bottom:none}
  .d-photo{max-width:220px;border-radius:8px;display:block}
  @media (max-width:560px){ .d-row{grid-template-columns:1fr} .run{flex-wrap:wrap} .run-n{text-align:left} }

  /* ?embed=queue — just the queue, inside the Work Orders page. */
  body.embed::before, body.embed .hdr, body.embed #h1, body.embed #intro, body.embed #tiles,
  body.embed #q-title, body.embed #r-title, body.embed #bar, body.embed #list, body.embed .s-wrap{display:none}
  body.embed main{padding:4px 0 24px;max-width:none}
</style>
</head>
<body>
<div class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Pre-Roll Dashboard</div>
  <div class="hdr-sync" id="sync"></div>
  <div class="lang" id="lang"></div>
</div>

<main>
  <h1 id="h1"></h1>
  <div class="sub" id="intro"></div>

  <div class="tiles" id="tiles"></div>

  <div class="q-wrap">
    <div class="sec-row">
      <div>
        <h2 class="sec" id="q-title"></h2>
        <div class="sec-hint" id="q-hint"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="p-open" onclick="openProducts()"></button>
        <button class="btn btn-purple" id="q-add" onclick="openItemEditor(null)"></button>
      </div>
    </div>
    <div id="queue"></div>
  </div>

  <h2 class="sec" id="r-title"></h2>
  <div class="bar" id="bar">
    <button class="chip on" data-f="open"></button>
    <button class="chip" data-f="needs"></button>
    <button class="chip" data-f="in_production"></button>
    <button class="chip" data-f="late"></button>
    <button class="chip" data-f="done"></button>
    <button class="chip" data-f="all"></button>
    <input class="search" id="search" type="search"/>
  </div>

  <div id="list"></div>

  <div class="s-wrap">
    <h2 class="sec" id="s-title"></h2>
    <div class="sec-hint" id="s-hint" style="margin-bottom:10px"></div>
    <div id="runs"></div>
  </div>
</main>

<div class="backdrop" id="backdrop">
  <div class="modal" id="modal"></div>
</div>

<script src="/config/supabase_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/hub_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/preroll_queue.js"></script>
<script>
// Requests come live from the same published Sheet tab production.html and
// inventory.html read. The team's plan for each one is the preroll_plans
// table (see supabase/schema.sql); progress comes from Pre-Roll Production
// and Ground Flower Pouches forms (operations_forms, QUEUE_STATIONS) carrying
// its prNum.
//
// The queue on top is the order to make things in, pre-rolls and ground
// flower pouches together (the same team): every open request (not on hold)
// plus batches added by hand (preroll_queue_items,
// "PQ-<queue_no>"), ranked with ▲ ▼ / Top. The order is one shared
// operations_forms row, like the bucking queue (BUCK_QUEUE_ID in ops_data.js):
// `fields.order` = refs (PR# or PQ-#). Anything not in it goes last, by
// Ready Date / when it was added. An item drops off once a Pre-Roll
// Production / Ground Flower Pouches form carrying its ref is submitted.
// Which form an item goes to is its line (queueLine in preroll_queue.js): a
// product or request whose name says "ground" is pouches.
// ?embed=queue: only the queue, for the Work Orders page's Pre-Roll tab —
// its links (Start / Open batch) open in the whole window, not the frame.
if (new URLSearchParams(location.search).get('embed') === 'queue') {
  document.body.classList.add('embed');
  const base = document.createElement('base');
  base.target = '_top';
  document.head.appendChild(base);
}
// PRODUCTION_REQUESTS_CSV_URL, PREROLL_QUEUE_ID, BRAND_CODES, parseCsv,
// QUEUE_LINES, QUEUE_STATIONS, queueLine, isQueueRequest, runMade,
// queueStartHref and brandOf come from preroll_queue.js.
const REFRESH_MS = 60 * 1000;

// Every on-screen string, English and Spanish side by side (t() and the
// EN/ES toggle come from ops_common.js — same language setting as the forms).
const L = {
  title: { en: 'Pre-Roll Dashboard', es: 'Tablero de prerolls' },
  hub: { en: '← Hub', es: '← Inicio' },
  h1: { en: 'Pre-Roll Production', es: 'Producción de prerolls' },
  intro: { en: 'Pre-roll and ground flower pouch requests from the Production Requests Sheet. Assign the strain, schedule it, then start the batch — progress fills in from the Pre-Roll Production or Ground Flower Pouches form.',
           es: 'Solicitudes de prerolls y de bolsas de flor molida de la hoja de solicitudes de producción. Asigne la variedad, prográmela y luego inicie el lote — el avance se llena desde el formulario de producción de prerolls o de bolsas de flor molida.' },
  loading: { en: 'Loading…', es: 'Cargando…' },
  updated: { en: 'Updated', es: 'Actualizado' },
  search: { en: 'Search PR#, product, strain…', es: 'Buscar PR#, producto, variedad…' },
  f_open: { en: 'Open', es: 'Abiertas' },
  f_needs: { en: 'Needs planning', es: 'Por planear' },
  f_in_production: { en: 'In production', es: 'En producción' },
  f_late: { en: 'Running late', es: 'Atrasadas' },
  f_done: { en: 'Done', es: 'Terminadas' },
  f_all: { en: 'All', es: 'Todas' },
  t_open: { en: 'Open requests', es: 'Solicitudes abiertas' },
  t_qty: { en: 'Pre-rolls requested', es: 'Prerolls solicitados' },
  t_pouches: { en: 'Ground flower pouches requested', es: 'Bolsas de flor molida solicitadas' },
  t_needs: { en: 'Needs planning', es: 'Por planear' },
  t_prod: { en: 'In production', es: 'En producción' },
  t_late: { en: 'Running late', es: 'Atrasadas' },
  g_needs_strain: { en: 'Needs a strain', es: 'Falta variedad' },
  g_needs_schedule: { en: 'Not scheduled yet', es: 'Sin programar' },
  g_on_hold: { en: 'On hold', es: 'En espera' },
  g_done: { en: 'Done', es: 'Terminadas' },
  g_in_production: { en: 'In production', es: 'En producción' },
  g_week: { en: 'Week of', es: 'Semana del' },
  g_past: { en: '(past)', es: '(pasada)' },
  none_requests: { en: 'No pre-roll or ground flower pouch requests in the Production Requests Sheet right now.', es: 'No hay solicitudes de prerolls ni de bolsas de flor molida en la hoja de solicitudes de producción por ahora.' },
  none_match: { en: 'Nothing matches this filter.', es: 'Nada coincide con este filtro.' },
  late: { en: 'Late', es: 'Atrasada' },
  plan: { en: 'Plan', es: 'Planear' },
  plan_lbl: { en: 'Plan', es: 'Plan' },
  edit_plan: { en: 'Edit plan', es: 'Editar plan' },
  start_batch: { en: 'Start batch', es: 'Iniciar lote' },
  open_batch: { en: 'Open batch', es: 'Abrir lote' },
  qty: { en: 'Qty', es: 'Cant.' },
  strain: { en: 'Strain', es: 'Variedad' },
  not_assigned: { en: 'not assigned', es: 'sin asignar' },
  not_scheduled: { en: 'not scheduled', es: 'sin programar' },
  ready_by: { en: 'Ready by', es: 'Lista para' },
  ship: { en: 'Ship', es: 'Envío' },
  lead: { en: 'Lead', es: 'Encargado' },
  made: { en: 'Made', es: 'Hechos' },
  any_type: { en: 'Any type', es: 'Cualquier tipo' },
  prerolls: { en: 'pre-rolls', es: 'prerolls' },

function weekOf(d) {
  const dt = new Date(d + 'T12:00:00');
  dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
  return dt.toISOString().slice(0, 10);
}

// ── Load ─────────────────────────────────────────────────────────────────
async function loadRequests() {
  const res = await fetch(PRODUCTION_REQUESTS_CSV_URL + '&t=' + Date.now());
  if (!res.ok) throw new Error(`${t(L.err_sheet)} (HTTP ${res.status})`);
  return parseCsv(await res.text())
    .filter((r) => isQueueRequest(r, products))
    .map((r) => ({
      pr: r['PR#'], product: r['Product'], bsku: r['BSKU'], asku: r['ASKU'],
      type: r['Strain Type'], outputStrain: r['Output Strain'],
      batchSize: num(r['Batch Size']), readyDate: r['Ready Date'], shipDate: r['Ship Date'],
      sheetStatus: r['Status'], sheetNotes: r['Notes']
    }))
    .filter((r) => r.pr);
}

async function loadPlans() {
  if (!client) return {};
  const { data, error } = await client.from('preroll_plans').select('*');
  if (error) throw new Error(`${t(L.err_plans)} (${error.message})`);
  return Object.fromEntries((data || []).map((p) => [p.pr_num, p]));
}

async function loadBatches() {
  if (!client) return {};
  const { data, error } = await client.from('operations_forms')
    .select('id,station_key,status,owner_user,updated_by,strain,work_date,submitted_at,fields').in('station_key', QUEUE_STATIONS);
  if (error) { console.error('loadBatches', error); return {}; }
  runs = data || [];
  const out = {};
  (data || []).forEach((r) => {
    const pr = String((r.fields && r.fields.prNum) || '').trim().toUpperCase();
    if (pr) (out[pr] = out[pr] || []).push(r);
  });
  return out;
}

async function loadReferenceLists() {
  try {
    const ref = await (await fetch('/data/operations/reference.json')).json();
    const active = (list) => (list || []).filter((s) => s.active !== false).map((s) => s.label || s.name || s.id).filter(Boolean);
    return { strains: active(ref.strains), brands: [...new Set(active(ref.brands).concat(Object.values(BRAND_CODES)))] };
  } catch { return { strains: [], brands: Object.values(BRAND_CODES) }; }
}

async function loadProducts() {
  if (!client) return {};
  const { data, error } = await client.from('preroll_products').select('*');
  if (error) { console.error('loadProducts', error); return products; }
  return Object.fromEntries((data || []).map((p) => [p.bsku.toUpperCase(), productRow(p)]));
}

// Hand-added queue items still in the queue, and the saved order. A failure
// here shows in the queue box only — the request list below still works.
async function loadQueue() {
  if (!client) return { manual: [], order: [], err: '' };
  const [items, ord] = await Promise.all([
    client.from('preroll_queue_items').select('*').is('removed_at', null),
    client.from('operations_forms').select('fields').eq('id', PREROLL_QUEUE_ID).maybeSingle()
  ]);
  if (items.error) { console.error('loadQueue', items.error); return { manual: [], order: [], err: `${t(L.q_load_fail)} (${items.error.message})` }; }
  const f = (ord.data && ord.data.fields) || {};
  return { manual: items.data || [], order: Array.isArray(f.order) ? f.order : [], err: '' };
}

async function saveQueueOrder(order) {
  const who = currentUser || null;
  const { error } = await client.from('operations_forms').upsert({
    id: PREROLL_QUEUE_ID, station_key: 'preroll_queue', status: 'submitted', owner_user: who, updated_by: who,
    submitted_at: new Date().toISOString(),
    fields: { order, updatedBy: who || '', updatedAt: new Date().toISOString() }
  });
  return error ? { ok: false, reason: error.message } : { ok: true };
}

async function loadCosts() {
  if (!canCost) return;
  try {
    const res = await fetch('/.netlify/functions/preroll-costs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: sessionStorage.getItem('2cw_pin') || '' })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) throw new Error(j.error || `HTTP ${res.status}`);
    costs = Object.fromEntries((j.runs || []).map((c) => [c.id, c]));
    costErr = '';
  } catch (e) { costErr = String(e.message || e); }
}

async function refresh() {
  // The queue's hand-added items don't need the Sheet, so they load (and
  // show) even when the Sheet or the plans can't be read.
  const [b, q, pr] = await Promise.all([loadBatches(), loadQueue(), loadProducts(), loadCosts()]);
  batches = b; products = pr; manual = q.manual; queueOrder = q.order; queueErr = q.err;
  renderRuns();
  try {
    const [r, p] = await Promise.all([loadRequests(), loadPlans()]);
    requests = r; plans = p;
    document.getElementById('sync').textContent = `${t(L.updated)} ${new Date().toLocaleTimeString(locale(), { hour: 'numeric', minute: '2-digit' })}`;
    render();
  } catch (e) {
    console.error(e);
    renderQueue();
    document.getElementById('list').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ── Derive ───────────────────────────────────────────────────────────────
function view(r) {
  const plan = plans[r.pr] || {};
  const runs = batches[r.pr.toUpperCase()] || [];
  const submitted = runs.filter((b) => b.status === 'submitted');
  const draft = runs.find((b) => b.status === 'draft');
  const made = runs.reduce((a, b) => a + runMade(b.fields), 0);
  const strain = plan.strain || r.outputStrain || '';
  let stage;
  if (submitted.length) stage = 'done';
  else if (draft) stage = 'in_production';
  else if (plan.on_hold) stage = 'on_hold';
  else if (!strain) stage = 'needs_strain';
  else if (!plan.est_completion) stage = 'needs_schedule';
  else stage = 'scheduled';
  const open = stage !== 'done';
  // Late: the plan finishes after the Sheet's Ready Date, or the Ready Date
  // has already passed and it isn't done.
  const late = open && !!r.readyDate &&
    ((plan.est_completion && plan.est_completion > r.readyDate) || r.readyDate < todayStr());
  // Edit plan can override the Sheet's product, Batch Size (units) and
  // Strain Type. target = the pre-rolls to make.
  const batchSize = num(plan.quantity) > 0 ? num(plan.quantity) : r.batchSize;
  const type = plan.strain_type || r.type;
  const prod = productFor(plan.product_bsku || r.bsku);
  const target = prerollsFor(batchSize, prod);
  const line = queueLine(prod, r.product);
  return { ...r, batchSize, type, prod, line, target, plan, strain, stage, open, late, made, draft, submitted };
}

function passes(v, q) {
  if (filter === 'open' && !v.open) return false;
  if (filter === 'needs' && !['needs_strain', 'needs_schedule'].includes(v.stage)) return false;
  if (filter === 'in_production' && v.stage !== 'in_production') return false;
  if (filter === 'late' && !v.late) return false;
  if (filter === 'done' && v.stage !== 'done') return false;
  if (!q) return true;
  return [v.pr, v.product, v.bsku, v.type, v.strain, v.plan.assigned_to].join(' ').toLowerCase().includes(q);
}

// Everything still to make, as one list: open requests (not on hold) and
// hand-added items whose batch isn't submitted yet, in the saved order, then
// anything not ordered yet by Ready Date / date added.
function queueItems() {
  const fromRequests = requests.map(view).filter((v) => v.open && v.stage !== 'on_hold').map((v) => ({
    ref: v.pr, kind: 'pr', line: v.line, brand: brandOf(v.bsku, v.product), product: v.product || v.bsku,
    type: v.type, strain: v.strain, inputs: workOrderInputs(v.plan), qty: v.batchSize, prod: v.prod, target: v.target, made: v.made,
    draft: v.draft, late: v.late, readyDate: v.readyDate, sortDate: v.readyDate || '9999'
  }));
  const fromManual = manual.map((m) => {
    const ref = 'PQ-' + m.queue_no;
    const runs = batches[ref] || [];
    const prod = productFor(m.product_bsku);
    return {
      ref, kind: 'manual', line: queueLine(prod), row: m, brand: m.brand || (prod && prod.brand) || '', product: prod ? prod.name : '',
      type: m.strain_type || '', strain: m.strain || '',
      inputs: workOrderInputs(m), qty: num(m.quantity), prod, target: prerollsFor(num(m.quantity), prod),
      made: runs.reduce((a, b) => a + runMade(b.fields), 0),
      draft: runs.find((b) => b.status === 'draft'), done: runs.some((b) => b.status === 'submitted'),
      notes: m.notes || '', sortDate: String(m.created_at || '').slice(0, 10) || '9999'
    };
  }).filter((x) => !x.done);
  const pos = (x) => { const i = queueOrder.indexOf(x.ref); return i < 0 ? Infinity : i; };
  return fromRequests.concat(fromManual).sort((a, b) =>
    (pos(a) - pos(b)) || a.sortDate.localeCompare(b.sortDate) || a.ref.localeCompare(b.ref));
}

let shownQueue = [];
function renderQueue() {
  const box = document.getElementById('queue');
  shownQueue = queueItems();
  if (queueErr && !shownQueue.length) { box.innerHTML = `<div class="err">${esc(queueErr)}</div>`; return; }
  if (!shownQueue.length) { box.innerHTML = `<div class="empty">${t(L.q_none)}</div>`; return; }
  const n = shownQueue.length;
  box.innerHTML = (queueErr ? `<div class="err" style="margin-bottom:8px">${esc(queueErr)}</div>` : '') +
    `<div class="q-list">` + shownQueue.map((x, i) => {
      const off = savingOrder || !client;
      const startHref = queueStartHref({ line: x.line, ref: x.ref, strain: x.strain, sourceUid: firstInputUid(x.inputs), inputs: x.inputs, brand: x.brand,
        unitSizeG: x.prod && x.prod.preroll_size_g, packType: x.prod && packCode(x.prod) });
      const go = x.draft
        ? `<a class="btn btn-purple" href="/ops_form.html?station=${esc(x.draft.station_key)}&draft=${esc(x.draft.id)}">${t(L.open_batch)}</a>`
        : `<a class="btn btn-purple" href="${esc(startHref)}">${t(L.start_batch)}</a>`;
      const edit = x.kind === 'pr'
        ? `<button class="btn" onclick="openEditor('${esc(x.ref)}')">${t(L.edit_plan)}</button>`
        : `<button class="btn" onclick="openItemEditor('${esc(x.row.id)}')">${t(L.q_edit)}</button>`;
      return `<div class="q-row">
        <div class="q-n">${i + 1}</div>
        <div class="q-main">
          <div class="q-strain">${x.brand ? esc(x.brand) + ' · ' : ''}${x.strain ? esc(x.strain) : `<span class="none">${t(L.q_no_strain)}</span>`}
            ${pouchPill(x.line)}${typePill(x.type)}
            ${x.draft ? `<span class="pill stage-in_production">${t(L.q_busy)}</span>` : ''}
            ${x.late ? `<span class="pill late">${t(L.late)}</span>` : ''}</div>
          <div class="q-sub"><span class="q-ref">${esc(x.ref)}</span>${x.product ? ' · ' + esc(x.product) : ''} ·
            ${x.inputs.length ? esc(inputsSummary(x.inputs)) : `<span class="none">${t(L.q_no_inputs)}</span>`}
            ${x.readyDate ? ` · ${t(L.ready_by_lc)} ${esc(fmtDate(x.readyDate))}` : ''}${x.notes ? ' · ' + esc(x.notes) : ''}</div>
        </div>
        <div class="q-qty"><span class="k">${t(L.qty)}</span>${fmtN(x.qty)}${x.prod && x.prod.pack_size > 1 ? ` × ${x.prod.pack_size}` : ''}
          <span class="pr">${x.prod ? `${fmtN(x.target)} ${unitWord(x.line)}${x.prod.preroll_size_g ? ' · ' + gTxt(x.prod.preroll_size_g) : ''}` : unitWord(x.line)}</span>
          ${x.made ? `<span class="made">${t(L.made)} ${fmtN(x.made)}</span>` : ''}</div>
        <div class="q-move">
          <button type="button" data-move="top" data-i="${i}" ${i === 0 || off ? 'disabled' : ''}>${t(L.q_top)}</button>
          <button type="button" data-move="up" data-i="${i}" aria-label="${esc(t(L.q_up))}" ${i === 0 || off ? 'disabled' : ''}>▲</button>
          <button type="button" data-move="down" data-i="${i}" aria-label="${esc(t(L.q_down))}" ${i === n - 1 || off ? 'disabled' : ''}>▼</button>
        </div>
        <div class="q-acts">${edit}${go}</div>
      </div>`;
    }).join('') + `</div>`;
}

document.getElementById('queue').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-move]');
  if (!b || savingOrder || !client) return;
  const i = Number(b.dataset.i);
  const to = b.dataset.move === 'top' ? 0 : b.dataset.move === 'up' ? i - 1 : i + 1;
  if (to < 0 || to >= shownQueue.length || to === i) return;
  const refs = shownQueue.map((x) => x.ref);
  const [moved] = refs.splice(i, 1);
  refs.splice(to, 0, moved);
  // Keep refs that aren't showing right now (a request on hold) after the
  // visible ones, so they keep their place when they come back; drop ones
  // that are gone for good (no longer in the Sheet, or removed).
  const known = new Set(requests.map((r) => r.pr).concat(manual.map((m) => 'PQ-' + m.queue_no)));
  const order = refs.concat(queueOrder.filter((r) => !refs.includes(r) && (!requests.length || known.has(r))));
  const before = queueOrder;
  queueOrder = order;
  savingOrder = true;
  renderQueue();
  const res = await saveQueueOrder(order);
  savingOrder = false;
  if (!res.ok) { queueOrder = before; alert(t(L.q_save_fail)); await refresh(); return; }
  renderQueue();
});

// ── Render ───────────────────────────────────────────────────────────────
function render() {
  renderQueue();
  const all = requests.map(view);
  const open = all.filter((v) => v.open);
  const tiles = [
    { k: t(L.t_open), v: open.length, f: 'open' },
    { k: t(L.t_qty), v: fmtN(open.filter((v) => v.line !== 'pouch').reduce((a, v) => a + v.target, 0)), f: 'open' },
    ...(open.some((v) => v.line === 'pouch')
      ? [{ k: t(L.t_pouches), v: fmtN(open.filter((v) => v.line === 'pouch').reduce((a, v) => a + v.target, 0)), f: 'open' }] : []),
    { k: t(L.t_needs), v: open.filter((v) => ['needs_strain', 'needs_schedule'].includes(v.stage)).length, f: 'needs', cls: 'warn' },
    { k: t(L.t_prod), v: open.filter((v) => v.stage === 'in_production').length, f: 'in_production', cls: 'go' },
    { k: t(L.t_late), v: open.filter((v) => v.late).length, f: 'late', cls: 'bad' }
  ];
  document.getElementById('tiles').innerHTML = tiles.map((t) =>
    `<button class="tile ${t.cls || ''}" onclick="setFilter('${t.f}')"><div class="k">${t.k}</div><div class="v">${t.v}</div></button>`).join('');

  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = all.filter((v) => passes(v, q));
  const list = document.getElementById('list');
  if (!requests.length) { list.innerHTML = `<div class="empty">${t(L.none_requests)}</div>`; return; }
  if (!shown.length) { list.innerHTML = `<div class="empty">${t(L.none_match)}</div>`; return; }

  // Groups: what still needs planning first, then the schedule week by week
  // (by planned start, falling back to planned finish), then on hold / done.
  const groups = new Map();
  const put = (key, title, v, warn) => {
    if (!groups.has(key)) groups.set(key, { title, warn, items: [] });
    groups.get(key).items.push(v);
  };
  shown.forEach((v) => {
    if (v.stage === 'needs_strain') return put('0', t(L.g_needs_strain), v, true);
    if (v.stage === 'needs_schedule') return put('1', t(L.g_needs_schedule), v, true);
    if (v.stage === 'on_hold') return put('8', t(L.g_on_hold), v);
    if (v.stage === 'done') return put('9', t(L.g_done), v);
    const d = v.plan.est_start || v.plan.est_completion;
    const wk = d ? weekOf(d) : '';
    put('5-' + wk, wk ? `${t(L.g_week)} ${fmtDate(wk)}${wk < weekOf(todayStr()) ? ' ' + t(L.g_past) : ''}` : t(L.g_in_production), v);
  });
  const byNeed = (a, b) => (a.readyDate || '9999').localeCompare(b.readyDate || '9999') || a.pr.localeCompare(b.pr);
  list.innerHTML = [...groups.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([, g]) => `
    <div class="group">
      <div class="group-hd ${g.warn ? 'warn' : ''}">${esc(g.title)} <span class="n">${g.items.length}</span></div>
      ${g.items.sort(byNeed).map(cardHtml).join('')}
    </div>`).join('');
}

function cardHtml(v) {
  const p = v.plan;
  const pctMade = v.target > 0 ? Math.min(100, Math.round(v.made / v.target * 100)) : 0;
  const inputs = workOrderInputs(p);
  const startHref = queueStartHref({ line: v.line, ref: v.pr, strain: v.strain, sourceUid: firstInputUid(inputs), inputs, brand: brandOf(v.bsku, v.product),
    unitSizeG: v.prod && v.prod.preroll_size_g, packType: v.prod && packCode(v.prod) });
  const sched = p.est_start || p.est_completion
    ? `${p.est_start ? fmtDate(p.est_start) : '?'} → ${p.est_completion ? fmtDate(p.est_completion) : '?'}`
    : `<span class="none">${t(L.not_scheduled)}</span>`;
  return `
  <div class="card ${v.late ? 'late' : ''} ${v.stage === 'on_hold' ? 'hold' : ''}">
    <div class="c-top">
      <span class="pr">${esc(v.pr)}</span>
      <span class="prod">${esc(p.product_bsku && v.prod ? v.prod.name : v.product || v.bsku)}</span>
      ${pouchPill(v.line)}${typePill(v.type)}
      <span class="pill stage-${v.stage}">${t(STAGE_LABELS[v.stage])}</span>
      ${v.late ? `<span class="pill late">${t(L.late)}</span>` : ''}
    </div>
    <div class="c-actions">
      <button class="btn" onclick="openEditor('${esc(v.pr)}')">${t(v.strain || p.est_completion ? L.edit_plan : L.plan)}</button>
      ${v.draft ? `<a class="btn btn-purple" href="/ops_form.html?station=${esc(v.draft.station_key)}&draft=${esc(v.draft.id)}">${t(L.open_batch)}</a>`
        : v.stage !== 'done' ? `<a class="btn btn-purple" href="${esc(startHref)}">${t(L.start_batch)}</a>` : ''}
    </div>
    <div class="c-meta">
      <span>${t(L.qty)} <b>${fmtN(v.batchSize)}</b>${v.prod ? ` × ${v.prod.pack_size} = <b>${fmtN(v.target)}</b> ${unitWord(v.line)}` : ` ${unitWord(v.line)}`}</span>
      ${v.prod ? `<span>${prodSpec(v.prod)}</span>` : ''}
      <span>${t(L.strain)} ${v.strain ? `<b>${esc(v.strain)}</b>` : `<span class="none">${t(L.not_assigned)}</span>`}</span>
      ${inputs.length ? `<span>${t(L.q_inputs)} <b>${esc(inputsSummary(inputs))}</b></span>` : ''}
      <span>${t(L.plan_lbl)} ${sched}</span>
      <span>${t(L.ready_by)} <b>${esc(fmtDate(v.readyDate) || '—')}</b></span>
      ${v.shipDate ? `<span>${t(L.ship)} <b>${esc(fmtDate(v.shipDate))}</b></span>` : ''}
      ${p.assigned_to ? `<span>${t(L.lead)} <b>${esc(p.assigned_to)}</b></span>` : ''}
      ${v.made ? `<span>${t(L.made)} <b>${fmtN(v.made)}</b> / ${fmtN(v.target)}</span>` : ''}
      <span>${esc(p.product_bsku || v.bsku)}</span>
    </div>
    ${v.made || v.stage === 'in_production' ? `<div class="progress ${v.stage === 'done' ? 'done' : ''}"><i style="width:${pctMade}%"></i></div>` : ''}
    ${p.notes ? `<div class="c-notes">${esc(p.notes)}</div>` : ''}
  </div>`;
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('#bar .chip').forEach((c) => c.classList.toggle('on', c.dataset.f === f));
  render();
}
document.querySelectorAll('#bar .chip').forEach((c) => c.addEventListener('click', () => setFilter(c.dataset.f)));
document.getElementById('search').addEventListener('input', render);

// ── Submitted runs ───────────────────────────────────────────────────────
// Every submitted Pre-Roll Production and Ground Flower Pouches form, newest
// first, including ones not linked to a request. Tapping one opens the whole record, drawn straight
// off the station definition in operations_stations.js, like Harvest Intakes.
const RUNS_SHOWN = 10;
const runStation = (r) => STATION_BY_KEY[r.station_key] || STATION_BY_KEY.preroll_production;
const runLine = (r) => (r.station_key === QUEUE_LINES.pouch.station ? 'pouch' : 'preroll');
const runWhen = (r) => r.submitted_at || r.work_date || '';
const isFlagged = (fd, v) => !!fd.flag && v !== null && v !== undefined && v !== '' &&
  Number.isFinite(Number(v)) && fd.flag(Number(v));
// Calc fields with a `flag` (Starting Weight Accounted For) that's tripped.
const runFlags = (r) => runStation(r).fields.filter((fd) => isFlagged(fd, (r.fields || {})[fd.k]));

const fmtMoney = (x) => '$' + Number(x).toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// A pre-roll costs cents, so under $1 shows four places ($0.0263).
const fmtEach = (x) => '$' + Number(x).toLocaleString(locale(), x < 1
  ? { minimumFractionDigits: 4, maximumFractionDigits: 4 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Labor $ per pre-roll (or pouch) for a run, or null (no access, no cost, none made).
function perPreroll(r) {
  const c = costs[r.id];
  const made = runMade(r.fields);
  return c && c.cost > 0 && made > 0 ? c.cost / made : null;
}

function renderRuns() {
  const box = document.getElementById('runs');
  const done = runs.filter((r) => r.status === 'submitted').sort((a, b) => runWhen(b).localeCompare(runWhen(a)));
  const err = canCost && costErr ? `<div class="err" style="margin-bottom:8px">${t(L.c_err)} ${esc(costErr)}</div>` : '';
  if (!done.length) { box.innerHTML = err + `<div class="empty">${t(L.s_none)}</div>`; return; }
  const shown = showAllRuns ? done : done.slice(0, RUNS_SHOWN);
  box.innerHTML = err + shown.map((r) => {
    const f = r.fields || {};
    const each = perPreroll(r);
    const start = f.date || r.work_date;
    const dates = f.finishDate && f.finishDate !== start ? `${fmtDate(start)} → ${fmtDate(f.finishDate)}` : fmtDate(start);
    return `<button type="button" class="run" onclick="openRun('${esc(r.id)}')">
      <div class="run-main">
        <div class="run-title">${esc(r.strain || f.strain || '—')}
          ${pouchPill(runLine(r))}${runFlags(r).length ? `<span class="pill warn">${t(L.s_check)}</span>` : ''}</div>
        <div class="run-sub">${esc(dates)} · ${f.prNum ? `<span class="q-ref">${esc(f.prNum)}</span>` : `<span class="none">${t(L.s_no_pr)}</span>`}${
          f.batchId && f.batchId !== f.prNum ? ` · ${esc(f.batchId)}` : ''}
          ${num(f.laborHours) > 0 ? `· ${fmtNum(f.laborHours, 1)} ${t(L.s_hours)}` : num(f.crewSize) > 0 ? `· ${fmtNum(f.crewSize, 0)} ${t(L.s_people)}` : ''}${f.accountedPct != null ? ` · ${fmtPct(f.accountedPct)} ${t(L.s_accounted)}` : ''}
          · ${esc(r.owner_user || '—')}</div>
      </div>
      <div class="run-n"><span class="k">${unitWord(runLine(r))}</span>${fmtN(runMade(f))}${
        each != null ? `<span class="cost">${fmtEach(each)} ${t(L.c_each_short)}</span>` : ''}</div>
    </button>`;
  }).join('') + (done.length > RUNS_SHOWN
    ? `<button type="button" class="btn s-more" onclick="showAllRuns = !showAllRuns; renderRuns()">${
      showAllRuns ? t(L.s_less) : t(L.s_more).replace('{n}', done.length)}</button>` : '');
}

// A stored value as people read it: select codes become their label, numbers
// get formatted, percentages (fmt: 'pct') get a %, blanks become —.
function runValue(fd, v) {
  if (v === undefined || v === null || v === '') return '—';
  if (fd.t === 'select') {
    const opts = fd.refConst === 'BIOMASS' ? Object.entries(BIOMASS).map(([k, l]) => ({ v: k, l })) : (fd.opts || []);
    const hit = opts.find((o) => String(o.v) === String(v));
    return hit ? t(hit.l) : String(v);
  }
  if (fd.t === 'check') return v === true || v === 'true' ? t({ en: 'Yes', es: 'Sí' }) : 'No';
  if (fd.fmt === 'pct') return fmtPct(v);
  if (fd.t === 'number' || fd.t === 'calc') return Number.isFinite(Number(v)) ? fmtNum(v, fd.dp === undefined ? 2 : fd.dp) : String(v);
  if (fd.t === 'date') return fmtDate(v) || String(v);
  return String(v);
}

function runFieldHtml(fd, r) {
  const f = r.fields || {};
  // A Master Schedule project is stored by id, with its name beside it.
  const v = fd.projectPicker && f[fd.k] ? f.projectName || f[fd.k] : f[fd.k];
  if (fd.showIf && !fd.showIf(f)) return '';
  if (fd.t === 'heading') return `<div class="d-head">${esc(t(fd.l))}</div>`;
  // Who worked each day (the crew check): names here, and who wasn't.
  // Runs from before it have a Workforce Log of hours instead.
  if (fd.t === 'crewcheck') {
    const latest = [...crewLatest(v).values()];
    const days = [...new Set(latest.map((x) => x.day))].sort();
    if (!days.length && Array.isArray(f.crew) && f.crew.length) {
      return `<div class="d-row block"><div class="k">${esc(t(L.s_workforce))}</div>
        <div class="d-tbl-wrap"><table class="d-tbl"><tbody>${f.crew.map((c) =>
          `<tr><td>${esc(c.employeeNo || '')}</td><td>${esc(fmtDate(c.workDate || f.date) || '')}</td><td>${esc(c.startTime || '')}–${esc(c.endTime || '')}</td><td class="n">${fmtNum(c.hours, 2)}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
    if (!days.length) return `<div class="d-row"><div class="k">${esc(t(fd.l))}</div><div class="v">—</div></div>`;
    return `<div class="d-row block"><div class="k">${esc(t(fd.l))}</div>${days.map((d) => {
      const on = latest.filter((x) => x.day === d && (x.status === 'here' || x.status === 'added')).map((x) => x.name);
      const off = latest.filter((x) => x.day === d && x.status === 'out').map((x) => x.name);
      return `<div class="d-note"><b>${esc(fmtDate(d))}:</b> ${esc(on.join(', ') || '—')}${off.length ? ` · ${esc(t(L.s_notHere))}: ${esc(off.join(', '))}` : ''}</div>`;
    }).join('')}</div>`;
  }
  if (fd.t === 'lineitems') {
    const items = Array.isArray(v) ? v : [];
    if (!items.length) return `<div class="d-row"><div class="k">${esc(t(fd.l))}</div><div class="v">—</div></div>`;
    const isNum = (c) => ['number', 'calc'].includes(c.t);
    const totalDef = fd.totalCol && fd.cols.find((c) => c.k === fd.totalCol);
    const total = totalDef ? items.reduce((a, it) => a + num(it[fd.totalCol]), 0) : null;
    return `<div class="d-row block"><div class="k">${esc(t(fd.l))}</div>
      <div class="d-tbl-wrap"><table class="d-tbl">
        <thead><tr><th>#</th>${fd.cols.map((c) => `<th>${esc(t(c.l))}</th>`).join('')}</tr></thead>
        <tbody>${items.map((it, i) => `<tr><td class="n">${i + 1}</td>${fd.cols.map((c) =>
          `<td class="${isNum(c) ? 'n' : ''}">${esc(runValue(c, it[c.k]))}</td>`).join('')}</tr>`).join('')}</tbody>
        ${totalDef ? `<tfoot><tr><td>${t(L.s_total)}</td>${fd.cols.map((c) =>
          `<td class="${isNum(c) ? 'n' : ''}">${c.k === fd.totalCol ? esc(runValue(totalDef, total)) : ''}</td>`).join('')}</tr></tfoot>` : ''}
      </table></div></div>`;
  }
  if (fd.t === 'photo') {
    const ok = typeof v === 'string' && /^https?:\/\//.test(v);
    return `<div class="d-row"><div class="k">${esc(t(fd.l))}</div><div class="v">${ok
      ? `<a href="${esc(v)}" target="_blank" rel="noopener"><img class="d-photo" src="${esc(v)}" alt=""></a>` : '—'}</div></div>`;
  }
  const flagged = isFlagged(fd, v);
  return `<div class="d-row ${fd.t === 'calc' ? 'hl' : ''} ${flagged ? 'flag' : ''}"><div class="k">${esc(t(fd.l))}</div>
    <div class="v">${esc(runValue(fd, v))}${flagged ? ` <span class="pill warn">${t(L.s_check)}</span>` : ''}</div></div>`;
}

function costHtml(r) {
  if (!canCost) return '';
  const head = `<div class="d-head">${t(L.c_head)}</div>`;
  if (costErr) return head + `<div class="err">${t(L.c_err)} ${esc(costErr)}</div>`;
  const c = costs[r.id];
  const proj = (r.fields || {}).projectName || t({ en: 'the project', es: 'el proyecto' });
  if (!c || !(c.hours > 0)) return head + `<div class="d-note">${esc(c && c.source === 'project' ? t(L.c_none_project).replace('{p}', proj) : t(L.c_none))}</div>`;
  const each = perPreroll(r);
  const notes = [
    c.source === 'project' ? t(L.c_project).replace('{p}', proj) : '',
    c.defaultHours > 0 ? t(c.source === 'project' ? L.c_default_project : L.c_default).replace('{h}', fmtNum(c.defaultHours, 2)).replace('{t}', fmtNum(c.hours, 2)) : '',
    c.unratedHours > 0 ? t(L.c_unrated).replace('{h}', fmtNum(c.unratedHours, 2)) : ''
  ].filter(Boolean);
  return head +
    `<div class="d-row hl"><div class="k">${t(L.c_total)}</div><div class="v">${fmtMoney(c.cost)}</div></div>` +

// ── Brand → product picker (Edit plan, Add to queue) ─────────────────────
// Brand narrows the product list; the product says how many pre-rolls are
// in one unit and how big each is. updateCalc shows the math live.
function productOptions(brand, sel) {
  const cur = productFor(sel);
  const list = activeProducts().filter((p) => !brand || p.brand === brand);
  if (cur && !list.includes(cur)) list.unshift(cur);
  return `<option value="">${t(L.p_none)}</option>` + list.map((p) =>
    `<option value="${esc(p.bsku)}" ${cur && p.bsku === cur.bsku ? 'selected' : ''}>${esc(p.name)} — ${p.pack_size} × ${p.preroll_size_g ? gTxt(p.preroll_size_g) : '?'}</option>`).join('');
}
function productPicker(prefix, bsku, brand) {
  const cur = productFor(bsku);
  const b = cur ? cur.brand : (brand || '');
  const brandList = [...new Set(activeProducts().map((p) => p.brand).concat(b ? [b] : []))].sort((x, y) => x.localeCompare(y));
  return `<div class="row2">
      <div class="fld"><label class="lbl" for="${prefix}-brand">${t(L.i_brand)}</label>
        <select id="${prefix}-brand" onchange="pickBrand('${prefix}')"><option value="">${t(L.i_any_brand)}</option>
          ${brandList.map((x) => `<option value="${esc(x)}" ${x === b ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="fld"><label class="lbl" for="${prefix}-prod">${t(L.i_product)}</label>
        <select id="${prefix}-prod" onchange="updateCalc('${prefix}')">${productOptions(b, cur ? cur.bsku : '')}</select></div>
    </div>`;
}
function pickBrand(prefix) {
  const brand = document.getElementById(prefix + '-brand').value;
  const sel = document.getElementById(prefix + '-prod');
  const cur = productFor(sel.value);
  // Keep the product if it's this brand's; otherwise the brand's first one.
  const first = activeProducts().find((p) => p.brand === brand);
  sel.innerHTML = productOptions(brand, cur && (!brand || cur.brand === brand) ? cur.bsku : first ? first.bsku : '');
  updateCalc(prefix);
}
// ── Work order inputs ────────────────────────────────────────────────────
// What goes into a batch: a row per material or package (flower, smalls,
// A / A+ trim, any mix — POUCH_INPUTS), each with an optional Metrc tag and
// grams. Saved as `inputs` on the plan / queue item (workOrderInputs in
// preroll_queue.js); Start batch hands the rows to the Ground Flower Pouches
// form, and the first tag to Pre-Roll Production's Source UID.
const matLabel = (m) => (pouchInputLabel(m) ? t(pouchInputLabel(m)) : m);
function inputRowHtml(prefix, x) {
  x = x || {};
  return `<div class="in-row">
      <select class="in-mat"><option value="">${t(L.e_material)}</option>
        ${POUCH_INPUTS.map((m) => `<option value="${m}" ${m === x.material ? 'selected' : ''}>${esc(matLabel(m))}</option>`).join('')}</select>
      <input class="in-uid" value="${esc(x.sourceUid || '')}" autocapitalize="characters" placeholder="${esc(t(L.e_uid_ph))}"/>
      <input class="in-g" type="number" min="0" step="0.1" inputmode="decimal" value="${esc(x.weightG || '')}" placeholder="${esc(t(L.e_grams))}" oninput="inputsTotal('${prefix}')"/>
      <button type="button" class="btn x" title="${esc(t(L.e_remove_input))}" onclick="this.parentNode.remove();inputsTotal('${prefix}')">✕</button>
    </div>`;
}
function inputsEditor(prefix, inputs) {
  const rows = inputs && inputs.length ? inputs : [{}];
  return `<div class="fld"><label class="lbl">${t(L.e_inputs)}</label>
      <div class="hint">${t(L.e_inputs_hint)}</div>
      <div id="${prefix}-inputs">${rows.map((x) => inputRowHtml(prefix, x)).join('')}</div>
      <button type="button" class="btn" onclick="addInputRow('${prefix}')">${t(L.e_add_input)}</button>
      <div class="in-tot" id="${prefix}-in-tot"></div></div>`;
}
function addInputRow(prefix) {
  const box = document.getElementById(prefix + '-inputs');
  const last = [...box.querySelectorAll('.in-mat')].pop();
  box.insertAdjacentHTML('beforeend', inputRowHtml(prefix, { material: last ? last.value : '' }));
  box.lastElementChild.querySelector('.in-uid').focus();
}
function readInputs(prefix) {
  return [...document.querySelectorAll(`#${prefix}-inputs .in-row`)].map((el) => ({
    material: el.querySelector('.in-mat').value,
    sourceUid: el.querySelector('.in-uid').value.trim().toUpperCase(),
    weightG: parseFloat(el.querySelector('.in-g').value) > 0 ? parseFloat(el.querySelector('.in-g').value) : null
  })).filter((x) => x.material || x.sourceUid || x.weightG);
}
function inputsTotal(prefix) {
  const out = document.getElementById(prefix + '-in-tot');
  if (!out) return;
  const g = readInputs(prefix).reduce((a, x) => a + (x.weightG || 0), 0);
  out.textContent = g > 0 ? t(L.e_inputs_total).replace('{g}', gTxt(g)) : '';
}
// "Flower (A-Bud) …1234 · 500 g, Trim (A+)": a work order's inputs in a line.
function inputsSummary(inputs) {
  return (inputs || []).map((x) => [x.material ? matLabel(x.material) : '', x.sourceUid ? '…' + x.sourceUid.slice(-5) : '',
    x.weightG ? gTxt(x.weightG) : ''].filter(Boolean).join(' ')).join(', ');
}

function updateCalc(prefix) {
  const out = document.getElementById(prefix + '-calc');
  if (!out) return;
  const units = parseInt(document.getElementById(prefix + '-qty').value, 10) || 0;
  const prod = productFor(document.getElementById(prefix + '-prod').value);
  if (!prod) { out.innerHTML = units ? `= ${fmtN(units)} ${t(L.prerolls)}` : ''; return; }
  const n = units * prod.pack_size;
  out.innerHTML = t(L.calc_total).replace('{qty}', fmtN(units)).replace('{pack}', prod.pack_size).replace('{n}', `<b>${fmtN(n)}</b>`).replace('{unit}', unitWord(queueLine(prod))) +
    ` · ${prod.preroll_size_g ? `${gTxt(prod.preroll_size_g)} ${t(L.each)} · ${t(L.calc_flower).replace('{g}', gTxt(n * prod.preroll_size_g))}` : `<span class="none">${t(L.no_size)}</span>`}`;
}

async function saveProduct(bsku) {
  const val = (id) => document.getElementById(id).value.trim();
  const err = document.getElementById('pp-err');
  const size = val('pp-size');
  const row = {
    bsku: bsku || val('pp-bsku').toUpperCase(),
    brand: val('pp-brand'),
    name: val('pp-name'),
    pack_size: parseInt(val('pp-pack'), 10),
    preroll_size_g: size === '' ? null : num(size),
    active: document.getElementById('pp-active').checked,
    updated_by: currentUser || null
  };
  if (!row.bsku || !row.brand || !row.name || !(row.pack_size > 0) || (row.preroll_size_g != null && !(row.preroll_size_g > 0))) {
    err.textContent = t(L.p_err); err.style.display = 'block'; return;
  }
  const btn = document.getElementById('pp-save');
  btn.disabled = true; btn.textContent = t(L.saving);
  const q = bsku
    ? client.from('preroll_products').update(row).eq('bsku', bsku)
    : client.from('preroll_products').insert(row);
  const { data, error } = await q.select().single();
  if (error) {
    err.textContent = `${t(L.err_save)} ${error.message}`; err.style.display = 'block';
    btn.disabled = false; btn.textContent = t(L.i_save);
    return;
  }
  products[data.bsku.toUpperCase()] = productRow(data);
  render();
  openProducts();
}

async function saveItem() {
  const val = (id) => document.getElementById(id).value.trim();
  const err = document.getElementById('i-err');
  const qty = parseInt(val('i-qty'), 10);
  if (!(qty > 0)) { err.textContent = t(L.i_err_qty); err.style.display = 'block'; return; }
  const prod = productFor(val('i-prod'));
  const row = {
    product_bsku: prod ? prod.bsku : null,
    brand: (prod && prod.brand) || val('i-brand') || null,
    strain_type: val('i-type') || null,
    strain: val('i-strain') || null,
    inputs: readInputs('i'),
    source_uid: firstInputUid(readInputs('i')) || null,
    quantity: qty,
    notes: val('i-notes') || null,
    updated_by: currentUser || null
  };
  const btn = document.getElementById('i-save');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = t(L.saving);
  const q = editingItem.id
    ? client.from('preroll_queue_items').update(row).eq('id', editingItem.id)
    : client.from('preroll_queue_items').insert({ ...row, created_by: currentUser || null });
  const { data, error } = await q.select().single();
  if (error) {
    err.textContent = `${t(L.err_save)} ${error.message}`; err.style.display = 'block';
    btn.disabled = false; btn.textContent = label;
    return;
  }
  manual = manual.filter((x) => x.id !== data.id).concat(data);
  closeEditor();
  renderQueue();
}

async function removeItem() {
  const m = editingItem;
  if (!m || !m.id || !confirm(t(L.i_remove_q).replace('{ref}', 'PQ-' + m.queue_no))) return;
  const { error } = await client.from('preroll_queue_items')
    .update({ removed_at: new Date().toISOString(), removed_by: currentUser || null, updated_by: currentUser || null })
    .eq('id', m.id);
  if (error) {
    const err = document.getElementById('i-err');
    err.textContent = `${t(L.err_save)} ${error.message}`; err.style.display = 'block';
    return;
  }
  manual = manual.filter((x) => x.id !== m.id);
  closeEditor();
  renderQueue();
}

async function saveEditor() {
  const val = (id) => document.getElementById(id).value.trim();
  const err = document.getElementById('e-err');
  const r = requests.find((x) => x.pr === editingPr) || {};
  // Only store what differs from the Sheet, so later Sheet changes still
  // come through where the team didn't override them.
  const qtyTxt = val('e-qty');
  const qty = qtyTxt === '' ? null : parseInt(qtyTxt, 10);
  if (qtyTxt !== '' && !(qty > 0)) { err.textContent = t(L.i_err_qty); err.style.display = 'block'; return; }
  const type = val('e-type');
  const prodBsku = val('e-prod');
  const row = {
    pr_num: editingPr,
    product_bsku: prodBsku && prodBsku.toUpperCase() !== String(r.bsku || '').toUpperCase() ? prodBsku : null,
    quantity: qty && qty !== r.batchSize ? qty : null,
    strain_type: type && type.toLowerCase() !== String(r.type || '').toLowerCase() ? type : null,
    strain: val('e-strain') || null,
    inputs: readInputs('e'),
    source_uid: firstInputUid(readInputs('e')) || null,
    est_start: val('e-start') || null,
    est_completion: val('e-done') || null,
    assigned_to: val('e-lead') || null,
    on_hold: document.getElementById('e-hold').checked,
    notes: val('e-notes') || null,
    updated_by: currentUser || null
  };
  if (row.est_start && row.est_completion && row.est_completion < row.est_start) {
    err.textContent = t(L.err_dates); err.style.display = 'block'; return;
  }
  const btn = document.getElementById('e-save');
  btn.disabled = true; btn.textContent = t(L.saving);
  const { data, error } = await client.from('preroll_plans').upsert(row).select().single();
  if (error) {
    err.textContent = `${t(L.err_save)} ${error.message}`; err.style.display = 'block';
    btn.disabled = false; btn.textContent = t(L.save);
    return;
  }
  plans[editingPr] = data;
  closeEditor();
  render();
}

(async () => {
  const [s, dir] = await Promise.all([
    loadReferenceLists(),
    typeof loadUserDirectory === 'function' ? loadUserDirectory().catch(() => []) : []
  ]);
  strains = s.strains;
  brands = s.brands;
  people = [...new Set((dir || []).map((u) => (u.user || '').trim()).filter(Boolean))];
  await refresh();
  // ?run=<id> opens that run's details (the link an open run leaves in the address bar).
  const runId = new URLSearchParams(location.search).get('run');
  if (runId) openRun(runId);
  // Keep up with new requests landing in the Sheet and batches being
  // logged — but never re-render underneath an open editor.
  setInterval(() => { if (!editingPr && !editingItem && !editingProducts && !viewingRun && !savingOrder) refresh(); }, REFRESH_MS);
})();
