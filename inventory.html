<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2CW Inventory & Production</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0B0D10;--bg2:#111418;--bg3:#181C21;--bg4:#1F242B;
      --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.11);
      --text:#EAE6DC;--text2:#9B9790;--text3:#575450;
      --green:#5BBF7E;--green2:rgba(91,191,126,.12);
      --blue:#5A9FD4;--blue2:rgba(90,159,212,.12);
      --gold:#D4A843;--gold2:rgba(212,168,67,.12);
      --orange:#E8904A;--orange2:rgba(232,144,74,.12);
      --red:#D95B5B;--red2:rgba(217,91,91,.12);
      --teal:#3CB8C4;--teal2:rgba(60,184,196,.12);
      --purple:#9B7FD4;--purple2:rgba(155,127,212,.12);
      --font:'Barlow',sans-serif;--font-c:'Barlow Condensed',sans-serif;--r:6px;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
    @keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
    .hdr{height:50px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:100}
    .hdr-back{font-family:var(--font-c);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .15s}
    .hdr-back:hover{color:var(--text2)}
    .hdr-div{width:1px;height:18px;background:var(--border2)}
    .hdr-brand{font-family:var(--font-c);font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
    .hdr-date{margin-left:auto;font-family:var(--font-c);font-size:11px;color:var(--text3)}
    .wrap{padding:20px 22px;max-width:1400px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:18px}
    .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
    .kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
    .kpi.green::after{background:var(--green)}.kpi.gold::after{background:var(--gold)}
    .kpi.orange::after{background:var(--orange)}.kpi.red::after{background:var(--red)}
    .kpi.blue::after{background:var(--blue)}.kpi.teal::after{background:var(--teal)}
    .kpi-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
    .kpi-val{font-family:var(--font-c);font-size:22px;font-weight:700;color:var(--text);line-height:1}
    .kpi-sub{font-size:10px;color:var(--text3);margin-top:2px}
    .sec{font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:8px;margin:18px 0 12px}
    .sec::after{content:'';flex:1;height:1px;background:var(--border)}
    .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:18px}
    .inv-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
    .inv-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px}
    .inv-card.urgent::before{background:var(--red)}
    .inv-card.warn::before{background:var(--orange)}
    .inv-card.ok::before{background:var(--green)}
    .inv-card.na::before{background:var(--text3)}
    .inv-pg{font-family:var(--font-c);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin-bottom:2px}
    .inv-brand{font-family:var(--font-c);font-size:10px;color:var(--text3);margin-bottom:10px}
    .inv-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
    .inv-stat{text-align:center}
    .inv-stat-val{font-family:var(--font-c);font-size:20px;font-weight:700;line-height:1}
    .inv-stat-lbl{font-size:9px;color:var(--text3);margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
    .dos-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:8px}
    .dos-fill{height:100%;border-radius:3px;transition:width .4s}
    .dos-label{font-family:var(--font-c);font-size:10px;color:var(--text3);margin-top:5px;display:flex;justify-content:space-between}
    .target-line{font-size:9px;padding:3px 7px;border-radius:3px;font-family:var(--font-c);font-weight:700;letter-spacing:.05em}
    .urgent .target-line{background:var(--red2);color:var(--red)}
    .warn .target-line{background:var(--orange2);color:var(--orange)}
    .ok .target-line{background:var(--green2);color:var(--green)}
    .na .target-line{background:var(--bg3);color:var(--text3)}
    .prod-rec{margin-top:10px;padding:8px 10px;border-radius:4px;font-size:11px;border:1px solid var(--border)}
    .prod-rec.urgent{background:var(--red2);border-color:rgba(217,91,91,.25);color:var(--red)}
    .prod-rec.warn{background:var(--orange2);border-color:rgba(232,144,74,.25);color:var(--orange)}
    .prod-rec.ok{background:var(--green2);border-color:rgba(91,191,126,.25);color:var(--green)}
    .prod-rec.na{background:var(--bg3);border-color:var(--border);color:var(--text3)}
  </style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <a class="hdr-back" href="/twocw_hub.html">← Hub</a>
    <div class="hdr-div"></div>
    <div class="hdr-brand">Inventory & Production</div>
    <div class="hdr-date" id="ref-date"></div>
  </header>
  <div class="wrap" id="content"><div style="padding:40px;text-align:center;color:var(--text3);font-family:var(--font-c)">Loading...</div></div>
</div>

<script>
window.addEventListener('load', loadData);

const TARGET_DOS=60;

function dosClass(dos){
  if(dos===null||dos===undefined)return 'na';
  if(dos<30)return 'urgent';
  if(dos<TARGET_DOS)return 'warn';
  return 'ok';
}
function dosRec(pg,dos,inv,past30){
  if(dos===null||past30===0)return{cls:'na',text:'No recent sales — check manually'};
  const daily=past30/30;
  const target60=Math.round(daily*TARGET_DOS);
  if(dos>=TARGET_DOS)return{cls:'ok',text:`On track — ${Math.round(dos)}d of supply`};
  const needed=target60-inv;
  const lbsNeeded=needed/(pg.units_per_pound||1);
  if(dos<30)return{cls:'urgent',text:`⚠ Urgent: need ~${Math.round(lbsNeeded)} lbs to reach 60d target`};
  return{cls:'warn',text:`Order soon: ~${Math.round(lbsNeeded)} lbs needed for 60d target`};
}

async function loadData(){
  try{
    const resp=await fetch('/data/inventory_data.json');
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    render(data);
  }catch(e){
    document.getElementById('content').innerHTML=`<div style="color:var(--red);padding:20px;font-family:var(--font-c)">Failed to load inventory data: ${e.message}</div>`;
  }
}

function render(data){
  const pgs=data.product_groups||[];
  document.getElementById('ref-date').textContent='As of '+data.ref_date;

  const totalInv=pgs.reduce((s,p)=>s+p.inventory,0);
  const totalSold=pgs.reduce((s,p)=>s+p.past_30,0);
  const urgent=pgs.filter(p=>dosClass(p.days_of_supply)==='urgent').length;
  const warn=pgs.filter(p=>dosClass(p.days_of_supply)==='warn').length;
  const avgDos=pgs.filter(p=>p.days_of_supply).reduce((s,p,_,a)=>s+p.days_of_supply/a.length,0);

  const fN=n=>n>=1000?(n/1000).toFixed(1)+'K':n;

  document.getElementById('content').innerHTML=`
    <div class="kpis">
      <div class="kpi green"><div class="kpi-lbl">Total Units</div><div class="kpi-val">${fN(totalInv)}</div><div class="kpi-sub">Across all PGs</div></div>
      <div class="kpi blue"><div class="kpi-lbl">Sold (30d)</div><div class="kpi-val">${fN(totalSold)}</div><div class="kpi-sub">Units last 30 days</div></div>
      <div class="kpi gold"><div class="kpi-lbl">Avg Days Supply</div><div class="kpi-val">${avgDos?Math.round(avgDos)+'d':'—'}</div><div class="kpi-sub">Across active PGs</div></div>
      <div class="kpi red"><div class="kpi-lbl">Urgent</div><div class="kpi-val">${urgent}</div><div class="kpi-sub">Under 30 days supply</div></div>
      <div class="kpi orange"><div class="kpi-lbl">Watch</div><div class="kpi-val">${warn}</div><div class="kpi-sub">30–60 days supply</div></div>
      <div class="kpi teal"><div class="kpi-lbl">Healthy</div><div class="kpi-val">${pgs.length-urgent-warn}</div><div class="kpi-sub">60+ days supply</div></div>
    </div>
    <div class="sec">Product Group Inventory</div>
    <div class="inv-grid">
      ${pgs.sort((a,b)=>(a.days_of_supply||9999)-(b.days_of_supply||9999)).map(pg=>{
        const cls=dosClass(pg.days_of_supply);
        const rec=dosRec(pg,pg.days_of_supply,pg.inventory,pg.past_30);
        const dosPct=pg.days_of_supply?Math.min(pg.days_of_supply/90*100,100):0;
        const dosColor=cls==='urgent'?'var(--red)':cls==='warn'?'var(--orange)':'var(--green)';
        return `<div class="inv-card ${cls}">
          <div class="inv-pg">${pg.pg}</div>
          <div class="inv-brand">${pg.brand} · ${pg.subcategory} · ${pg.weight_unit}</div>
          <div class="inv-stats">
            <div class="inv-stat">
              <div class="inv-stat-val" style="color:var(--text)">${pg.inventory.toLocaleString()}</div>
              <div class="inv-stat-lbl">On Hand</div>
            </div>
            <div class="inv-stat">
              <div class="inv-stat-val" style="color:var(--blue)">${pg.past_30.toLocaleString()}</div>
              <div class="inv-stat-lbl">Sold 30d</div>
            </div>
            <div class="inv-stat">
              <div class="inv-stat-val" style="color:${dosColor}">${pg.days_of_supply?Math.round(pg.days_of_supply)+'d':'—'}</div>
              <div class="inv-stat-lbl">Days Supply</div>
            </div>
          </div>
          <div class="dos-bar"><div class="dos-fill" style="width:${dosPct}%;background:${dosColor}"></div></div>
          <div class="dos-label"><span>0</span><span class="target-line">60d target</span><span>90d</span></div>
          <div class="prod-rec ${rec.cls}">${rec.text}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}
</script>
</body>
</html>
