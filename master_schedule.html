<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Master Schedule — 2CW Operations</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;--orange:#e08a3c;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:0 0 auto}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--blue);color:#000}

    main{padding:28px 16px 60px;max-width:1200px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;line-height:1}
    .sub{margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    .tabs{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
    .tabs button{background:var(--surface);border:1px solid var(--border);color:var(--subtext);border-radius:10px;padding:.6rem 1rem;
      font-family:'DM Mono',monospace;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-height:44px}
    .tabs button.on{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
    .view{display:none}.view.on{display:block}

    .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 16px}
    .bar input[type=date]{flex:0 1 180px}
    .bar input[type=search]{flex:1 1 200px}
    .nav{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;min-width:46px;min-height:46px;font-size:1.1rem;cursor:pointer}
    .day-name{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--subtext);letter-spacing:.06em;text-transform:uppercase}
    .spacer{flex:1}
    input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.6rem .75rem;
      font:inherit;font-size:1rem;min-height:46px;outline:none;width:100%}
    input:focus,select:focus,textarea:focus{border-color:var(--blue)}
    input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;display:block}
    input::-webkit-date-and-time-value{text-align:left}
    textarea{min-height:64px;resize:vertical}
    .btn{padding:.7rem 1.1rem;border:1px solid var(--border);border-radius:10px;font-family:'DM Mono',monospace;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);min-height:46px}
    .btn-blue{background:var(--blue);border-color:var(--blue);color:#000}
    .btn-gold{background:var(--gold);border-color:var(--gold);color:#000}
    .btn-ghost{color:var(--subtext)}
    .btn-danger{color:var(--red);border-color:rgba(239,83,80,.4)}
    .btn-sm{min-height:38px;padding:.45rem .8rem;font-size:.68rem}
    .btn:disabled{opacity:.5;cursor:default}
    a.btn{text-decoration:none;display:inline-flex;align-items:center}
    .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .seg button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:0 12px;min-height:44px;cursor:pointer}
    .seg button.on{background:var(--blue);color:#000;font-weight:700}

    .summary{font-size:.9rem;color:var(--subtext);margin-bottom:14px}
    .summary b{color:var(--text);font-family:'DM Mono',monospace;font-weight:500}
    .summary .warn{color:var(--red)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .card.editing{border-color:var(--gold);grid-column:1/-1;max-width:860px}
    /* Editors let the people dropdown spill past the card instead of clipping it. */
    .card.editing{overflow:visible}
    .card.editing .card-hd{border-radius:13px 13px 0 0}
    .card-hd{background:var(--orange);color:#000;padding:10px 14px}
    .card-hd .loc{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.04em;line-height:1}
    .card-hd .nm{font-weight:700;font-size:.95rem;margin-top:2px}
    .card-hd .time{font-family:'DM Mono',monospace;font-size:.76rem;font-weight:500;margin-top:2px}
    .card-hd.st-planned{background:var(--blue)}
    .card-hd.st-done{background:var(--muted)}
    .card-hd.st-active{background:var(--green)}
    .card-body{padding:12px 14px}
    .card-ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:0 14px 12px}
    .meta{font-size:.82rem;color:var(--subtext);line-height:1.55;margin-bottom:8px}
    .meta b{color:var(--text);font-weight:500}
    .note{background:rgba(239,83,80,.12);border-left:3px solid var(--red);padding:8px 10px;border-radius:6px;font-size:.88rem;margin-bottom:10px;white-space:pre-wrap}
    .role{margin-top:10px}
    .role:first-child{margin-top:0}
    .role-hd{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;gap:8px;align-items:baseline}
    .role-hd .tm{color:var(--subtext);letter-spacing:.04em}
    .ppl{list-style:none}
    .ppl li{padding:5px 0;border-top:1px solid var(--border);font-size:.92rem}
    .ppl li:first-child{border-top:none}
    .ppl .none{color:var(--muted);font-size:.85rem}
    .ppl li.extra::after{content:' +';color:var(--blue);font-weight:700}
    .lead-tag{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;background:var(--green);color:#000;border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:middle}
    .conflict{display:block;color:var(--red);font-size:.76rem;margin-top:2px}
    .conflict::before{content:'⚠ '}
    .off{font-size:.8rem;color:var(--muted);margin-top:8px}
    .tag{display:inline-block;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border);color:var(--subtext);border-radius:99px;padding:2px 8px}
    .m{font-family:'DM Mono',monospace}
    .s{font-size:.78rem;color:var(--muted)}

    /* Editors */
    .ed{padding:16px}
    .ed .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .ed .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
    .ed .row > div,.ed .row3 > div{min-width:0}
    .ed .full{grid-column:1/-1}
    .lbl{display:block;font-size:.82rem;color:var(--subtext);margin-bottom:5px}
    .sec{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--border)}
    .days{display:flex;gap:6px;flex-wrap:wrap}
    .days button{background:var(--bg);border:1px solid var(--border);color:var(--subtext);border-radius:8px;min-width:46px;min-height:42px;cursor:pointer;font-family:'DM Mono',monospace;font-size:.72rem}
    .days button.on{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
    .role-ed{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface2)}
    /* Responsibilities table: Name | Process | Start | End, people under each row */
    .rtbl{border:1px solid var(--border);border-radius:12px;background:var(--surface2)}
    .rhead,.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 118px 118px 40px;gap:8px;align-items:center}
    .rhead{padding:8px 10px;font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
    .rgrp{padding:10px;border-top:1px solid var(--border)}
    .rhead + .rgrp{border-top:none}
    .rrow input,.rrow select{min-height:42px;padding:.45rem .6rem;font-size:.92rem}
    .rppl{margin-top:6px;padding-left:2px}
    .rppl .chips{margin:0 0 6px}
    .rppl .picker input{min-height:40px;font-size:.9rem}
    @media (max-width:640px){
      .rhead{display:none}
      .rrow{grid-template-columns:1fr 1fr 40px}
      .rrow [data-rname]{grid-column:1/3}
      .rrow [data-rproc]{grid-column:1/-1;order:3}
      .rrow [data-rts]{order:4}
      .rrow [data-rte]{order:5}
      .rrow .x{grid-row:1;grid-column:3}
    }
    .ed-ppl{list-style:none;margin:4px 0 8px}
    .ed-ppl li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border)}
    .ed-ppl li:first-child{border-top:none}
    .ed-ppl li .nm{min-width:0;font-size:.95rem}
    .ed-ppl li.out .nm{color:var(--muted);text-decoration:line-through}
    .star{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;min-height:38px;padding:0 10px;cursor:pointer;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase}
    .star.on{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
    .x{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:8px;width:38px;min-height:38px;font-size:1.1rem;cursor:pointer}
    .x:hover{border-color:var(--red);color:var(--red)}
    .check{display:flex;gap:10px;align-items:center;font-size:.95rem;cursor:pointer;margin-bottom:12px}
    .check input{width:22px;height:22px;min-height:0;flex:0 0 auto}
    .picker{position:relative}
    .panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
      box-shadow:0 10px 30px rgba(0,0,0,.5);max-height:min(50vh,340px);overflow-y:auto;display:none}
    .panel.on{display:block}
    .panel button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);font:inherit;cursor:pointer;padding:9px 14px;min-height:42px}
    .panel button:hover,.panel button.hl{background:var(--blue);color:#000}
    .panel button .s{display:block;font-size:.76rem;color:var(--muted)}
    .panel button:hover .s,.panel button.hl .s{color:#000;opacity:.75}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
    .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:4px 6px 4px 10px;font-size:.85rem}
    .chip button{background:transparent;border:none;color:var(--subtext);cursor:pointer;font-size:1rem;padding:0 4px}
    .uid-add{display:grid;grid-template-columns:1fr auto;gap:8px}
    .matches button{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;margin-top:6px;cursor:pointer;font:inherit;font-size:.88rem}
    .ed-ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
    .err{color:var(--red);font-size:.88rem;margin-top:8px}
    .hint{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.45}

    /* Week: projects down, days across */
    .multi-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .multi{border-collapse:collapse;width:100%;min-width:760px;font-size:.82rem}
    .multi th,.multi td{border-bottom:1px solid var(--border);border-left:1px solid var(--border);padding:8px;vertical-align:top;text-align:left}
    .multi thead th{background:var(--surface2);position:sticky;top:0}
    .multi thead th button{background:transparent;border:none;color:var(--text);font:inherit;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:0;text-align:left}
    .multi thead th button:hover{color:var(--blue)}
    .multi thead th.today button{color:var(--blue)}
    .multi tbody th{background:var(--orange);color:#000;font-weight:400;border-left:none;min-width:140px}
    .multi tbody th .loc{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.04em;line-height:1}
    .multi tbody th .nm{font-size:.8rem;font-weight:700}
    .multi .tm{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--subtext);margin-bottom:3px}
    .multi .nt{color:var(--red);font-size:.76rem;margin-bottom:3px;white-space:pre-wrap}
    .multi .rl{color:var(--gold);font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em}
    .multi .pp{line-height:1.45}
    .multi .c{color:var(--red)}
    .multi .none{color:var(--muted)}

    .multi .fl{color:var(--purple)}

    /* Farm labor contractors (project editor): Workers | Start | End rows under each contractor */
    .flc-hd{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:8px;align-items:center;margin-bottom:8px}
    .frow{display:grid;grid-template-columns:110px 118px 118px 40px;gap:8px;align-items:center;margin-top:6px}
    .frow.fhead{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:0}
    .frow input{min-height:42px;padding:.45rem .6rem;font-size:.92rem}
    @media (max-width:520px){ .frow{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr) 40px} }
    .flc-tag{white-space:nowrap;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;background:var(--purple);color:#000;border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:middle}

    /* Timeline: grouped by location, a row per person / contractor crew, bars on an hour axis */
    .tl{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .tl-in{min-width:760px}
    .tl-row{display:grid;grid-template-columns:180px minmax(0,1fr);border-top:1px solid var(--border)}
    .tl-name{position:sticky;left:0;z-index:2;background:var(--surface);padding:6px 10px;font-size:.88rem;display:flex;align-items:center;border-right:1px solid var(--border);min-width:0}
    .tl-name span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tl-track{position:relative}
    .tl-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}
    .tl-axis .tl-name,.tl-axis{background:var(--surface2)}
    .tl-axis .tl-track{height:30px}
    .tl-axis .tl-lbl{position:absolute;top:8px;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:.64rem;color:var(--subtext);white-space:nowrap}
    .tl-farm{display:flex;gap:10px;align-items:baseline;background:var(--orange);color:#000;padding:8px 12px;border-top:1px solid var(--border);position:sticky;left:0}
    .tl-farm .loc{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;line-height:1}
    .tl-farm .ct{font-family:'DM Mono',monospace;font-size:.72rem}
    .tl-bar{position:absolute;height:24px;border-radius:6px;background:var(--c);color:#000;font-size:.72rem;font-weight:500;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tl-bar.flc{background:repeating-linear-gradient(135deg,var(--c) 0 8px,color-mix(in srgb,var(--c) 65%,#fff) 8px 16px);border:1px dashed #000}
    .tl-bar.conf{outline:2px solid var(--red);outline-offset:1px}
    @media (max-width:560px){ .tl-row{grid-template-columns:132px minmax(0,1fr)} .tl-name{font-size:.8rem;padding:6px 8px} .tl-in{min-width:680px} }
    .tl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:.8rem;color:var(--subtext)}
    .tl-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);vertical-align:-1px;margin-right:5px}

    .empty{border:1px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--subtext)}
    .empty p{margin-bottom:14px}
    .footer{margin-top:36px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}
    .footer a{color:var(--subtext)}
    #img-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 12px 30px}
    #img-bg.on{display:flex}
    #img-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;width:100%;max-width:760px}
    .img-ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    #img-name{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);word-break:break-all}
    #img-preview{display:block;width:100%;border-radius:8px;margin-top:10px;background:#fff}
    #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green);color:#000;font-weight:700;
      padding:12px 18px;border-radius:10px;z-index:90;display:none;max-width:calc(100vw - 32px)}
    #toast.on{display:block}
    @media (max-width:560px){
      .ed .row3{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Master Schedule</div>
  <div class="lang" id="lang"></div>
</header>

<main>
  <div class="title" id="title">Master Schedule</div>
  <div class="sub" id="sub">—</div>
  <div class="tabs" id="tabs"></div>

  <section class="view" id="view-schedule">
    <div class="bar">
      <button type="button" class="nav" id="prev" aria-label="Previous">‹</button>
      <input type="date" id="date">
      <button type="button" class="nav" id="next" aria-label="Next">›</button>
      <span class="day-name" id="day-name"></span>
      <span class="spacer"></span>
      <div class="seg" id="view-seg"></div>
      <button type="button" class="btn btn-ghost" id="png"></button>
      <button type="button" class="btn btn-ghost" id="csv"></button>
    </div>
    <div class="summary" id="summary"></div>
    <div id="board"></div>
  </section>

  <section class="view" id="view-projects">
    <div class="bar">
      <div class="seg" id="status-seg"></div>
      <input type="search" id="q">
      <button type="button" class="btn btn-gold" id="add"></button>
    </div>
    <div id="plist"></div>
  </section>

  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution<br><br><a href="/schedule.html" id="old-link"></a></footer>
</main>
<div id="toast"></div>
<div id="img-bg"><div id="img-box">
  <div class="img-ft"><span id="img-name"></span><span class="spacer"></span>
    <button type="button" class="btn btn-blue" id="img-share"></button>
    <a class="btn btn-ghost" id="img-dl" download></a>
    <button type="button" class="btn btn-ghost" id="img-close"></button></div>
  <div class="hint" id="img-hint"></div>
  <img id="img-preview" alt="">
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script>
// Master Schedule — the bigger jobs ("Smalls Trimming" at Adobe, "Fresh
// Frozen Harvest" at Comstock, "Preroll Production" at Adobe), who's on them,
// and from that the daily/weekly work schedule. Replaces Scheduling
// (schedule.html), which is still reachable for its old day schedules.
//
// A project is one operations_forms row, station_key 'work_project' — no
// table of its own, like the Labor Log and Scheduling. Its fields are
// described above projectRunsOn in operations_stations.js: dates, the days
// of the week and hours it runs, a status, the project lead, its

        .eq('station_key', 'labor_entry').eq('status', 'submitted').not('fields->>project', 'is', null)
        .order('id').range(page * 1000, page * 1000 + 999);

      data.forEach((r) => {

        if (f.voided || !f.project) return;

        x.hours += Number(f.hours) || 0;
        x.people.add(f.employeeId || fold(f.employeeName));

    labor = by;

  // Read-modify-write one project: re-read it, apply `mutate(fields)`, and

  async function patchProject(id, mutate) {
    for (let attempt = 0; attempt < 3; attempt++) {
      const { data: rows, error: e1 } = await client.from('operations_forms').select('*').eq('id', id).limit(1);
      if (e1) throw e1;
      const row = rows && rows[0];
      if (!row || (row.fields || {}).voided) throw new Error(t(L.gone));
      const fields = mutate(clone(row.fields));
      fields.updatedBy = me;
      const { data, error } = await client.from('operations_forms')
        .update({ fields, work_date: fields.start || row.work_date, updated_by: me || null })
        .eq('id', id).eq('updated_at', row.updated_at).select();
      if (error) throw error;
      if (data && data.length) {
        const i = projects.findIndex((p) => p.id === id);
        if (fields.voided) { if (i >= 0) projects.splice(i, 1); }
        else if (i >= 0) projects[i] = data[0]; else projects.push(data[0]);
        return data[0];
      }
    }
    throw new Error('Someone else keeps saving this project — reload and try again.');
  }

  // Roles with that day's changes applied: people who are off left out

  function dayRoles(f, date) {
    const ov = ovFor(f, date);
    const out = new Set(ov.out || []);
    const off = [];
    const roles = projectRoles(f, t(L.projLead)).map((r) => {
      const people = [];
      (r.people || []).forEach((p) => { if (out.has(personKey(p))) off.push(p); else people.push(p); });

      return { ...r, people: people.sort((a, b) => (b.lead ? 1 : 0) - (a.lead ? 1 : 0)) };

    return { roles, off, note: ov.note || '' };

  function projectFlc(f, date) {

    (f.contractors || []).forEach((c) => (c.shifts || []).forEach((sh) => {

      const usual = Number(sh.count) || 0;
      const count = sh.id in day ? Number(day[sh.id]) || 0 : usual;
      if (date && !count) return;

  function renderWeek(ds) {
    const today = localDay();
    const shown = projects.filter((p) => ds.some((d) => runsOn(p, d)))
      .sort((a, b) => locOrder(a.fields) - locOrder(b.fields) || String(a.fields.name).localeCompare(String(b.fields.name)));

            `${esc(x.name)} ×${x.count}${x.s != null && hoursLabel(f) !== x.label ? ` <span class="s">${esc(x.label)}</span>` : ''}`).join(', ')}</div>` : ''}</td>`;

  // ── Timeline ────────────────────────────────────────────────────────────
  // The day by location: a row per person (a bar for each project /
  // responsibility they're on there) and per contractor crew. Bars that
  // overlap in one row stack in lanes; all-day ones span the whole axis.
  // Each project gets a color for the day.
  const TL_COLORS = ['#5a9fd4', '#d4a843', '#9b7fd4', '#3db87a', '#e08a3c', '#4fb8b0', '#d47a9b', '#a0a85a'];
  function timelineData(date) {
    const ps = projects.filter((p) => runsOn(p, date))
      .sort((a, b) => locOrder(a.fields) - locOrder(b.fields) || (projectHours(a.fields)[0] ?? -1) - (projectHours(b.fields)[0] ?? -1));
    const color = new Map(ps.map((p, i) => [p.id, TL_COLORS[i % TL_COLORS.length]]));
    const conf = conflictsOn(date);
    const farms = [];
    const farmOf = (f) => {
      const k = f.location === 'other' ? 'other:' + fold(f.locationName) : f.location;
      let g = farms.find((x) => x.key === k);
      if (!g) farms.push(g = { key: k, name: locName(f), people: new Map(), crews: [] });
      return g;
    };
    ps.forEach((p) => {
      const f = p.fields, g = farmOf(f);
      dayRoles(f, date).roles.forEach((r) => {
        const [s, e] = projectHours(f, r);
        r.people.forEach((x) => {
          const k = personKey(x);
          const row = g.people.get(k) || g.people.set(k, { name: x.name, lead: false, bars: [] }).get(k);
          if (x.lead) row.lead = true;
          row.bars.push({ s, e, color: color.get(p.id), time: hoursLabel(f, r), text: `${f.name} · ${r.name}`, conflict: conf.has(k + '|' + p.id) });
        });
      });
      projectFlc(f, date).forEach((x) => g.crews.push({ name: x.name, count: x.count, flc: true,
        bars: [{ s: x.s, e: x.e, color: color.get(p.id), time: x.label, text: `${f.name} · ${workersLabel(x.count)}`, flc: true }] }));
    });
    // Axis: whole hours around every timed bar (6 AM–6 PM when none has times).
    const timed = farms.flatMap((g) => [...g.people.values(), ...g.crews].flatMap((r) => r.bars)).filter((b) => b.s != null);
    const a0 = timed.length ? Math.floor(Math.min(...timed.map((b) => b.s)) / 60) * 60 : 360;
    let a1 = timed.length ? Math.ceil(Math.max(...timed.map((b) => b.e)) / 60) * 60 : 1080;
    if (a1 - a0 < 240) a1 = a0 + 240;
    farms.forEach((g) => {
      const first = (r) => Math.min(...r.bars.map((b) => b.s ?? a0));
      g.nPeople = g.people.size;
      g.nFlc = g.crews.reduce((a, c) => a + c.count, 0);
      g.rows = [...[...g.people.values()].sort((a, b) => (b.lead - a.lead) || first(a) - first(b) || a.name.localeCompare(b.name)),
                ...g.crews.sort((a, b) => a.name.localeCompare(b.name) || first(a) - first(b))];
      g.rows.forEach((r) => {
        const ends = [];
        r.bars.sort((a, b) => (a.s ?? a0) - (b.s ?? a0)).forEach((b) => {
          b.x0 = b.s == null ? a0 : b.s; b.x1 = b.s == null ? a1 : b.e;
          let lane = ends.findIndex((x) => x <= b.x0);
          if (lane < 0) { lane = ends.length; ends.push(0); }
          ends[lane] = b.x1; b.lane = lane;
        });
        r.lanes = Math.max(1, ends.length);
      });
    });
    const step = a1 - a0 > 14 * 60 ? 120 : 60;
    a1 = a0 + Math.ceil((a1 - a0) / step) * step;
    const ticks = [];
    for (let m = a0; m <= a1; m += step) ticks.push(m);
    return { ps, farms, a0, a1, ticks, color };
  }
  const tickLabel = (m) => fmtMin(m).replace(/:00(?=\D)/, '');
  function renderTimeline(date) {
    const { ps, farms, a0, a1, ticks, color } = timelineData(date);
    const ppl = new Set(dayAssignments(date).map((a) => a.key));
    const nFlc = flcTotal(ps, date);
    $('summary').innerHTML = ps.length ? fill(t(L.sumLine), { p: `<b>${esc(ppl.size === 1 ? t(L.person1) : fill(t(L.personN), { n: ppl.size }))}</b>`, n: `<b>${ps.length}</b>` }) +
      (nFlc ? ` · ${fill(esc(t(L.sumFlc)), { n: `<b>${nFlc}</b>` })}` : '') : '';
    if (!ps.length) {
      $('board').innerHTML = `<div class="empty"><p>${esc(t(L.nothingDay))}</p><button type="button" class="btn btn-gold" data-goproj="1">${esc(t(L.goProj))}</button></div>`;
      return;
    }
    const pct = (m) => ((m - a0) / (a1 - a0) * 100).toFixed(3) + '%';
    const LANE = 30;
    const grid = ticks.map((m) => `<div class="tl-tick" style="left:${pct(m)}"></div>`).join('');
    const axis = `<div class="tl-row tl-axis"><div class="tl-name"></div><div class="tl-track">${grid}${ticks.map((m, i) =>
      `<span class="tl-lbl" style="left:${pct(m)};${i === 0 ? 'transform:none;margin-left:4px' : i === ticks.length - 1 ? 'transform:translateX(-100%);margin-left:-4px' : ''}">${esc(tickLabel(m))}</span>`).join('')}</div></div>`;
    const row = (r) => `<div class="tl-row"><div class="tl-name"><span class="n">${esc(r.name)}</span>${r.lead ? `<span class="lead-tag">${esc(t(L.lead))}</span>` : ''}${r.flc ? `<span class="flc-tag">${esc(t(L.flcTag))} ×${r.count}</span>` : ''}</div>
      <div class="tl-track" style="height:${r.lanes * LANE + 6}px">${grid}${r.bars.map((b) =>
        `<div class="tl-bar${b.flc ? ' flc' : ''}${b.conflict ? ' conf' : ''}" style="--c:${b.color};left:${pct(b.x0)};width:calc(${pct(b.x1)} - ${pct(b.x0)});top:${b.lane * LANE + 4}px" title="${esc(b.time + ' · ' + b.text)}">${b.conflict ? '⚠ ' : ''}${esc(b.time + ' · ' + b.text)}</div>`).join('')}</div></div>`;
    const legend = `<div class="tl-legend">${ps.map((p) => `<span><i style="--c:${color.get(p.id)}"></i>${esc(p.fields.name)} <span class="s">${esc(locName(p.fields))} · ${esc(hoursLabel(p.fields))}</span></span>`).join('')}</div>`;
    $('board').innerHTML = legend + `<div class="tl"><div class="tl-in">${farms.map((g) =>
      `<div class="tl-farm"><span class="loc">${esc(g.name)}</span><span class="ct">${esc(g.nPeople === 1 ? t(L.person1) : fill(t(L.personN), { n: g.nPeople }))}${g.nFlc ? ' · ' + esc(fill(t(L.sumFlc), { n: g.nFlc })) : ''}</span></div>` +
      axis + g.rows.map(row).join('')).join('')}</div></div>`;
  }

  // Image of the timeline: same layout on white — location bands, an hour
  // axis under each, a row per person / crew with the bars colored by project.
  async function makeTimelineImage() {
    const date = $('date').value || localDay();
    const { ps, farms, a0, a1, ticks, color } = timelineData(date);
    if (!ps.length) { toast(t(L.nothingImg)); return; }
    try { await document.fonts.ready; } catch {}
    const W = 1600, PAD = 36, NAMEW = 300, LANE = 36, AXISH = 30, FARMH = 52;
    const SANS = "'DM Sans', Arial, sans-serif", HEAD = "'Bebas Neue', 'Arial Narrow', Arial, sans-serif", MONO = "'DM Mono', Menlo, monospace";
    const C = { ink: '#16181d', sub: '#5b6170', line: '#e3e5ea', grid: '#eef0f3', orange: '#e08a3c', red: '#c62828', green: '#1f8a52', purple: '#6b4fb0', paper: '#ffffff' };
    const F = { title: `400 54px ${HEAD}`, range: `500 24px ${SANS}`, farm: `400 32px ${HEAD}`, ct: `500 17px ${MONO}`, axis: `500 15px ${MONO}`,
                name: `400 20px ${SANS}`, lead: `700 20px ${SANS}`, tag: `700 13px ${MONO}`, bar: `500 15px ${SANS}`, legend: `500 18px ${SANS}`, foot: `400 16px ${SANS}` };
    const cv = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    const trackX = PAD + NAMEW, trackW = W - PAD - trackX;
    const xOf = (m) => trackX + (m - a0) / (a1 - a0) * trackW;
    // Legend lines (swatch + project name), wrapped to the width.
    ctx.font = F.legend;
    const legend = [[]];
    let lx = 0;
    ps.forEach((p) => {
      const label = `${p.fields.name} — ${locName(p.fields)}`;
      const w = 26 + ctx.measureText(label).width + 28;
      if (lx + w > W - PAD * 2 && legend[legend.length - 1].length) { legend.push([]); lx = 0; }
      legend[legend.length - 1].push({ label, color: color.get(p.id), x: lx });
      lx += w;
    });
    const headH = 130 + legend.length * 30 + 10, footH = 60;
    const farmH = (g) => FARMH + AXISH + g.rows.reduce((a, r) => a + r.lanes * LANE + 8, 0) + 22;
    const H = headH + farms.reduce((a, g) => a + farmH(g), 0) + footH;
    cv.width = W; cv.height = Math.ceil(H);
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.fillStyle = C.ink; ctx.font = F.title; ctx.fillText(t(L.imgTitle).toUpperCase(), PAD, PAD - 4);
    ctx.fillStyle = C.sub; ctx.font = F.range;
    ctx.fillText(fmtDate(date, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }), PAD, PAD + 56);
    const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); };
    ctx.font = F.legend;
    legend.forEach((line, i) => line.forEach((it) => {
      const y = 130 + i * 30;
      ctx.fillStyle = it.color; rr(PAD + it.x, y + 2, 18, 18, 4); ctx.fill();
      ctx.fillStyle = C.ink; ctx.fillText(it.label, PAD + it.x + 26, y);
    }));
    let y = headH;
    farms.forEach((g) => {
      ctx.fillStyle = C.orange; rr(PAD, y, W - PAD * 2, FARMH - 6, 8); ctx.fill();
      ctx.fillStyle = '#000'; ctx.font = F.farm; ctx.fillText(g.name.toUpperCase(), PAD + 14, y + 8);
      const nm = ctx.measureText(g.name.toUpperCase()).width;
      ctx.font = F.ct;
      ctx.fillText((g.nPeople === 1 ? t(L.person1) : fill(t(L.personN), { n: g.nPeople })) + (g.nFlc ? ' · ' + fill(t(L.sumFlc), { n: g.nFlc }) : ''), PAD + 30 + nm, y + 17);
      y += FARMH;
      const top = y, bottom = y + AXISH + g.rows.reduce((a, r) => a + r.lanes * LANE + 8, 0);
      ctx.fillStyle = C.grid;
      ticks.forEach((m) => ctx.fillRect(Math.round(xOf(m)), top + AXISH - 6, 1, bottom - top - AXISH + 6));
      ctx.fillStyle = C.sub; ctx.font = F.axis;
      ticks.forEach((m, i) => {
        const lbl = tickLabel(m), w = ctx.measureText(lbl).width;
        ctx.fillText(lbl, i === 0 ? xOf(m) : i === ticks.length - 1 ? xOf(m) - w : xOf(m) - w / 2, top + 4);
      });
      y += AXISH;
      g.rows.forEach((r) => {
        const h = r.lanes * LANE + 8;
        ctx.fillStyle = C.line; ctx.fillRect(PAD, y, W - PAD * 2, 1);
        ctx.fillStyle = r.lead ? C.green : C.ink; ctx.font = r.lead ? F.lead : F.name;
        let label = r.name + (r.flc ? ` ×${r.count}` : '');
        const tag = r.lead ? t(L.lead).toUpperCase() : r.flc ? t(L.flcTag).toUpperCase() : '';
        const maxW = NAMEW - 24 - (tag ? 60 : 0);
        while (ctx.measureText(label).width > maxW && label.length > 4) label = label.slice(0, -2) + '…';
        ctx.fillText(label, PAD + 4, y + 12);
        if (tag) { const lw = ctx.measureText(label).width; ctx.font = F.tag; ctx.fillStyle = r.lead ? C.green : C.purple; ctx.fillText(tag, PAD + 12 + lw, y + 17); }
        r.bars.forEach((b) => {
          const bx = xOf(b.x0), bw = Math.max(4, xOf(b.x1) - bx), by = y + 6 + b.lane * LANE, bh = LANE - 6;
          ctx.save();
          ctx.globalAlpha = b.flc ? 0.55 : 1;
          ctx.fillStyle = b.color; rr(bx, by, bw, bh, 6); ctx.fill();
          ctx.restore();
          if (b.flc) { ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; rr(bx, by, bw, bh, 6); ctx.stroke(); ctx.restore(); }
          if (b.conflict) { ctx.strokeStyle = C.red; ctx.lineWidth = 3; rr(bx - 2, by - 2, bw + 4, bh + 4, 7); ctx.stroke(); }
          ctx.save(); ctx.beginPath(); ctx.rect(bx + 6, by, bw - 12, bh); ctx.clip();
          ctx.fillStyle = '#000'; ctx.font = F.bar; ctx.fillText(`${b.conflict ? '⚠ ' : ''}${b.time} · ${b.text}`, bx + 8, by + 7);
          ctx.restore();
        });
        y += h;
      });
      y += 22;
    });
    ctx.fillStyle = C.sub; ctx.font = F.foot;
    ctx.fillText(`2CW · ${fill(t(L.imgMade), { t: new Date().toLocaleString(lang(), { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) })}`, PAD, H - footH + 18);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
    showImage(blob, `timeline-${date}.png`);
  }

  // ── CSV of the shown day(s) ─────────────────────────────────────────────
  // One line per person per responsibility, and per contractor crew, with
  // 24-hour times so it sorts and sums in a spreadsheet.
  function exportCsv() {
    const dates = view === 'week' ? weekDates() : [$('date').value || localDay()];
    const hhmm = (m) => m == null ? '' : `${String(Math.floor((m % 1440) / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    const hrs = (s, e) => s == null ? '' : +((e - s) / 60).toFixed(2);
    const rows = [['Date', 'Location', 'Project', 'Type', 'Responsibility', 'Name', 'Workers', 'Start', 'End', 'Hours', 'Total hours', 'Double-booked', 'Day note']];
    dates.forEach((d) => {
      const conf = conflictsOn(d);
      projects.filter((p) => runsOn(p, d))
        .sort((a, b) => locOrder(a.fields) - locOrder(b.fields) || (projectHours(a.fields)[0] ?? -1) - (projectHours(b.fields)[0] ?? -1))
        .forEach((p) => {
          const f = p.fields, { roles, note } = dayRoles(f, d);
          roles.forEach((r) => {
            const [s, e] = projectHours(f, r);
            r.people.forEach((x) => rows.push([d, locName(f), f.name, x.lead ? 'Lead' : 'Employee', r.name, x.name, 1, hhmm(s), hhmm(e), hrs(s, e), hrs(s, e),
              conf.has(personKey(x) + '|' + p.id) ? 'yes' : '', note]));
          });
          projectFlc(f, d).forEach((x) => rows.push([d, locName(f), f.name, 'Contractor', '', x.name, x.count, hhmm(x.s), hhmm(x.e), hrs(x.s, x.e),
            x.s == null ? '' : +(x.count * (x.e - x.s) / 60).toFixed(2), '', note]));
        });
    });
    if (rows.length === 1) { toast(t(L.nothingCsv)); return; }
    const cell = (v) => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const blob = new Blob(['﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `schedule-${dates[0]}${dates.length > 1 ? '_to_' + dates[dates.length - 1] : ''}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  $('csv').onclick = () => exportCsv();

    if (day) { $('date').value = day.dataset.day; view = 'day'; try { localStorage.setItem('2cw_master_view', view); } catch {} render(); return; }
    const de = e.target.closest('[data-dayedit]');

  // ── People picker (roster + typed names) ────────────────────────────────
  // Shows where else someone already has a responsibility, so leads can see
  // who's spoken for before adding them.
  function elsewhere(key, exceptId) {
    return projects.filter((p) => p.id !== exceptId && (p.fields.status || 'active') !== 'done' &&
      projectRoles(p.fields).some((r) => r.people.some((x) => personKey(x) === key))).map((p) => p.fields.name);
  }
  function personPicker(input, onPick, taken, exceptId) {
    const panel = input.nextElementSibling;
    let items = [], hl = 0;
    function draw() {
      const q = fold(input.value);
      const words = q.split(/\s+/).filter(Boolean);
      items = roster.filter((p) => !taken(personKey(p)) && words.every((w) => fold(p.name).includes(w))).slice(0, 60)
        .map((p) => ({ p, sub: elsewhere(personKey(p), exceptId) }));
      if (q && !roster.some((p) => fold(p.name) === q)) items.push({ p: { userId: '', name: input.value.trim() }, raw: true });
      hl = 0;
      panel.innerHTML = items.map((it, i) => `<button type="button" data-i="${i}" class="${i === hl ? 'hl' : ''}">${it.raw ? esc(fill(t(L.addTyped), { q: it.p.name })) : esc(it.p.name)}
        ${it.sub && it.sub.length ? `<span class="s">${esc(fill(t(L.onOther), { p: it.sub.join(', ') }))}</span>` : ''}</button>`).join('');
      panel.classList.toggle('on', !!items.length && document.activeElement === input);
    }
    const pick = (i) => { const it = items[i]; if (!it) return; input.value = ''; panel.classList.remove('on'); onPick(it.p); };
    input.addEventListener('focus', draw);
    input.addEventListener('input', draw);
    input.addEventListener('blur', () => setTimeout(() => panel.classList.remove('on'), 150));
    input.addEventListener('keydown', (e) => {
      const bs = panel.querySelectorAll('button');
      if (e.key === 'ArrowDown') { hl = Math.min(items.length - 1, hl + 1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { hl = Math.max(0, hl - 1); e.preventDefault(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (input.value.trim()) pick(hl); return; }
      else if (e.key === 'Escape') { panel.classList.remove('on'); return; }
      else return;
      bs.forEach((b, i) => b.classList.toggle('hl', i === hl));
      if (bs[hl]) bs[hl].scrollIntoView({ block: 'nearest' });
    });
    panel.addEventListener('mousedown', (e) => e.preventDefault());
    panel.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) pick(+b.dataset.i); });
  }

  // ── Projects list ───────────────────────────────────────────────────────
  let statusF = 'open';   // open = active + planned
  const STATUSES = [['active', L.stActive], ['planned', L.stPlanned], ['done', L.stDone]];
  $('status-seg').innerHTML = [['open', { en: 'Open', es: 'Abiertos' }], ...STATUSES, ['all', L.stAll]]
    .map(([k, l]) => `<button type="button" data-st="${k}">${esc(t(l))}</button>`).join('');
  $('status-seg').onclick = (e) => { const b = e.target.closest('button'); if (b) { statusF = b.dataset.st; render(); } };
  $('q').addEventListener('input', () => render());
  $('add').onclick = () => openEditor(null);

  let editing = null;   // {id|null, f: draft fields}
  const daysLabel = (f) => !(f.days && f.days.length) ? t(L.everyDay) : [...f.days].sort().map((d) => DOW[getLang() === 'es' ? 'es' : 'en'][d]).join(' ');
  function renderProjects() {
    document.querySelectorAll('#status-seg button').forEach((b) => b.classList.toggle('on', b.dataset.st === statusF));
    const q = fold($('q').value), qu = normUid($('q').value);
    const st = (p) => p.fields.status || 'active';
    let list = projects.filter((p) => statusF === 'all' || (statusF === 'open' ? st(p) !== 'done' : st(p) === statusF));
    if (q) list = list.filter((p) => {
      const f = p.fields;
      return fold(f.name).includes(q) || fold(locName(f)).includes(q) ||
        projectRoles(f).some((r) => fold(r.name).includes(q) || r.people.some((x) => fold(x.name).includes(q))) ||
        (f.contractors || []).some((c) => fold(c.name).includes(q)) ||
        (qu.length >= 4 && (f.uids || []).some((u) => normUid(u.uid).includes(qu)));
    });
    const order = { active: 0, planned: 1, done: 2 };
    list.sort((a, b) => order[st(a)] - order[st(b)] || locOrder(a.fields) - locOrder(b.fields) || String(a.fields.name).localeCompare(String(b.fields.name)));
    const cards = list.filter((p) => !editing || editing.id !== p.id).map(projectCard);
    const ed = editing ? editorHtml() : '';
    $('plist').innerHTML = !cards.length && !ed ? `<div class="empty"><p>${esc(t(L.noProj))}</p><button type="button" class="btn btn-gold" data-new="1">${esc(t(L.add))}</button></div>`
      : `<div class="grid">${ed}${cards.join('')}</div>`;

  // ── Project lead dropdown ───────────────────────────────────────────────
  // The Connecteam roster; a lead who isn't on it (typed in on an older
  // project, or since archived) stays selectable as they were saved.
  function leadOptions(lead) {
    const cur = lead && lead.name ? (lead.userId ? 'id:' + lead.userId : 'name:' + lead.name) : '';
    const list = roster.map((p) => ['id:' + p.userId, p.name]);
    if (cur && !list.some(([v]) => v === cur)) list.unshift([cur, lead.name]);
    return `<option value="">${esc(t(L.noLead))}</option>` +
      list.map(([v, n]) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(n)}</option>`).join('');
  }
  function leadFromValue(v, prev) {
    if (!v) return null;
    if (v.startsWith('id:')) { const p = roster.find((x) => x.userId === v.slice(3)); return p ? { userId: p.userId, name: p.name } : prev; }
    return { userId: '', name: v.slice(5) };
  }

  // Pull the typed-in values back into the draft before a re-render.
  function readEditor() {

    f.startTime = $('ed-ts').value; f.endTime = $('ed-te').value; f.notes = $('ed-notes').value;

  const rerender = () => { readEditor(); render(); };
  function wireEditor() {
    const f = editing.f;

      const b = e.target.closest('[data-dow]'); if (!b) return;

    const newShift = () => ({ id: newId(), count: '', startTime: '', endTime: '' });
    $('ed-addflc').onclick = () => { readEditor(); f.contractors.push({ id: newId(), name: '', shifts: [newShift()] }); render();
      const ins = document.querySelectorAll('[data-cname]'); if (ins.length) ins[ins.length - 1].focus(); };
    $('ed-flc').onclick = (e) => {
      const cd = e.target.closest('[data-cdel]');
      if (cd) { readEditor(); f.contractors.splice(+cd.dataset.cdel, 1); render(); return; }
      const sa = e.target.closest('[data-sadd]');
      if (sa) { readEditor(); f.contractors[+sa.dataset.sadd].shifts.push(newShift()); render(); return; }
      const sd = e.target.closest('[data-sdel]');

    };
    ['ed-ts', 'ed-te'].forEach((id) => $(id).addEventListener('change', rerender));
    document.querySelectorAll('[data-padd]').forEach((inp) => {
      const ri = +inp.dataset.padd;
      personPicker(inp, (person) => {
        readEditor();
        f.roles[ri].people.push({ userId: person.userId || '', name: person.name });
        render();
        const again = document.querySelector(`[data-padd="${ri}"]`); if (again) again.focus();
      }, (key) => f.roles[ri].people.some((x) => personKey(x) === key), editing.id);
    });
    $('ed-uids').onclick = (e) => { const b = e.target.closest('[data-udel]'); if (b) { readEditor(); f.uids.splice(+b.dataset.udel, 1); render(); } };
    const addUids = () => {
      const raw = $('ed-uidq').value;
      const toks = raw.split(/[\s,;]+/).map(normUid).filter(Boolean);
      if (!toks.length) return;
      if (toks.some((q) => q.length >= 4 && q.length < 10)) loadCanix();
      const left = [];
      let pickHtml = '';
      toks.forEach((q) => {
        if (f.uids.some((u) => u.uid === q)) return;
        if (q.length >= 10) { addUid(q); return; }
        if (q.length < 4) { left.push(q); return; }
        const hits = uidCandidates(q).filter((u) => !f.uids.some((x) => x.uid === u.uid));
        if (hits.length === 1) addUid(hits[0].uid, hits[0].strain);
        else {
          left.push(q);
          pickHtml += hits.length ? `<div class="hint">${esc(fill(t(L.uidPick), { q }))}</div>` + hits.slice(0, 12).map((u) =>
            `<button type="button" data-upick="${esc(u.uid)}" data-ustrain="${esc(u.strain || '')}"><span class="m">${esc(u.uid)}</span> <span class="s">${esc(u.strain || '')}</span></button>`).join('')
            : `<div class="hint">${esc(fill(t(L.uidNone), { q }))}</div>`;
        }
      });
      readEditor(); render();
      $('ed-uidq').value = left.join(' ');
      $('ed-uidm').innerHTML = pickHtml;
      $('ed-uidq').focus();
    };
    const addUid = (uid, strain) => { if (!f.uids.some((u) => u.uid === uid)) f.uids.push({ uid, strain: strain || (uidIndex.get(uid) || {}).strain || '', addedAt: localDay(), addedBy: me }); };
    $('ed-uidadd').onclick = addUids;
    $('ed-uidq').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addUids(); } };
    $('ed-uidm').onclick = (e) => {
      const b = e.target.closest('[data-upick]'); if (!b) return;
      readEditor(); addUid(b.dataset.upick, b.dataset.ustrain);
      const q = normUid($('ed-uidq').value);
      render();
      $('ed-uidq').value = q.length && b.dataset.upick.endsWith(q) ? '' : q;
    };
    $('ed-cancel').onclick = () => { editing = null; history.replaceState(null, '', location.pathname + '?tab=projects'); render(); };
    if ($('ed-rm')) $('ed-rm').onclick = async () => {
      if (!confirm(t(L.removeQ))) return;
      try {
        await patchProject(editing.id, (fx) => ({ ...fx, voided: true, voidedBy: me, voidedAt: new Date().toISOString() }));
        editing = null; toast(t(L.removed)); render();
      } catch (err) { $('ed-err').textContent = `${t(L.failed)} ${err.message || err}`; }
    };
    $('ed-save').onclick = saveEditor;
  }
  async function saveEditor() {
    readEditor();
    const f = editing.f;
    f.name = f.name.trim(); f.locationName = (f.locationName || '').trim();
    f.roles.forEach((r) => { r.name = r.name.trim(); });
    // A blank row nobody filled in is just dropped.
    f.roles = f.roles.filter((r) => r.name || r.people.length || r.process || r.startTime || r.endTime);
    f.contractors.forEach((c) => { c.name = c.name.trim(); c.shifts = c.shifts.filter((x) => x.count !== '' || x.startTime || x.endTime); });
    f.contractors = f.contractors.filter((c) => c.name || c.shifts.length);
    const problem = !f.name ? L.needName : !f.location || (f.location === 'other' && !f.locationName) ? L.needLoc
      : !f.start ? L.needStart : f.end && f.end < f.start ? L.badEnd : f.roles.some((r) => !r.name) ? L.needRole
      : f.contractors.some((c) => !c.name) ? L.needFlcName
      : f.contractors.some((c) => !c.shifts.length || c.shifts.some((x) => !(Math.round(Number(x.count)) >= 1))) ? L.needFlcCount : null;
    if (problem) { $('ed-err').textContent = t(problem); return; }
    if (!client) { $('ed-err').textContent = t(L.noDb); return; }
    const out = {
      name: f.name, location: f.location, locationName: f.location === 'other' ? f.locationName : '', process: f.process || '',
      status: f.status || 'active', start: f.start, end: f.end || '', days: [...f.days].sort(), startTime: f.startTime || '', endTime: f.startTime ? f.endTime || '' : '',
      lead: f.lead && f.lead.name ? { userId: f.lead.userId || '', name: f.lead.name } : null,
      // A responsibility's start/end are kept only where they differ from the project's.
      roles: f.roles.map((r) => ({ id: r.id || newId(), name: r.name, process: r.process || '',
                                   startTime: r.startTime && r.startTime !== f.startTime ? r.startTime : '',
                                   endTime: r.endTime && r.endTime !== f.endTime ? r.endTime : '',
                                   people: r.people.map((x) => ({ userId: x.userId || '', name: x.name })) })),
      // Contractor crews by headcount; times, like a responsibility's, only where they differ.
      contractors: f.contractors.map((c) => ({ id: c.id || newId(), name: c.name,
                                               shifts: c.shifts.map((x) => ({ id: x.id || newId(), count: Math.round(Number(x.count)),
                                                 startTime: x.startTime && x.startTime !== f.startTime ? x.startTime : '',
                                                 endTime: x.endTime && x.endTime !== f.endTime ? x.endTime : '' })) })),

    try {
      if (editing.id) {

        await patchProject(editing.id, (fx) => ({ ...fx, ...out }));
      } else {
        const { data, error } = await client.from('operations_forms').insert({
          station_key: KEY, status: 'submitted', owner_user: me || null, updated_by: me || null, work_date: out.start,
          submitted_at: new Date().toISOString(), fields: { ...out, overrides: {}, createdBy: me, updatedBy: me }
        }).select();
        if (error) throw error;

      }
      editing = null; toast(t(L.saved));

    } catch (err) { $('ed-err').textContent = `${t(L.failed)} ${err.message || err}`; btn.disabled = false; btn.textContent = t(L.save); }
  }

  // UIDs seen at the stations in the last 60 days (and active Canix packages,
  // once someone types a short tag) — for adding by the last 4.
  const uidIndex = new Map();
  let uidLoaded = false, canix = null, canixLoading = false;
  async function loadUidIndex() {
    if (uidLoaded || !client) return;
    uidLoaded = true;
    const since = addDays(localDay(), -60);
    for (let page = 0; page < 6; page++) {
      const { data, error } = await client.from('operations_forms').select('strain,fields,work_date')
        .gte('work_date', since).not('station_key', 'in', '(buck_submission,buck_box,buck_batch_close,labor_entry,work_project,work_schedule,cost_settings)')
        .order('work_date', { ascending: false }).range(page * 1000, page * 1000 + 999);
      if (error || !data) break;
      data.forEach((r) => {
        const f = r.fields || {};
        const note = (raw, strain) => { const u = normUid(raw); if (u.length >= 4 && !uidIndex.has(u)) uidIndex.set(u, { uid: u, strain: strain || '' }); };
        ['sourceUid', 'batchTag', 'newBuckedUid', 'newBigLeafUid', 'incomingUid'].forEach((k) => f[k] && note(f[k], r.strain || f.strain));
        (f.lines || []).forEach((ln) => ln && ln.sourceUid && note(ln.sourceUid, ln.strain || r.strain));
      });
      if (data.length < 1000) break;
    }
  }
  function loadCanix() {
    if (canix || canixLoading) return;
    canixLoading = true;
    fetch(DATA_BASE + 'canix_inventory.json?t=' + Date.now()).then((r) => r.ok ? r.json() : []).catch(() => []).then((rows) => {
      canix = (rows || []).filter((p) => p && p.tag && p.is_active !== false)
        .map((p) => ({ uid: normUid(p.tag), strain: ((p.item || {}).strain || {}).name || '' }));
      canixLoading = false;
    });
  }
  function uidCandidates(q) {
    const out = [...uidIndex.values()].filter((u) => u.uid.endsWith(q));
    if (canix) canix.forEach((p) => { if (p.uid.endsWith(q) && !out.some((x) => x.uid === p.uid)) out.push(p); });
    return out;
  }

  // ── Image (PNG) of the current day/week ─────────────────────────────────
  // Drawn straight onto a canvas, white background, for texting: each day a
  // section of project blocks — orange header with the location, project and
  // hours, the day's note in red, then each responsibility and its people
  // (leads in green).
  async function makeImage() {
    const dates = view === 'week' ? weekDates() : [$('date').value || localDay()];
    const days = dates.map((d) => ({ d, ps: projects.filter((p) => runsOn(p, d)).sort((a, b) => locOrder(a.fields) - locOrder(b.fields)) })).filter((x) => x.ps.length);
    if (!days.length) { toast(t(L.nothingImg)); return; }
    try { await document.fonts.ready; } catch {}
    const W = 1080, PAD = 36, GAP = 16, COLS = 3;
    const colW = (W - PAD * 2 - GAP * (COLS - 1)) / COLS;
    const SANS = "'DM Sans', Arial, sans-serif", HEAD = "'Bebas Neue', 'Arial Narrow', Arial, sans-serif", MONO = "'DM Mono', Menlo, monospace";
    const C = { ink: '#16181d', sub: '#5b6170', line: '#e3e5ea', orange: '#e08a3c', red: '#c62828', redBg: '#fdecea', green: '#1f8a52', gold: '#9a6b12', paper: '#ffffff' };
    const cv = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    const wrap = (text, font, maxW) => {
      ctx.font = font;
      const out = [];
      String(text || '').split('\n').forEach((para) => {
        let line = '';
        para.split(/\s+/).forEach((w) => {
          const test = line ? line + ' ' + w : w;
          if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
        });
        out.push(line);
      });
      return out;
    };
    const F = { title: `400 54px ${HEAD}`, range: `500 24px ${SANS}`, day: `400 40px ${HEAD}`, loc: `400 30px ${HEAD}`, proj: `700 20px ${SANS}`,
                time: `500 18px ${MONO}`, note: `500 19px ${SANS}`, role: `500 15px ${MONO}`, name: `400 21px ${SANS}`, lead: `700 21px ${SANS}`, foot: `400 16px ${SANS}` };
    function block(p, d, conf) {
      const f = p.fields, inner = colW - 28;
      const { roles, note } = dayRoles(f, d);
      const locLines = wrap(locName(f).toUpperCase(), F.loc, inner);
      const projLines = wrap(f.name, F.proj, inner);
      const headH = 12 + locLines.length * 32 + projLines.length * 24 + 26;
      const notes = note ? wrap(note, F.note, inner - 12) : [];
      const rs = roles.filter((r) => r.people.length).map((r) => ({ r, label: (r.name + (r.startTime || r.endTime ? '  ' + hoursLabel(f, r) : '')).toUpperCase(),
        people: r.people.map((x) => ({ x, conflict: conf.has(personKey(x) + '|' + p.id), lines: wrap(x.name + (x.lead ? ` — ${t(L.lead)}` : ''), x.lead ? F.lead : F.name, inner - 30) })) }));
      const fl = projectFlc(f, d);
      if (fl.length) rs.push({ label: t(L.flc).toUpperCase(), people: fl.map((x) => ({ x: {}, conflict: false, lines: wrap(`${x.name} ×${x.count} · ${x.label}`, F.name, inner - 30) })) });
      let h = headH + 12 + (notes.length ? notes.length * 26 + 26 : 0);
      rs.forEach((r) => { h += 24; r.people.forEach((x) => { h += x.lines.length * 28 + 2; }); h += 8; });
      return { f, locLines, projLines, headH, notes, rs, h: h + 6 };
    }
    const sections = days.map((day) => {
      const conf = conflictsOn(day.d);
      const blocks = day.ps.map((p) => block(p, day.d, conf));
      const rowsOf = [];
      for (let i = 0; i < blocks.length; i += COLS) rowsOf.push(blocks.slice(i, i + COLS));
      return { d: day.d, rowsOf, h: 64 + rowsOf.reduce((a, row) => a + Math.max(...row.map((b) => b.h)) + GAP, 0) };
    });
    const headH = 130, footH = 60;
    const H = headH + sections.reduce((a, s) => a + s.h + 18, 0) + footH;
    cv.width = W; cv.height = Math.ceil(H);
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.fillStyle = C.ink; ctx.font = F.title; ctx.fillText(t(L.imgTitle).toUpperCase(), PAD, PAD - 4);
    ctx.fillStyle = C.sub; ctx.font = F.range;
    ctx.fillText(dates.length === 1 ? fmtDate(dates[0], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })
      : `${fmtDate(dates[0], { weekday: 'short', month: 'short', day: 'numeric' })} – ${fmtDate(dates[6], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`, PAD, PAD + 56);
    const rr = (x, yy, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, yy, w, h, r) : ctx.rect(x, yy, w, h); };
    let y = headH;
    sections.forEach((sec) => {
      ctx.fillStyle = C.ink; ctx.font = F.day;
      ctx.fillText(fmtDate(sec.d, { weekday: 'long', month: 'short', day: 'numeric' }).toUpperCase(), PAD, y + 8);
      ctx.fillStyle = C.line; ctx.fillRect(PAD, y + 54, W - PAD * 2, 2);
      y += 64;
      sec.rowsOf.forEach((row) => {
        const rowH = Math.max(...row.map((b) => b.h));
        row.forEach((b, i) => {
          const x = PAD + i * (colW + GAP);
          ctx.fillStyle = C.paper; ctx.strokeStyle = C.line; ctx.lineWidth = 2;
          rr(x, y, colW, rowH, 10); ctx.fill(); ctx.stroke();
          ctx.save(); rr(x, y, colW, rowH, 10); ctx.clip(); ctx.fillStyle = C.orange; ctx.fillRect(x, y, colW, b.headH); ctx.restore();
          ctx.fillStyle = '#000';
          let hy = y + 12;
          ctx.font = F.loc; b.locLines.forEach((ln) => { ctx.fillText(ln, x + 14, hy); hy += 32; });
          ctx.font = F.proj; b.projLines.forEach((ln) => { ctx.fillText(ln, x + 14, hy); hy += 24; });
          ctx.font = F.time; ctx.fillText(hoursLabel(b.f), x + 14, hy + 2);
          let yy = y + b.headH + 12;
          if (b.notes.length) {
            const nh = b.notes.length * 26 + 16;
            ctx.fillStyle = C.redBg; rr(x + 14, yy, colW - 28, nh, 6); ctx.fill();
            ctx.fillStyle = C.red; ctx.fillRect(x + 14, yy, 4, nh);
            ctx.font = F.note; b.notes.forEach((ln, k) => ctx.fillText(ln, x + 26, yy + 8 + k * 26));
            yy += nh + 10;
          }
          b.rs.forEach((r) => {
            ctx.fillStyle = C.gold; ctx.font = F.role; ctx.fillText(r.label, x + 14, yy + 4); yy += 24;
            r.people.forEach((pp) => {
              ctx.fillStyle = pp.x.lead ? C.green : C.ink; ctx.font = pp.x.lead ? F.lead : F.name;
              pp.lines.forEach((ln, k) => {
                ctx.fillText(ln, x + 14, yy + k * 28);
                if (k === 0 && pp.conflict) { const c0 = ctx.fillStyle; ctx.fillStyle = C.red; ctx.fillText('⚠', x + 14 + ctx.measureText(ln).width + 6, yy); ctx.fillStyle = c0; }
              });
              yy += pp.lines.length * 28 + 2;
            });
            yy += 8;
          });
        });
        y += rowH + GAP;
      });
      y += 18;
    });
    ctx.fillStyle = C.sub; ctx.font = F.foot;
    ctx.fillText(`2CW · ${fill(t(L.imgMade), { t: new Date().toLocaleString(lang(), { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) })}`, PAD, H - footH + 18);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
    showImage(blob, `schedule-${dates[0]}${dates.length > 1 ? '_to_' + dates[dates.length - 1] : ''}.png`);
  }
  let imgUrl = null, imgFile = null;
  function showImage(blob, name) {
    if (imgUrl) URL.revokeObjectURL(imgUrl);
    imgUrl = URL.createObjectURL(blob);
    imgFile = new File([blob], name, { type: 'image/png' });
    $('img-preview').src = imgUrl;
    $('img-name').textContent = name;
    $('img-dl').href = imgUrl; $('img-dl').download = name; $('img-dl').textContent = t(L.download);
    $('img-close').textContent = t(L.close);
    $('img-hint').textContent = t(L.imgHint);
    $('img-share').hidden = !(navigator.canShare && navigator.canShare({ files: [imgFile] }));
    $('img-share').textContent = t(L.share);
    $('img-bg').classList.add('on');
  }
  $('img-share').onclick = async () => {
    try { await navigator.share({ files: [imgFile], title: t(L.imgTitle) }); } catch (e) { if (e && e.name !== 'AbortError') toast(String(e.message || e)); }
  };
  $('img-close').onclick = () => $('img-bg').classList.remove('on');
  $('img-bg').addEventListener('click', (e) => { if (e.target === $('img-bg')) $('img-bg').classList.remove('on'); });
  $('png').onclick = () => view === 'timeline' ? makeTimelineImage() : makeImage();

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('on'), 2500);
  }
  function render() {
    if (!client) { $('board').innerHTML = $('plist').innerHTML = `<div class="empty">${esc(t(L.noDb))}</div>`; return; }
    if (tab === 'schedule') renderSchedule(); else renderProjects();
  }

  $('board').innerHTML = $('plist').innerHTML = `<div class="empty">${esc(t(L.loading))}</div>`;
  await loadProjects();
  showTab(tab);
  if (params.get('id')) openEditor(params.get('id'));
  loadLabor().then(() => { if (tab === 'projects' && !editing) render(); });
})();
</script>
</body>
</html>
