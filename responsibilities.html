<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Responsibilities Matrix — 2CW</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0c0d0f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;--border2:rgba(255,255,255,.11);
    --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;--slate:#7d8899;
    --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.35;pointer-events:none;z-index:0}
  a{color:inherit}
  .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
  .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
  .hdr-div{width:1px;height:18px;background:var(--border)}
  .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);flex:1}

  main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 16px 100px}

  .btn{padding:.6rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text)}
  .btn-purple{background:var(--purple);color:#000;border-color:var(--purple)}
  .btn-purple:hover{opacity:.88}
  .btn-green{background:var(--green);color:#000;border-color:var(--green)}
  .btn-green:hover{opacity:.88}
  .btn-ghost{color:var(--subtext)}
  .btn-ghost:hover{border-color:var(--muted);color:var(--text)}
  .btn-danger{color:var(--red);border-color:rgba(239,83,80,.35)}
  .btn-danger:hover{border-color:var(--red)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sm{padding:.32rem .6rem;font-size:.62rem}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.03em}
  .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
  .status-line{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);margin-bottom:16px;min-height:1.2em}
  .status-line b{color:var(--text)}

  .summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .summary-tile{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
  .summary-tile .n{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1}
  .summary-tile .lbl{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);margin-top:2px}
  .summary-tile.unassigned .n{color:var(--red)}
  .summary-tile.needs_backup .n{color:var(--gold)}
  .summary-tile.assigned .n{color:var(--green)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  select, input[type=text], input[type=search], input[type=date], textarea{
    background:#0c0d0f;border:1px solid var(--border);color:var(--text);
    padding:.55rem .7rem;border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--purple)}
  .filters select{font-family:'DM Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
  .search-wrap{flex:1;min-width:180px}
  .search-wrap input{width:100%}

  .area-section{margin-bottom:26px}
  .area-hd{display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;user-select:none}
  .area-hd h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.03em}
  .area-hd .chev{color:var(--muted);font-size:.7rem;transition:transform .15s}
  .area-hd.collapsed .chev{transform:rotate(-90deg)}
  .area-progress{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--subtext);white-space:nowrap}
  .area-bar{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;max-width:220px}
  .area-bar-fill{height:100%;background:var(--green)}
  .area-body.collapsed{display:none}

  .resp-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
  .resp-row{border-bottom:1px solid var(--border)}
  .resp-row:last-child{border-bottom:none}
  .resp-main{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer}
  .resp-main:hover{background:var(--surface2)}
  .status-dot{flex:none;width:11px;height:11px;border-radius:50%;margin-top:4px;border:2px solid var(--border)}
  .status-dot.unassigned{background:transparent;border-color:var(--red)}
  .status-dot.needs_backup{background:var(--gold);border-color:var(--gold)}
  .status-dot.assigned{background:var(--green);border-color:var(--green)}
  .resp-body{flex:1;min-width:0}
  .resp-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .resp-title{font-size:.92rem;font-weight:500}
  .resp-meta{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--subtext)}
  .tag{display:inline-block;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--subtext)}
  .tag.status-unassigned{color:var(--red);border-color:rgba(239,83,80,.35)}
  .tag.status-needs_backup{color:var(--gold);border-color:rgba(212,168,67,.35)}
  .tag.status-assigned{color:var(--green);border-color:rgba(61,184,122,.35)}
  .tag.prio-high{color:var(--red)}
  .tag.prio-medium{color:var(--gold)}
  .tag.prio-low{color:var(--subtext)}
  .owner-name{color:var(--text)}
  .owner-missing{color:var(--red)}
  .resp-actions{flex:none;display:flex;gap:6px;align-items:flex-start;padding-top:2px}
  .resp-actions button{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--subtext);padding:.28rem .55rem;border-radius:6px;cursor:pointer}
  .resp-actions button:hover{border-color:var(--purple);color:var(--purple)}
  .chev-btn{color:var(--muted);font-size:.7rem;padding-top:6px;transition:transform .15s}
  .chev-btn.open{transform:rotate(90deg)}

  .resp-detail{display:none;padding:0 14px 16px 37px;border-top:1px dashed var(--border)}
  .resp-detail.open{display:block}
  .resp-desc{font-size:.82rem;color:var(--subtext);margin:12px 0 8px;max-width:70ch;line-height:1.5}
  .resp-notes{font-size:.8rem;color:var(--subtext);margin:8px 0;max-width:70ch;line-height:1.5}
  .resp-notes b{color:var(--text)}
  .resp-backup{font-size:.8rem;margin:8px 0}
  .resp-backup b{color:var(--text)}

  .empty-note{color:var(--subtext);font-size:.85rem;padding:30px;text-align:center}

  /* editor overlay */
  #editor-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:24px;overflow-y:auto}
  #editor{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:560px;margin:0 auto;padding:28px}
  #editor h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em;margin-bottom:18px}
  .field-label{display:block;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.35rem}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .form-row.full{grid-template-columns:1fr}
  .form-row select, .form-row input, .form-row textarea{width:100%}
  textarea{resize:vertical;min-height:64px;font-family:'DM Sans',sans-serif}
  .editor-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
  .editor-actions .right{display:flex;gap:10px}
  .hint{font-size:.72rem;color:var(--muted);margin:-8px 0 14px}

  .import-log{font-family:'DM Mono',monospace;font-size:.72rem;line-height:1.7;max-height:220px;overflow-y:auto;background:#0c0d0f;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:12px 0}
  #csv-input{display:none}

  @media (max-width:720px){
    .form-row{grid-template-columns:1fr}
    .resp-meta{gap:6px}
  }
</style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand">Responsibilities Matrix</div>
</header>

<main>
  <div class="toolbar">
    <h1>Responsibilities</h1>
    <div class="toolbar-actions">
      <input type="file" id="csv-input" accept=".csv" onchange="handleCsvFile(event)"/>
      <button class="btn btn-ghost" onclick="document.getElementById('csv-input').click()">Upload CSV</button>
      <button class="btn btn-ghost" onclick="downloadCsv()">Download CSV</button>
      <button class="btn btn-purple" onclick="openEditor(null)">+ Add Responsibility</button>
    </div>
  </div>
  <div class="status-line" id="status-line">Loading…</div>
  <div id="import-result"></div>

  <div class="summary-row" id="summary-row"></div>

  <div class="filters">
    <select id="f-area" onchange="render()">
      <option value="">All areas</option>
    </select>
    <select id="f-status" onchange="render()">
      <option value="">All statuses</option>
      <option value="unassigned">Unassigned</option>
      <option value="assigned">Assigned</option>
      <option value="needs_backup">Needs backup</option>
    </select>
    <div class="search-wrap"><input type="text" id="f-search" placeholder="Search responsibilities or owners…" oninput="render()"/></div>
  </div>

  <div id="list-wrap"></div>
</main>

<div id="editor-backdrop">
  <div id="editor"></div>
</div>

<script src="/config/supabase_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const STATUS_LABELS = { unassigned: 'Unassigned', assigned: 'Assigned', needs_backup: 'Needs backup' };
const STATUS_ORDER = ['unassigned', 'needs_backup', 'assigned'];

let client = null;
if (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL) {
  client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let items = [];          // flat list of responsibility rows
let openIds = new Set();
let collapsedAreas = new Set();
let editingId = null;    // row id being edited, or null for new

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function requireClient(){
  if(!client) throw new Error('Supabase is not configured (config/supabase_config.js is blank).');
  return client;
}

// Areas in seed/authoring order (falls back to whatever's in the data for
// any area a CSV import introduces that isn't in this list).
const AREA_ORDER = [
  'Land & Leases', 'Licensing & Compliance', 'Nursery', 'Cultivation',
  'Harvest & Post-Harvest', 'Processing Facility (Adobe)', 'Transportation & Logistics',
  'Manufacturing', 'Distribution (Airway)', 'Sales & Operations Planning', 'Systems & ERP (Canix)'
];
function areaOrder(){
  const seen = new Set(items.map(i => i.area || 'Unassigned Area'));
  const known = AREA_ORDER.filter(a => seen.has(a));
  const extra = [...seen].filter(a => !AREA_ORDER.includes(a)).sort();
  return [...known, ...extra];
}

// ── Load ──────────────────────────────────────────────────────────────────
async function loadAll(){
  const status = document.getElementById('status-line');
  status.textContent = 'Loading responsibilities…';
  try{
    const c = await requireClient();
    const { data, error } = await c.from('responsibilities').select('*')
      .order('sort_order', { ascending: true }).order('created_at', { ascending: true });
    if(error) throw error;
    items = data || [];
    populateAreaFilter();
    updateStatusLine();
    render();
  }catch(e){
    status.textContent = 'Could not load responsibilities: ' + e.message;
    document.getElementById('list-wrap').innerHTML = '';
  }
}

function populateAreaFilter(){
  const sel = document.getElementById('f-area');
  const current = sel.value;
  sel.innerHTML = '<option value="">All areas</option>' +
    areaOrder().map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
  sel.value = current;
}

function updateStatusLine(){
  const status = document.getElementById('status-line');
  const unassigned = items.filter(i=>i.status==='unassigned').length;
  const needsBackup = items.filter(i=>i.status==='needs_backup').length;
  status.innerHTML = `<b>${items.length}</b> responsibilities across <b>${areaOrder().length}</b> areas`;

  const summary = document.getElementById('summary-row');
  const assigned = items.filter(i=>i.status==='assigned').length;
  summary.innerHTML = `
    <div class="summary-tile unassigned"><div class="n">${unassigned}</div><div class="lbl">Unassigned</div></div>
    <div class="summary-tile needs_backup"><div class="n">${needsBackup}</div><div class="lbl">Needs backup</div></div>
    <div class="summary-tile assigned"><div class="n">${assigned}</div><div class="lbl">Fully assigned</div></div>
  `;
}

// ── Render ────────────────────────────────────────────────────────────────
function matchesFilters(i){
  const fArea = document.getElementById('f-area').value;
  const fStatus = document.getElementById('f-status').value;
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  if(fArea && (i.area || '') !== fArea) return false;
  if(fStatus && i.status !== fStatus) return false;
  if(q){
    const hay = (i.title+' '+(i.description||'')+' '+(i.owner||'')+' '+(i.backup_owner||'')+' '+(i.notes||'')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const wrap = document.getElementById('list-wrap');
  if(!items.length){
    wrap.innerHTML = '<div class="empty-note">No responsibilities yet. Add one, or upload a CSV to get started.</div>';
    return;
  }
  const filtered = items.filter(matchesFilters);
  const byArea = {};
  areaOrder().forEach(a => byArea[a] = []);
  filtered.forEach(i => {
    const a = i.area || 'Unassigned Area';
    (byArea[a] = byArea[a] || []).push(i);
  });

  let html = '';
  Object.keys(byArea).forEach(a => {
    const list = byArea[a];
    if(!list.length) return;
    const assigned = list.filter(i=>i.status==='assigned').length;
    const pct = list.length ? Math.round(assigned/list.length*100) : 0;
    const collapsed = collapsedAreas.has(a);
    html += `
      <div class="area-section">
        <div class="area-hd ${collapsed?'collapsed':''}" onclick="toggleArea('${esc(a).replace(/'/g,"\\'")}')">
          <span class="chev">▾</span>
          <h2>${esc(a)}</h2>
          <div class="area-bar"><div class="area-bar-fill" style="width:${pct}%"></div></div>
          <div class="area-progress">${assigned}/${list.length} assigned</div>
        </div>
        <div class="area-body ${collapsed?'collapsed':''}">
          <div class="resp-list">${list.map(respRowHtml).join('')}</div>
        </div>
      </div>`;
  });
  wrap.innerHTML = html || '<div class="empty-note">No responsibilities match these filters.</div>';
}

function toggleArea(a){
  if(collapsedAreas.has(a)) collapsedAreas.delete(a); else collapsedAreas.add(a);
  render();
}

function respRowHtml(i){
  const open = openIds.has(i.id);
  return `
    <div class="resp-row" data-id="${i.id}">
      <div class="resp-main" onclick="toggleRow('${i.id}')">
        <span class="chev-btn ${open?'open':''}">▸</span>
        <span class="status-dot ${i.status}" title="${esc(STATUS_LABELS[i.status])}" onclick="event.stopPropagation();cycleStatus('${i.id}')"></span>
        <div class="resp-body">
          <div class="resp-title-row">
            <span class="resp-title">${esc(i.title)}</span>
            <span class="tag status-${i.status}">${esc(STATUS_LABELS[i.status])}</span>
            ${i.priority ? `<span class="tag prio-${i.priority}">${esc(i.priority)}</span>` : ''}
          </div>
          <div class="resp-meta">
            <span class="${i.owner ? 'owner-name' : 'owner-missing'}">${i.owner ? esc(i.owner) : 'No owner assigned'}</span>
            ${i.backup_owner ? `<span>Backup: ${esc(i.backup_owner)}</span>` : ''}
          </div>
        </div>
        <div class="resp-actions" onclick="event.stopPropagation()">
          <button onclick="openEditor('${i.id}')">Edit</button>
          <button onclick="deleteItem('${i.id}')">Delete</button>
        </div>
      </div>
      <div class="resp-detail ${open?'open':''}">
        ${i.description ? `<div class="resp-desc">${esc(i.description)}</div>` : ''}
        <div class="resp-backup"><b>Owner:</b> ${i.owner ? esc(i.owner) : '—'} &nbsp;·&nbsp; <b>Backup:</b> ${i.backup_owner ? esc(i.backup_owner) : '—'}</div>
        ${i.notes ? `<div class="resp-notes"><b>Notes:</b> ${esc(i.notes)}</div>` : ''}
      </div>
    </div>`;
}

function toggleRow(id){
  if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
  render();
}

async function cycleStatus(id){
  const i = items.find(x=>x.id===id);
  if(!i) return;
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(i.status)+1) % STATUS_ORDER.length];
  i.status = next;
  render();
  try{
    const c = await requireClient();
    const { error } = await c.from('responsibilities').update({ status: next }).eq('id', id);
    if(error) throw error;
    updateStatusLine();
  }catch(e){ alert('Could not update status: ' + e.message); loadAll(); }
}

async function deleteItem(id){
  if(!confirm('Delete this responsibility?')) return;
  try{
    const c = await requireClient();
    const { error } = await c.from('responsibilities').delete().eq('id', id);
    if(error) throw error;
    items = items.filter(i=>i.id!==id);
    populateAreaFilter();
    updateStatusLine();
    render();
  }catch(e){ alert('Could not delete: ' + e.message); }
}

// ── Editor ────────────────────────────────────────────────────────────────
function statusOptionsHtml(current){
  return STATUS_ORDER.map(s => `<option value="${s}" ${current===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('');
}

function openEditor(id){
  editingId = id;
  const i = id ? items.find(x=>x.id===id) : null;
  const areaListId = 'area-datalist';
  document.getElementById('editor').innerHTML = `
    <h2>${i ? 'Edit Responsibility' : 'Add Responsibility'}</h2>
    <div class="form-row full"><div><label class="field-label">Title</label><input type="text" id="ed-title" value="${esc(i?i.title:'')}"/></div></div>
    <div class="form-row full">
      <div>
        <label class="field-label">Area</label>
        <input type="text" id="ed-area" list="${areaListId}" value="${esc(i?i.area:'')}" placeholder="e.g. Cultivation"/>
        <datalist id="${areaListId}">${areaOrder().map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
      </div>
    </div>
    <div class="form-row full"><div><label class="field-label">Description</label><textarea id="ed-desc">${esc(i?i.description:'')}</textarea></div></div>
    <div class="form-row">
      <div><label class="field-label">Owner</label><input type="text" id="ed-owner" value="${esc(i?i.owner:'')}"/></div>
      <div><label class="field-label">Backup owner</label><input type="text" id="ed-backup" value="${esc(i?i.backup_owner:'')}"/></div>
    </div>
    <div class="form-row">
      <div><label class="field-label">Status</label>
        <select id="ed-status">${statusOptionsHtml(i?i.status:'unassigned')}</select>
      </div>
      <div><label class="field-label">Priority</label>
        <select id="ed-priority">
          <option value="">None</option>
          <option value="high" ${i&&i.priority==='high'?'selected':''}>High</option>
          <option value="medium" ${i&&i.priority==='medium'?'selected':''}>Medium</option>
          <option value="low" ${i&&i.priority==='low'?'selected':''}>Low</option>
        </select>
      </div>
    </div>
    <div class="hint">Status updates automatically to "Assigned" once both an owner and backup are set — you can still override it above.</div>
    <div class="form-row full"><div><label class="field-label">Notes</label><textarea id="ed-notes">${esc(i?i.notes:'')}</textarea></div></div>
    <div class="editor-actions">
      <div>${i ? '<button class="btn btn-danger" onclick="deleteItem(\''+i.id+'\'); closeEditor();">Delete</button>' : ''}</div>
      <div class="right">
        <button class="btn btn-ghost" onclick="closeEditor()">Cancel</button>
        <button class="btn btn-purple" onclick="saveEditor()">Save</button>
      </div>
    </div>
  `;
  document.getElementById('editor-backdrop').style.display = 'block';
  document.getElementById('editor-backdrop').scrollTop = 0;
  setTimeout(()=>document.getElementById('ed-title').focus(), 50);
}

function closeEditor(){
  document.getElementById('editor-backdrop').style.display = 'none';
  editingId = null;
}

async function saveEditor(){
  const title = document.getElementById('ed-title').value.trim();
  const area = document.getElementById('ed-area').value.trim();
  if(!title){ alert('Enter a title.'); return; }
  if(!area){ alert('Enter an area.'); return; }
  const owner = document.getElementById('ed-owner').value.trim() || null;
  const backup_owner = document.getElementById('ed-backup').value.trim() || null;
  let status = document.getElementById('ed-status').value;
  // Nudge status toward reality: two names filled in and still marked
  // unassigned almost always just means nobody flipped the dropdown.
  if(status === 'unassigned' && owner && backup_owner) status = 'assigned';
  else if(status === 'unassigned' && owner && !backup_owner) status = 'needs_backup';
  const payload = {
    title,
    area,
    description: document.getElementById('ed-desc').value.trim() || null,
    owner,
    backup_owner,
    status,
    priority: document.getElementById('ed-priority').value || null,
    notes: document.getElementById('ed-notes').value.trim() || null
  };
  const btn = document.querySelector('#editor .btn-purple');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const c = await requireClient();
    if(editingId){
      const { error } = await c.from('responsibilities').update(payload).eq('id', editingId);
      if(error) throw error;
    }else{
      payload.source = 'manual';
      const { error } = await c.from('responsibilities').insert(payload);
      if(error) throw error;
    }
    closeEditor();
    await loadAll();
  }catch(e){
    alert('Could not save: ' + e.message);
    btn.disabled = false; btn.textContent = 'Save';
  }
}

// ── CSV upload/download ────────────────────────────────────────────────
// Proper CSV parser (handles quoted fields with embedded commas/newlines).
function parseCsvText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).filter(r => r.some(v => v.trim())).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i]||'').trim());
    return obj;
  });
}

function statusFromCsv(raw, owner, backup){
  const s = (raw||'').trim().toLowerCase().replace(/\s+/g,'_');
  if(['assigned','done','complete'].includes(s)) return 'assigned';
  if(['needs_backup','needs backup'].includes(s)) return 'needs_backup';
  if(s === 'unassigned') return 'unassigned';
  if(owner && backup) return 'assigned';
  if(owner && !backup) return 'needs_backup';
  return 'unassigned';
}
function priorityFromCsv(raw){
  const s = (raw||'').trim().toLowerCase();
  if(s === 'high' || s === 'medium' || s === 'low') return s;
  return null;
}

function rowToItem(row){
  const title = row['title'] || row['responsibility'] || '';
  const area = row['area'] || '';
  if(!title || !area) return null;
  const owner = row['owner'] || null;
  const backup_owner = row['backup_owner'] || row['backup owner'] || null;
  return {
    title, area,
    description: row['description'] || null,
    owner, backup_owner,
    status: statusFromCsv(row['status'], owner, backup_owner),
    priority: priorityFromCsv(row['priority']),
    notes: row['notes'] || null
  };
}

async function handleCsvFile(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const out = document.getElementById('import-result');
  out.innerHTML = '<div class="import-log">Reading file…</div>';
  const text = await file.text();
  const rows = parseCsvText(text).map(rowToItem).filter(Boolean);
  if(!rows.length){ out.innerHTML = '<div class="import-log" style="color:var(--red)">No usable rows found — need at least "area" and "title" columns.</div>'; return; }
  if(!confirm(`Import ${rows.length} responsibilit${rows.length===1?'y':'ies'}? Existing rows with a matching area + title will be updated, not duplicated.`)) { out.innerHTML=''; return; }

  try{
    const c = await requireClient();
    const existingByKey = {};
    items.forEach(i => { existingByKey[(i.area+'::'+i.title).trim().toLowerCase()] = i; });

    let added = 0, updated = 0;
    const failed = [];
    for(const r of rows){
      const key = (r.area+'::'+r.title).trim().toLowerCase();
      const match = existingByKey[key];
      try{
        if(match){
          const { error } = await c.from('responsibilities').update(r).eq('id', match.id);
          if(error) throw error;
          updated++;
        }else{
          const { error } = await c.from('responsibilities').insert({ ...r, source: 'csv_upload' });
          if(error) throw error;
          added++;
        }
      }catch(e){ failed.push(r.title + ' — ' + e.message); }
    }
    out.innerHTML = `<div class="import-log">Imported: ${added} added, ${updated} updated.${failed.length ? '<br>Failed: '+failed.map(esc).join('; ') : ''}</div>`;
    await loadAll();
  }catch(e){
    out.innerHTML = `<div class="import-log" style="color:var(--red)">Import failed: ${esc(e.message)}</div>`;
  }
}

function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(){
  const headers = ['area','title','description','owner','backup_owner','status','priority','notes'];
  const lines = [headers.join(',')];
  items.forEach(i => {
    lines.push(headers.map(h => csvEscape(i[h])).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'responsibilities-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

loadAll();
