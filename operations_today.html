<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Today — 2CW Operations</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);flex:1}
    .live{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .live .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
    .live.on .dot{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--green);color:#000}

    main{padding:28px 16px 60px;max-width:1100px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;line-height:1}
    .sub{margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

    .datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
    .datebar button,.datebar input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;
      font-family:'DM Mono',monospace;font-size:.85rem;min-height:44px;padding:0 14px;cursor:pointer}
    .datebar input{color-scheme:dark;outline:none}
    .datebar input:focus{border-color:var(--green)}
    .datebar button:disabled{opacity:.35;cursor:default}
    .datebar .today-btn{text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
    .datebar .today-btn.on{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
    .datebar .pdf-btn{margin-left:auto;color:var(--blue);border-color:var(--blue);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
    .filters button{background:var(--surface);border:1px solid var(--border);color:var(--subtext);border-radius:10px;padding:.6rem 1rem;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:44px}
    .filters button.on{background:var(--green);border-color:var(--green);color:#000;font-weight:700}

    .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
    .row.draft{border-left:3px solid var(--gold)}
    .row.submitted{border-left:3px solid var(--green)}
    .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
    .row-station{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .row-strain{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;line-height:1.1;margin-top:2px}
    .pill{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border)}
    .pill.draft{border-color:var(--gold);color:var(--gold)}
    .pill.submitted{border-color:var(--green);color:var(--green)}
    .row-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--subtext);margin-top:10px}
    .row-headline{font-family:'DM Mono',monospace;font-size:1.1rem;color:var(--text)}
    .row-who{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .row-edit{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);
      border:1px solid var(--blue);border-radius:8px;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;text-decoration:none}

    /* Daily summary (Bucking, Hand Trim, Smalls): the notebook page, people × flavors. */
    .daysum{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px}
    .daysum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .daysum-head h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;font-weight:400}
    .daysum-head .hint{font-size:.75rem;color:var(--muted);margin-top:2px}
    .daysum-send{background:transparent;border:1px solid var(--green);color:var(--green);border-radius:10px;min-height:44px;padding:0 14px;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .daysum-send:disabled{opacity:.35;cursor:default}
    .daysum > .hint{font-size:.85rem;color:var(--muted)}
    .daysum-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .sum-table{border-collapse:collapse;font-family:'DM Mono',monospace;font-size:.85rem;min-width:100%}
    .sum-table th,.sum-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
    .sum-table th{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;vertical-align:bottom;white-space:normal;min-width:72px}
    .sum-table th:first-child,.sum-table td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
    .sum-table th.name,.sum-table td.name{text-align:left;font-family:'DM Sans',sans-serif;color:var(--subtext)}
    .sum-table td.zero{color:var(--muted)}
    .sum-table .tot,.sum-table tfoot td{color:var(--text);font-weight:500}

    /* Image preview (Send as image), as on the Master Schedule. */
    #img-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 12px 30px}
    #img-bg.on{display:flex}
    #img-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;width:100%;max-width:760px}
    .img-ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .img-ft .spacer{flex:1}
    #img-name{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);word-break:break-all}
    #img-hint{font-size:.75rem;color:var(--muted)}
    #img-preview{display:block;width:100%;border-radius:8px;margin-top:10px;background:#fff}
    .btn{padding:.7rem 1.1rem;border:1px solid var(--border);border-radius:10px;font-family:'DM Mono',monospace;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);min-height:46px;text-decoration:none;display:inline-flex;align-items:center}
    .btn-blue{background:var(--blue);border-color:var(--blue);color:#000}
    .btn-ghost{color:var(--subtext)}

    .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:.9rem}
    .footer{margin-top:36px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}
    .setup{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:20px;color:var(--subtext);font-size:.85rem;line-height:1.6}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Today</div>
  <div class="live" id="live"><span class="dot"></span><span id="live-txt">—</span></div>
  <div class="lang" id="lang"></div>
</header>

<main>
  <div class="title" id="title">Today</div>
  <div class="sub" id="sub">—</div>
  <div class="datebar">
    <button id="prev-day" aria-label="Previous day">◀</button>
    <input type="date" id="day"/>
    <button id="next-day" aria-label="Next day">▶</button>
    <button id="today-btn" class="today-btn">Today</button>
    <button id="pdf-btn" class="pdf-btn" disabled>📄 Share PDF</button>
  </div>
  <div class="filters" id="filters"></div>
  <div id="daysum" class="daysum" style="display:none"></div>
  <div id="board"></div>
  <div id="img-bg"><div id="img-box">
    <div class="img-ft"><span id="img-name"></span><span class="spacer"></span>
      <button type="button" class="btn btn-blue" id="img-share"></button>
      <a class="btn btn-ghost" id="img-dl" download></a>
      <button type="button" class="btn btn-ghost" id="img-close"></button></div>
    <div id="img-hint"></div>
    <img id="img-preview" alt="">
  </div></div>
  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script>
(async function () {
  mountLangToggle('lang');

  const L = {
    title: { en: 'Today', es: 'Hoy' },
    back: { en: '← Hub', es: '← Inicio' },
    live: { en: 'Live', es: 'En vivo' },
    connecting: { en: 'Connecting…', es: 'Conectando…' },
    allStations: { en: 'All stations', es: 'Todas las estaciones' },
    draftPill: { en: 'In progress', es: 'En curso' },
    submittedPill: { en: 'Submitted', es: 'Enviado' },
    updated: { en: 'updated', es: 'actualizado' },
    edit: { en: 'Edit', es: 'Editar' },
    edited: { en: 'edited by', es: 'editado por' },
    noAccess: { en: 'You don’t have view access to the operations board yet. Ask your manager to turn it on.',
                es: 'Aún no tiene acceso de visualización al panel de producción. Pida a su gerente que lo active.' },
    empty: { en: 'Nothing logged yet today.', es: 'Nada registrado hoy todavía.' },
    emptyDay: { en: 'Nothing logged on this day.', es: 'Nada registrado este día.' },
    today: { en: 'Today', es: 'Hoy' },
    pdfBtn: { en: '📄 Share PDF', es: '📄 Compartir PDF' },
    pdfBusy: { en: '⏳ Preparing…', es: '⏳ Preparando…' },
    pdfFailed: { en: 'PDF failed: ', es: 'Falló el PDF: ' },
    sumHint: { en: 'Everyone’s weights this day, open pages included.', es: 'Los pesos de todos este día, incluye hojas abiertas.' },
    sumEmp: { en: 'Employee #', es: 'N.º empl.' },
    sumName: { en: 'Name', es: 'Nombre' },
    sumTotal: { en: 'Total', es: 'Total' },
    sumSend: { en: '💬 Send as image', es: '💬 Enviar como imagen' },
    imgShare: { en: 'Share / text', es: 'Compartir' },
    imgDownload: { en: 'Download', es: 'Descargar' },
    imgClose: { en: 'Close', es: 'Cerrar' },
    imgHint: { en: 'On a phone, Share sends it to Messages/WhatsApp; or long-press the image to save it.', es: 'En el teléfono, Compartir lo manda a Mensajes/WhatsApp; o mantenga presionada la imagen para guardarla.' },
    sumNone: { en: 'Nothing weighed yet this day.', es: 'Aún no hay nada pesado este día.' },
    reportTitle: { en: 'Daily Operations Report', es: 'Reporte diario de operaciones' },
    summary: { en: 'Summary', es: 'Resumen' },
    station: { en: 'Station', es: 'Estación' },
    forms: { en: 'Forms', es: 'Formularios' },
    total: { en: 'Total', es: 'Total' },
    strain: { en: 'Strain / Batch', es: 'Variedad / lote' },
    status: { en: 'Status', es: 'Estado' },
    by: { en: 'By', es: 'Por' },
    time: { en: 'Updated', es: 'Actualizado' },
    generated: { en: 'Generated', es: 'Generado' },
    page: { en: 'Page', es: 'Página' },
    loading: { en: 'Loading…', es: 'Cargando…' },
    setupTitle: { en: 'Live view isn’t connected yet', es: 'La vista en vivo aún no está conectada' },
    setupBody: { en: 'This page needs a Supabase project (config/supabase_config.js is still blank). Until then there is nothing to show here — finished forms still show up on the Operations Dashboard.',
                 es: 'Esta página necesita un proyecto de Supabase (config/supabase_config.js sigue vacío). Mientras tanto no hay nada que mostrar aquí — los formularios terminados siguen apareciendo en el Panel de Producción.' }
  };
  document.getElementById('title').textContent = t(L.title);
  document.getElementById('back').textContent = t(L.back);
  document.querySelector('.hdr-brand').textContent = t(L.title);
  document.title = `${t(L.title)} — 2CW`;

  const editAccess = JSON.parse(sessionStorage.getItem('2cw_ops_edit_access') || 'null');
  const viewAccess = JSON.parse(sessionStorage.getItem('2cw_ops_view_access') || 'null');
  // Edit access implies you can see your own department's board; explicit
  // view access can additionally reach stations you can't submit to.
  const canSee = (key) =>
    viewAccess === 'all' || (Array.isArray(viewAccess) && viewAccess.includes(key)) ||
    editAccess === 'all' || (Array.isArray(editAccess) && editAccess.includes(key));
  const visibleStations = OPERATIONS_STATIONS.filter((s) => canSee(s.key));

  if (!visibleStations.length) {
    document.getElementById('board').innerHTML = `<div class="empty">${t(L.noAccess)}</div>`;
    return;
  }

  if (!supabaseReady()) {
    document.getElementById('board').innerHTML =
      `<div class="setup"><strong>${t(L.setupTitle)}</strong><br><br>${t(L.setupBody)}</div>`;
    return;
  }

  document.getElementById('live').classList.add('on');
  document.getElementById('live-txt').textContent = t(L.live);

  let stationFilter = null;
  document.getElementById('filters').innerHTML =
    `<button data-k="" class="on">${t(L.allStations)}</button>` +
    visibleStations.map((s) => `<button data-k="${s.key}">${t(s.title)}</button>`).join('');
  document.querySelectorAll('#filters button').forEach((b) => {
    b.onclick = () => {
      stationFilter = b.dataset.k || null;
      document.querySelectorAll('#filters button').forEach((x) => x.classList.toggle('on', x === b));
      render();
    };
  });

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const timeAgo = (iso) => {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.round(s / 60)}m`;
    if (s < 86400 * 2) return `${Math.round(s / 3600)}h`;
    return `${Math.round(s / 86400)}d`;
  };

  // The day being looked at — today unless ?date=YYYY-MM-DD picks another.
  // Same UTC date the forms save their work_date with (todayStr in ops_data.js).
  const isDay = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  const shiftDay = (iso, n) => {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const dayLabel = (iso) => new Date(iso + 'T00:00:00Z')
    .toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const urlDay = new URLSearchParams(location.search).get('date');
  let day = isDay(urlDay) && urlDay <= todayStr() ? urlDay : todayStr();
  let rows = [];

  const dayInput = document.getElementById('day');
  const todayBtn = document.getElementById('today-btn');
  todayBtn.textContent = t(L.today);
  dayInput.max = todayStr();
  dayInput.onchange = () => { if (isDay(dayInput.value)) goTo(dayInput.value); };
  document.getElementById('prev-day').onclick = () => goTo(shiftDay(day, -1));
  document.getElementById('next-day').onclick = () => goTo(shiftDay(day, 1));
  todayBtn.onclick = () => goTo(todayStr());
  const pdfBtn = document.getElementById('pdf-btn');
  pdfBtn.textContent = t(L.pdfBtn);
  pdfBtn.onclick = sharePdf;

  // Pages with day tabs (Bucking, Hand Trim, Pre-Roll) are worked over
  // several days: each logged row carries its `day`. Such a page is on the
  // board for every day something was logged on it (not only its start
  // date), and its total is that day's rows only — the headline calc run on
  // just that day's rows, the same split as the page's day tabs.
  const dayTabLines = (s) => (s && s.dayTabs ? [].concat(s.dayTabs.lines) : []);
  const rowDay = (r, x) => x.day || r.fields.date || r.work_date;
  const dayRows = (s, r, d) => dayTabLines(s).flatMap((k) => (r.fields[k] || []).filter((x) => rowDay(r, x) === d));
  const onBoard = (r, d) => r.work_date === d || dayRows(STATION_BY_KEY[r.station_key], r, d).length > 0;
  function amount(s, r, d) {
    const f = s.fields.find((x) => x.k === s.headline);
    if (!f) return null;
    let v = r.fields[s.headline];
    if (s.dayTabs && f.calc) {
      const only = Object.fromEntries(dayTabLines(s).map((k) => [k, (r.fields[k] || []).filter((x) => rowDay(r, x) === d)]));
      v = f.calc({ ...r.fields, ...only });
    }
    if (v == null || v === '') return null;
    v = Number(v);
    return Number.isFinite(v) ? v : null;
  }
  const amountLabel = (s) => {
    const f = s.fields.find((x) => x.k === s.headline);
    if (!f) return '';
    return s.dayTabs ? t(s.dayTabs.headline || { en: `${f.l.en} — that day`, es: `${f.l.es} — ese día` }) : t(f.l);
  };
  // When a day-tab page was last logged on that day (its rows' `at`), else
  // when it was last saved.
  const lastAt = (s, r, d) => dayRows(s, r, d).map((x) => x.at).filter(Boolean).sort().pop() || r.updated_at;

  // Today's pages plus the day-tab pages started in the weeks before with
  // something logged on the day.
  async function loadDay(d) {
    const multi = visibleStations.filter((s) => s.dayTabs);
    const [dated, ...earlier] = await Promise.all([listToday(d),
      ...multi.map((s) => listStationRange(s.key, shiftDate(d, -45), shiftDate(d, -1)))]);
    const more = earlier.flat().filter((r) => onBoard(r, d));
    return [...dated, ...more.filter((r) => !dated.some((x) => x.id === r.id))]
      .sort((a, b) => String(lastAt(STATION_BY_KEY[b.station_key], b, d)).localeCompare(String(lastAt(STATION_BY_KEY[a.station_key], a, d))));
  }

  async function goTo(iso) {
    if (iso > todayStr()) iso = todayStr();
    day = iso;
    const url = new URL(location.href);
    if (day === todayStr()) url.searchParams.delete('date'); else url.searchParams.set('date', day);
    history.replaceState(null, '', url);
    syncDateBar();
    document.getElementById('board').innerHTML = `<div class="empty">${t(L.loading)}</div>`;
    const fetched = (await loadDay(day)).filter((r) => visibleStations.some((s) => s.key === r.station_key));
    if (iso !== day) return;   // a newer pick landed while this one loaded
    rows = fetched;
    render();
  }

  function syncDateBar() {
    const isToday = day === todayStr();
    dayInput.max = todayStr();
    dayInput.value = day;
    document.getElementById('next-day').disabled = isToday;
    todayBtn.classList.toggle('on', isToday);
    const title = isToday ? t(L.title) : dayLabel(day);
    document.getElementById('title').textContent = title;
    document.title = `${title} — 2CW`;
  }

  function render() {
    const filtered = stationFilter ? rows.filter((r) => r.station_key === stationFilter) : rows;
    renderDaySum();
    if (!pdfBusy) pdfBtn.disabled = !filtered.length;
    document.getElementById('sub').textContent =
      `${filtered.length} ${filtered.length === 1 ? 'form' : 'forms'}${day === todayStr() ? ' · ' + dayLabel(day) : ''}`;
    const board = document.getElementById('board');
    if (!filtered.length) { board.className = ''; board.innerHTML = `<div class="empty">${t(day === todayStr() ? L.empty : L.emptyDay)}</div>`; return; }

    board.className = 'board';
    board.innerHTML = filtered.map((r) => {
      const station = STATION_BY_KEY[r.station_key];
      const headline = station && station.headline ? amount(station, r, day) : null;
      const headlineLabel = station && station.fields.find((f) => f.k === station.headline);
      return `<div class="row ${r.status}">
        <div class="row-top">
          <div>
            <div class="row-station">${station ? t(station.title) : r.station_key}</div>
            <div class="row-strain">${esc(r.strain || r.fields.harvestBatchName || '—')}</div>
          </div>
          <span class="pill ${r.status}">${r.status === 'draft' ? t(L.draftPill) : t(L.submittedPill)}</span>
        </div>
        <div class="row-meta">
          <span>${headlineLabel ? amountLabel(station) : ''}</span>
          <span class="row-headline">${headline !== null ? fmtNum(headline, headlineLabel && headlineLabel.dp !== undefined ? headlineLabel.dp : 2) : '—'}</span>
        </div>
        <div class="row-who"><span>${esc(r.owner_user || '—')} · ${t(L.updated)} ${timeAgo(lastAt(station, r, day))}${r.fields.lastEditedBy ? ` · ${t(L.edited)} ${esc(r.fields.lastEditedBy)}` : ''}</span>${
          r.status === 'submitted' && canFixSubmitted(r.station_key)
            ? `<a class="row-edit" href="/ops_form.html?station=${encodeURIComponent(r.station_key)}&edit=${encodeURIComponent(r.id)}&from=today">${t(L.edit)}</a>` : ''}</div>
      </div>`;
    }).join('');
  }

  // ── Daily summary (station.dailySummary) ───────────────────────────────
  // With one station picked that keeps a daily summary (Bucking, Hand Trim,
  // Smalls), the notebook page sits above its forms: employee # and name
  // down the side, each flavor across, that day's weights and totals —
  // dailySummaryGrid in ops_common.js, the same table as under the form.
  // "Send as image" draws it as a picture to text (makeDaySumImage).
  let badgeNames = {};
  loadBadgeNames().then((n) => { badgeNames = n || {}; renderDaySum(); });
  const nameOf = (e) => badgeNames[badgeKey(e)] || '';
  const uid4 = (p) => (p.f.sourceUid ? `…${String(p.f.sourceUid).slice(-4)}` : '');

  function daySumData() {
    const s = stationFilter && STATION_BY_KEY[stationFilter];
    if (!s || !s.dailySummary) return null;
    const pages = rows.filter((r) => r.station_key === s.key)
      .map((r) => ({ id: r.id, status: r.status, f: r.fields || {}, strain: r.strain || (r.fields || {}).strain }));
    return { s, cfg: s.dailySummary, ...dailySummaryGrid(s.dailySummary, pages, day) };
  }

  function renderDaySum() {
    const box = document.getElementById('daysum');
    const d = daySumData();
    if (!d) { box.style.display = 'none'; box.innerHTML = ''; return; }
    const { s, cfg, used, emps, grid, extra, colTot, empTot, all, inLb, dp } = d;
    box.style.display = 'block';
    // Shown even on a day with nothing weighed, so the button is always
    // where people expect it.
    const head = `<div class="daysum-head"><div><h2>${esc(t(cfg.title || s.title))}</h2><div class="hint">${t(L.sumHint)}</div></div>` +
      `<button type="button" class="daysum-send" id="daysum-send"${emps.length || extra ? '' : ' disabled'}>${t(L.sumSend)}</button></div>`;
    if (!emps.length && !extra) { box.innerHTML = head + `<div class="hint">${t(L.sumNone)}</div>`; return; }
    box.innerHTML = head +
      `<div class="daysum-scroll"><table class="sum-table"><thead><tr><th>${esc(t(cfg.empLabel || L.sumEmp))}</th><th class="name">${t(L.sumName)}</th>` +
      used.map((p) => `<th>${esc(p.strain || '—')}<br>${esc(uid4(p))}</th>`).join('') +
      `<th class="tot">${t(L.sumTotal)} ${inLb ? 'lbs' : 'g'}</th></tr></thead><tbody>` +
      emps.map((e) => `<tr><td>${esc(e)}</td><td class="name">${esc(nameOf(e))}</td>` +
        used.map((p) => (grid[e][p.id] ? `<td>${fmtNum(grid[e][p.id], dp)}</td>` : '<td class="zero">·</td>')).join('') +
        `<td class="tot">${fmtNum(empTot(e), dp)}</td></tr>`).join('') +
      // Bucking's recovered from leaf: nobody's, its own row under the people.
      (extra ? `<tr><td></td><td class="name">${esc(t(extra.l))}</td>` +
        used.map((p) => (extra.of(p) ? `<td>${fmtNum(extra.of(p), dp)}</td>` : '<td class="zero">·</td>')).join('') +
        `<td class="tot">${fmtNum(extra.total, dp)}</td></tr>` : '') +
      `</tbody><tfoot><tr><td>${t(L.sumTotal)}</td><td></td>` + used.map((p) => `<td>${fmtNum(colTot(p), dp)}</td>`).join('') +
      `<td class="tot">${fmtNum(all, dp)}</td></tr></tfoot></table></div>`;
    document.getElementById('daysum-send').onclick = makeDaySumImage;
  }

  // The table as a picture to text, like the Master Schedule's: drawn
  // straight onto a white canvas — title and date, employee # and name down
  // the side, each flavor across (strain over the UID's last 4), each
  // person's total, the totals row — then shown with Share / Download.
  // (Sharing waits for a tap on Share: phones only allow it straight from a
  // tap, and drawing comes first.)
  async function makeDaySumImage() {
    const d = daySumData();
    if (!d || (!d.emps.length && !d.extra)) return;
    const { s, cfg, used, emps, grid, extra, colTot, empTot, all, inLb, dp } = d;
    try { await document.fonts.ready; } catch {}
    const SANS = "'DM Sans', Arial, sans-serif", HEAD = "'Bebas Neue', 'Arial Narrow', Arial, sans-serif", MONO = "'DM Mono', Menlo, monospace";
    const C = { ink: '#16181d', sub: '#5b6170', line: '#e3e5ea', band: '#f6f7f9', head: '#eef7f2', green: '#3db87a', paper: '#ffffff' };
    const F = { title: `400 54px ${HEAD}`, date: `500 24px ${SANS}`, th: `700 17px ${SANS}`, thSub: `500 15px ${MONO}`,
                emp: `500 20px ${MONO}`, name: `500 20px ${SANS}`, num: `500 20px ${MONO}`, tot: `700 20px ${MONO}`, foot: `400 16px ${SANS}` };
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    const n = (x) => fmtNum(x, dp);
    // Column widths from what goes in them.
    const fit = (font, texts, min) => { ctx.font = font; return Math.max(min, ...texts.map((x) => ctx.measureText(x).width)) + 32; };
    const empHead = t({ en: 'Emp #', es: 'N.º' });
    const empW = Math.max(fit(F.emp, emps, 60), fit(F.th, [empHead], 0));
    const nameW = fit(F.name, [...emps.map(nameOf), extra ? t(extra.l) : ''], 160);
    const flavW = used.map((p) => Math.min(260, fit(F.th, [p.strain || '—'], 110)));
    const totW = fit(F.tot, [n(all) + ' ' + (inLb ? 'lbs' : 'g')], 120);
    const PAD = 36, ROWH = 46, HEADH = 70, TOP = 150, FOOTH = 60;
    const tableW = empW + nameW + flavW.reduce((a, w) => a + w, 0) + totW;
    const W = Math.max(720, Math.ceil(tableW + PAD * 2));
    const H = TOP + HEADH + (emps.length + (extra ? 1 : 0) + 1) * ROWH + FOOTH + 20;
    cv.width = W; cv.height = H;
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'middle';
    const when = new Date(day + 'T12:00:00Z').toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US',
      { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    ctx.fillStyle = C.ink; ctx.font = F.title; ctx.fillText(t(s.title).toUpperCase(), PAD, PAD + 26);
    ctx.fillStyle = C.sub; ctx.font = F.date; ctx.fillText(`${when}  ·  ${inLb ? 'lbs' : t({ en: 'grams', es: 'gramos' })}`, PAD, PAD + 78);
    const clip = (text, maxW) => { let x = String(text); while (x.length > 2 && ctx.measureText(x).width > maxW) x = x.slice(0, -2) + '…'; return x; };
    // x of each column, and how it's aligned
    const cols = [{ w: empW, al: 'left' }, { w: nameW, al: 'left' }, ...flavW.map((w) => ({ w, al: 'right' })), { w: totW, al: 'right' }];
    let cx = PAD; cols.forEach((c) => { c.x = cx; cx += c.w; });
    const cell = (i, text, y, font, color) => {
      const c = cols[i];
      ctx.font = font; ctx.fillStyle = color || C.ink;
      ctx.textAlign = c.al;
      ctx.fillText(clip(text, c.w - 24), c.al === 'left' ? c.x + 12 : c.x + c.w - 12, y);
    };
    // Header: green band, flavor names over their UID's last 4
    let y = TOP;
    ctx.fillStyle = C.head; ctx.fillRect(PAD, y, tableW, HEADH);
    ctx.fillStyle = C.green; ctx.fillRect(PAD, y + HEADH - 3, tableW, 3);
    cell(0, empHead, y + HEADH / 2, F.th);
    cell(1, t(L.sumName), y + HEADH / 2, F.th);
    used.forEach((p, i) => {
      cell(i + 2, p.strain || '—', y + 24, F.th);
      if (uid4(p)) cell(i + 2, uid4(p), y + 48, F.thSub, C.sub);
    });
    cell(cols.length - 1, t(L.sumTotal), y + HEADH / 2, F.th);
    y += HEADH;
    emps.forEach((e, r) => {
      if (r % 2) { ctx.fillStyle = C.band; ctx.fillRect(PAD, y, tableW, ROWH); }
      ctx.fillStyle = C.line; ctx.fillRect(PAD, y + ROWH - 1, tableW, 1);
      const mid = y + ROWH / 2;
      cell(0, e, mid, F.emp);
      cell(1, nameOf(e), mid, F.name, C.sub);
      used.forEach((p, i) => cell(i + 2, grid[e][p.id] ? n(grid[e][p.id]) : '·', mid, F.num, grid[e][p.id] ? C.ink : C.line));
      cell(cols.length - 1, n(empTot(e)), mid, F.tot);
      y += ROWH;
    });
    // Recovered from leaf (Bucking): nobody's, its own row under the people.
    if (extra) {
      ctx.fillStyle = C.head; ctx.fillRect(PAD, y, tableW, ROWH);
      const mid = y + ROWH / 2;
      cell(1, t(extra.l), mid, F.name, C.ink);
      used.forEach((p, i) => cell(i + 2, extra.of(p) ? n(extra.of(p)) : '·', mid, F.num, extra.of(p) ? C.ink : C.line));
      cell(cols.length - 1, n(extra.total), mid, F.tot);
      y += ROWH;
    }
    // Totals row
    ctx.fillStyle = C.ink; ctx.fillRect(PAD, y, tableW, 2);
    const mid = y + ROWH / 2 + 2;
    cell(0, t(L.sumTotal), mid, F.th);
    used.forEach((p, i) => cell(i + 2, n(colTot(p)), mid, F.tot));
    cell(cols.length - 1, `${n(all)} ${inLb ? 'lbs' : 'g'}`, mid, F.tot, C.green);
    ctx.textAlign = 'left';
    ctx.fillStyle = C.sub; ctx.font = F.foot;
    ctx.fillText(`2CW · ${t({ en: 'made', es: 'hecho' })} ${new Date().toLocaleString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`, PAD, H - FOOTH / 2);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
    showImage(blob, `${s.key}-${day}.png`);
  }

  let imgUrl = null, imgFile = null;
  const $ = (id) => document.getElementById(id);
  function showImage(blob, name) {
    if (imgUrl) URL.revokeObjectURL(imgUrl);
    imgUrl = URL.createObjectURL(blob);
    imgFile = new File([blob], name, { type: 'image/png' });
    $('img-preview').src = imgUrl;
    $('img-name').textContent = name;
    $('img-dl').href = imgUrl; $('img-dl').download = name; $('img-dl').textContent = t(L.imgDownload);
    $('img-close').textContent = t(L.imgClose);
    $('img-hint').textContent = t(L.imgHint);
    $('img-share').hidden = !(navigator.canShare && navigator.canShare({ files: [imgFile] }));
    $('img-share').textContent = t(L.imgShare);
    $('img-bg').classList.add('on');
  }
  $('img-share').onclick = async () => {
    try { await navigator.share({ files: [imgFile] }); } catch (e) { if (e && e.name !== 'AbortError') alert(String(e.message || e)); }
  };
  $('img-close').onclick = () => $('img-bg').classList.remove('on');
  $('img-bg').addEventListener('click', (e) => { if (e.target === $('img-bg')) $('img-bg').classList.remove('on'); });

  // ── Day report PDF ─────────────────────────────────────────────────────
  // The day on screen (and the station filter, if one is picked) as a plain
  // white Letter page — drawn as text with jsPDF so it stays small and sharp
  // for texting. Phones get the share sheet (Messages, Mail, Files);
  // desktop downloads it. Same pattern as the PDFs in menu.html / msa_agreement.js.
  let jsPdfPromise = null, pdfBusy = false;
  function loadJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    jsPdfPromise = jsPdfPromise || new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
      s.onload = () => resolve(window.jspdf.jsPDF);
      s.onerror = () => { jsPdfPromise = null; reject(new Error('couldn’t load the PDF maker — check the connection.')); };
      document.head.appendChild(s);
    });
    return jsPdfPromise;
  }

  function buildPdf(jsPDF, list) {
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const W = 612, H = 792, M = 40, BOTTOM = H - 50;
    let y = M;
    const fit = (txt, w) => {   // one line, cut with an ellipsis to fit width w
      txt = String(txt == null ? '' : txt);
      if (doc.getTextWidth(txt) <= w) return txt;
      while (txt.length > 1 && doc.getTextWidth(txt + '…') > w) txt = txt.slice(0, -1);
      return txt + '…';
    };
    const ensure = (h) => { if (y + h > BOTTOM) { doc.addPage(); y = M; } };
    const timeOf = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    const filterName = stationFilter && STATION_BY_KEY[stationFilter] ? t(STATION_BY_KEY[stationFilter].title) : t(L.allStations);

    // Header
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(20);
    doc.text(`2CW — ${t(L.reportTitle)}`, M, y + 14); y += 34;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(60);
    doc.text(`${dayLabel(day)}  ·  ${filterName}`, M, y); y += 16;
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text(`${t(L.generated)} ${new Date().toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}`, M, y); y += 10;
    doc.setDrawColor(61, 184, 122); doc.setLineWidth(2); doc.line(M, y, W - M, y); y += 22;

    // Group by station, in station-list order
    const groups = OPERATIONS_STATIONS
      .map((s) => ({ s, rows: list.filter((r) => r.station_key === s.key) }))
      .filter((g) => g.rows.length);
    const hl = (s) => s.fields.find((f) => f.k === s.headline);
    const dp = (s) => { const f = hl(s); return f && f.dp !== undefined ? f.dp : 2; };
    const num = (s, r) => (s.headline ? amount(s, r, day) : null);

    // Summary
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(20);
    doc.text(t(L.summary), M, y); y += 16;
    const sumCols = [M, M + 230, M + 340];
    doc.setFontSize(8); doc.setTextColor(120);
    doc.text(t(L.station).toUpperCase(), sumCols[0], y);
    doc.text(t(L.forms).toUpperCase(), sumCols[1], y);
    doc.text(t(L.total).toUpperCase(), sumCols[2], y);
    y += 5; doc.setDrawColor(200); doc.setLineWidth(.5); doc.line(M, y, W - M, y); y += 13;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    groups.forEach(({ s, rows }) => {
      ensure(16);
      const drafts = rows.filter((r) => r.status === 'draft').length;
      const vals = rows.map((r) => num(s, r)).filter((v) => v !== null);
      const f = hl(s);
      doc.setTextColor(20);
      doc.text(fit(t(s.title), 220), sumCols[0], y);
      doc.text(`${rows.length}${drafts ? ` (${drafts} ${t(L.draftPill).toLowerCase()})` : ''}`, sumCols[1], y);
      doc.text(fit(vals.length && f ? `${fmtNum(vals.reduce((a, b) => a + b, 0), dp(s))}  ${amountLabel(s)}` : '—', W - M - sumCols[2]), sumCols[2], y);
      y += 16;
    });
    y += 14;

    // Detail, one table per station
    const cols = [M, M + 190, M + 275, M + 375, M + 470];
    groups.forEach(({ s, rows }) => {
      const f = hl(s);
      ensure(60);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20);
      doc.text(fit(t(s.title), W - 2 * M), M, y); y += 14;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
      [t(L.strain), t(L.status), f ? amountLabel(s) : '', t(L.by), t(L.time)]
        .forEach((h, i) => doc.text(fit(h.toUpperCase(), (cols[i + 1] || W - M) - cols[i] - 8), cols[i], y));
      y += 5; doc.setDrawColor(200); doc.line(M, y, W - M, y); y += 13;
      doc.setFontSize(10);
      rows.forEach((r) => {
        ensure(16);
        const v = num(s, r);
        doc.setTextColor(20);
        doc.text(fit(r.strain || r.fields.harvestBatchName || '—', 180), cols[0], y);
        if (r.status === 'draft') doc.setTextColor(176, 130, 30); else doc.setTextColor(40, 140, 90);
        doc.text(r.status === 'draft' ? t(L.draftPill) : t(L.submittedPill), cols[1], y);
        doc.setTextColor(20);
        doc.text(v === null ? '—' : fmtNum(v, dp(s)), cols[2], y);
        doc.text(fit(r.owner_user || '—', 90), cols[3], y);
        doc.text(timeOf(lastAt(s, r, day)), cols[4], y);
        y += 16;
      });
      y += 14;
    });

    // Footer on every page
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFontSize(8); doc.setTextColor(140);
      doc.text('2CW Enterprises  ·  Confidential  ·  Not for Distribution', M, H - 28);
      doc.text(`${t(L.page)} ${i} / ${pages}`, W - M, H - 28, { align: 'right' });
    }
    return doc;
  }

  async function sharePdf() {
    const list = stationFilter ? rows.filter((r) => r.station_key === stationFilter) : rows;
    if (!list.length) return;
    pdfBusy = pdfBtn.disabled = true;
    pdfBtn.textContent = t(L.pdfBusy);
    try {
      const doc = buildPdf(await loadJsPdf(), list);
      const name = `2CW Ops Report ${day}${stationFilter ? ' ' + t(STATION_BY_KEY[stationFilter].title).replace(/[\\/:*?"<>|]+/g, '') : ''}.pdf`;
      const file = new File([doc.output('blob')], name, { type: 'application/pdf' });
      if (navigator.canShare && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); }
        catch (e) { if (e.name !== 'AbortError') doc.save(name); }
      } else {
        doc.save(name);
      }
    } catch (e) {
      alert(t(L.pdfFailed) + (e && e.message || e));
    }
    pdfBusy = false;
    pdfBtn.textContent = t(L.pdfBtn);
    render();
  }

  await goTo(day);

  // Realtime: a row landing here means someone's autosave just committed on
  // another tablet. Patch it into the local list rather than refetching —
  // whichever day is showing, so an edit to an older form shows up too.
  subscribeToday((row) => {
    if (!row || !visibleStations.some((s) => s.key === row.station_key)) return;
    const i = rows.findIndex((r) => r.id === row.id);
    if (!row.fields || !onBoard(row, day)) {
      // A day-tab page whose rows on this day were all removed or moved.
      if (i > -1 && row.fields) { rows.splice(i, 1); render(); }
      return;
    }
    if (i > -1) rows[i] = row; else rows.unshift(row);
    render();
  });
  setInterval(render, 15000);   // keeps the "updated Ns ago" labels honest between events
})();
</script>
</body>
</html>
