<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Today — 2CW Operations</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);flex:1}
    .live{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .live .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
    .live.on .dot{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--green);color:#000}

    main{padding:28px 16px 60px;max-width:1100px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;line-height:1}
    .sub{margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

    .datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
    .datebar button,.datebar input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;
      font-family:'DM Mono',monospace;font-size:.85rem;min-height:44px;padding:0 14px;cursor:pointer}
    .datebar input{color-scheme:dark;outline:none}
    .datebar input:focus{border-color:var(--green)}
    .datebar button:disabled{opacity:.35;cursor:default}
    .datebar .today-btn{text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
    .datebar .today-btn.on{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
    .datebar .range-btn{text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
    .datebar .range-btn.on{border-color:var(--green);color:var(--green)}
    .datebar .range-to{display:none;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:.78rem;color:var(--muted)}
    .datebar .range-to.on{display:inline-flex}
    .datebar .pdf-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
    .datebar .cost-chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--subtext);cursor:pointer;user-select:none}
    .datebar .cost-chk input{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--gold);cursor:pointer}
    .datebar .cost-chk[hidden]{display:none}
    .datebar .cost-chk.on{border-color:var(--gold);color:var(--gold)}
    .datebar .pdf-btn{color:var(--blue);border-color:var(--blue);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
    .filters button{background:var(--surface);border:1px solid var(--border);color:var(--subtext);border-radius:10px;padding:.6rem 1rem;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:44px}
    .filters button.on{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
    .search{display:flex;align-items:center;gap:10px;margin:-8px 0 22px}
    .search input{flex:1;max-width:520px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;
      font-family:'DM Mono',monospace;font-size:.9rem;min-height:44px;padding:0 14px;outline:none}
    .search input:focus{border-color:var(--green)}
    .search button{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:10px;min-height:44px;padding:0 14px;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .search button[hidden]{display:none}
    .empty .wider{margin-top:14px;background:transparent;border:1px solid var(--green);color:var(--green);border-radius:10px;min-height:44px;padding:0 16px;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}

    .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
    .row.draft{border-left:3px solid var(--gold)}
    .row.submitted{border-left:3px solid var(--green)}
    .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
    .row-station{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .row-strain{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;line-height:1.1;margin-top:2px}
    .pill{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border)}
    .pill.draft{border-color:var(--gold);color:var(--gold)}
    .pill.submitted{border-color:var(--green);color:var(--green)}
    .pill.check{border-color:var(--red);color:var(--red)}
    .pills{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
    .row-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--subtext);margin-top:10px}
    .row-headline{font-family:'DM Mono',monospace;font-size:1.1rem;color:var(--text)}
    .row-who{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .row-edit{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);
      border:1px solid var(--blue);border-radius:8px;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;text-decoration:none}

    /* Daily summary (Bucking, Hand Trim, Smalls): the notebook page, people × flavors. */
    .daysum{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px}
    .daysum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .daysum-head h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;font-weight:400}
    .daysum-head .hint{font-size:.75rem;color:var(--muted);margin-top:2px}
    .daysum-send{background:transparent;border:1px solid var(--green);color:var(--green);border-radius:10px;min-height:44px;padding:0 14px;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .daysum-send:disabled{opacity:.35;cursor:default}
    .daysum > .hint{font-size:.85rem;color:var(--muted)}
    .daysum-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .sum-table{border-collapse:collapse;font-family:'DM Mono',monospace;font-size:.85rem;min-width:100%}
    .sum-table th,.sum-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
    .sum-table th{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;vertical-align:bottom;white-space:normal;min-width:72px}
    .sum-table th:first-child,.sum-table td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
    .sum-table th.name,.sum-table td.name{text-align:left;font-family:'DM Sans',sans-serif;color:var(--subtext)}
    .sum-table td.zero{color:var(--muted)}
    .sum-table .tot,.sum-table tfoot td{color:var(--text);font-weight:500}
    .sum-table .frz{color:var(--blue)}
    .row-dest{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--gold);margin-top:4px}
    .row-dest.frz{color:var(--blue)}
    .row-ids{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-top:4px;word-break:break-all}
    .row-ids b{font-weight:400;color:var(--text)}
    .row-ids span{white-space:nowrap}

    /* Image preview (Send as image), as on the Master Schedule. */
    #img-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 12px 30px}
    #img-bg.on{display:flex}
    #img-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;width:100%;max-width:760px}
    .img-ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .img-ft .spacer{flex:1}
    #img-name{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);word-break:break-all}
    #img-hint{font-size:.75rem;color:var(--muted)}
    #img-preview{display:block;width:100%;border-radius:8px;margin-top:10px;background:#fff}
    .btn{padding:.7rem 1.1rem;border:1px solid var(--border);border-radius:10px;font-family:'DM Mono',monospace;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);min-height:46px;text-decoration:none;display:inline-flex;align-items:center}
    .btn-blue{background:var(--blue);border-color:var(--blue);color:#000}
    .btn-ghost{color:var(--subtext)}

    .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:.9rem}
    .footer{margin-top:36px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}
    .setup{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:20px;color:var(--subtext);font-size:.85rem;line-height:1.6}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Today</div>
  <div class="live" id="live"><span class="dot"></span><span id="live-txt">—</span></div>
  <div class="lang" id="lang"></div>
</header>

<main>
  <div class="title" id="title">Today</div>
  <div class="sub" id="sub">—</div>
  <div class="datebar">
    <button id="prev-day" aria-label="Previous day">◀</button>
    <input type="date" id="day"/>
    <button id="next-day" aria-label="Next day">▶</button>
    <span id="range-to" class="range-to"><span id="to-lbl">to</span><input type="date" id="day-to"/></span>
    <button id="today-btn" class="today-btn">Today</button>
    <button id="range-btn" class="range-btn">Range</button>
    <span class="pdf-tools">
      <label id="cost-chk" class="cost-chk" hidden><input type="checkbox" id="cost-on"/><span id="cost-lbl">Labor $</span></label>
      <button id="pdf-btn" class="pdf-btn" disabled>📄 Share PDF</button>
    </span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="search"><input type="text" id="search" enterkeyhint="search" autocomplete="off" spellcheck="false"/><button id="search-clear" hidden>✕</button></div>
  <div id="daysum" class="daysum" style="display:none"></div>
  <div id="wetsum" class="daysum" style="display:none"></div>
  <div id="board"></div>
  <div id="img-bg"><div id="img-box">
    <div class="img-ft"><span id="img-name"></span><span class="spacer"></span>
      <button type="button" class="btn btn-blue" id="img-share"></button>
      <a class="btn btn-ghost" id="img-dl" download></a>
      <button type="button" class="btn btn-ghost" id="img-close"></button></div>
    <div id="img-hint"></div>
    <img id="img-preview" alt="">
  </div></div>
  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script src="/ops_analytics.js"></script>
<script>
(async function () {
  mountLangToggle('lang');

  const L = {
    title: { en: 'Today', es: 'Hoy' },
    back: { en: '← Hub', es: '← Inicio' },
    live: { en: 'Live', es: 'En vivo' },
    connecting: { en: 'Connecting…', es: 'Conectando…' },
    allStations: { en: 'All stations', es: 'Todas las estaciones' },
    draftPill: { en: 'In progress', es: 'En curso' },
    checkStrain: { en: 'Check strain', es: 'Revisar variedad' },
    submittedPill: { en: 'Submitted', es: 'Enviado' },
    updated: { en: 'updated', es: 'actualizado' },
    edit: { en: 'Edit', es: 'Editar' },
    edited: { en: 'edited by', es: 'editado por' },
    search: { en: 'Search strain, UID (or its last digits), CID, room, person…', es: 'Buscar variedad, UID (o sus últimos dígitos), CID, cuarto, persona…' },
    noMatch: { en: 'No forms match “{q}” in these dates.', es: 'Ningún formulario coincide con “{q}” en estas fechas.' },
    searchWider: { en: 'Search the last 14 days', es: 'Buscar en los últimos 14 días' },
    wetUid: { en: 'Wet UID', es: 'UID húmedo' },
    dryUid: { en: 'Dry UID', es: 'UID seco' },
    noAccess: { en: 'You don’t have view access to the operations board yet. Ask your manager to turn it on.',
                es: 'Aún no tiene acceso de visualización al panel de producción. Pida a su gerente que lo active.' },
    empty: { en: 'Nothing logged yet today.', es: 'Nada registrado hoy todavía.' },
    emptyDay: { en: 'Nothing logged on this day.', es: 'Nada registrado este día.' },
    today: { en: 'Today', es: 'Hoy' },
    range: { en: 'Range', es: 'Rango' },
    rangeTo: { en: 'to', es: 'a' },
    emptyRange: { en: 'Nothing logged in these dates.', es: 'Nada registrado en estas fechas.' },
    costChk: { en: 'Labor $', es: 'Mano de obra $' },
    costHint: { en: 'Add labor costs to the PDF', es: 'Agregar costos de mano de obra al PDF' },
    pdfBtn: { en: '📄 Share PDF', es: '📄 Compartir PDF' },
    pdfBusy: { en: '⏳ Preparing…', es: '⏳ Preparando…' },
    pdfFailed: { en: 'PDF failed: ', es: 'Falló el PDF: ' },
    sumHint: { en: 'Everyone’s weights this day, open pages included.', es: 'Los pesos de todos este día, incluye hojas abiertas.' },
    sumEmp: { en: 'Employee #', es: 'N.º empl.' },
    sumName: { en: 'Name', es: 'Nombre' },
    sumTotal: { en: 'Total', es: 'Total' },
    sumSend: { en: '💬 Send as image', es: '💬 Enviar como imagen' },
    imgShare: { en: 'Share / text', es: 'Compartir' },
    imgDownload: { en: 'Download', es: 'Descargar' },
    imgClose: { en: 'Close', es: 'Cerrar' },
    imgHint: { en: 'On a phone, Share sends it to Messages/WhatsApp; or long-press the image to save it.', es: 'En el teléfono, Compartir lo manda a Mensajes/WhatsApp; o mantenga presionada la imagen para guardarla.' },
    sumNone: { en: 'Nothing weighed yet this day.', es: 'Aún no hay nada pesado este día.' },
    wetTitle: { en: 'Wet Intake by farm', es: 'Recepción húmeda por rancho' },
    wetHint: { en: 'Net wet lbs received from each farm — into drying rooms vs freezers (fresh frozen). Open forms included.',
               es: 'Lbs húmedas netas recibidas de cada rancho — a cuartos de secado vs congeladores (fresco congelado). Incluye formularios abiertos.' },
    farm: { en: 'Farm', es: 'Rancho' },
    intakes: { en: 'Intakes', es: 'Recepciones' },
    intoDry: { en: 'Dry rooms lbs', es: 'Secado lbs' },
    intoFrozen: { en: 'Freezers lbs', es: 'Congelador lbs' },
    totalLbs: { en: 'Total lbs', es: 'Total lbs' },
    freshFrozen: { en: 'Fresh frozen', es: 'Fresco congelado' },
    reportTitle: { en: 'Daily Operations Report', es: 'Reporte diario de operaciones' },
    reportTitleRange: { en: 'Operations Report', es: 'Reporte de operaciones' },
    labor: { en: 'Labor', es: 'Mano de obra' },
    laborLog: { en: 'Labor Log by station', es: 'Registro de mano de obra por estación' },
    clocked: { en: 'Clocked in Connecteam', es: 'Horas en Connecteam' },
    activity: { en: 'Activity', es: 'Actividad' },
    hours: { en: 'Hours', es: 'Horas' },
    people: { en: 'People', es: 'Personas' },
    laborCost: { en: 'Labor $', es: 'Costo $' },
    laborNone: { en: 'No Labor Log entries in these dates.', es: 'No hay registros de mano de obra en estas fechas.' },
    clockedNone: { en: 'No Connecteam shifts in these dates.', es: 'No hay turnos de Connecteam en estas fechas.' },
    clockedErr: { en: 'Couldn’t load Connecteam shifts.', es: 'No se pudieron cargar los turnos de Connecteam.' },
    unrated: { en: '{h} hrs have no labor rate and aren’t costed.', es: '{h} hrs no tienen tarifa y no se cuentan.' },
    clockedOld: { en: 'Connecteam shifts only go back 14 days, so earlier days aren’t counted.', es: 'Los turnos de Connecteam solo cubren 14 días; los días anteriores no se cuentan.' },
    laborNote: { en: 'Labor $ is hours × each person’s rate (admin panel, Labor Rates), straight time only: overtime premiums aren’t included. Labor Log is the hours people logged against each station; Connecteam is everyone’s clocked time.',
                 es: 'El costo es horas × la tarifa de cada persona (panel de administración, Labor Rates), tiempo normal: no incluye horas extra. El Registro es lo que se anotó por estación; Connecteam es todo el tiempo marcado.' },
    ratesErr: { en: 'Couldn’t load labor rates: ', es: 'No se pudieron cargar las tarifas: ' },
    summary: { en: 'Summary', es: 'Resumen' },
    station: { en: 'Station', es: 'Estación' },
    forms: { en: 'Forms', es: 'Formularios' },
    total: { en: 'Total', es: 'Total' },
    strain: { en: 'Strain / Batch', es: 'Variedad / lote' },
    status: { en: 'Status', es: 'Estado' },
    by: { en: 'By', es: 'Por' },
    time: { en: 'Updated', es: 'Actualizado' },
    generated: { en: 'Generated', es: 'Generado' },
    page: { en: 'Page', es: 'Página' },
    loading: { en: 'Loading…', es: 'Cargando…' },
    setupTitle: { en: 'Live view isn’t connected yet', es: 'La vista en vivo aún no está conectada' },
    setupBody: { en: 'This page needs a Supabase project (config/supabase_config.js is still blank). Until then there is nothing to show here — finished forms still show up on the Operations Dashboard.',
                 es: 'Esta página necesita un proyecto de Supabase (config/supabase_config.js sigue vacío). Mientras tanto no hay nada que mostrar aquí — los formularios terminados siguen apareciendo en el Panel de Producción.' }
  };
  document.getElementById('title').textContent = t(L.title);
  document.getElementById('back').textContent = t(L.back);
  document.querySelector('.hdr-brand').textContent = t(L.title);
  document.title = `${t(L.title)} — 2CW`;

  const editAccess = JSON.parse(sessionStorage.getItem('2cw_ops_edit_access') || 'null');
  const viewAccess = JSON.parse(sessionStorage.getItem('2cw_ops_view_access') || 'null');
  // Edit access implies you can see your own department's board; explicit
  // view access can additionally reach stations you can't submit to.
  const canSee = (key) =>
    viewAccess === 'all' || (Array.isArray(viewAccess) && viewAccess.includes(key)) ||
    editAccess === 'all' || (Array.isArray(editAccess) && editAccess.includes(key));
  const visibleStations = OPERATIONS_STATIONS.filter((s) => canSee(s.key));

  if (!visibleStations.length) {
    document.getElementById('board').innerHTML = `<div class="empty">${t(L.noAccess)}</div>`;
    return;
  }

  if (!supabaseReady()) {
    document.getElementById('board').innerHTML =
      `<div class="setup"><strong>${t(L.setupTitle)}</strong><br><br>${t(L.setupBody)}</div>`;
    return;
  }

  document.getElementById('live').classList.add('on');
  document.getElementById('live-txt').textContent = t(L.live);

  // The station picked and the search are kept for the tab (sessionStorage),
  // so coming back from Edit (ops_form.html returns to this page) finds the
  // same list.
  const VIEW_KEY = '2cw_today_view';
  const saved = (() => { try { return JSON.parse(sessionStorage.getItem(VIEW_KEY) || 'null') || {}; } catch (e) { return {}; } })();
  let stationFilter = visibleStations.some((s) => s.key === saved.station) ? saved.station : null;
  let query = typeof saved.q === 'string' ? saved.q : '';
  const saveView = () => { try { sessionStorage.setItem(VIEW_KEY, JSON.stringify({ station: stationFilter, q: query })); } catch (e) {} };
  document.getElementById('filters').innerHTML =
    `<button data-k="" class="${stationFilter ? '' : 'on'}">${t(L.allStations)}</button>` +
    visibleStations.map((s) => `<button data-k="${s.key}" class="${s.key === stationFilter ? 'on' : ''}">${t(s.title)}</button>`).join('');
  document.querySelectorAll('#filters button').forEach((b) => {
    b.onclick = () => {
      stationFilter = b.dataset.k || null;
      document.querySelectorAll('#filters button').forEach((x) => x.classList.toggle('on', x === b));
      saveView();
      render();
    };
  });
  const searchInput = document.getElementById('search');
  const searchClear = document.getElementById('search-clear');
  searchInput.placeholder = t(L.search);
  searchInput.value = query;
  searchClear.hidden = !query;
  searchInput.oninput = () => { query = searchInput.value; searchClear.hidden = !query; saveView(); render(); };
  searchClear.onclick = () => { searchInput.value = ''; searchInput.oninput(); searchInput.focus(); };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const timeAgo = (iso) => {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.round(s / 60)}m`;
    if (s < 86400 * 2) return `${Math.round(s / 3600)}h`;
    return `${Math.round(s / 86400)}d`;
  };

  // The dates being looked at: one day (from === to) — today unless
  // ?date=YYYY-MM-DD picks another — or, with Range, from..to (?date=&to=),
  // for work that runs past midnight like an overnight green harvest. Same
  // UTC date the forms save their work_date with (todayStr in ops_data.js).
  const isDay = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  const shiftDay = (iso, n) => {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const dayLabel = (iso) => new Date(iso + 'T00:00:00Z')
    .toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const shortDay = (iso) => new Date(iso + 'T00:00:00Z')
    .toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  const spanDays = () => Math.round((Date.parse(to + 'T00:00:00Z') - Date.parse(from + 'T00:00:00Z')) / 86400000) + 1;
  const isRange = () => from !== to;
  const rangeLabel = () => isRange() ? `${shortDay(from)} – ${dayLabel(to)}` : dayLabel(from);
  const params = new URLSearchParams(location.search);
  const urlDay = params.get('date'), urlTo = params.get('to');
  let from = isDay(urlDay) && urlDay <= todayStr() ? urlDay : todayStr();
  let to = isDay(urlTo) && urlTo > from && urlTo <= todayStr() ? urlTo : from;
  let rangeMode = isRange();
  let rows = [];

  const dayInput = document.getElementById('day');
  const toInput = document.getElementById('day-to');
  const todayBtn = document.getElementById('today-btn');
  const rangeBtn = document.getElementById('range-btn');
  todayBtn.textContent = t(L.today);
  rangeBtn.textContent = t(L.range);
  document.getElementById('to-lbl').textContent = t(L.rangeTo);
  dayInput.max = toInput.max = todayStr();
  // Picking a start after the end (or an end before the start) moves the
  // other date along with it.
  dayInput.onchange = () => { if (isDay(dayInput.value)) goTo(dayInput.value, rangeMode ? (to < dayInput.value ? dayInput.value : to) : dayInput.value); };
  toInput.onchange = () => { if (isDay(toInput.value)) goTo(from > toInput.value ? toInput.value : from, toInput.value); };
  // ◀ ▶ step a whole range at a time: two nights back is the same two nights earlier.
  document.getElementById('prev-day').onclick = () => { const n = spanDays(); goTo(shiftDay(from, -n), shiftDay(to, -n)); };
  document.getElementById('next-day').onclick = () => { const n = spanDays(); goTo(shiftDay(from, n), shiftDay(to, n)); };
  todayBtn.onclick = () => (rangeMode ? goTo(shiftDay(todayStr(), 1 - spanDays()), todayStr()) : goTo(todayStr(), todayStr()));
  // Range starts as last night: the day before through the day showing.
  rangeBtn.onclick = () => {
    rangeMode = !rangeMode;
    if (rangeMode) goTo(shiftDay(to, -1), to); else goTo(to, to);
  };
  const pdfBtn = document.getElementById('pdf-btn');
  pdfBtn.textContent = t(L.pdfBtn);
  pdfBtn.onclick = sharePdf;
  // Labor $ on the PDF: only for people with 'labor log costs' (admin panel).
  // Off every time the page opens, so pay doesn't go out in a PDF by accident.
  // It only shows the box — labor-rates.js re-checks before handing out rates.
  const canCost = sessionStorage.getItem('2cw_labor_costs') === 'true';
  const costChk = document.getElementById('cost-chk');
  const costOn = document.getElementById('cost-on');
  costChk.hidden = !canCost;
  costChk.title = t(L.costHint);
  document.getElementById('cost-lbl').textContent = t(L.costChk);
  costOn.onchange = () => costChk.classList.toggle('on', costOn.checked);

  // Pages with day tabs (Bucking, Hand Trim, Pre-Roll) are worked over
  // several days: each logged row carries its `day`. Such a page is on the
  // board for every day something was logged on it (not only its start
  // date), and its total is the rows in the dates showing only — the
  // headline calc run on just those rows, the same split as the page's day tabs.
  const inDates = (d) => d >= from && d <= to;
  const dayTabLines = (s) => (s && s.dayTabs ? [].concat(s.dayTabs.lines) : []);
  const rowDay = (r, x) => x.day || r.fields.date || r.work_date;
  const dayRows = (s, r) => dayTabLines(s).flatMap((k) => (r.fields[k] || []).filter((x) => inDates(rowDay(r, x))));
  const onBoard = (r) => inDates(r.work_date) || dayRows(STATION_BY_KEY[r.station_key], r).length > 0;
  function amount(s, r) {
    const f = s.fields.find((x) => x.k === s.headline);
    if (!f) return null;
    let v = r.fields[s.headline];
    if (s.dayTabs && f.calc) {
      const only = Object.fromEntries(dayTabLines(s).map((k) => [k, (r.fields[k] || []).filter((x) => inDates(rowDay(r, x)))]));
      v = f.calc({ ...r.fields, ...only });
    }
    // A calc headline not saved on the row (Wet Intake's net lbs) is worked out from its fields.
    if ((v == null || v === '') && f.calc) v = f.calc(r.fields);
    if (v == null || v === '') return null;
    v = Number(v);
    return Number.isFinite(v) ? v : null;
  }
  const amountLabel = (s) => {
    const f = s.fields.find((x) => x.k === s.headline);
    if (!f) return '';
    if (!s.dayTabs) return t(f.l);
    if (isRange()) return t({ en: `${f.l.en} — those days`, es: `${f.l.es} — esos días` });
    return t(s.dayTabs.headline || { en: `${f.l.en} — that day`, es: `${f.l.es} — ese día` });
  };
  // When a day-tab page was last logged in the dates showing (its rows'
  // `at`), else when it was last saved.
  const lastAt = (s, r) => dayRows(s, r).map((x) => x.at).filter(Boolean).sort().pop() || r.updated_at;

  // ── Wet Intake by farm ─────────────────────────────────────────────────
  // Net wet lbs (totalWetLb) per farm, split by where it went: drying rooms,
  // or freezers — Fresh Frozen ticked, or a Drying / Freezer Location that's
  // one of the reference list's freezers. Farm is the license's name ("Wildcat:
  // CCL21-…" → Wildcat), so a farm's several licenses add up together.
  let ref = null;
  loadReference().then((r) => { ref = r; render(); }).catch(() => {});
  const pidFarm = (pid) => {
    const p = ((ref && ref.properties) || []).find((x) => String(x.pid) === String(pid));
    return p ? (p.farm || String(p.label || p.pid).split(': ')[0]) : (pid || '—');
  };
  const locIds = (f) => [].concat(f.dryRoom || []).map(String).filter(Boolean);
  const isFreezerLoc = (id) => ((ref && ref.freezers) || []).some((x) => x.id === id) || /freez|frz|congel/i.test(id);
  const toFreezer = (f) => isFreshFrozen(f) || (locIds(f).length > 0 && locIds(f).every(isFreezerLoc));
  const locLabel = (id) => {
    const x = [...((ref && ref.dryRooms) || []), ...((ref && ref.freezers) || [])].find((o) => o.id === id);
    return x ? x.label : id;
  };
  // "Room 1A", "Freezer 2", or "Fresh frozen · Walk-in" when the typed place doesn't say so.
  const destOf = (f) => {
    const where = locIds(f).map(locLabel).join(', ');
    if (!toFreezer(f)) return where;
    return where && locIds(f).every(isFreezerLoc) ? where : [t(L.freshFrozen), where].filter(Boolean).join(' · ');
  };
  function wetByFarm(list) {
    const by = {};
    list.filter((r) => r.station_key === 'intake_wet').forEach((r) => {
      const f = r.fields || {};
      const farm = pidFarm(f.pid);
      const x = by[farm] || (by[farm] = { farm, forms: 0, dry: 0, frozen: 0 });
      const lb = amount(STATION_BY_KEY.intake_wet, r) || 0;
      x.forms += 1;
      if (toFreezer(f)) x.frozen += lb; else x.dry += lb;
    });
    return Object.values(by).sort((a, b) => (b.dry + b.frozen) - (a.dry + a.frozen) || a.farm.localeCompare(b.farm));
  }
  const wetTotals = (farms) => farms.reduce((a, x) => ({ forms: a.forms + x.forms, dry: a.dry + x.dry, frozen: a.frozen + x.frozen }), { forms: 0, dry: 0, frozen: 0 });

  function renderWetSum(list) {
    const box = document.getElementById('wetsum');
    const farms = wetByFarm(list);
    if (!farms.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
    const tot = wetTotals(farms);
    const cells = (x) => `<td>${fmtNum(x.forms, 0)}</td><td>${x.dry ? fmtNum(x.dry, 2) : '·'}</td>` +
      `<td class="frz">${x.frozen ? fmtNum(x.frozen, 2) : '·'}</td><td class="tot">${fmtNum(x.dry + x.frozen, 2)}</td>`;
    box.style.display = 'block';
    box.innerHTML = `<div class="daysum-head"><div><h2>${t(L.wetTitle)}</h2><div class="hint">${t(L.wetHint)}</div></div></div>` +
      `<div class="daysum-scroll"><table class="sum-table"><thead><tr><th>${t(L.farm)}</th><th>${t(L.intakes)}</th>` +
      `<th>${t(L.intoDry)}</th><th class="frz">❄ ${t(L.intoFrozen)}</th><th class="tot">${t(L.totalLbs)}</th></tr></thead><tbody>` +
      farms.map((x) => `<tr><td>${esc(x.farm)}</td>${cells(x)}</tr>`).join('') +
      `</tbody><tfoot><tr><td>${t(L.sumTotal)}</td>${cells(tot)}</tr></tfoot></table></div>`;
  }

  // The dates' pages plus the day-tab pages started in the weeks before
  // with something logged in them.
  async function loadDates(a, b) {
    const multi = visibleStations.filter((s) => s.dayTabs);
    const [dated, ...earlier] = await Promise.all([a === b ? listToday(a) : listDays(a, b),
      ...multi.map((s) => listStationRange(s.key, shiftDate(a, -45), shiftDate(a, -1)))]);
    const more = earlier.flat().filter((r) => onBoard(r));
    return [...dated, ...more.filter((r) => !dated.some((x) => x.id === r.id))]
      .sort((x, y) => String(lastAt(STATION_BY_KEY[y.station_key], y)).localeCompare(String(lastAt(STATION_BY_KEY[x.station_key], x))));
  }

  async function goTo(a, b) {
    const today = todayStr();
    if (b > today) { a = shiftDay(a, -Math.round((Date.parse(b) - Date.parse(today)) / 86400000)); b = today; }
    if (a > b) a = b;
    from = a; to = b;
    if (isRange()) rangeMode = true;
    const url = new URL(location.href);
    if (!isRange() && from === today) url.searchParams.delete('date'); else url.searchParams.set('date', from);
    if (isRange()) url.searchParams.set('to', to); else url.searchParams.delete('to');
    history.replaceState(null, '', url);
    syncDateBar();
    document.getElementById('board').innerHTML = `<div class="empty">${t(L.loading)}</div>`;
    const fetched = (await loadDates(a, b)).filter((r) => visibleStations.some((s) => s.key === r.station_key));
    if (a !== from || b !== to) return;   // a newer pick landed while this one loaded
    rows = fetched;
    render();
  }

  function syncDateBar() {
    const today = todayStr();
    const isToday = !isRange() && from === today;
    dayInput.max = toInput.max = today;
    dayInput.value = from;
    toInput.value = to;
    document.getElementById('range-to').classList.toggle('on', rangeMode);
    rangeBtn.classList.toggle('on', rangeMode);
    document.getElementById('next-day').disabled = to >= today;
    todayBtn.classList.toggle('on', to === today && (isToday || rangeMode));
    const title = isToday ? t(L.title) : rangeLabel();
    document.getElementById('title').textContent = title;
    document.title = `${title} — 2CW`;
  }

  // UID and CID for the card: the form's own (a Wet Intake's CID fills in
  // from the Canix sync), else the distinct ones on its worksheet rows.
  function idsOf(f, k) {
    if (f[k]) return [String(f[k])];
    const out = new Set();
    Object.values(f).forEach((v) => {
      if (Array.isArray(v)) v.forEach((row) => { if (row && typeof row === 'object' && row[k]) out.add(String(row[k])); });
    });
    return [...out];
  }
  // Take Down also shows the Wet UID it came from (`incomingUid`) and its
  // drying room, so a take down can be found by its farm package.
  const short = (u) => (u.length > 5 ? `…${u.slice(-5)}` : u);
  function idsLine(r) {
    const f = r.fields;
    const uids = [...new Set(idsOf(f, 'sourceUid').map(short))], cids = idsOf(f, 'cid');
    const part = (lbl, xs) => xs.length ? `<span>${lbl ? lbl + ' ' : ''}<b>${xs.map(esc).join(', ')}</b></span>` : '';
    const takeDown = r.station_key === 'dry_check';
    const parts = [
      takeDown ? part(t(L.wetUid), f.incomingUid ? [short(String(f.incomingUid))] : []) : '',
      part(takeDown ? t(L.dryUid) : 'UID', uids), part('CID', cids),
      takeDown ? part('', locIds(f).map(locLabel)) : ''
    ].filter(Boolean);
    return parts.length ? `<div class="row-ids">${parts.join(' · ')}</div>` : '';
  }

  // Search: every word typed has to appear somewhere in the form's strain,
  // station, who filled it in, or any UID / CID / license / room / batch
  // on it (worksheet rows too) — so the last digits of a UID find it.
  const SEARCH_KEY = /uid|cid|pid|strain|room|location|batch|lot/i;
  function haystack(r) {
    const f = r.fields || {}, out = [r.strain, r.owner_user, f.lastEditedBy];
    const station = STATION_BY_KEY[r.station_key];
    if (station) out.push(station.title.en, station.title.es);
    const take = (k, v) => {
      if (!SEARCH_KEY.test(k) || v == null || typeof v === 'object') return;
      out.push(v);
      if (/room|location/i.test(k)) out.push(locLabel(String(v)));
    };
    Object.entries(f).forEach(([k, v]) => {
      if (Array.isArray(v)) v.forEach((x) => { if (x && typeof x === 'object') Object.entries(x).forEach(([k2, v2]) => take(k2, v2)); else take(k, x); });
      else take(k, v);
    });
    return out.filter((x) => x != null && x !== '').join(' ').toLowerCase();
  }
  const matchesQuery = (r) => {
    const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const h = haystack(r);
    return words.every((w) => h.includes(w));
  };
  const shownRows = () => rows.filter((r) => (!stationFilter || r.station_key === stationFilter) && matchesQuery(r));

  function render() {
    const filtered = shownRows();
    renderDaySum();
    renderWetSum(filtered);
    if (!pdfBusy) pdfBtn.disabled = !filtered.length;
    document.getElementById('sub').textContent =
      `${filtered.length} ${filtered.length === 1 ? 'form' : 'forms'}${!isRange() && from === todayStr() ? ' · ' + dayLabel(from) : ''}`;
    const board = document.getElementById('board');
    if (!filtered.length && query.trim()) {
      // Nothing here: offer the last two weeks, since the form to fix is
      // often from an earlier day.
      const wide = from === shiftDay(todayStr(), -13) && to === todayStr();
      board.className = '';
      board.innerHTML = `<div class="empty">${esc(t(L.noMatch).replace('{q}', query.trim()))}${wide ? '' : `<br><button class="wider" id="search-wider">${t(L.searchWider)}</button>`}</div>`;
      const b = document.getElementById('search-wider');
      if (b) b.onclick = () => { rangeMode = true; goTo(shiftDay(todayStr(), -13), todayStr()); };
      return;
    }
    if (!filtered.length) { board.className = ''; board.innerHTML = `<div class="empty">${t(isRange() ? L.emptyRange : from === todayStr() ? L.empty : L.emptyDay)}</div>`; return; }

    board.className = 'board';
    board.innerHTML = filtered.map((r) => {
      const station = STATION_BY_KEY[r.station_key];
      const headline = station && station.headline ? amount(station, r) : null;
      const headlineLabel = station && station.fields.find((f) => f.k === station.headline);
      return `<div class="row ${r.status}">
        <div class="row-top">
          <div>
            <div class="row-station">${station ? t(station.title) : r.station_key}</div>
            <div class="row-strain">${esc(r.strain || r.fields.harvestBatchName || '—')}</div>${
              r.station_key === 'intake_wet' && destOf(r.fields) ? `<div class="row-dest${toFreezer(r.fields) ? ' frz' : ''}">${toFreezer(r.fields) ? '❄ ' : ''}${esc(pidFarm(r.fields.pid))} → ${esc(destOf(r.fields))}</div>` : ''}${idsLine(r)}
          </div>
          <div class="pills"><span class="pill ${r.status}">${r.status === 'draft' ? t(L.draftPill) : t(L.submittedPill)}</span>${
            // Canix has a different strain for this Wet Intake's package
            // (canixStrainMismatch in ops_common.js) — once the Strain
            // Library has loaded, so an alias isn't flagged in the meantime.
            ref && canixStrainMismatch(r, ref) ? `<span class="pill check" title="Canix: ${esc(canixStrainMismatch(r, ref))}">${t(L.checkStrain)}</span>` : ''}</div>
        </div>
        <div class="row-meta">
          <span>${headlineLabel ? amountLabel(station) : ''}</span>
          <span class="row-headline">${headline !== null ? fmtNum(headline, headlineLabel && headlineLabel.dp !== undefined ? headlineLabel.dp : 2) : '—'}</span>
        </div>
        <div class="row-who"><span>${esc(r.owner_user || '—')} · ${t(L.updated)} ${timeAgo(lastAt(station, r))}${r.fields.lastEditedBy ? ` · ${t(L.edited)} ${esc(r.fields.lastEditedBy)}` : ''}</span>${
          r.status === 'submitted' && canFixSubmitted(r.station_key)
            ? `<a class="row-edit" href="/ops_form.html?station=${encodeURIComponent(r.station_key)}&edit=${encodeURIComponent(r.id)}&from=today">${t(L.edit)}</a>` : ''}</div>
      </div>`;
    }).join('');
  }

  // ── Daily summary (station.dailySummary) ───────────────────────────────
  // With one day showing and one station picked that keeps a daily summary
  // (Bucking, Hand Trim, Smalls), the notebook page sits above its forms: employee # and name
  // down the side, each flavor across, that day's weights and totals —
  // dailySummaryGrid in ops_common.js, the same table as under the form.
  // "Send as image" draws it as a picture to text (makeDaySumImage).
  let badgeNames = {};
  loadBadgeNames().then((n) => { badgeNames = n || {}; renderDaySum(); });
  const nameOf = (e) => badgeNames[badgeKey(e)] || '';
  const uid4 = (p) => (p.f.sourceUid ? `…${String(p.f.sourceUid).slice(-4)}` : '');

  function daySumData() {
    const s = stationFilter && STATION_BY_KEY[stationFilter];
    if (!s || !s.dailySummary || isRange()) return null;
    const pages = rows.filter((r) => r.station_key === s.key)
      .map((r) => ({ id: r.id, status: r.status, f: r.fields || {}, strain: r.strain || (r.fields || {}).strain }));
    return { s, cfg: s.dailySummary, ...dailySummaryGrid(s.dailySummary, pages, from) };
  }

  function renderDaySum() {
    const box = document.getElementById('daysum');
    const d = daySumData();
    if (!d) { box.style.display = 'none'; box.innerHTML = ''; return; }
    const { s, cfg, used, emps, grid, extra, colTot, empTot, all, inLb, dp } = d;
    box.style.display = 'block';
    // Shown even on a day with nothing weighed, so the button is always
    // where people expect it.
    const head = `<div class="daysum-head"><div><h2>${esc(t(cfg.title || s.title))}</h2><div class="hint">${t(L.sumHint)}</div></div>` +
      `<button type="button" class="daysum-send" id="daysum-send"${emps.length || extra ? '' : ' disabled'}>${t(L.sumSend)}</button></div>`;
    if (!emps.length && !extra) { box.innerHTML = head + `<div class="hint">${t(L.sumNone)}</div>`; return; }
    box.innerHTML = head +
      `<div class="daysum-scroll"><table class="sum-table"><thead><tr><th>${esc(t(cfg.empLabel || L.sumEmp))}</th><th class="name">${t(L.sumName)}</th>` +
      used.map((p) => `<th>${esc(p.strain || '—')}<br>${esc(uid4(p))}</th>`).join('') +
      `<th class="tot">${t(L.sumTotal)} ${inLb ? 'lbs' : 'g'}</th></tr></thead><tbody>` +
      emps.map((e) => `<tr><td>${esc(e)}</td><td class="name">${esc(nameOf(e))}</td>` +
        used.map((p) => (grid[e][p.id] ? `<td>${fmtNum(grid[e][p.id], dp)}</td>` : '<td class="zero">·</td>')).join('') +
        `<td class="tot">${fmtNum(empTot(e), dp)}</td></tr>`).join('') +
      // Bucking's recovered from leaf: nobody's, its own row under the people.
      (extra ? `<tr><td></td><td class="name">${esc(t(extra.l))}</td>` +
        used.map((p) => (extra.of(p) ? `<td>${fmtNum(extra.of(p), dp)}</td>` : '<td class="zero">·</td>')).join('') +
        `<td class="tot">${fmtNum(extra.total, dp)}</td></tr>` : '') +
      `</tbody><tfoot><tr><td>${t(L.sumTotal)}</td><td></td>` + used.map((p) => `<td>${fmtNum(colTot(p), dp)}</td>`).join('') +
      `<td class="tot">${fmtNum(all, dp)}</td></tr></tfoot></table></div>`;
    document.getElementById('daysum-send').onclick = makeDaySumImage;
  }

  // The table as a picture to text, like the Master Schedule's: drawn
  // straight onto a white canvas — title and date, employee # and name down
  // the side, each flavor across (strain over the UID's last 4), each
  // person's total, the totals row — then shown with Share / Download.
  // (Sharing waits for a tap on Share: phones only allow it straight from a
  // tap, and drawing comes first.)
  async function makeDaySumImage() {
    const d = daySumData();
    if (!d || (!d.emps.length && !d.extra)) return;
    const { s, cfg, used, emps, grid, extra, colTot, empTot, all, inLb, dp } = d;
    try { await document.fonts.ready; } catch {}
    const SANS = "'DM Sans', Arial, sans-serif", HEAD = "'Bebas Neue', 'Arial Narrow', Arial, sans-serif", MONO = "'DM Mono', Menlo, monospace";
    const C = { ink: '#16181d', sub: '#5b6170', line: '#e3e5ea', band: '#f6f7f9', head: '#eef7f2', green: '#3db87a', paper: '#ffffff' };
    const F = { title: `400 54px ${HEAD}`, date: `500 24px ${SANS}`, th: `700 17px ${SANS}`, thSub: `500 15px ${MONO}`,
                emp: `500 20px ${MONO}`, name: `500 20px ${SANS}`, num: `500 20px ${MONO}`, tot: `700 20px ${MONO}`, foot: `400 16px ${SANS}` };
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    const n = (x) => fmtNum(x, dp);
    // Column widths from what goes in them.
    const fit = (font, texts, min) => { ctx.font = font; return Math.max(min, ...texts.map((x) => ctx.measureText(x).width)) + 32; };
    const empHead = t({ en: 'Emp #', es: 'N.º' });
    const empW = Math.max(fit(F.emp, emps, 60), fit(F.th, [empHead], 0));
    const nameW = fit(F.name, [...emps.map(nameOf), extra ? t(extra.l) : ''], 160);
    const flavW = used.map((p) => Math.min(260, fit(F.th, [p.strain || '—'], 110)));
    const totW = fit(F.tot, [n(all) + ' ' + (inLb ? 'lbs' : 'g')], 120);
    const PAD = 36, ROWH = 46, HEADH = 70, TOP = 150, FOOTH = 60;
    const tableW = empW + nameW + flavW.reduce((a, w) => a + w, 0) + totW;
    const W = Math.max(720, Math.ceil(tableW + PAD * 2));
    const H = TOP + HEADH + (emps.length + (extra ? 1 : 0) + 1) * ROWH + FOOTH + 20;
    cv.width = W; cv.height = H;
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'middle';
    const when = new Date(from + 'T12:00:00Z').toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US',
      { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    ctx.fillStyle = C.ink; ctx.font = F.title; ctx.fillText(t(s.title).toUpperCase(), PAD, PAD + 26);
    ctx.fillStyle = C.sub; ctx.font = F.date; ctx.fillText(`${when}  ·  ${inLb ? 'lbs' : t({ en: 'grams', es: 'gramos' })}`, PAD, PAD + 78);
    const clip = (text, maxW) => { let x = String(text); while (x.length > 2 && ctx.measureText(x).width > maxW) x = x.slice(0, -2) + '…'; return x; };
    // x of each column, and how it's aligned
    const cols = [{ w: empW, al: 'left' }, { w: nameW, al: 'left' }, ...flavW.map((w) => ({ w, al: 'right' })), { w: totW, al: 'right' }];
    let cx = PAD; cols.forEach((c) => { c.x = cx; cx += c.w; });
    const cell = (i, text, y, font, color) => {
      const c = cols[i];
      ctx.font = font; ctx.fillStyle = color || C.ink;
      ctx.textAlign = c.al;
      ctx.fillText(clip(text, c.w - 24), c.al === 'left' ? c.x + 12 : c.x + c.w - 12, y);
    };
    // Header: green band, flavor names over their UID's last 4
    let y = TOP;
    ctx.fillStyle = C.head; ctx.fillRect(PAD, y, tableW, HEADH);
    ctx.fillStyle = C.green; ctx.fillRect(PAD, y + HEADH - 3, tableW, 3);
    cell(0, empHead, y + HEADH / 2, F.th);
    cell(1, t(L.sumName), y + HEADH / 2, F.th);
    used.forEach((p, i) => {
      cell(i + 2, p.strain || '—', y + 24, F.th);
      if (uid4(p)) cell(i + 2, uid4(p), y + 48, F.thSub, C.sub);
    });
    cell(cols.length - 1, t(L.sumTotal), y + HEADH / 2, F.th);
    y += HEADH;
    emps.forEach((e, r) => {
      if (r % 2) { ctx.fillStyle = C.band; ctx.fillRect(PAD, y, tableW, ROWH); }
      ctx.fillStyle = C.line; ctx.fillRect(PAD, y + ROWH - 1, tableW, 1);
      const mid = y + ROWH / 2;
      cell(0, e, mid, F.emp);
      cell(1, nameOf(e), mid, F.name, C.sub);
      used.forEach((p, i) => cell(i + 2, grid[e][p.id] ? n(grid[e][p.id]) : '·', mid, F.num, grid[e][p.id] ? C.ink : C.line));
      cell(cols.length - 1, n(empTot(e)), mid, F.tot);
      y += ROWH;
    });
    // Recovered from leaf (Bucking): nobody's, its own row under the people.
    if (extra) {
      ctx.fillStyle = C.head; ctx.fillRect(PAD, y, tableW, ROWH);
      const mid = y + ROWH / 2;
      cell(1, t(extra.l), mid, F.name, C.ink);
      used.forEach((p, i) => cell(i + 2, extra.of(p) ? n(extra.of(p)) : '·', mid, F.num, extra.of(p) ? C.ink : C.line));
      cell(cols.length - 1, n(extra.total), mid, F.tot);
      y += ROWH;
    }
    // Totals row
    ctx.fillStyle = C.ink; ctx.fillRect(PAD, y, tableW, 2);
    const mid = y + ROWH / 2 + 2;
    cell(0, t(L.sumTotal), mid, F.th);
    used.forEach((p, i) => cell(i + 2, n(colTot(p)), mid, F.tot));
    cell(cols.length - 1, `${n(all)} ${inLb ? 'lbs' : 'g'}`, mid, F.tot, C.green);
    ctx.textAlign = 'left';
    ctx.fillStyle = C.sub; ctx.font = F.foot;
    ctx.fillText(`2CW · ${t({ en: 'made', es: 'hecho' })} ${new Date().toLocaleString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`, PAD, H - FOOTH / 2);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
    showImage(blob, `${s.key}-${from}.png`);
  }

  // ── Report PDF ─────────────────────────────────────────────────────────
  // The dates on screen (and the station filter, if one is picked) as plain
  // white Letter pages — drawn as text with jsPDF so it stays small and sharp
  // for texting. Phones get the share sheet (Messages, Mail, Files);
  // desktop downloads it. Same pattern as the PDFs in menu.html / msa_agreement.js.
  let jsPdfPromise = null, pdfBusy = false;
  function loadJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    jsPdfPromise = jsPdfPromise || new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
      s.onload = () => resolve(window.jspdf.jsPDF);
      s.onerror = () => { jsPdfPromise = null; reject(new Error('couldn’t load the PDF maker — check the connection.')); };
      document.head.appendChild(s);
    });
    return jsPdfPromise;
  }

  // ── Labor $ (Labor $ box ticked) ───────────────────────────────────────
  // Two views of the same dates, costed at each person's rate on the day
  // (rateFor, as the Labor Log and the emailed report do):
  //   byProcess — Labor Log entries (station_key 'labor_entry'), by the
  //               station/process they were logged to; with a station picked,
  //               only that station's.
  //   clocked   — Connecteam shifts (data/connecteam_shifts.json, last 14
  //               days, farm-local dates) by activity, all stations only. A
  //               shift still open today counts up to now; an open one on an
  //               earlier day is a missed clock-out and isn't counted.
  const DATA_BASE = 'https://raw.githubusercontent.com/bobby2soxRC/2cw-dashboard/main/data/';
  const TZ = 'America/Los_Angeles';
  const localDay = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  async function loadLabor() {
    const res = await fetch('/.netlify/functions/labor-rates', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: sessionStorage.getItem('2cw_pin') || '' }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) throw new Error(t(L.ratesErr) + (j.error || res.status));
    const rates = j.rates || [];
    const A = window.OpsAnalytics;
    const add = (o, k, name, hrs, rate, who) => {
      const x = o[k] || (o[k] = { key: k, name, hours: 0, cost: 0, unrated: 0, people: new Set() });
      x.hours += hrs;
      if (rate == null) x.unrated += hrs; else x.cost += hrs * rate;
      if (who) x.people.add(who);
    };

    const entries = (await listDays(from, to)).filter((r) => r.station_key === 'labor_entry' && r.status === 'submitted' && !(r.fields || {}).voided);
    const procs = {};
    entries.forEach((r) => {
      const f = r.fields || {};
      const k = f.process || 'other';
      if (stationFilter ? k !== stationFilter : (STATION_BY_KEY[k] && !canSee(k))) return;
      const hrs = Number(f.hours) || 0;
      if (!hrs) return;
      add(procs, k, t(processTitle(k)), hrs, A.rateFor(rates, f.employeeId, r.work_date), f.employeeId || f.employeeName);
    });
    const order = [...OPERATIONS_STATIONS.map((x) => x.key), ...Object.keys(LABOR_PROCESSES)];
    const byProcess = Object.values(procs).sort((x, y) => order.indexOf(x.key) - order.indexOf(y.key));

    let clocked = null;
    if (!stationFilter) {
      clocked = { error: false, byActivity: [], firstDay: null };
      try {
        const r = await fetch(DATA_BASE + 'connecteam_shifts.json?t=' + Date.now());
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        const today = localDay(new Date());
        const acts = {};
        (data.shifts || []).forEach((sh) => {
          const start = new Date(sh.start);
          const d = localDay(start);
          if (!clocked.firstDay || d < clocked.firstDay) clocked.firstDay = d;
          if (!inDates(d)) return;
          let end = sh.end ? new Date(sh.end).getTime() : null;
          if (!end) { if (d < today) return; end = Date.now(); }
          const hrs = Math.max(0, (end - start.getTime()) / 3600000);
          // "Hanging / Colgar · Esensia" counts as Hanging (as ops_report.js).
          const act = String(sh.activity || '').split(' · ')[0].trim() || '—';
          add(acts, act, act, hrs, A.rateFor(rates, sh.userId, d), sh.userId);
        });
        clocked.byActivity = Object.values(acts).sort((x, y) => y.hours - x.hours);
      } catch (e) {
        console.error('connecteam shifts', e);
        clocked.error = true;
      }
    }
    return { byProcess, clocked };
  }

  function buildPdf(jsPDF, list, labor) {
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const W = 612, H = 792, M = 40, BOTTOM = H - 50;
    let y = M;
    const fit = (txt, w) => {   // one line, cut with an ellipsis to fit width w
      txt = String(txt == null ? '' : txt);
      if (doc.getTextWidth(txt) <= w) return txt;
      while (txt.length > 1 && doc.getTextWidth(txt + '…') > w) txt = txt.slice(0, -1);
      return txt + '…';
    };
    const ensure = (h) => { if (y + h > BOTTOM) { doc.addPage(); y = M; } };
    // Over several days the time needs its date too.
    const timeOf = (iso) => new Date(iso).toLocaleString(undefined, isRange()
      ? { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' } : { hour: 'numeric', minute: '2-digit' });
    const filterName = stationFilter && STATION_BY_KEY[stationFilter] ? t(STATION_BY_KEY[stationFilter].title) : t(L.allStations);
    const usd = (x) => '$' + Math.round(x).toLocaleString('en-US');

    // Header
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(20);
    doc.text(`2CW — ${t(isRange() ? L.reportTitleRange : L.reportTitle)}`, M, y + 14); y += 34;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(60);
    doc.text(fit(`${rangeLabel()}  ·  ${filterName}${query.trim() ? `  ·  “${query.trim()}”` : ''}`, W - 2 * M), M, y); y += 16;
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text(`${t(L.generated)} ${new Date().toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}`, M, y); y += 10;
    doc.setDrawColor(61, 184, 122); doc.setLineWidth(2); doc.line(M, y, W - M, y); y += 22;

    // Group by station, in station-list order
    const groups = OPERATIONS_STATIONS
      .map((s) => ({ s, rows: list.filter((r) => r.station_key === s.key) }))
      .filter((g) => g.rows.length);
    const hl = (s) => s.fields.find((f) => f.k === s.headline);
    const dp = (s) => { const f = hl(s); return f && f.dp !== undefined ? f.dp : 2; };
    const num = (s, r) => (s.headline ? amount(s, r) : null);

    // Summary
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(20);
    doc.text(t(L.summary), M, y); y += 16;
    const sumCols = [M, M + 230, M + 340];
    doc.setFontSize(8); doc.setTextColor(120);
    doc.text(t(L.station).toUpperCase(), sumCols[0], y);
    doc.text(t(L.forms).toUpperCase(), sumCols[1], y);
    doc.text(t(L.total).toUpperCase(), sumCols[2], y);
    y += 5; doc.setDrawColor(200); doc.setLineWidth(.5); doc.line(M, y, W - M, y); y += 13;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    groups.forEach(({ s, rows }) => {
      ensure(16);
      const drafts = rows.filter((r) => r.status === 'draft').length;
      const vals = rows.map((r) => num(s, r)).filter((v) => v !== null);
      const f = hl(s);
      doc.setTextColor(20);
      doc.text(fit(t(s.title), 220), sumCols[0], y);
      doc.text(`${rows.length}${drafts ? ` (${drafts} ${t(L.draftPill).toLowerCase()})` : ''}`, sumCols[1], y);
      doc.text(fit(vals.length && f ? `${fmtNum(vals.reduce((a, b) => a + b, 0), dp(s))}  ${amountLabel(s)}` : '—', W - M - sumCols[2]), sumCols[2], y);
      y += 16;
    });
    y += 14;

    // Wet Intake by farm: dry rooms vs freezers
    const farms = wetByFarm(list);
    if (farms.length) {
      const wc = [M, M + 200, M + 270, M + 370, M + 470];
      ensure(60);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(20);
      doc.text(t(L.wetTitle), M, y); y += 16;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
      [t(L.farm), t(L.intakes), t(L.intoDry), t(L.intoFrozen), t(L.totalLbs)].forEach((h, i) => doc.text(h.toUpperCase(), wc[i], y));
      y += 5; doc.setDrawColor(200); doc.setLineWidth(.5); doc.line(M, y, W - M, y); y += 13;
      doc.setFontSize(10);
      const line = (x, bold) => {
        ensure(16);
        doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setTextColor(20);
        doc.text(fit(x.farm, wc[1] - wc[0] - 10), wc[0], y);
        doc.text(fmtNum(x.forms, 0), wc[1], y);
        doc.text(x.dry ? fmtNum(x.dry, 2) : '—', wc[2], y);
        doc.setTextColor(40, 110, 170);
        doc.text(x.frozen ? fmtNum(x.frozen, 2) : '—', wc[3], y);
        doc.setTextColor(20);
        doc.text(fmtNum(x.dry + x.frozen, 2), wc[4], y);
        y += 16;
      };
      farms.forEach((x) => line(x));
      if (farms.length > 1) {
        doc.setDrawColor(120); doc.line(M, y - 11, W - M, y - 11); y += 2;
        line({ farm: t(L.sumTotal), ...wetTotals(farms) }, true);
      }
      doc.setFont('helvetica', 'normal');
      y += 14;
    }

    // Labor: name | hours | people | $ tables, then the unrated / coverage notes.
    if (labor) {
      const lc = [M, M + 250, M + 330, M + 410];
      const table = (title, items, none, extraNote) => {
        ensure(60);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20);
        doc.text(title, M, y); y += 14;
        if (!items.length) {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(120);
          doc.text(none, M, y); y += 16;
        } else {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
          [items === labor.byProcess ? t(L.station) : t(L.activity), t(L.hours), t(L.people), t(L.laborCost)]
            .forEach((h, i) => doc.text(h.toUpperCase(), lc[i], y));
          y += 5; doc.setDrawColor(200); doc.line(M, y, W - M, y); y += 13;
          doc.setFontSize(10); doc.setTextColor(20);
          const tot = { hours: 0, cost: 0, unrated: 0, people: new Set() };
          items.forEach((x) => {
            ensure(16);
            doc.text(fit(x.name, lc[1] - lc[0] - 10), lc[0], y);
            doc.text(fmtNum(x.hours, 1), lc[1], y);
            doc.text(String(x.people.size || '—'), lc[2], y);
            doc.text(x.hours > x.unrated ? usd(x.cost) : '—', lc[3], y);
            tot.hours += x.hours; tot.cost += x.cost; tot.unrated += x.unrated;
            x.people.forEach((p) => tot.people.add(p));
            y += 16;
          });
          ensure(20);
          doc.setDrawColor(120); doc.line(M, y - 11, W - M, y - 11); y += 2;
          doc.setFont('helvetica', 'bold');
          doc.text(t(L.total), lc[0], y);
          doc.text(fmtNum(tot.hours, 1), lc[1], y);
          doc.text(String(tot.people.size || '—'), lc[2], y);
          doc.text(tot.hours > tot.unrated ? usd(tot.cost) : '—', lc[3], y);
          doc.setFont('helvetica', 'normal');
          y += 16;
          if (tot.unrated > 0.05) {
            ensure(14); doc.setFontSize(8.5); doc.setTextColor(120);
            doc.text(t(L.unrated).replace('{h}', fmtNum(tot.unrated, 1)), M, y); y += 12;
          }
        }
        if (extraNote) {
          ensure(14); doc.setFontSize(8.5); doc.setTextColor(120);
          doc.text(extraNote, M, y); y += 12;
        }
        y += 10;
      };
      ensure(40);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(20);
      doc.text(t(L.labor), M, y); y += 18;
      table(t(L.laborLog), labor.byProcess, t(L.laborNone));
      const c = labor.clocked;
      if (c) {
        table(t(L.clocked), c.byActivity, t(c.error ? L.clockedErr : L.clockedNone),
          !c.error && c.firstDay && from < c.firstDay ? t(L.clockedOld) : '');
      }
      doc.setFontSize(8.5); doc.setTextColor(120);
      doc.splitTextToSize(t(L.laborNote), W - 2 * M).forEach((line) => { ensure(12); doc.text(line, M, y); y += 11; });
      y += 18;
    }

    // Detail, one table per station (a wider Updated column for a range's dates)
    const cols = isRange() ? [M, M + 170, M + 245, M + 335, M + 430] : [M, M + 190, M + 275, M + 375, M + 470];
    groups.forEach(({ s, rows }) => {
      const f = hl(s);
      ensure(60);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20);
      doc.text(fit(t(s.title), W - 2 * M), M, y); y += 14;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
      [t(L.strain), t(L.status), f ? amountLabel(s) : '', t(L.by), t(L.time)]
        .forEach((h, i) => doc.text(fit(h.toUpperCase(), (cols[i + 1] || W - M) - cols[i] - 8), cols[i], y));
      y += 5; doc.setDrawColor(200); doc.line(M, y, W - M, y); y += 13;
      doc.setFontSize(10);
      rows.forEach((r) => {
        ensure(16);
        const v = num(s, r);
        doc.setTextColor(20);
        const dest = s.key === 'intake_wet' ? destOf(r.fields) : '';
        doc.text(fit((r.strain || r.fields.harvestBatchName || '—') + (dest ? ` · ${dest}` : ''), cols[1] - cols[0] - 10), cols[0], y);
        if (r.status === 'draft') doc.setTextColor(176, 130, 30); else doc.setTextColor(40, 140, 90);
        doc.text(r.status === 'draft' ? t(L.draftPill) : t(L.submittedPill), cols[1], y);
        doc.setTextColor(20);
        doc.text(v === null ? '—' : fmtNum(v, dp(s)), cols[2], y);
        doc.text(fit(r.owner_user || '—', cols[4] - cols[3] - 8), cols[3], y);

        y += 16;
      });
      y += 14;
    });

    // Footer on every page
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFontSize(8); doc.setTextColor(140);
      doc.text('2CW Enterprises  ·  Confidential  ·  Not for Distribution', M, H - 28);
      doc.text(`${t(L.page)} ${i} / ${pages}`, W - M, H - 28, { align: 'right' });
    }
    return doc;
  }

  async function sharePdf() {
    const list = shownRows();
    if (!list.length) return;
    const withCost = canCost && costOn.checked;
    pdfBusy = pdfBtn.disabled = true;
    pdfBtn.textContent = t(L.pdfBusy);
    try {
      const [jsPDF, labor] = await Promise.all([loadJsPdf(), withCost ? loadLabor() : null]);
      const doc = buildPdf(jsPDF, list, labor);
      const dates = isRange() ? `${from} to ${to}` : from;
      const name = `2CW Ops Report ${dates}${stationFilter ? ' ' + t(STATION_BY_KEY[stationFilter].title).replace(/[\\/:*?"<>|]+/g, '') : ''}${withCost ? ' (labor $)' : ''}.pdf`;
      const file = new File([doc.output('blob')], name, { type: 'application/pdf' });
      if (navigator.canShare && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); }
        catch (e) { if (e.name !== 'AbortError') doc.save(name); }
      } else {
        doc.save(name);
      }
    } catch (e) {
      alert(t(L.pdfFailed) + (e && e.message || e));
    }
    pdfBusy = false;
    pdfBtn.textContent = t(L.pdfBtn);
    render();
  }

  await goTo(from, to);

  // Realtime: a row landing here means someone's autosave just committed on
  // another tablet. Patch it into the local list rather than refetching —
  // whichever dates are showing, so an edit to an older form shows up too.
  subscribeToday((row) => {
    if (!row || !visibleStations.some((s) => s.key === row.station_key)) return;
    const i = rows.findIndex((r) => r.id === row.id);
    if (!row.fields || !onBoard(row)) {
      // A day-tab page whose rows in these dates were all removed or moved.
      if (i > -1 && row.fields) { rows.splice(i, 1); render(); }
      return;
    }
    if (i > -1) rows[i] = row; else rows.unshift(row);
    render();
  });
  setInterval(render, 15000);   // keeps the "updated Ns ago" labels honest between events
})();
</script>
</body>
</html>
