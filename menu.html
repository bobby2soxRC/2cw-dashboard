<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2CW — Wholesale Menu</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2CW Ops">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0d0f;color:#e8eaf0;font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}

  /* ── APP CHROME (not printed) ── */
  .nav{background:#181c26;border-bottom:1px solid #2a2f42;padding:0 20px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:100;gap:14px;flex-wrap:wrap}
  .nav-back{display:flex;align-items:center;height:52px;padding:0 14px;font-size:12px;font-weight:500;color:#7b8099;text-decoration:none;border-right:1px solid #2a2f42;transition:color .15s;flex-shrink:0}
  .nav-back:hover{color:#e8eaf0}
  .nav-brand{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em;color:#e8eaf0;flex-shrink:0}
  .nav-brand span{color:#00c9a7}
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0;flex:1}
  .tb-group{display:flex;align-items:center;gap:8px}
  .tb-label{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7b8099}
  .loc-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:16px;border:1.5px solid #2a2f42;background:#1e2333;cursor:pointer;transition:all .15s;user-select:none;font-size:12px;font-weight:600}
  .loc-chip .dot{width:6px;height:6px;border-radius:50%;background:#5a6070}
  .loc-chip.on{border-color:#00c9a7;background:rgba(0,201,167,.12);color:#fff}
  .loc-chip.on .dot{background:#00c9a7;box-shadow:0 0 5px #00c9a7}
  .slider-input{width:90px;accent-color:#00c9a7}
  .slider-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:#00c9a7;min-width:14px;text-align:center}
  .switch{position:relative;display:inline-block;width:34px;height:19px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch-track{position:absolute;cursor:pointer;inset:0;background:#2a2f42;border-radius:19px;transition:.15s}
  .switch-track::before{content:'';position:absolute;height:15px;width:15px;left:2px;bottom:2px;background:#7b8099;border-radius:50%;transition:.15s}
  .switch input:checked + .switch-track{background:rgba(0,201,167,.35)}
  .switch input:checked + .switch-track::before{transform:translateX(15px);background:#00c9a7}
  .tb-btn{background:#1e2333;color:#e8eaf0;border:1px solid #2a2f42;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
  .tb-btn:hover{border-color:#00c9a7;color:#00c9a7}
  .tb-btn:disabled{opacity:.5;cursor:default}
  .tb-btn.primary{background:#00c9a7;color:#04120e;border-color:#00c9a7;font-weight:700;margin-left:auto}
  .tb-btn.primary:hover{opacity:.88;color:#04120e}
  .updated-note{font-family:'DM Mono',monospace;font-size:10px;color:#5a6070;margin-left:auto}
  .seg{display:flex;border:1.5px solid #2a2f42;border-radius:16px;overflow:hidden}
  .seg button{background:#1e2333;color:#7b8099;border:0;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .seg button+button{border-left:1px solid #2a2f42}
  .seg button.on{background:rgba(0,201,167,.18);color:#fff}
  .seg button:disabled{opacity:.4;cursor:default}
  .tb-group.muted{opacity:.4}

  .loading{display:flex;align-items:center;gap:10px;color:#7b8099;font-size:13px;padding:60px 24px;justify-content:center}
  .spinner{width:18px;height:18px;border:2px solid #2a2f42;border-top-color:#00c9a7;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-msg{background:rgba(240,92,92,.1);border:1px solid rgba(240,92,92,.3);border-radius:8px;padding:14px 18px;color:#f05c5c;font-size:13px;margin:24px}

  .page-outer{padding:28px 20px 60px;max-width:1180px;margin:0 auto}

  /* ── PRINTABLE MENU PAGE ── */
  #menuPage{background:#fff;color:#14201b;border-radius:10px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.45);font-family:'DM Sans',sans-serif}

  .wm-header{display:flex;align-items:center;gap:28px;background:linear-gradient(135deg,#0f2a22 0%,#123a2e 55%,#0d4a3d 100%);color:#fff;padding:26px 40px}
  .wm-hdr-word{font-family:'Bebas Neue',sans-serif;font-size:50px;letter-spacing:.05em;line-height:1}
  .wm-hdr-word span{color:#4de8c4}
  .wm-menu-logo{height:50px;width:150px;object-fit:contain;object-position:left center;display:block}
  .wm-hdr-mid{flex:1}
  .wm-hdr-sub{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:4px}
  .wm-hdr-main{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.05em;color:#fff}
  .wm-hdr-detail{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;color:rgba(255,255,255,.55);margin-top:6px}
  .wm-hdr-right{text-align:right;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.5);line-height:1.8}
  .wm-brand-logos{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
  .wm-blogo-chip{background:#fff;border-radius:7px;padding:5px 9px;display:flex;align-items:center;justify-content:center;height:34px}
  .wm-blogo-chip img{max-height:24px;max-width:78px;object-fit:contain;display:block}

  /* brand zone — a compact solid-color title bar is the fallback (no banner
     uploaded yet). Once a real banner exists, it replaces the bar entirely and
     renders at its own natural aspect ratio — no crop, so the banner's logo
     always shows in full instead of being squeezed into a thin strip. */
  .wm-brand-bar{padding:14px 40px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.08em;color:#fff;display:flex;align-items:center;gap:14px}
  .wm-brand-bar .wm-brand-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;font-weight:700;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:12px}
  .wm-brand-howie{background-color:#b5410c}
  .wm-brand-soma{background-color:#0d6e61}
  .wm-brand-mendo{background-color:#495c2a}
  .wm-brand-banner-img{width:100%;height:auto;display:block}

  /* promo banner — full-width image slot between the header and the first brand row.
     No forced crop: this is marketing copy, not a decorative photo, so it renders at
     its own natural aspect ratio rather than risking cropped-off text. */
  .wm-promo-banner{width:100%;height:auto;display:block}

  .wm-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #eee}
  .wm-card{padding:16px 18px;border-right:1px solid #eee;border-top:1px solid #eee;display:flex;flex-direction:column}
  .wm-card:nth-child(3n){border-right:none}
  .wm-howie .wm-card-accent{background:#b5410c}
  .wm-soma .wm-card-accent{background:#0d6e61}
  .wm-mendo .wm-card-accent{background:#495c2a}
  .wm-card-img{height:110px;margin:-16px -18px 10px;background-size:cover;background-position:center;border-bottom:1px solid #eee}
  .wm-card-accent{height:3px;border-radius:2px;margin-bottom:10px}
  .wm-card-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.03em;color:#14201b;margin-bottom:8px}
  .wm-specs{border-top:1px solid #eee;border-bottom:1px solid #eee;margin-bottom:8px}
  .wm-spec{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;color:#777}
  .wm-spec b{color:#14201b;font-weight:700}
  .wm-case-price{display:flex;justify-content:space-between;align-items:center;color:#fff;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;padding:6px 10px;border-radius:4px;margin-bottom:10px}
  .wm-howie .wm-case-price{background:#b5410c}
  .wm-soma .wm-case-price{background:#0d6e61}
  .wm-mendo .wm-case-price{background:#495c2a}
  .wm-case-price span{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.02em}
  .wm-was{font-weight:400;opacity:.6}
  .wm-promo{display:inline-block;background:#c8102e;color:#fff;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:3px;margin:-2px 0 6px}
  .wm-flavors-hdr{font-family:'DM Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.18em;color:#999;margin-bottom:6px}
  .wm-flavors{flex:1}
  .wm-fgroup{margin-bottom:6px}
  .wm-type-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.1em;color:#fff;border-radius:3px;padding:1.5px 6px;margin-bottom:3px}
  .t-sativa{background:#d4500a}
  .t-indica{background:#5b2182}
  .t-hybrid{background:#1a6b45}
  .wm-flist{list-style:none;padding:0}
  .wm-flist li{font-size:10.5px;color:#333;padding:1.5px 0;display:flex;align-items:baseline;gap:5px}
  .wm-fname{flex:1}
  .wm-fthc{font-family:'DM Mono',monospace;font-size:9px;color:#999}
  .wm-floc{display:flex;gap:2px}
  .wm-loc-dot{font-family:'DM Mono',monospace;font-size:7px;font-weight:700;color:#fff;border-radius:3px;padding:0 3px;letter-spacing:.02em}
  .wm-loc-dot.norcal{background:#4a90a4}
  .wm-loc-dot.socal{background:#c0752a}

  .wm-footer{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:#f7f7f5;border-top:2px solid #14201b;flex-wrap:wrap;gap:10px}
  .wm-footer-tag{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.03em;color:#14201b}
  .wm-footer-sub{font-family:'DM Mono',monospace;font-size:9px;color:#999;margin-top:2px}
  .wm-key{display:flex;gap:14px;align-items:center;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em}
  .wm-key span::before{content:'●';margin-right:4px}
  .wm-key .k-sativa{color:#d4500a}
  .wm-key .k-indica{color:#5b2182}
  .wm-key .k-hybrid{color:#1a6b45}

  @media(max-width:900px){
    .wm-grid{grid-template-columns:repeat(2,1fr)}
    .wm-card:nth-child(3n){border-right:1px solid #eee}
    .wm-card:nth-child(2n){border-right:none}
  }
  @media(max-width:640px){
    .wm-header{flex-direction:column;align-items:flex-start;gap:10px;padding:20px 22px}
    .wm-hdr-right{text-align:left}
    .wm-grid{grid-template-columns:1fr}
    .wm-card{border-right:none!important}
    .wm-brand-bar,.wm-footer{padding-left:22px;padding-right:22px}
  }

  @media print{
    body{background:#fff}
    .nav,.loading,.error-msg{display:none!important}
    .page-outer{padding:0;max-width:100%}
    #menuPage{border-radius:0;box-shadow:none}
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/index.html" class="nav-back">← Hub</a>
  <div class="nav-brand">2CW <span>Menu</span></div>
  <div class="toolbar">
    <div class="tb-group">
      <span class="tb-label">Source</span>
      <div class="seg">
        <button type="button" id="srcLive" onclick="setSource('live')">Live data</button>
        <button type="button" id="srcSheet" onclick="setSource('sheet')" disabled title="Upload a KSS menu spreadsheet first">Spreadsheet</button>
      </div>
      <button class="tb-btn" id="uploadBtn" onclick="$('sheetFile').click()">⬆ Upload sheet</button>
      <input type="file" id="sheetFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="uploadSheet(this.files[0]); this.value=''">
    </div>
    <div class="tb-group">
      <span class="tb-label">Warehouse</span>
      <div id="loc-chips" style="display:flex;gap:6px"></div>
    </div>
    <div class="tb-group">
      <span class="tb-label">Promo Banner</span>
      <label class="switch">
        <input type="checkbox" id="promoToggle" checked>
        <span class="switch-track"></span>
      </label>
    </div>
    <div class="tb-group">
      <span class="tb-label">Min Cases</span>
      <input type="range" min="0" max="20" step="1" value="1" id="minSlider" class="slider-input">
      <span class="slider-val" id="minVal">1</span>
    </div>
    <div class="tb-group age-group" title="">
      <span class="tb-label">Days Old — Min</span>
      <input type="range" min="0" max="180" step="1" value="0" id="minAgeSlider" class="slider-input">
      <span class="slider-val" id="minAgeVal">0</span>
    </div>
    <div class="tb-group age-group" title="">
      <span class="tb-label">Days Old — Max</span>
      <input type="range" min="0" max="180" step="1" value="180" id="maxAgeSlider" class="slider-input">
      <span class="slider-val" id="maxAgeVal">180</span>
    </div>
    <button class="tb-btn" id="refreshBtn" onclick="loadAll()">↻ Refresh</button>
    <span class="updated-note" id="updated-note"></span>
    <button class="tb-btn primary" id="pdfBtn" onclick="publishPDF()">📄 Publish PDF</button>
  </div>
</nav>

<div id="global-loading" class="loading"><div class="spinner"></div>Loading menu…</div>
<div id="global-error" class="error-msg" style="display:none"></div>

<div class="page-outer" id="page-outer" style="display:none">
  <div id="menuPage"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let MENU = null;
let selectedLocations = JSON.parse(localStorage.getItem('2cw_menu_locations') || '["norcal","socal"]');
let minCases = +(localStorage.getItem('2cw_menu_mincases') ?? '1');
let minAgeDays = +(localStorage.getItem('2cw_menu_minage') ?? '0');
let maxAgeDays = +(localStorage.getItem('2cw_menu_maxage') ?? '180');
let showPromo = (localStorage.getItem('2cw_menu_showpromo') ?? '1') === '1';

// Marketing/design manage art in the "2CW Menu Images" Drive folder; a
// GitHub Action (manually triggered — Actions tab → "Sync Menu Images" →
// Run workflow) pulls whatever's currently there into /img/menu/, which is
// what these paths actually point at. (Drive can't serve images directly to
// a third-party page — it blocks hotlinked <img> embeds even when public —
// so the sync step is required, not optional.)
// Folder: https://drive.google.com/drive/folders/1t8zwDVyoyCbmdmIRs3dUJHO6qO_qgLJv
const ASSET_PATHS = {
  logo: '/img/menu/menulogo.png',
  promo: '/img/menu/promobanner.png',
  banners: {
    howie: '/img/menu/hwrbanner.png',
    soma: '/img/menu/somabanner.png',
    mendo: '/img/menu/mendobanner.png',
  },
};

// One photo per menu card (title|brand). Falls back to no photo if the file
// isn't present in /img/menu — checked at load time via probeAllAssets().
const CARD_IMAGES = {
  'All-In-One Vape|Howie Roll': '/img/menu/howie_roll_vape.png',
  'Live Resin Sauce|Howie Roll': '/img/menu/howie_roll_live_resin.png',
  'Premium Smalls (1/8)|Howie Roll': '/img/menu/howie_roll_smalls_eighth.png',
  'Premium Smalls (14G)|Howie Roll': '/img/menu/howie_roll_smalls_14g.png',
  'All-In-One Vape|Mendo': '/img/menu/mendo_vape.png',
  'Indoor Flower (1/8)|Mendo': '/img/menu/mendo_flower_eighth.png',
  'Indoor Flower (14G)|Mendo': '/img/menu/mendo_flower_14g.png',
  'Indoor Flower (1G)|Mendo': '/img/menu/mendo_flower_1g.png',
  'Pre-Roll 10-Pack|Mendo': '/img/menu/mendo_preroll_10pack.png',
  'Flower (1/8)|Soma Rosa Farms': '/img/menu/soma_rosa_flower_eighth.png',
  'Flower (14G)|Soma Rosa Farms': '/img/menu/soma_rosa_flower_14g.png',
  'Flower (28G)|Soma Rosa Farms': '/img/menu/soma_rosa_flower_28g.png',
  'Live Rosin|Soma Rosa Farms': '/img/menu/soma_rosa_live_rosin.png',
  'Pre-Roll Party Packs — 28ct|Soma Rosa Farms': '/img/menu/soma_rosa_jar.png',
  'Pre-Rolls — Single 1g|Soma Rosa Farms': '/img/menu/soma_rosa_preroll_single.png',
};

const ASSET_OK = {}; // url -> true/false, populated by probeAllAssets() before first render

function probeImage(url){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function probeAllAssets(){
  const urls = [ASSET_PATHS.logo, ASSET_PATHS.promo, ...Object.values(ASSET_PATHS.banners), ...Object.values(CARD_IMAGES)];
  await Promise.all(urls.map(async url => { ASSET_OK[url] = await probeImage(url); }));
}

// Time-limited discounts off the DATAV list price, live menu only (the KSS
// spreadsheet source already carries KSS's own sale prices). A card whose
// title starts with `title` gets pctOff taken off its unit and case price
// through `until`, shown with the list price crossed out; after that date
// it drops off by itself.
const MENU_PROMOS = [
  // Niki, 2026-10-26: all indoor flower 20% off for the rest of the year.
  { brand: 'Mendo', title: 'Indoor Flower', pctOff: 20, until: '2026-12-31' },
];

function applyPromos(menu){
  const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD, local
  for(const b of menu.brands){
    for(const c of b.cards){
      const p = MENU_PROMOS.find(p => p.brand === b.brand && c.title.startsWith(p.title) && today <= p.until);
      if(!p || c.unitPrice == null) continue;
      const k = 1 - p.pctOff / 100;
      c.listUnitPrice = c.unitPrice;
      c.listCasePrice = c.casePrice;
      c.unitPrice = Math.round(c.unitPrice * k * 100) / 100;
      if(c.casePrice != null) c.casePrice = Math.round(c.casePrice * k * 100) / 100;
      c.promo = `${p.pctOff}% OFF THRU ${p.until.slice(5).replace('-', '/')}`;
    }
  }
}

// Brands render in this fixed order regardless of what order menu.json lists them in.
const BRAND_ORDER = ['Soma Rosa Farms', 'Howie Roll', 'Mendo'];

// Two possible menus: LIVE_MENU from data/menu.json, SHEET_MENU built from an
// uploaded KSS menu spreadsheet (kept in this browser's localStorage so it
// survives a reload). The Source switch picks which one MENU points at.
let LIVE_MENU = null;
let SHEET_MENU = loadStoredSheetMenu();
let menuSource = (localStorage.getItem('2cw_menu_source') === 'sheet' && SHEET_MENU) ? 'sheet' : 'live';

function loadStoredSheetMenu(){
  try{ return JSON.parse(localStorage.getItem('2cw_menu_sheet') || 'null'); }catch(e){ return null; }
}

async function loadAll(){
  $('global-loading').style.display = 'flex';
  $('global-error').style.display = 'none';
  $('page-outer').style.display = 'none';
  try{
    if(menuSource === 'live' || !LIVE_MENU){
      try{
        const res = await fetch('/data/menu.json?t=' + Date.now());
        if(!res.ok) throw new Error('HTTP ' + res.status);
        LIVE_MENU = await res.json();
        LIVE_MENU.brands.sort((a, b) => BRAND_ORDER.indexOf(a.brand) - BRAND_ORDER.indexOf(b.brand));
        applyPromos(LIVE_MENU);
      }catch(err){
        if(menuSource === 'live') throw err; // spreadsheet mode can still render without it
      }
    }
    await probeAllAssets();
    applySource();
    $('global-loading').style.display = 'none';
    $('page-outer').style.display = 'block';
  }catch(err){
    $('global-loading').style.display = 'none';
    $('global-error').style.display = 'block';
    $('global-error').textContent = 'Could not load menu data: ' + err.message;
  }
}

function applySource(){
  MENU = menuSource === 'sheet' ? SHEET_MENU : LIVE_MENU;
  $('srcLive').classList.toggle('on', menuSource === 'live');
  $('srcSheet').classList.toggle('on', menuSource === 'sheet');
  $('srcSheet').disabled = !SHEET_MENU;
  $('srcSheet').title = SHEET_MENU ? `${SHEET_MENU.fileName} · uploaded ${SHEET_MENU.updated}` : 'Upload a KSS menu spreadsheet first';
  // The spreadsheet has no batch dates, so the Days Old filters do nothing there.
  document.querySelectorAll('.age-group').forEach(el => {
    el.classList.toggle('muted', menuSource === 'sheet');
    el.title = menuSource === 'sheet' ? 'Not available for spreadsheet menus (no batch dates)' : '';
  });
  if(!MENU) return;
  initControls();
  render();
}

function setSource(src){
  if(src === 'sheet' && !SHEET_MENU) return;
  menuSource = src;
  try{ localStorage.setItem('2cw_menu_source', src); }catch(e){}
  if(src === 'live' && !LIVE_MENU){ loadAll(); return; }
  applySource();
}

let _xlsxPromise = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  return _xlsxPromise ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => { _xlsxPromise = null; reject(new Error('Could not load the spreadsheet reader')); };
    document.head.appendChild(s);
  });
}

async function uploadSheet(file){
  if(!file) return;
  const btn = $('uploadBtn');
  btn.textContent = '⏳ Reading…';
  btn.disabled = true;
  try{
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const tabs = {};
    wb.SheetNames.forEach(name => {
      tabs[name] = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' });
    });
    const uploaded = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD, same as menu.json
    const menu = buildMenuFromSheet(tabs, uploaded);
    menu.fileName = file.name;
    menu.brands.sort((a, b) => BRAND_ORDER.indexOf(a.brand) - BRAND_ORDER.indexOf(b.brand));
    const skipped = menu.unparsed.length;
    delete menu.unparsed;
    SHEET_MENU = menu;
    try{ localStorage.setItem('2cw_menu_sheet', JSON.stringify(menu)); }catch(e){}
    const n = menu.brands.reduce((t, b) => t + b.cards.reduce((u, c) => u + c.groups.reduce((v, g) => v + g.strains.length, 0), 0), 0);
    setSource('sheet');
    if(skipped) alert(`Loaded ${n} products from ${file.name}. ${skipped} line(s) weren't recognized and were left off.`);
  }catch(err){
    alert('Could not read that spreadsheet: ' + err.message);
  }
  btn.textContent = '⬆ Upload sheet';
  btn.disabled = false;
}

function initControls(){
  $('updated-note').textContent = MENU.source === 'sheet'
    ? `Spreadsheet · ${MENU.fileName} · ${MENU.updated}`
    : 'Updated ' + MENU.updated;
  $('promoToggle').checked = showPromo;
  $('promoToggle').onchange = function(){
    showPromo = this.checked;
    localStorage.setItem('2cw_menu_showpromo', showPromo ? '1' : '0');
    render();
  };
  $('minSlider').value = minCases;
  $('minVal').textContent = minCases;
  $('minSlider').oninput = function(){
    minCases = +this.value;
    $('minVal').textContent = this.value;
    localStorage.setItem('2cw_menu_mincases', String(minCases));
    render();
  };

  $('minAgeSlider').value = minAgeDays;
  $('minAgeVal').textContent = minAgeDays;
  $('minAgeSlider').oninput = function(){
    minAgeDays = +this.value;
    if(minAgeDays > maxAgeDays){
      maxAgeDays = minAgeDays;
      $('maxAgeSlider').value = maxAgeDays;
      $('maxAgeVal').textContent = maxAgeDays;
      localStorage.setItem('2cw_menu_maxage', String(maxAgeDays));
    }
    $('minAgeVal').textContent = this.value;
    localStorage.setItem('2cw_menu_minage', String(minAgeDays));
    render();
  };

  $('maxAgeSlider').value = maxAgeDays;
  $('maxAgeVal').textContent = maxAgeDays;
  $('maxAgeSlider').oninput = function(){
    maxAgeDays = +this.value;
    if(maxAgeDays < minAgeDays){
      minAgeDays = maxAgeDays;
      $('minAgeSlider').value = minAgeDays;
      $('minAgeVal').textContent = minAgeDays;
      localStorage.setItem('2cw_menu_minage', String(minAgeDays));
    }
    $('maxAgeVal').textContent = this.value;
    localStorage.setItem('2cw_menu_maxage', String(maxAgeDays));
    render();
  };

  renderLocChips();
}

function renderLocChips(){
  const wrap = $('loc-chips');
  const keys = Object.keys(MENU.locations);
  wrap.innerHTML = keys.map(key => {
    const loc = MENU.locations[key];
    const on = selectedLocations.includes(key);
    return `<div class="loc-chip ${on?'on':''}" onclick="toggleLoc('${key}')"><div class="dot"></div>${esc(loc.label)}</div>`;
  }).join('');
}

function toggleLoc(key){
  const i = selectedLocations.indexOf(key);
  if(i === -1) selectedLocations.push(key); else selectedLocations.splice(i,1);
  localStorage.setItem('2cw_menu_locations', JSON.stringify(selectedLocations));
  renderLocChips();
  render();
}

function totalCases(strain){
  return selectedLocations.reduce((sum, loc) => sum + (strain.cases[loc] || 0), 0);
}

function render(){
  const page = $('menuPage');
  if(!MENU || !selectedLocations.length){
    page.innerHTML = `<div style="padding:60px;text-align:center;color:#999;font-family:'DM Mono',monospace;font-size:12px">Select at least one warehouse above to see the menu.</div>`;
    return;
  }

  const brandZones = MENU.brands.map(brand => renderBrandZone(brand)).join('');

  const logoHtml = ASSET_OK[ASSET_PATHS.logo]
    ? `<img class="wm-menu-logo" src="${ASSET_PATHS.logo}" alt="2CW">`
    : `<div class="wm-hdr-word">2<span>CW</span></div>`;

  const promoHtml = showPromo && ASSET_OK[ASSET_PATHS.promo]
    ? `<img class="wm-promo-banner" src="${ASSET_PATHS.promo}" alt="Promo">`
    : '';

  page.innerHTML = `
    <div class="wm-header">
      ${logoHtml}
      <div class="wm-hdr-mid">
        <div class="wm-hdr-sub">Wholesale Menu</div>
        <div class="wm-hdr-main">${esc(monthYear())}</div>
        <div class="wm-hdr-detail">SOMA ROSA FARMS &nbsp;•&nbsp; HOWIE ROLL &nbsp;•&nbsp; MENDO &nbsp;•&nbsp; CALIFORNIA</div>
      </div>
      <div class="wm-hdr-right">
        <div class="wm-brand-logos">
          <div class="wm-blogo-chip"><img src="/img/menu/soma_rosa_logo.png" alt="Soma Rosa Farms"></div>
          <div class="wm-blogo-chip"><img src="/img/menu/howie_roll_logo.png" alt="Howie Roll"></div>
          <div class="wm-blogo-chip"><img src="/img/menu/mendo_logo.png" alt="Mendo"></div>
        </div>
        NORCAL · ALAMEDA<br>SOCAL · VAN NUYS
      </div>
    </div>
    ${promoHtml}
    ${brandZones}
    <div class="wm-footer">
      <div>
        <div class="wm-footer-tag">2CW Enterprises</div>
        <div class="wm-footer-sub">Confidential — Not For Distribution · Updated ${esc(MENU.updated)}</div>
      </div>
      <div class="wm-key">
        <span class="k-hybrid">HYBRID</span>
        <span class="k-indica">INDICA</span>
        <span class="k-sativa">SATIVA</span>
      </div>
    </div>
  `;
}

function monthYear(){
  return new Date().toLocaleDateString('en-US', {month:'long', year:'numeric'}).toUpperCase();
}

function renderBrandZone(brand){
  const cls = 'wm-' + brand.brandColor;         // wm-howie / wm-soma / wm-mendo
  const barCls = 'wm-brand-' + brand.brandColor; // wm-brand-howie / wm-brand-soma / wm-brand-mendo
  const cards = brand.cards.map(card => renderCard(card, cls, brand.brand)).filter(Boolean).join('');
  if(!cards) return ''; // no inventory available for this brand under current filters — hide the section entirely

  const bannerUrl = ASSET_PATHS.banners[brand.brandColor];
  const hasBanner = bannerUrl && ASSET_OK[bannerUrl];
  // A real banner photo already carries the brand's own logo/wordmark, so it
  // replaces the plain-text title bar entirely rather than being cropped down
  // to fit inside it.
  const barHtml = hasBanner
    ? `<img class="wm-brand-banner-img" src="${bannerUrl}" alt="${esc(brand.brand)}">`
    : `<div class="wm-brand-bar ${barCls}">${esc(brand.brand)}</div>`;

  return `${barHtml}
    <div class="wm-grid ${cls}">${cards}</div>`;
}

function strainMatchesFilters(strain){
  if(totalCases(strain) < minCases) return false;
  if(strain.daysOld != null && (strain.daysOld < minAgeDays || strain.daysOld > maxAgeDays)) return false;
  return true;
}

function renderCard(card, cls, brandName){
  const groupsHtml = card.groups.map(g => {
    const strains = g.strains.filter(strainMatchesFilters);
    if(!strains.length) return '';
    const items = strains.map(s => {
      const locBadges = selectedLocations
        .filter(l => (s.cases[l]||0) > 0)
        .map(l => `<span class="wm-loc-dot ${l}">${l==='norcal'?'NC':'SC'}</span>`).join('');
      return `<li><span class="wm-fname">${esc(s.strain)}</span><span class="wm-fthc">${esc(s.thc)}</span><span class="wm-floc">${locBadges}</span></li>`;
    }).join('');
    const typeClass = 't-' + g.type.toLowerCase();
    return `<div class="wm-fgroup">
      <span class="wm-type-badge ${typeClass}">${esc(g.type.toUpperCase())}</span>
      <ul class="wm-flist">${items}</ul>
    </div>`;
  }).join('');

  if(!groupsHtml.trim()) return '';

  const was = v => v != null ? `<s class="wm-was">$${v.toFixed(2)}</s> ` : '';
  const unitPrice = card.unitPrice != null ? `${was(card.listUnitPrice)}$${card.unitPrice.toFixed(2)}` : '—';
  const casePrice = card.casePrice != null ? `${was(card.listCasePrice)}$${card.casePrice.toFixed(2)}` : '—';
  const imgUrl = CARD_IMAGES[(card.imageTitle || card.title) + '|' + brandName];
  const imgHtml = imgUrl && ASSET_OK[imgUrl] ? `<div class="wm-card-img" style="background-image:url('${imgUrl}')"></div>` : '';

  return `<div class="wm-card ${cls}">
    ${imgHtml}
    <div class="wm-card-accent"></div>
    <div class="wm-card-title">${esc(card.title.toUpperCase())}</div>
    ${card.promo ? `<div class="wm-promo">${esc(card.promo)}</div>` : ''}
    <div class="wm-specs">
      <div class="wm-spec"><span>SIZE</span><b>${esc(card.size)}</b></div>
      <div class="wm-spec"><span>WHOLESALE</span><b>${unitPrice}/unit</b></div>
      <div class="wm-spec"><span>CASE QTY</span><b>${card.caseUnits ?? '—'}</b></div>
    </div>
    <div class="wm-case-price">CASE PRICE <span>${casePrice}</span></div>
    <div class="wm-flavors-hdr">AVAILABLE FLAVORS</div>
    <div class="wm-flavors">${groupsHtml}</div>
  </div>`;
}

// ─── SPREADSHEET SOURCE ─────────────────────────────────────
// Builds the same MENU shape as data/menu.json from a copy-paste of the KSS
// Live storefront ("menu inventory.xlsx"): one tab per warehouse (tab name
// contains "nor"/"so"), one product per line, e.g.
//   NewHowie RollFlower: Eighth - 16ctHybridFlower 3.5g Hybrid Gastro Pop 16ct< 25 Cases27.77% THC*$5.50/unit$88.00/case
// Sale items carry the crossed-out price too: "$18.00/unit$20.00 /unit- $2.00$144.00/case".
// Everything else on the page (headers, "No POS Data", "Cases", footer) is ignored.
const SHEET_LINE_RE = /^(?:New)?(Howie Roll|Soma Rosa|Mendo)(Concentrate|Flower|Pre-Roll|Vape|Edible)[^:]*:\s*(.+?)\s+-\s+(\d+)ct(?:Hybrid|Indica|Sativa|unknown)?(.+?)(<\s*\d+\s*Cases|In Stock)\s*([\d.]+)%\s*THC\*?\s*\$([\d.,]+)\/unit(?:\$[\d.,]+\s*\/unit\s*-\s*\$[\d.,]+)?\s*\$([\d.,]+)\/case$/i;
const SHEET_BRANDS = { 'howie roll': 'Howie Roll', 'soma rosa': 'Soma Rosa Farms', 'mendo': 'Mendo' };

// KSS only shows a stock band, not a count — use the band's floor so the
// Min Cases slider still means "at least this many": < 5 → 1, < 10 → 5, …
function sheetCasesFromBand(band){
  if(/in stock/i.test(band)) return 50;
  const n = +band.match(/\d+/)[0];
  return { 5: 1, 10: 5, 25: 10, 50: 25 }[n] ?? Math.max(1, Math.round(n / 2));
}

function sheetLocKey(tabName){
  const t = tabName.toLowerCase();
  if(t.includes('nor') || t.includes('alameda')) return 'norcal';
  if(t.includes('so') || t.includes('van nuys')) return 'socal';
  return null;
}

// Description is e.g. "Flower 3.5g Hybrid Gastro Pop 16ct", "Preroll 0.5g Indica Sharpie 28pk",
// "Preroll 0.5g Indica Zkittlez 10pk 5.0g", "Farms x Nameless Flower 3.5g Hybrid 8ct".
function parseSheetDescription(desc){
  const m = desc.match(/^(.*?)\s*(\d+(?:\.\d+)?)\s*g\s+(Hybrid|Indica|Sativa)\b\s*(.*)$/i);
  if(!m) return null;
  let [, kind, grams, type, rest] = m;
  const pk = rest.match(/\b(\d+)\s*pk\b/i);
  rest = rest.replace(/\s*\b\d+(?:\.\d+)?\s*(?:ct|pk|g)\b/gi, '').trim();
  return {
    kind: kind.trim(),
    grams: +grams * (pk ? +pk[1] : 1),
    type: type[0].toUpperCase() + type.slice(1).toLowerCase(),
    strain: rest,
  };
}

function sheetSizeLabel(g){
  if(g <= 1) return '1G';
  if(g <= 3.6) return '1/8';
  if(g <= 5) return '5G';
  if(g <= 14) return '14G';
  return '28G';
}

// Same section names kss_transform.py gives the live menu, so card photos match.
function sheetCardTitle(brand, category, format, kind, size){
  const f = format.toLowerCase(), k = kind.toLowerCase();
  if(category === 'Concentrate' && f.includes('all-in-one')) return 'All-In-One Vape';
  if(category === 'Vape') return 'All-In-One Vape';
  if(category === 'Concentrate' && f.includes('rosin')) return 'Live Rosin';
  if(category === 'Concentrate' && f.includes('resin')) return 'Live Resin Sauce';
  if(category === 'Pre-Roll'){
    if(size === '1G') return 'Pre-Rolls — Single 1g';
    if(size === '14G') return 'Pre-Roll Party Packs — 28ct';
    if(size === '5G') return 'Pre-Roll 10-Pack';
    return 'Pre-Roll Multipack';
  }
  if(category === 'Flower'){
    if(brand === 'Howie Roll') return 'Premium Smalls';
    if(brand === 'Mendo') return k.includes('greenhouse') ? 'Greenhouse Flower' : 'Indoor Flower';
    // collab packs: "Soma Rosa" + "Farms x Nameless Flower"
    if(k.includes(' x ')) return `${brand.replace(/ Farms$/, '')} ${kind.replace(/\s*flower$/i, '')}`;
    return 'Flower';
  }
  return `${format} ${category}`.trim();
}

function buildMenuFromSheet(tabs, uploadedLabel){
  // cards[cardKey] = {brand, title, size, unitPrice, casePrice, caseUnits, strains: {type|strain: {...}}}
  const cards = new Map();
  let matched = 0;
  const locsSeen = new Set();
  const unparsed = [];

  for(const [tabName, rows] of Object.entries(tabs)){
    const loc = sheetLocKey(tabName);
    if(!loc) continue;
    for(const row of rows){
      for(const cell of row){
        const line = String(cell ?? '').trim();
        if(!/\/case$/i.test(line)) continue;
        const m = line.match(SHEET_LINE_RE);
        const d = m && parseSheetDescription(m[5]);
        if(!d){ unparsed.push(line); continue; }
        matched++;
        locsSeen.add(loc);
        const brand = SHEET_BRANDS[m[1].toLowerCase()];
        const category = { concentrate: 'Concentrate', flower: 'Flower', 'pre-roll': 'Pre-Roll', vape: 'Vape', edible: 'Edible' }[m[2].toLowerCase()];
        const caseUnits = +m[4];
        const unitPrice = +m[8].replace(/,/g, '');
        const casePrice = +m[9].replace(/,/g, '');
        const size = sheetSizeLabel(d.grams);
        const title = sheetCardTitle(brand, category, m[3], d.kind, size);
        // collab packs like "Soma Rosa Farms x Nameless" have no strain after the type
        const strain = d.strain || title;

        const key = [brand, title, size, caseUnits, unitPrice].join('|');
        if(!cards.has(key)) cards.set(key, { brand, title, size, unitPrice, casePrice, caseUnits, strains: new Map() });
        const card = cards.get(key);
        const sKey = d.type + '|' + strain;
        if(!card.strains.has(sKey)) card.strains.set(sKey, { strain, type: d.type, thc: null, thcCases: -1, cases: { socal: 0, norcal: 0 } });
        const s = card.strains.get(sKey);
        const cases = sheetCasesFromBand(m[6]);
        s.cases[loc] = Math.max(s.cases[loc], cases);
        if(cases > s.thcCases){ s.thc = (+m[7]).toFixed(2) + '%'; s.thcCases = cases; }
      }
    }
  }

  if(!matched) throw new Error('No product lines found. Expected a copy of the KSS Live menu with a NorCal and a SoCal tab.');

  const TYPE_ORDER = { Sativa: 0, Hybrid: 1, Indica: 2 };
  const SIZE_ORDER = { '1G': 0, '1/8': 1, '5G': 2, '14G': 3, '28G': 4 };
  const byBrand = new Map();
  for(const c of cards.values()){
    const byType = {};
    for(const s of c.strains.values()){
      (byType[s.type] ||= []).push({ strain: s.strain, thc: s.thc || '—', daysOld: null, cases: s.cases });
    }
    const groups = Object.keys(byType)
      .sort((a, b) => (TYPE_ORDER[a] ?? 9) - (TYPE_ORDER[b] ?? 9))
      .map(type => ({ type, strains: byType[type].sort((a, b) => a.strain.localeCompare(b.strain)) }));
    if(!byBrand.has(c.brand)) byBrand.set(c.brand, []);
    byBrand.get(c.brand).push({
      title: c.title, size: c.size, unitPrice: c.unitPrice, caseUnits: c.caseUnits,
      casePrice: c.casePrice, groups,
    });
  }

  const brands = [];
  for(const [brand, list] of byBrand){
    // Same disambiguation as the live menu: two "Premium Smalls" cards become
    // "(1/8)" and "(14G)". imageTitle is what CARD_IMAGES is keyed on.
    const bySize = {};
    list.forEach(c => (bySize[c.title] ||= new Set()).add(c.size));
    list.forEach(c => { if(bySize[c.title].size > 1) c.title = `${c.title} (${c.size})`; c.imageTitle = c.title; });
    // Anything still colliding (same format at two prices or pack counts) gets told apart by those.
    const seen = {};
    list.forEach(c => (seen[c.title] ||= []).push(c));
    Object.values(seen).filter(g => g.length > 1).forEach(g => {
      const packsDiffer = new Set(g.map(c => c.caseUnits)).size > 1;
      g.forEach(c => { c.title += packsDiffer ? ` — ${c.caseUnits}ct case` : ` — $${c.unitPrice.toFixed(2)}`; });
    });
    list.sort((a, b) => a.title.localeCompare(b.title) || (SIZE_ORDER[a.size] ?? 9) - (SIZE_ORDER[b.size] ?? 9));
    brands.push({ brand, brandColor: brand === 'Howie Roll' ? 'howie' : brand === 'Soma Rosa Farms' ? 'soma' : 'mendo', cards: list });
  }

  return {
    updated: uploadedLabel,
    source: 'sheet',
    unparsed,
    locations: {
      socal: { label: 'SoCal', sublabel: 'Van Nuys' },
      norcal: { label: 'NorCal', sublabel: 'Alameda' },
    },
    brands,
  };
}

// ─── PDF PUBLISH ────────────────────────────────────────────
// Renders #menuPage to a canvas and embeds that as a single PDF page sized
// to match it exactly — no page breaks, and no browser print engine
// involved (iOS Safari's print-to-PDF ignores custom @page sizing and
// forces Letter/A4, which is what caused the page-break bug). On devices
// that support the Web Share API (iOS, most Android), the PDF goes
// straight to the native share sheet — Messages, Mail, Save to Files,
// AirDrop — in one tap. Elsewhere it downloads as a normal file.
let _pdfLibsPromise = null;
function loadPDFLibs(){
  if(_pdfLibsPromise) return _pdfLibsPromise;
  const loadScript = src => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
  _pdfLibsPromise = Promise.all([
    window.html2canvas ? Promise.resolve() : loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'),
    window.jspdf ? Promise.resolve() : loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js')
  ]);
  return _pdfLibsPromise;
}

async function publishPDF(){
  const btn = $('pdfBtn');
  btn.textContent = '⏳ Preparing…';
  btn.disabled = true;

  try{
    await loadPDFLibs();
    const el = $('menuPage');
    if(document.fonts) await document.fonts.ready;

    const canvas = await html2canvas(el, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff'
    });

    const { jsPDF } = window.jspdf;
    const w = canvas.width / 2;   // back out the scale — page size in CSS px
    const h = canvas.height / 2;
    const doc = new jsPDF({
      orientation: w >= h ? 'landscape' : 'portrait',
      unit: 'px',
      format: [w, h],
      hotfixes: ['px_scaling']
    });
    doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h);

    const filename = '2CW-Wholesale-Menu-' + monthYear().replace(/\s+/g, '-') + '.pdf';
    const blob = doc.output('blob');
    const file = new File([blob], filename, { type: 'application/pdf' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({
        files: [file],
        title: '2CW Wholesale Menu — ' + monthYear()
      });
    }else{
      doc.save(filename);
    }
  }catch(err){
    if(err.name !== 'AbortError'){ // user just cancelled the share sheet
      alert('PDF failed: ' + err.message);
    }
  }

  btn.textContent = '📄 Publish PDF';
  btn.disabled = false;
}

loadAll();
