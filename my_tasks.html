<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>My Tasks — 2CW</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0c0d0f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;--border2:rgba(255,255,255,.11);
    --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;--slate:#7d8899;
    --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.35;pointer-events:none;z-index:0}
  a{color:inherit}
  .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
  .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
  .hdr-div{width:1px;height:18px;background:var(--border)}
  .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);flex:1}

  main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:28px 16px 100px}

  .page-hd{margin-bottom:8px}
  .page-hd h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.03em}
  .page-hd .who{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);margin-top:2px}

  .tabs{display:flex;gap:6px;margin:18px 0 20px;border-bottom:1px solid var(--border)}
  .tab-btn{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:10px 4px;margin-right:18px;cursor:pointer;border-bottom:2px solid transparent}
  .tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  .btn{padding:.6rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text)}
  .btn-blue{background:var(--blue);color:#000;border-color:var(--blue)}
  .btn-blue:hover{opacity:.88}
  .btn-ghost{color:var(--subtext)}
  .btn-ghost:hover{border-color:var(--muted);color:var(--text)}
  .btn-danger{color:var(--red);border-color:rgba(239,83,80,.35)}
  .btn-danger:hover{border-color:var(--red)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sm{padding:.32rem .6rem;font-size:.62rem}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .status-line{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);margin-bottom:16px;min-height:1.2em}
  .status-line b{color:var(--text)}

  select, input[type=text], input[type=date], textarea{
    background:#0c0d0f;border:1px solid var(--border);color:var(--text);
    padding:.55rem .7rem;border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--blue)}

  .group-hd{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
  .group-hd:first-of-type{margin-top:0}
  .group-hd .n{color:var(--subtext)}

  .task-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
  .task-row{border-bottom:1px solid var(--border)}
  .task-row:last-child{border-bottom:none}
  .task-main{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer}
  .task-main:hover{background:var(--surface2)}
  .status-dot{flex:none;width:11px;height:11px;border-radius:50%;margin-top:4px;border:2px solid var(--border)}
  .status-dot.not_started{background:transparent;border-color:var(--muted)}
  .status-dot.in_progress{background:var(--blue);border-color:var(--blue)}
  .status-dot.blocked{background:var(--red);border-color:var(--red)}
  .status-dot.done{background:var(--green);border-color:var(--green)}
  .task-body{flex:1;min-width:0}
  .task-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .task-title{font-size:.92rem;font-weight:500}
  .task-title.done{color:var(--subtext);text-decoration:line-through}
  .task-meta{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--subtext)}
  .tag{display:inline-block;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--subtext)}
  .tag.prio-high{color:var(--red)}
  .tag.prio-medium{color:var(--gold)}
  .tag.prio-low{color:var(--subtext)}
  .due{white-space:nowrap}
  .due.overdue{color:var(--red);font-weight:700}
  .followup{white-space:nowrap;color:var(--purple)}
  .task-actions{flex:none;display:flex;gap:6px;align-items:flex-start;padding-top:2px}
  .task-actions button{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--subtext);padding:.28rem .55rem;border-radius:6px;cursor:pointer}
  .task-actions button:hover{border-color:var(--blue);color:var(--blue)}
  .chev-btn{color:var(--muted);font-size:.7rem;padding-top:6px;transition:transform .15s}
  .chev-btn.open{transform:rotate(90deg)}

  .task-detail{display:none;padding:0 14px 16px 37px;border-top:1px dashed var(--border)}
  .task-detail.open{display:block}
  .task-desc{font-size:.82rem;color:var(--subtext);margin:12px 0 14px;max-width:70ch;line-height:1.5}
  .notes-hd{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .note-row{padding:8px 0;border-top:1px solid var(--border);font-size:.82rem;line-height:1.45}
  .note-row:first-child{border-top:none}
  .note-meta{font-family:'DM Mono',monospace;font-size:.63rem;color:var(--muted);margin-bottom:2px}
  .add-note-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .add-note-row textarea{flex:1;min-width:160px;min-height:44px;resize:vertical}
  .empty-note{color:var(--subtext);font-size:.85rem;padding:10px 0}

  .empty-state{color:var(--subtext);font-size:.85rem;padding:40px 20px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;line-height:1.6}

  /* editor overlay */
  #editor-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:24px;overflow-y:auto}
  #editor{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:560px;margin:0 auto;padding:28px}
  #editor h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em;margin-bottom:18px}
  .field-label{display:block;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.35rem}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .form-row.full{grid-template-columns:1fr}
  .form-row select, .form-row input, .form-row textarea{width:100%}
  textarea{resize:vertical;min-height:64px;font-family:'DM Sans',sans-serif}
  .editor-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
  .editor-actions .right{display:flex;gap:10px}

  /* Job description / responsibilities tab (mirrors my_responsibilities.html) */
  .summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .summary-tile{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
  .summary-tile .n{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--text)}
  .summary-tile .lbl{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);margin-top:2px}
  .summary-tile.primary .n{color:var(--blue)}
  .summary-tile.backup .n{color:var(--gold)}
  .summary-tile.needs_backup .n{color:var(--red)}
  .resp-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:6px}
  .resp-row{border-bottom:1px solid var(--border);padding:14px 16px}
  .resp-row:last-child{border-bottom:none}
  .resp-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .resp-title{font-size:.95rem;font-weight:600}
  .tag.role-primary{color:var(--blue);border-color:rgba(90,159,212,.35)}
  .tag.role-backup{color:var(--gold);border-color:rgba(212,168,67,.35)}
  .tag.status-unassigned{color:var(--red);border-color:rgba(239,83,80,.35)}
  .tag.status-needs_backup{color:var(--gold);border-color:rgba(212,168,67,.35)}
  .tag.status-assigned{color:var(--green);border-color:rgba(61,184,122,.35)}
  .resp-area{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--subtext);margin-bottom:8px}
  .resp-desc{font-size:.82rem;color:var(--subtext);line-height:1.5;max-width:65ch;margin-bottom:8px}
  .resp-pair{font-size:.78rem;color:var(--subtext);margin-bottom:8px}
  .resp-pair b{color:var(--text)}
  .resp-notes-wrap{margin-top:8px}
  .resp-notes-wrap label{display:block;font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
  textarea.notes-field{width:100%;background:#0c0d0f;border:1px solid var(--border);color:var(--text);padding:.5rem .6rem;border-radius:8px;font-size:.8rem;font-family:'DM Sans',sans-serif;resize:vertical;min-height:44px;outline:none}
  textarea.notes-field:focus{border-color:var(--blue)}
  .notes-save-hint{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-top:4px;min-height:1em}
  .resp-link{display:inline-block;margin-top:8px;font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);text-decoration:none}
  .resp-link:hover{text-decoration:underline}

  @media (max-width:720px){
    .form-row{grid-template-columns:1fr}
    .task-meta{gap:6px}
  }
</style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand">My Tasks</div>
</header>

<main>
  <div class="page-hd">
    <h1>My Tasks</h1>
    <div class="who" id="who-line">—</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-tasks" onclick="switchTab('tasks')">Tasks</button>
    <button class="tab-btn" id="tab-btn-resp" onclick="switchTab('resp')">Job Description &amp; Responsibilities</button>
  </div>

  <div class="tab-panel active" id="tab-tasks">
    <div class="toolbar">
      <div class="status-line" id="status-line" style="margin-bottom:0">Loading…</div>
      <button class="btn btn-blue" onclick="openEditor(null)">+ New Task</button>
    </div>
    <div id="import-result"></div>
    <div id="tasks-wrap"></div>
  </div>

  <div class="tab-panel" id="tab-resp">
    <div class="status-line" id="resp-status-line">Loading…</div>
    <div class="summary-row" id="resp-summary-row"></div>
    <div id="resp-content-wrap"></div>
  </div>
</main>

<div id="editor-backdrop">
  <div id="editor"></div>
</div>

<script src="/config/supabase_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/hub_config.js"></script>
<script>
const STATUS_LABELS = { not_started: 'Not started', in_progress: 'In progress', blocked: 'Blocked', done: 'Done' };
const STATUS_CYCLE = ['not_started','in_progress','blocked','done'];
const RESP_STATUS_LABELS = { unassigned: 'Unassigned', assigned: 'Assigned', needs_backup: 'Needs backup' };

let client = null;
if (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL) {
  client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtDateTime(d){ if(!d) return ''; const dt = new Date(d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function isOverdue(due, status){ return due && status !== 'done' && due < todayStr(); }
function matchName(a, b){ return (a||'').trim().toLowerCase() === (b||'').trim().toLowerCase(); }

const currentUser = (sessionStorage.getItem('2cw_user_name') || '').trim();
if(!currentUser){
  window.location.href = '/index.html';
}

function switchTab(which){
  document.getElementById('tab-tasks').classList.toggle('active', which==='tasks');
  document.getElementById('tab-resp').classList.toggle('active', which==='resp');
  document.getElementById('tab-btn-tasks').classList.toggle('active', which==='tasks');
  document.getElementById('tab-btn-resp').classList.toggle('active', which==='resp');
  if(which==='resp' && !respLoaded){ loadResp(); }
}

async function requireClient(){
  if(!client) throw new Error('Supabase is not configured (config/supabase_config.js is blank).');
  return client;
}

// ── Directory (for assignee dropdown) ───────────────────────────────────
let directory = [];
async function loadDirectoryNames(){
  try{ directory = await loadUserDirectory(); }catch(e){ directory = []; }
}

// ══════════════════════════════════════════════════════════════════════
// TASKS TAB
// ══════════════════════════════════════════════════════════════════════
let tasks = [];       // [{...task, notes:[...]}]
let openTaskIds = new Set();
let editingId = null;

async function loadTasks(){
  const status = document.getElementById('status-line');
  document.getElementById('who-line').textContent = currentUser;
  status.textContent = 'Loading…';
  try{
    const c = await requireClient();
    const [{ data: taskRows, error: e1 }, { data: noteRows, error: e2 }] = await Promise.all([
      c.from('personal_tasks').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true }),
      c.from('personal_task_notes').select('*').order('created_at', { ascending: false })
    ]);
    if(e1) throw e1;
    if(e2) throw e2;
    const byTask = {};
    (noteRows||[]).forEach(n => { (byTask[n.task_id] = byTask[n.task_id]||[]).push(n); });
    tasks = (taskRows||[]).map(t => ({ ...t, notes: byTask[t.id] || [] }));
    renderTasks();
  }catch(e){
    status.textContent = 'Could not load: ' + e.message;
    document.getElementById('tasks-wrap').innerHTML = '';
  }
}

function renderTasks(){
  const status = document.getElementById('status-line');
  const mine = tasks.filter(t => matchName(t.assignee, currentUser));
  const byMe = tasks.filter(t => matchName(t.assigned_by, currentUser) && !matchName(t.assignee, currentUser));

  const mineOpen = mine.filter(t => t.status !== 'done').length;
  const overdue = mine.filter(t => isOverdue(t.due_date, t.status)).length;
  status.innerHTML = `<b>${mine.length}</b> assigned to you (${mineOpen} open) &nbsp;·&nbsp; <b>${byMe.length}</b> you've handed out` +
    (overdue ? ` &nbsp;·&nbsp; <b style="color:var(--red)">${overdue} overdue</b>` : '');

  const wrap = document.getElementById('tasks-wrap');
  if(!mine.length && !byMe.length){
    wrap.innerHTML = `<div class="empty-state">Nothing here yet. Use <b>+ New Task</b> to assign yourself or someone else a task.</div>`;
    return;
  }

  let html = '';
  html += `<div class="group-hd">Assigned to you <span class="n">(${mine.length})</span></div>`;
  html += mine.length
    ? `<div class="task-list">${mine.map(t => taskRowHtml(t, false)).join('')}</div>`
    : `<div class="empty-state">Nothing assigned to you right now.</div>`;

  if(byMe.length){
    html += `<div class="group-hd">You've handed out <span class="n">(${byMe.length})</span></div>`;
    html += `<div class="task-list">${byMe.map(t => taskRowHtml(t, true)).join('')}</div>`;
  }
  wrap.innerHTML = html;
}

function taskRowHtml(t, showAssignee){
  const open = openTaskIds.has(t.id);
  const overdue = isOverdue(t.due_date, t.status);
  return `
    <div class="task-row" data-id="${t.id}">
      <div class="task-main" onclick="toggleTask('${t.id}')">
        <span class="chev-btn ${open?'open':''}">▸</span>
        <span class="status-dot ${t.status}" title="${esc(STATUS_LABELS[t.status])}" onclick="event.stopPropagation();cycleStatus('${t.id}')"></span>
        <div class="task-body">
          <div class="task-title-row">
            <span class="task-title ${t.status==='done'?'done':''}">${esc(t.title)}</span>
            ${t.priority ? `<span class="tag prio-${t.priority}">${esc(t.priority)}</span>` : ''}
          </div>
          <div class="task-meta">
            ${showAssignee && t.assignee ? `<span>${esc(t.assignee)}</span>` : ''}
            ${t.due_date ? `<span class="due ${overdue?'overdue':''}">Due ${fmtDate(t.due_date)}</span>` : ''}
            ${t.follow_up_date ? `<span class="followup">Follow up ${fmtDate(t.follow_up_date)}</span>` : ''}
            ${t.notes.length ? `<span>${t.notes.length} note${t.notes.length===1?'':'s'}</span>` : ''}
          </div>
        </div>
        <div class="task-actions" onclick="event.stopPropagation()">
          <button onclick="openEditor('${t.id}')">Edit</button>
          <button onclick="deleteTask('${t.id}')">Delete</button>
        </div>
      </div>
      <div class="task-detail ${open?'open':''}">
        ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
        <div class="notes-hd">Notes</div>
        ${t.notes.map(noteRowHtml).join('') || '<div class="empty-note">No notes yet.</div>'}
        <div class="add-note-row">
          <textarea placeholder="Add a note…" id="new-note-${t.id}"></textarea>
          <button class="btn btn-sm btn-ghost" onclick="addNote('${t.id}')">+ Add note</button>
        </div>
      </div>
    </div>`;
}

function noteRowHtml(n){
  return `
    <div class="note-row">
      <div class="note-meta">${n.author ? esc(n.author) + ' · ' : ''}${fmtDateTime(n.created_at)}</div>
      <div>${esc(n.note)}</div>
    </div>`;
}

function toggleTask(id){
  if(openTaskIds.has(id)) openTaskIds.delete(id); else openTaskIds.add(id);
  renderTasks();
}

async function cycleStatus(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(t.status)+1) % STATUS_CYCLE.length];
  t.status = next;
  renderTasks();
  try{
    const c = await requireClient();
    const { error } = await c.from('personal_tasks').update({ status: next }).eq('id', id);
    if(error) throw error;
  }catch(e){ alert('Could not update status: ' + e.message); loadTasks(); }
}

async function addNote(taskId){
  const input = document.getElementById('new-note-'+taskId);
  const note = input.value.trim();
  if(!note) return;
  try{
    const c = await requireClient();
    const { data, error } = await c.from('personal_task_notes').insert({ task_id: taskId, author: currentUser, note }).select().single();
    if(error) throw error;
    const t = tasks.find(x=>x.id===taskId);
    t.notes.unshift(data);
    openTaskIds.add(taskId);
    renderTasks();
  }catch(e){ alert('Could not add note: ' + e.message); }
}

async function deleteTask(id){
  if(!confirm('Delete this task and its notes?')) return;
  try{
    const c = await requireClient();
    const { error } = await c.from('personal_tasks').delete().eq('id', id);
    if(error) throw error;
    tasks = tasks.filter(t=>t.id!==id);
    renderTasks();
  }catch(e){ alert('Could not delete task: ' + e.message); }
}

// ── Editor ────────────────────────────────────────────────────────────────
function assigneeOptionsHtml(selected){
  const names = [...new Set(directory.map(u => (u.user||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(currentUser && !names.includes(currentUser)) names.unshift(currentUser);
  if(selected && !names.includes(selected)) names.push(selected);
  return names.map(n => `<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}${n===currentUser?' (you)':''}</option>`).join('');
}

function openEditor(id){
  editingId = id;
  const t = id ? tasks.find(x=>x.id===id) : null;
  document.getElementById('editor').innerHTML = `
    <h2>${t ? 'Edit Task' : 'New Task'}</h2>
    <div class="form-row full"><div><label class="field-label">Title</label><input type="text" id="ed-title" value="${esc(t?t.title:'')}"/></div></div>
    <div class="form-row full"><div><label class="field-label">Description</label><textarea id="ed-desc">${esc(t?t.description:'')}</textarea></div></div>
    <div class="form-row">
      <div><label class="field-label">Assign to</label>
        <select id="ed-assignee">${assigneeOptionsHtml(t ? t.assignee : currentUser)}</select>
      </div>
      <div><label class="field-label">Priority</label>
        <select id="ed-priority">
          <option value="">None</option>
          <option value="high" ${t&&t.priority==='high'?'selected':''}>High</option>
          <option value="medium" ${t&&t.priority==='medium'?'selected':''}>Medium</option>
          <option value="low" ${t&&t.priority==='low'?'selected':''}>Low</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div><label class="field-label">Status</label>
        <select id="ed-status">
          ${STATUS_CYCLE.map(s=>`<option value="${s}" ${t&&t.status===s?'selected':(!t&&s==='not_started'?'selected':'')}>${STATUS_LABELS[s]}</option>`).join('')}
        </select>
      </div>
      <div></div>
    </div>
    <div class="form-row">
      <div><label class="field-label">Due date</label><input type="date" id="ed-due" value="${t&&t.due_date?t.due_date:''}"/></div>
      <div><label class="field-label">Follow-up date</label><input type="date" id="ed-followup" value="${t&&t.follow_up_date?t.follow_up_date:''}"/></div>
    </div>
    <div class="editor-actions">
      <div>${t ? '<button class="btn btn-danger" onclick="deleteTask(\''+t.id+'\'); closeEditor();">Delete</button>' : ''}</div>
      <div class="right">
        <button class="btn btn-ghost" onclick="closeEditor()">Cancel</button>
        <button class="btn btn-blue" onclick="saveEditor()">Save</button>
      </div>
    </div>
  `;
  document.getElementById('editor-backdrop').style.display = 'block';
  document.getElementById('editor-backdrop').scrollTop = 0;
  setTimeout(()=>document.getElementById('ed-title').focus(), 50);
}

function closeEditor(){
  document.getElementById('editor-backdrop').style.display = 'none';
  editingId = null;
}

async function saveEditor(){
  const title = document.getElementById('ed-title').value.trim();
  if(!title){ alert('Enter a title.'); return; }
  const assignee = document.getElementById('ed-assignee').value.trim();
  if(!assignee){ alert('Pick who this is assigned to.'); return; }
  const payload = {
    title,
    description: document.getElementById('ed-desc').value.trim() || null,
    assignee,
    priority: document.getElementById('ed-priority').value || null,
    status: document.getElementById('ed-status').value,
    due_date: document.getElementById('ed-due').value || null,
    follow_up_date: document.getElementById('ed-followup').value || null
  };
  const btn = document.querySelector('#editor .btn-blue');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const c = await requireClient();
    if(editingId){
      const { error } = await c.from('personal_tasks').update(payload).eq('id', editingId);
      if(error) throw error;
    }else{
      payload.assigned_by = currentUser;
      const { error } = await c.from('personal_tasks').insert(payload);
      if(error) throw error;
    }
    closeEditor();
    await loadTasks();
  }catch(e){
    alert('Could not save task: ' + e.message);
    btn.disabled = false; btn.textContent = 'Save';
  }
}

// ══════════════════════════════════════════════════════════════════════
// JOB DESCRIPTION & RESPONSIBILITIES TAB (same data/logic as my_responsibilities.html)
// ══════════════════════════════════════════════════════════════════════
let respItems = [];
let respLoaded = false;

async function loadResp(){
  const status = document.getElementById('resp-status-line');
  status.textContent = 'Loading…';
  try{
    const c = await requireClient();
    const { data, error } = await c.from('responsibilities').select('*')
      .order('sort_order', { ascending: true }).order('created_at', { ascending: true });
    if(error) throw error;
    respItems = data || [];
    respLoaded = true;
    renderResp();
  }catch(e){
    status.textContent = 'Could not load: ' + e.message;
  }
}

function renderResp(){
  const status = document.getElementById('resp-status-line');
  const primary = respItems.filter(i => matchName(i.owner, currentUser));
  const backup = respItems.filter(i => matchName(i.backup_owner, currentUser) && !matchName(i.owner, currentUser));

  status.innerHTML = `<b>${primary.length}</b> you own &nbsp;·&nbsp; <b>${backup.length}</b> you back up`;

  const needsBackupCount = primary.filter(i => i.status === 'needs_backup').length;
  document.getElementById('resp-summary-row').innerHTML = `
    <div class="summary-tile primary"><div class="n">${primary.length}</div><div class="lbl">You own</div></div>
    <div class="summary-tile backup"><div class="n">${backup.length}</div><div class="lbl">You back up</div></div>
    <div class="summary-tile needs_backup"><div class="n">${needsBackupCount}</div><div class="lbl">Yours, no backup yet</div></div>
  `;

  const wrap = document.getElementById('resp-content-wrap');
  if(!primary.length && !backup.length){
    wrap.innerHTML = `<div class="empty-state">Nothing assigned to <b>${esc(currentUser)}</b> yet — check the <a href="/admin.html#responsibilities">Responsibilities Matrix</a> (admin panel) or ask whoever's delegating to assign you something.</div>`;
    return;
  }

  let html = '';
  if(primary.length){
    html += '<div class="group-hd">You own</div>';
    html += `<div class="resp-list">${primary.map(i => respRowHtml(i, 'primary')).join('')}</div>`;
  }
  if(backup.length){
    html += '<div class="group-hd">You back up</div>';
    html += `<div class="resp-list">${backup.map(i => respRowHtml(i, 'backup')).join('')}</div>`;
  }
  wrap.innerHTML = html;
}

function respRowHtml(i, role){
  return `
    <div class="resp-row" data-id="${i.id}">
      <div class="resp-title-row">
        <span class="resp-title">${esc(i.title)}</span>
        <span class="tag role-${role}">${role === 'primary' ? 'Primary' : 'Backup'}</span>
        <span class="tag status-${i.status}">${esc(RESP_STATUS_LABELS[i.status] || i.status)}</span>
      </div>
      <div class="resp-area">${i.department ? esc(i.department) + ' · ' : ''}${esc(i.area || '')}</div>
      ${i.description ? `<div class="resp-desc">${esc(i.description)}</div>` : ''}
      <div class="resp-pair"><b>Owner:</b> ${i.owner ? esc(i.owner) : '—'} &nbsp;·&nbsp; <b>Backup:</b> ${i.backup_owner ? esc(i.backup_owner) : '—'}</div>
      <div class="resp-notes-wrap">
        <label>Notes</label>
        <textarea class="notes-field" data-id="${i.id}" onblur="saveRespNotes('${i.id}', this)" placeholder="Add a note for whoever covers this next…">${esc(i.notes)}</textarea>
        <div class="notes-save-hint" id="resp-notes-hint-${i.id}"></div>
      </div>
      <a class="resp-link" href="/admin.html#responsibilities">Edit in matrix →</a>
    </div>`;
}

async function saveRespNotes(id, el){
  const item = respItems.find(i => i.id === id);
  const newVal = el.value.trim() || null;
  if(item && item.notes === newVal) return;
  const hint = document.getElementById('resp-notes-hint-'+id);
  hint.textContent = 'Saving…';
  try{
    const c = await requireClient();
    const { error } = await c.from('responsibilities').update({ notes: newVal }).eq('id', id);
    if(error) throw error;
    if(item) item.notes = newVal;
    hint.textContent = 'Saved';
    setTimeout(() => { if(hint.textContent === 'Saved') hint.textContent = ''; }, 1500);
  }catch(e){
    hint.textContent = 'Could not save: ' + e.message;
  }
}

loadDirectoryNames().then(loadTasks);
</script>
