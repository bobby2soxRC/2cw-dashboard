<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Canix Inventory — 2CW</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);flex:1}
    .hdr-refresh{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:8px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer}

    main{padding:28px 16px 60px;max-width:1200px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;line-height:1}
    .sub{margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}
    .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
    .kpi .k{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .kpi .v{font-family:'DM Mono',monospace;font-size:1.5rem;line-height:1.1;color:var(--text)}
    .kpi .n{font-size:.75rem;color:var(--subtext);margin-top:6px}
    .kpi.green .v{color:var(--green)}.kpi.gold .v{color:var(--gold)}.kpi.blue .v{color:var(--blue)}.kpi.purple .v{color:var(--purple)}

    .tabs{display:flex;gap:6px;overflow-x:auto;margin:22px 0 20px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .tabs button{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:10px;padding:.6rem 1.1rem;
      font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;min-height:44px}
    .tabs button.on{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
    .tabs button .ct{color:var(--muted);margin-left:6px}
    .tabs button.on .ct{color:#0006}

    .search{margin-bottom:18px}
    .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.7rem .9rem;font-size:15px;font-family:inherit;min-height:46px}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px;overflow:hidden}
    .card h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.03em;font-weight:400;margin-bottom:2px}
    .card .note{font-size:.8rem;color:var(--muted);line-height:1.5;margin-bottom:16px}
    .card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
    .card-hd .rollup{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--subtext);white-space:nowrap}
    .card-hd .rollup b{color:var(--text)}

    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
    table{width:100%;border-collapse:collapse;min-width:640px}
    th{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 10px 0;white-space:nowrap;font-weight:500}
    td{padding:10px 12px 10px 0;border-top:1px solid var(--border);font-size:.85rem;white-space:nowrap}
    td.num,th.num{text-align:right;font-family:'DM Mono',monospace}
    td.wide{white-space:normal;min-width:220px}

    .pill{display:inline-block;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border);color:var(--subtext)}
    .pill.green{border-color:var(--green);color:var(--green)}
    .pill.gold{border-color:var(--gold);color:var(--gold)}
    .pill.blue{border-color:var(--blue);color:var(--blue)}
    .pill.purple{border-color:var(--purple);color:var(--purple)}

    .farm-group{margin-bottom:22px}
    .farm-group:last-child{margin-bottom:0}
    .farm-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:10px}
    .farm-hd .name{font-family:'DM Mono',monospace;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
    .farm-hd .rollup{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--subtext)}
    .facility-label{font-size:.72rem;color:var(--muted);margin:10px 0 6px}

    .subtabs{display:flex;gap:6px;margin:-6px 0 18px;flex-wrap:wrap}
    .subtabs button{background:transparent;border:1px solid var(--border);color:var(--subtext);border-radius:99px;padding:.45rem .95rem;
      font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:38px}
    .subtabs button.on{border-color:var(--gold);color:var(--gold)}
    .subtabs button .ct{color:var(--muted);margin-left:6px}

    .bar{position:relative;height:8px;min-width:120px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;overflow:hidden}
    .bar > span{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:99px}
    .bar.gold > span{background:var(--gold)}
    .bar.red > span{background:var(--red)}
    tr.total td{font-weight:700;border-top:2px solid var(--border)}
    .muted{color:var(--muted)}
    table.cid-table{min-width:0}
    table.cid-table td:first-child{white-space:normal}
    tr.exp-row{cursor:pointer}
    tr.exp-row td:first-child{font-weight:700}
    .caret{display:inline-block;width:1.1em;color:var(--gold);transition:transform .15s}
    tr.exp-row.open .caret{transform:rotate(90deg)}
    .caret.none{visibility:hidden}
    tr.exp-child td{background:var(--surface2);font-size:.8rem;color:var(--subtext)}
    tr.exp-child td:first-child{padding-left:1.6em}

    .empty{color:var(--muted);font-size:.9rem;padding:32px 0;text-align:center}
    .footer{margin-top:36px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}
    .loading{color:var(--muted);font-family:'DM Mono',monospace;font-size:.8rem;padding:40px 0;text-align:center}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand">Canix Inventory</div>
  <button class="hdr-refresh" id="refreshBtn">Refresh</button>
</header>

<main>
  <div class="title" id="pageTitle">Canix Inventory</div>
  <div class="sub" id="sub">Loading…</div>

  <div class="tabs" id="pageTabs" style="margin-top:22px">
    <button data-page="inventory" class="on">Inventory</button>
    <button data-page="forecast">Forecasted Flower</button>
  </div>

  <div id="inventoryPage">
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div class="search"><input type="text" id="search" placeholder="Search item, strain, or license…"></div>
    <div id="view"><div class="loading">Loading inventory…</div></div>
  </div>

  <div id="forecastPage" style="display:none">
    <div class="kpis" id="forecastKpis"></div>
    <div id="forecastView"><div class="loading">Loading forecast…</div></div>
  </div>

  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script>
const BASE = 'https://raw.githubusercontent.com/bobby2soxRC/2cw-dashboard/main/data/';
// Facility nicknames/stage/farm-group live in Supabase (canix_facilities
// table), edited from admin.html's "Canix Facilities" tab — reading from
// there means a nickname edit shows up on refresh immediately, no git push
// needed. Falls back to the static JSON (last-synced snapshot, committed by
// scripts/canix_sync.py) if Supabase isn't reachable.
const CONFIG_FALLBACK_URL = 'https://raw.githubusercontent.com/bobby2soxRC/2cw-dashboard/main/config/canix_facility_config.json?t=' + Date.now();
const INVENTORY_URL = BASE + 'canix_inventory.json?t=' + Date.now();
const META_URL = BASE + 'canix_meta.json?t=' + Date.now();

const PLANT_BATCHES_URL = BASE + 'canix_plant_batches.json?t=' + Date.now();

function supabaseReady() {
  return typeof SUPABASE_URL === 'string' && SUPABASE_URL.startsWith('http') &&
    typeof SUPABASE_ANON_KEY === 'string' && SUPABASE_ANON_KEY.length > 10;
}

let _supaClient = null;
function getSupabaseClient() {
  if (!supabaseReady() || typeof supabase === 'undefined') return null;
  if (!_supaClient) _supaClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return _supaClient;
}

async function loadFacilityConfig() {
  const client = getSupabaseClient();
  if (client) {
    try {
      const { data, error } = await client.from('canix_facilities').select('*');
      if (error) throw error;
      if (data && data.length) {
        const cfg = {};
        data.forEach(row => { cfg[String(row.facility_id)] = row; });
        return cfg;
      }
    } catch (e) {
      console.warn('Supabase facility config load failed, falling back to static JSON:', e);
    }
  }
  const raw = await fetch(CONFIG_FALLBACK_URL).then(r => r.json());
  return Object.fromEntries(Object.entries(raw).filter(([k]) => !k.startsWith('_')));
}

// Yield estimates/harvest plans are admin-managed but anon-readable (see
// supabase/schema.sql) — no static-JSON fallback since there's nothing to
// fall back to (they only ever live in Supabase, no sync script produces
// them). An empty array just means "nothing entered yet in admin.html."
async function loadForecastInputs() {
  const client = getSupabaseClient();
  if (!client) return { estimates: [], plans: [] };
  try {
    const [{ data: estimates, error: e1 }, { data: plans, error: e2 }] = await Promise.all([
      client.from('canix_yield_estimates').select('*'),
      client.from('canix_harvest_plans').select('*'),
    ]);
    if (e1) throw e1;
    if (e2) throw e2;
    return { estimates: estimates || [], plans: plans || [] };
  } catch (e) {
    console.warn('Could not load yield forecast inputs:', e);
    return { estimates: [], plans: [] };
  }
}

// Harvest Intake — Wet forms (station intake_wet in operations_forms) record
// each farm package UID and the Drying Location it went to. Canix packages
// usually have no location set, so the Currently Drying view falls back to
// these to place a package in a room. Drafts count too: a truck still being
// unloaded is already on the racks.
async function loadIntakeRooms() {
  const client = getSupabaseClient();
  if (!client) return [];
  try {
    const { data, error } = await client.from('operations_forms')
      .select('fields, work_date, updated_at')
      .eq('station_key', 'intake_wet')
      .order('work_date', { ascending: false }).order('updated_at', { ascending: false });
    if (error) throw error;
    const out = [];
    (data || []).forEach(r => {
      const f = r.fields || {};
      if (!f.dryRoom) return;
      const uids = new Set([f.sourceUid, ...(f.lines || []).map(l => l && l.sourceUid)]
        .map(normUid).filter(Boolean));
      const cid = String(f.cid || '').trim();
      uids.forEach(uid => out.push({ uid, dryRoom: String(f.dryRoom), cid }));
    });
    return out;
  } catch (e) {
    console.warn('Could not load harvest intakes for drying rooms:', e);
    return [];
  }
}

// CID code → "Name: CID 012" label, from the admin panel's ref_codes table
// (what the intake form's CID dropdown reads). Codes not in the table —
// typed in via the form's "Other" — just show as entered.
async function loadCidLabels() {
  const client = getSupabaseClient();
  if (!client) return {};
  try {
    const { data, error } = await client.from('ref_codes').select('code, name').eq('kind', 'cid');
    if (error) throw error;
    return Object.fromEntries((data || []).map(r => [r.code, r.name ? `${r.name}: CID ${r.code}` : `CID ${r.code}`]));
  } catch (e) {
    console.warn('Could not load CID names:', e);
    return {};
  }
}

// UIDs are typed by hand off the tag, and a letter O for a zero ("OO433")
// is an easy slip — compare them with O read as 0 (and anything that isn't
// a letter or digit dropped). Applied to both sides, so it can't break a
// tag that genuinely has an O in it.
function normUid(u) {
  return String(u || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/O/g, '0');
}

const $ = id => document.getElementById(id);
const STAGE_ORDER = ['Cultivation', 'Processing', 'Manufacturing', 'Distribution', 'Unclassified'];
const STAGE_COLOR = { Cultivation: 'green', Processing: 'gold', Manufacturing: 'purple', Distribution: 'blue', Unclassified: '' };

let ALL_PACKAGES = [];
let PLANT_BATCHES = [];
let YIELD_ESTIMATES = [];
let HARVEST_PLANS = [];
let FACILITY_CONFIG = {};
let CURRENT_STAGE = 'All';
let CURRENT_PAGE = 'inventory'; // 'inventory' | 'forecast'
let INTAKE_ROOMS = []; // [{ uid, dryRoom, cid }] from Harvest Intake — Wet forms, newest first
let CID_LABELS = {};   // CID code → display label (ref_codes)
// Rows expanded in the drying view's tables, kept across re-renders.
const OPEN_ROWS = { cid: new Set(), room: new Set() };
let PROCESSING_VIEW = 'packages'; // 'packages' | 'drying' — sub-page within the Processing tab

// Drying room capacity, from "Rooms capacity.xlsx" (Rooms Capacity Adobe,
// hoops-based estimate at 3-4 lb/plant). 1 truck ≈ 42 macro-bins ≈ 2,100 lb;
// 1 macro-bin ≈ 50 lb. Edit here if rooms are added or re-measured.
const DRYING_ROOMS = [
  { room: '1A', trellis: 10, trucks: 6.6,   lbs: 13860, bins: 277.2 },
  { room: '1B', trellis: 17, trucks: 11.33, lbs: 23793, bins: 475.86 },
  { room: '1C', trellis: 21, trucks: 14,    lbs: 29400, bins: 588 },
  { room: '2',  trellis: 92, trucks: 13.4,  lbs: 28140, bins: 562.8 },
  { room: '3A', trellis: 56, trucks: 8,     lbs: 16800, bins: 336 },
  { room: '3B', trellis: 56, trucks: 8,     lbs: 16800, bins: 336 },
  { room: '3C', trellis: 56, trucks: 8,     lbs: 16800, bins: 336 },
  { room: '3D', trellis: 56, trucks: 8,     lbs: 16800, bins: 336 },
  { room: '4A', trellis: 62, trucks: 8.8,   lbs: 18480, bins: 369.6 },
  { room: '4B', trellis: 94, trucks: 13.4,  lbs: 28140, bins: 562.8 },
];
const LBS_PER_BIN = 50;
const LBS_PER_TRUCK = 2100;

function fmtWeight(pkg) {
  if (pkg.weight == null) return '—';
  const n = Number(pkg.weight);
  return (Number.isInteger(n) ? n : n.toFixed(2)) + ' ' + (pkg.weight_unit || '');
}

function statusPill(status) {
  const cls = status === 'Available To Sell' ? 'green'
    : status === 'In Progress' ? 'gold'
    : status === 'In Transit' ? 'blue'
    : status === 'In Quarantine' ? 'purple' : '';
  return `<span class="pill ${cls}">${status || '—'}</span>`;
}

function facilityInfo(fid) {
  const fc = FACILITY_CONFIG[String(fid)];
  if (!fc) return { displayName: 'Unknown facility (' + fid + ')', stage: 'Unclassified', farmGroup: null, license: null, exclude: false, archived: false };
  return {
    displayName: fc.display_name || fc.canix_name || fc.license_number || String(fid),
    stage: fc.stage || 'Unclassified',
    farmGroup: fc.farm_group || null,
    license: fc.license_number || null,
    // Archived (Canix no longer reports this license, set by
    // scripts/canix_sync.py) is treated the same as a manual exclude for
    // the live view — its historical packages/batches/transfers stay in
    // the data/canix_*_history.json files either way, nothing is deleted.
    exclude: !!fc.exclude || fc.status === 'archived',
    archived: fc.status === 'archived',
  };
}

function visiblePackages() {
  return ALL_PACKAGES.filter(p => !facilityInfo(p.facility_id).exclude);
}

function renderKpis() {
  const pkgs = visiblePackages();
  const facilityIds = new Set(pkgs.map(p => p.facility_id));
  const byStage = {};
  pkgs.forEach(p => {
    const stage = facilityInfo(p.facility_id).stage;
    byStage[stage] = (byStage[stage] || 0) + 1;
  });
  const stageLine = STAGE_ORDER.filter(s => byStage[s]).map(s => `${s}: ${byStage[s]}`).join(' · ');

  $('kpis').innerHTML = `
    <div class="kpi green"><div class="k">On-Hand Packages</div><div class="v">${pkgs.length}</div><div class="n">${stageLine}</div></div>
    <div class="kpi blue"><div class="k">Facilities Tracked</div><div class="v">${facilityIds.size}</div><div class="n">across ${STAGE_ORDER.filter(s => byStage[s]).length} stage(s)</div></div>
  `;
}

function renderTabs() {
  const pkgs = visiblePackages();
  const counts = { All: pkgs.length };
  STAGE_ORDER.forEach(s => { counts[s] = pkgs.filter(p => facilityInfo(p.facility_id).stage === s).length; });

  const stages = ['All', ...STAGE_ORDER];
  $('tabs').innerHTML = stages.map(s =>
    `<button data-stage="${s}" class="${s === CURRENT_STAGE ? 'on' : ''}">${s}<span class="ct">${counts[s] ?? 0}</span></button>`
  ).join('');
  $('tabs').querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => { CURRENT_STAGE = btn.dataset.stage; renderTabs(); renderView(); });
  });
}

function packageRow(p) {
  const item = p.item || {};
  const fi = facilityInfo(p.facility_id);
  return `<tr>
    <td class="wide">${item.name || '—'}</td>
    <td>${item.strain?.name || '—'}</td>
    <td class="num">${fmtWeight(p)}</td>
    <td>${statusPill(p.status)}</td>
    <td>${fi.displayName}${fi.license ? ` <span style="color:var(--muted)">(${fi.license})</span>` : ''}</td>
    <td class="num">${(p.packaged_date || '').slice(0, 10) || '—'}</td>
  </tr>`;
}

function tableHtml(pkgs) {
  if (!pkgs.length) return '<div class="empty">Nothing here.</div>';
  return `<div class="scroll"><table>
    <thead><tr><th>Item</th><th>Strain</th><th class="num">Weight</th><th>Status</th><th>Facility (License)</th><th class="num">Packaged</th></tr></thead>
    <tbody>${pkgs.map(packageRow).join('')}</tbody>
  </table></div>`;
}

function applySearch(pkgs) {
  const q = $('search').value.trim().toLowerCase();
  if (!q) return pkgs;
  return pkgs.filter(p => {
    const item = p.item || {};
    const fi = facilityInfo(p.facility_id);
    return [item.name, item.strain?.name, fi.displayName, fi.license]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(q));
  });
}

// ── Currently Drying (sub-page of Processing) ────────────────────────────
// Anything drying comes through Canix as a package whose item category is
// "Fresh Cannabis Plant" (whatever the item is named — "Wet Flower - …",
// "Mixed harvested plants", …) — taken from every non-excluded facility, not just
// Processing-stage ones, since the wet packages are created at the farm
// licenses. Rooms are matched from the package's Canix location (or its
// parent location) by name, e.g. "Room 1A" / "Dry Room 1A" / "1A" → 1A.
// When Canix has no usable location, the package's tag is looked up in the
// Harvest Intake — Wet forms and their Drying Location is used instead.

function isDrying(p) {
  return /^fresh cannabis plant$/i.test((p.item?.type?.name || '').trim());
}

function dryingPackages() {
  return visiblePackages().filter(isDrying);
}

function toLbs(pkg) {
  const n = Number(pkg.weight) || 0;
  const unit = (pkg.weight_unit || '').toLowerCase();
  if (unit.startsWith('gram')) return n / 453.592;
  if (unit.startsWith('kilogram')) return n * 2.20462;
  if (unit.startsWith('ounce')) return n / 16;
  return n; // Pounds
}

function roomKey(name) {
  return String(name || '').toUpperCase().replace(/DRYING|DRY|ROOM|[^A-Z0-9]/g, '');
}

const ROOM_BY_KEY = Object.fromEntries(DRYING_ROOMS.map(r => [roomKey(r.room), r.room]));

// A room name/code to a capacity-table room. Sub-rooms the forms know about
// but the capacity sheet doesn't split out (2A–2D) roll up to their room (2).
function matchRoom(name) {
  const k = roomKey(name);
  if (!k) return null;
  return ROOM_BY_KEY[k] || ROOM_BY_KEY[k.replace(/[A-Z]$/, '')] || null;
}

// An intake's Drying Location(s) — "1A", "Room 2B", "1A, 1B" — as rooms.
function intakeRooms(dryRoom) {
  return [...new Set(String(dryRoom).split(/[,&/+]|\band\b|\by\b/i).map(matchRoom).filter(Boolean))];
}

// The intake for a Canix tag: an exact UID match, or else the newest intake
// whose UID is the tag's last 4+ characters (the form accepts "the last 5")
// as long as that suffix points at only one drying package.
function intakeForTag(tag) {
  tag = normUid(tag);
  if (!tag) return null;
  const exact = INTAKE_ROOMS.find(i => i.uid === tag);
  if (exact) return exact;
  return INTAKE_ROOMS.find(i => i.uid.length >= 4 && i.uid.length < tag.length && tag.endsWith(i.uid) &&
    dryingPackages().filter(p => normUid(p.tag).endsWith(i.uid)).length === 1) || null;
}

// Returns the drying room(s) (["1A"], or several if the intake lists more
// than one), the raw location label, and where the room came from.
function packageRoom(p) {
  const loc = p.location || null;
  const label = loc ? (loc.parent_location?.name ? `${loc.parent_location.name} › ${loc.name}` : loc.name) : null;
  const room = loc ? (matchRoom(loc.name) || matchRoom(loc.parent_location?.name)) : null;
  if (room) return { rooms: [room], label, source: 'canix' };
  const intake = intakeForTag(p.tag);
  const rooms = intake ? intakeRooms(intake.dryRoom) : [];
  if (rooms.length) return { rooms, label, source: 'intake' };
  return { rooms: [], label: label || (intake ? `Intake: ${intake.dryRoom}` : null), source: null };
}

// The customer a drying package belongs to — the CID on its Harvest Intake
// form (Canix doesn't carry one). '' when there's no intake or no CID on it.
function packageCid(p) {
  return intakeForTag(p.tag)?.cid || '';
}

function cidLabel(cid) {
  return cid ? (CID_LABELS[cid] || CID_LABELS[cid.replace(/^CID\s*/i, '')] || (/^\d+$/.test(cid) ? `CID ${cid}` : cid)) : 'No CID';
}

function daysSince(iso) {
  if (!iso) return null;
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return d >= 0 ? d : null;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}
const escapeAttr = escapeHtml;

function fmtNum(n, digits = 0) {
  return Number(n).toLocaleString(undefined, { maximumFractionDigits: digits });
}

function processingSubtabs() {
  const views = [['packages', 'Packages', visiblePackages().filter(p => facilityInfo(p.facility_id).stage === 'Processing').length],
                 ['drying', 'Currently Drying', dryingPackages().length]];
  return `<div class="subtabs" id="subtabs">${views.map(([v, label, ct]) =>
    `<button data-view="${v}" class="${v === PROCESSING_VIEW ? 'on' : ''}">${label}<span class="ct">${ct}</span></button>`
  ).join('')}</div>`;
}

function attachSubtabListeners() {
  $('subtabs')?.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => { PROCESSING_VIEW = btn.dataset.view; renderView(); });
  });
}

function renderDrying() {
  const all = dryingPackages();
  const pkgs = applySearch(all);

  // Capacity is a property of the rooms, so it's always computed from every
  // drying package — the search box only filters the package list below.
  const usedByRoom = {};
  const strainsByRoom = {}; // room ('' = not matched) → strain → lbs
  const addStrain = (room, p, lbs) => {
    const strain = p.item?.strain?.name || 'Unknown strain';
    const m = strainsByRoom[room] = strainsByRoom[room] || {};
    m[strain] = (m[strain] || 0) + lbs;
  };
  let unassignedLbs = 0;
  const unassignedLocs = new Set();
  all.forEach(p => {
    const { rooms, label } = packageRoom(p);
    // An intake split across rooms is counted evenly across them.
    if (rooms.length) rooms.forEach(room => {
      usedByRoom[room] = (usedByRoom[room] || 0) + toLbs(p) / rooms.length;
      addStrain(room, p, toLbs(p) / rooms.length);
    });
    else { unassignedLbs += toLbs(p); addStrain('', p, toLbs(p)); unassignedLocs.add(label || 'No Canix location or intake form'); }
  });

  const totalCap = DRYING_ROOMS.reduce((s, r) => s + r.lbs, 0);
  const totalUsed = all.reduce((s, p) => s + toLbs(p), 0);
  const roomsInUse = Object.keys(usedByRoom).length;
  const pct = totalCap ? totalUsed / totalCap * 100 : 0;
  const free = Math.max(totalCap - totalUsed, 0);

  const barCls = pct => pct >= 100 ? 'red' : pct >= 85 ? 'gold' : '';
  const bar = pct => `<div class="bar ${barCls(pct)}"><span style="width:${Math.min(pct, 100).toFixed(1)}%"></span></div>`;

  const kpis = `<div class="kpis" style="margin-top:0">
    <div class="kpi gold"><div class="k">Fresh Plant Drying</div><div class="v">${fmtNum(totalUsed)} lb</div><div class="n">${all.length} package(s) · ≈ ${fmtNum(totalUsed / LBS_PER_BIN, 1)} macro-bins</div></div>
    <div class="kpi ${barCls(pct) === 'red' ? '' : 'green'}"><div class="k">Capacity Used</div><div class="v">${fmtNum(pct, 1)}%</div><div class="n">of ${fmtNum(totalCap)} lb across ${DRYING_ROOMS.length} rooms</div></div>
    <div class="kpi blue"><div class="k">Space Available</div><div class="v">${fmtNum(free)} lb</div><div class="n">≈ ${fmtNum(free / LBS_PER_TRUCK, 1)} trucks · ${fmtNum(free / LBS_PER_BIN)} macro-bins</div></div>
    <div class="kpi purple"><div class="k">Rooms In Use</div><div class="v">${roomsInUse} / ${DRYING_ROOMS.length}</div><div class="n">${unassignedLbs ? fmtNum(unassignedLbs) + ' lb not matched to a room' : 'all drying lbs matched to a room'}</div></div>
  </div>`;

  // A room's strains, shown when its row is tapped.
  const strainRows = (room, used) => {
    const open = OPEN_ROWS.room.has(room);
    return Object.entries(strainsByRoom[room] || {}).sort((a, b) => b[1] - a[1]).map(([strain, lbs]) =>
      `<tr class="exp-child"${open ? '' : ' hidden'}>
        <td>${escapeHtml(strain)}</td>
        <td class="num">${fmtNum(lbs)} lb</td>
        <td colspan="7" class="muted">${used ? fmtNum(lbs / used * 100, 1) + (room ? '% of the room' : '% of unmatched') : ''}</td>
      </tr>`).join('');
  };
  const expRow = (group, key, hasChildren) =>
    hasChildren ? `class="exp-row${OPEN_ROWS[group].has(key) ? ' open' : ''}" data-group="${group}" data-key="${escapeAttr(key)}"` : '';
  const caret = has => `<span class="caret${has ? '' : ' none'}">▸</span>`;

  const roomRows = DRYING_ROOMS.map(r => {
    const used = usedByRoom[r.room] || 0;
    const p = used / r.lbs * 100;
    const has = !!strainsByRoom[r.room];
    return `<tbody><tr ${expRow('room', r.room, has)}>
      <td>${caret(has)}<b>Room ${r.room}</b></td>
      <td class="num">${fmtNum(used)} lb</td>
      <td class="num">${fmtNum(r.lbs)} lb</td>
      <td>${bar(p)}</td>
      <td class="num">${fmtNum(p, 1)}%</td>
      <td class="num">${fmtNum(Math.max(r.lbs - used, 0))} lb</td>
      <td class="num muted">${r.trellis}</td>
      <td class="num muted">${fmtNum(r.trucks, 2)}</td>
      <td class="num muted">${fmtNum(r.bins, 1)}</td>
    </tr>${strainRows(r.room, used)}</tbody>`;
  }).join('');

  const capacityCard = `<div class="card">
    <div class="card-hd"><h2>Drying Room Capacity</h2><div class="rollup"><b>${fmtNum(totalUsed)}</b> / ${fmtNum(totalCap)} lb</div></div>
    <div class="note">Capacity from the Rooms Capacity sheet (hoops-based estimate, 3–4 lb/plant). 1 truck ≈ 42 macro-bins ≈ 2,100 lb; 1 macro-bin ≈ 50 lb. Fresh Cannabis Plant packages are assigned to a room by their Canix location name, or — when Canix has no location — by the Drying Location on the package's Harvest Intake form (matched on the package UID; an intake listing several rooms is split evenly). Tap a room to see its weight by strain.</div>
    <div class="scroll"><table>
      <thead><tr><th>Room</th><th class="num">Drying</th><th class="num">Capacity</th><th>Fill</th><th class="num">Used</th><th class="num">Free</th><th class="num">Trellis (Mallas)</th><th class="num">Trucks</th><th class="num">Macro-Bins</th></tr></thead>
      ${roomRows}
      ${unassignedLbs ? `<tbody><tr ${expRow('room', '', true)}><td class="muted">${caret(true)}Not matched to a room</td><td class="num">${fmtNum(unassignedLbs)} lb</td><td colspan="7" class="muted" style="white-space:normal">${escapeHtml([...unassignedLocs].join(', '))}</td></tr>${strainRows('', unassignedLbs)}</tbody>` : ''}
      <tbody><tr class="total"><td>Total</td><td class="num">${fmtNum(totalUsed)} lb</td><td class="num">${fmtNum(totalCap)} lb</td><td>${bar(pct)}</td><td class="num">${fmtNum(pct, 1)}%</td><td class="num">${fmtNum(free)} lb</td>
          <td class="num muted">${DRYING_ROOMS.reduce((s, r) => s + r.trellis, 0)}</td><td class="num muted">${fmtNum(DRYING_ROOMS.reduce((s, r) => s + r.trucks, 0), 2)}</td><td class="num muted">${fmtNum(DRYING_ROOMS.reduce((s, r) => s + r.bins, 0), 1)}</td></tr>
      </tbody>
    </table></div>
  </div>`;

  // Drying weight by customer (like capacity, from every drying package —
  // not filtered by the search box). Each CID row expands to its strains.
  const byCid = {};
  all.forEach(p => {
    const cid = packageCid(p);
    const strain = p.item?.strain?.name || 'Unknown strain';
    const c = byCid[cid] = byCid[cid] || { lbs: 0, count: 0, strains: {} };
    const s = c.strains[strain] = c.strains[strain] || { lbs: 0, count: 0 };
    c.lbs += toLbs(p); c.count++;
    s.lbs += toLbs(p); s.count++;
  });
  // Biggest first, with "No CID" always last.
  const cids = Object.keys(byCid).sort((a, b) => (!a) - (!b) || byCid[b].lbs - byCid[a].lbs);
  const share = lbs => totalUsed ? fmtNum(lbs / totalUsed * 100, 1) + '%' : '—';
  const cidCard = `<div class="card">
    <div class="card-hd"><h2>Drying by Customer (CID)</h2><div class="rollup"><b>${cids.filter(Boolean).length}</b> customer(s)</div></div>
    <div class="note">The CID comes from the package's Harvest Intake form (matched on the package UID, same as the room). Tap a customer to see their weight by strain.</div>
    ${!all.length ? '<div class="empty">Nothing drying right now.</div>' : `<div class="scroll"><table class="cid-table">
      <thead><tr><th>Customer</th><th class="num">Packages</th><th class="num">Drying</th><th class="num">Share</th></tr></thead>
      ${cids.map(cid => {
        const c = byCid[cid];
        const open = OPEN_ROWS.cid.has(cid);
        const strains = Object.entries(c.strains).sort((a, b) => b[1].lbs - a[1].lbs);
        return `<tbody>
          <tr ${expRow('cid', cid, true)}>
            <td${cid ? '' : ' class="muted"'}>${caret(true)}${escapeHtml(cidLabel(cid))}</td>
            <td class="num">${c.count}</td>
            <td class="num">${fmtNum(c.lbs)} lb</td>
            <td class="num">${share(c.lbs)}</td>
          </tr>
          ${strains.map(([strain, s]) => `<tr class="exp-child"${open ? '' : ' hidden'}>
            <td>${escapeHtml(strain)}</td>
            <td class="num">${s.count}</td>
            <td class="num">${fmtNum(s.lbs)} lb</td>
            <td class="num muted">${c.lbs ? fmtNum(s.lbs / c.lbs * 100, 1) + '%' : '—'}</td>
          </tr>`).join('')}
        </tbody>`;
      }).join('')}
      <tbody><tr class="total"><td>Total</td><td class="num">${all.length}</td><td class="num">${fmtNum(totalUsed)} lb</td><td class="num">${totalUsed ? '100%' : '—'}</td></tr></tbody>
    </table></div>`}
  </div>`;

  const sorted = [...pkgs].sort((a, b) => (a.packaged_date || '').localeCompare(b.packaged_date || ''));
  const listCard = `<div class="card">
    <div class="card-hd"><h2>Currently Drying</h2><div class="rollup"><b>${pkgs.length}</b> package(s)</div></div>
    ${!all.length ? '<div class="empty">Nothing drying right now. Fresh Cannabis Plant packages from Canix show up here as soon as they are created.</div>'
      : !pkgs.length ? '<div class="empty">No drying packages match the search.</div>'
      : `<div class="scroll"><table>
      <thead><tr><th>Item</th><th>Strain</th><th class="num">Wet Weight</th><th>Room</th><th>Facility (License)</th><th class="num">Started</th><th class="num">Days</th><th>Source Harvest</th></tr></thead>
      <tbody>${sorted.map(p => {
        const fi = facilityInfo(p.facility_id);
        const { rooms, label, source } = packageRoom(p);
        const days = daysSince(p.packaged_date);
        return `<tr>
          <td class="wide">${p.item?.name || '—'}</td>
          <td>${p.item?.strain?.name || '—'}</td>
          <td class="num">${fmtWeight(p)}</td>
          <td>${rooms.length ? `<span class="pill gold">Room ${rooms.join(' + ')}</span>${source === 'intake' ? ' <span class="muted" title="From the Harvest Intake form">· intake</span>' : ''}` : `<span class="muted">${label || '—'}</span>`}</td>
          <td>${fi.displayName}${fi.license ? ` <span class="muted">(${fi.license})</span>` : ''}</td>
          <td class="num">${(p.packaged_date || '').slice(0, 10) || '—'}</td>
          <td class="num">${days ?? '—'}</td>
          <td class="wide muted">${p.source_harvests || '—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`}
  </div>`;

  $('view').innerHTML = processingSubtabs() + kpis + capacityCard + cidCard + listCard;
  attachSubtabListeners();
  $('view').querySelectorAll('.exp-row').forEach(row => {
    row.addEventListener('click', () => {
      const set = OPEN_ROWS[row.dataset.group], key = row.dataset.key;
      const open = !set.has(key);
      if (open) set.add(key); else set.delete(key);
      row.classList.toggle('open', open);
      row.parentElement.querySelectorAll('.exp-child').forEach(r => { r.hidden = !open; });
    });
  });
}

function renderView() {
  if (CURRENT_STAGE === 'Processing' && PROCESSING_VIEW === 'drying') { renderDrying(); return; }

  const pkgs = applySearch(visiblePackages().filter(p =>
    CURRENT_STAGE === 'All' || facilityInfo(p.facility_id).stage === CURRENT_STAGE
  ));

  if (!pkgs.length) {
    $('view').innerHTML = (CURRENT_STAGE === 'Processing' ? processingSubtabs() : '') + '<div class="empty">No packages for this view.</div>';
    attachSubtabListeners();
    return;
  }

  // Cultivation (and only Cultivation) gets the farm-group roll-up view the
  // user asked for — other stages are usually a single facility, so a flat
  // table is clearer there.
  if (CURRENT_STAGE === 'Cultivation') {
    const byFarm = {};
    pkgs.forEach(p => {
      const fi = facilityInfo(p.facility_id);
      const farm = fi.farmGroup || fi.displayName;
      (byFarm[farm] = byFarm[farm] || []).push(p);
    });
    const farms = Object.keys(byFarm).sort((a, b) => byFarm[b].length - byFarm[a].length);
    $('view').innerHTML = `<div class="card"><h2>Cultivation — by farm</h2>
      <div class="note">${farms.length} farm(s), ${pkgs.length} on-hand package(s) total.</div>
      ${farms.map(farm => {
        const rows = byFarm[farm];
        const licenses = new Set(rows.map(p => facilityInfo(p.facility_id).license));
        return `<div class="farm-group">
          <div class="farm-hd"><div class="name">${farm}</div>
            <div class="rollup"><b>${rows.length}</b> package(s) · <b>${licenses.size}</b> license(s)</div></div>
          ${tableHtml(rows)}
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  const label = CURRENT_STAGE === 'All' ? 'All facilities' : CURRENT_STAGE;
  $('view').innerHTML = `${CURRENT_STAGE === 'Processing' ? processingSubtabs() : ''}<div class="card">
    <div class="card-hd"><h2>${label}</h2><div class="rollup"><b>${pkgs.length}</b> package(s)</div></div>
    ${tableHtml(pkgs)}
  </div>`;
  attachSubtabListeners();
}

// ── Forecasted Flower ────────────────────────────────────────────────────

function statusPillGeneric(status) {
  const cls = status === 'planned' ? 'blue' : status === 'completed' ? 'green' : '';
  return `<span class="pill ${cls}">${status}</span>`;
}

function fmtLbs(n) {
  return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function latestEstimateForFarm(farm) {
  return YIELD_ESTIMATES
    .filter(e => e.farm_group === farm)
    .reduce((best, e) => (!best || e.effective_date > best.effective_date) ? e : best, null);
}

function liveFloweringCount(farm) {
  let total = 0;
  PLANT_BATCHES.forEach(b => {
    const fi = facilityInfo(b.facility_id);
    if (fi.exclude) return;
    if ((fi.farmGroup || fi.displayName) !== farm) return;
    total += Number(b.flowering_count) || 0;
  });
  return total;
}

// One row per (farm, strain) for each planned harvest — the farm-level
// forecast broken down using each plant_batch's own strain. Farms using a
// manual plant_count_override are skipped here: an override is a single
// hand-entered total with no per-strain detail to derive from, so a
// strain breakdown for it would just be wrong.
function strainBreakdownRows() {
  const rows = [];
  HARVEST_PLANS.filter(p => p.status === 'planned').forEach(plan => {
    if (plan.plant_count_override != null) return;
    const estimate = latestEstimateForFarm(plan.farm_group);
    if (!estimate) return;
    const lbsPerPlant = Number(estimate.estimated_lbs_per_plant);
    const byStrain = {};
    PLANT_BATCHES.forEach(b => {
      const fi = facilityInfo(b.facility_id);
      if (fi.exclude) return;
      if ((fi.farmGroup || fi.displayName) !== plan.farm_group) return;
      const count = Number(b.flowering_count) || 0;
      if (!count) return;
      const strain = b.strain?.name || 'Unknown';
      byStrain[strain] = (byStrain[strain] || 0) + count;
    });
    Object.entries(byStrain).forEach(([strain, count]) => {
      rows.push({ strain, farm: plan.farm_group, date: plan.planned_harvest_date, count, lbsPerPlant, forecastLbs: count * lbsPerPlant });
    });
  });
  return rows;
}

function renderStrainBreakdown() {
  const rows = strainBreakdownRows();
  const overridesSkipped = HARVEST_PLANS.filter(p => p.status === 'planned' && p.plant_count_override != null).length;

  if (!rows.length) {
    return `<div class="card">
      <div class="card-hd"><h2>Forecasted Flower by Strain</h2></div>
      <div class="empty">No strain-level forecast yet — needs a planned harvest date and an lbs/plant estimate for at least one farm not using a manual plant-count override.</div>
    </div>`;
  }

  const q = ($('strainFilter')?.value || '').trim().toLowerCase();
  const filtered = q ? rows.filter(r => r.strain.toLowerCase().includes(q) || r.farm.toLowerCase().includes(q)) : rows;

  const byStrainTotal = {};
  rows.forEach(r => { byStrainTotal[r.strain] = (byStrainTotal[r.strain] || 0) + r.forecastLbs; });
  const strainTotals = Object.entries(byStrainTotal).sort((a, b) => b[1] - a[1]);

  const byDateStrain = [...filtered].sort((a, b) => a.date.localeCompare(b.date) || a.strain.localeCompare(b.strain));

  return `<div class="card">
    <div class="card-hd"><h2>Total Forecasted by Strain</h2><div class="rollup"><b>${strainTotals.length}</b> strain(s)</div></div>
    <div class="note">Summed across every planned harvest and farm.${overridesSkipped ? ` ${overridesSkipped} planned harvest(s) using a manual plant-count override aren't broken down here (no per-strain detail to derive it from) — they're still counted in the farm-level total above.` : ''}</div>
    <div class="scroll"><table>
      <thead><tr><th>Strain</th><th class="num">Forecasted Lbs</th></tr></thead>
      <tbody>${strainTotals.map(([strain, lbs]) => `<tr><td>${strain}</td><td class="num">${fmtLbs(lbs)} lb</td></tr>`).join('')}</tbody>
    </table></div>
  </div>

  <div class="card">
    <div class="card-hd"><h2>Forecasted Flower by Strain &amp; Date</h2><div class="rollup"><b>${byDateStrain.length}</b> row(s)</div></div>
    <div class="search"><input type="text" id="strainFilter" placeholder="Filter by strain or farm…" value="${q ? q.replace(/"/g, '&quot;') : ''}"></div>
    <div class="scroll"><table>
      <thead><tr><th class="num">Harvest Date</th><th>Strain</th><th>Farm</th><th class="num">Plant Count</th><th class="num">Forecasted Lbs</th></tr></thead>
      <tbody>${byDateStrain.map(r => `<tr>
        <td class="num">${r.date}</td>
        <td>${r.strain}</td>
        <td>${r.farm}</td>
        <td class="num">${r.count.toLocaleString()}</td>
        <td class="num">${fmtLbs(r.forecastLbs)} lb</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function renderForecast() {
  const rows = [...HARVEST_PLANS]
    .sort((a, b) => a.planned_harvest_date.localeCompare(b.planned_harvest_date))
    .map(plan => {
      const estimate = latestEstimateForFarm(plan.farm_group);
      const liveCount = liveFloweringCount(plan.farm_group);
      const hasOverride = plan.plant_count_override != null;
      const count = hasOverride ? Number(plan.plant_count_override) : liveCount;
      const forecastLbs = estimate ? count * Number(estimate.estimated_lbs_per_plant) : null;
      return { plan, estimate, count, countSource: hasOverride ? 'override' : 'live', forecastLbs };
    });

  const plannedRows = rows.filter(r => r.plan.status === 'planned');
  const totalForecast = plannedRows.reduce((s, r) => s + (r.forecastLbs || 0), 0);
  const missingEstimate = plannedRows.filter(r => !r.estimate).length;

  $('forecastKpis').innerHTML = `
    <div class="kpi green"><div class="k">Forecasted Flower</div><div class="v">${fmtLbs(totalForecast)} lb</div><div class="n">${plannedRows.length} planned harvest(s)</div></div>
    <div class="kpi ${missingEstimate ? 'gold' : 'blue'}"><div class="k">Missing Estimate</div><div class="v">${missingEstimate}</div><div class="n">planned harvest(s) with no lbs/plant set yet</div></div>
  `;

  if (!rows.length) {
    $('forecastView').innerHTML = `<div class="card"><div class="empty">No harvest plans yet. Add planned harvest dates and lbs/plant estimates per farm from admin.html's "Yield Forecast" tab.</div></div>`;
    return;
  }

  $('forecastView').innerHTML = `<div class="card">
    <div class="card-hd"><h2>Forecasted Flower by Farm</h2></div>
    <div class="note">Forecast = plant count (live flowering-plant count from Canix, or a manual override entered in admin) &times; that farm's most recent lbs/plant estimate.</div>
    <div class="scroll"><table>
      <thead><tr><th>Farm</th><th class="num">Harvest Date</th><th>Status</th><th class="num">Plant Count</th><th class="num">Est. Lbs/Plant</th><th class="num">Forecasted Lbs</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td>${r.plan.farm_group}</td>
          <td class="num">${r.plan.planned_harvest_date}</td>
          <td>${statusPillGeneric(r.plan.status)}</td>
          <td class="num">${r.count.toLocaleString()} <span style="color:var(--muted);font-size:.7em">(${r.countSource})</span></td>
          <td class="num">${r.estimate ? r.estimate.estimated_lbs_per_plant + ' ' : '<span style="color:var(--muted)">not set</span>'}${r.estimate ? `<span style="color:var(--muted);font-size:.7em">(${r.estimate.effective_date})</span>` : ''}</td>
          <td class="num">${r.forecastLbs != null ? fmtLbs(r.forecastLbs) + ' lb' : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </div>
  ${renderStrainBreakdown()}`;

  attachStrainFilterListener();
}

// Re-renders just the two strain-breakdown cards in place (not the whole
// forecast page) so typing in the filter doesn't lose scroll position, and
// re-attaches itself since the input element gets replaced each time.
function attachStrainFilterListener() {
  const el = $('strainFilter');
  if (!el) return;
  el.addEventListener('input', () => {
    const cards = $('forecastView').querySelectorAll('.card');
    const tmp = document.createElement('div');
    tmp.innerHTML = renderStrainBreakdown();
    const newCards = tmp.querySelectorAll('.card');
    if (cards.length < 3 || newCards.length < 2) return;
    cards[1].replaceWith(newCards[0]);
    cards[2].replaceWith(newCards[1]);
    const refocus = $('strainFilter');
    if (refocus) { refocus.focus(); refocus.selectionStart = refocus.selectionEnd = refocus.value.length; }
    attachStrainFilterListener();
  });
}

document.getElementById('pageTabs').querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    CURRENT_PAGE = btn.dataset.page;
    document.getElementById('pageTabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    document.getElementById('inventoryPage').style.display = CURRENT_PAGE === 'inventory' ? '' : 'none';
    document.getElementById('forecastPage').style.display = CURRENT_PAGE === 'forecast' ? '' : 'none';
    $('pageTitle').textContent = CURRENT_PAGE === 'inventory' ? 'Canix Inventory' : 'Forecasted Flower';
  });
});

async function load() {
  try {
    const [inv, batches, cfg, meta, forecastInputs, intakeRooms, cidLabels] = await Promise.all([
      fetch(INVENTORY_URL).then(r => r.json()),
      fetch(PLANT_BATCHES_URL).then(r => r.json()).catch(() => []),
      loadFacilityConfig(),
      fetch(META_URL).then(r => r.json()).catch(() => null),
      loadForecastInputs(),
      loadIntakeRooms(),
      loadCidLabels(),
    ]);
    INTAKE_ROOMS = intakeRooms;
    CID_LABELS = cidLabels;
    ALL_PACKAGES = inv;
    PLANT_BATCHES = batches;
    FACILITY_CONFIG = cfg;
    YIELD_ESTIMATES = forecastInputs.estimates;
    HARVEST_PLANS = forecastInputs.plans;
    $('sub').textContent = meta?.last_sync
      ? 'Last synced ' + new Date(meta.last_sync).toLocaleString()
      : 'Current on-hand inventory across all licenses';
    renderKpis();
    renderTabs();
    renderView();
    renderForecast();
  } catch (e) {
    console.error(e);
    $('view').innerHTML = '<div class="empty">Could not load Canix data. Check that data/canix_inventory.json has been pushed to main, and that the canix_facilities Supabase table exists (see supabase/schema.sql).</div>';
    $('sub').textContent = 'Load failed';
  }
}

$('search').addEventListener('input', renderView);
$('refreshBtn').addEventListener('click', load);
load();
</script>
</body>
</html>
