<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Metrc Queue — 2CW Operations</title>
  <script>
    (function(){ if (!sessionStorage.getItem('2cw_pin')) window.location.replace('/index.html'); })();
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;
      --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}

    .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
    .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
    .hdr-div{width:1px;height:18px;background:var(--border)}
    .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:0 0 auto}
    .lang button{background:transparent;border:none;color:var(--subtext);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;min-height:36px}
    .lang button.on{background:var(--blue);color:#000}

    main{padding:28px 16px 60px;max-width:1600px;margin:0 auto}
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,46px);letter-spacing:.04em;line-height:1}
    .sub{margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

    .counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:22px}
    .count{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
    .count:hover,.count.on{border-color:var(--green)}
    .count .n{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1}
    .count .l{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);margin-top:4px}
    .count.needs_form .n{color:var(--purple)}
    .count.todo .n{color:var(--red)} .count.in_progress .n{color:var(--gold)} .count.done .n{color:var(--green)} .count.not_needed .n{color:var(--muted)}

    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 22px}
    .filters button{background:var(--surface);border:1px solid var(--border);color:var(--subtext);border-radius:10px;padding:.6rem 1rem;
      font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:44px}
    .filters button.on{background:var(--blue);border-color:var(--blue);color:#000;font-weight:700}
    .filters input{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.6rem .9rem;font-size:.95rem;min-height:44px;outline:none}
    .filters input:focus{border-color:var(--blue)}

    .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .tbl{width:100%;border-collapse:collapse;font-size:.85rem}
    .tbl th{background:var(--surface2);color:var(--muted);font-family:'DM Mono',monospace;font-size:.65rem;font-weight:500;
      letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
    .tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
    .tbl tbody tr{cursor:pointer}
    .tbl tbody tr td:first-child{border-left:3px solid var(--red)}
    .tbl tbody tr.in_progress td:first-child{border-left-color:var(--gold)}
    .tbl tbody tr.done td:first-child{border-left-color:var(--green)}
    .tbl tbody tr.not_needed td:first-child{border-left-color:var(--muted)}
    .tbl tbody tr.not_needed{color:var(--subtext)}
    .tbl tbody tr:hover{background:var(--surface2)}
    .tbl tbody tr.dirty{background:rgba(90,159,212,.10)}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl .mono{font-family:'DM Mono',monospace;font-size:.8rem}
    .tbl .num{text-align:right;font-family:'DM Mono',monospace}
    .tbl .form-name{color:var(--blue)}
    .tbl .form-name .sub-line{font-size:.82rem;color:var(--muted);margin-top:2px}
    .tbl .strain{font-weight:500}
    .tbl .note{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--subtext)}
    .tbl .age.old{color:var(--red)}
    .tbl .uid{max-width:240px;overflow:hidden;text-overflow:ellipsis}
    .st-cell{display:flex;gap:6px;align-items:center}
    .mf-cell{display:flex;gap:8px;align-items:center}
    .copy-mini{min-height:30px;padding:4px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--subtext);
      font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer}
    .copy-mini:hover{border-color:var(--blue);color:var(--blue)}
    .copy-mini.ok{border-color:var(--green);background:var(--green);color:#000}
    .st-sel{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;min-height:36px;font:inherit;font-size:.82rem;cursor:pointer}
    .st-sel.todo{border-color:var(--red);color:var(--red)}
    .st-sel.in_progress{border-color:var(--gold);color:var(--gold)}
    .st-sel.done{border-color:var(--green);color:var(--green)}
    .st-sel.not_needed{color:var(--subtext)}
    .st-sel option{color:var(--text);background:var(--surface)}
    .row-save{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--blue);background:var(--blue);color:#000;
      font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer}
    .row-save:disabled{background:transparent;border-color:var(--border);color:var(--muted);cursor:default}
    .row-save.ok{background:var(--green);border-color:var(--green);color:#000}
    .row-err{color:var(--red);font-size:.75rem;white-space:normal;max-width:220px;margin-top:4px}
    .pill{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
    .pill.todo{border-color:var(--red);color:var(--red)}
    .pill.in_progress{border-color:var(--gold);color:var(--gold)}
    .pill.done{border-color:var(--green);color:var(--green)}
    .pill.not_needed{color:var(--muted)}
    .pill.needs_form{border-color:var(--purple);color:var(--purple)}
    .tbl tbody tr.needs_form td:first-child{border-left-color:var(--purple)}
    .nf-go{display:inline-block;margin-top:6px;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
      color:#000;background:var(--purple);border-radius:8px;padding:6px 10px;text-decoration:none;white-space:nowrap}
    .pill.sync{border-color:var(--gold);color:var(--gold);border-style:dashed}
    .pill.wwait{border-color:var(--gold);background:var(--gold);color:#000;font-weight:700}
    .pill.wok{border-color:var(--green);color:var(--green)}
    .w-box{border:1px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
    .w-box.ok{border-color:var(--green)}
    .w-lbs{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:'DM Mono',monospace;font-size:.8rem;color:var(--subtext)}
    .w-lbs b{color:var(--text);font-weight:500}
    .st-btns button:disabled,.tag-row input:disabled{opacity:.4;cursor:not-allowed}
    .row-station{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}

    /* Incoming transfers to accept (metrc_transfers.js) */
    .inc{margin-top:22px}
    .inc-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:8px;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
    .inc-hd .caret{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--subtext);width:1em}
    .inc-hd .n{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--subtext)}
    .inc-hd .n .od{color:var(--red);font-weight:700}
    .inc-hd .n .ug{color:var(--gold);font-weight:700}
    .inc.closed .inc-hd .s{display:none}
    .inc-hd .h{font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text);font-weight:700}
    .inc-hd .s{font-size:.8rem;color:var(--muted)}
    .inc .tbl tbody tr{cursor:default}
    .inc .tbl tbody tr td:first-child{border-left-color:var(--muted)}
    .inc .tbl tbody tr.urgent td:first-child{border-left-color:var(--gold)}
    .inc .tbl tbody tr.overdue td:first-child{border-left-color:var(--red)}
    .inc .tbl tbody tr.overdue{background:rgba(239,83,80,.08)}
    .pill.overdue{border-color:var(--red);background:var(--red);color:#000;font-weight:700}
    .pill.urgent{border-color:var(--gold);background:var(--gold);color:#000;font-weight:700}
    .pill.ok{color:var(--subtext)}
    .inc-intake{color:var(--blue);text-decoration:none}
    .inc-intake:hover{text-decoration:underline}
    .inc-none{font-size:.85rem;color:var(--muted);padding:10px 0}
    /* Click a transfer to see each package (UID) on the manifest */
    .inc .tbl tbody tr.inc-row{cursor:pointer}
    .inc .tbl tbody tr.inc-row:hover{background:rgba(255,255,255,.03)}
    .inc-caret{display:inline-block;width:10px;margin-right:6px;color:var(--muted);font-size:10px;transition:transform .15s}
    .inc-row.open .inc-caret{transform:rotate(90deg);color:var(--blue)}
    .inc .tbl tbody tr.inc-pk td{background:rgba(0,0,0,.18);padding-top:4px;padding-bottom:10px}
    .inc .tbl tbody tr.inc-pk td:first-child{border-left-color:transparent}
    .inc-pkt{width:100%;border-collapse:collapse;font-size:.8rem}
    .inc-pkt th{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;font-weight:400}
    .inc-pkt td{padding:5px 8px;border-top:1px solid var(--border)}
    .inc-pkt .num{text-align:right}
    .inc-pk-acts{display:flex;justify-content:flex-end;padding:6px 8px 0}

    .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:.9rem;line-height:1.6}
    .footer{margin-top:36px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center}

    /* Detail sheet */
    #detail-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 12px 40px}
    #detail-bg.on{display:flex}
    #detail{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:720px;padding:22px 20px}
    .d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
    .d-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;line-height:1.05}
    .d-sub{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);margin-bottom:14px;line-height:1.6}
    .d-actions{display:flex;gap:8px;flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end}
    .btn{padding:.65rem 1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text);text-decoration:none;display:inline-block;min-height:40px}
    .btn-blue{background:var(--blue);border-color:var(--blue);color:#000}
    .btn:disabled{opacity:.5;cursor:default}

    .st-box{border:1px solid var(--border);border-radius:12px;padding:14px;margin:6px 0 18px;background:var(--surface2)}
    .st-hd{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--subtext);margin-bottom:10px}
    .st-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .st-btns button{min-height:48px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--subtext);font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;cursor:pointer}
    .st-btns button.on.todo{background:var(--red);border-color:var(--red);color:#000}
    .st-btns button.on.in_progress{background:var(--gold);border-color:var(--gold);color:#000}
    .st-btns button.on.done{background:var(--green);border-color:var(--green);color:#000}
    .st-btns button.on.not_needed{background:var(--muted);border-color:var(--muted);color:#000}
    .st-box textarea{width:100%;min-height:64px;margin-top:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font:inherit;font-size:.95rem;resize:vertical}
    .tag-box{margin-top:12px;display:flex;flex-direction:column;gap:8px}
    .tag-hd{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--subtext)}
    .tag-row{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:10px;align-items:center}
    .tag-row .tl{font-size:.88rem}
    .tag-row .tl small{display:block;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)}
    .tag-row input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;
      font-family:'DM Mono',monospace;font-size:.92rem;min-height:40px;text-transform:uppercase}
    .tag-row input:focus{border-color:var(--blue);outline:none}
    .tag-row .tv{font-family:'DM Mono',monospace;font-size:.9rem;word-break:break-all}
    .tag-row .tv.none{color:var(--muted);font-family:inherit}
    .hist .tags{margin-top:3px;font-family:'DM Mono',monospace;font-size:.8rem}
    .st-save{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .st-msg{font-size:.85rem;color:var(--subtext)}
    .st-msg.err{color:var(--red)}
    .st-view{font-size:.9rem;line-height:1.5}

    .d-row{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:.9rem}
    .d-row .k{color:var(--muted);font-size:.78rem}
    .d-row .v{color:var(--text);word-break:break-word}
    .d-row .v.copyable{cursor:copy;border-radius:4px}
    .d-row .v.copyable:hover{background:var(--surface2);outline:1px dashed var(--border)}
    .d-row .v.copied{color:var(--green)}
    .d-row.hl .v{font-family:'DM Mono',monospace;color:var(--green)}
    .d-table{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:.8rem;margin-top:4px}
    .d-table th{color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:.7rem}
    .d-table td{padding:4px 6px;border-bottom:1px solid var(--border)}
    .d-photo{max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--border);display:block}
    .d-section{margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
    .d-section-hd{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--subtext);margin-bottom:10px}
    .hist{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.85rem;color:var(--subtext)}
    .hist b{color:var(--text);font-weight:500}
    .muted-note{font-size:.82rem;color:var(--muted)}
    .d-photo-btn{padding:0;border:0;background:none;cursor:zoom-in;display:block}

    /* Photo viewer — opens over the table and the detail sheet */
    #ph-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      padding:calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}
    #ph-bg.on{display:flex}
    #ph-img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;border-radius:10px;background:var(--surface2)}
    .ph-bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:900px}
    .ph-cap{flex:1 1 auto;min-width:0;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #ph-bg .btn{color:#eee;border-color:#666;background:rgba(0,0,0,.4)}
  </style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html" id="back">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand" id="brand">Metrc Queue</div>
  <div class="lang" id="lang"></div>
</header>

<main>
  <div class="title" id="title">Metrc Queue</div>
  <div class="sub" id="sub">—</div>
  <div class="inc" id="incoming"></div>
  <div class="counts" id="counts"></div>
  <div class="filters" id="filters"></div>
  <div id="board"></div>
  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</main>

<div id="detail-bg"><div id="detail"></div></div>
<div id="ph-bg" role="dialog" aria-modal="true">
  <div class="ph-bar"><div class="ph-cap" id="ph-cap"></div>
    <a class="btn" id="ph-tab" target="_blank" rel="noopener"></a><button type="button" class="btn" id="ph-close"></button></div>
  <img id="ph-img" alt="">
  <div class="ph-bar" id="ph-nav"><button type="button" class="btn" id="ph-prev">←</button><span class="ph-cap" id="ph-n" style="flex:0 0 auto"></span><button type="button" class="btn" id="ph-next">→</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config/supabase_config.js"></script>
<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/ops_data.js"></script>
<script src="/metrc_transfers.js"></script>
<script>
// Metrc Queue — every submitted Wet Intake, Take Down, Bucking, Hand Trim,
// Pre-Roll and Ground Flower Pouches form (and the others in METRC_STATIONS), each needing something done in Metrc, with where it stands
// (To do / In progress / Done / Not needed) and a note. Statuses live in the
// metrc_queue table (supabase/schema.sql), read here with the anon key and
// changed only through netlify/functions/metrc-queue.js, which re-checks
// edit access from the PIN. Access: admin panel → Metrc Queue → View / Edit,
// turned into 2cw_metrc_access ('view' | 'edit') at hub login.
(async function () {
  mountLangToggle('lang');
  // The station forms that feed the queue — keep in step with
  // METRC_STATIONS in netlify/functions/metrc-queue.js.
  const METRC_STATIONS = ['intake_wet', 'dry_check', 'buck', 'hand_trim', 'trim_package', 'preroll_production', 'pouch_production', 'transfer_out'];
  const access = sessionStorage.getItem('2cw_metrc_access') || '';
  const canEdit = access === 'edit';
  // Metrc Queue → Confirm weights: a manager's sign-off on a form's output
  // weights (stations with `weightCheck` — Hand Trim), or verification of a
  // run's counts (checkKind 'count' — Pre-Roll, Ground Flower Pouches). Until then its tags
  // and Done are locked here and refused by metrc-queue.js.
  const canConfirm = sessionStorage.getItem('2cw_metrc_confirm') === 'true';

  const L = {
    title:     { en: 'Metrc Queue', es: 'Cola de Metrc' },
    back:      { en: '← Hub', es: '← Inicio' },
    open:      { en: 'Open', es: 'Abiertos' },
    todo:      { en: 'To do', es: 'Por hacer' },
    in_progress:{ en: 'In progress', es: 'En curso' },
    done:      { en: 'Done', es: 'Hecho' },
    not_needed:{ en: 'Not needed', es: 'No necesario' },
    all:       { en: 'All', es: 'Todos' },
    allForms:  { en: 'All forms', es: 'Todos los formularios' },
    search:    { en: 'Search strain, brand, UID, who, note…', es: 'Buscar variedad, marca, UID, quién, nota…' },
    forms:     { en: 'forms', es: 'formularios' },
    form:      { en: 'form', es: 'formulario' },
    empty:     { en: 'Nothing here.', es: 'Nada aquí.' },
    emptyOpen: { en: 'Nothing waiting on Metrc. 🎉', es: 'Nada pendiente en Metrc. 🎉' },
    status:    { en: 'Metrc status', es: 'Estado en Metrc' },

  const STATUSES = ['todo', 'in_progress', 'done', 'not_needed'];

  // ── Incoming transfers to accept ───────────────────────────────────────────
  // From the last Canix sync (metrc_transfers.js); re-drawn every few minutes
  // so the hours left stay current, re-fetched when the page comes back.
  const incEl = document.getElementById('incoming');
  let incoming = null, canixAt = null, incomingAt = 0;
  // Collapsed or open, remembered on this device.
  let incOpen = true;
  const incExpanded = new Set();   // keys of transfers showing their packages
  try { incOpen = localStorage.getItem('metrc_inc_open') !== '0'; } catch (_) {}
  const fmtAt = (ms) => ms ? new Date(ms).toLocaleString(getLang() === 'es' ? 'es-MX' : 'en-US', { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
  async function loadIncoming() {
    const get = (f) => fetch(`/data/${f}?t=${Date.now()}`).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
    try {
      const [tr, fac, inv, meta, cust] = await Promise.all([get('canix_transfers_recent.json'), get('canix_facilities.json'),
        get('canix_inventory.json'), get('canix_meta.json').catch(() => ({})), get('customers.json').catch(() => [])]);
      incoming = { transfers: tr, facilities: fac, inventory: inv, customers: Array.isArray(cust) ? cust : [] };
      incomingAt = Date.now();
      canixAt = meta.last_sync || null;
    } catch (ex) { console.error('canix transfers', ex); incoming = null; }
    // The whole board: the Needs form rows come from Canix too (and an open
    // outgoing transfer's From Metrc box).
    if (incoming) { render(); if (openId) openDetail(openId); } else renderIncoming();
  }
  // A transfer's packages, shown under its row when it's clicked open.
  const incKey = (x) => x.intake ? `i:${x.ids[0]}` : `m:${x.manifest}|${x.toLicense}`;
  function pkgRow(x) {
    const items = x.items || [];
    const wt = (p) => p.weight == null ? '—' : `${fmtNum(p.weight, 2)} ${String(p.unit || '').toLowerCase().startsWith('pound') ? 'lb' : esc(p.unit)}`;
    const copy = (v, label) => `<button type="button" class="copy-mini" data-copy="${esc(v)}">${label || t(L.copyBtn)}</button>`;
    return `<tr class="inc-pk"><td colspan="8">
      <table class="inc-pkt"><thead><tr><th>UID</th><th>${t(L.colItem)}</th><th class="num">${t(L.colWeight)}</th></tr></thead>
      <tbody>${items.map((p) => `<tr>
        <td class="mono"><div class="mf-cell"><span>${esc(p.tag)}</span>${copy(p.tag)}</div></td>
        <td>${esc(p.item || p.strain || (x.strains || []).join(', ') || '—')}</td>
        <td class="num mono">${wt(p)}</td></tr>`).join('')}</tbody></table>
      ${items.length > 1 ? `<div class="inc-pk-acts">${copy(items.map((p) => p.tag).join('\n'), t(L.copyUids))}</div>` : ''}
    </td></tr>`;
  }
  function renderIncoming() {
    incEl.classList.toggle('closed', !incOpen);
    const head = (list) => {
      const od = list ? list.filter((x) => x.level === 'overdue').length : 0;
      const ug = list ? list.filter((x) => x.level === 'urgent').length : 0;
      const n = list ? `<span class="n">${list.length} ${t(L.incCount)}${od ? ` · <span class="od">${od} ${t(L.overdue)}</span>` : ''}${ug ? ` · <span class="ug">${ug} ${t(L.urgent)}</span>` : ''}</span>` : '';
      return `<button type="button" class="inc-hd" aria-expanded="${incOpen}" title="${t(L.incToggle)}"><span class="caret">${incOpen ? '▾' : '▸'}</span><span class="h">${t(L.incHd)}</span>${n}<span class="s">${t(L.incRule)}${canixAt ? ` · ${t(L.incAsOf)} ${esc(fmtAt(canixAt))}` : ''}</span></button>`;
    };
    const show = (list, body) => {
      incEl.innerHTML = head(list) + (incOpen ? body : '');
      incEl.querySelector('.inc-hd').onclick = () => {
        incOpen = !incOpen;
        try { localStorage.setItem('metrc_inc_open', incOpen ? '1' : '0'); } catch (_) {}
        renderIncoming();
      };
    };
    if (!incoming) { show(null, `<div class="inc-none">${t(L.incErr)}</div>`); return; }
    const now = Date.now();
    // Wet Intakes (from the queue's forms) whose package Canix hasn't got at
    // one of our licenses: an outside farm's load, received but not accepted.
    const pidField = STATION_BY_KEY.intake_wet.fields.find((f) => f.k === 'pid');
    const intakes = forms.filter((r) => r.station_key === 'intake_wet').map((r) => ({
      id: r.id, startedAt: Date.parse(r.created_at || r.submitted_at) || null,
      uids: [val(r, 'sourceUid'), ...(val(r, 'lines') || []).map((x) => x.sourceUid)].filter(Boolean),
      manifest: String(val(r, 'manifestNo') || '').trim(), farm: val(r, 'pid') ? display(pidField, val(r, 'pid')) : '',
      strain: r.strain || val(r, 'strain') || '', lb: Number(val(r, 'totalWetLb')) || 0
    }));
    const list = [...MetrcTransfers.incomingTransfers(incoming.transfers, incoming.facilities, now),
      ...MetrcTransfers.unacceptedIntakes(intakes, incoming.transfers, incoming.inventory, incoming.facilities, now)]
      .sort((a, b) => (a.due === null ? -Infinity : a.due) - (b.due === null ? -Infinity : b.due));
    if (!list.length) { show(list, `<div class="inc-none">${t(L.incNone)}</div>`); return; }
    const hrs = (h) => { const a = Math.abs(h); return a >= 48 ? `${Math.floor(a / 24)}d ${Math.round(a % 24)}h` : a >= 1 ? `${Math.floor(a)}h ${Math.round((a % 1) * 60)}m` : `${Math.round(a * 60)}m`; };
    const pill = (x) => x.hoursLeft === null ? `<span class="pill urgent">${t(L.urgent)}</span>`
      : `<span class="pill ${x.level}">${x.level === 'ok' ? '' : t(L[x.level]) + ' · '}${hrs(x.hoursLeft)} ${t(x.hoursLeft < 0 ? L.hOver : L.hLeft)}</span>`;
    const short = (name) => String(name || '').split(':')[0];
    show(list, `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>${t(L.colStatus)}</th><th>${t(L.colManifest)}</th><th>${t(L.colFrom)}</th><th>${t(L.colTo)}</th>
        <th>${t(L.colLeft)}</th><th>${t(L.colDue)}</th><th class="num">${t(L.colPkgs)}</th><th class="num">${t(L.colAmount)}</th></tr></thead>
      <tbody>${list.map((x) => { const key = incKey(x), open = incExpanded.has(key); return `<tr class="${x.level} inc-row${open ? ' open' : ''}" data-key="${esc(key)}" title="${t(L.incExpand)}">
        <td><span class="inc-caret">▶</span>${pill(x)}</td>
        <td class="mono">${x.manifest ? `<div class="mf-cell"><span>${esc(x.manifest)}</span><button type="button" class="copy-mini" data-copy="${esc(x.manifest)}">${t(L.copyBtn)}</button></div>` : '—'}</td>
        ${x.intake
          ? `<td>${esc(x.fromName || t(L.outsideFarm))}${x.strains.length ? `<div class="muted-note">${esc(x.strains.join(', '))}</div>` : ''}</td>
             <td><a class="inc-intake" href="?id=${esc(x.ids[0])}" data-id="${esc(x.ids[0])}">${t(L.incIntake)}</a></td>`
          : `<td title="${esc(x.fromName)}">${esc(short(x.fromName))} <span class="muted-note mono">${esc(x.fromLicense)}</span></td>
             <td title="${esc(x.toName)}">${esc(short(x.toName))} <span class="muted-note mono">${esc(x.toLicense)}</span></td>`}
        <td class="mono">${esc(fmtAt(x.departure))}</td>
        <td class="mono">${esc(fmtAt(x.due))}</td>
        <td class="num" title="${esc(x.tags.join('\n'))}">${x.packages}</td>
        <td class="num">${x.weightLb ? `${fmtNum(x.weightLb, 0)} lb` : '—'}</td>
      </tr>${open ? pkgRow(x) : ''}`; }).join('')}</tbody></table></div>`);
    incEl.querySelectorAll('.inc-intake').forEach((a) => { a.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openDetail(a.dataset.id); }; });
    incEl.querySelectorAll('tr.inc-row').forEach((tr) => {
      tr.onclick = (e) => {
        if (e.target.closest('button, a')) return;
        const k = tr.dataset.key;
        if (incExpanded.has(k)) incExpanded.delete(k); else incExpanded.add(k);
        renderIncoming();
      };
    });
    incEl.querySelectorAll('.copy-mini').forEach((cp) => {
      cp.onclick = async (e) => {
        e.stopPropagation();
        if (!(await writeClipboard(cp.dataset.copy))) return;
        const label = cp.textContent;
        cp.classList.add('ok'); cp.textContent = t(L.copyDone);
        setTimeout(() => { cp.classList.remove('ok'); cp.textContent = label; }, 1200);
      };
    });
  }

  const client = getClient();
  const reference = await loadReference();
  let forms = [], queue = new Map();

  // Every form submitted through the app on the queue's stations, plus every
  // status row. A form with no status row is To do. Records loaded from the
  // old paper sheets (owner_user 'paper_import', see
  // scripts/push_intake_to_supabase.js) aren't app submissions and are left out.
  async function load() {
    if (!client) return t(L.noData);
    const [f, q] = await Promise.all([
      client.from('operations_forms').select('*').eq('status', 'submitted').in('station_key', METRC_STATIONS)
        .neq('owner_user', 'paper_import')
        .order('submitted_at', { ascending: true }).limit(5000),
      client.from('metrc_queue').select('*').limit(10000)
    ]);
    if (f.error) { console.error('metrc forms', f.error); return t(L.noData); }
    if (q.error) { console.error('metrc_queue', q.error); return /does not exist|schema cache/i.test(q.error.message || '') ? t(L.noTable) : t(L.noData); }
    forms = f.data || [];
    queue = new Map((q.data || []).map((r) => [r.form_id, r]));
    return null;
  }
  const loadErr = await load();
  if (loadErr) { board.innerHTML = `<div class="empty">${esc(loadErr)}</div>`; return; }
  // Incoming transfers needs the forms (Wet Intakes), so it starts here.
  loadIncoming();
  setInterval(renderIncoming, 5 * 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - incomingAt > 10 * 60000) loadIncoming(); });

  const stationOf = (r) => STATION_BY_KEY[r.station_key];
  const statusOf = (r) => (queue.get(r.id) || {}).status || 'todo';
  const val = (r, k) => (r.fields || {})[k];
  const uids = (r) => val(r, 'sourceUid') || [...new Set((val(r, 'lines') || []).map((x) => x.sourceUid).filter(Boolean))].join(', ');
  // The station's new Metrc package tags (`metrcTags` in
  // operations_stations.js — Hand Trim's, one per output): the outputs this
  // form actually made, plus any already tagged. A tag with `when` is only
  // asked for when it says so (Bucking's, on a lot held as bucked flower).
  const tagDefs = (r) => ((stationOf(r) || {}).metrcTags || [])
    .filter((x) => val(r, x.k) || (Number(val(r, x.from)) > 0.005 && (!x.when || x.when(r.fields || {}))));
  const newTags = (r) => tagDefs(r).map((x) => val(r, x.k)).filter(Boolean);
  const weightState = (r) => weightCheckState(stationOf(r), r.fields);
  const weightBlocked = (r) => { const w = weightState(r); return !!w && w !== 'confirmed'; };
  // A sign-off label, in its count wording for checkKind 'count' stations.
  const wL = (r, k) => (stationOf(r) || {}).checkKind === 'count' ? L[k + 'C'] : L[k];
  const weightPill = (r) => {
    const w = weightState(r);
    if (!w) return '';
    return w === 'confirmed' ? `<span class="pill wok">✓ ${t(wL(r, 'wOk'))}</span>` : `<span class="pill wwait">${t(wL(r, w === 'changed' ? 'wChanged' : 'wWait'))}</span>`;
  };
  const fmtDate = (d) => d ? new Date(`${d}T12:00:00`).toLocaleDateString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  const fmtWhen = (ts) => ts ? new Date(ts).toLocaleString(getLang() === 'es' ? 'es-MX' : 'en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';

  // A stored value as people read it: select codes become their label,
  // numbers get formatted, blanks become —.
  function display(f, v) {
    if (v === undefined || v === null || v === '') return '—';
    if (f.t === 'select') {
      if (f.refConst === 'BIOMASS') return BIOMASS[v] ? t(BIOMASS[v]) : String(v);
      const opts = f.ref ? refOptions(reference, f.ref) : (f.opts || []).map((o) => ({ v: o.v, label: t(o.l) }));
      const hit = opts.find((o) => String(o.v) === String(v));
      return hit ? hit.label : String(v);
    }
    // Pre-Roll's crew check: the people on the run, by name.
    if (f.t === 'crewcheck') {
      const on = [...crewLatest(Array.isArray(v) ? v : []).values()].filter((x) => x.status === 'here' || x.status === 'added');
      return [...new Set(on.map((x) => x.name))].join(', ') || '—';
    }
    if (f.t === 'check') return v === true || v === 'true' ? (getLang() === 'es' ? 'Sí' : 'Yes') : 'No';
    if (f.t === 'number' || f.t === 'calc') return Number.isFinite(Number(v)) ? fmtNum(v, f.dp === undefined ? 2 : f.dp) : String(v);
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }
  // What a click copies: the stored code (license number, not its label)
  // and plain numbers, so it pastes straight into Metrc.
  function copyText(f, v) {
    if (v === undefined || v === null || v === '') return '';
    if (f.t === 'check' || typeof v === 'object') return display(f, v);
    if ((f.t === 'number' || f.t === 'calc') && Number.isFinite(Number(v))) return String(Number(Number(v).toFixed(f.dp === undefined ? 2 : f.dp)));
    return String(v);
  }
  function headline(r) {
    const s = stationOf(r);
    const k = s && s.headline;
    if (!k) return '';
    const f = s.fields.find((x) => x.k === k);
    const v = val(r, k);
    if (v === undefined || v === null || v === '') return '';
    return (f ? display(f, v) : String(v)) + (/Lb$/.test(k) ? ' lb' : '');
  }
  // The form's photos (manifest, scale, ID…) that were actually uploaded, as
  // { label, url } — every photo field on the station, so new ones show up too.
  // upload-operations-photo.js stores a site path (/data/operations/uploads/…);
  // older or hand-entered ones may be full links.
  const isUrl = (v) => typeof v === 'string' && /^(https?:\/\/|\/(?!\/))/.test(v);
  const photosOf = (r) => (stationOf(r) ? stationOf(r).fields : [])
    .filter((f) => f.t === 'photo' && (!f.showIf || f.showIf(r.fields || {})) && isUrl(val(r, f.k)))
    .map((f) => ({ label: t(f.l), url: val(r, f.k) }));
  // Pre-Roll's Brand · Pack Type, as labels ('' when neither is filled in).
  const productOf = (r) => ['brand', 'packType'].map((k) => {
    const f = (stationOf(r) ? stationOf(r).fields : []).find((x) => x.k === k);
    return f && val(r, k) ? display(f, val(r, k)) : '';
  }).filter(Boolean).join(' · ');
  const daysWaiting = (r) => r.submitted_at ? Math.floor((Date.now() - new Date(r.submitted_at).getTime()) / 86400000) : null;

  // ── Needs form ─────────────────────────────────────────────────────────────
  // Adobe's outgoing manifests of raw material or pre-rolls made in Metrc with no Product Transfer
  // — Outgoing form for them (MetrcTransfers.outgoingNeedingForm). Not
  // metrc_queue rows: each goes away by itself once its form is submitted
  // (matched by Manifest # or package UID). Its link opens a new form filled
  // in from the transfer (ops_form.html's ?set_<field>= link prefill).
  const editAccess = (() => { try { return JSON.parse(sessionStorage.getItem('2cw_ops_edit_access') || 'null'); } catch (_) { return null; } })();
  const canFillTransfer = !editAccess || editAccess === 'all' || (Array.isArray(editAccess) && editAccess.includes('transfer_out'));
  const outFormOf = (r) => ({
    id: r.id, manifest: val(r, 'manifestNo'),
    uids: (val(r, 'lines') || []).flatMap((x) => [x.sourceUid, x.transferUid]).filter(Boolean)
  });
  function needsForm() {
    if (!incoming) return [];
    const outForms = forms.filter((r) => r.station_key === 'transfer_out').map(outFormOf);
    return MetrcTransfers.outgoingNeedingForm(incoming.transfers, incoming.facilities, outForms, incoming.inventory);
  }
  // A submitted Product Transfer — Outgoing's manifest in Canix (or null):
  // where its license, sales order and initiated / accepted come from, since
  // the floor form doesn't ask for them.
  let outgoingAll = null, outgoingFor = null;
  function canixOut(r) {
    if (!incoming || r.station_key !== 'transfer_out') return null;
    if (outgoingFor !== incoming) { outgoingAll = MetrcTransfers.outgoingTransfers(incoming.transfers, incoming.facilities, incoming.inventory); outgoingFor = incoming; }
    return MetrcTransfers.transferForForm(outFormOf(r), outgoingAll);
  }
  // The "From Metrc" box on an outgoing transfer's record.
  function canixOutHtml(r) {
    if (r.station_key !== 'transfer_out' || !incoming) return '';
    const x = canixOut(r);
    if (!x) return `<div class="st-box"><div class="st-hd">${t(L.cxHd)}</div><div class="muted-note">${t(L.cxNone)}</div></div>`;
    const cust = customerOf(x);
    const row = (l, v, copy) => `<div class="d-row"><div class="k">${esc(t(l))}</div><div class="v ${copy && v ? 'copyable' : ''}" ${copy && v ? `data-copy="${esc(v)}"` : ''}>${esc(v || '—')}</div></div>`;
    const pill = `<span class="pill ${x.status === 'accepted' ? 'done' : x.status === 'rejected' ? 'not_needed' : 'sync'}">${t(L[x.status])}</span>`;
    return `<div class="st-box"><div class="st-hd">${t(L.cxHd)}${canixAt ? ` <span class="muted-note">· ${esc(fmtAt(canixAt))}</span>` : ''}</div>
      ${row(L.colManifest, x.manifest, true)}
      ${row(L.cxLicense, x.toLicense, true)}
      ${row(L.cxCust, x.customer || cust.CustomerName, true)}
      ${row(L.cxDest, cust.Address, true)}
      ${row(L.cxSo, x.salesOrderNo, true)}
      ${row(L.cxLeft, x.departure ? fmtWhen(x.departure) : '')}
      ${row(L.cxPkgs, `${x.packages.length} · ${[x.weightLb ? `${fmtNum(x.weightLb, 2)} lb` : '', x.pieces ? `${fmtNum(x.pieces, 0)} ${t(L.pcs)}` : ''].filter(Boolean).join(' · ')}`)}
      <div class="d-row"><div class="k">${t(L.cxInit)}</div><div class="v">✓</div></div>
      <div class="d-row"><div class="k">${t(L.cxAcc)}</div><div class="v">${pill}</div></div>
    </div>`;
  }
  // A Canix strain as the Strain Library spells it, when it's there.
  const strainOpts = refOptions(reference, 'strains');
  const libStrain = (name) => {
    const w = String(name || '').trim().toLowerCase();
    const hit = w && strainOpts.find((o) => String(o.v).toLowerCase() === w || String(o.label).toLowerCase() === w);
    return hit ? hit.v : (name || '');
  };
  const customerOf = (x) => (incoming && incoming.customers || []).find((c) => c && c.LicenseNum && c.LicenseNum === x.toLicense) || {};
  function nfHref(x) {
    const p = new URLSearchParams({ station: 'transfer_out' });
    const set = (k, v) => { if (v !== undefined && v !== null && v !== '') p.set(`set_${k}`, v); };
    const cust = customerOf(x);
    set('customer', x.customer || cust.CustomerName);
    set('dccLicense', x.toLicense);
    set('destination', cust.Address);
    set('salesOrderNo', x.salesOrderNo);
    set('manifestNo', x.manifest);
    set('actualDate', x.date);
    set('ckManifestInitiated', 'true');
    if (x.accepted) set('ckManifestAccepted', 'true');
    set('lines', JSON.stringify(x.packages.map((pk) => ({ productType: pk.productType, strain: libStrain(pk.strain), sourceUid: pk.source || pk.tag, transferUid: pk.source ? pk.tag : '', weight: pk.qty }))));
    return `/ops_form.html?${p}`;
  }
  function nfMatches(x) {
    if (!(mode === 'open' || mode === 'needs_form' || mode === 'all')) return false;
    if (stationFilter && stationFilter !== 'transfer_out') return false;
    if (!query) return true;
    const cust = customerOf(x);
    return [x.manifest, x.fromName, x.toLicense, x.customer, cust.CustomerName, ...x.tags, ...x.strains, ...x.packages.map((p) => p.item), t(L.needs_form)]
      .join(' ').toLowerCase().includes(query);
  }
  function nfRowHtml(x) {
    const cust = customerOf(x);
    const days = x.departure ? Math.floor((Date.now() - x.departure) / 86400000) : null;
    const to = x.customer || cust.CustomerName || '';
    return `<tr class="needs_form" data-nf="${esc(x.manifest)}">
      <td><span class="pill needs_form">${t(L.needs_form)}</span>${canFillTransfer ? `<div><a class="nf-go" href="${esc(nfHref(x))}">${t(L.nfGo)}</a></div>` : ''}</td>
      <td class="form-name">${esc(t(STATION_BY_KEY.transfer_out.title))}<div class="sub-line">${t(L.nfSub)}</div></td>
      <td class="mono">${esc(fmtDate(x.date))}</td>
      <td class="strain">${esc(x.strains.join(', ') || '—')}</td>
      <td class="mono uid" title="${esc(x.tags.join('\n'))}">${esc(x.tags.join(', '))}</td>
      <td class="mono"><div class="mf-cell"><span>${esc(x.manifest)}</span><button type="button" class="copy-mini" data-copy="${esc(x.manifest)}">${t(L.copyBtn)}</button></div></td>
      <td>—</td>
      <td>—</td>
      <td class="num">${[x.weightLb ? `${fmtNum(x.weightLb, 2)} lb` : '', x.pieces ? `${fmtNum(x.pieces, 0)} ${t(L.pcs)}` : ''].filter(Boolean).join(' · ')}</td>
      <td>${esc(String(x.fromName).split(':')[0])}</td>
      <td class="mono">${days !== null ? `<span class="age ${days >= 2 ? 'old' : ''}">${days}d</span>` : '—'}</td>
      <td class="note" title="${esc(to)}">${t(L.nfTo)} ${esc(to ? `${to} · ` : '')}<span class="mono">${esc(x.toLicense)}</span></td>
      <td class="mono">—</td>
    </tr>`;
  }

  // ── Counts + filters ───────────────────────────────────────────────────────
  let mode = 'open', stationFilter = '', query = '';
  const countsEl = document.getElementById('counts');
  function renderCounts() {
    const n = (s) => forms.filter((r) => (!stationFilter || r.station_key === stationFilter) && statusOf(r) === s).length;
    const nf = !stationFilter || stationFilter === 'transfer_out' ? needsForm().length : 0;
    countsEl.innerHTML = (nf || mode === 'needs_form' ? [['needs_form', nf]] : []).concat(STATUSES.map((s) => [s, n(s)])).map(([s, c]) =>
      `<button type="button" class="count ${s} ${mode === s ? 'on' : ''}" data-k="${s}"><div class="n">${c}</div><div class="l">${t(L[s])}</div></button>`).join('');
    countsEl.querySelectorAll('.count').forEach((b) => { b.onclick = () => setMode(b.dataset.k); });
  }
  const filtersEl = document.getElementById('filters');
  const MODES = [['open', L.open], ['needs_form', L.needs_form], ['todo', L.todo], ['in_progress', L.in_progress], ['done', L.done], ['not_needed', L.not_needed], ['all', L.all]];
  filtersEl.innerHTML = MODES.map(([k, l]) => `<button type="button" data-k="${k}">${t(l)}</button>`).join('') +
    `<select id="st" style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.6rem .9rem;min-height:44px;font:inherit">
       <option value="">${esc(t(L.allForms))}</option>
       ${METRC_STATIONS.map((k) => `<option value="${k}">${esc(t(STATION_BY_KEY[k].title))}</option>`).join('')}
     </select>` +
    `<input type="search" id="q" placeholder="${esc(t(L.search))}">`;
  filtersEl.querySelectorAll('button').forEach((b) => { b.onclick = () => setMode(b.dataset.k); });
  document.getElementById('st').onchange = (e) => { stationFilter = e.target.value; render(); };
  document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });
  function setMode(k) { mode = k; render(); }

  function matches(r) {
    if (mode === 'needs_form') return false;
    const s = statusOf(r);
    if (mode === 'open' && !(s === 'todo' || s === 'in_progress')) return false;
    if (STATUSES.includes(mode) && s !== mode) return false;
    if (stationFilter && r.station_key !== stationFilter) return false;
    if (!query) return true;
    const q = queue.get(r.id) || {};
    const hay = [r.strain, val(r, 'strain'), uids(r), val(r, 'newFinishedUid'), val(r, 'newPrerollUid'), val(r, 'newPouchUid'), val(r, 'newWasteUid'), ...newTags(r),
      productOf(r), val(r, 'incomingUid'), val(r, 'manifestNo'), val(r, 'completedBy'), r.owner_user, q.note, q.updated_by, t(stationOf(r).title)].join(' ').toLowerCase();
    return hay.includes(query);
  }

  // Status picked in a row's dropdown but not saved yet, by form id — kept
  // across redraws (live updates, filters) until Save.
  const pending = new Map();

  function render() {
    if (incoming) renderIncoming();
    filtersEl.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.k === mode));
    renderCounts();
    let list = forms.filter(matches);
    // Open work is a queue: oldest first. Finished work: newest first.
    if (!(mode === 'open' || mode === 'todo' || mode === 'in_progress')) list = list.slice().reverse();
    // Manifests still needing their form go on top.
    const nfList = needsForm().filter(nfMatches);
    const total = list.length + nfList.length;
    document.getElementById('sub').textContent = `${total} ${total === 1 ? t(L.form) : t(L.forms)}${canEdit ? '' : ' · ' + t(L.viewOnly)}`;
    if (!total) { board.innerHTML = `<div class="empty">${esc(t(mode === 'open' ? L.emptyOpen : L.empty))}</div>`; return; }
    board.innerHTML = `<div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>${t(L.colStatus)}</th><th>${t(L.colForm)}</th><th>${t(L.colDate)}</th><th>${t(L.colStrain)}</th>
        <th>UID</th><th>${t(L.colManifest)}</th><th>${t(L.colPhoto)}</th><th>${t(L.colNewUid)}</th><th class="num">${t(L.colAmount)}</th><th>${t(L.colBy)}</th>
        <th>${t(L.colWait)}</th><th>${t(L.colNote)}</th><th>${t(L.colUpd)}</th>
      </tr></thead>
      <tbody>${nfList.map(nfRowHtml).join('')}${list.map(rowHtml).join('')}</tbody></table></div>`;
    board.querySelectorAll('tbody tr').forEach((tr) => {
      // A Needs form row opens the form, filled in from the Metrc transfer.
      if (tr.dataset.nf !== undefined) {
        const go = tr.querySelector('.nf-go');
        tr.onclick = (e) => { if (go && !e.target.closest('.copy-mini, .nf-go')) location.href = go.href; };
        if (!go) tr.style.cursor = 'default';
      }
      const id = tr.dataset.id;
      // The status dropdown and Save don't open the form; the rest of the row does.
      if (id) tr.onclick = (e) => { if (!e.target.closest('.st-cell, .row-err, .copy-mini, .photo-mini')) openDetail(id); };
      const ph = tr.querySelector('.photo-mini');
      if (ph) ph.onclick = () => openPhotos(photosOf(forms.find((x) => x.id === id)));
      const cp = tr.querySelector('.copy-mini');
      if (cp) cp.onclick = async () => {
        if (!(await writeClipboard(cp.dataset.copy))) return;
        cp.classList.add('ok'); cp.textContent = t(L.copyDone);
        setTimeout(() => { cp.classList.remove('ok'); cp.textContent = t(L.copyBtn); }, 1200);
      };
      const sel = tr.querySelector('.st-sel'), btn = tr.querySelector('.row-save');
      if (!sel || !id) return;
      sel.onchange = () => {
        const r = forms.find((x) => x.id === id);
        if (sel.value === statusOf(r)) pending.delete(id); else pending.set(id, sel.value);
        sel.className = `st-sel ${sel.value}`;
        tr.classList.toggle('dirty', pending.has(id));
        btn.disabled = !pending.has(id);
        btn.classList.remove('ok'); btn.textContent = t(L.save);
        const err = tr.querySelector('.row-err'); if (err) err.remove();
      };
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = t(L.saving);
        try {
          await saveStatus(id, sel.value);
          pending.delete(id);
          render();
          // Still in this filter (it may have left it — Done under Open)? Show it saved.
          const again = board.querySelector(`tr[data-id="${id}"] .row-save`);
          if (again) { again.classList.add('ok'); again.textContent = t(L.saved); }
        } catch (ex) {
          btn.disabled = false; btn.textContent = t(L.save);
          let err = tr.querySelector('.row-err');
          if (!err) { err = document.createElement('div'); err.className = 'row-err'; btn.parentNode.after(err); }
          err.textContent = `${t(L.saveFail)} ${ex.message}`;
        }
      };
    });
  }

  function rowHtml(r) {
    const s = statusOf(r), q = queue.get(r.id) || {}, days = daysWaiting(r), open = s === 'todo' || s === 'in_progress';
    const picked = pending.get(r.id) || s;
    const newUid = [...new Set([...newTags(r), val(r, 'newFinishedUid'), val(r, 'newPrerollUid'), val(r, 'newPouchUid')].filter(Boolean))].join(', ');
    const untagged = tagDefs(r).filter((x) => !val(r, x.k)).length;
    // Wet Intake's, or an outgoing transfer's (typed, else from Canix).
    const cx = canixOut(r);
    const manifest = String(val(r, 'manifestNo') || (cx && cx.manifest) || '').trim();
    const photos = photosOf(r);
    const statusCell = canEdit
      ? `<div class="st-cell"><select class="st-sel ${picked}" aria-label="${esc(t(L.colStatus))}">${STATUSES.map((k) =>
          `<option value="${k}" ${k === picked ? 'selected' : ''} ${k === 'done' && weightBlocked(r) && k !== s ? 'disabled' : ''}>${t(L[k])}</option>`).join('')}</select>
         <button type="button" class="row-save" ${pending.has(r.id) ? '' : 'disabled'}>${t(L.save)}</button></div>`
      : `<span class="pill ${s}">${t(L[s])}</span>`;
    return `<tr class="${s} ${pending.has(r.id) ? 'dirty' : ''}" data-id="${r.id}">
      <td>${statusCell}</td>
      <td class="form-name">${esc(t(stationOf(r).title))}${productOf(r) ? `<div class="sub-line">${esc(productOf(r))}</div>` : ''}${cx ? `<div class="sub-line">${esc(val(r, 'customer') || cx.customer || cx.toLicense)} · ${t(L[cx.status])}</div>` : ''}${weightPill(r) ? `<div class="sub-line">${weightPill(r)}</div>` : ''}</td>
      <td class="mono">${esc(fmtDate(r.work_date))}</td>
      <td class="strain">${esc(r.strain || val(r, 'strain') || '—')}</td>
      <td class="mono uid" title="${esc(uids(r))}">${esc(uids(r) || '—')}</td>
      <td class="mono">${manifest ? `<div class="mf-cell"><span>${esc(manifest)}</span><button type="button" class="copy-mini" data-copy="${esc(manifest)}">${t(L.copyBtn)}</button></div>`
        : awaitingCanix(r) ? `<span class="pill sync">${t(L.syncWait)}</span>`
        : canixNoManifest(r) ? `<span class="pill sync">${t(L.noManifest)}</span>` : '—'}</td>
      <td>${photos.length ? `<button type="button" class="copy-mini photo-mini">${t(L.photoBtn)}${photos.length > 1 ? ` (${photos.length})` : ''}</button>` : '—'}</td>
      <td class="mono uid" title="${esc(newUid)}">${esc(newUid || '—')}${newUid && untagged ? ` <span class="muted-note">+${untagged} ${t(L.tagsMissing)}</span>` : ''}</td>
      <td class="num">${esc(headline(r) || '—')}</td>
      <td>${esc(val(r, 'completedBy') || r.owner_user || '—')}</td>
      <td class="mono">${open && days !== null ? `<span class="age ${days >= 2 ? 'old' : ''}">${days}d</span>` : '—'}</td>
      <td class="note" title="${esc(q.note || '')}">${esc(q.note || '')}</td>
      <td class="mono">${q.updated_by ? `${esc(q.updated_by)} · ${esc(fmtWhen(q.updated_at))}` : '—'}</td>
    </tr>`;
  }

  // Saves a form's status — and its note, when one is passed; otherwise the
  // note stays — through metrc-queue.js, which checks edit access from the PIN.
  // New package tags ({field: uid}), when passed, go onto the form record.
  async function saveStatus(id, status, note, tags) {
    const res = await fetch('/.netlify/functions/metrc-queue', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: sessionStorage.getItem('2cw_pin') || '', id, status, note, tags })
    });
    const out = await res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` }));
    if (!out.ok) throw new Error(out.error || `HTTP ${res.status}`);
    queue.set(id, out.row);
    const rec = forms.find((x) => x.id === id);
    if (rec && out.fields) rec.fields = out.fields;
    return out.row;
  }

  // ── Detail sheet ───────────────────────────────────────────────────────────
  const bg = document.getElementById('detail-bg');
  const detail = document.getElementById('detail');
  bg.addEventListener('click', (e) => { if (e.target === bg) closeDetail(); });
  document.addEventListener('keydown', (e) => {
    if (phBg.classList.contains('on')) {
      if (e.key === 'Escape') closePhotos();
      else if (e.key === 'ArrowLeft') stepPhoto(-1);
      else if (e.key === 'ArrowRight') stepPhoto(1);
      return;
    }
    if (e.key === 'Escape') closeDetail();
  });
  let openId = null;

  // A table's columns that only help fill the form in (the transfer's batch picker).
  const shownCols = (f) => f.cols.filter((c) => !c.formOnly);
  function fieldHtml(f, r) {
    if (f.showIf && !f.showIf(r.fields || {})) return '';
    // Office-only fields (`editOnly`) left blank — an outgoing transfer's
    // license, orders and checklist come from Canix in the box above.
    if (f.editOnly && (f.t === 'heading' || [undefined, null, '', false, 'false'].includes(val(r, f.k)))) return '';
    const v = f.projectPicker && val(r, f.k) ? val(r, 'projectName') || val(r, f.k) : val(r, f.k);
    if (f.t === 'lineitems') {
      const items = Array.isArray(v) ? v : [];
      if (!items.length) return `<div class="d-row"><div class="k">${esc(t(f.l))}</div><div class="v">—</div></div>`;
      return `<div class="d-row" style="grid-template-columns:1fr"><div class="k">${esc(t(f.l))}</div>
        <div style="overflow-x:auto"><table class="d-table"><thead><tr>${shownCols(f).map((c) => `<th>${esc(t(c.l))}</th>`).join('')}</tr></thead>
        <tbody>${items.map((it) => `<tr>${shownCols(f).map((c) => `<td>${esc(display(c, it[c.k]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    }
    if (f.t === 'photo') {
      return `<div class="d-row"><div class="k">${esc(t(f.l))}</div><div class="v">${isUrl(v) ? `<button type="button" class="d-photo-btn" data-k="${esc(f.k)}"><img class="d-photo" src="${esc(v)}" alt=""></button>` : '—'}</div></div>`;
    }
    const c = copyText(f, v);
    return `<div class="d-row ${f.t === 'calc' ? 'hl' : ''}"><div class="k">${esc(t(f.l))}</div><div class="v ${c ? 'copyable' : ''}" ${c ? `data-copy="${esc(c)}"` : ''}>${esc(display(f, v))}</div></div>`;
  }

  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) { /* fall back below */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    return ok;
  }

  // One line per output that gets its own Metrc tag: its pounds, and the
  // tag (an input with Edit access).
  function tagsHtml(r) {
    const defs = tagDefs(r);
    if (!defs.length) return '';
    const lb = (x) => Number(val(r, x.from)) > 0 ? `${fmtNum(val(r, x.from), 2)} lb` : '';
    return `<div class="tag-box"><div class="tag-hd">${t(L.tagsHd)}</div>
      ${canEdit ? `<div class="muted-note">${t(L.tagsHint)}</div>` : ''}
      ${defs.map((x) => `<div class="tag-row"><div class="tl">${esc(t(x.l))}<small>${esc(lb(x))}</small></div>${canEdit
        ? `<input type="text" data-tag="${esc(x.k)}" value="${esc(val(r, x.k) || '')}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${esc(t(L.noTag))}" ${weightBlocked(r) ? 'disabled' : ''}>`
        : `<div class="tv ${val(r, x.k) ? '' : 'none'}">${esc(val(r, x.k) || t(L.noTag))}</div>`}</div>`).join('')}
    </div>`;
  }

  // The weight sign-off box (stations with `weightCheck`): the weights, and
  // Confirm weights for managers, or who confirmed them and when.
  function weightHtml(r) {
    const w = weightState(r);
    if (!w) return '';
    const st = stationOf(r), count = st.checkKind === 'count';
    // Older runs were signed on the form (verifiedBy / verifiedDate).
    const c = val(r, 'weightsConfirmed') || (count && val(r, 'verifiedBy') ? { by: val(r, 'verifiedBy'), date: val(r, 'verifiedDate') } : {});
    const fieldOf = (k) => st.fields.find((x) => x.k === k);
    // Count fields carry their unit in the label ("Total Waste (grams)").
    const lbs = st.weightCheck.filter((k, i) => Number(val(r, k)) > 0 || i === 0)
      .map((k) => { const f = fieldOf(k);
        return `<span>${esc(f ? t(f.l) : k)}: <b>${esc(fmtNum(val(r, k), count ? (f && f.dp != null ? f.dp : 0) : 2))}${count ? '' : ' lb'}</b></span>`; }).join('');
    return `<div class="w-box ${w === 'confirmed' ? 'ok' : ''}"><div class="st-hd">${t(wL(r, 'wHd'))} ${weightPill(r)}</div>
      <div class="w-lbs">${lbs}</div>
      ${w === 'confirmed' ? `<div class="muted-note">${t(wL(r, 'wBy'))} ${esc(c.by || '—')} · ${esc(c.at ? fmtWhen(c.at) : fmtDate(c.date))}</div>`
        : `<div class="muted-note">${t(wL(r, 'wFirst'))}</div>${canConfirm ? `<div><button type="button" class="btn btn-blue" id="w-confirm">${t(wL(r, 'wBtn'))}</button> <span class="st-msg" id="w-msg"></span></div>` : ''}`}
    </div>`;
  }

  function statusHtml(r) {
    const q = queue.get(r.id) || {}, s = statusOf(r);
    if (!canEdit) {
      return `${weightHtml(r)}<div class="st-box"><div class="st-hd">${t(L.status)}</div>
        <div class="st-view"><span class="pill ${s}">${t(L[s])}</span>${q.updated_by ? ` · ${esc(q.updated_by)} · ${esc(fmtWhen(q.updated_at))}` : ''}
        <div style="margin-top:8px">${q.note ? esc(q.note) : `<span class="muted-note">${t(L.noNote)}</span>`}</div></div>${tagsHtml(r)}</div>`;
    }
    return `${weightHtml(r)}<div class="st-box"><div class="st-hd">${t(L.status)}</div>
      <div class="st-btns">${STATUSES.map((k) => `<button type="button" class="${k} ${k === s ? 'on' : ''}" data-s="${k}" ${k === 'done' && k !== s && weightBlocked(r) ? 'disabled' : ''}>${t(L[k])}</button>`).join('')}</div>
      ${tagsHtml(r)}
      <textarea id="st-note" maxlength="1000" placeholder="${esc(t(L.note))}">${esc(q.note || '')}</textarea>
      <div class="st-save"><button type="button" class="btn btn-blue" id="st-save">${t(L.save)}</button><span class="st-msg" id="st-msg"></span></div>
    </div>`;
  }

  // A history entry's tag changes, "Smalls: 1A4…" — blank means cleared.
  function tagLog(r, tags) {
    const defs = (stationOf(r) || {}).metrcTags || [];
    return Object.entries(tags).map(([k, v]) => {
      const d = defs.find((x) => x.k === k);
      return `${esc(d ? t(d.l) : k)}: ${esc(v || '—')}`;
    }).join(' · ');
  }

  function logHtml(r) {
    const log = (queue.get(r.id) || {}).log || [];
    const items = log.slice().reverse().map((h) =>
      `<li><span class="pill ${esc(h.status)}">${t(L[h.status] || { en: h.status })}</span> <b>${esc(h.by || '—')}</b> · ${esc(fmtWhen(h.at))}${h.note ? `<div style="margin-top:3px">${esc(h.note)}</div>` : ''}${h.tags ? `<div class="tags">${tagLog(r, h.tags)}</div>` : ''}${h.weights ? `<div class="tags">✓ ${t(wL(r, 'wLog'))}</div>` : ''}</li>`);
    return `<div class="d-section"><div class="d-section-hd">${t(L.log)}</div>${
      items.length ? `<ul class="hist">${items.join('')}</ul>` : `<div class="muted-note">${t(L.logNone)}</div>`}</div>`;
  }

  function wireStatus(r) {
    const conf = document.getElementById('w-confirm');
    if (conf) conf.onclick = async () => {
      const msg = document.getElementById('w-msg');
      conf.disabled = true; msg.className = 'st-msg'; msg.textContent = t(L.saving);
      try {
        const res = await fetch('/.netlify/functions/metrc-queue', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: sessionStorage.getItem('2cw_pin') || '', id: r.id, action: 'confirm_weights' })
        });
        const out = await res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` }));
        if (!out.ok) throw new Error(out.error || `HTTP ${res.status}`);
        queue.set(r.id, out.row);
        r.fields = out.fields;
        render();
        openDetail(r.id);
      } catch (ex) {
        msg.className = 'st-msg err'; msg.textContent = `${t(L.saveFail)} ${ex.message}`;
        conf.disabled = false;
      }
    };
    const save = document.getElementById('st-save');
    if (!save) return;
    let picked = statusOf(r);
    detail.querySelectorAll('.st-btns button').forEach((b) => {
      b.onclick = () => { picked = b.dataset.s; detail.querySelectorAll('.st-btns button').forEach((x) => x.classList.toggle('on', x === b)); };
    });
    const msg = document.getElementById('st-msg');
    save.onclick = async () => {
      save.disabled = true; msg.className = 'st-msg'; msg.textContent = t(L.saving);
      try {
        const inputs = [...detail.querySelectorAll('.tag-row input[data-tag]')];
        const tags = inputs.length ? Object.fromEntries(inputs.map((i) => [i.dataset.tag, i.value.trim()])) : undefined;
        await saveStatus(r.id, picked, document.getElementById('st-note').value, tags);
        pending.delete(r.id);
        render();
        openDetail(r.id);
        const m = document.getElementById('st-msg');
        if (m) m.textContent = t(L.saved);
      } catch (ex) {
        msg.className = 'st-msg err'; msg.textContent = `${t(L.saveFail)} ${ex.message}`;
        save.disabled = false;
      }
    };
  }

  function openDetail(id) {
    const r = forms.find((x) => x.id === id);
    if (!r) return;
    openId = id;
    const url = new URL(location.href); url.searchParams.set('id', id); history.replaceState(null, '', url);
    const s = stationOf(r), f = r.fields || {};
    const fix = canFixSubmitted(r.station_key)
      ? `<a class="btn" href="/ops_form.html?station=${r.station_key}&edit=${r.id}">${t(L.editForm)}</a>` : '';
    detail.innerHTML = `
      <div class="d-top">
        <div><div class="row-station">${esc(t(s.title))} · ${esc(fmtDate(r.work_date))}</div><div class="d-title">${esc(r.strain || f.strain || '—')}</div></div>
        <div class="d-actions">${fix}<button type="button" class="btn" id="d-close">${t(L.close)}</button></div>
      </div>
      <div class="d-sub">${t(L.submitted)} ${r.submitted_at ? esc(new Date(r.submitted_at).toLocaleString()) : ''} ${r.owner_user ? t(L.by) + ' ' + esc(r.owner_user) : ''}</div>
      ${statusHtml(r)}
      <div class="muted-note" style="margin-bottom:6px">${t(L.copyHint)}</div>
      ${canixOutHtml(r)}
      ${s.fields.map((fd) => fieldHtml(fd, r)).join('')}
      ${logHtml(r)}`;
    document.getElementById('d-close').onclick = closeDetail;
    detail.querySelectorAll('.v.copyable').forEach((el) => {
      el.onclick = async () => {
        if (!(await writeClipboard(el.dataset.copy))) return;
        const was = el.textContent;
        el.textContent = t(L.copied); el.classList.add('copied');
        setTimeout(() => { el.textContent = was; el.classList.remove('copied'); }, 900);
      };
    });
    detail.querySelectorAll('.d-photo-btn').forEach((b) => {
      b.onclick = () => { const list = photosOf(r); openPhotos(list, Math.max(0, list.findIndex((p) => p.url === val(r, b.dataset.k)))); };
    });
    wireStatus(r);
    bg.classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    if (!bg.classList.contains('on')) return;
    openId = null;
    bg.classList.remove('on');
    document.body.style.overflow = '';
    const url = new URL(location.href); url.searchParams.delete('id'); history.replaceState(null, '', url);
  }

  // ── Photo viewer ───────────────────────────────────────────────────────────
  // A form's photos, one at a time, over everything else; ← → between them.
  const phBg = document.getElementById('ph-bg'), phImg = document.getElementById('ph-img');
  document.getElementById('ph-close').textContent = t(L.close);
  document.getElementById('ph-tab').textContent = t(L.photoTab);
  document.getElementById('ph-close').onclick = closePhotos;
  document.getElementById('ph-prev').onclick = () => stepPhoto(-1);
  document.getElementById('ph-next').onclick = () => stepPhoto(1);
  phBg.addEventListener('click', (e) => { if (e.target === phBg) closePhotos(); });
  let phList = [], phAt = 0;

  function openPhotos(list, at = 0) {
    if (!list || !list.length) return;
    phList = list; phAt = at;
    document.getElementById('ph-nav').style.display = list.length > 1 ? '' : 'none';
    showPhoto();
    phBg.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function showPhoto() {
    const p = phList[phAt];
    phImg.src = p.url;
    document.getElementById('ph-cap').textContent = p.label;
    document.getElementById('ph-tab').href = p.url;
    document.getElementById('ph-n').textContent = `${phAt + 1} / ${phList.length}`;
  }
  function stepPhoto(d) {
    if (phList.length < 2) return;
    phAt = (phAt + d + phList.length) % phList.length;
    showPhoto();
  }
  function closePhotos() {
    phBg.classList.remove('on');
    phImg.removeAttribute('src');
    // The detail sheet may still be open underneath; keep the page locked if so.
    if (!bg.classList.contains('on')) document.body.style.overflow = '';
  }

  // ── Live updates ───────────────────────────────────────────────────────────
  // New submissions and other people's status changes show up without a
  // reload. The open detail sheet isn't redrawn (it may have a note being
  // typed); its card behind it is.
  let reloadTimer = null;
  const reloadSoon = () => {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(async () => { if (!(await load())) render(); }, 800);
  };
  client.channel('metrc_queue_page')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'metrc_queue' }, reloadSoon)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'operations_forms' }, (p) => {
      const row = p.new || p.old || {};
      if (!row.station_key || METRC_STATIONS.includes(row.station_key)) reloadSoon();
    })
    .subscribe();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reloadSoon(); });

  render();
  const startId = new URLSearchParams(location.search).get('id');
  if (startId) openDetail(startId);
})();
</script>
<script src="/sw_register.js"></script>
</body>
</html>
