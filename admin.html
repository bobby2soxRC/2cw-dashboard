<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>User Admin — 2CW</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0c0d0f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c0d0f;--surface:#13151a;--surface2:#181b21;--border:#1e2129;--border2:rgba(255,255,255,.11);
    --green:#3db87a;--gold:#d4a843;--blue:#5a9fd4;--purple:#9b7fd4;--red:#ef5350;
    --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.35;pointer-events:none;z-index:0}
  a{color:inherit}
  .hdr{min-height:calc(54px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:20}
  .hdr-back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtext);text-decoration:none;white-space:nowrap}
  .hdr-div{width:1px;height:18px;background:var(--border)}
  .hdr-brand{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);flex:1}
  .hdr-signout{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--muted);padding:.4rem .8rem;border-radius:6px;cursor:pointer}
  .hdr-signout:hover{border-color:var(--red);color:var(--red)}

  main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 16px 80px}

  /* login gate */
  #gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  .gate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:380px}
  .gate-title{font-size:1.2rem;font-weight:700;margin-bottom:.3rem}
  .gate-hint{color:var(--subtext);font-size:.85rem;margin-bottom:1.75rem;line-height:1.5}
  .field-label{display:block;font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem}
  input[type=password],input[type=text],input[type=tel]{width:100%;background:#0c0d0f;border:1px solid var(--border);color:var(--text);padding:.7rem .85rem;border-radius:8px;font-size:1rem;font-family:'DM Mono',monospace;outline:none}
  input:focus{border-color:var(--gold)}
  .btn{padding:.7rem 1.1rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:transparent;color:var(--text)}
  .btn-gold{background:var(--gold);color:#000;border-color:var(--gold)}
  .btn-gold:hover{opacity:.88}
  .btn-green{background:var(--green);color:#000;border-color:var(--green)}
  .btn-green:hover{opacity:.88}
  .btn-ghost{color:var(--subtext)}
  .btn-ghost:hover{border-color:var(--muted);color:var(--text)}
  .btn-danger{color:var(--red);border-color:rgba(239,83,80,.35)}
  .btn-danger:hover{border-color:var(--red)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--red);font-size:.82rem;margin-top:.9rem;display:none;font-family:'DM Mono',monospace}
  .gate-btn-row{margin-top:1.5rem}
  .gate-btn-row .btn{width:100%}

  /* panel */
  #panel{display:none}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .toolbar h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.03em}
  .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
  .status-line{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--subtext);margin-bottom:16px;min-height:1.2em}

  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;font-size:.85rem;border-bottom:1px solid var(--border)}
  th{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
  tr:last-child td{border-bottom:none}
  tr.inactive{opacity:.45}
  .pill{display:inline-block;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--subtext);margin:2px 4px 2px 0}
  .row-actions{display:flex;gap:6px}
  .row-actions button{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--subtext);padding:.3rem .6rem;border-radius:6px;cursor:pointer}
  .row-actions button:hover{border-color:var(--gold);color:var(--gold)}

  /* editor overlay */
  #editor-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:24px;overflow-y:auto}
  #editor{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:640px;margin:0 auto;padding:28px}
  #editor h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em;margin-bottom:18px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .section-hd{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--border)}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px}
  .check-item{display:flex;align-items:center;gap:8px;font-size:.82rem}
  .check-item input{width:16px;height:16px;flex-shrink:0}
  .dept-block{margin-bottom:14px}
  .dept-name{font-size:.72rem;color:var(--subtext);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .station-row{display:flex;align-items:center;gap:14px;font-size:.82rem;padding:4px 0}
  .station-row .station-title{flex:1}
  .station-row label{display:flex;align-items:center;gap:5px;color:var(--subtext);font-family:'DM Mono',monospace;font-size:.68rem;text-transform:uppercase}
  .editor-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
  .active-toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-top:2px}
  .import-log{font-family:'DM Mono',monospace;font-size:.72rem;line-height:1.7;max-height:220px;overflow-y:auto;background:#0c0d0f;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:12px}
  .empty-note{color:var(--subtext);font-size:.85rem;padding:24px;text-align:center}
</style>
</head>
<body>
<header class="hdr">
  <a class="hdr-back" href="/index.html">← Hub</a>
  <div class="hdr-div"></div>
  <div class="hdr-brand">User Admin</div>
  <button class="hdr-signout" id="signout-btn" style="display:none" onclick="signOut()">Sign Out</button>
</header>

<main>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-title">Admin access</div>
      <div class="gate-hint">Separate from staff PINs — this unlocks user management. Not full SSO; treat this PIN like a master key and share it only with whoever manages access.</div>
      <label class="field-label">Admin PIN</label>
      <input type="password" id="admin-pin" inputmode="numeric" autocomplete="off" placeholder="·······"/>
      <div class="gate-btn-row"><button class="btn btn-gold" onclick="doAdminLogin()">Unlock</button></div>
      <div class="err" id="gate-err"></div>
    </div>
  </div>

  <div id="panel">
    <div class="toolbar">
      <h1>Users</h1>
      <div class="toolbar-actions">
        <button class="btn btn-ghost" onclick="doImport()" id="import-btn">Import from Sheet</button>
        <button class="btn btn-green" onclick="openEditor(null)">+ Add User</button>
      </div>
    </div>
    <div class="status-line" id="status-line"></div>
    <div id="import-result"></div>
    <div id="table-wrap"></div>
  </div>
</main>

<div id="editor-backdrop">
  <div id="editor"></div>
</div>

<script src="/operations_stations.js"></script>
<script src="/ops_common.js"></script>
<script src="/hub_config.js"></script>
<script>
const ADMIN_ENDPOINT = '/.netlify/functions/admin';
const TOKEN_KEY = '2cw_admin_token';

// Cards toggled directly in the editor — everything in CARD_DEFS except the
// ones derived from other settings (production access derives production /
// production_dashboard / production_today; FORM_ACCESS_COLS derives
// field_forms).
const DERIVED_CARD_KEYS = ['production', 'production_dashboard', 'production_today', 'field_forms'];
const TOGGLE_CARDS = CARD_DEFS.filter(d => !DERIVED_CARD_KEYS.includes(d.key));

let users = [];
let editingId = null; // null = new user

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getToken(){ return sessionStorage.getItem(TOKEN_KEY); }

async function callAdmin(body){
  const res = await fetch(ADMIN_ENDPOINT, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  let j;
  try { j = await res.json(); } catch { j = { ok:false, error: 'Bad response (HTTP '+res.status+')' }; }
  if(!res.ok || !j.ok){
    if(res.status === 401 && body.action !== 'login'){
      sessionStorage.removeItem(TOKEN_KEY);
      showGate();
    }
    throw new Error(j.error || ('HTTP '+res.status));
  }
  return j;
}

async function doAdminLogin(){
  const pin = document.getElementById('admin-pin').value.trim();
  const err = document.getElementById('gate-err');
  err.style.display = 'none';
  if(!pin){ err.textContent = 'Enter the admin PIN.'; err.style.display = 'block'; return; }
  try{
    const j = await callAdmin({ action: 'login', pin });
    sessionStorage.setItem(TOKEN_KEY, j.token);
    await showPanel();
  }catch(e){
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

function signOut(){
  sessionStorage.removeItem(TOKEN_KEY);
  showGate();
}

function showGate(){
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('panel').style.display = 'none';
  document.getElementById('signout-btn').style.display = 'none';
  document.getElementById('editor-backdrop').style.display = 'none';
  document.getElementById('admin-pin').value = '';
  setTimeout(() => document.getElementById('admin-pin').focus(), 50);
}

async function showPanel(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('signout-btn').style.display = 'inline-block';
  await refreshUsers();
}

async function refreshUsers(){
  const status = document.getElementById('status-line');
  status.textContent = 'Loading users…';
  try{
    const j = await callAdmin({ action: 'list', token: getToken() });
    users = j.users || [];
    status.textContent = users.length + (users.length===1 ? ' user' : ' users') + ' · ' + users.filter(u=>u.active).length + ' active';
    renderTable();
  }catch(e){
    status.textContent = 'Could not load users: ' + e.message;
  }
}

function cardSummary(u){
  const cols = u.columns || {};
  const pills = [];
  TOGGLE_CARDS.forEach(def => {
    const col = CARD_SHEET_COLS[def.key] || def.key;
    if((cols[col]||'').toUpperCase()==='TRUE') pills.push(def.title);
  });
  const edit = (cols['production edit stations']||'').trim();
  const view = (cols['production view stations']||'').trim();
  if(edit) pills.push('Prod edit: ' + (edit.toLowerCase()==='all' ? 'all' : edit.split(',').length+' stations'));
  if(view) pills.push('Prod view: ' + (view.toLowerCase()==='all' ? 'all' : view.split(',').length+' stations'));
  const anyForm = Object.values(FORM_ACCESS_COLS).some(col => (cols[col]||'').toUpperCase()==='TRUE');
  if(anyForm) pills.push('Field forms');
  const comm = COMMISSION_COLS.filter(col => (cols[col]||'').toUpperCase()==='TRUE');
  if(comm.length) pills.push(comm.length===1 ? 'Commission: '+COMMISSION_REP_MAP[comm[0]] : 'Commission: all reps');
  return pills;
}

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  if(!users.length){
    wrap.innerHTML = '<div class="empty-note">No users yet. Add one, or use "Import from Sheet" to bring in the existing directory.</div>';
    return;
  }
  const sorted = [...users].sort((a,b) => (b.active - a.active) || a.name.localeCompare(b.name));
  wrap.innerHTML = `<table>
    <thead><tr><th>Name</th><th>PIN</th><th>Access</th><th></th></tr></thead>
    <tbody>
      ${sorted.map(u => `
        <tr class="${u.active ? '' : 'inactive'}">
          <td>${esc(u.name)}${u.active ? '' : ' <span class="pill">inactive</span>'}</td>
          <td>${esc(u.pin)}</td>
          <td>${cardSummary(u).map(p => `<span class="pill">${esc(p)}</span>`).join('') || '<span class="pill">no access</span>'}</td>
          <td><div class="row-actions">
            <button onclick="openEditor('${u.id}')">Edit</button>
            <button onclick="toggleActive('${u.id}', ${u.active})">${u.active ? 'Deactivate' : 'Reactivate'}</button>
          </div></td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

async function toggleActive(id, currentlyActive){
  try{
    await callAdmin({ action: currentlyActive ? 'deactivate' : 'reactivate', token: getToken(), id });
    await refreshUsers();
  }catch(e){
    alert('Could not update user: ' + e.message);
  }
}

// ── Editor ──────────────────────────────────────────────────────────────
function stationDepts(){
  const depts = [];
  OPERATIONS_STATIONS.forEach(s => {
    const name = t(s.dept);
    let g = depts.find(x => x.name === name);
    if(!g){ g = { name, stations: [] }; depts.push(g); }
    g.stations.push(s);
  });
  return depts;
}

function openEditor(id){
  editingId = id;
  const u = id ? users.find(x => x.id === id) : null;
  const cols = (u && u.columns) || {};
  const editList = (cols['production edit stations']||'').trim();
  const viewList = (cols['production view stations']||'').trim();
  const editAll = editList.toLowerCase()==='all';
  const viewAll = viewList.toLowerCase()==='all';
  const editSet = new Set(editAll ? [] : editList.split(',').map(s=>s.trim()).filter(Boolean));
  const viewSet = new Set(viewAll ? [] : viewList.split(',').map(s=>s.trim()).filter(Boolean));
  const commSet = new Set(COMMISSION_COLS.filter(col => (cols[col]||'').toUpperCase()==='TRUE'));

  document.getElementById('editor').innerHTML = `
    <h2>${u ? 'Edit User' : 'Add User'}</h2>
    <div class="form-row">
      <div><label class="field-label">Name</label><input type="text" id="ed-name" value="${esc(u?u.name:'')}"/></div>
      <div><label class="field-label">PIN</label><input type="tel" id="ed-pin" inputmode="numeric" value="${esc(u?u.pin:'')}"/></div>
    </div>
    <label class="active-toggle"><input type="checkbox" id="ed-active" ${(!u || u.active) ? 'checked' : ''}/> Active</label>

    <div class="section-hd">Dashboard cards</div>
    <div class="check-grid">
      ${TOGGLE_CARDS.map(def => {
        const col = CARD_SHEET_COLS[def.key] || def.key;
        const on = (cols[col]||'').toUpperCase()==='TRUE';
        return `<label class="check-item"><input type="checkbox" data-card="${col}" ${on?'checked':''}/> ${esc(def.title)}</label>`;
      }).join('')}
    </div>

    <div class="section-hd">Field forms</div>
    <div class="check-grid">
      ${Object.entries(FORM_ACCESS_COLS).map(([formKey, col]) => {
        const on = (cols[col]||'').toUpperCase()==='TRUE';
        const label = formKey.replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
        return `<label class="check-item"><input type="checkbox" data-form="${col}" ${on?'checked':''}/> ${esc(label)}</label>`;
      }).join('')}
    </div>

    <div class="section-hd">Commission access</div>
    <div class="check-grid">
      ${COMMISSION_COLS.map(col => `<label class="check-item"><input type="checkbox" data-comm="${col}" ${commSet.has(col)?'checked':''}/> ${esc(COMMISSION_REP_MAP[col])}</label>`).join('')}
    </div>

    <div class="section-hd">Processing — edit access</div>
    <label class="check-item" style="margin-bottom:10px"><input type="checkbox" id="ed-all" ${editAll?'checked':''}/> All stations</label>
    <div id="ed-station-list"></div>

    <div class="section-hd">Processing — view only (Today board)</div>
    <label class="check-item" style="margin-bottom:10px"><input type="checkbox" id="view-all" ${viewAll?'checked':''}/> All stations</label>
    <div id="view-station-list"></div>

    <div class="editor-actions">
      <button class="btn btn-ghost" onclick="closeEditor()">Cancel</button>
      <button class="btn btn-green" onclick="saveEditor()">Save</button>
    </div>
  `;

  const depts = stationDepts();
  const stationListHtml = (checkedSet, prefix) => depts.map(g => `
    <div class="dept-block">
      <div class="dept-name">${esc(g.name)}</div>
      ${g.stations.map(s => `<label class="check-item" style="padding:2px 0"><input type="checkbox" data-${prefix}-station="${s.key}" ${checkedSet.has(s.key)?'checked':''}/> ${esc(t(s.title))}</label>`).join('')}
    </div>`).join('');
  document.getElementById('ed-station-list').innerHTML = stationListHtml(editSet, 'edit');
  document.getElementById('view-station-list').innerHTML = stationListHtml(viewSet, 'view');

  const syncStationListDisabled = () => {
    const allOn = document.getElementById('ed-all').checked;
    document.getElementById('ed-station-list').querySelectorAll('input[type=checkbox]').forEach(cb => cb.disabled = allOn);
  };
  const syncViewListDisabled = () => {
    const allOn = document.getElementById('view-all').checked;
    document.getElementById('view-station-list').querySelectorAll('input[type=checkbox]').forEach(cb => cb.disabled = allOn);
  };
  document.getElementById('ed-all').addEventListener('change', syncStationListDisabled);
  document.getElementById('view-all').addEventListener('change', syncViewListDisabled);
  syncStationListDisabled();
  syncViewListDisabled();

  document.getElementById('editor-backdrop').style.display = 'block';
  document.getElementById('editor-backdrop').scrollTop = 0;
}

function closeEditor(){
  document.getElementById('editor-backdrop').style.display = 'none';
  editingId = null;
}

async function saveEditor(){
  const ed = document.getElementById('editor');
  const name = ed.querySelector('#ed-name').value.trim();
  const pin = ed.querySelector('#ed-pin').value.trim();
  if(!name || !/^\d{4,}$/.test(pin)){
    alert('Enter a name and a numeric PIN (4+ digits).');
    return;
  }
  const columns = {};
  ed.querySelectorAll('[data-card]').forEach(cb => { columns[cb.dataset.card] = cb.checked ? 'TRUE' : 'FALSE'; });
  ed.querySelectorAll('[data-form]').forEach(cb => { columns[cb.dataset.form] = cb.checked ? 'TRUE' : 'FALSE'; });
  ed.querySelectorAll('[data-comm]').forEach(cb => { columns[cb.dataset.comm] = cb.checked ? 'TRUE' : 'FALSE'; });

  const editAll = document.getElementById('ed-all').checked;
  const editStations = editAll ? 'all' : Array.from(ed.querySelectorAll('[data-edit-station]:checked')).map(cb => cb.dataset.editStation).join(',');
  columns['production edit stations'] = editStations;

  const viewAll = document.getElementById('view-all').checked;
  const viewStations = viewAll ? 'all' : Array.from(ed.querySelectorAll('[data-view-station]:checked')).map(cb => cb.dataset.viewStation).join(',');
  columns['production view stations'] = viewStations;

  const user = { id: editingId, name, pin, active: document.getElementById('ed-active').checked, columns };
  const btn = ed.querySelector('.btn-green');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    await callAdmin({ action: 'upsert', token: getToken(), user });
    closeEditor();
    await refreshUsers();
  }catch(e){
    alert('Could not save user: ' + e.message);
    btn.disabled = false; btn.textContent = 'Save';
  }
}

// ── Import from sheet ──────────────────────────────────────────────────
async function doImport(){
  const btn = document.getElementById('import-btn');
  const out = document.getElementById('import-result');
  if(!confirm('Import every user from the current Users sheet? Existing app_users with a matching name will be updated (PIN + access), not duplicated.')) return;
  btn.disabled = true; btn.textContent = 'Importing…';
  out.innerHTML = '';
  try{
    const res = await fetch(DIRECTORY_URL + '&t=' + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    if(!rows.length) throw new Error('Sheet returned no rows');
    const j = await callAdmin({ action: 'import', token: getToken(), rows });
    const ok = j.results.filter(r => r.ok).length;
    const fail = j.results.filter(r => !r.ok);
    out.innerHTML = `<div class="import-log">Imported ${ok}/${j.results.length} users.
      ${fail.length ? '<br>Failed: ' + fail.map(f => esc(f.name)+' — '+esc(f.error)).join('; ') : ''}</div>`;
    await refreshUsers();
  }catch(e){
    out.innerHTML = `<div class="import-log" style="color:var(--red)">Import failed: ${esc(e.message)}</div>`;
  }
  btn.disabled = false; btn.textContent = 'Import from Sheet';
}

document.getElementById('admin-pin').addEventListener('keydown', e => { if(e.key==='Enter') doAdminLogin(); });

(async function init(){
  if(getToken()){
    try{ await showPanel(); return; }catch{ /* fall through to gate */ }
  }
  showGate();
})();
</script>
</body>
</html>
