<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>2CW Operations Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2CW Ops">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0d0f;--surface:#13151a;--border:#1e2129;--border2:rgba(255,255,255,.11);
      --green:#3db87a;--green-dim:#1e6641;--green2:rgba(61,184,122,.12);
      --gold:#d4a843;--gold2:rgba(212,168,67,.12);
      --blue:#5a9fd4;--blue2:rgba(90,159,212,.12);
      --purple:#9b7fd4;--purple2:rgba(155,127,212,.12);
      --red:#ef5350;
      --mendo:#a78bfa;--mendo2:rgba(167,139,250,.12);--mendo-dim:#5a3a90;
      --text:#e8eaf0;--muted:#5a6070;--subtext:#9aa0b0;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.35;pointer-events:none;z-index:0}
    .orb{position:fixed;border-radius:50%;filter:blur(140px);opacity:.08;pointer-events:none;z-index:0}
    .orb1{width:700px;height:700px;background:var(--green);top:-250px;right:-200px}
    .orb2{width:500px;height:500px;background:var(--blue);bottom:-150px;left:-150px}

    /* ── LOGIN ── */
    #login-screen{position:relative;z-index:1;min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;padding-top:calc(2rem + env(safe-area-inset-top));padding-bottom:calc(2rem + env(safe-area-inset-bottom))}
    .login-logo{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:2.5rem;text-align:center}
    .login-wordmark{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,56px);letter-spacing:.06em;line-height:1;background:linear-gradient(135deg,#fff 30%,var(--muted) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:.4rem}
    .login-sub{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2.5rem}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:400px}
    .login-title{font-size:1.3rem;font-weight:700;margin-bottom:.25rem}
    .login-hint{color:var(--subtext);font-size:.85rem;margin-bottom:2rem}
    .form-label{display:block;font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}
    .pin-wrap{position:relative;margin-bottom:1.5rem}
    .pin-input{width:100%;background:#0c0d0f;border:1px solid var(--border);color:var(--text);padding:.85rem 1rem;border-radius:10px;font-size:1.5rem;font-family:'DM Mono',monospace;outline:none;transition:border-color .2s;letter-spacing:.5em;text-align:center}
    .pin-input:focus{border-color:var(--green)}
    .pin-dots{display:flex;gap:.5rem;justify-content:center;margin-top:.6rem}
    .pin-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .15s}
    .pin-dot.filled{background:var(--green)}
    .login-btn{width:100%;padding:.9rem;background:var(--green);color:#000;border:none;border-radius:10px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .2s;margin-top:.5rem}
    .login-btn:hover{opacity:.88}
    .login-err{color:var(--red);font-size:.82rem;margin-top:.75rem;text-align:center;display:none;font-family:'DM Mono',monospace}

    /* ── HUB ── */
    #hub-screen{display:none;position:relative;z-index:1;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:calc(48px + env(safe-area-inset-top)) 24px 48px}
    #hub-screen.visible{display:flex}
    .hub-topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(.75rem + env(safe-area-inset-top)) 1.5rem .75rem;background:rgba(12,13,15,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .hub-user{display:flex;align-items:center;gap:.6rem;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--subtext)}
    .user-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
    .logout-btn{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--muted);padding:.3rem .75rem;border-radius:6px;cursor:pointer;transition:all .2s}
    .logout-btn:hover{border-color:var(--red);color:var(--red)}
    .header{text-align:center;margin-bottom:48px;margin-top:32px;animation:fadeUp .5s ease both}
    .wordmark{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,5vw,64px);letter-spacing:.06em;line-height:1;background:linear-gradient(135deg,#fff 30%,var(--muted) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tagline{margin-top:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;width:100%;max-width:960px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 32px;animation:fadeUp .5s ease both;transition:border-color .25s,box-shadow .25s,transform .2s;cursor:pointer;text-decoration:none;display:block;color:inherit}
    .card:hover{transform:translateY(-2px)}
    .card.green:hover{border-color:var(--green);box-shadow:0 0 40px rgba(61,184,122,.1)}
    .card.gold:hover{border-color:var(--gold);box-shadow:0 0 40px rgba(212,168,67,.1)}
    .card.blue:hover{border-color:var(--blue);box-shadow:0 0 40px rgba(90,159,212,.1)}
    .card.purple:hover{border-color:var(--purple);box-shadow:0 0 40px rgba(155,127,212,.1)}
    .card.mendo:hover{border-color:var(--mendo);box-shadow:0 0 40px rgba(167,139,250,.15)}
    .card-dot{width:8px;height:8px;border-radius:50%;margin-bottom:16px;animation:pulse 2.5s ease-in-out infinite}
    .green .card-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
    .gold .card-dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
    .blue .card-dot{background:var(--blue);box-shadow:0 0 8px var(--blue)}
    .purple .card-dot{background:var(--purple);box-shadow:0 0 8px var(--purple)}
    .mendo .card-dot{background:var(--mendo);box-shadow:0 0 8px var(--mendo)}
    .card-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:5px}
    .green .card-label{color:var(--green-dim)}.gold .card-label{color:#8a6a22}.blue .card-label{color:#2a5a80}.purple .card-label{color:#5a3a90}.mendo .card-label{color:var(--mendo-dim)}
    .card-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.04em;line-height:1;margin-bottom:10px}
    .card-desc{font-size:13px;color:var(--subtext);line-height:1.6;margin-bottom:22px}
    .card-badge{display:inline-flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;border-radius:20px}
    .badge-open{background:var(--green2);color:var(--green);border:1px solid rgba(61,184,122,.25)}
    .badge-mendo{background:rgba(167,139,250,.15);color:var(--mendo);border:1px solid rgba(167,139,250,.3)}
    .footer{margin-top:44px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center;animation:fadeUp .5s .4s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

    /* loading state */
    .loading-msg{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:1rem}
  </style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- ── LOGIN SCREEN ── -->
<div id="login-screen">
  <div class="login-logo">2CW Enterprises</div>
  <div class="login-wordmark">Operations Hub</div>
  <div class="login-sub">Internal Dashboard Suite</div>
  <div class="login-card">
    <div class="login-title">Enter your PIN</div>
    <div class="login-hint">Your dashboard will load based on your access level.</div>
    <label class="form-label">PIN</label>
    <div class="pin-wrap">
      <input class="pin-input" id="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····"/>
      <div class="pin-dots">
        <div class="pin-dot" id="dot0"></div>
        <div class="pin-dot" id="dot1"></div>
        <div class="pin-dot" id="dot2"></div>
        <div class="pin-dot" id="dot3"></div>
      </div>
    </div>
    <button class="login-btn" onclick="doLogin()">Access Dashboard</button>
    <div class="login-err" id="login-err"></div>
    <div class="loading-msg" id="loading-msg" style="display:none">Loading directory…</div>
  </div>
</div>

<!-- ── HUB SCREEN ── -->
<div id="hub-screen">
  <div class="hub-topbar">
    <div class="hub-user"><div class="user-dot"></div><span id="user-label">—</span></div>
    <button class="logout-btn" onclick="doLogout()">Sign Out</button>
  </div>
  <div class="header">
    <div class="wordmark">2CW Operations</div>
    <div class="tagline">Internal Dashboard Suite</div>
  </div>
  <div class="grid" id="card-grid"></div>
  <footer class="footer">2CW Enterprises &nbsp;·&nbsp; Confidential &nbsp;·&nbsp; Not for Distribution</footer>
</div>

<script>
// ── MEMBER DIRECTORY CSV URL ──────────────────────────────
const DIRECTORY_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTvUb2y2US1Qcyf12mngWEcvdCU3Yh9vgIzN_5-6x1psQRCIkG9Y4velrdcBB9zEw/pub?gid=165442896&single=true&output=csv';

// ── CARD DEFINITIONS ─────────────────────────────────────
// key must match column headers in the sheet (lowercase, spaces→ as-is)
const CARD_DEFS = [
  {
    key: 'kss_dashboard',
    color: 'green',
    label: 'Sales',
    title: 'KSS Leaderboard',
    desc: 'KSS account performance, territory coverage, and sales activity across the distribution network.',
    href: '/kss_dashboard.html'
  },
  {
    key: 'twocw_dashboard',
    color: 'green',
    label: 'Sales',
    title: 'Sales Leaderboard',
    desc: 'Rep performance, account status, upsell opportunities, and coverage across all 2CW accounts.',
    href: '/twocw_dashboard.html'
  },
  {
    key: 'pipeline',
    color: 'blue',
    label: 'Production',
    title: 'Pipeline',
    desc: 'Live view of what\'s currently in production — by stage, brand, and strain. Updated from the production sheet.',
    href: '/pipeline.html'
  },
  {
    key: 'inventory',
    color: 'gold',
    label: 'Inventory',
    title: 'Inventory & Production',
    desc: 'Current inventory levels, days of supply, and production planning recommendations by product group.',
    href: '/inventory.html'
  },
  {
    key: 'sales',
    color: 'green',
    label: 'Sales',
    title: 'Sales Dashboard',
    desc: 'Monthly revenue by brand, MTD pacing and trajectory, product mix, and 12-month trend analysis.',
    href: '/sales.html'
  }
,
  {
    key: 'mendo',
    color: 'mendo',
    label: 'Partner',
    title: 'Mendo Dashboard',
    desc: 'Mendo brand sales performance, inventory levels, and production pipeline — dedicated partner view.',
    href: '/mendo.html'
  },
  {
    key: 'executive',
    color: 'purple',
    label: 'Executive',
    title: 'Executive Dashboard',
    desc: 'High-level sales pacing, inventory health, and rep leaderboards — the one-page view for leadership.',
    href: '/executive.html'
  }
  // Commission card is handled separately below
];

// Per-user override: force a specific card order on the hub screen for
// that person (matched against the "user" column, case-insensitive).
// Cards the user doesn't have access to are skipped automatically;
// any of their cards not listed here fall in after these, in default order.
const CARD_ORDER_OVERRIDES = {
  'ned': ['executive', 'sales', 'inventory', 'twocw_dashboard', 'kss_dashboard', 'pipeline', 'mendo']
};

// Commission columns in the sheet
const COMMISSION_COLS = ['commission niki','commission billy','commission john','commission jonathan','commission mac','commission emily'];
const COMMISSION_REP_MAP = {
  'commission niki': 'niki',
  'commission billy': 'billy',
  'commission john': 'john',
  'commission jonathan': 'jonathan',
  'commission mac': 'mac',
  'commission emily': 'emily'
};

// ── STATE ────────────────────────────────────────────────
let directory = null; // loaded from CSV
let currentUser = null;

// ── PIN INPUT DOTS ────────────────────────────────────────
document.getElementById('pin-input').addEventListener('input', function(){
  const v = this.value;
  for(let i = 0; i < 4; i++)
    document.getElementById('dot'+i).classList.toggle('filled', i < v.length);
  if(v.length === 4) doLogin();
});
document.getElementById('pin-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});

// ── PARSE CSV ────────────────────────────────────────────
function parseCSV(text){
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if(lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
  const users = [];
  for(let i = 1; i < lines.length; i++){
    const vals = lines[i].split(',').map(v => v.trim());
    if(!vals[0]) continue; // skip blank rows
    const row = {};
    headers.forEach((h, idx) => { row[h] = vals[idx] || ''; });
    users.push(row);
  }
  return users;
}

// ── LOAD DIRECTORY ────────────────────────────────────────
async function loadDirectory(){
  try {
    const res = await fetch(DIRECTORY_URL + '&t=' + Date.now());
    const text = await res.text();
    return parseCSV(text);
  } catch(e) {
    console.warn('Directory fetch failed, using fallback', e);
    return null;
  }
}

// ── LOGIN ────────────────────────────────────────────────
async function doLogin(){
  const pin = document.getElementById('pin-input').value;
  const err = document.getElementById('login-err');
  const loadMsg = document.getElementById('loading-msg');
  const btn = document.querySelector('.login-btn');

  if(pin.length < 4){
    err.style.display = 'block';
    err.textContent = 'Please enter your 4-digit PIN.';
    return;
  }

  err.style.display = 'none';
  btn.disabled = true;
  loadMsg.style.display = 'block';

  // Load directory if not cached
  if(!directory){
    directory = await loadDirectory();
  }

  loadMsg.style.display = 'none';
  btn.disabled = false;

  if(!directory){
    err.style.display = 'block';
    err.textContent = 'Could not load directory. Please check your connection.';
    return;
  }

  // Find matching user
  const user = directory.find(u => String(u.pin).padStart(4,'0') === String(pin).padStart(4,'0'));
  if(!user){
    err.style.display = 'block';
    err.textContent = 'Incorrect PIN. Please try again.';
    document.getElementById('pin-input').value = '';
    for(let i = 0; i < 4; i++) document.getElementById('dot'+i).classList.remove('filled');
    document.getElementById('pin-input').focus();
    return;
  }

  currentUser = user;
  sessionStorage.setItem('2cw_pin', pin);
  buildHub(user);
}

// ── BUILD HUB ────────────────────────────────────────────
function buildHub(user){
  const userName = user.user || 'User';

  // Top bar label
  document.getElementById('user-label').textContent = userName;

  // Build cards
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  let cardIdx = 0;

  // Standard cards (with per-user order override applied, if any)
  const orderOverride = CARD_ORDER_OVERRIDES[userName.trim().toLowerCase()];
  const orderedDefs = orderOverride
    ? [...CARD_DEFS].sort((a,b) => {
        const ai = orderOverride.indexOf(a.key), bi = orderOverride.indexOf(b.key);
        return (ai===-1 ? 999 : ai) - (bi===-1 ? 999 : bi);
      })
    : CARD_DEFS;
  orderedDefs.forEach(def => {
    const val = (user[def.key] || '').toUpperCase();
    if(val !== 'TRUE') return;
    grid.appendChild(makeCard(def, cardIdx++));
  });

  // Commission card logic
  const commTrue = COMMISSION_COLS.filter(col => (user[col] || '').toUpperCase() === 'TRUE');
  if(commTrue.length === 1){
    // Single rep — "My Commissions"
    const repKey = COMMISSION_REP_MAP[commTrue[0]];
    grid.appendChild(makeCommCard('My Commissions', `/commission.html?rep=${repKey}`, cardIdx++));
  } else if(commTrue.length > 1){
    // Multi/admin — "Commissions" — pass ?rep=niki to bypass PIN screen (full admin view)
    grid.appendChild(makeCommCard('Commissions', '/commission.html?rep=niki', cardIdx++));
  }

  // Show hub
  document.getElementById('login-screen').style.display = 'none';
  const hub = document.getElementById('hub-screen');
  hub.classList.add('visible');
}

function makeCard(def, idx){
  const delays = ['.08s','.16s','.24s','.32s','.40s','.48s'];
  const badgeClass = def.color === 'mendo' ? 'badge-mendo' : 'badge-open';
  const a = document.createElement('a');
  a.className = `card ${def.color}`;
  a.href = def.href;
  a.style.animationDelay = delays[idx] || '.08s';
  a.innerHTML = `
    <div class="card-dot"></div>
    <div class="card-label">${def.label}</div>
    <div class="card-title">${def.title}</div>
    <div class="card-desc">${def.desc}</div>
    <span class="card-badge ${badgeClass}">● Live</span>
  `;
  return a;
}

function makeCommCard(title, href, idx){
  const delays = ['.08s','.16s','.24s','.32s','.40s','.48s'];
  const a = document.createElement('a');
  a.className = 'card purple';
  a.href = href;
  a.style.animationDelay = delays[idx] || '.08s';
  a.innerHTML = `
    <div class="card-dot"></div>
    <div class="card-label">Finance</div>
    <div class="card-title">${title}</div>
    <div class="card-desc">${title === 'My Commissions'
      ? 'Your commission report — select the accounts you worked to generate your pay period summary.'
      : 'Commission reports for all reps. Select rep and period to generate full summary.'}</div>
    <span class="card-badge badge-open">● Live</span>
  `;
  return a;
}

// ── LOGOUT ───────────────────────────────────────────────
function doLogout(){
  currentUser = null;
  sessionStorage.removeItem('2cw_pin');
  document.getElementById('pin-input').value = '';
  for(let i = 0; i < 4; i++) document.getElementById('dot'+i).classList.remove('filled');
  document.getElementById('login-err').style.display = 'none';
  document.getElementById('card-grid').innerHTML = '';
  document.getElementById('hub-screen').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  setTimeout(() => document.getElementById('pin-input').focus(), 100);
}

// Auto-login: if a valid PIN is already in sessionStorage, skip the login screen
window.addEventListener('load', async () => {
  const savedPin = sessionStorage.getItem('2cw_pin');
  if(savedPin){
    if(!directory) directory = await loadDirectory();
    if(directory){
      const user = directory.find(u => String(u.pin).padStart(4,'0') === String(savedPin).padStart(4,'0'));
      if(user){
        buildHub(user);
        return;
      }
    }
    // PIN no longer valid — clear it and fall through to login
    sessionStorage.removeItem('2cw_pin');
  }
  // Show login only after check completes (prevents flash when auto-login succeeds)
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pin-input').focus();
});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(err=>console.warn(err));
  });
}
</script>
</body>
</html>
